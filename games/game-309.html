<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明局打乱</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--ink:#eef1ff;--dim:#9aa3c7;--acc:#4fd1c5;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;}
.wrap{width:100%;max-width:430px;text-align:center;}
h1{font-size:22px;letter-spacing:3px;margin-bottom:6px;}
.tip{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:10px;}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;color:var(--dim);}
.bar b{color:var(--acc);font-size:15px;}
.btn{background:var(--acc);border:none;border-radius:8px;color:#08252b;font-family:inherit;font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;}
.btn.ghost{background:#2a3154;color:var(--ink);}
.frame{position:relative;width:100%;padding-top:100%;}
.board{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--card);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 1px #2c3560;touch-action:none;}
.board.ready .tile{transition:left .1s ease,top .1s ease;}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(145deg,#2b3257,#222848);color:var(--ink);font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 8px rgba(0,0,0,.28);}
.foot{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px;}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(7,9,20,.8);display:none;align-items:center;justify-content:center;z-index:20;}
.overlay.show{display:flex;}
.panel{background:var(--card);border:1px solid #2c3560;border-radius:16px;padding:28px 32px;text-align:center;max-width:86vw;box-shadow:0 16px 50px rgba(0,0,0,.55);}
.panel h2{color:var(--acc);font-size:24px;letter-spacing:2px;margin-bottom:10px;}
.panel p{color:var(--dim);font-size:14px;line-height:1.9;margin-bottom:18px;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <h1>明局打乱</h1>
  <p class="tip">可解证明局:开局从复原态出发,把每一步打乱动画完整播放给你看——棋盘必然可解,因为每一刀你都亲眼所见。</p>
  <div class="bar">
    <span>阶段 <b id="stPhase">打乱回放</b></span>
    <span>步数 <b id="stMoves">0</b></span>
    <span>归位 <b id="stFit">0/15</b></span>
    <button class="btn ghost" id="skipBtn">跳过动画</button>
    <button class="btn ghost" id="resetBtn">重开</button>
  </div>
  <div class="frame"><div class="board" id="board"></div></div>
  <p class="foot">打乱动画期间不能操作;回放结束后点击方块、方向键或触屏滑动复原。步数少于打乱步数即为高手。</p>
</div>
<div class="overlay" id="overlay"><div class="panel">
  <h2 id="ovTitle"></h2>
  <p id="ovInfo"></p>
  <button class="btn" id="againBtn">再来一局</button>
</div></div>
<script>
(function(){
'use strict';
const N=4,TOTAL=N*N,K=28,STEP=140;
const goal=[];for(let i=0;i<TOTAL;i++)goal.push((i+1)%TOTAL);
let tiles=goal.slice(),els=[],moves=0,startAt=0,phase='idle',replayI=0,lastCell=-1,lastStep=0,rafId=0;
const boardEl=document.getElementById('board');
const phaseEl=document.getElementById('stPhase'),movesEl=document.getElementById('stMoves'),fitEl=document.getElementById('stFit');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovInfo=document.getElementById('ovInfo');
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s;}
function buildTiles(){boardEl.innerHTML='';boardEl.classList.remove('ready');els=[];for(let v=1;v<TOTAL;v++){const el=document.createElement('div');el.className='tile';el.textContent=v;el.dataset.v=v;el.style.width=(100/N)+'%';el.style.height=(100/N)+'%';boardEl.appendChild(el);els[v]=el;}}
function setPos(v,idx){const r=(idx/N)|0,c=idx%N;els[v].style.left=(c*100/N)+'%';els[v].style.top=(r*100/N)+'%';}
function placeAll(){for(let i=0;i<TOTAL;i++)if(tiles[i])setPos(tiles[i],i);}
function blankIdx(){return tiles.indexOf(0);}
function slide(idx){const b=blankIdx(),br=(b/N)|0,bc=b%N,r=(idx/N)|0,c=idx%N;if(Math.abs(br-r)+Math.abs(bc-c)!==1)return false;tiles[b]=tiles[idx];tiles[idx]=0;setPos(tiles[b],b);return true;}
function moveDir(dx,dy){const b=blankIdx(),br=(b/N)|0,bc=b%N,tr=br-dy,tc=bc-dx;if(tr<0||tr>=N||tc<0||tc>=N)return false;return slide(tr*N+tc);}
function isSolved(){for(let i=0;i<TOTAL;i++)if(tiles[i]!==goal[i])return false;return true;}
function countFit(){let k=0;for(let i=0;i<TOTAL;i++)if(tiles[i]&&tiles[i]===goal[i])k++;return k+'/'+(TOTAL-1);}
function hud(){movesEl.textContent=moves;fitEl.textContent=countFit();}
function scrambleStep(){
  const b=blankIdx(),br=(b/N)|0,bc=b%N;
  const opts=[];
  if(br>0)opts.push(b-N);if(br<N-1)opts.push(b+N);if(bc>0)opts.push(b-1);if(bc<N-1)opts.push(b+1);
  const cands=opts.filter(function(x){return x!==lastCell;});
  const pick=cands[(Math.random()*cands.length)|0];
  slide(pick);lastCell=pick;
}
function startPlay(){
  let guard=0;
  while(isSolved()&&guard<10){scrambleStep();guard++;}
  phase='play';startAt=Date.now();
  phaseEl.textContent='复原进行中';
  moves=0;hud();
}
function replayLoop(now){
  if(phase!=='replay')return;
  if(!lastStep)lastStep=now;
  if(now-lastStep>=STEP){
    lastStep=now;
    scrambleStep();replayI++;
    phaseEl.textContent='打乱回放 '+replayI+'/'+K;
    if(replayI>=K){startPlay();return;}
  }
  rafId=requestAnimationFrame(replayLoop);
}
function afterMove(){moves++;hud();if(isSolved())finish();}
function finish(){
  phase='end';cancelAnimationFrame(rafId);
  const sec=(Date.now()-startAt)/1000;
  const note=moves<=K?'你的步数没有超过打乱步数,高手!':'比打乱多用了一些步,继续打磨路线。';
  ovTitle.textContent='复原成功';
  ovInfo.textContent='你的步数 '+moves+' · 打乱步数 '+K+'\n用时 '+fmt(sec)+'\n'+note;
  overlay.classList.add('show');
}
function playerMove(idx){if(phase!=='play')return;if(slide(idx))afterMove();}
boardEl.addEventListener('click',function(ev){const t=ev.target.closest('.tile');if(!t)return;const v=parseInt(t.dataset.v,10);playerMove(tiles.indexOf(v));});
document.addEventListener('keydown',function(ev){const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};const d=map[ev.key];if(!d)return;ev.preventDefault();if(phase!=='play')return;if(moveDir(d[0],d[1]))afterMove();});
let tX=0,tY=0;
boardEl.addEventListener('touchstart',function(ev){const t=ev.changedTouches[0];tX=t.clientX;tY=t.clientY;},{passive:true});
boardEl.addEventListener('touchend',function(ev){if(phase!=='play')return;const t=ev.changedTouches[0];const dx=t.clientX-tX,dy=t.clientY-tY;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;ev.preventDefault();if(Math.abs(dx)>Math.abs(dy)){if(moveDir(dx>0?1:-1,0))afterMove();}else{if(moveDir(0,dy>0?1:-1))afterMove();}},{passive:false});
function fit(){const w=boardEl.clientWidth;if(w)boardEl.style.fontSize=Math.max(14,Math.min(42,w/N*0.42))+'px';}
function newGame(){
  overlay.classList.remove('show');cancelAnimationFrame(rafId);
  tiles=goal.slice();buildTiles();placeAll();
  moves=0;replayI=0;lastCell=-1;lastStep=0;phase='replay';
  phaseEl.textContent='打乱回放 0/'+K;hud();
  requestAnimationFrame(function(){fit();boardEl.classList.add('ready');});
  rafId=requestAnimationFrame(replayLoop);
}
document.getElementById('skipBtn').addEventListener('click',function(){
  if(phase!=='replay')return;
  while(replayI<K){scrambleStep();replayI++;}
  startPlay();
});
document.getElementById('resetBtn').addEventListener('click',newGame);
document.getElementById('againBtn').addEventListener('click',newGame);
window.addEventListener('resize',fit);
newGame();
})();
</script>
</body>
</html>

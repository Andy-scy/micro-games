<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹跳词弹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:760px}
canvas{display:block;width:100%;background:#151a30;border-radius:14px}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#b18cff}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
button{background:#7c9cff;color:#10142a;border:0;border-radius:10px;padding:10px 24px;font-size:16px;font-family:inherit;cursor:pointer}
button:hover{background:#9ab1ff}
</style>
</head>
<body>
<h1>弹跳词弹</h1>
<div id="tip">失控的单词炸弹在场地里四处弹跳：在引信烧完前完整打出即可拆除；引信到点会爆炸</div>
<div id="hud"></div>
<div id="wrap">
<canvas id="cv" width="760" height="470"></canvas>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<button id="ovBtn">开始游戏</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var WORDS=["ping","pong","dash","jump","coil","bolt","echo","flux","gear","hub","iris","jolt","knot","loop","mesh","node","orbit","pulsar","quark","radar","sonar","turbine","vortex","watt","xenon","yoke","zinc","arc","bounce","circuit","dynamo","engine","flywheel","gravity","impact","kinetics","lever","momentum","nucleus","pendulum"];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var wrap=document.getElementById('wrap'),hud=document.getElementById('hud');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),btn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var FUSE=12,MAXW=4;
var words,buffer,target,score,lives,kills,spawnT,elapsed,shake,running,raf,tPrev,parts;
function fit(){var w=wrap.clientWidth||640;cv.width=w;cv.height=Math.max(340,Math.min(500,Math.round(w*0.6)));}
window.addEventListener('resize',fit);
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hudUpd(){hud.textContent='得分 '+score+'　生命 '+lives+'　拆除 '+kills+'　在场 '+words.length+'/'+MAXW;}
function reset(){words=[];buffer='';target=-1;score=0;lives=3;kills=0;spawnT=0.4;elapsed=0;shake=0;parts=[];hudUpd();}
function spawn(){
  var t=pick(WORDS);
  for(var k=0;k<words.length;k++){if(words[k].text===t)return;}
  var ang=rnd(0,Math.PI*2),sp=rnd(64,104);
  words.push({
    text:t,x:rnd(80,cv.width-140),y:rnd(60,cv.height-120),
    vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
    fuse:FUSE
  });
}
function boom(x,y,col,n){for(var i=0;i<(n||16);i++)parts.push({x:x,y:y,vx:rnd(-150,150),vy:rnd(-170,50),life:rnd(.3,.8),c:col});}
function defuse(i){
  var w=words[i];
  score+=w.text.length*10+Math.round(w.fuse*8);kills++;
  boom(w.x+24,w.y+12,'#b18cff');
  words.splice(i,1);
  if(target===i){target=-1;buffer='';}else if(target>i)target--;
  hudUpd();
}
function handleChar(ch){
  if(!running)return;
  if(ch==='\b')return;
  ch=ch.toLowerCase();
  if(!/^[a-z]$/.test(ch))return;
  var cand=-1;
  if(target>=0&&words[target]&&words[target].text.charAt(buffer.length)===ch)cand=target;
  if(cand<0){
    for(var i=0;i<words.length;i++){
      if(i!==target&&words[i].text.charAt(0)===ch){cand=i;break;}
    }
    if(cand>=0)buffer='';
  }
  if(cand<0){buffer='';target=-1;return;}
  target=cand;buffer+=ch;
  if(buffer===words[target].text)defuse(target);
}
function update(dt){
  elapsed+=dt;shake=Math.max(0,shake-dt*12);
  spawnT-=dt;
  if(spawnT<=0&&words.length<MAXW){spawn();spawnT=2.0;}
  for(var i=words.length-1;i>=0;i--){
    var w=words[i];
    w.x+=w.vx*dt;w.y+=w.vy*dt;
    w.fuse-=dt;
    var tw=w.text.length*13+26;
    if(w.x<4){w.x=4;w.vx=Math.abs(w.vx)*1.04;}
    if(w.x+tw>cv.width-4){w.x=cv.width-4-tw;w.vx=-Math.abs(w.vx)*1.04;}
    if(w.y<10){w.y=10;w.vy=Math.abs(w.vy)*1.04;}
    if(w.y>cv.height-44){w.y=cv.height-44;w.vy=-Math.abs(w.vy)*1.04;}
    var sp=Math.sqrt(w.vx*w.vx+w.vy*w.vy);
    if(sp>230){w.vx*=230/sp;w.vy*=230/sp;}
    if(w.fuse<=0){
      boom(w.x+30,w.y+12,'#ff6b6b',22);
      words.splice(i,1);
      if(target===i){target=-1;buffer='';}else if(target>i)target--;
      lives--;shake=8;hudUpd();
      if(lives<=0){end(false);return;}
    }
  }
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=330*dt;
    if(p.life<=0)parts.splice(j,1);
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  ctx.strokeStyle='rgba(177,140,255,.35)';ctx.lineWidth=2;
  ctx.strokeRect(2,2,cv.width-4,cv.height-4);
  ctx.font='bold 19px system-ui, sans-serif';
  for(var i=0;i<words.length;i++){
    var w=words[i],tw=w.text.length*13+26;
    var danger=w.fuse<4;
    ctx.fillStyle=danger?'rgba(255,107,107,.18)':'rgba(177,140,255,.14)';
    rr(w.x,w.y,tw,30,8);ctx.fill();
    if(i===target){ctx.strokeStyle='#ffd76a';ctx.lineWidth=2;rr(w.x,w.y,tw,30,8);ctx.stroke();}
    var done=(i===target)?buffer:'';
    var pre=w.text.slice(0,done.length);
    ctx.fillStyle='#ffd76a';ctx.fillText(pre,w.x+13,w.y+21);
    ctx.fillStyle=danger?'#ff8f8f':'#e8eaf6';
    ctx.fillText(w.text.slice(done.length),w.x+13+ctx.measureText(pre).width,w.y+21);
    var frac=Math.max(0,w.fuse/FUSE);
    ctx.strokeStyle=danger?'#ff6b6b':'#b18cff';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(w.x+tw/2,w.y-6,7,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);
    ctx.stroke();
  }
  for(var j=0;j<parts.length;j++){
    var p=parts[j];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
function end(win){
  running=false;
  ovT.textContent=win?'全场拆除':'连锁爆炸';
  ovX.textContent='得分 '+score+'\n拆除 '+kills+' 枚词弹　坚持 '+Math.round(elapsed)+' 秒';
  btn.textContent='再来一局';
  ov.classList.remove('hide');
}
function start(){
  fit();reset();ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  wrap.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
bindTyping(handleChar);
btn.addEventListener('click',start);
fit();reset();
ovT.textContent='弹跳词弹';
ovX.textContent='每枚词弹在场地内斜线弹跳，每次碰撞还会加速。\n完整打出单词即可拆除并按剩余引信加分。\n12 秒引信烧完立即爆炸扣 1 生命，共 3 条命。';
btn.textContent='开始游戏';
})();
</script>
</body>
</html>

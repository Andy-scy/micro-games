<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪心链</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
#app{width:100%;max-width:520px}
h1{font-size:25px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:12px}
.card{background:#1a1f36;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 20px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
.btn.sec{background:#2a3154;color:#cdd6f4}
.btn:disabled{opacity:.35;cursor:default}
.die{position:relative;width:48px;height:48px;background:linear-gradient(145deg,#ffffff,#dfe3f2);border-radius:9px;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.die.tail{outline:3px solid #ffd166}
.pip{position:absolute;width:20%;height:20%;border-radius:50%;background:#22243c;transform:translate(-50%,-50%)}
.big{font-size:20px;font-weight:800;color:#ffd166}
.mut{color:#9aa3c0;font-size:13px}
.sc{flex:1;text-align:center;min-width:140px}
.nm{font-size:14px;color:#cdd6f4;margin-bottom:2px}
.log{font-size:13px;color:#9aa3c0;line-height:1.7;text-align:center;min-height:44px}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.85);display:none;align-items:center;justify-content:center;z-index:9}
#overlay.show{display:flex}
.ov{background:#1a1f36;border-radius:16px;padding:26px 30px;text-align:center;max-width:88vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:24px}
.ov p{color:#cdd6f4;margin-bottom:16px;line-height:1.8}
</style>
</head>
<body>
<div id="app">
  <h1>贪心链</h1>
  <p class="tips">与电脑各玩 8 回合。每回合连掷一颗骰子接上链条:<b>新骰 ≥ 链尾</b>才能续链,链条越长越值钱(落袋分 = 链上点数总和 + 链长×5);一旦掷出比链尾小的骰子,<b>链条当场断裂、分文不剩</b>!何时落袋,考验你的贪心。</p>
  <div class="row">
    <div class="card sc"><div class="nm">你(第 <b id="mr">1</b>/8 回合)</div><div class="big" id="t0">0</div></div>
    <div class="card sc"><div class="nm">电脑</div><div class="big" id="t1">0</div></div>
  </div>
  <div class="card" style="text-align:center">
    <div class="row" style="margin-bottom:8px"><div class="die" id="curdie"></div></div>
    <div class="mut" id="clabel">你的链条(亮起处为链尾)</div>
    <div class="row" id="chain" style="min-height:52px"></div>
    <div class="big" id="prev">落袋可得 0 分</div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="roll">继续掷</button>
      <button class="btn sec" id="bank">落袋锁定</button>
    </div>
  </div>
  <div class="card log" id="log">你先手,点「继续掷」开始铺链!</div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt"></h2><p id="ovp"></p><button class="btn" id="again">再来一局</button></div></div>
<script>
'use strict';
var TURNS=8;
var tot=[0,0],cnt=[0,0],chain=[],turn=0,busy=false,over=false;
function $(id){return document.getElementById(id)}
function rnd(){return 1+Math.floor(Math.random()*6)}
function setDie(el,v,hl){
  el.innerHTML='';
  var P={1:[[50,50]],2:[[27,27],[73,73]],3:[[27,27],[50,50],[73,73]],
    4:[[27,27],[73,27],[27,73],[73,73]],5:[[27,27],[73,27],[50,50],[27,73],[73,73]],
    6:[[27,26],[27,50],[27,74],[73,26],[73,50],[73,74]]};
  var arr=P[v]||[];
  for(var i=0;i<arr.length;i++){
    var s=document.createElement('span');s.className='pip';
    s.style.left=arr[i][0]+'%';s.style.top=arr[i][1]+'%';el.appendChild(s);
  }
  if(hl)el.classList.add('tail');else el.classList.remove('tail');
}
function chainSum(){var s=0;for(var i=0;i<chain.length;i++)s+=chain[i];return s}
function bankPts(){return chain.length===0?0:chainSum()+chain.length*5}
function draw(){
  var C=$('chain');C.innerHTML='';
  for(var i=0;i<chain.length;i++){
    var d=document.createElement('div');d.className='die';
    setDie(d,chain[i],i===chain.length-1);
    C.appendChild(d);
  }
  if(chain.length===0)C.innerHTML='<span class="mut">链条空空,掷出第一颗吧</span>';
  $('t0').textContent=tot[0];$('t1').textContent=tot[1];
  $('mr').textContent=Math.min(cnt[0]+1,TURNS);
  $('prev').textContent='落袋可得 '+bankPts()+' 分';
  $('clabel').textContent=(turn===0?'你的链条':'电脑的链条')+'(亮起处为链尾)';
  $('roll').disabled=busy||over||turn!==0;
  $('bank').disabled=busy||over||turn!==0||chain.length===0;
}
function say(m){$('log').textContent=m}
function anim(cb){
  busy=true;draw();
  var el=$('curdie');
  var t0=performance.now(),last=0;
  function step(t){
    if(t-t0<560){ if(t-last>70){last=t;setDie(el,rnd(),false)} requestAnimationFrame(step); }
    else{ var v=rnd();setDie(el,v,true);cb(v); }
  }
  requestAnimationFrame(step);
}
function endTurn(msg){
  cnt[turn]++;
  chain=[];
  if(cnt[0]>=TURNS&&cnt[1]>=TURNS){draw();finish();return}
  turn=1-turn;busy=(turn===1);draw();
  say(msg);
  if(turn===1)setTimeout(aiAct,850);
}
function aiAct(){
  if(over)return;
  anim(function(v){
    var top=chain.length?chain[chain.length-1]:0;
    if(chain.length===0||v>=top){
      chain.push(v);draw();
      if(chainSum()>=18||chain.length>=4){
        var p=bankPts();tot[1]+=p;
        endTurn('电脑落袋 '+p+' 分,总分 '+tot[1]+'。');
      }else setTimeout(aiAct,700);
    }else{
      endTurn('电脑掷出 '+v+',低于链尾 '+top+',链条断裂!');
    }
  });
}
function finish(){
  over=true;busy=true;draw();
  var t=tot[0]>tot[1]?'你赢啦!':tot[0]<tot[1]?'电脑获胜':'平分秋色';
  $('ovt').textContent=t;
  $('ovp').innerHTML='终局比分 — 你 <b>'+tot[0]+'</b> : 电脑 <b>'+tot[1]+'</b><br>贪心有度,链链生金!';
  $('overlay').classList.add('show');
}
$('roll').onclick=function(){
  if(busy||over||turn!==0)return;
  anim(function(v){
    var top=chain.length?chain[chain.length-1]:0;
    if(chain.length===0||v>=top){
      chain.push(v);busy=false;draw();
      say('掷出 '+v+',接上链尾!落袋还是继续?');
    }else{
      var lost=bankPts();
      endTurn('掷出 '+v+',低于链尾 '+top+',链条断裂,'+lost+' 分化为泡影!');
    }
  });
};
$('bank').onclick=function(){
  if(busy||over||turn!==0||chain.length===0)return;
  var p=bankPts();tot[0]+=p;
  endTurn('你落袋 '+p+' 分,总分 '+tot[0]+'。轮到电脑。');
};
$('again').onclick=function(){
  tot=[0,0];cnt=[0,0];chain=[];turn=0;busy=false;over=false;
  $('overlay').classList.remove('show');
  setDie($('curdie'),0,false);
  draw();say('新的对局,你先手,点「继续掷」!');
};
draw();
</script>
</body>
</html>

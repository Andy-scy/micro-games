<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>碎星裂变</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#f0a35e;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#f0a35e;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#f0a35e;color:#2a1607;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#f0a35e;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>碎星裂变</h1>
<p class="tip">←→↑↓/WASD 或按住拖动移动,空格 / 按住屏幕开火。巨石被击碎会分裂成小块,轰碎 12 颗巨型陨石即可获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">碎星裂变</h2>
<p id="ovX">一片陨石群正在裂解,巨石会不断分裂成更碎的小块,小心躲避并逐一击碎。</p>
<button id="btn">开始游戏</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>巨石<b id="hB">0/12</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hB=document.getElementById("hB"),hH=document.getElementById("hH");
var GOAL=12,R=[[14,1,10],[26,2,20],[44,4,30]];
var state="ready",score=0,hp=3,big=0,inv=0,cool=0,spawn=1;
var ship={x:W/2,y:H-90};
var bullets=[],rocks=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*20+6});}
function mkRock(x,y,size,vx,vy){
  var cfg=R[size-1],shape=[],k;
  for(k=0;k<9;k++)shape.push(0.72+Math.random()*0.36);
  rocks.push({x:x,y:y,vx:vx,vy:vy,size:size,r:cfg[0],hp:cfg[1],rot:Math.random()*6.283,vr:(Math.random()-0.5)*2,shape:shape,flash:0});
}
function reset(){
  score=0;hp=3;big=0;inv=0;cool=0;spawn=0.8;
  ship.x=W/2;ship.y=H-90;
  bullets=[];rocks=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"裂变带肃清":"战机坠毁";
  ovX.textContent="最终得分:"+score+(win?" · 12 颗巨石全部轰碎!":" · 被陨石群吞没了,再试一次。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function splitRock(r){
  score+=R[r.size-1][2];
  boom(r.x,r.y,10+r.size*4,"#f0a35e");
  if(r.size===3)big++;
  if(r.size>1){
    mkRock(r.x-8,r.y,r.size-1,-40-Math.random()*70,r.vy*0.75+Math.random()*40);
    mkRock(r.x+8,r.y,r.size-1,40+Math.random()*70,r.vy*0.75+Math.random()*40);
  }
}
function update(dt){
  inv-=dt;cool-=dt;spawn-=dt;
  var sp=280;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.5,Math.min(H-40,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0){
    cool=0.17;
    bullets.push({x:ship.x,y:ship.y-18});
  }
  if(spawn<=0&&rocks.length<9){
    spawn=Math.max(0.7,1.6-score*0.001);
    mkRock(60+Math.random()*(W-120),-60,3,(Math.random()-0.5)*90,60+Math.random()*70);
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    bullets[bi].y-=540*dt;
    if(bullets[bi].y<-20)bullets.splice(bi,1);
  }
  for(i=rocks.length-1;i>=0;i--){
    var r=rocks[i];
    r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;r.flash-=dt;
    if(r.x<-r.r)r.x=W+r.r;
    if(r.x>W+r.r)r.x=-r.r;
    if(r.y>H+r.r+40){rocks.splice(i,1);continue;}
    if(inv<=0&&Math.abs(r.x-ship.x)<r.r+12&&Math.abs(r.y-ship.y)<r.r+12){
      rocks.splice(i,1);boom(r.x,r.y,14,"#ff6b6b");
      hp--;inv=1.3;continue;
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=rocks.length-1;j>=0;j--){
      var rk=rocks[j];
      var dx=bl.x-rk.x,dy=bl.y-rk.y;
      if(dx*dx+dy*dy<rk.r*rk.r){
        bullets.splice(bi,1);
        rk.hp--;rk.flash=0.12;
        if(rk.hp<=0){
          splitRock(rk);
          rocks.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(big>=GOAL){score+=300;gameOver(true);}
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  for(i=0;i<rocks.length;i++){
    var r=rocks[i];
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
    ctx.beginPath();
    for(var k=0;k<9;k++){
      var a=k/9*6.283,rr=r.r*r.shape[k];
      if(k===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
      else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath();
    ctx.fillStyle=r.flash>0?"#ffffff":"#7d6b58";
    ctx.fill();
    ctx.strokeStyle="#4a3f34";ctx.lineWidth=3;ctx.stroke();
    if(r.size===3){ctx.fillStyle="#5a4d40";ctx.beginPath();ctx.arc(-8,4,7,0,6.283);ctx.fill();}
    ctx.restore();
  }
  ctx.fillStyle="#f0a35e";
  for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-2,bullets[i].y-10,4,14);
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#f0a35e";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;hB.textContent=big+"/"+GOAL;hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

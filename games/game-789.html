<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投其所好</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1220;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;user-select:none}
h1{font-size:21px;color:#7fd4ff;margin:2px 0}
.tip{font-size:13px;color:#9aa3b5;text-align:center;max-width:520px;line-height:1.6;margin-bottom:6px}
#hud{display:flex;gap:16px;font-size:15px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#hud b{color:#ffd75e}
canvas{border-radius:14px;max-width:96vw;touch-action:none;display:block}
#ov{position:fixed;inset:0;background:rgba(6,8,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:9}
#ov h2{font-size:26px;color:#ffd75e}
#ov p{color:#c8cfdd;font-size:15px;max-width:380px;line-height:1.8}
#ov button{background:linear-gradient(180deg,#5db8ff,#2f8fe0);color:#04101f;border:0;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<h1>投其所好</h1>
<p class="tip">鱼群轮流在各水层觅食(发光提示)。选对鱼饵对准鱼层,立刻咬钩;用错鱼饵只能干等 4 秒空竿。按 1/2/3 选饵,空格抛竿。</p>
<div id="hud"><span>得分 <b id="s1">0</b></span><span>时间 <b id="s2">70</b> 秒</span><span>目标 <b>400</b> 分</span></div>
<canvas id="cv" width="480" height="560"></canvas>
<div id="ov"><h2 id="ot">投其所好</h2><p id="op">飞蝇钓上层,面团钓中层,蚯蚓钓下层。<br>盯紧「鱼群在此!」的发光水层,换饵对层,<br>金色变体双倍计分。70 秒 400 分!</p><button id="ob">开始垂钓</button></div>
<script>
(function(){
var cv=document.getElementById('cv'),X=cv.getContext('2d');
var ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),ob=document.getElementById('ob');
var eS=document.getElementById('s1'),eT=document.getElementById('s2');
var W=cv.width,H=cv.height;
var lz=[
 {name:'上层',y0:110,y1:205,fish:[['白条',30],['青梢鱼',60]]},
 {name:'中层',y0:225,y1:320,fish:[['鳊鱼',70],['鲈鱼',100]]},
 {name:'下层',y0:340,y1:445,fish:[['黄颡鱼',50],['鲶鱼',120]]}];
var baits=[['飞蝇饵','钓上层'],['面团饵','钓中层'],['蚯蚓饵','钓下层']];
var state='ready',tl=70,score=0,msg='',notice='',nt=0;
var baitSel=0,active=0,at=8,phase='idle',pt=0,tWait=0,jump=null,jv=0,amb=[];
function rnd(a,b){return a+Math.random()*(b-a)}
function makeAmb(){
  amb=[];
  var i,k;
  for(i=0;i<3;i++)for(k=0;k<2;k++){
    amb.push({z:i,x:rnd(30,W-30),sp:rnd(20,45)*(k===0?1:-1),y:rnd(0,1)});
  }
}
function cast(){
  if(state!=='play'||phase!=='idle')return;
  phase='sink';pt=0;msg='';jump=null;
}
function finish(win){
  state='over';ob.textContent='再来一局';
  ot.textContent=win?'知己知彼!':'上鱼太慢…';
  op.innerHTML='本次得分 <b style="color:#ffd75e">'+score+'</b> / 目标 400 分<br>'+(win?'鱼儿的心思你全懂!':'饵不对层,鱼不理你——多看提示。');
  ov.classList.remove('hide');
}
function start(){
  tl=70;score=0;msg='';notice='';nt=0;baitSel=0;active=Math.floor(Math.random()*3);at=rnd(7,10);
  phase='idle';pt=0;jump=null;makeAmb();
  state='play';ov.classList.add('hide');
}
function update(dt){
  if(nt>0){nt-=dt;if(nt<=0)notice=''}
  if(jump){jump.t+=dt;if(jump.t>0.9)jump=null}
  var i;
  for(i=0;i<amb.length;i++){
    var a=amb[i];
    a.x+=a.sp*dt;
    if(a.x<20||a.x>W-20)a.sp*=-1;
  }
  if(state!=='play')return;
  tl-=dt;if(tl<=0){tl=0;finish(score>=400);return}
  at-=dt;
  if(at<=0){
    var prev=active;
    while(active===prev)active=Math.floor(Math.random()*3);
    at=rnd(7,10);notice='鱼群转移到'+lz[active].name+'了!';nt=1.5;
  }
  pt+=dt;
  if(phase==='sink'){
    if(pt>=0.4){phase='soak';pt=0;tWait=baitSel===active?rnd(0.7,1.3):rnd(4,5)}
  }else if(phase==='soak'){
    if(pt>=tWait){
      if(baitSel===active){
        var f=lz[baitSel].fish[Math.floor(Math.random()*2)],v=f[1],gold=Math.random()<0.12;
        if(gold)v*=2;
        score+=v;jump={t:0};jv=v;
        msg='钓到'+f[0]+(gold?'(金)!+':'!+')+v+' 分';
      }else{msg='饵不对层,鱼群不吃…空竿'}
      phase='up';pt=0;
    }
  }else if(phase==='up'){
    if(pt>=0.4)phase='idle';
  }
}
function draw(){
  var g=X.createLinearGradient(0,0,0,60);g.addColorStop(0,'#151c36');g.addColorStop(1,'#232a4d');
  X.fillStyle=g;X.fillRect(0,0,W,60);
  var g2=X.createLinearGradient(0,60,0,470);g2.addColorStop(0,'#1a4472');g2.addColorStop(1,'#081428');
  X.fillStyle=g2;X.fillRect(0,60,W,410);
  var i,k,t=Date.now()*0.001;
  for(i=0;i<3;i++){
    var z=lz[i],y0=z.y0;
    if(i===active){
      X.fillStyle='rgba(255,215,94,.10)';X.fillRect(0,y0,W,z.y1-y0);
      X.strokeStyle='rgba(255,215,94,.7)';X.lineWidth=2;X.strokeRect(4,y0+3,W-8,z.y1-y0-6);
    }
    X.fillStyle='rgba(200,215,235,.75)';X.font='13px system-ui';X.textAlign='left';
    X.fillText(z.name+' · '+z.fish[0][0]+' '+z.fish[0][1]+'分 / '+z.fish[1][0]+' '+z.fish[1][1]+'分',12,y0+20);
    for(k=0;k<amb.length;k++){
      if(amb[k].z!==i)continue;
      var fx=amb[k].x,fy=y0+55+amb[k].y*(z.y1-y0-80);
      X.fillStyle=i===active?'rgba(255,220,130,.75)':'rgba(140,190,240,.5)';
      X.beginPath();X.ellipse(fx,fy,11,5,0,0,7);X.fill();
      X.beginPath();X.moveTo(fx+(amb[k].sp>0?9:-9),fy);X.lineTo(fx+(amb[k].sp>0?17:-17),fy-4);X.lineTo(fx+(amb[k].sp>0?17:-17),fy+4);X.closePath();X.fill();
    }
    if(i===active){
      X.fillStyle='#ffd75e';X.font='bold 14px system-ui';X.textAlign='center';
      X.fillText('鱼群在此!',W/2,z.y1-12);
    }
    if(i<2){
      X.strokeStyle='rgba(127,212,255,.15)';X.setLineDash([6,8]);
      X.beginPath();X.moveTo(0,z.y1+10);X.lineTo(W,z.y1+10);X.stroke();X.setLineDash([]);
    }
  }
  if(phase==='sink'||phase==='soak'||phase==='up'){
    var hookY=lz[baitSel].y0+((lz[baitSel].y1-lz[baitSel].y0)/2);
    var progress=phase==='sink'?Math.min(1,pt/0.4):(phase==='up'?1-Math.min(1,pt/0.4):1);
    var hy2=60+progress*(hookY-60);
    X.strokeStyle='rgba(230,238,246,.75)';X.lineWidth=1.5;
    X.beginPath();X.moveTo(W/2,60);X.lineTo(W/2,hy2);X.stroke();
    X.fillStyle='#ffd75e';X.beginPath();X.arc(W/2,hy2+4,5,0,7);X.fill();
  }
  if(jump){
    var kk=jump.t/0.9,fy2=50-Math.sin(kk*Math.PI)*35;
    X.fillStyle='#ffd75e';X.beginPath();X.ellipse(W/2,fy2,20,8,-0.4,0,7);X.fill();
    X.fillStyle='#ffffff';X.font='bold 15px system-ui';X.textAlign='center';X.fillText('+'+jv,W/2+40,fy2);
  }
  X.fillStyle='#0c1428';X.fillRect(0,480,W,80);
  for(i=0;i<3;i++){
    var bx2=16+i*152;
    X.fillStyle=i===baitSel?'rgba(47,143,224,.55)':'rgba(30,40,66,.9)';
    X.fillRect(bx2,492,140,56);
    X.strokeStyle=i===baitSel?'#7fd4ff':'rgba(127,212,255,.3)';X.lineWidth=i===baitSel?2.5:1.5;
    X.strokeRect(bx2,492,140,56);
    X.fillStyle='#ffffff';X.font='bold 14px system-ui';X.textAlign='center';
    X.fillText((i+1)+'. '+baits[i][0],bx2+70,514);
    X.fillStyle='#9fb4c9';X.font='12px system-ui';
    X.fillText(baits[i][1],bx2+70,534);
  }
  X.fillStyle='#ffe9a3';X.font='bold 15px system-ui';X.textAlign='center';X.fillText(msg,W/2,86);
  if(notice){X.fillStyle='#ffd75e';X.fillText(notice,W/2,470)}
}
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  if(state!=='play')return;
  if(my>=492&&my<=548){
    baitSel=Math.min(2,Math.max(0,Math.floor((mx-16)/152)));
    return;
  }
  if(my<480)cast();
});
document.addEventListener('keydown',function(e){
  if(state!=='play'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();start()}
    return;
  }
  if(e.key==='1')baitSel=0;
  else if(e.key==='2')baitSel=1;
  else if(e.key==='3')baitSel=2;
  else if(e.key===' '){e.preventDefault();cast()}
});
ob.addEventListener('click',start);
var last=0;
function loop(ts){
  var dt=(ts-last)/1000;last=ts;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  eS.textContent=score;eT.textContent=Math.ceil(tl);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

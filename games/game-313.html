<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一局</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--ink:#eef1ff;--dim:#9aa3c7;--acc:#63b3ed;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;}
.wrap{width:100%;max-width:400px;text-align:center;}
h1{font-size:22px;letter-spacing:3px;margin-bottom:6px;}
.tip{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:10px;}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;color:var(--dim);}
.bar b{color:var(--acc);font-size:15px;}
.btn{background:var(--acc);border:none;border-radius:8px;color:#082032;font-family:inherit;font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;}
.btn.ghost{background:#2a3154;color:var(--ink);}
.frame{position:relative;width:100%;padding-top:100%;}
.board{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--card);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 1px #2c3560;touch-action:none;}
.board.ready .tile{transition:left .13s ease,top .13s ease;}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(145deg,#22334f,#1c2a42);color:var(--ink);font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 8px rgba(0,0,0,.28);}
.foot{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px;}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(7,9,20,.8);display:none;align-items:center;justify-content:center;z-index:20;}
.overlay.show{display:flex;}
.panel{background:var(--card);border:1px solid #2c3560;border-radius:16px;padding:28px 32px;text-align:center;max-width:86vw;box-shadow:0 16px 50px rgba(0,0,0,.55);}
.panel h2{color:var(--acc);font-size:24px;letter-spacing:2px;margin-bottom:10px;}
.panel p{color:var(--dim);font-size:14px;line-height:1.9;margin-bottom:18px;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <h1>每日一局</h1>
  <p class="tip">今天全世界玩家拿到的是同一局打乱(种子随日期固定);比拼谁的步数更少。也可开一局随机练习,不计入今日纪录。</p>
  <div class="bar">
    <span>步数 <b id="stMoves">0</b></span>
    <span>用时 <b id="stTime">0:00</b></span>
    <span>今日种子 <b id="stSeed">—</b></span>
    <span>今日最佳 <b id="stBest">—</b></span>
  </div>
  <div class="frame"><div class="board" id="board"></div></div>
  <div class="bar" style="margin-top:10px;">
    <button class="btn ghost" id="freeBtn">随机练习局</button>
    <button class="btn ghost" id="resetBtn">重开本局</button>
  </div>
  <p class="foot">点击空格旁的方块、方向键或触屏滑动复原 1–8;「再来一局」会重新挑战今日的固定棋局。</p>
</div>
<div class="overlay" id="overlay"><div class="panel">
  <h2 id="ovTitle"></h2>
  <p id="ovInfo"></p>
  <button class="btn" id="againBtn">再来一局</button>
</div></div>
<script>
(function(){
'use strict';
const N=3,TOTAL=N*N,K=50;
const goal=[];for(let i=0;i<TOTAL;i++)goal.push((i+1)%TOTAL);
let tiles=goal.slice(),els=[],moves=0,playing=false,startAt=0,practice=false,best=0,ymd='';
const boardEl=document.getElementById('board');
const movesEl=document.getElementById('stMoves'),timeEl=document.getElementById('stTime'),seedEl=document.getElementById('stSeed'),bestEl=document.getElementById('stBest');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovInfo=document.getElementById('ovInfo');
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s;}
function xmur3(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;};
}
function mulberry32(a){
  return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};
}
function buildTiles(){boardEl.innerHTML='';boardEl.classList.remove('ready');els=[];for(let v=1;v<TOTAL;v++){const el=document.createElement('div');el.className='tile';el.textContent=v;el.dataset.v=v;el.style.width=(100/N)+'%';el.style.height=(100/N)+'%';boardEl.appendChild(el);els[v]=el;}}
function setPos(v,idx){const r=(idx/N)|0,c=idx%N;els[v].style.left=(c*100/N)+'%';els[v].style.top=(r*100/N)+'%';}
function placeAll(){for(let i=0;i<TOTAL;i++)if(tiles[i])setPos(tiles[i],i);}
function blankIdx(){return tiles.indexOf(0);}
function slide(idx){const b=blankIdx(),br=(b/N)|0,bc=b%N,r=(idx/N)|0,c=idx%N;if(Math.abs(br-r)+Math.abs(bc-c)!==1)return false;tiles[b]=tiles[idx];tiles[idx]=0;setPos(tiles[b],b);return true;}
function moveDir(dx,dy){const b=blankIdx(),br=(b/N)|0,bc=b%N,tr=br-dy,tc=bc-dx;if(tr<0||tr>=N||tc<0||tc>=N)return false;return slide(tr*N+tc);}
function isSolved(){for(let i=0;i<TOTAL;i++)if(tiles[i]!==goal[i])return false;return true;}
function scramble(k,rnd){do{let last=-1;for(let s=0;s<k;s++){const b=blankIdx(),br=(b/N)|0,bc=b%N;const opts=[];if(br>0)opts.push(b-N);if(br<N-1)opts.push(b+N);if(bc>0)opts.push(b-1);if(bc<N-1)opts.push(b+1);const cands=opts.filter(function(x){return x!==last;});const pick=cands[(rnd()*cands.length)|0];tiles[b]=tiles[pick];tiles[pick]=0;last=pick;}}while(isSolved());}
function hud(){movesEl.textContent=moves;}
function afterMove(){moves++;timeEl.textContent=fmt((Date.now()-startAt)/1000);hud();if(isSolved())finish();}
function finish(){
  playing=false;
  const sec=(Date.now()-startAt)/1000;
  if(practice){
    ovTitle.textContent='练习局完成';
    ovInfo.textContent='随机练习不计入今日纪录\n用时 '+fmt(sec)+' · 步数 '+moves;
  }else{
    let isNew=false;
    if(!best||moves<best){best=moves;isNew=true;try{localStorage.setItem('mg313-'+ymd,String(best));}catch(e){}}
    bestEl.textContent=best+' 步';
    ovTitle.textContent='今日局完成!';
    ovInfo.textContent='用时 '+fmt(sec)+' · 步数 '+moves+(isNew?'\n今日新纪录!':'\n今日最佳 '+best+' 步');
  }
  overlay.classList.add('show');
}
function playerMove(idx){if(!playing)return;if(slide(idx))afterMove();}
boardEl.addEventListener('click',function(ev){const t=ev.target.closest('.tile');if(!t)return;const v=parseInt(t.dataset.v,10);playerMove(tiles.indexOf(v));});
document.addEventListener('keydown',function(ev){const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};const d=map[ev.key];if(!d)return;ev.preventDefault();if(!playing)return;if(moveDir(d[0],d[1]))afterMove();});
let tX=0,tY=0;
boardEl.addEventListener('touchstart',function(ev){const t=ev.changedTouches[0];tX=t.clientX;tY=t.clientY;},{passive:true});
boardEl.addEventListener('touchend',function(ev){if(!playing)return;const t=ev.changedTouches[0];const dx=t.clientX-tX,dy=t.clientY-tY;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;ev.preventDefault();if(Math.abs(dx)>Math.abs(dy)){if(moveDir(dx>0?1:-1,0))afterMove();}else{if(moveDir(0,dy>0?1:-1))afterMove();}},{passive:false});
function fit(){const w=boardEl.clientWidth;if(w)boardEl.style.fontSize=Math.max(14,Math.min(46,w/N*0.42))+'px';}
function newGame(daily){
  practice=!daily;
  overlay.classList.remove('show');
  tiles=goal.slice();buildTiles();
  if(daily){const seedFn=xmur3(ymd);scramble(K,mulberry32(seedFn()));}
  else{scramble(K,Math.random);}
  placeAll();
  moves=0;startAt=Date.now();playing=true;timeEl.textContent='0:00';hud();
  requestAnimationFrame(function(){fit();boardEl.classList.add('ready');});
}
const now=new Date();
ymd=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2);
try{best=parseInt(localStorage.getItem('mg313-'+ymd)||'0',10)||0;}catch(e){}
document.getElementById('stSeed').textContent=ymd;
bestEl.textContent=best?best+' 步':'—';
document.getElementById('resetBtn').addEventListener('click',function(){newGame(true);});
document.getElementById('freeBtn').addEventListener('click',function(){newGame(false);});
document.getElementById('againBtn').addEventListener('click',function(){newGame(true);});
window.addEventListener('resize',fit);
newGame(true);
})();
</script>
</body>
</html>

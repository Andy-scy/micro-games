<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旋盘陶艺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f97316;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f97316;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #5c3410;background:#151019;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.bar{display:flex;justify-content:center;margin-top:10px}
.bar button{background:#f97316;color:#431407;border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay{position:absolute;inset:0;background:rgba(14,9,6,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#f97316}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#f97316;color:#431407;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>旋盘陶艺</h1>
  <p class="hint"><b style="color:#f97316">按住横向拖动</b>捏泥坯:按住时转盘减速,方便塑形;<br>一松手,离心力会把泥往外甩!把坯体捏到与白色虚线轮廓贴合 75% 即出窑。</p>
  <div class="hud"><span>相似度 <b id="sim">0%</b></span><span>转速 <b id="spin">高</b></span><span>时间 <b id="time">60</b>秒</span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="420"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">旋盘陶艺</h2>
      <p id="ovP">转盘飞转,泥坯在离心力下不断外鼓。你要按住它横向拖拽,把每一层的半径捏到白色虚线花瓶的形状。捏完点「出窑验收」,相似度 75% 过关!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">上泥开转</button>
    </div>
  </div>
  <div class="bar"><button id="btnDone">出窑验收</button></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo"),btnDone=$("btnDone");
var elSim=$("sim"),elSpin=$("spin"),elTime=$("time");
var NB=32,Y0=40,BH=10,CX=240;
var rad=[],tgt=[],state="menu",sp=1,phase=0,timeLeft=60,pressed=false,isDown=false,lastT=0;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function initTgt(){
  tgt=[];rad=[];
  var i;
  for(i=0;i<NB;i++){
    var t=i/(NB-1);
    var v=30+72*Math.sin(Math.PI*Math.min(1,t*1.12));
    v-=46*Math.exp(-Math.pow((t-0.9)/0.07,2));
    v+=18*Math.exp(-Math.pow((t-0.02)/0.06,2));
    tgt.push(clamp(v,12,132));
    rad.push(30);
  }
}
function simNow(){
  var s=0,i;
  for(i=0;i<NB;i++)s+=Math.abs(rad[i]-tgt[i]);
  return Math.max(0,Math.round(100-s/NB*1.1));
}
function hud(){
  elSim.textContent=simNow()+"%";
  elSpin.textContent=sp>0.6?"高":(sp>0.3?"中":"低");
  elTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function begin(e){
  if(state!=="playing")return;
  var p=pos(e);isDown=true;pressed=true;shape(p);
}
function moveP(e){
  if(!isDown||state!=="playing")return;
  shape(pos(e));
}
function shape(p){
  var b=Math.floor((p.y-Y0)/BH),j;
  if(b<0)b=0;if(b>NB-1)b=NB-1;
  var r=clamp(Math.abs(p.x-CX),10,150);
  for(j=b-2;j<=b+2;j++){
    if(j<0||j>=NB)continue;
    var w=Math.exp(-((j-b)*(j-b))/2.2);
    rad[j]+=(r-rad[j])*w*0.5;
  }
}
function endP(){isDown=false;pressed=false;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function drawVase(rr,stroke){
  var i;
  ctx.beginPath();
  ctx.moveTo(CX+rr[0],Y0);
  for(i=0;i<NB;i++)ctx.lineTo(CX+rr[i],Y0+i*BH);
  for(i=NB-1;i>=0;i--)ctx.lineTo(CX-rr[i],Y0+i*BH);
  ctx.closePath();
  if(stroke){
    ctx.strokeStyle="rgba(255,255,255,0.45)";ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.stroke();ctx.setLineDash([]);
  }else{
    ctx.fillStyle="#c2703f";ctx.fill();
    ctx.strokeStyle="#8a4b26";ctx.lineWidth=2;ctx.stroke();
    for(i=0;i<NB;i+=2){
      ctx.beginPath();ctx.ellipse(CX,Y0+i*BH,rr[i],3.2,0,0,Math.PI*2);
      ctx.strokeStyle="rgba(60,30,10,0.22)";ctx.lineWidth=1;ctx.stroke();
    }
  }
}
function draw(){
  var i;
  ctx.fillStyle="#151019";ctx.fillRect(0,0,480,420);
  drawVase(tgt,true);
  drawVase(rad,false);
  for(i=0;i<NB;i++){
    if(Math.abs(rad[i]-tgt[i])>10){
      ctx.beginPath();ctx.arc(CX+rad[i]+6,Y0+i*BH,2.5,0,Math.PI*2);
      ctx.fillStyle="rgba(248,113,113,0.9)";ctx.fill();
    }
  }
  ctx.beginPath();ctx.ellipse(CX,Y0,rad[0],5,0,0,Math.PI*2);
  ctx.fillStyle="#d98a55";ctx.fill();
  for(i=0;i<3;i++){
    var a=phase+i*2.09;
    ctx.beginPath();ctx.arc(CX+Math.cos(a)*rad[0]*0.7,Y0+Math.sin(a)*2.4,2,0,Math.PI*2);
    ctx.fillStyle="rgba(255,220,180,0.7)";ctx.fill();
  }
  ctx.beginPath();ctx.ellipse(CX,382,150,14,0,0,Math.PI*2);
  ctx.fillStyle="#2a2033";ctx.fill();
  ctx.beginPath();ctx.ellipse(CX,382,150,14,0,0,Math.PI*2);
  ctx.strokeStyle="#4c3a72";ctx.lineWidth=2;ctx.stroke();
}
function finish(){
  state="over";
  var s=simNow(),win=s>=75;
  ovT.textContent=win?"出窑!好一件艺术品":"出窑……有点歪";
  ovP.textContent="这坯和目标轮廓的相似度是 "+s+"%。\n"+(win?"釉色已上,摆进橱窗!":"多按住慢捏,松手前把鼓出来的地方收回来。");
  ovS.style.display="block";ovS.textContent="相似度 "+s+"%";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT)/1000;lastT=t;
  if(state!=="playing")return;
  phase+=sp*dt*9;
  if(pressed){
    sp=Math.max(0.12,sp-dt*1.2);
  }else{
    sp=Math.min(1,sp+dt*0.4);
    for(var i=0;i<NB;i++)rad[i]=Math.min(150,rad[i]+sp*dt*(5+rad[i]*0.05));
  }
  timeLeft-=dt;
  hud();
  if(timeLeft<=0){timeLeft=0;finish();return;}
  draw();
}
btnDone.addEventListener("click",function(){if(state==="playing")finish();});
btnGo.addEventListener("click",function(){
  initTgt();sp=1;phase=0;timeLeft=60;pressed=false;isDown=false;
  state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  hud();draw();
});
initTgt();
hud();draw();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

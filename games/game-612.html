<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>折扣收银员</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#facc15;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:12px}
.hud b{color:#facc15;font-size:16px}
.scene{background:#0b0e1a;border-radius:12px;padding:14px;margin-bottom:10px;min-height:86px}
.tag{display:inline-block;background:#3d3407;color:#facc15;font-size:12px;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.scene p{font-size:17px;line-height:1.7;color:#e8eaf6}
.scene p b{color:#facc15}
.ans{text-align:center;font-size:26px;font-weight:800;color:#facc15;background:#0b0e1a;border-radius:10px;padding:8px 0;min-height:48px;margin-bottom:12px;letter-spacing:1px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{background:#232949;color:#e8eaf6;border:none;border-radius:10px;padding:12px 0;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit}
.kp button:active{transform:scale(.95)}
.kp .ok{background:#facc15;color:#332b00}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:10px;color:#8b90b0}
.msg.good{color:#4ade80}
.msg.badc{color:#f87171}
.stage{position:relative}
.overlay{position:absolute;inset:-6px;background:rgba(8,10,22,.93);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#facc15}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#facc15;color:#332b00;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>折扣收银员</h1>
  <p class="hint">打折、满减、找零样样要会 · 输入金额后按确认 · 共 12 单,算错扣一颗心</p>
  <div class="hud">
    <span>第 <b id="no">1</b>/12 单</span>
    <span>得分 <b id="score">0</b></span>
    <span>连对 <b id="combo">0</b></span>
    <span>生命 <b id="lives">❤❤❤</b></span>
  </div>
  <div class="stage">
    <div class="scene"><span class="tag" id="tag">折扣</span><p id="q"></p></div>
    <div class="ans" id="ans">0 元</div>
    <div class="kp" id="kp">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="del">⌫</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k=".">.</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="0">0</button>
      <button data-k="ok" class="ok" style="grid-column:span 4">收银确认</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">折扣收银员</h2>
      <p id="ovD">你现在是超市收银员!打折(八折=×0.8)、满减、找零都要心里有数。金额保留一位小数即可,例如 28 或 28.5。算错三单就要被开除啦!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始上岗</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elNo=$("no"),elScore=$("score"),elCombo=$("combo"),elLives=$("lives");
var elTag=$("tag"),elQ=$("q"),elAns=$("ans"),elMsg=$("msg"),kp=$("kp");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo");
var ZH={5:"五",6:"六",7:"七",8:"八",9:"九"};
var state,score,combo,lives,no,cur,input,lock;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function fmt(v){
  var s=(Math.round(v*10)/10).toFixed(1);
  return s.charAt(s.length-1)==="0"?String(Math.round(v*10)/10):s;
}
function updHud(){
  elNo.textContent=no;elScore.textContent=score;elCombo.textContent=combo;
  var h="",i;
  for(i=0;i<3;i++)h+=i<lives?"❤":"♡";
  elLives.textContent=h;
}
function setMsg(t,cls){
  elMsg.textContent=t;
  elMsg.className="msg"+(cls?" "+cls:"");
}
function showAns(){elAns.textContent=(input===""?"0":input)+" 元";}
function gen(){
  var type=(no-1)%3;
  var q,ans,tag;
  if(type===0){
    var price=rnd(4,24)*5,zh=pick([5,6,7,8,9]);
    ans=price*zh/10;
    tag="折扣";q="水杯原价 <b>"+price+" 元</b>,今日促销打<b>"+ZH[zh]+"折</b>(×0."+zh+"),现价是多少元?";
  }else if(type===1){
    var pay=pick([50,100]),cost=rnd(4,18)*5;
    if(cost>=pay)cost=pay-10;
    ans=pay-cost;
    tag="找零";q="顾客购买了 <b>"+cost+" 元</b>的商品,递给你一张 <b>"+pay+" 元</b>,要找零多少元?";
  }else{
    var p2=rnd(11,30)*10,cut=pick([10,20,30]);
    ans=p2-cut;
    tag="满减";q="购物满 100 减 <b>"+cut+"</b>,这位顾客消费了 <b>"+p2+" 元</b>,应付多少元?";
  }
  cur={ans:ans};
  elTag.textContent=tag;
  elQ.innerHTML=q;
  input="";
  showAns();
}
function submit(){
  if(state!=="playing"||lock)return;
  if(input===""){setMsg("先输入金额再确认","badc");return;}
  var v=parseFloat(input);
  if(isNaN(v)){setMsg("金额格式不对哦","badc");return;}
  if(Math.abs(v-cur.ans)<0.051){
    score+=10+combo*2;combo++;
    setMsg("收银正确!应收 "+fmt(cur.ans)+" 元","good");
    updHud();
    no++;
    if(no>12){setTimeout(gameOverWin,700);return;}
    lock=true;
    setTimeout(next,800);
  }else{
    combo=0;lives--;
    setMsg("算错了!正确应收 "+fmt(cur.ans)+" 元 · 生命 -1","badc");
    updHud();
    no++;
    if(lives<=0){setTimeout(gameOverLose,1100);return;}
    if(no>12){setTimeout(gameOverWin,1100);return;}
    lock=true;
    setTimeout(next,1100);
  }
}
function next(){
  lock=false;
  setMsg("");
  gen();
}
function press(k){
  if(state!=="playing")return;
  if(k==="del")input=input.slice(0,-1);
  else if(k==="ok")submit();
  else if(k==="."){if(input.indexOf(".")<0&&input!=="")input+=".";}
  else if(input.length<6)input+=k;
  showAns();
}
function gameOverWin(){
  state="over";
  ovT.textContent="今日营业完成!";
  ovD.textContent="12 单账目漂亮收官,店长给你加了薪!";
  ovS.style.display="block";
  ovS.textContent="得分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function gameOverLose(){
  state="over";
  ovT.textContent="被开除了…";
  ovD.textContent="账目错得太多。小提示:打八折就是原价 ×0.8。";
  ovS.style.display="block";
  ovS.textContent="得分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  state="playing";score=0;combo=0;lives=3;no=1;lock=false;
  ovS.style.display="none";
  setMsg("");
  gen();updHud();
  ov.classList.add("hide");
}
kp.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute("data-k"))press(t.getAttribute("data-k"));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
    return;
  }
  if(e.key>="0"&&e.key<="9"){press(e.key);e.preventDefault();}
  else if(e.key==="."){press(".");e.preventDefault();}
  else if(e.key==="Backspace"){press("del");e.preventDefault();}
  else if(e.key==="Enter"){submit();e.preventDefault();}
});
})();
</script>
</body>
</html>

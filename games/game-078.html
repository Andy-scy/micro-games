<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穿环大师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#facc15;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#facc15;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#facc15}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#facc15;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>穿环大师</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀 · 穿环中心 = 完美,脱靶断连击!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">穿环大师</h2>
      <p id="ovDesc">石柱顶端悬挂着金色圆环:从环心掠过「完美 +5」,从环内通过「命中 +3」,飞在环外算「脱靶」并清空连击!连续命中每满 5 次奖励 +8。别撞石柱、别坠地。冲着环心去,做穿环大师!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始穿环</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,GRAV=1480,FLAP=-380,BX=120,BR=13,SPEED=138,RING=46,SPACE=292;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elCombo=$("combo"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,rings,popups,score,best=0,tick,combo;
function newRing(x){
  var mount=Math.random()<0.5?"floor":"ceil";
  var y=mount==="floor"?(130+Math.random()*(GROUND-176-130)):(176+Math.random()*(GROUND-130-176));
  return{x:x,y:y,mount:mount,passed:false,flash:0};
}
function reset(){
  bird={y:280,vy:0,fl:0};
  rings=[newRing(W+170)];
  popups=[];score=0;tick=0;combo=0;
  elScore.textContent="0";
  elCombo.textContent="0";
}
function act(){
  if(state!=="playing")return;
  bird.vy=FLAP;bird.fl=1;
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,r;
  tick+=dt;
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("坠落在地面上!");return;}
  for(i=0;i<rings.length;i++)rings[i].x-=SPEED*dt;
  if(rings[rings.length-1].x<W-SPACE)rings.push(newRing(W+24));
  if(rings[0].x<-80)rings.shift();
  for(i=0;i<rings.length;i++){
    r=rings[i];
    if(r.flash>0)r.flash-=dt;
    if(!r.passed&&r.x<BX-2){
      r.passed=true;
      var d=Math.abs(bird.y-r.y);
      if(d<=13){
        score+=5;combo++;
        r.flash=0.6;
        popups.push({x:r.x+20,y:r.y-40,txt:"完美 +5",life:1});
        if(combo%5===0){
          score+=8;
          popups.push({x:W/2,y:150,txt:"连击 x"+combo+"!奖励 +8",life:1.3});
        }
      }else if(d<=RING-BR){
        score+=3;combo++;
        r.flash=0.4;
        popups.push({x:r.x+20,y:r.y-40,txt:"命中 +3",life:0.9});
      }else{
        combo=0;
        popups.push({x:r.x+20,y:r.y-40,txt:"脱靶…",life:0.9});
      }
      elScore.textContent=String(score);
      elCombo.textContent=String(combo);
    }
    var py=r.mount==="floor"?r.y+RING:0,ph=r.mount==="floor"?GROUND-(r.y+RING):r.y-RING;
    if(ph>0&&circleRect(BX,bird.y,BR,r.x-9,py,18,ph)){die("撞上了石柱!");return;}
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawRing(r){
  var glow=r.flash>0?r.flash*1.5:0;
  ctx.strokeStyle=r.flash>0?"#fef9c3":"#facc15";
  ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(r.x,r.y,RING,0,Math.PI*2);ctx.stroke();
  if(glow>0){
    ctx.strokeStyle="rgba(254,249,195,"+glow+")";
    ctx.lineWidth=14;
    ctx.beginPath();ctx.arc(r.x,r.y,RING,0,Math.PI*2);ctx.stroke();
  }
  ctx.strokeStyle="rgba(250,204,21,0.3)";
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(r.x,r.y,RING-9,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#eab308";
  ctx.beginPath();ctx.arc(r.x,r.y,5,0,Math.PI*2);ctx.fill();
}
function draw(){
  var i,r;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#161408";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,244,200,0.28)";
  for(i=0;i<35;i++)ctx.fillRect((i*151)%W,(i*229)%GROUND,1.3,1.3);
  for(i=0;i<rings.length;i++){
    r=rings[i];
    ctx.fillStyle="#44403c";
    if(r.mount==="floor")ctx.fillRect(r.x-9,r.y+RING-2,18,GROUND-r.y-RING+2);
    else ctx.fillRect(r.x-9,0,18,r.y-RING+2);
    ctx.fillStyle="#57534e";
    ctx.fillRect(r.x-9,r.mount==="floor"?r.y+RING-2:0,5,r.mount==="floor"?GROUND-r.y-RING+2:r.y-RING+2);
    drawRing(r);
  }
  ctx.fillStyle="#2b2713";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#3d3819";
  var off=(tick*SPEED)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#fef08a";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#eab308";
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#161408";
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fb923c";
  ctx.beginPath();ctx.moveTo(BX+BR-2,bird.y);ctx.lineTo(BX+BR+8,bird.y+2);ctx.lineTo(BX+BR-2,bird.y+6);ctx.closePath();ctx.fill();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(254,240,138,"+Math.min(1,popups[i].life)+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

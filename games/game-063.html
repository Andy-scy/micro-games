<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阵风峡谷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#93c5fd;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#93c5fd;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#93c5fd}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#93c5fd;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>阵风峡谷</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀 · 留意峡谷阵风!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>风况 <b id="wind">无风</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">阵风峡谷</h2>
      <p id="ovDesc">峡谷中狂风不定:预警之后,顺风会让管道呼啸而过(世界加速),逆风则让一切变得缓慢粘稠。点按拍翅上升,借风势的快慢调整穿越时机。撞管或坠地即结束!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=70,GAP=152,SPACE=244,GRAV=1480,FLAP=-375,BX=120,BR=13,SPEED=145;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elWind=$("wind"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,popups,streaks,score,best=0,tick,wind;
var stars=[],i;
for(i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*GROUND,r:Math.random()*1.3+0.4});
function newPipe(x){return{x:x,gy:60+Math.random()*(GROUND-120-GAP),passed:false};}
function reset(){
  bird={y:270,vy:0,fl:0};
  pipes=[newPipe(W+150)];
  popups=[];streaks=[];score=0;tick=0;
  wind={phase:"none",timer:2.8+Math.random()*1.6,type:"tail",warn:0,left:0,mul:1};
  elScore.textContent="0";
  elWind.textContent="无风";
}
function act(){
  if(state!=="playing")return;
  bird.vy=FLAP;bird.fl=1;
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function updateWind(dt){
  var j;
  if(wind.phase==="none"){
    wind.timer-=dt;
    if(wind.timer<=0){wind.phase="warn";wind.warn=0.95;wind.type=Math.random()<0.5?"tail":"head";}
  }else if(wind.phase==="warn"){
    wind.warn-=dt;
    for(j=0;j<2;j++)streaks.push({x:Math.random()*W,y:Math.random()*GROUND,vx:wind.type==="tail"?-(160+Math.random()*160):160+Math.random()*160,len:26+Math.random()*22,life:0.7});
    if(wind.warn<=0){wind.phase="blow";wind.left=2.2;wind.mul=wind.type==="tail"?1.8:0.55;}
  }else{
    wind.left-=dt;
    for(j=0;j<3;j++)streaks.push({x:Math.random()*W,y:Math.random()*GROUND,vx:wind.type==="tail"?-(430+Math.random()*260):330+Math.random()*220,len:40+Math.random()*30,life:0.55});
    bird.vy+=Math.sin(tick*16)*(wind.type==="tail"?55:95)*dt;
    if(wind.left<=0){wind.phase="none";wind.mul=1;wind.timer=2.6+Math.random()*2.2;}
  }
  elWind.textContent=wind.phase==="none"?"无风":(wind.phase==="warn"?"阵风预警!":(wind.type==="tail"?"顺风 →→":"←← 逆风"));
  for(j=streaks.length-1;j>=0;j--){
    streaks[j].x+=streaks[j].vx*dt;streaks[j].life-=dt;
    if(streaks[j].life<=0||streaks[j].x<-60||streaks[j].x>W+60)streaks.splice(j,1);
  }
}
function update(dt){
  var i,p,eff;
  tick+=dt;
  updateWind(dt);
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("被狂风卷到了地上!");return;}
  eff=SPEED*wind.mul;
  for(i=0;i<pipes.length;i++)pipes[i].x-=eff*dt;
  if(pipes[pipes.length-1].x<W-SPACE)pipes.push(newPipe(W+24));
  if(pipes[0].x<-PW-12)pipes.shift();
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x+PW<BX-BR){
      p.passed=true;score++;
      elScore.textContent=String(score);
      popups.push({x:BX+34,y:bird.y-26,txt:"+1",life:0.8});
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gy)||circleRect(BX,bird.y,BR,p.x,p.gy+GAP,PW,GROUND-p.gy-GAP)){
      die("气流一乱,撞上了管道!");return;
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  ctx.fillStyle="#3b6ea5";
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+GAP,PW,GROUND-p.gy-GAP);
  ctx.fillStyle="#93c5fd";
  ctx.fillRect(p.x+6,0,7,p.gy);
  ctx.fillRect(p.x+6,p.gy+GAP,7,GROUND-p.gy-GAP);
  ctx.fillStyle="#1e3a5f";
  ctx.fillRect(p.x-4,p.gy-13,PW+8,13);
  ctx.fillRect(p.x-4,p.gy+GAP,PW+8,13);
}
function draw(){
  var i,j;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0d1424";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(200,220,255,0.45)";
  for(i=0;i<stars.length;i++)ctx.fillRect(stars[i].x,stars[i].y,stars[i].r,stars[i].r);
  for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  ctx.strokeStyle="rgba(147,197,253,0.5)";ctx.lineWidth=2;
  for(i=0;i<streaks.length;i++){
    ctx.beginPath();
    ctx.moveTo(streaks[i].x,streaks[i].y);
    ctx.lineTo(streaks[i].x+streaks[i].len*(streaks[i].vx>0?1:-1),streaks[i].y);
    ctx.stroke();
  }
  ctx.fillStyle="#22304f";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#31446b";
  var off=(tick*145)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#dbeafe";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#7ea8d8";
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#0b1424";
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f97316";
  ctx.beginPath();ctx.moveTo(BX+BR-2,bird.y);ctx.lineTo(BX+BR+8,bird.y+2);ctx.lineTo(BX+BR-2,bird.y+6);ctx.closePath();ctx.fill();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(251,191,36,"+popups[i].life+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
  if(wind.phase==="warn"){
    ctx.font="bold 22px system-ui";
    ctx.fillStyle="rgba(251,191,36,0.9)";
    ctx.fillText("阵风来袭!",W/2,90);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰壶擦冰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:20px;color:#4fc3f7;margin:4px 0}
.tip{font-size:13px;color:#9fa8da;text-align:center;margin-bottom:8px}
#stage{position:relative;line-height:0}
canvas{background:#1b2340;border-radius:14px;max-width:96vw;height:auto;touch-action:none;display:block}
#overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;border-radius:14px}
#overlay.hidden{display:none}
.card{background:#232946;border:1px solid #4a5290;border-radius:14px;padding:20px 30px;text-align:center;max-width:80%;line-height:1.6}
.card h2{color:#4fc3f7;margin-bottom:8px;font-size:22px}
.card p{font-size:15px;color:#c5cae9}
.card button{margin-top:14px;padding:9px 30px;font-size:16px;font-weight:700;border:none;border-radius:9px;background:#4fc3f7;color:#10203a;cursor:pointer}
.card button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>冰壶擦冰</h1>
<p class="tip">按住锁定摆动方向，再按住蓄力松手出壶 · 滑行中按住屏幕擦冰（更滑更直）· 6 壶总分 32 分获胜</p>
<div id="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="overlay" class="hidden"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="btnRe">再来一局</button></div></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),ovB=document.getElementById('btnRe');
var W=480,H=640,HCX=240,HCY=150,SR=13;
var phase,stones,cur,total,aimT,lockA,curA,meter,mt,sweep,msg,resT,lastIdx;
function rnd(a,b){return a+Math.random()*(b-a);}
function ringPts(d){if(d<=30)return 10;if(d<=60)return 7;if(d<=90)return 4;if(d<=120)return 2;if(d<=150)return 1;return 0;}
function seedAI(){
  for(var i=0;i<3;i++){
    var x=HCX,y=HCY,ok=false,tries=0;
    while(!ok&&tries<50){tries++;var a=rnd(0,6.283),r=rnd(28,108);x=HCX+Math.cos(a)*r;y=HCY+Math.sin(a)*r;ok=true;
      for(var j=0;j<stones.length;j++){if(Math.hypot(stones[j].x-x,stones[j].y-y)<30){ok=false;break;}}}
    stones.push({x:x,y:y,vx:0,vy:0,team:1,moving:false,out:false});
  }
}
function reset(){
  phase='aim';stones=[];cur=1;total=0;aimT=0;lockA=0;curA=0;meter=0;mt=0;sweep=false;msg='';resT=0;lastIdx=-1;
  seedAI();
}
function throwStone(){
  var d={x:Math.sin(lockA),y:-Math.cos(lockA)},v=300+meter*330;
  stones.push({x:240,y:560,vx:d.x*v,vy:d.y*v,team:0,moving:true,out:false});
  lastIdx=stones.length-1;phase='slide';
}
function update(dt){
  if(phase==='aim'){aimT+=dt;curA=Math.sin(aimT*1.5)*0.30;}
  if(phase==='charge'){mt+=dt;meter=0.5-0.5*Math.cos(mt*5);}
  if(phase==='slide'){
    var any=false;
    for(var i=0;i<stones.length;i++){
      var s=stones[i];
      if(!s.moving)continue;
      var fr=(s.team===0&&sweep)?95:300;
      var sp=Math.hypot(s.vx,s.vy),dec=fr*dt;
      if(sp<=dec+4){s.vx=0;s.vy=0;s.moving=false;}
      else{var k=(sp-dec)/sp;s.vx*=k;s.vy*=k;}
      if(s.team===0&&!sweep&&s.moving)s.vx+=26*dt;
      s.x+=s.vx*dt;s.y+=s.vy*dt;
      if(s.x<16||s.x>464||s.y<14){s.moving=false;s.out=true;s.vx=0;s.vy=0;}
      if(s.moving)any=true;
    }
    for(var a=0;a<stones.length;a++)for(var b=a+1;b<stones.length;b++){
      var p=stones[a],q=stones[b];
      if(p.out||q.out||(!p.moving&&!q.moving))continue;
      var dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
      if(d<SR*2&&d>0.001){
        var nx=dx/d,ny=dy/d,ov2=SR*2-d;
        if(p.moving){p.x-=nx*ov2;p.y-=ny*ov2;}
        if(q.moving){q.x+=nx*ov2;q.y+=ny*ov2;}
        if(p.moving&&q.moving){
          var van=p.vx*nx+p.vy*ny,vbn=q.vx*nx+q.vy*ny;
          if(van-vbn>0){p.vx+=(vbn-van)*nx*0.9;p.vy+=(vbn-van)*ny*0.9;q.vx+=(van-vbn)*nx*0.9;q.vy+=(van-vbn)*ny*0.9;}
        }else if(p.moving){
          var rel=p.vx*nx+p.vy*ny;
          if(rel>0){q.vx=rel*nx*0.72+p.vx*0.1;q.vy=rel*ny*0.72+p.vy*0.1;q.moving=true;p.vx-=rel*nx*0.78;p.vy-=rel*ny*0.78;}
        }else{
          var rvn=q.vx*nx+q.vy*ny;
          if(rvn<0){p.vx=rvn*nx*0.72;p.vy=rvn*ny*0.72;p.moving=true;q.vx-=rvn*nx*0.78;q.vy-=rvn*ny*0.78;}
        }
      }
    }
    if(!any){
      phase='res';resT=0;var g=0;
      if(lastIdx>=0&&!stones[lastIdx].out)g=ringPts(Math.hypot(stones[lastIdx].x-HCX,stones[lastIdx].y-HCY));
      total+=g;
      msg=g>0?('本壶 +'+g+' 分'):'本壶 0 分';
    }
  }
  if(phase==='res'){
    resT+=dt;
    if(resT>1.15){
      if(cur>=6){end(total>=32);return;}
      cur++;phase='aim';aimT=0;
    }
  }
}
function end(win){
  phase='over';
  ovT.textContent=win?'冰壶大师！':'比赛结束';
  ovX.textContent='六壶总分 '+total+' 分'+(win?'，营垒中心尽在掌握！':'（获胜需 32 分）。蓄力越大滑得越远，擦冰可以再送一程。');
  ov.classList.remove('hidden');
}
function drawStone(s,ghost){
  ctx.globalAlpha=ghost?0.25:1;
  ctx.fillStyle=s.team===0?'#ffd54f':'#b0bec5';
  ctx.beginPath();ctx.arc(s.x,s.y,SR,0,7);ctx.fill();
  ctx.strokeStyle=s.team===0?'#8d6708':'#607d8b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(s.x,s.y,SR,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.stroke();
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1b2340';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.03)';
  for(var st=0;st<5;st++)ctx.fillRect(0,80+st*110,W,3);
  var rings=[[150,'#31549b'],[120,'#dfe6f5'],[90,'#31549b'],[60,'#dfe6f5'],[30,'#d64550']];
  for(var r=0;r<rings.length;r++){
    ctx.fillStyle=rings[r][1];
    ctx.beginPath();ctx.arc(HCX,HCY,rings[r][0],0,7);ctx.fill();
  }
  ctx.fillStyle='rgba(232,234,246,.5)';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('营 垒',HCX,HCY+4);
  for(var i=0;i<stones.length;i++){
    var s=stones[i];
    if(s.out){drawStone(s,true);continue;}
    drawStone(s,false);
  }
  if(phase==='aim'||phase==='charge'){
    var d={x:Math.sin(curA),y:-Math.cos(curA)};
    ctx.strokeStyle='#4fc3f7';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(240,560);ctx.lineTo(240+d.x*80,560+d.y*80);ctx.stroke();
    ctx.fillStyle='#4fc3f7';
    ctx.beginPath();ctx.arc(240,560,SR,0,7);ctx.fill();
  }
  if(phase==='slide'&&sweep&&lastIdx>=0&&stones[lastIdx].moving){
    var bs=stones[lastIdx];
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;
    for(var w2=0;w2<3;w2++){
      ctx.beginPath();ctx.moveTo(bs.x-16,bs.y+14+w2*5);ctx.lineTo(bs.x+16,bs.y+10+w2*5);ctx.stroke();
    }
  }
  if(phase==='charge'){
    var bx=140,bw=200;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx,612,bw,16);
    ctx.fillStyle='#4fc3f7';ctx.fillRect(bx,612,bw*meter,16);
    ctx.strokeStyle='#9fa8da';ctx.strokeRect(bx,612,bw,16);
  }
  ctx.fillStyle='#e8eaf6';ctx.font='16px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('第 '+cur+' / 6 壶',14,28);
  ctx.fillText('总分 '+total,14,52);
  ctx.fillStyle='#9fa8da';ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';
  if(phase==='aim')ctx.fillText('按住 锁定方向',W/2,622);
  if(phase==='charge')ctx.fillText('松手 出壶！',W/2,600);
  if(phase==='slide')ctx.fillText('按住 擦冰！',W/2,622);
  if(phase==='res'){ctx.fillStyle='#4fc3f7';ctx.font='20px system-ui,sans-serif';ctx.fillText(msg,W/2,96);}
}
function press(){
  if(phase==='aim'){phase='charge';lockA=curA;mt=0;meter=0;}
  else if(phase==='slide'){sweep=true;}
}
function release(){
  if(phase==='charge')throwStone();
  sweep=false;
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();press();});
window.addEventListener('pointerup',function(){release();});
window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();if(!e.repeat)press();}});
window.addEventListener('keyup',function(e){if(e.code==='Space')release();});
ovB.addEventListener('click',function(){ov.classList.add('hidden');reset();});
var last=performance.now();
function loop(t){var dt=Math.min(0.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

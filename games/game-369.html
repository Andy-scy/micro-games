<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>左右轮奏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#a3e635;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#a3e635;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#a3e635}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#a3e635;color:#172403;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>左右轮奏</h1>
  <p class="hint">左右手必须轮流敲 · 左 A / 右 L · 触屏点两半 · 用错手会打乱节奏</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>速度 <b id="bpm">92</b></span>
    <span>生命 <b id="life">5</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">左右轮奏</h2>
      <p id="ovDesc">屏幕大字提示下一拍该用哪只手:
左手 A(或触屏左半),右手 L(或触屏右半)。
必须严格左右左右轮流敲:漏拍扣生命,用错手断连击;
每命中 16 拍提速一次,坚持越久越快。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elBpm=$("bpm"),elLife=$("life");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,CX=240,CY=280;
var BPM0=92,BPMAX=150;
var LC="#60a5fa",RC="#fbbf24";
var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function sHand(side){tone("triangle",side===0?440:660,0,0.1,0.22);}
function sTick(){noiseHit(0.04,0.06,7000);}
function sBad(){tone("sawtooth",200,95,0.22,0.18);}

var state="menu",bpm,score,combo,life,maxCombo,hits,n,ticks,nextBeat,flashes;
function beatInt(){return 60000/bpm;}
function sideOf(m){return m%2===1?0:1;}
function reset(){
  bpm=BPM0;score=0;combo=0;life=5;maxCombo=0;hits=0;
  n=0;ticks=[];
  nextBeat=performance.now()+1600;
  flashes=[];
  upd();
}
function start(){audio();reset();state="play";ov.classList.add("hide");}
function upd(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elBpm.textContent=Math.round(bpm);
  elLife.textContent=life;
}
function addPop(txt,color){flashes.push({txt:txt,color:color,t0:performance.now()});}
function gameOver(){
  state="over";
  ovTitle.textContent="双手打结";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最高连击 "+maxCombo;
  ovDesc.textContent="共命中 "+hits+" 拍 · 终速 "+Math.round(bpm)+" BPM\n左 A 右 L,再来一次!";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function schedule(now){
  if(now-nextBeat>4000)nextBeat=now+400;
  while(nextBeat-now<600){
    n++;
    ticks.push({m:n,t:nextBeat,used:false,run:false});
    nextBeat+=beatInt();
  }
  var i,tk;
  for(i=ticks.length-1;i>=0;i--){
    tk=ticks[i];
    if(!tk.run&&now>=tk.t){tk.run=true;sTick();}
    if(tk.run&&!tk.used&&now>tk.t+185){
      tk.used=true;
      combo=0;life--;sBad();
      addPop("漏拍!","#f87171");
      upd();
      if(life<=0){gameOver();return;}
    }
    if(tk.used&&now>tk.t+420)ticks.splice(i,1);
  }
}
function press(side){
  if(state!=="play")return;
  var now=performance.now(),i,tk,dt,bi=-1,bd=1e9;
  for(i=0;i<ticks.length;i++){
    tk=ticks[i];if(tk.used)continue;
    dt=now-tk.t;
    if(Math.abs(dt)>175)continue;
    if(Math.abs(dt)<Math.abs(bd)){bd=dt;bi=i;}
  }
  if(bi<0){
    addPop("抢拍","#8b90b0");sBad();combo=0;upd();return;
  }
  tk=ticks[bi];
  if(sideOf(tk.m)!==side){
    tk.used=true;
    addPop("换手!","#f87171");sBad();combo=0;upd();return;
  }
  tk.used=true;hits++;
  if(Math.abs(bd)<=75){
    combo++;if(combo>maxCombo)maxCombo=combo;
    score+=150+combo*8;
    addPop("完美 +"+(150+combo*8),"#fbbf24");
  }else{
    combo++;score+=60;
    addPop("尚可 +60","#a3e635");
  }
  sHand(side);
  if(hits%16===0&&bpm<BPMAX){
    bpm=Math.min(BPMAX,bpm+4);
    addPop("提速!"+Math.round(bpm)+" BPM","#fbbf24");
  }
  upd();
}
function update(now){
  var i;
  for(i=flashes.length-1;i>=0;i--){if(now-flashes[i].t0>640)flashes.splice(i,1);}
}
function draw(now){
  var i;
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  var k=(nextBeat-now)/beatInt();
  if(k<0)k=0;if(k>1)k=1;
  var need=sideOf(n+1);
  ctx.fillStyle=need===0?"rgba(96,165,250,0.16)":"rgba(96,165,250,0.04)";
  ctx.fillRect(0,0,W/2,H);
  ctx.fillStyle=need===1?"rgba(251,191,36,0.16)":"rgba(251,191,36,0.04)";
  ctx.fillRect(W/2,0,W/2,H);
  ctx.fillStyle=need===0?LC:RC;
  ctx.font="bold 120px system-ui";ctx.textAlign="center";
  ctx.fillText(need===0?"左":"右",CX,CY-20);
  ctx.font="15px system-ui";ctx.fillStyle="#8b90b0";
  ctx.fillText(need===0?"左手 A":"右手 L",CX,CY+20);
  ctx.strokeStyle=need===0?LC:RC;
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(CX,CY,150*k+10,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=1;
  ctx.strokeStyle="rgba(232,234,246,0.15)";
  ctx.beginPath();ctx.arc(CX,CY,160,0,Math.PI*2);ctx.stroke();
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=(now-f.t0)/640;
    ctx.fillStyle=f.color;ctx.globalAlpha=1-pr;
    ctx.font="bold 20px system-ui";ctx.textAlign="center";
    ctx.fillText(f.txt,CX,CY+180-pr*28);
    ctx.globalAlpha=1;
  }
}
function toXY(cx,cy){
  var rect=cv.getBoundingClientRect();
  var x=(cx-rect.left)*W/rect.width;
  return x<W/2?0:1;
}
function onTap(cx,cy){press(toXY(cx,cy));}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();onTap(e.clientX,e.clientY);});
}else{
  cv.addEventListener("mousedown",function(e){onTap(e.clientX,e.clientY);});
  cv.addEventListener("touchstart",function(e){e.preventDefault();var t=e.changedTouches[0];onTap(t.clientX,t.clientY);},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state!=="play")start();
    return;
  }
  if(e.repeat)return;
  if(e.code==="KeyA"||e.code==="ArrowLeft"){e.preventDefault();press(0);}
  else if(e.code==="KeyL"||e.code==="ArrowRight"){e.preventDefault();press(1);}
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play"){schedule(now);update(now);}
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锁定狙击</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:760px}
canvas{display:block;width:100%;background:#151a30;border-radius:14px}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#8f7}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
button{background:#7c9cff;color:#10142a;border:0;border-radius:10px;padding:10px 24px;font-size:16px;font-family:inherit;cursor:pointer}
button:hover{background:#9ab1ff}
</style>
</head>
<body>
<h1>锁定狙击</h1>
<div id="tip">两段式狙击：先按目标单词的首字母锁定，再补完其余字母发射追踪导弹；打错会脱锁</div>
<div id="hud"></div>
<div id="wrap">
<canvas id="cv" width="760" height="470"></canvas>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<button id="ovBtn">开始游戏</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var WORDS=["hawkeye","sniper","radar","scope","target","laser","missile","turret","zoom","cross","aim","track","beacon","marker","shadow","drone","seeker","volley","barrage","quiet","steady","breath","calm","focus","gaze","optic","reticle","shot","trail","vector"];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var wrap=document.getElementById('wrap'),hud=document.getElementById('hud');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),btn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var MAXE=4,STAY=22;
var foes,missiles,buffer,locked,score,escapes,kills,spawnT,elapsed,shake,running,raf,tPrev,parts;
function fit(){var w=wrap.clientWidth||640;cv.width=w;cv.height=Math.max(340,Math.min(500,Math.round(w*0.6)));}
window.addEventListener('resize',fit);
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hudUpd(){hud.textContent='得分 '+score+'　击杀 '+kills+'　脱逃 '+escapes+'/5　目标 '+(locked>=0?'已锁定':'未锁定');}
function reset(){foes=[];missiles=[];parts=[];buffer='';locked=-1;score=0;escapes=0;kills=0;spawnT=0.3;elapsed=0;shake=0;hudUpd();}
function spawn(){
  var t=pick(WORDS);
  for(var k=0;k<foes.length;k++){if(foes[k].text===t)return;}
  var ang=rnd(0,Math.PI*2);
  foes.push({
    text:t,x:rnd(70,cv.width-140),y:rnd(40,cv.height-90),
    vx:Math.cos(ang)*rnd(18,42),vy:Math.sin(ang)*rnd(14,34),age:0
  });
}
function boom(x,y,col){for(var i=0;i<14;i++)parts.push({x:x,y:y,vx:rnd(-120,120),vy:rnd(-140,40),life:rnd(.3,.7),c:col});}
function killFoe(i){
  var f=foes[i];
  score+=20+f.text.length*4;kills++;
  boom(f.x+22,f.y+10,'#8f8f66');
  foes.splice(i,1);
  if(locked===i){locked=-1;buffer='';}else if(locked>i)locked--;
  for(var m=0;m<missiles.length;m++){if(missiles[m].ti===i)missiles[m].ti=-1;else if(missiles[m].ti>i)missiles[m].ti--;}
  hudUpd();
}
function handleChar(ch){
  if(!running)return;
  if(ch==='\b')return;
  ch=ch.toLowerCase();
  if(!/^[a-z]$/.test(ch))return;
  if(locked>=0){
    var f=foes[locked];
    if(!f){locked=-1;buffer='';return;}
    if(f.text.charAt(buffer.length)===ch){
      buffer+=ch;
      if(buffer===f.text){
        missiles.push({x:cv.width/2,y:cv.height-16,ti:locked,sp:540});
        locked=-1;buffer='';
      }
    }else{
      locked=-1;buffer='';shake=3;
    }
    hudUpd();
    return;
  }
  for(var i=0;i<foes.length;i++){
    if(foes[i].text.charAt(0)===ch){locked=i;buffer=ch;break;}
  }
  hudUpd();
}
function update(dt){
  elapsed+=dt;shake=Math.max(0,shake-dt*12);
  spawnT-=dt;
  if(spawnT<=0&&foes.length<MAXE){spawn();spawnT=1.6;}
  for(var i=foes.length-1;i>=0;i--){
    var f=foes[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.age+=dt;
    var tw=f.text.length*13+30;
    if(f.x<6){f.x=6;f.vx=Math.abs(f.vx);}
    if(f.x+tw>cv.width-6){f.x=cv.width-6-tw;f.vx=-Math.abs(f.vx);}
    if(f.y<8){f.y=8;f.vy=Math.abs(f.vy);}
    if(f.y>cv.height-46){f.y=cv.height-46;f.vy=-Math.abs(f.vy);}
    if(f.age>STAY){
      boom(f.x+22,f.y+10,'#5a6284',8);
      foes.splice(i,1);
      if(locked===i){locked=-1;buffer='';}else if(locked>i)locked--;
      for(var m=0;m<missiles.length;m++){if(missiles[m].ti===i)missiles[m].ti=-1;else if(missiles[m].ti>i)missiles[m].ti--;}
      escapes++;shake=5;hudUpd();
      if(escapes>=5){end(false);return;}
    }
  }
  for(var j=missiles.length-1;j>=0;j--){
    var ms=missiles[j];
    if(ms.ti<0||!foes[ms.ti]){
      boom(ms.x,ms.y,'#5a6284',6);
      missiles.splice(j,1);continue;
    }
    var tgt=foes[ms.ti];
    var dx=(tgt.x+22)-ms.x,dy=(tgt.y+10)-ms.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<16){
      killFoe(ms.ti);
      missiles.splice(j,1);
      continue;
    }
    ms.x+=dx/d*ms.sp*dt;ms.y+=dy/d*ms.sp*dt;
  }
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;
    if(q.life<=0)parts.splice(p,1);
  }
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  ctx.fillStyle='#2a3564';
  ctx.beginPath();ctx.arc(cv.width/2,cv.height-10,14,Math.PI,0);ctx.fill();
  ctx.font='bold 18px system-ui, sans-serif';
  for(var i=0;i<foes.length;i++){
    var f=foes[i];
    var tw=f.text.length*13+30;
    ctx.fillStyle='rgba(143,255,119,.1)';
    ctx.fillRect(f.x-6,f.y-13,tw,30);
    var isLock=i===locked;
    ctx.strokeStyle=isLock?'#ffd76a':'rgba(143,255,119,.6)';
    ctx.lineWidth=isLock?2:1;
    ctx.strokeRect(f.x-6,f.y-13,tw,30);
    if(isLock){
      ctx.strokeStyle='#ffd76a';
      ctx.beginPath();ctx.arc(f.x+tw/2-6,f.y+2,20,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(f.x+tw/2-34,f.y+2);ctx.lineTo(f.x+tw/2-14,f.y+2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(f.x+tw/2+8,f.y+2);ctx.lineTo(f.x+tw/2+26,f.y+2);ctx.stroke();
    }
    var done=isLock?buffer:'';
    var pre=f.text.slice(0,done.length);
    ctx.fillStyle='#ffd76a';ctx.fillText(pre,f.x,f.y+8);
    ctx.fillStyle=isLock?'#e8eaf6':'#8f8f66';
    ctx.fillText(f.text.slice(done.length),f.x+ctx.measureText(pre).width,f.y+8);
    ctx.font='10px system-ui, sans-serif';
    ctx.fillStyle=f.age>STAY-6?'#ff6b6b':'#5a6284';
    ctx.fillText('滞留 '+Math.max(0,STAY-f.age).toFixed(0)+'s',f.x,f.y-18);
    ctx.font='bold 18px system-ui, sans-serif';
  }
  for(var j=0;j<missiles.length;j++){
    var ms=missiles[j];
    ctx.fillStyle='#ffd76a';
    ctx.beginPath();ctx.arc(ms.x,ms.y,4,0,Math.PI*2);ctx.fill();
  }
  for(var p=0;p<parts.length;p++){
    var q=parts[p];ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
function end(win){
  running=false;
  ovT.textContent=win?'狙击任务完成':'目标脱逃过多';
  ovX.textContent='得分 '+score+'\n击杀 '+kills+'　脱逃 '+escapes+' 次\n坚持 '+Math.round(elapsed)+' 秒';
  btn.textContent='再来一局';
  ov.classList.remove('hide');
}
function start(){
  fit();reset();ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  wrap.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
bindTyping(handleChar);
btn.addEventListener('click',start);
fit();reset();
ovT.textContent='锁定狙击';
ovX.textContent='第一步：按某目标的首字母，锁定框与准星会咬住它。\n第二步：继续打完剩余字母，底部炮台将发射追踪导弹。\n打错字母会脱锁，需重新锁定；目标滞留 22 秒即脱逃，累计 5 次失败。';
btn.textContent='开始游戏';
})();
</script>
</body>
</html>

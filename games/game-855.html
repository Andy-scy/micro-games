<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砝码配平</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:14px}
.wrap{width:100%;max-width:440px}
h1{text-align:center;font-size:22px;margin:6px 0}
.tip{text-align:center;color:#8f97c0;font-size:13px;line-height:1.5;margin-bottom:10px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:10px}
.panel{background:#181d33;border:1px solid #262d52;border-radius:14px;padding:12px;margin-bottom:10px}
#balance{display:flex;align-items:flex-end;justify-content:center;gap:8px;transition:transform .45s ease;transform-origin:50% 85%}
.pan{flex:1;max-width:150px;min-height:84px;background:#232946;border:2px solid #3a4470;border-radius:10px 10px 18px 18px;padding:6px;text-align:center;font-size:12px;color:#8f97c0}
.ptag{display:inline-block;background:#1c2240;border-radius:6px;padding:2px 8px;margin:3px 2px 0;font-size:13px;color:#e8eaf6;font-weight:700}
.ptag.gold{color:#ffd668}
.bar{width:30px;height:8px;background:#3a4470;border-radius:4px;margin-bottom:38px}
#chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wchip{min-width:64px;padding:10px 6px;background:#2a3157;border:2px solid #3a4470;border-radius:12px;color:#e8eaf6;cursor:pointer;font-family:inherit;text-align:center}
.wchip:hover{background:#343d6e}
.wchip .g{font-size:17px;font-weight:800}
.wchip .st{font-size:11px;color:#8f97c0;margin-top:2px}
.wchip.l{border-color:#4f6ef7;background:#243272}
.wchip.r{border-color:#ff7b8a;background:#4a2340}
#msg{text-align:center;min-height:20px;font-size:14px;color:#4ade80;margin-top:10px}
.btn{background:#2a3157;color:#e8eaf6;border:none;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.btn.pri{background:#4f6ef7;color:#fff}
.btnrow{display:flex;justify-content:center;gap:10px}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:26px 34px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:10px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:16px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<h1>砝码配平</h1>
<p class="tip">左盘放着一个神秘重物。点击砝码轮流放入:左盘 → 右盘 → 收回。<br>用 1、3、9、27 克砝码让天平正好平衡,共 5 题。</p>
<div class="hud"><span id="hQ">第 1/5 题</span><span id="hT">用时 0 秒</span></div>
<div class="panel">
  <div id="balance">
    <div class="pan">左盘(含目标)<div id="panL"></div></div>
    <div class="bar"></div>
    <div class="pan">右盘<div id="panR"></div></div>
  </div>
</div>
<div class="panel"><div id="chips"></div></div>
<div id="msg"></div>
<div class="btnrow"><button class="btn" id="bNew">重开一局</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn pri" id="ovB">再来一局</button></div></div>
<script>
"use strict";
const WS=[1,3,9,27];
let target=0,st=[],lvl=0,usedT=[],sec=0,timer=null,over=false,lock=false;
const chipEls=[];
const chipsEl=document.getElementById("chips");
WS.forEach((w,i)=>{
  const b=document.createElement("button");
  b.className="wchip";
  b.innerHTML='<div class="g">'+w+'g</div><div class="st"></div>';
  b.addEventListener("click",()=>cycle(i));
  chipsEl.appendChild(b);chipEls.push(b);
});
function cycle(i){
  if(over||lock)return;
  st[i]=(st[i]+1)%3;
  document.getElementById("msg").textContent="";
  render();check();
}
function render(){
  const pl=document.getElementById("panL"),pr=document.getElementById("panR");
  pl.innerHTML='<span class="ptag gold">目标 '+target+'g</span>';
  pr.innerHTML="";
  let lt=target,rt=0;
  for(let i=0;i<4;i++){
    if(st[i]===1){lt+=WS[i];const t=document.createElement("span");t.className="ptag";t.textContent=WS[i]+"g";pl.appendChild(t);}
    else if(st[i]===2){rt+=WS[i];const t=document.createElement("span");t.className="ptag";t.textContent=WS[i]+"g";pr.appendChild(t);}
  }
  for(let i=0;i<4;i++){
    chipEls[i].classList.toggle("l",st[i]===1);
    chipEls[i].classList.toggle("r",st[i]===2);
    chipEls[i].querySelector(".st").textContent=st[i]===1?"左盘":(st[i]===2?"右盘":"未用");
  }
  const diff=lt-rt;
  const deg=Math.max(-8,Math.min(8,-diff*0.8));
  document.getElementById("balance").style.transform="rotate("+deg+"deg)";
}
function check(){
  let lt=target,rt=0;
  for(let i=0;i<4;i++){if(st[i]===1)lt+=WS[i];else if(st[i]===2)rt+=WS[i];}
  if(lt!==rt)return;
  lock=true;
  document.getElementById("msg").textContent="平衡!进入下一题";
  setTimeout(()=>{
    lock=false;lvl++;
    if(lvl>=5){
      over=true;clearInterval(timer);
      show("全部配平!","5 道题全部完成 · 用时 "+sec+" 秒");
    }else loadLevel();
  },900);
}
function loadLevel(){
  let t=0;
  do{t=1+Math.floor(Math.random()*40);}while(usedT.indexOf(t)>=0);
  usedT.push(t);target=t;
  st=[0,0,0,0];
  document.getElementById("hQ").textContent="第 "+(lvl+1)+"/5 题";
  document.getElementById("msg").textContent="";
  render();
}
function show(t,p){document.getElementById("ovT").textContent=t;document.getElementById("ovP").textContent=p;document.getElementById("ov").classList.remove("hide");}
function startTimer(){
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{sec++;document.getElementById("hT").textContent="用时 "+sec+" 秒";},1000);
}
function init(){
  over=false;lock=false;lvl=0;sec=0;usedT=[];
  document.getElementById("hT").textContent="用时 0 秒";
  document.getElementById("ov").classList.add("hide");
  loadLevel();startTimer();
}
document.getElementById("bNew").addEventListener("click",init);
document.getElementById("ovB").addEventListener("click",init);
init();
</script>
</body>
</html>

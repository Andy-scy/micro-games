<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极速阶段</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f87171;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f87171;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f87171}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f87171;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>极速阶段</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀 · 每过 4 根管提速升阶!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>阶段 <b id="tier">1</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">极速阶段</h2>
      <p id="ovDesc">越飞越快的地狱爬升:每穿过 4 对管道就升一个「阶段」,世界速度暴涨,缝隙同时收窄!高分属于敢在高速中保持节奏的人。穿管 +1 分,撞管坠地即结束。听到「提速」警告就稳住呼吸!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始挑战</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=70,GRAV=1480,FLAP=-380,BX=120,BR=13;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elTier=$("tier"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,popups,lines,score,best=0,tick,speed,tier,gapBase,passed;
function newPipe(x){return{x:x,gy:64+Math.random()*(GROUND-128-gapBase),gap:gapBase,passed:false};}
function reset(){
  bird={y:280,vy:0,fl:0};
  pipes=[];popups=[];lines=[];
  score=0;tick=0;speed=112;tier=1;gapBase=152;passed=0;
  pipes.push(newPipe(W+150));
  elScore.textContent="0";
  elTier.textContent="1";
}
function act(){
  if(state!=="playing")return;
  bird.vy=FLAP;bird.fl=1;
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best+" · 阶段 "+tier;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,p;
  tick+=dt;
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("高速之下没能拉起来!");return;}
  for(i=0;i<pipes.length;i++)pipes[i].x-=speed*dt;
  if(pipes[pipes.length-1].x<W-(190+speed*0.35))pipes.push(newPipe(W+24));
  if(pipes[0].x<-PW-12)pipes.shift();
  if(speed>185&&Math.random()<0.5)lines.push({x:W+10,y:Math.random()*GROUND,len:30+Math.random()*50,life:0.5});
  for(i=lines.length-1;i>=0;i--){
    lines[i].x-=(speed*2.6)*dt;lines[i].life-=dt;
    if(lines[i].life<=0||lines[i].x<-80)lines.splice(i,1);
  }
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x+PW<BX-BR){
      p.passed=true;passed++;score++;
      elScore.textContent=String(score);
      popups.push({x:BX+34,y:bird.y-26,txt:"+1",life:0.8});
      if(passed%4===0){
        tier++;
        speed=Math.min(330,speed*1.17);
        gapBase=Math.max(126,152-tier*4);
        elTier.textContent=String(tier);
        popups.push({x:W/2,y:150,txt:"阶段 "+tier+" · 提速!",life:1.4});
      }
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gap)||circleRect(BX,bird.y,BR,p.x,p.gap+p.gap,PW,GROUND-p.gap-p.gap)){
      die("极速下撞上了管道!");return;
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  ctx.fillStyle="#b91c1c";
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+p.gap,PW,GROUND-p.gy-p.gap);
  ctx.fillStyle="#f87171";
  ctx.fillRect(p.x+6,0,7,p.gy);
  ctx.fillRect(p.x+6,p.gy+p.gap,7,GROUND-p.gy-p.gap);
  ctx.fillStyle="#7f1d1d";
  ctx.fillRect(p.x-4,p.gy-13,PW+8,13);
  ctx.fillRect(p.x-4,p.gy+p.gap,PW+8,13);
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#170d10";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,200,200,0.3)";
  for(i=0;i<35;i++)ctx.fillRect((i*149)%W,(i*233)%GROUND,1.3,1.3);
  ctx.strokeStyle="rgba(248,113,113,0.45)";ctx.lineWidth=2;
  for(i=0;i<lines.length;i++){
    ctx.beginPath();
    ctx.moveTo(lines[i].x,lines[i].y);
    ctx.lineTo(lines[i].x+lines[i].len,lines[i].y);
    ctx.stroke();
  }
  for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  ctx.fillStyle="#2b1a20";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#45242e";
  var off=(tick*speed)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#fecaca";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ef4444";
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#170d10";
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f97316";
  ctx.beginPath();ctx.moveTo(BX+BR-2,bird.y);ctx.lineTo(BX+BR+8,bird.y+2);ctx.lineTo(BX+BR-2,bird.y+6);ctx.closePath();ctx.fill();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(254,202,202,"+Math.min(1,popups[i].life)+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

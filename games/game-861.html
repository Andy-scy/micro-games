<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蛙勇者过马路</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px}
h1{text-align:center;font-size:21px;margin:4px 0}
.tip{text-align:center;color:#8f97c0;font-size:12.5px;line-height:1.6;margin-bottom:8px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:8px}
.hud b{color:#fbbf24}
canvas{display:block;width:100%;max-width:420px;margin:0 auto;background:#181d33;border:1px solid #262d52;border-radius:12px}
.pad{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.pbtn{width:60px;height:42px;border:none;border-radius:10px;background:#2a3157;color:#e8eaf6;font-size:18px;font-family:inherit;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pbtn:active{background:#4f6ef7}
.btnrow{display:flex;justify-content:center;gap:10px;margin-top:8px}
.btn{background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:24px 30px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:8px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>蛙勇者过马路</h1>
<p class="tip">方向键 / WASD 或下方按钮跳跃。穿过两条马路,把对岸 5 个巢穴全部住满即获胜。<br>每只青蛙要在 40 秒内赶到,踩进空巢才算成功!</p>
<div class="hud"><span>得分 <b id="sS">0</b></span><span>生命 <b id="sL">3</b></span><span>巢穴 <b id="sH">0/5</b></span></div>
<canvas id="cv" width="420" height="560"></canvas>
<div class="pad">
<button class="pbtn" data-k="left">←</button><button class="pbtn" data-k="up">↑</button><button class="pbtn" data-k="down">↓</button><button class="pbtn" data-k="right">→</button>
</div>
<div class="btnrow"><button class="btn" id="bR">重新开始</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn" id="ovB">开始游戏</button></div></div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var CELL=40,COLS=10,ROWS=14,LOOP=540;
var sS=document.getElementById("sS"),sL=document.getElementById("sL"),sH=document.getElementById("sH");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovB=document.getElementById("ovB");
var CAR_COLORS=["#e05656","#e8a33d","#3fa66a","#4f8ef7","#b06ee0","#d05fa2","#4bb8c9"];
var lanes,homes,frog,score,lives,filled,timer,bestRow,deadT,state,gt=0;
var moving=false,mx0=0,my0=0,tx0=0,ty0=0,mt=0;
function rnd(a,b){return a+Math.random()*(b-a);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeLane(r,alt){
  var dir=alt%2===0?1:-1;
  var speed=rnd(45,105)*(1+filled*0.05);
  var x0=rnd(0,LOOP),cars=[],i;
  for(i=0;i<3;i++)cars.push({x:(x0+i*180+rnd(-35,35)+LOOP)%LOOP,w:rnd(46,80),c:CAR_COLORS[(r+i)%CAR_COLORS.length]});
  return{r:r,dir:dir,speed:speed,cars:cars};
}
function buildLanes(){
  lanes=[];var r;
  for(r=1;r<=5;r++)lanes.push(makeLane(r,r));
  for(r=7;r<=11;r++)lanes.push(makeLane(r,r-6));
}
function resetFrog(){
  frog={c:5,r:13,x:5.5*CELL,y:13*CELL};
  bestRow=13;timer=40;moving=false;
}
function updHud(){sS.textContent=score;sL.textContent=lives;sH.textContent=filled+"/5";}
function reset(){score=0;lives=3;filled=0;deadT=0;homes=[];var i;for(i=0;i<5;i++)homes.push({x:42+i*84,filled:false});buildLanes();resetFrog();updHud();}
function show(t,p,btn){ovT.textContent=t;ovP.textContent=p;ovB.textContent=btn||"再来一局";ov.classList.remove("hide");}
function start(){reset();state="play";ov.classList.add("hide");}
function die(msg){
  deadT=0.6;moving=false;lives--;updHud();
  if(lives<=0){state="over";show("游戏结束",msg+" 最终得分 "+score+",住满 "+filled+"/5 个巢穴。");}
}
function arrive(){
  if(frog.r!==0)return;
  var ok=false,h;
  for(h=0;h<5;h++){
    if(!homes[h].filled&&Math.abs(frog.x-homes[h].x)<20){homes[h].filled=true;filled++;score+=200+Math.floor(timer*5);ok=true;break;}
  }
  if(!ok){die("扑通!掉进了河里。");return;}
  updHud();
  if(filled>=5){state="over";show("大功告成!","5 个巢穴全部住满,蛙村感谢你!最终得分 "+score+"。");return;}
  buildLanes();resetFrog();
}
function hop(d){
  if(state!=="play"||moving||deadT>0)return;
  var c=frog.c,r=frog.r;
  if(d==="left")c--;else if(d==="right")c++;else if(d==="up")r--;else r++;
  c=Math.max(0,Math.min(COLS-1,c));r=Math.max(0,Math.min(ROWS-1,r));
  if(c===frog.c&&r===frog.r)return;
  frog.c=c;frog.r=r;
  mx0=frog.x;my0=frog.y;tx0=(c+0.5)*CELL;ty0=r*CELL;mt=0;moving=true;
}
function update(dt){
  if(state!=="play")return;
  if(deadT>0){deadT-=dt;if(deadT<=0)resetFrog();return;}
  timer-=dt;
  if(timer<=0){die("时间耗尽!");return;}
  var ln,i,car,cx,cy;
  for(i=0;i<lanes.length;i++){
    ln=lanes[i];
    for(car=0;car<ln.cars.length;car++){
      var c2=ln.cars[car];
      c2.x=(c2.x+ln.dir*ln.speed*dt+LOOP)%LOOP;
      cx=c2.x-60;cy=ln.r*CELL;
      if(Math.abs(cx+c2.w/2-frog.x)<c2.w/2+11&&frog.y+34>cy+4&&frog.y+8<cy+36){die("被车撞了!");return;}
    }
  }
  if(moving){
    mt+=dt/0.12;
    if(mt>=1){mt=1;moving=false;}
    frog.x=mx0+(tx0-mx0)*mt;frog.y=my0+(ty0-my0)*mt;
    if(!moving){
      if(frog.r<bestRow){score+=(bestRow-frog.r)*10;bestRow=frog.r;updHud();}
      arrive();
    }
  }
}
function drawFrog(x,y){
  ctx.fillStyle="#5ad469";
  ctx.beginPath();ctx.ellipse(x,y+22,12,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2f7d3f";
  ctx.beginPath();ctx.arc(x-6,y+11,5,0,Math.PI*2);ctx.arc(x+6,y+11,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#0d1730";
  ctx.beginPath();ctx.arc(x-6,y+10,2,0,Math.PI*2);ctx.arc(x+6,y+10,2,0,Math.PI*2);ctx.fill();
}
function draw(){
  var r,i,ln,car,cx,cy;
  for(r=0;r<ROWS;r++){
    var col=r===0?"#152a4e":(r===6||r>=12?"#1e3b26":"#232741");
    ctx.fillStyle=col;ctx.fillRect(0,r*CELL,420,CELL);
  }
  ctx.strokeStyle="#3a4470";ctx.lineWidth=2;ctx.setLineDash([14,18]);
  for(i=0;i<lanes.length;i++){ln=lanes[i];ctx.beginPath();ctx.moveTo(0,ln.r*CELL+20);ctx.lineTo(420,ln.r*CELL+20);ctx.stroke();}
  ctx.setLineDash([]);
  for(i=0;i<lanes.length;i++){
    ln=lanes[i];cy=ln.r*CELL;
    for(car=0;car<ln.cars.length;car++){
      var c3=ln.cars[car];cx=c3.x-60;
      if(cx>420||cx+c3.w<0)continue;
      ctx.fillStyle=c3.c;rr(cx+2,cy+6,c3.w-4,28,7);ctx.fill();
      ctx.fillStyle="rgba(20,24,48,.55)";rr(cx+c3.w/2-7,cy+11,14,8,3);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.75)";
      if(ln.dir>0)ctx.fillRect(cx+c3.w-7,cy+11,3,7);else ctx.fillRect(cx+4,cy+11,3,7);
    }
  }
  for(i=0;i<5;i++){
    var h2=homes[i];
    ctx.fillStyle="#0d1730";ctx.beginPath();ctx.arc(h2.x,20,17,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=h2.filled?"#4f6ef7":"#31407a";ctx.lineWidth=2;ctx.stroke();
    if(h2.filled)drawFrog(h2.x,2);
  }
  if(deadT<=0||Math.floor(gt*12)%2===0)drawFrog(frog.x,frog.y);
  ctx.fillStyle="#0d1730";ctx.fillRect(0,0,420,5);
  ctx.fillStyle=timer<10?"#e05656":"#43d17c";ctx.fillRect(0,0,420*Math.max(0,timer/40),5);
  if(state==="ready"){
    ctx.fillStyle="rgba(7,9,22,.6)";ctx.fillRect(0,200,420,120);
    ctx.fillStyle="#e8eaf6";ctx.font="bold 22px system-ui";ctx.textAlign="center";
    ctx.fillText("点击「开始游戏」出发",210,255);
    ctx.font="13px system-ui";ctx.fillStyle="#aab2dd";ctx.fillText("↑ 前进 · ←→ 移动 · ↓ 后退",210,285);
  }
}
var last=0;
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  if(!(dt>0))dt=0.016;
  gt+=dt;update(dt);draw();
  requestAnimationFrame(loop);
}
var KM={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
window.addEventListener("keydown",function(e){
  var k=KM[e.key];
  if(k){e.preventDefault();hop(k);}
});
var btns=document.querySelectorAll(".pbtn"),bi;
for(bi=0;bi<btns.length;bi++){
  (function(b){
    b.addEventListener("pointerdown",function(e){e.preventDefault();hop(b.getAttribute("data-k"));});
  })(btns[bi]);
}
document.getElementById("bR").addEventListener("click",start);
ovB.addEventListener("click",start);
reset();state="ready";
show("蛙勇者过马路","帮助小青蛙穿过两条车流滚滚的马路,把对岸 5 个巢穴全部住满。每只青蛙限时 40 秒,共有 3 条生命。","开始游戏");
requestAnimationFrame(loop);
</script>
</body>
</html>

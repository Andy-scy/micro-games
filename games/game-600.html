body{margin:0;min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center}

#msg{text-align:center;font-size:13px;color:#ff9f43;min-height:18px;margin-top:4px}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.93);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px;z-index:5}

#ov p{margin:0;font-size:14px;color:#c3c9e8;line-height:1.8;white-space:pre-line}
#ov button{margin-top:8px;padding:10px 36px;font-size:16px;border:none;border-radius:999px;background:#ffd166;color:#1a1d33;font-weight:bold;cursor:pointer;font-family:inherit}

<body>
<h1>蜂巢拼词</h1>
<p id="tip">用蜂巢里的 7 个字母拼单词:至少 4 个字母 且必须包含中心蓝色字母 · 字母可重复使用 · 达到目标词数即通关,集齐 7 字母的词有大奖</p>
<div id="wrap">
<div id="hud"><span>得分 <b id="score">0</b>/<b id="target">0</b></span><span>找到 <b id="cnt">0</b>/<b id="total">0</b> 词</span><span>剩余 <b id="time">180</b> 秒</span></div>

<div id="hive"></div>
<div id="input">_</div>
<div id="act"><button id="delB">删除</button><button id="mixB">打乱</button><button id="go">提交</button></div>
<div id="found"></div>
<div id="msg"></div>
<div id="ov"><h2 id="ovT">蜂巢拼词</h2><p id="ovP">七字母蜂巢 越长越值钱
中心字母必须出现
点击蜂巢或用键盘拼词</p><button id="ovB">开始拼词</button></div>

<script>

var CORE = "eariotnsl";
var OUTER = "eariotnslcudpmhgbfywk".split("");
var TOTAL = 180;
var hiveEl = document.getElementById("hive");
var inputEl = document.getElementById("input");
var scoreEl = document.getElementById("score");
var targetEl = document.getElementById("target");
var cntEl = document.getElementById("cnt");
var totalEl = document.getElementById("total");
var timeEl = document.getElementById("time");
var fillEl = document.getElementById("fill");
var foundEl = document.getElementById("found");
var msgEl = document.getElementById("msg");
var ov = document.getElementById("ov");
var ovT = document.getElementById("ovT");
var ovP = document.getElementById("ovP");
var ovB = document.getElementById("ovB");
var bank = [], center = "", outers = [], set = [], pool = [];
var typed = "", score = 0, found = [];
var playing = false, timeLeft = TOTAL, lastTs = 0, rafId = 0;

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pointsFor(w) {
  var p = w.length === 4 ? 4 : (w.length === 5 ? 10 : (w.length === 6 ? 15 : 20));
  var all = true;
  for (var i = 0; i < set.length; i++) if (w.indexOf(set[i]) < 0) all = false;
  if (all) p += 20;
  return p;
}

function generate() {
  var best = null;
  for (var t = 0; t < 400; t++) {
    var c = CORE[Math.floor(Math.random() * CORE.length)];
    var bag = OUTER.slice();
    shuffle(bag);
    var s = [c];
    for (var i = 0; i < 6; i++) s.push(bag[i]);
    var words = [];
    for (var w = 0; w < bank.length; w++) {
      var word = bank[w];
      if (word.length < 4) continue;
      if (word.indexOf(c) < 0) continue;
      var ok = true;
      for (var k = 0; k < word.length; k++) {
        if (s.indexOf(word[k]) < 0) { ok = false; break; }
      }
      if (ok) words.push(word);
    }
    if (!best || words.length > best.words.length) best = { set: s, words: words };
    if (words.length >= 14) break;
  }
  return best;
}

function newHive() {
  var g = generate();
  set = g.set;
  center = set[0];
  outers = set.slice(1);
  pool = g.words;
  shuffle(outers);
  typed = "";
  score = 0;
  found = [];
  renderHive();
  renderInfo();
  foundEl.textContent = "…";
}

function renderHive() {
  hiveEl.innerHTML = "";
  var cb = document.createElement("button");
  cb.id = "hc";
  cb.className = "hex";
  cb.style.left = "91px";
  cb.style.top = "79px";
  cb.textContent = center.toUpperCase();
  cb.onclick = function () { addCh(center); };
  hiveEl.appendChild(cb);
  var pos = [[96, 2], [167, 43], [167, 125], [96, 166], [25, 125], [25, 43]];
  for (var i = 0; i < outers.length; i++) {
    (function (idx) {
      var b = document.createElement("button");
      b.className = "hex";
      b.style.left = pos[idx][0] + "px";
      b.style.top = pos[idx][1] + "px";
      b.textContent = outers[idx].toUpperCase();
      b.onclick = function () { addCh(outers[idx]); };
      hiveEl.appendChild(b);
    })(i);
  }
}

function renderInfo() {
  var need = Math.max(4, Math.ceil(pool.length * 0.6));
  targetEl.textContent = need;
  totalEl.textContent = pool.length;
  cntEl.textContent = found.length;
  scoreEl.textContent = score;
  inputEl.textContent = typed.length ? typed.toUpperCase() : "_";
}

function addCh(ch) {
  if (!playing) return;
  if (typed.length < 10) {
    typed += ch;
    renderInfo();
  }
}

function delCh() {
  if (!playing) return;
  typed = typed.slice(0, -1);
  renderInfo();
}

function mixB() {
  if (!playing) return;
  shuffle(outers);
  renderHive();
}

function submit() {
  if (!playing) return;
  if (typed.length < 4) { say("至少 4 个字母"); return; }
  if (typed.indexOf(center) < 0) { say("必须包含中心字母 " + center.toUpperCase()); return; }
  if (pool.indexOf(typed) < 0) { say("词库里没有 " + typed.toUpperCase()); return; }
  if (found.indexOf(typed) >= 0) { say("已经找过这个词"); return; }
  var isPangram = true;
  for (var i = 0; i < set.length; i++) {
    if (typed.indexOf(set[i]) < 0) isPangram = false;
  }
  var pts = pointsFor(typed);
  found.push(typed);
  score += pts;
  foundEl.textContent = found.slice().sort().join(" · ");
  msgEl.textContent = typed.toUpperCase() + " +" + pts + (isPangram ? " 七星全中!" : "");
  typed = "";
  renderInfo();
  var need = Math.max(4, Math.ceil(pool.length * 0.6));
  if (found.length >= need || found.length === pool.length) {
    win();
  }
}

function say(m) {
  msgEl.textContent = m;
  setTimeout(function () { if (msgEl.textContent === m) msgEl.textContent = ""; }, 1200);
}

function loop(ts) {
  if (!playing) return;
  if (!lastTs) lastTs = ts;
  timeLeft -= (ts - lastTs) / 1000;
  lastTs = ts;
  if (timeLeft <= 0) {
    timeLeft = 0;
    playing = false;
    var need = Math.max(4, Math.ceil(pool.length * 0.6));
    ovT.textContent = "时间到";
    ovP.textContent = "找到 " + found.length + "/" + pool.length + " 词(目标 " + need + ")\n得分 " + score;
    ovB.textContent = "再来一局";
    ov.classList.remove("hide");
    return;
  }
  timeEl.textContent = Math.ceil(timeLeft);
  fillEl.style.width = (timeLeft / TOTAL * 100) + "%";
  rafId = requestAnimationFrame(loop);
}

function win() {
  playing = false;
  cancelAnimationFrame(rafId);
  ovT.textContent = "蜂巢大师!";
  ovP.textContent = "找到 " + found.length + "/" + pool.length + " 个单词\n得分 " + score;
  ovB.textContent = "再来一局";
  ov.classList.remove("hide");
}

function start() {
  playing = true;
  timeLeft = TOTAL;
  lastTs = 0;
  msgEl.textContent = "";
  ov.classList.add("hide");
  newHive();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

document.getElementById("delB").onclick = delCh;
document.getElementById("mixB").onclick = mixB;
document.getElementById("go").onclick = submit;
ovB.onclick = start;
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") submit();
  else if (e.key === "Backspace") delCh();
  else {
    var k = e.key.toLowerCase();
    if (k.length === 1 && k >= "a" && k <= "z" && set.indexOf(k) >= 0) addCh(k);
  }
});

(function init() {
  var seen = {};
  for (var i = 0; i < BANK.length; i++) {
    if (!seen[BANK[i]]) { seen[BANK[i]] = true; bank.push(BANK[i]); }
  }
})();

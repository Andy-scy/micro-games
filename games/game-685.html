<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红泡行动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:460px}
h1{font-size:24px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:10px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:12px}
.big{font-size:17px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>红泡行动</h1>
  <p class="tips">混色泡泡不断上浮,只准戳破红色的!戳到别的颜色或放走红泡都会损失 1 条生命,坚持越久分数越高。</p>
  <div class="card">
    <div class="row">
      <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
      <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
      <div class="stat"><div class="mut">连击</div><div class="big" id="cb">x1</div></div>
      <div class="stat"><div class="mut">时间</div><div class="big" id="tm">0 秒</div></div>
    </div>
  </div>
  <div class="card"><canvas id="cv" width="420" height="520"></canvas></div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">红泡行动</h2><p id="ovp">玩法说明:<br>· 场上会升起红、蓝、黄三种泡泡,只准戳红色<br>· 戳中红泡 +10 分并可叠连击倍率<br>· 戳到蓝色或黄色 -1 条生命<br>· 红泡飘出顶部未被打掉同样 -1 条生命<br>· 共 3 条生命,速度会越来越快,坚持就是胜利</p><button class="btn" id="obtn">开始行动</button></div></div>
<script>
'use strict';
var W=420,H=520;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var bubbles=[],parts=[],floats=[];
var score=0,lives=3,combo=0,comboT=0,elapsed=0;
var spawnT=0,running=false,lastT=0,flashT=0;
var DEFS=[
  {c:'#ff5c5c',red:true,w:0.34},
  {c:'#4da3ff',red:false,w:0.33},
  {c:'#ffd166',red:false,w:0.33}
];
function rnd(a,b){return a+Math.random()*(b-a)}
function $i(id){return document.getElementById(id)}
function upd(){
  $i('sc').textContent=score;
  var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';
  $i('hp').textContent=h;
  $i('cb').textContent='x'+Math.min(5,1+Math.floor(combo/4));
  $i('tm').textContent=Math.floor(elapsed)+' 秒';
}
function reset(){
  bubbles=[];parts=[];floats=[];
  score=0;lives=3;combo=0;comboT=0;elapsed=0;spawnT=0;flashT=0;
  upd();
}
function spawn(){
  var roll=Math.random(),red=roll<DEFS[0].w;
  var c=red?DEFS[0].c:(roll<0.67?DEFS[1].c:DEFS[2].c);
  bubbles.push({x:rnd(34,W-34),y:H+26,r:red?rnd(16,24):rnd(17,26),
    vy:-(rnd(50,85)+elapsed*0.55),
    sw:rnd(0,6.28),sp:rnd(1.2,2.4),amp:rnd(8,22),red:red,c:c});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,life:0.9})}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=rnd(0,6.28),s=rnd(50,170);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(2,5),c:c,life:rnd(0.3,0.6)});}
}
function update(dt){
  if(!running)return;
  elapsed+=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  if(flashT>0)flashT-=dt;
  spawnT-=dt;
  if(spawnT<=0){
    spawn();
    spawnT=Math.max(0.32,0.85-elapsed*0.008);
  }
  var i;
  for(i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i];
    b.y+=b.vy*dt;b.sw+=b.sp*dt;b.x+=Math.sin(b.sw)*b.amp*dt;
    if(b.x<b.r)b.x=b.r;if(b.x>W-b.r)b.x=W-b.r;
    if(b.y<-b.r-4){
      bubbles.splice(i,1);
      if(b.red){hurt('放走红泡!');}
    }
  }
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.y-=40*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  upd();
}
function hurt(msg){
  lives--;combo=0;flashT=0.35;
  addFloat(W/2,120,msg,'#ff5c5c');
  if(lives<=0){
    lives=0;running=false;
    $i('ovt').textContent='行动失败!';
    $i('ovp').innerHTML='最终得分:<b>'+score+'</b><br>坚持时间:'+Math.floor(elapsed)+' 秒';
    $i('obtn').textContent='再来一局';
    $i('overlay').classList.remove('hide');
  }
  upd();
}
function drawBubble(x,y,r,c,alpha){
  ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=c;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();
  ctx.beginPath();ctx.arc(x-r*0.32,y-r*0.32,r*0.26,0,6.2832);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141b3c');g.addColorStop(1,'#0d1126');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    drawBubble(b.x,b.y,b.r,b.c,1);
    if(b.red){
      ctx.font='bold 13px system-ui';ctx.textAlign='center';
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.fillText('戳我',b.x,b.y+b.r+14);
    }
  }
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fillStyle=p.c;ctx.fill();ctx.globalAlpha=1;}
  ctx.font='bold 15px system-ui';ctx.textAlign='center';
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}
  if(flashT>0){
    ctx.globalAlpha=flashT*1.6;
    ctx.fillStyle='#ff5c5c';ctx.fillRect(0,0,W,6);ctx.fillRect(0,H-6,W,6);
    ctx.globalAlpha=1;
  }
}
function pt(e){
  var rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};
}
cv.addEventListener('pointerdown',function(e){
  if(!running)return;
  var p=pt(e),hit=-1;
  for(var i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i],dx=p.x-b.x,dy=p.y-b.y;
    if(dx*dx+dy*dy<=(b.r+7)*(b.r+7)){hit=i;break;}
  }
  if(hit<0)return;
  var b=bubbles[hit];
  bubbles.splice(hit,1);
  if(b.red){
    combo++;comboT=1.6;
    var mult=Math.min(5,1+Math.floor(combo/4));
    var gain=10*mult;
    score+=gain;
    addFloat(b.x,b.y,'+'+gain,'#51d88a');
    burst(b.x,b.y,b.c,10);
  }else{
    burst(b.x,b.y,b.c,8);
    hurt('戳错颜色了!');
  }
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>孤塔传奇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none;cursor:crosshair}
.sbtn{border:0;border-radius:8px;padding:10px 4px;font-size:12px;background:#232a4a;color:#e8eaf6;cursor:pointer;flex:1;font-weight:700}
.sbtn.dis{opacity:.35;cursor:default}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>孤塔传奇</h1>
  <p class="tips">全场只允许建一座塔!先为它选个风水宝地,再用三条升级路线把它养成传奇:攻击、攻速、射程,鱼与熊掌如何兼得?</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">金币</div><div class="big" id="gd">0</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="lf">0</div></div>
    <div class="stat"><div class="mut">波次</div><div class="big" id="wv">0/15</div></div>
    <div class="stat"><div class="mut">塔等级</div><div class="big" id="tv">未建</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="480" height="360"></canvas></div>
  <div class="card row">
    <button class="sbtn dis" id="uD">攻击+8</button>
    <button class="sbtn dis" id="uR">攻速+15%</button>
    <button class="sbtn dis" id="uE">射程+18</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">孤塔传奇</h2><p id="ovp">玩法说明:<br>· 点击道路附近空地,放置你唯一的一座塔<br>· 之后只能通过升级变强:攻击+8 / 攻速+15% / 射程+18<br>· 每条路线单独计价,越升越贵(约1.5倍递增)<br>· 位置决定一切:弯道能覆盖两段路!<br>· 第 5/10/15 波有 Boss 压阵,生命归零失败<br>· 撑过 15 波,塔成传奇!</p><button class="btn" id="obtn">择地建塔</button></div></div>
<script>
'use strict';
var W=480,H=360,CS=40;
function $i(id){return document.getElementById(id)}
var cv=$i('cv'),ctx=cv.getContext('2d');
var WPTS=[[-20,180],[120,180],[120,60],[300,60],[300,300],[500,300]];
var segs=[],PLEN=0;
function buildPath(){segs=[];PLEN=0;var i;for(i=0;i<WPTS.length-1;i++){var ax=WPTS[i][0],ay=WPTS[i][1],bx=WPTS[i+1][0],by=WPTS[i+1][1];var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy);segs.push({ax:ax,ay:ay,dx:dx/len,dy:dy/len,len:len});PLEN+=len;}}
function posAt(d){var i=0;while(i<segs.length&&d>segs[i].len){d-=segs[i].len;i++;}if(i>=segs.length)i=segs.length-1;var s=segs[i],t=Math.min(d,s.len);return{x:s.ax+s.dx*t,y:s.ay+s.dy*t};}
function dist2(x,y,s){var px=x-s.ax,py=y-s.ay,t=px*s.dx+py*s.dy;t=Math.max(0,Math.min(s.len,t));var ex=s.ax+s.dx*t-x,ey=s.ay+s.dy*t-y;return ex*ex+ey*ey;}
function blocked(c,r){var x=c*CS+CS/2,y=r*CS+CS/2,i;for(i=0;i<segs.length;i++){if(dist2(x,y,segs[i])<529)return true;}return false;}
var money=0,lives=0,kills=0,wave=0,running=false,over=false,st='place';
var enemies=[],shots=[],parts=[];
var toSpawn=[],spawnT=0,interT=0,phase='wait',banner=0;
var tower=null,dk=0,rk=0,ek=0;
function costD(){return Math.floor(50*Math.pow(1.5,dk));}
function costR(){return Math.floor(50*Math.pow(1.5,rk));}
function costE(){return Math.floor(40*Math.pow(1.5,ek));}
function tDmg(){return 12+8*dk;}
function tRate(){return 0.9/(1+0.15*rk);}
function tRange(){return 90+18*ek;}
function makeWave(n){var arr=[],i;
if(n===5||n===10||n===15){arr.push({hp:(30+22*n)*4,mhp:(30+22*n)*4,spd:26,rw:100+10*n,r:16,leak:3,boss:true});
for(i=0;i<3+n;i++)arr.push({hp:30+22*n,mhp:30+22*n,spd:40+1.6*n,rw:7+n,r:9,leak:1,boss:false});return arr;}
var cnt=5+n,hp=30+22*n,spd=40+1.6*n,rw=7+n;
for(i=0;i<cnt;i++)arr.push({hp:hp,mhp:hp,spd:spd,rw:rw,r:9,leak:1,boss:false});return arr;}
function burst(x,y,c,n){var k;for(k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*110;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.5+Math.random()*2.5,c:c,life:0.35+Math.random()*0.3});}}
function reset(){money=60;lives=8;kills=0;wave=0;enemies=[];shots=[];parts=[];toSpawn=[];spawnT=0;interT=0;phase='wait';banner=0;over=false;st='place';tower=null;dk=0;rk=0;ek=0;uiUp();hud();}
function hud(){$i('gd').textContent=money;$i('lf').textContent=lives;$i('wv').textContent=wave+'/15';
$i('tv').textContent=tower?(dk+rk+ek)+'级':'未建';uiUp();}
function uiUp(){var on=tower&&running&&!over;
$i('uD').classList.toggle('dis',!on||money<costD());
$i('uR').classList.toggle('dis',!on||money<costR());
$i('uE').classList.toggle('dis',!on||money<costE());
$i('uD').textContent='攻击+8 '+costD()+'金';
$i('uR').textContent='攻速+15% '+costR()+'金';
$i('uE').textContent='射程+18 '+costE()+'金';}
function acquire(){var best=null,bd=-1,i;for(i=0;i<enemies.length;i++){var e=enemies[i];if(e.hp<=0||e.d>=PLEN)continue;var p=posAt(e.d);var dx=p.x-tower.x,dy=p.y-tower.y;if(dx*dx+dy*dy<=tower.range*tower.range&&e.d>bd){bd=e.d;best=e;}}return best;}
function gameOver(win){over=true;running=false;uiUp();
if(win){$i('ovt').textContent='塔之传奇!';$i('ovp').innerHTML='十五波敌军全部击退!<br>最终等级:<b>'+(dk+rk+ek)+'级</b>(攻+'+dk+' 速+'+rk+' 程+'+ek+')<br>总击杀:<b>'+kills+'</b>';}
else{$i('ovt').textContent='孤塔陨落…';$i('ovp').innerHTML='止步于第 '+wave+' 波 · 等级 '+(dk+rk+ek)+'<br>总击杀:<b>'+kills+'</b><br>提示:弯道口的塔一夫当关!';}
$i('obtn').textContent='再来一局';$i('overlay').classList.remove('hide');}
function update(dt){var i;
for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
if(banner>0)banner-=dt;
if(!running||st==='place')return;
if(phase==='wait'){interT-=dt;if(interT<=0){wave++;toSpawn=makeWave(wave);spawnT=0.4;phase='spawn';banner=1.2;hud();}}
else{if(toSpawn.length>0){spawnT-=dt;if(spawnT<=0){var nx=toSpawn.shift();enemies.push(nx);spawnT=nx.boss?1.4:0.7;}}}
for(i=enemies.length-1;i>=0;i--){var e=enemies[i];e.d+=e.spd*dt;
if(e.d>=PLEN){var lp=posAt(PLEN-4);lives-=e.leak;burst(lp.x,lp.y,'#ff6b6b',12);enemies.splice(i,1);hud();if(lives<=0){lives=0;hud();gameOver(false);return;}continue;}}
tower.cool-=dt;
if(tower.cool<=0){var tg=acquire();if(tg){var pp=posAt(tg.d);tower.ang=Math.atan2(pp.y-tower.y,pp.x-tower.x);tower.cool=tower.rate;shots.push({x:tower.x,y:tower.y,tg:tg,lx:pp.x,ly:pp.y,spd:400,dmg:tower.dmg});}else tower.cool=0.06;}
for(i=shots.length-1;i>=0;i--){var s=shots[i];var tx=s.lx,ty=s.ly;
if(s.tg&&s.tg.hp>0){var p2=posAt(Math.min(s.tg.d,PLEN));s.lx=p2.x;s.ly=p2.y;tx=p2.x;ty=p2.y;}
var dx=tx-s.x,dy=ty-s.y,d=Math.sqrt(dx*dx+dy*dy),sp=s.spd*dt;
if(d<=sp+3){if(s.tg&&s.tg.hp>0)s.tg.hp-=s.dmg;shots.splice(i,1);}
else{s.x+=dx/d*sp;s.y+=dy/d*sp;}}
for(i=enemies.length-1;i>=0;i--){var e2=enemies[i];if(e2.hp<=0){var p3=posAt(Math.min(e2.d,PLEN));kills++;money+=e2.rw;burst(p3.x,p3.y,'#ffd166',9);enemies.splice(i,1);}}
if(phase==='spawn'&&toSpawn.length===0&&enemies.length===0){money+=40+6*wave;hud();if(wave>=15){gameOver(true);return;}phase='wait';interT=3;}
uiUp();}
function draw(){var i;
var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1430');g.addColorStop(1,'#0d1024');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(120,130,180,0.10)';
for(var c=0;c<12;c++)for(var r=0;r<9;r++){if(blocked(c,r))continue;ctx.fillRect(c*CS+CS/2-1,r*CS+CS/2-1,2,2);}
ctx.lineCap='round';ctx.lineJoin='round';
ctx.strokeStyle='#232a4a';ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(WPTS[0][0],WPTS[0][1]);for(i=1;i<WPTS.length;i++)ctx.lineTo(WPTS[i][0],WPTS[i][1]);ctx.stroke();
ctx.strokeStyle='#2c3352';ctx.lineWidth=20;ctx.stroke();
ctx.fillStyle='#4cc9f0';ctx.beginPath();ctx.moveTo(-2,168);ctx.lineTo(14,180);ctx.lineTo(-2,192);ctx.closePath();ctx.fill();
var gp=posAt(PLEN-26);
ctx.fillStyle='#7ee08a';ctx.fillRect(gp.x-13,gp.y-16,26,32);
ctx.fillStyle='#0f1220';ctx.fillRect(gp.x-5,gp.y-4,10,20);
if(tower){
ctx.globalAlpha=0.07;ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(tower.x,tower.y,tower.range,0,6.28);ctx.fill();ctx.globalAlpha=1;
ctx.strokeStyle='#ffd166';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(tower.x,tower.y,tower.range,0,6.28);ctx.stroke();ctx.setLineDash([]);
var lv=dk+rk+ek;
ctx.fillStyle='#2b3358';ctx.beginPath();ctx.arc(tower.x,tower.y,15,0,6.28);ctx.fill();
ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.beginPath();ctx.arc(tower.x,tower.y,15,0,6.28);ctx.stroke();
var k;for(k=0;k<Math.min(lv,10);k++){ctx.strokeStyle='rgba(255,209,102,.5)';ctx.beginPath();ctx.arc(tower.x,tower.y,19+k*3.5,0,6.28);ctx.stroke();}
ctx.strokeStyle='#ffe9a8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tower.x,tower.y);ctx.lineTo(tower.x+Math.cos(tower.ang)*14,tower.y+Math.sin(tower.ang)*14);ctx.stroke();}
for(i=0;i<enemies.length;i++){var e=enemies[i];var ep=posAt(Math.min(e.d,PLEN));
ctx.fillStyle=e.boss?'#ff6b6b':'#ff9f68';ctx.beginPath();ctx.arc(ep.x,ep.y,e.r,0,6.28);ctx.fill();
ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#402030';ctx.fillRect(ep.x-11,ep.y-e.r-9,22,4);
ctx.fillStyle='#7ee08a';ctx.fillRect(ep.x-11,ep.y-e.r-9,22*Math.max(0,e.hp/e.mhp),4);}
for(i=0;i<shots.length;i++){var s2=shots[i];ctx.fillStyle='#ffe9a8';ctx.fillRect(s2.x-2,s2.y-2,4,4);}
for(i=0;i<parts.length;i++){var p4=parts[i];ctx.globalAlpha=Math.max(0,p4.life*2.4);ctx.fillStyle=p4.c;ctx.beginPath();ctx.arc(p4.x,p4.y,p4.r,0,6.28);ctx.fill();}
ctx.globalAlpha=1;
if(running&&!over&&st==='place'){ctx.fillStyle='#ffd166';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('点击空地,放置你的唯一之塔',W/2,H/2);ctx.font='12px system-ui';ctx.textAlign='left';}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();
var rc=cv.getBoundingClientRect();var x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;
if(!running||over||st!=='place')return;
var c=Math.floor(x/CS),r=Math.floor(y/CS);if(c<0||c>=12||r<0||r>=9)return;
if(blocked(c,r))return;
tower={c:c,r:r,x:c*CS+CS/2,y:r*CS+CS/2,cool:0,dmg:tDmg(),rate:tRate(),range:tRange(),ang:0};
st='defend';interT=2.5;burst(tower.x,tower.y,'#ffd166',12);hud();});
$i('uD').addEventListener('click',function(){if(!tower||!running||over||money<costD())return;money-=costD();dk++;tower.dmg=tDmg();burst(tower.x,tower.y,'#ff9f68',8);hud();});
$i('uR').addEventListener('click',function(){if(!tower||!running||over||money<costR())return;money-=costR();rk++;tower.rate=tRate();burst(tower.x,tower.y,'#7ad7ff',8);hud();});
$i('uE').addEventListener('click',function(){if(!tower||!running||over||money<costE())return;money-=costE();ek++;tower.range=tRange();burst(tower.x,tower.y,'#b28dff',8);hud();});
$i('obtn').addEventListener('click',function(){$i('overlay').classList.add('hide');reset();running=true;});
buildPath();reset();
var lastT=0;
function loop(t){var dt=(t-lastT)/1000;lastT=t;if(!(dt>0)||dt>0.05)dt=0.016;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指令风暴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#f0abfc;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f0abfc;font-size:16px}
.gbtn{background:#3d1246;color:#f0abfc;border:1px solid #f0abfc;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#f0abfc;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.colorRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:380px;margin:0 auto 10px;touch-action:manipulation}
.pad{aspect-ratio:1/0.8;border-radius:12px;cursor:pointer;transition:transform .06s,box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.94)}
.c0{background:#3d1114;border:2px solid #991b1b}.c0.lit{background:#ef4444;box-shadow:0 0 22px rgba(239,68,68,.85)}
.c1{background:#0d2f1a;border:2px solid #166534}.c1.lit{background:#22c55e;box-shadow:0 0 22px rgba(34,197,94,.85)}
.c2{background:#122a52;border:2px solid #1d4ed8}.c2.lit{background:#3b82f6;box-shadow:0 0 22px rgba(59,130,246,.85)}
.c3{background:#39300a;border:2px solid #a16207}.c3.lit{background:#eab308;box-shadow:0 0 22px rgba(234,179,8,.85)}
.act{max-width:380px;margin:0 auto;height:74px;border-radius:14px;background:#2a1145;border:2px solid #7e22ce;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;letter-spacing:6px;color:#9b6bbf;cursor:pointer;transition:box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none}
.act .word{color:#f0abfc}
.act.lit{background:#c026d3;box-shadow:0 0 30px rgba(192,38,211,.9)}
.act.lit .word{color:#fff}
.act small{font-size:12px;color:#7a5a99;letter-spacing:1px;margin-left:10px}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#f0abfc;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#f0abfc;color:#3d1246;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>指令风暴</h1>
  <p class="hint">混编指令版记忆序列:序列里既有四色闪光,也会突然插入「跳!」「拍!」「转!」等动作指令。颜色点对应色板,动作指令按下方大按钮(或空格键)。类型混着记,大脑直接过载。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>序列长 <b id="len">0</b></span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="colorRow" id="colorRow">
    <div class="pad c0" data-t="c" data-i="0"></div>
    <div class="pad c1" data-t="c" data-i="1"></div>
    <div class="pad c2" data-t="c" data-i="2"></div>
    <div class="pad c3" data-t="c" data-i="3"></div>
  </div>
  <div class="act" id="act"><span class="word" id="actWord">跳!</span><small>空格</small></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">指令风暴</h2>
    <p id="ovDesc">Simon 家族的体操课:一半是颜色,一半是口令。看到颜色点色板,看到「跳/拍/转」就砸大按钮。动作指令越多轮越密,手忙脚乱预警!</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg355_best",WORDS=["跳!","拍!","转!"],FREQ=[329.63,261.63,220,164.81],GAP=660,FLASH=400;
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var pads=[],act=$("act"),actWord=$("actWord"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elLen=$("len"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.26;v=v==null?0.15:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var list=$("colorRow").querySelectorAll(".pad");for(var i=0;i<list.length;i++)pads.push(list[i]);})();
function flashColor(i,ms){var el=pads[i];el.classList.add("lit");tone(FREQ[i]);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||FLASH));}
function flashAct(ms){act.classList.add("lit");actWord.textContent=WORDS[(Math.random()*WORDS.length)|0];tone(130,0.24,0.22,"square");
timers.push(setTimeout(function(){act.classList.remove("lit");},ms||FLASH));}
function clearLit(){for(var i=0;i<4;i++)pads[i].classList.remove("lit");act.classList.remove("lit");}
function rndStep(){if(seq.length>=2&&Math.random()<0.3){return{t:"a"};}
return{t:"c",i:(Math.random()*4)|0};}
function updateHud(){elLv.textContent=level;elLen.textContent=seq.length;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";setMsg("颜色 + 口令,全都算!");var i=0;(function step(){
if(i>=seq.length){state="input";pos=0;setMsg("复述整个指令流!");return;}
var s=seq[i];
if(s.t==="c")flashColor(s.i);else flashAct();
i++;timers.push(setTimeout(step,GAP));})();}
function nextRound(){seq.push(rndStep());updateHud();playSeq();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;level=0;state="wait";actWord.textContent="跳!";setMsg("");updateHud();timers.push(setTimeout(nextRound,650));}
function winStep(){level++;state="wait";setMsg("指令全接住!加一步…");updateHud();timers.push(setTimeout(nextRound,800));}
function fail(txt){clearTimers();clearLit();state="over";tone(92,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="指令漏接";
ovDesc.textContent=txt||("指令流在第 "+seq.length+" 步断了。诀窍:把动作口令在脑内翻译成一个固定音,颜色和口令分两列记。");
ovScore.style.display="block";ovScore.textContent="成功复述 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function pressColor(i){if(state!=="input")return;flashColor(i,200);
var s=seq[pos];
if(s.t==="c"&&s.i===i){pos++;if(pos>=seq.length)winStep();}else fail();}
function pressAct(){if(state!=="input")return;flashAct(200);
var s=seq[pos];
if(s.t==="a"){pos++;if(pos>=seq.length)winStep();}else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
$("colorRow").addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)pressColor(parseInt(t.dataset.i,10));});
act.addEventListener("click",pressAct);
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
if(e.key===" "){e.preventDefault();pressAct();return;}
var k=e.key;if(k==="1")pressColor(0);else if(k==="2")pressColor(1);else if(k==="3")pressColor(2);else if(k==="4")pressColor(3);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

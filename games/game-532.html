<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合成兽园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#8ac926;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#8ac926;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#8ac926}
.overlay p{color:#aab0d0;font-size:13px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#8ac926;color:#1e3305;border:none;border-radius:10px;padding:10px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
.pads{display:flex;gap:7px;margin-top:10px}
.pads button{flex:1;background:#232849;color:#c7cbe8;border:1px solid #343b6e;border-radius:10px;padding:13px 0;font-size:16px;cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none}
.pads button:active{background:#343b6e}
</style>
</head>
<body>
<div class="card">
  <h1>合成兽园</h1>
  <p class="hint">投放小兽蛋 · 点击小兽吸收相邻同级升级<br>兽园自动攻击敌人,撑过 8 波即胜;栏破 12 格则败</p>
  <div class="hud">
    <span>第 <b id="wave">1</b> 波</span>
    <span>得分 <b id="score">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="340" height="390"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">合成兽园</h2>
      <p id="ovP">小兽等级越高,兽园火力越猛\n别光合成,看好敌人的爪子!</p>
      <div class="big" id="ovS"></div>
      <button id="btn">开 始</button>
    </div>
  </div>
  <div class="pads">
    <button id="pL">◀</button>
    <button id="pD">投 放</button>
    <button id="pR">▶</button>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var COLS=4,ROWS=5,CELL=44,BX=16,BY=52;
var CCOL=['','#8d99ae','#5aa9e6','#4dd0c4','#7ed957','#f9d71c','#ff8c42','#ff5d5d'];
var grid=[],gun=1,wave=1,ehp=95,ehpMax=95,dmg=0,dmgMax=12;
var score=0,state='ready',atkT=0,hitT=0,supplyT=0,flashes=[],dmgPops=[];
function addScore(n){score+=n;$('score').textContent=score;}
function newGrid(){var g=[],r,c;for(r=0;r<ROWS;r++){g.push([]);for(c=0;c<COLS;c++)g[r].push(0);}return g;}
function lowest(c){var r;for(r=ROWS-1;r>=0;r--)if(grid[r][c]===0)return r;return -1;}
function randE(){return Math.random()<0.75?1:2;}
function dropIn(c,e){
  if(state!=='play')return;
  var r=lowest(c);
  if(r<0){dmg=Math.min(dmgMax,dmg+1);return;}
  grid[r][c]=e;
  flashes.push({r:r,c:c,t:0});
}
function mergeAt(r,c){
  var e=grid[r][c],dirs=[[1,0],[-1,0],[0,1],[0,-1]],i,hit=[];
  for(i=0;i<4;i++){
    var rr=r+dirs[i][0],cc=c+dirs[i][1];
    if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===e)hit.push([rr,cc]);
  }
  if(hit.length===0||e>=7)return false;
  for(i=0;i<hit.length;i++){grid[hit[i][0]][hit[i][1]]=0;flashes.push({r:hit[i][0],c:hit[i][1],t:0});}
  grid[r][c]=e+1;
  flashes.push({r:r,c:c,t:0});
  addScore((e+1)*15);
  return true;
}
function win(){
  state='over';
  $('ovT').textContent='兽园守住了!';
  $('ovP').textContent='八波强敌全部击退,兽园名扬四方!';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function fail(){
  state='over';
  $('ovT').textContent='兽栏被拆了';
  $('ovP').textContent='敌人的爪子太狠,撑到了第 '+wave+' 波';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function start(){
  grid=newGrid();gun=1;wave=1;ehp=95;ehpMax=95;dmg=0;score=0;
  atkT=0;hitT=0;supplyT=0;flashes=[];dmgPops=[];
  $('wave').textContent='1';$('score').textContent='0';
  $('ov').classList.add('hide');state='play';
}
$('btn').addEventListener('click',start);
function update(dt){
  var i,r,c,total;
  atkT+=dt;hitT+=dt;supplyT+=dt;
  if(supplyT>=4){supplyT=0;dropIn(Math.floor(Math.random()*COLS),randE());}
  total=0;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)total+=grid[r][c];
  if(atkT>=1.6){
    atkT=0;
    if(total>0){
      ehp-=total;
      dmgPops.push({t:0,txt:'-'+total,x:275,y:120});
      if(ehp<=0){
        wave++;
        addScore(80*wave);
        dmg=Math.max(0,dmg-4);
        if(wave>8){win();return;}
        ehpMax=50+wave*45;ehp=ehpMax;
        $('wave').textContent=String(wave);
        dmgPops.push({t:0,txt:'击退!',x:275,y:100});
      }
    }
  }
  if(hitT>=5){
    hitT=0;
    dmg=Math.min(dmgMax,dmg+wave);
    if(dmg>=dmgMax){fail();return;}
  }
  for(i=0;i<flashes.length;i++)flashes[i].t+=dt;
  var k=[];
  for(i=0;i<flashes.length;i++)if(flashes[i].t<0.35)k.push(flashes[i]);
  flashes=k;
  var k2=[];
  for(i=0;i<dmgPops.length;i++)if(dmgPops[i].t<0.9)k2.push(dmgPops[i]);
  for(i=0;i<k2.length;i++)k2[i].t+=dt;
  dmgPops=k2;
}
function clickAt(x,y){
  if(state!=='play')return;
  var c=Math.floor((x-BX)/CELL),r=Math.floor((y-BY)/CELL);
  if(r<0||r>=ROWS||c<0||c>=COLS)return;
  gun=c;
  if(grid[r][c]>0)mergeAt(r,c);
  else dropIn(c,randE());
}
cv.addEventListener('mousedown',function(e){
  var rc=cv.getBoundingClientRect();
  clickAt((e.clientX-rc.left)*340/rc.width,(e.clientY-rc.top)*390/rc.height);
});
cv.addEventListener('touchstart',function(e){
  var t=e.touches[0],rc=cv.getBoundingClientRect();
  clickAt((t.clientX-rc.left)*340/rc.width,(t.clientY-rc.top)*390/rc.height);
  e.preventDefault();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(state!=='play')return;
  if(e.keyCode===37){gun=(gun+COLS-1)%COLS;e.preventDefault();}
  else if(e.keyCode===39){gun=(gun+1)%COLS;e.preventDefault();}
  else if(e.keyCode===32||e.keyCode===40){dropIn(gun,randE());e.preventDefault();}
});
$('pL').addEventListener('click',function(){if(state==='play')gun=(gun+COLS-1)%COLS;});
$('pR').addEventListener('click',function(){if(state==='play')gun=(gun+1)%COLS;});
$('pD').addEventListener('click',function(){dropIn(gun,randE());});
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,340,390);
  ctx.fillStyle='#0b0e1a';ctx.fillRect(0,0,340,390);
  var r,c,i;
  ctx.strokeStyle='rgba(255,255,255,.06)';
  for(i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(BX+i*CELL,BY);ctx.lineTo(BX+i*CELL,BY+ROWS*CELL);ctx.stroke();}
  for(i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(BX,BY+i*CELL);ctx.lineTo(BX+COLS*CELL,BY+i*CELL);ctx.stroke();}
  if(state==='play'){
    ctx.fillStyle='rgba(138,201,38,.15)';
    ctx.fillRect(BX+gun*CELL+2,BY,CELL-4,ROWS*CELL);
  }
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    var e=grid.length?grid[r][c]:0;
    if(e>0){
      var x=BX+c*CELL+CELL/2,y=BY+r*CELL+CELL/2,rad=10+e*2;
      ctx.beginPath();ctx.arc(x,y,rad,0,7);
      ctx.fillStyle=CCOL[Math.min(e,7)];ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x-rad*0.3,y-rad*0.15,rad*0.22,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+rad*0.3,y-rad*0.15,rad*0.22,0,7);ctx.fill();
      ctx.fillStyle='#222';
      ctx.beginPath();ctx.arc(x-rad*0.3,y-rad*0.12,rad*0.1,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+rad*0.3,y-rad*0.12,rad*0.1,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.font='700 10px system-ui';ctx.textAlign='center';
      ctx.fillText(String(e),x,y+rad+8);
    }
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=f.t/0.35;
    ctx.save();ctx.globalAlpha=1-pr;
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    roundRect(BX+f.c*CELL+3,BY+f.r*CELL+3,CELL-6,CELL-6,8);ctx.stroke();
    ctx.restore();
  }
  var ex=275,ey=150;
  ctx.save();
  if(atkT>1.3)ctx.translate((Math.random()-0.5)*3,0);
  ctx.beginPath();ctx.arc(ex,ey,34,0,7);
  ctx.fillStyle='#a03e4d';ctx.fill();
  ctx.strokeStyle='#ff5d5d';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ex-12,ey-8,7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(ex+12,ey-8,7,0,7);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(ex-12,ey-6,3,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(ex+12,ey-6,3,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(ex-10,ey+16);ctx.lineTo(ex+10,ey+16);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#31406b';
  roundRect(ex-40,ey-52,80,8,4);ctx.fill();
  ctx.fillStyle='#ff5d5d';
  roundRect(ex-40,ey-52,80*Math.max(0,ehp/ehpMax),8,4);ctx.fill();
  ctx.fillStyle='#c7cbe8';
  ctx.font='12px system-ui';ctx.textAlign='center';
  ctx.fillText('敌 '+Math.max(0,Math.ceil(ehp)),ex,ey-58);
  ctx.fillStyle='#31406b';
  roundRect(240,290,70,10,5);ctx.fill();
  ctx.fillStyle='#ff8c42';
  roundRect(240,290,70*(dmg/dmgMax),10,5);ctx.fill();
  ctx.fillStyle='#c7cbe8';
  ctx.fillText('栏损 '+dmg+'/12',275,316);
  for(i=0;i<dmgPops.length;i++){
    var dp=dmgPops[i];
    ctx.save();ctx.globalAlpha=1-dp.t/0.9;
    ctx.fillStyle='#fbbf24';
    ctx.font='700 15px system-ui';ctx.textAlign='center';
    ctx.fillText(dp.txt,dp.x,dp.y-dp.t*26);
    ctx.restore();
  }
  if(state==='play'){
    ctx.fillStyle='rgba(138,201,38,.65)';
    ctx.font='12px system-ui';ctx.textAlign='left';
    ctx.fillText('火力 '+total+'/1.6秒',BX,BY-8);
  }
}
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,0.05);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

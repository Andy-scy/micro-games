<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>失落神庙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{position:relative;background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#fbbf24;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;line-height:1.5;margin-bottom:8px}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;color:#c7cbe8;margin-bottom:6px}
.hud b{color:#ffd76a;font-size:14px}
#msg{min-height:18px;text-align:center;color:#fbbf24;font-size:13px;margin-bottom:6px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.tile{height:56px;border:1px solid #2e3554;border-radius:10px;background:#1b2138;cursor:pointer;font-size:12px;color:#e8eaf6;font-family:inherit;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile .em{font-size:17px;line-height:1.25}
.tile.revealed{cursor:default;opacity:.8}
.tile.mark{background:#33221a;border-color:#a16207}
.tile.gem{background:#1f3a2c;border-color:#4ade80}
.tile.bad{background:#4a1f24;border-color:#ef4444}
.acts{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.btn{background:#2c3352;color:#e8eaf6;border:1px solid #3d4670;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.gold{background:#ffd76a;color:#4a3405;border-color:#ffe29a;font-weight:700}
.shop{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#20263f;border:1px solid #2e3554;border-radius:10px;padding:6px 10px;cursor:pointer}
.item.off{opacity:.45}
.item .nm{font-size:13px;font-weight:600}
.item .ds{font-size:11px;color:#8b90b0;margin-top:1px}
.item .pr{font-size:12.5px;color:#ffd76a;font-weight:700;white-space:nowrap}
.item .own{font-size:11px;color:#7dd3fc}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.93);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:9}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8}
.overlay .big{font-size:17px;color:#ffd76a;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>失落神庙</h1>
  <p class="hint">每轮翻开地砖:宝石入袋、骷髅清空本轮、x2 翻倍 · 见好就收点「带出宝藏」,贪心可能血本无归 · 身家 <b>6000</b> 金获胜</p>
  <div class="hud">
    <span>身家 <b id="hBank">0</b>/6000</span>
    <span>本轮袋中 <b id="hBag">0</b></span>
    <span>剩余步数 <b id="hPicks">3</b></span>
    <span>轮次 <b id="hRound">1</b></span>
  </div>
  <div id="msg"></div>
  <div id="grid"></div>
  <div class="acts">
    <button class="btn gold" id="btnOut">带出宝藏 (结算袋中金币)</button>
  </div>
  <div class="shop" id="shop"></div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">失落神庙</h2>
    <p id="ovDesc">15 块地砖下藏着宝石、骷髅陷阱、翻倍符与空砖。每翻一块宝石入袋,可随时点「带出宝藏」落袋为安;一旦踩中骷髅,本轮袋中金币全部蒸发!升级背包多翻几块、护符保留半袋、火把提前标记陷阱——富贵险中求!</p>
    <p class="big" id="ovScore"></p>
    <button id="btnGo">举火把进庙</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elBank=$("hBank"),elBag=$("hBag"),elPicks=$("hPicks"),elRound=$("hRound"),elMsg=$("msg");
var gridEl=$("grid"),btnOut=$("btnOut"),shopEl=$("shop"),ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
var WIN=6000;
var GEMS=[50,50,70,70,100,100,180,220];
var ups=[
 {nm:"探险背包",ds:"每轮步数 +1",base:160,mult:2.1,max:4},
 {nm:"古老护符",ds:"踩中陷阱保住一半袋中金",base:450,mult:1,max:1},
 {nm:"燃烧火把",ds:"每轮开局标记 1 处陷阱",base:320,mult:2.4,max:3}
];
var bank,bag,picks,dbl,roundN,tiles,revealed,marks,active,gapT,upLv,state,msgT,tileEls=[],rows=[];
function fmt(n){n=Math.floor(n);if(n>=10000)return (n/10000).toFixed(2)+"万";return String(n);}
function picksMax(){return 3+upLv[0];}
function upCost(i){return Math.floor(ups[i].base*Math.pow(ups[i].mult,upLv[i]));}
function say(t){elMsg.textContent=t;msgT=2.6;}
function shuffle(a){
  var i,j,tmp;
  for(i=a.length-1;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}
function newRound(){
  var pool=[],i;
  for(i=0;i<GEMS.length;i++)pool.push({t:"gem",v:GEMS[i]});
  for(i=0;i<4;i++)pool.push({t:"trap",v:0});
  pool.push({t:"dbl",v:0});
  for(i=0;i<2;i++)pool.push({t:"empty",v:0});
  tiles=shuffle(pool);
  revealed=[];marks=[];
  for(i=0;i<15;i++){revealed.push(false);marks.push(false);}
  bag=0;picks=picksMax();dbl=false;active=true;roundN++;
  var spots=[],cands=[],j;
  for(j=0;j<15;j++)if(tiles[j].t==="trap")cands.push(j);
  shuffle(cands);
  for(j=0;j<upLv[2]&&j<cands.length;j++)marks[cands[j]]=true;
}
function buildUI(){
  gridEl.innerHTML="";tileEls=[];
  var i;
  for(i=0;i<15;i++){
    var t=document.createElement("button");
    t.className="tile";
    t.innerHTML='<span class="em">🧱</span>';
    (function(idx){t.addEventListener("click",function(){tapTile(idx);});})(i);
    gridEl.appendChild(t);tileEls.push(t);
  }
  shopEl.innerHTML="";rows=[];
  for(i=0;i<ups.length;i++){
    var d=document.createElement("div");
    d.className="item";
    d.innerHTML='<div><div class="nm">'+ups[i].nm+' <span class="own"></span></div><div class="ds">'+ups[i].ds+'</div></div><div class="pr"></div>';
    (function(idx){d.addEventListener("click",function(){buyUp(idx);});})(i);
    shopEl.appendChild(d);
    rows.push({el:d,own:d.querySelector(".own"),pr:d.querySelector(".pr")});
  }
}
function cashOut(reason){
  var gain=bag*(dbl?2:1);
  bank+=gain;active=false;gapT=0.7;
  if(gain>0)say(reason+"入账 "+fmt(gain)+" 金!");
  else say(reason);
  bag=0;dbl=false;
}
function tapTile(i){
  if(state!=="play"||!active||revealed[i])return;
  revealed[i]=true;picks--;
  var c=tiles[i];
  if(c.t==="gem"){bag+=c.v;say("翻到宝石 +"+c.v+"!"+(picks>0?"继续还是见好就收?":"步数用完,自动结算"));}
  else if(c.t==="dbl"){dbl=true;say("翻到古神的 x2 翻倍符!")}
  else if(c.t==="empty"){say("空砖一块,白走一步…");}
  else{
    var keep=upLv[1]>0?Math.floor(bag*0.5):0;
    bag=keep;
    say("踩中骷髅陷阱!"+(upLv[1]>0?"护符保住了一半!":"袋中金币全部蒸发!"));
    cashOut("狼狈撤离,");
    return;
  }
  if(picks<=0&&active)cashOut("步数用完,");
}
btnOut.addEventListener("click",function(){
  if(state!=="play"||!active)return;
  if(bag<=0&&!dbl){say("袋子空空,翻几块再走吧!");return;}
  cashOut("见好就收,");
});
function buyUp(i){
  if(state!=="play")return;
  if(upLv[i]>=ups[i].max){say("该装备已达顶级!");return;}
  var c=upCost(i);
  if(bank<c){say("身家不够,先回庙里捡点宝!");return;}
  bank-=c;upLv[i]++;
  if(i===0&&active)picks++;
  say(ups[i].nm+" 到手!");
}
function startGame(){
  bank=0;bag=0;picks=3;dbl=false;roundN=0;gapT=0;upLv=[0,0,0];msgT=0;
  newRound();
  elMsg.textContent="";ov.classList.add("hide");
  state="play";render();
}
btn.addEventListener("click",startGame);
document.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&state!=="play"){e.preventDefault();startGame();}
});
function tileFace(i){
  if(marks[i]&&!revealed[i])return '<span class="em">⚠️</span>陷阱';
  if(!revealed[i])return '<span class="em">🧱</span>';
  var c=tiles[i];
  if(c.t==="gem")return '<span class="em">💎</span>'+c.v;
  if(c.t==="dbl")return '<span class="em">✖️2</span>';
  if(c.t==="empty")return '<span class="em">🕸️</span>';
  return '<span class="em">💀</span>';
}
function render(){
  var i;
  elBank.textContent=fmt(bank);elBag.textContent=bag;
  elPicks.textContent=picks;elRound.textContent=roundN;
  for(i=0;i<15;i++){
    var el=tileEls[i];
    el.innerHTML=tileFace(i);
    el.className="tile"+(revealed[i]||marks[i]?" revealed":"");
    if(marks[i]&&!revealed[i])el.classList.add("mark");
    else if(revealed[i]&&tiles[i].t==="gem")el.classList.add("gem");
    else if(revealed[i]&&tiles[i].t==="trap")el.classList.add("bad");
  }
  btnOut.disabled=!active;
  btnOut.textContent=active?("带出宝藏 (袋中 "+(bag*(dbl?2:1))+" 金)"):"下一轮准备中…";
  for(i=0;i<ups.length;i++){
    var full=upLv[i]>=ups[i].max,c=upCost(i);
    rows[i].pr.textContent=full?"已满":fmt(c);
    rows[i].own.textContent="Lv"+upLv[i]+"/"+ups[i].max;
    rows[i].el.classList.toggle("off",full||bank<c);
  }
}
function showOv(t2,d,s){
  ovT.textContent=t2;ovD.textContent=d;ovS.textContent=s;ovS.style.display="block";
  btn.textContent="再来一局";ov.classList.remove("hide");
}
var last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  var dt=Math.min(50,t-last);last=t;
  if(state!=="play")return;
  var ds=dt/1000;
  if(!active){
    gapT-=ds;
    if(gapT<=0)newRound();
  }
  if(msgT>0){msgT-=ds;if(msgT<=0)elMsg.textContent="";}
  render();
  if(bank>=WIN){
    state="over";
    showOv("神庙寻宝王!","六千金身家,骷髅见了你都要绕道走!","累计身家 "+fmt(bank)+" 金 · 历经 "+roundN+" 轮");
  }
}
bank=0;bag=0;picks=3;dbl=false;roundN=0;gapT=0;upLv=[0,0,0];state="menu";msgT=0;
tiles=[];revealed=[];marks=[];active=false;
buildUI();render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

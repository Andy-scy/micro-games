<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长廊多米诺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#fda4af;text-align:center;letter-spacing:2px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin:4px 0 8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fbbf24;font-size:15px}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.bar button{background:#fda4af;color:#4c0519;border:none;border-radius:10px;padding:8px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button.sec{background:#232946;color:#c7cbe8;border:1px solid #2f3a5e;font-weight:400}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fda4af}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay button{margin-top:4px;background:#fda4af;color:#4c0519;border:none;border-radius:10px;padding:11px 30px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>长廊多米诺</h1>
  <p class="hint">按住拖动摆放骨牌,铺满一排自动换排 · 一键推倒看连锁 · 连锁 100 圆满</p>
  <div class="hud">
    <span>已摆 <b id="hLay">0</b></span>
    <span>本轮连锁 <b id="hChain">0</b></span>
    <span>纪录 <b id="hBest">0</b></span>
  </div>
  <div class="bar">
    <button id="btnTop">推倒</button>
    <button id="btnClear" class="sec">重砌长廊</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="470" height="320"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">长廊多米诺</h2>
      <p id="ovD"></p>
      <button id="btnGo">开始铺设</button>
      <button id="btnMore" style="display:none">重砌长廊</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var hLay=$("hLay"),hChain=$("hChain"),hBest=$("hBest");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),btnGo=$("btnGo"),btnMore=$("btnMore");
var W=470,H=320,TAU=Math.PI*2;
var ROWS=[296,244,192,140],PER=29,SP=15,X0=14;
var doms=[],fx=[];
var running=false,sweeping=0,chainNow=0,best=0,goalDone=false,endT=0;
var pressing=false,lastX=null;
function addFx(x,y,txt,col){fx.push({x:x,y:y,txt:txt,col:col||"#fbbf24",t:1});}
function updLay(){hLay.textContent=doms.length;}
function place(x){
  if(running||sweeping>0)return;
  var row=Math.floor(doms.length/PER);
  if(row>=ROWS.length){addFx(235,80,"长廊已铺满","#94a3b8");return;}
  var ry=ROWS[row],xx=Math.max(X0,Math.min(X0+(PER-1)*SP,x));
  if(doms.length>0){
    var last=doms[doms.length-1];
    if(last.y===ry&&Math.abs(xx-last.x)<12)return;
  }
  doms.push({x:xx,y:ry,ang:0,st:0,t:0,hit:false,delay:-1});
  updLay();
}
function topple(){
  if(running||sweeping>0||doms.length===0)return;
  running=true;chainNow=0;endT=0;
  doms[0].st=1;chainNow++;hChain.textContent=chainNow;
}
function checkMile(){
  if(chainNow===30)addFx(235,70,"三十连响!","#fda4af");
  if(chainNow===60)addFx(235,70,"六十连声!","#fbbf24");
  if(chainNow===100&&!goalDone)goalDone=true;
}
function endChain(){
  running=false;
  if(chainNow>best){best=chainNow;hBest.textContent=best;}
  if(chainNow>=100){
    ovT.textContent="连锁圆满";
    ovD.textContent="本轮推倒 "+chainNow+" 张,长廊声如潮涌。\n纪录 "+best+"。可重砌长廊,再来一场。";
    btnMore.style.display="inline-block";
    ov.classList.remove("hide");
  }
  sweeping=0.9;
}
function step(dt){
  var i,active=false;
  for(i=0;i<doms.length;i++){var d=doms[i];
    if(d.delay>=0){
      d.delay-=dt;
      if(d.delay<0&&d.st===0){d.st=1;chainNow++;hChain.textContent=chainNow;checkMile();}
    }
    if(d.st===1){
      active=true;
      d.t+=dt*2.3;
      var e=Math.min(1,d.t);
      d.ang=(1-(1-e)*(1-e))*Math.PI/2;
      if(d.ang>0.9&&!d.hit){
        d.hit=true;
        var nx=doms[i+1];
        if(!nx){endChain();return;}
        else if(nx.y!==d.y)nx.delay=0.22;
        else if(Math.abs(nx.x-d.x)<=26){nx.st=1;chainNow++;hChain.textContent=chainNow;checkMile();}
        else{addFx((d.x+nx.x)/2,d.y-30,"断链","#94a3b8");endChain();return;}
      }
    }
  }
  if(running&&!active){
    for(i=0;i<doms.length;i++)if(doms[i].delay>=0&&doms[i].st===0)active=true;
    if(!active){endT+=dt;if(endT>0.7)endChain();}
  }
  if(sweeping>0){
    sweeping-=dt;
    if(sweeping<=0){doms=[];updLay();hChain.textContent="0";chainNow=0;}
  }
  for(i=fx.length-1;i>=0;i--){fx[i].t-=0.012;
    if(fx[i].t<=0)fx.splice(i,1);}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var i,al=sweeping>0?Math.max(0,sweeping/0.9):1;
  ctx.globalAlpha=al;
  for(i=0;i<ROWS.length;i++){
    ctx.fillStyle="#1d2338";ctx.fillRect(6,ROWS[i]+2,W-12,5);
  }
  for(i=0;i<doms.length;i++){var d=doms[i];
    ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.ang);
    ctx.fillStyle="#efe6d8";
    ctx.beginPath();
    ctx.moveTo(-3.5,0);ctx.lineTo(-3.5,-30);
    ctx.arcTo(-3.5,-34,0,-34,3.5);ctx.arcTo(3.5,-34,3.5,-30,3.5);
    ctx.lineTo(3.5,0);ctx.closePath();ctx.fill();
    ctx.fillStyle="#b45309";
    ctx.fillRect(-2.5,-9,5,5);
    ctx.restore();}
  ctx.globalAlpha=1;
  for(i=fx.length-1;i>=0;i--){var f=fx[i];
    ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.col;
    ctx.font="bold 13px system-ui";ctx.textAlign="center";
    ctx.fillText(f.txt,f.x,f.y-(1-f.t)*26);ctx.globalAlpha=1;}
}
function ptrX(e){var t=(e.touches&&e.touches[0])?e.touches[0]:e;var rc=cv.getBoundingClientRect();return{x:(t.clientX-rc.left)*W/rc.width};}
function down(e){if(state!=="play")return;e.preventDefault();pressing=true;var p=ptrX(e);place(p.x);lastX=p.x;}
function mv(e){
  if(!pressing||state!=="play")return;
  e.preventDefault();
  var p=ptrX(e);
  if(lastX!==null&&Math.abs(p.x-lastX)>7){place(p.x);lastX=p.x;}
}
function up(){pressing=false;lastX=null;}
cv.addEventListener("mousedown",down);window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
cv.addEventListener("touchstart",down,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",up);
window.addEventListener("keydown",function(e){
  if(e.code==="Space"&&state==="play"){e.preventDefault();topple();}
});
$("btnTop").addEventListener("click",function(){if(state==="play")topple();});
$("btnClear").addEventListener("click",function(){
  if(state!=="play")return;
  doms=[];chainNow=0;sweeping=0;running=false;
  updLay();hChain.textContent="0";
});
var state="menu",lastT=0;
function loop(t){requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(state==="play")step(dt);
  draw();
}
function showMenu(){
  ovT.textContent="长廊多米诺";
  ovD.textContent="在长廊上按住拖动,骨牌便一张张立起(间距要近,断开即断链)。\n铺满一排自动换上一排。点「推倒」或按空格,\n看骨牌次第倒下,连锁 100 即圆满。";
  btnGo.textContent="开始铺设";btnMore.style.display="none";
  ov.classList.remove("hide");
}
btnGo.addEventListener("click",function(){state="play";ov.classList.add("hide");});
btnMore.addEventListener("click",function(){
  doms=[];chainNow=0;sweeping=0;running=false;goalDone=false;
  updLay();hChain.textContent="0";
  state="play";ov.classList.add("hide");
});
showMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

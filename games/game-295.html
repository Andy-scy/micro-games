<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三色雷区</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#facc15;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#facc15;font-size:15px}
.stage{position:relative}
.grid{display:grid;gap:2px;background:#0b0e1a;padding:6px;border-radius:10px;width:max-content;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:3px;background:#2a3050;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cs)*.5);cursor:pointer}
.cell.z0{background:#24422e}
.cell.z1{background:#20344e}
.cell.z2{background:#46262c}
.cell.op{background:#12162b;cursor:default}
.cell.fl{background:#3b2f52;color:#fbbf24}
.cell.lk{opacity:.32;cursor:not-allowed}
.cell.mn{background:#3b1d1d;color:#f87171}
.cell.bo{background:#7f1d1d;color:#fff}
.cell.wm{background:#3b2f52;color:#6b7280}
.n1{color:#7dd3fc}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#c084fc}.n5{color:#fbbf24}.n6{color:#2dd4bf}.n7{color:#f472b6}.n8{color:#e8eaf6}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#facc15}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.9;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#facc15;color:#2b2304;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(20,24,44,.95);border:1px solid #32385e;color:#facc15;font-size:13px;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <h1>三色雷区</h1>
  <p class="hint">雷场分成绿、蓝、红三区,各埋 6 颗雷,必须按序推进!<br>先肃清绿区才能踏入蓝区,再战红区 · 点击翻开 · 右键/长按插旗</p>
  <div class="hud">
    <span>当前目标 <b id="zone">绿区</b></span>
    <span>剩余雷数 <b id="mleft">18</b></span>
    <span>已翻开 <b id="prog">0/126</b></span>
  </div>
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">三色雷区</h2>
      <p id="ovP">12×12 雷场分为三色战区:
绿 → 蓝 → 红,依次解锁!
未解锁区域半透明且无法点击,
全局数字包含所有雷,跨区也要算!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">绿区开战</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=12,H=12,MINES=18,N=W*H,ZW=4,ZM=6;
var ZNAMES=["绿区","蓝区","红区"];
var grid=document.getElementById("grid");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovS=document.getElementById("ovS"),btnGo=document.getElementById("btnGo");
var elZ=document.getElementById("zone"),elM=document.getElementById("mleft"),elP=document.getElementById("prog"),toastEl=document.getElementById("toast");
var NB=[],cells=[],mines=[],num=[],st=[],opened=0,flags=0,placed=false,over=false;
var curZone=0,toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show");},1400);}
function zoneOf(i){return Math.floor((i%W)/ZW);}
function buildNB(){NB=[];var i,x,y,dx,dy,nx,ny;for(i=0;i<N;i++){x=i%W;y=(i/W)|0;var r=[];for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;nx=x+dx;ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H)r.push(ny*W+nx);}NB.push(r);}}
function calcNums(){var i,k;num=new Array(N);for(i=0;i<N;i++)num[i]=0;for(i=0;i<N;i++){if(mines[i])continue;var c=0;for(k=0;k<NB[i].length;k++)if(mines[NB[i][k]])c++;num[i]=c;}}
function placeMines(safe){
  var i,z,cnt;
  mines=new Array(N);for(i=0;i<N;i++)mines[i]=false;
  for(z=0;z<3;z++){
    cnt=0;
    while(cnt<ZM){
      var base=z*ZW,c=(Math.random()*ZW)|0,r=(Math.random()*H)|0,j=r*W+base+c;
      if(!mines[j]&&!safe[j]){mines[j]=true;cnt++;}
    }
  }
  calcNums();
}
function buildGrid(){
  grid.innerHTML="";grid.style.gridTemplateColumns="repeat("+W+", var(--cs))";
  var cs=Math.max(18,Math.min(34,Math.floor((Math.min(window.innerWidth,540)-40)/W),Math.floor((window.innerHeight-250)/H)));
  grid.style.setProperty("--cs",cs+"px");
  cells=new Array(N);
  for(var i=0;i<N;i++){var d=document.createElement("div");d.className="cell";d.dataset.i=i;grid.appendChild(d);cells[i]=d;}
}
function render(i){
  var el=cells[i],s=st[i],z=zoneOf(i);
  el.className="cell z"+z;
  if(z>curZone)el.classList.add("lk");
  el.textContent="";
  if(s===1){el.classList.add("op");if(mines[i]){el.classList.add("bo");el.textContent="✸";}else if(num[i]>0){el.textContent=String(num[i]);el.classList.add("n"+num[i]);}}
  else if(s===2){el.classList.add("fl");el.textContent="⚑";}
  else{if(over&&mines[i]){el.classList.add(i===boomIdx?"bo":"mn");el.textContent="✸";}}
}
var boomIdx=-1;
function renderAll(){for(var i=0;i<N;i++)render(i);}
function zoneCleared(z){
  for(var i=0;i<N;i++){if(zoneOf(i)===z&&!mines[i]&&st[i]!==1)return false;}
  return true;
}
function openCell(i){
  if(st[i]!==0||mines[i])return;
  if(zoneOf(i)>curZone)return;
  var stk=[i];
  while(stk.length){
    var j=stk.pop();
    if(st[j]!==0||mines[j]||zoneOf(j)>curZone)continue;
    st[j]=1;opened++;render(j);
    if(num[j]===0){for(var k=0;k<NB[j].length;k++){if(st[NB[j][k]]===0&&!mines[NB[j][k]]&&zoneOf(NB[j][k])<=curZone)stk.push(NB[j][k]);}}
  }
}
function chord(i){
  if(num[i]===0)return;
  var f=0,hid=[],k;
  for(k=0;k<NB[i].length;k++){var j=NB[i][k];if(st[j]===2)f++;else if(st[j]===0&&zoneOf(j)<=curZone)hid.push(j);}
  if(f!==num[i]||!hid.length)return;
  for(k=0;k<hid.length;k++){
    if(mines[hid[k]]){hitMine(hid[k]);return;}
    openCell(hid[k]);
  }
  afterAction();
}
function hitMine(i){boomIdx=i;endGame(false);}
function checkZone(){
  while(curZone<2&&zoneCleared(curZone)){
    curZone++;
    toast(ZNAMES[curZone-1]+"肃清!解锁"+ZNAMES[curZone]);
    renderAll();
  }
  elZ.textContent=ZNAMES[curZone];
}
function updateHud(){elM.textContent=MINES-flags;elP.textContent=opened+"/"+(N-MINES);elZ.textContent=ZNAMES[curZone];}
function afterAction(){checkZone();updateHud();if(opened===N-MINES)endGame(true);}
function endGame(w){
  if(over)return;over=true;
  var i;
  if(w){
    for(i=0;i<N;i++)if(mines[i]&&st[i]!==2){st[i]=2;render(i);}
    ovT.textContent="三区全肃清!";ovT.style.color="#4ade80";
    ovP.textContent="绿、蓝、红三色雷区逐一拿下!";
  }else{
    for(i=0;i<N;i++){if(mines[i]&&st[i]!==2)render(i);else if(!mines[i]&&st[i]===2){cells[i].classList.add("wm");}}
    ovT.textContent="推进受阻";ovT.style.color="#f87171";
    ovP.textContent="倒在"+ZNAMES[curZone]+"的雷海里,再来!";
  }
  updateHud();btnGo.textContent="再来一局";ov.classList.remove("hide");
}
function onOpen(i){
  if(over)return;
  if(zoneOf(i)>curZone){toast(ZNAMES[zoneOf(i)]+"尚未解锁!");return;}
  if(!placed){var safe={};safe[i]=true;placeMines(safe);placed=true;}
  if(st[i]===2){return;}
  if(st[i]===1){chord(i);return;}
  if(mines[i]){hitMine(i);return;}
  openCell(i);afterAction();
}
function onFlag(i){
  if(over||st[i]===1)return;
  if(zoneOf(i)>curZone){toast(ZNAMES[zoneOf(i)]+"尚未解锁!");return;}
  if(st[i]===2){st[i]=0;flags--;}else{st[i]=2;flags++;}
  render(i);updateHud();
}
function cellIndex(e){var t=e.target;while(t&&t!==grid&&!t.classList.contains("cell"))t=t.parentNode;if(t&&t!==grid)return +t.dataset.i;return -1;}
var pressTimer=null,pressIdx=-1,longFired=false;
grid.addEventListener("contextmenu",function(e){e.preventDefault();});
grid.addEventListener("pointerdown",function(e){
  var i=cellIndex(e);if(i<0||over)return;
  if(e.pointerType==="touch"){pressIdx=i;longFired=false;pressTimer=setTimeout(function(){pressTimer=null;longFired=true;onFlag(pressIdx);},350);}
  else if(e.button===2){e.preventDefault();onFlag(i);}
  else if(e.button===0){onOpen(i);}
});
grid.addEventListener("pointerup",function(e){
  if(e.pointerType!=="touch")return;
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  if(!longFired&&pressIdx>=0&&!over)onOpen(pressIdx);
});
grid.addEventListener("pointercancel",function(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
function reset(){
  over=false;placed=false;opened=0;flags=0;boomIdx=-1;curZone=0;
  buildNB();
  st=new Array(N);for(var i=0;i<N;i++)st[i]=0;
  mines=new Array(N);num=new Array(N);
  buildGrid();updateHud();
}
btnGo.addEventListener("click",function(){reset();ov.classList.add("hide");});
reset();updateHud();
})();
</script>
</body>
</html>

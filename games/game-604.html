<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乘法天梯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#f472b6;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f472b6;font-size:16px}
.ladder{display:flex;justify-content:center;gap:4px;margin-bottom:10px}
.ladder i{width:16px;height:8px;border-radius:4px;background:#0b0e1a;display:block}
.ladder i.done{background:#f472b6}
.timebar{height:8px;background:#0b0e1a;border-radius:6px;overflow:hidden;margin-bottom:12px}
.timebar i{display:block;height:100%;background:#f472b6;width:100%}
.q{text-align:center;font-size:40px;font-weight:800;min-height:52px;margin-bottom:6px}
.q .big{color:#f472b6}
.ans{text-align:center;font-size:24px;font-weight:700;color:#f472b6;background:#0b0e1a;border-radius:10px;padding:8px 0;min-height:44px;margin-bottom:12px;letter-spacing:4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{background:#232949;color:#e8eaf6;border:none;border-radius:10px;padding:12px 0;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit}
.kp button:active{transform:scale(.95)}
.kp .ok{background:#f472b6;color:#3d0a24}
.stage{position:relative}
.overlay{position:absolute;inset:-6px;background:rgba(8,10,22,.92);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#f472b6}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f472b6;color:#3d0a24;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>乘法天梯</h1>
  <p class="hint">从 ×2 爬到 ×9 · 每层限时 25 秒答对 5 题 · 超时掉一颗心并重爬本层</p>
  <div class="hud">
    <span>本层 <b id="lv">×2</b></span>
    <span>进度 <b id="prog">0/5</b></span>
    <span>时间 <b id="time">25</b>s</span>
    <span>生命 <b id="lives">❤❤❤</b></span>
    <span>得分 <b id="score">0</b></span>
  </div>
  <div class="ladder" id="ladder"></div>
  <div class="timebar"><i id="tbar"></i></div>
  <div class="stage">
    <div class="q" id="q"><span class="big">7</span> × 8 = ?</div>
    <div class="ans" id="ans">&nbsp;</div>
    <div class="kp" id="kp">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">确认</button>
    </div>
    <div class="overlay" id="ov">
      <h2 id="ovT">乘法天梯</h2>
      <p id="ovD">八层天梯对应 ×2 到 ×9。每层要在 25 秒内答对 5 道本层乘法题才能登上一层,超时损失一颗心并重爬本层。登顶即胜利!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始登梯</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elLv=$("lv"),elProg=$("prog"),elTime=$("time"),elLives=$("lives"),elScore=$("score");
var elQ=$("q"),elAns=$("ans"),elTbar=$("tbar"),elLadder=$("ladder");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo"),kp=$("kp");
var LEVEL_MS=25000,NEED=5;
var state,level,prog,lives,score,timeLeft,input,cur,rightCount,lastT;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gen(){
  var k=rnd(1,9);
  cur={a:level,b:k,c:level*k};
  elQ.innerHTML="<span class='big'>"+level+"</span> × "+k+" = ?";
}
function updHud(){
  elLv.textContent="×"+level;
  elProg.textContent=prog+"/"+NEED;
  elScore.textContent=score;
  var h="",i;
  for(i=0;i<3;i++)h+=i<lives?"❤":"♡";
  elLives.textContent=h;
}
function drawLadder(){
  var html="",i;
  for(i=2;i<=9;i++)html+="<i class='"+(i<level?"done":"")+"'></i>";
  elLadder.innerHTML=html;
}
function levelUp(){
  score+=50;
  level++;
  prog=0;
  timeLeft=LEVEL_MS;
  if(level>9){gameOver(true);return;}
  drawLadder();updHud();gen();
}
function levelFail(){
  lives--;
  prog=0;
  timeLeft=LEVEL_MS;
  updHud();gen();
  if(lives<=0)gameOver(false);
}
function submit(){
  if(state!=="playing"||input==="")return;
  var v=parseInt(input,10);
  input="";
  elAns.innerHTML="&nbsp;";
  if(v===cur.c){
    prog++;rightCount++;
    score+=10;
    if(prog>=NEED)levelUp();else gen();
    updHud();
  }else{
    elAns.textContent="✗";
  }
}
function press(k){
  if(state!=="playing")return;
  if(elAns.textContent==="✗")elAns.innerHTML="&nbsp;";
  if(k==="del")input=input.slice(0,-1);
  else if(k==="ok")submit();
  else if(input.length<3)input+=k;
  if(input==="")elAns.innerHTML="&nbsp;";
  else elAns.textContent=input;
  if(input!==""){
    var m=parseInt(input,10);
    if(m===cur.c)submit();
  }
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"登顶成功!":"天梯中断…";
  ovD.textContent=win?"×2 一路爬到 ×9,乘法口诀炉火纯青!":"爬到 ×"+level+" 层,共答对 "+rightCount+" 题。";
  ovS.style.display="block";
  ovS.textContent="得分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  state="playing";level=2;prog=0;lives=3;score=0;rightCount=0;
  timeLeft=LEVEL_MS;input="";lastT=0;
  elAns.innerHTML="&nbsp;";
  drawLadder();updHud();gen();
  ov.classList.add("hide");
}
kp.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute("data-k"))press(t.getAttribute("data-k"));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
    return;
  }
  if(e.key>="0"&&e.key<="9"){press(e.key);e.preventDefault();}
  else if(e.key==="Backspace"){press("del");e.preventDefault();}
  else if(e.key==="Enter"){press("ok");e.preventDefault();}
});
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(100,t-lastT);lastT=t;
  if(state==="playing"){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=LEVEL_MS;levelFail();}
    var s=Math.ceil(timeLeft/1000);
    elTime.textContent=s;
    elTbar.style.width=(timeLeft/LEVEL_MS*100)+"%";
  }
}
drawLadder();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

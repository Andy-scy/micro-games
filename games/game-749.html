<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火力核心</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#stage{position:relative}
canvas{display:block;background:#10142a;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:24px;margin-top:8px;user-select:none;-webkit-user-select:none;align-items:center}
#dpad{display:grid;grid-template-areas:". u ." "l d r";gap:6px}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pbtn.fire{width:84px;height:84px;border-radius:50%;font-size:16px;font-weight:700;background:#5a2a2a;border-color:#8a4444}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>火力核心</h1>
<div id="hud"><span>生命 <b id="hA">3</b></span><span>火力 <b id="hB" style="color:#ffd76a">★</b></span><span>波次 <b id="hC">1/4</b></span><span>残敌 <b id="hD">0</b></span><span>分数 <b id="hE">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>火力核心</h2>
  <p id="ovP">击毁敌坦有几率掉落火力核心(★),碾压拾取升级:<br>★1 标准弹 → ★2 高速弹 → ★3 双发齐射 → ★4 穿甲弹(可击穿钢墙)。<br>阵亡会跌回 ★1。共 4 波,全歼即胜!</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="pbtn" data-k="ArrowUp" style="grid-area:u">▲</div>
    <div class="pbtn" data-k="ArrowLeft" style="grid-area:l">◀</div>
    <div class="pbtn" data-k="ArrowDown" style="grid-area:d">▼</div>
    <div class="pbtn" data-k="ArrowRight" style="grid-area:r">▶</div>
  </div>
  <div class="pbtn fire" data-k="Space">开火</div>
</div>
<script>
"use strict";
const TS=32,COLS=15,ROWS=13;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hA=document.getElementById('hA'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD'),hE=document.getElementById('hE');
const MAP=[
"...............",
".BB..B...B..BB.",
".BB........BB..",
"..B..S...S..B..",
"......B.B......",
"BB...........BB",
"......B.B......",
"..B.........B..",
"..B.S.....S.B..",
"......B.B......",
"..B.........B..",
".BB........BB..",
".BB..B...B..BB."
];
const WAVES=[6,8,10,12];
let grid,score,lives,wave,power,queue,enemies,drops,bullets,parts,player,spawnT,frame=0,state='start',banner,bannerT;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function initGame(){
  grid=MAP.map(r=>r.split('').map(c=>c==='B'?1:(c==='S'?2:0)));
  score=0;lives=3;wave=0;power=1;queue=WAVES[0];
  enemies=[];drops=[];bullets=[];parts=[];
  banner='第 1 波';bannerT=90;spawnT=40;
  player={x:7*TS+2,y:11*TS+2,dir:0,cd:0,inv:90};
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function rectVsGrid(x,y){
  if(x<0||y<0||x+28>cv.width||y+28>cv.height)return true;
  const x0=Math.floor(x/TS),y0=Math.floor(y/TS),x1=Math.floor((x+27)/TS),y1=Math.floor((y+27)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(grid[ty][tx]!==0)return true;}
  return false;
}
function tankOverlap(x,y,self){
  for(const t of enemies){if(t===self)continue;if(Math.abs(t.x-x)<27&&Math.abs(t.y-y)<27)return true;}
  if(player&&player!==self&&Math.abs(player.x-x)<27&&Math.abs(player.y-y)<27)return true;
  return false;
}
function moveTank(t,d){
  if(t.dir!==d){
    if(t.dir%2!==d%2){
      if(d%2===0)t.x=Math.round((t.x-2)/TS)*TS+2;else t.y=Math.round((t.y-2)/TS)*TS+2;
    }
    t.dir=d;
  }
  const v=DIRS[d],nx=t.x+v[0]*t.spd,ny=t.y+v[1]*t.spd;
  if(!rectVsGrid(nx,ny)&&!tankOverlap(nx,ny,t)){t.x=nx;t.y=ny;return true;}
  return false;
}
function fire(t,from){
  const v=DIRS[t.dir];
  const spd=from==='p'?(power>=2?6.5:4.8):4.4;
  const pw=from==='p'&&power>=4?2:1;
  bullets.push({x:t.x+14+v[0]*18-3,y:t.y+14+v[1]*18-3,vx:v[0]*spd,vy:v[1]*spd,from:from,pw:pw,life:220});
}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20+Math.random()*14,max:34,c:c||'#ffb050'});}
function floatTxt(x,y,txt){parts.push({x:x,y:y,vx:0,vy:-0.7,life:40,max:40,c:'#ffd76a',txt:txt});}
function mkEnemy(x,y){
  const r=Math.random();
  let kind='e';
  if(r<0.25)kind='f';else if(r<0.4&&wave>=1)kind='h';
  const spd=kind==='f'?1.8:(kind==='h'?0.8:1.2);
  return {x:x,y:y,dir:2,kind:kind,spd:spd,hp:kind==='h'?3:1,cd:60+Math.random()*60,think:20};
}
function updPlayer(){
  let d=-1;
  if(keys.ArrowUp||keys.KeyW)d=0;else if(keys.ArrowRight||keys.KeyD)d=1;
  else if(keys.ArrowDown||keys.KeyS)d=2;else if(keys.ArrowLeft||keys.KeyA)d=3;
  if(d>=0)moveTank(player,d);
  if(player.inv>0)player.inv--;
  player.cd--;
  if((keys.Space||keys.KeyJ)&&player.cd<=0){
    const maxB=power>=3?2:1;
    let n=0;for(const b of bullets)if(b.from==='p')n++;
    if(n<maxB){fire(player,'p');player.cd=power>=3?14:18;}
  }
  for(let i=drops.length-1;i>=0;i--){
    const dr=drops[i];
    dr.t++;
    if(Math.abs(player.x-dr.x)<26&&Math.abs(player.y-dr.y)<26){
      drops.splice(i,1);
      if(power<4){power++;floatTxt(dr.x,dr.y,'火力 ★'+power);}
      else{score+=300;floatTxt(dr.x,dr.y,'+300');}
      boom(dr.x+12,dr.y+12,8,'#ffd76a');
    }
  }
}
function updEnemies(){
  for(const e of enemies){
    e.think--;e.cd--;
    const moved=moveTank(e,e.dir);
    if(!moved||e.think<=0){
      let d=Math.floor(Math.random()*4);
      if(player&&Math.random()<0.55){
        d=Math.abs(player.x-e.x)>Math.abs(player.y-e.y)?(player.x>e.x?1:3):(player.y>e.y?2:0);
      }
      e.dir=d;e.think=25+Math.random()*45;
    }
    if(e.cd<=0&&player){
      if(Math.abs(e.x-player.x)<14){e.dir=player.y>e.y?2:0;}
      else if(Math.abs(e.y-player.y)<14){e.dir=player.x>e.x?1:3;}
      else{e.cd=20;continue;}
      fire(e,'e');e.cd=90+Math.random()*70;
    }
  }
}
function killPlayer(){
  boom(player.x+14,player.y+14,14,'#7fe08a');
  lives--;
  if(lives<=0){end(false,'火力核心计划失败!');return;}
  power=1;
  player.x=7*TS+2;player.y=11*TS+2;player.dir=0;player.inv=130;player.cd=40;
  floatTxt(player.x,player.y-10,'火力重置 ★1');
}
function end(win,msg){
  state=win?'win':'over';
  ov.children[0].textContent=win?'火力全开,大获全胜!':'游戏结束';
  ovP.innerHTML=msg+'<br>最终得分:'+score;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function updBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let dead=false;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0)dead=true;
    if(b.x<0||b.y<0||b.x+6>cv.width||b.y+6>cv.height)dead=true;
    if(!dead){
      const tx=Math.floor((b.x+3)/TS),ty=Math.floor((b.y+3)/TS);
      if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){
        const t=grid[ty][tx];
        if(t===1){grid[ty][tx]=0;dead=true;boom(b.x+3,b.y+3,4,'#d08a50');}
        else if(t===2){
          if(b.pw>=2){grid[ty][tx]=0;boom(b.x+3,b.y+3,6,'#cfd6ee');}
          else boom(b.x+3,b.y+3,3,'#cfd6ee');
          dead=true;
        }
      }
    }
    if(!dead){
      if(b.from==='e'){
        if(player.inv<=0&&Math.abs(b.x+3-(player.x+14))<16&&Math.abs(b.y+3-(player.y+14))<16){dead=true;killPlayer();}
      }else{
        for(const e of enemies){
          if(Math.abs(b.x+3-(e.x+14))<16&&Math.abs(b.y+3-(e.y+14))<16){
            dead=true;e.hp--;
            if(e.hp<=0){
              enemies.splice(enemies.indexOf(e),1);
              const v=e.kind==='h'?300:(e.kind==='f'?180:100);
              score+=v;floatTxt(e.x,e.y,'+'+v);
              boom(e.x+14,e.y+14,12,'#ffb050');
              if(Math.random()<0.35)drops.push({x:e.x+2,y:e.y+2,t:0});
            }else boom(b.x+3,b.y+3,4,'#ffb050');
            break;
          }
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
function updSpawns(){
  if(queue<=0)return;
  spawnT--;
  if(spawnT>0||enemies.length>=4)return;
  spawnT=130;
  const pts=[[0,0],[7,0],[14,0]];
  for(const p of pts){
    const px=p[0]*TS+2,py=p[1]*TS+2;
    if(!rectVsGrid(px,py)&&!tankOverlap(px,py,null)){
      enemies.push(mkEnemy(px,py));queue--;return;
    }
  }
}
function checkWave(){
  if(queue>0||enemies.length>0)return;
  if(wave>=WAVES.length-1){end(true,'四波敌军灰飞烟灭!');return;}
  wave++;score+=300;queue=WAVES[wave];spawnT=80;
  banner='第 '+(wave+1)+' 波';bannerT=100;
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
  if(bannerT>0)bannerT--;
}
function updHud(){
  hA.textContent=lives;
  hB.textContent='★★★★★'.slice(0,power);
  hC.textContent=(wave+1)+'/4';
  hD.textContent=enemies.length+queue;hE.textContent=score;
}
function draw(){
  ctx.fillStyle='#10142a';ctx.fillRect(0,0,cv.width,cv.height);
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const t=grid[ty][tx],X=tx*TS,Y=ty*TS;
    if(t===1){
      ctx.fillStyle='#8a4a28';ctx.fillRect(X,Y,TS,TS);
      ctx.fillStyle='#5c2f18';ctx.fillRect(X,Y+15,TS,2);
      ctx.fillStyle='#a55c32';ctx.fillRect(X+1,Y+1,14,13);ctx.fillRect(X+17,Y+1,14,13);
    }else if(t===2){
      ctx.fillStyle='#6b7694';ctx.fillRect(X+1,Y+1,TS-2,TS-2);
      ctx.fillStyle='#9aa6c4';ctx.fillRect(X+5,Y+5,TS-10,TS-10);
    }
  }
  for(const dr of drops){
    const X=dr.x,Y=dr.y;
    ctx.fillStyle='rgba(255,215,106,'+(0.35+0.25*Math.sin(dr.t/8))+')';
    ctx.fillRect(X-2,Y-2,28,28);
    ctx.fillStyle='#ffd76a';
    ctx.save();
    ctx.translate(X+12,Y+12);ctx.rotate(dr.t/20);
    ctx.fillRect(-9,-9,18,18);
    ctx.fillStyle='#8a6a1a';ctx.fillRect(-5,-5,10,10);
    ctx.restore();
  }
  const drawT=(t,c)=>{
    ctx.fillStyle='#171b2e';ctx.fillRect(t.x,t.y,28,28);
    ctx.fillStyle=c;ctx.fillRect(t.x+4,t.y+4,20,20);
    const cc=t.x+14;
    ctx.fillStyle='#12152a';
    if(t.dir===0)ctx.fillRect(cc-2,t.y,4,14);
    else if(t.dir===1)ctx.fillRect(cc,t.y+12,14,4);
    else if(t.dir===2)ctx.fillRect(cc-2,t.y+14,4,14);
    else ctx.fillRect(t.x,t.y+12,14,4);
    ctx.fillStyle=c;ctx.fillRect(t.x+9,t.y+9,10,10);
  };
  for(const e of enemies)drawT(e,e.kind==='f'?'#e0a94e':(e.kind==='h'?'#c46a6a':'#8fa0c8'));
  if(player&&!(player.inv>0&&frame%6<3))drawT(player,'#5fbf68');
  for(const b of bullets){
    ctx.fillStyle=b.from==='p'?'#ffe9a0':'#ff9d6a';
    ctx.fillRect(b.x,b.y,6,6);
  }
  for(const p of parts){
    if(p.txt){
      ctx.globalAlpha=Math.min(p.life/20,1);
      ctx.fillStyle=p.c;ctx.font='bold 13px system-ui';ctx.textAlign='center';
      ctx.fillText(p.txt,p.x,p.y);
    }else{
      ctx.globalAlpha=Math.max(p.life/p.max,0);
      ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
    }
  }
  ctx.globalAlpha=1;
  if(bannerT>0&&banner){
    ctx.globalAlpha=Math.min(bannerT/40,1);
    ctx.fillStyle='#ffd76a';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText(banner,cv.width/2,cv.height/2-10);
    ctx.globalAlpha=1;
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){
    frame++;
    updPlayer();updEnemies();updBullets();updSpawns();checkWave();updParts();updHud();
  }
  draw();
}
initGame();
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长音绵延</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#4ade80;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#4ade80;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>长音绵延</h1>
  <p class="hint">左 F 右 J · 长条音符要按住不放直到尾端通过 · 触屏按住对应半边</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>生命 <b id="life">5</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">长音绵延</h2>
      <p id="ovDesc">短音符按下即可,长条音符要在头部按下后一直按住,
让声音绵延到尾端越线才算完整!
中途松手会「断音」清空连击,持续按住每帧都在得分;
漏 5 个音符头游戏结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elLife=$("life"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,LANES=2,LW=W/LANES,JY=470,APPROACH=1400;
var BPM=96,beatInt=60000/BPM;
var LCOL=["#4ade80","#60a5fa"];
var KEYNAME=["F","J"];
var keyLane={KeyF:0,KeyJ:1,ArrowLeft:0,ArrowRight:1};
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_g364");

var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function sHead(l){tone("triangle",[523,659][l],0,0.12,0.22);}
function sTick(){noiseHit(0.05,0.08,6000);}
function sMiss(){tone("sawtooth",200,100,0.2,0.16);}
function sDone(){tone("triangle",880,1320,0.16,0.22);}
function sBreak(){tone("sawtooth",300,90,0.3,0.2);}

var state="menu",notes,pops,score,scoreF,combo,life,maxCombo,schedBeat,schedCount,tickBeat,lastEnd;
var prevNow=0;
function reset(){
  notes=[];pops=[];
  score=0;scoreF=0;combo=0;life=5;maxCombo=0;
  lastEnd=[0,0];
  schedBeat=performance.now()+2000;
  tickBeat=schedBeat;
  schedCount=0;
  prevNow=performance.now();
  upd();
}
function start(){audio();reset();state="play";ov.classList.add("hide");}
function upd(){
  elScore.textContent=Math.floor(score);
  elCombo.textContent=combo;
  elLife.textContent=life;
  elBest.textContent=best;
}
function addPop(x,y,txt,color){pops.push({x:x,y:y,txt:txt,color:color,t0:performance.now()});}

function schedule(now){
  if(schedBeat-now>4000)schedBeat=now+2000;
  while(schedBeat-now<APPROACH+beatInt*2){
    var l=(schedCount%2),hold=Math.random()<0.42,dur=0;
    if(hold)dur=(Math.random()<0.5?1:2)*beatInt;
    if(schedBeat>=lastEnd[l]){
      notes.push({lane:l,t:schedBeat,dur:dur,judged:false,holding:false,done:false});
      lastEnd[l]=schedBeat+dur+beatInt*0.5;
    }
    schedCount++;
    schedBeat+=beatInt;
  }
  if(tickBeat-now>4000)tickBeat=now+200;
  while(now>=tickBeat){sTick();tickBeat+=beatInt;}
}
function down(l){
  if(state!=="play")return;
  var now=performance.now(),i,n,dt,bi=-1,bd=1e9;
  for(i=0;i<notes.length;i++){
    n=notes[i];
    if(n.lane!==l||n.judged||n.done)continue;
    if(n.dur>0&&n.holding)return;
    dt=now-n.t;
    if(dt<-220||dt>220)continue;
    if(Math.abs(dt)<Math.abs(bd)){bd=dt;bi=i;}
  }
  if(bi<0)return;
  n=notes[bi];n.judged=true;
  var x=l*LW+LW/2;
  if(Math.abs(bd)<=80){
    combo++;if(combo>maxCombo)maxCombo=combo;
    score+=200+combo*10;addPop(x,JY-46,"完美 +"+(200+combo*10),"#fbbf24");
  }else{
    combo++;score+=80;addPop(x,JY-46,"还行 +80","#4ade80");
  }
  sHead(l);
  if(n.dur>0){n.holding=true;}
  else n.done=true;
  upd();
}
function up(l){
  if(state!=="play")return;
  var now=performance.now(),i,n;
  for(i=0;i<notes.length;i++){
    n=notes[i];
    if(n.lane!==l||!n.holding)continue;
    n.holding=false;
    if(now>=n.t+n.dur-240){
      n.done=true;score+=150;
      addPop(l*LW+LW/2,JY-46,"绵延 +150","#fbbf24");sDone();
    }else{
      n.done=true;combo=0;
      addPop(l*LW+LW/2,JY-46,"断音!","#f87171");sBreak();
    }
    upd();
  }
}
function gameOver(){
  state="over";
  if(score>best){best=Math.floor(score);saveBest("mg_g364",best);}
  upd();
  ovTitle.textContent="琴弦崩断";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+Math.floor(score)+" · 最佳 "+best;
  ovDesc.textContent="最高连击 "+maxCombo+"\n长音要屏息按住,再来一遍!";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function update(now){
  var dt=now-prevNow;prevNow=now;
  var i,n,x;
  for(i=0;i<notes.length;i++){
    n=notes[i];
    if(n.holding){
      score+=dt*0.12;
      if(now>=n.t+n.dur){
        n.holding=false;n.done=true;score+=150;
        addPop(n.lane*LW+LW/2,JY-46,"绵延 +150","#fbbf24");sDone();
        upd();
      }
    }
  }
  for(i=notes.length-1;i>=0;i--){
    n=notes[i];
    if(n.done){notes.splice(i,1);continue;}
    if(!n.judged&&now>n.t+220){
      notes.splice(i,1);
      combo=0;life--;sMiss();
      x=n.lane*LW+LW/2;
      addPop(x,JY-46,"MISS","#f87171");
      upd();
      if(life<=0){gameOver();return;}
    }
    if(now>n.t+n.dur+600)notes.splice(i,1);
  }
  for(i=pops.length-1;i>=0;i--){if(now-pops[i].t0>560)pops.splice(i,1);}
  elScore.textContent=Math.floor(score);
}
function rrect(x,y,w,h,r){
  if(w<4)w=4;if(h<4)h=4;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(now){
  var i,n,x,y,hy,ty;
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(74,222,128,0.2)";
  ctx.beginPath();ctx.moveTo(LW,0);ctx.lineTo(LW,H);ctx.stroke();
  ctx.strokeStyle="rgba(74,222,128,0.9)";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,JY);ctx.lineTo(W,JY);ctx.stroke();ctx.lineWidth=1;
  for(i=0;i<notes.length;i++){
    n=notes[i];
    x=n.lane*LW+LW/2-24;
    hy=JY-(n.t-now)*(JY+40)/APPROACH;
    if(n.dur>0){
      ty=JY-(n.t+n.dur-now)*(JY+40)/APPROACH;
      var topY=Math.min(hy,ty),botY=Math.max(hy,ty);
      if(ty>H+60&&hy>H+60)continue;
      if(n.holding){
        ctx.fillStyle="rgba(74,222,128,0.75)";
        rrect(x,Math.min(JY,ty)-4,48,Math.abs(ty-JY)+8,6);ctx.fill();
      }else{
        ctx.fillStyle="rgba(96,165,250,0.35)";
        rrect(x,topY-4,48,(botY-topY)+8,6);ctx.fill();
      }
      ctx.strokeStyle="rgba(255,255,255,0.5)";
      rrect(x,topY-6,48,(botY-topY)+12,6);ctx.stroke();
      ctx.fillStyle=LCOL[n.lane];
      rrect(x,hy-12,48,24,8);ctx.fill();
    }else{
      if(hy<-40||hy>H+60)continue;
      ctx.fillStyle=LCOL[n.lane];
      rrect(x,hy-12,48,24,8);ctx.fill();
    }
  }
  for(i=0;i<LANES;i++){
    x=i*LW+40;
    ctx.fillStyle="rgba(74,222,128,0.15)";
    rrect(x,496,LW-80,50,10);ctx.fill();
    ctx.strokeStyle="rgba(74,222,128,0.5)";
    rrect(x,496,LW-80,50,10);ctx.stroke();
    ctx.fillStyle="rgba(232,234,246,0.8)";
    ctx.font="bold 22px system-ui";ctx.textAlign="center";
    ctx.fillText(KEYNAME[i],x+(LW-80)/2,529);
  }
  for(i=0;i<pops.length;i++){
    var p=pops[i],pr=(now-p.t0)/560;
    ctx.fillStyle=p.color;ctx.globalAlpha=1-pr;
    ctx.font="bold 15px system-ui";ctx.textAlign="center";
    ctx.fillText(p.txt,p.x,p.y-pr*26);
    ctx.globalAlpha=1;
  }
}
function toXY(cx,cy){
  var rect=cv.getBoundingClientRect();
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();var p=toXY(e.clientX,e.clientY);down(p.x<LW?0:1);});
  cv.addEventListener("pointerup",function(e){var p=toXY(e.clientX,e.clientY);up(p.x<LW?0:1);});
  cv.addEventListener("pointercancel",function(){up(0);up(1);});
}else{
  cv.addEventListener("mousedown",function(e){var p=toXY(e.clientX,e.clientY);down(p.x<LW?0:1);});
  cv.addEventListener("mouseup",function(e){var p=toXY(e.clientX,e.clientY);up(p.x<LW?0:1);});
  cv.addEventListener("touchstart",function(e){e.preventDefault();var t=e.changedTouches[0];var p=toXY(t.clientX,t.clientY);down(p.x<LW?0:1);},{passive:false});
  cv.addEventListener("touchend",function(e){e.preventDefault();up(0);up(1);},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state!=="play")start();
    return;
  }
  if(e.repeat)return;
  var l=keyLane[e.code];
  if(l===undefined)return;
  e.preventDefault();
  down(l);
});
window.addEventListener("keyup",function(e){
  var l=keyLane[e.code];
  if(l===undefined)return;
  up(l);
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play"){schedule(now);update(now);}
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极速连闯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f97316;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#f97316;font-size:16px}
.bar{flex:1;min-width:90px;height:10px;background:#0b0e1a;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#f97316;width:100%}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f97316}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f97316;color:#431407;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>极速连闯</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 一关接一关,别让沙漏漏完</p>
  <div class="hud">
    <span>第 <b id="lv">1</b> 关</span>
    <span>剩余</span>
    <div class="bar"><i id="tbar"></i></div>
    <span>连闯纪录 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">极速连闯</h2>
      <p id="ovDesc">时间只剩 15 秒,你面前是一座小迷宫——冲到绿色出口就立刻换下一座,并奖励 9 秒!迷宫会越换越大、越来越绕。看看不停表的前提下,你能连闯多少关!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始连闯</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var CW=462,CH=462;
function $(id){return document.getElementById(id);}
var elLv=$("lv"),elBar=$("tbar"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s279");
var state="menu";
var grid,player,exitCell,level,score,timeLeft,stepsTotal,elapsed,pulse,COLS,ROWS,CELL,off;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function genLevelN(n){
  var C=6+Math.min(4,n-1);
  COLS=C*2+1;ROWS=COLS;
  CELL=Math.floor(CW/COLS);
  grid=genMaze(C,C);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
}
function reset(){
  level=1;score=0;timeLeft=15;stepsTotal=0;elapsed=0;pulse=0;
  genLevelN(level);
  updateHud();
}
function updateHud(){
  elLv.textContent=level;
  elBar.style.width=Math.max(0,timeLeft/18*100)+"%";
  elBest.textContent=best;
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  stepsTotal++;
  if(nx===exitCell.x&&ny===exitCell.y){
    score=level;
    if(score>best){best=score;saveBest("mg_s279",best);}
    level++;
    timeLeft=Math.min(18,timeLeft+9);
    genLevelN(level);
    updateHud();
  }
}
function lose(){
  state="over";
  ovTitle.textContent="沙漏漏完了";
  ovDesc.textContent="你在第 "+level+" 关前被时间拦下。小迷宫别恋战,看到岔路要果断,越往后的迷宫越需要预判。";
  ovScore.style.display="block";
  ovScore.textContent="连闯 "+score+" 关 · 总步数 "+stepsTotal+" · 纪录 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#2b2440";
  ctx.fillRect(off+x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#3d3160";
  ctx.fillRect(off+x*CELL,y*CELL,CELL,3);
}
function draw(){
  var x,y;
  ctx.clearRect(0,0,CW,CH);
  off=(CW-COLS*CELL)/2;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1){
      drawWall(x,y);
    }
  }
  var ex=off+exitCell.x*CELL+CELL/2,ey=off+exitCell.y*CELL+CELL/2;
  var pr=CELL*0.35+Math.sin(pulse)*2;
  ctx.fillStyle="#4ade80";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#05230f";
  ctx.font="bold "+Math.max(8,CELL*0.45)+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("出",ex,ey);
  var px=off+player.x*CELL+CELL/2,py=off+player.y*CELL+CELL/2;
  ctx.fillStyle="#fdba74";
  ctx.shadowColor="#f97316";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,Math.max(5,CELL*0.36),0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(state==="playing"){
    timeLeft-=dt/1000;
    if(timeLeft<=0){timeLeft=0;updateHud();lose();draw();return;}
    updateHud();
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诱饵引信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#4ade80;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#4ade80;font-size:16px}
.bar{flex:1;min-width:80px;height:10px;background:#0b0e1a;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#22d3ee;width:0%}
.gbtn{background:#164e63;color:#67e8f9;border:1px solid #22d3ee;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn.on{background:#22d3ee;color:#052830;font-weight:700}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>诱饵引信</h1>
  <p class="hint">方向键 / WASD 移动 · 空格或按钮放诱饵 · 诱饵会引爆周围导弹</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>诱饵 <b id="dec">●●●</b></span>
    <div class="bar"><i id="chg"></i></div>
    <button class="gbtn" id="btnAct">放诱饵 [空格]</button>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">诱饵引信</h2>
      <p id="ovDesc">追踪导弹不断从场外扑来,你没有任何武器——但可以放置信号诱饵:导弹会被诱饵吸引,诱饵被撞爆时会摧毁周围的导弹(每台 +8 分)。诱饵最多囤 3 枚,每 6 秒回复一枚。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=480;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elDec=$("dec"),elChg=$("chg"),btnAct=$("btnAct");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var KEY="mg_s105";
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest(KEY);
var state="menu",score=0,timeMs=0,lastT=0;
var player={x:W/2,y:H/2};
var missiles=[],decoys=[],parts=[];
var spawnT=0,charges=3,chgT=0;
var keys={};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function d2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function rand(a,b){return a+Math.random()*(b-a);}
function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function updHud(){
  elScore.textContent=Math.floor(score);
  elBest.textContent=best;
  var s="",i;
  for(i=0;i<3;i++)s+=i<charges?"● ":"○ ";
  elDec.textContent=s;
  elChg.style.width=(charges>=3?100:chgT/6*100)+"%";
  btnAct.className=charges>0?"gbtn on":"gbtn";
}
function edgePoint(){
  var side=Math.floor(rand(0,4)),m=-16;
  if(side===0)return {x:rand(0,W),y:m};
  if(side===1)return {x:rand(0,W),y:H-m};
  if(side===2)return {x:m,y:rand(0,H)};
  return {x:W-m,y:rand(0,H)};
}
function reset(){
  score=0;timeMs=0;missiles=[];decoys=[];parts=[];keys={};
  player.x=W/2;player.y=H/2;
  spawnT=0.8;charges=3;chgT=0;
  updHud();
}
function burst(x,y,c,n){
  var i;
  for(i=0;i<n;i++){parts.push({x:x,y:y,vx:rand(-150,150),vy:rand(-150,150),t:0.55,c:c});}
}
function moveInput(){
  var mx=0,my=0;
  if(keys.ArrowLeft||keys.a)mx-=1;
  if(keys.ArrowRight||keys.d)mx+=1;
  if(keys.ArrowUp||keys.w)my-=1;
  if(keys.ArrowDown||keys.s)my+=1;
  var l=Math.sqrt(mx*mx+my*my);
  if(l>0){mx/=l;my/=l;}
  return {x:mx,y:my};
}
function placeDecoy(){
  if(state!=="playing"||charges<=0)return;
  charges--;
  decoys.push({x:player.x,y:player.y,t:4});
  burst(player.x,player.y,"#67e8f9",10);
  updHud();
}
function update(dt){
  var s=dt/1000,i,j;
  timeMs+=dt;score+=s*10;
  var mv=moveInput();
  player.x=clamp(player.x+mv.x*200*s,10,W-10);
  player.y=clamp(player.y+mv.y*200*s,10,H-10);
  if(charges<3){
    chgT+=s;
    if(chgT>=6){chgT=0;charges++;}
  }
  spawnT-=s;
  if(spawnT<=0){
    spawnT=Math.max(1.0,2.6-timeMs/40000);
    if(missiles.length<9){
      var ep=edgePoint();
      missiles.push({x:ep.x,y:ep.y,a:Math.atan2(player.y-ep.y,player.x-ep.x),life:10});
    }
  }
  for(i=decoys.length-1;i>=0;i--){
    decoys[i].t-=s;
    if(decoys[i].t<=0)decoys.splice(i,1);
  }
  for(i=0;i<missiles.length;i++){
    var ms=missiles[i];
    var tx=player.x,ty=player.y,bd=1e9,di=-1;
    for(j=0;j<decoys.length;j++){
      var dd=d2(ms.x,ms.y,decoys[j].x,decoys[j].y);
      if(dd<bd){bd=dd;di=j;}
    }
    if(di>=0){tx=decoys[di].x;ty=decoys[di].y;}
    var want=Math.atan2(ty-ms.y,tx-ms.x);
    var turn=2.4*s*(1+Math.min(0.6,timeMs/100000));
    ms.a+=clamp(angDiff(want,ms.a),-turn,turn);
    var sp=130+Math.min(95,timeMs/800);
    ms.px=ms.x;ms.py=ms.y;
    ms.x+=Math.cos(ms.a)*sp*s;
    ms.y+=Math.sin(ms.a)*sp*s;
    ms.life-=s;
  }
  for(i=decoys.length-1;i>=0;i--){
    var dc=decoys[i],hit=false;
    for(j=0;j<missiles.length;j++){
      if(d2(missiles[j].x,missiles[j].y,dc.x,dc.y)<17*17){hit=true;break;}
    }
    if(hit){
      burst(dc.x,dc.y,"#fbbf24",24);
      for(j=missiles.length-1;j>=0;j--){
        if(d2(missiles[j].x,missiles[j].y,dc.x,dc.y)<85*85){
          score+=8;
          burst(missiles[j].x,missiles[j].y,"#fb923c",8);
          missiles.splice(j,1);
        }
      }
      decoys.splice(i,1);
    }
  }
  for(i=missiles.length-1;i>=0;i--){
    var m=missiles[i];
    if(m.x<-40||m.x>W+40||m.y<-40||m.y>H+40||m.life<=0){missiles.splice(i,1);continue;}
    if(d2(m.x,m.y,player.x,player.y)<(7+8)*(7+8)){die("被追踪导弹击中!");return;}
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];p.t-=s;p.x+=p.vx*s;p.y+=p.vy*s;
    if(p.t<=0)parts.splice(i,1);
  }
  updHud();
}
function die(msg){
  state="over";
  burst(player.x,player.y,"#22d3ee",26);
  if(Math.floor(score)>best){best=Math.floor(score);saveBest(KEY,best);}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+Math.floor(score)+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function drawGrid(){
  var x,y;
  ctx.fillStyle="rgba(255,255,255,0.03)";
  for(x=0;x<W;x+=40)for(y=0;y<H;y+=40)ctx.fillRect(x+1,y+1,38,38);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawGrid();
  var i;
  for(i=0;i<decoys.length;i++){
    var dc=decoys[i];
    ctx.save();
    ctx.translate(dc.x,dc.y);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle="#67e8f9";
    ctx.shadowColor="#67e8f9";ctx.shadowBlur=14;
    ctx.fillRect(-7,-7,14,14);
    ctx.restore();
    ctx.strokeStyle="rgba(103,232,249,"+(0.3+0.3*Math.sin(timeMs*0.01))+")";
    ctx.beginPath();ctx.arc(dc.x,dc.y,15+Math.sin(timeMs*0.01)*3,0,Math.PI*2);ctx.stroke();
  }
  ctx.shadowBlur=0;
  for(i=0;i<missiles.length;i++){
    var m=missiles[i];
    if(m.px!==undefined){
      ctx.strokeStyle="rgba(251,146,60,0.4)";
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(m.px,m.py);ctx.lineTo(m.x,m.y);ctx.stroke();
      ctx.lineWidth=1;
    }
    ctx.save();
    ctx.translate(m.x,m.y);
    ctx.rotate(m.a);
    ctx.fillStyle="#fb923c";
    ctx.shadowColor="#fb923c";ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(9,0);ctx.lineTo(-6,-5);ctx.lineTo(-6,5);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur=0;
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.t*2);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#22d3ee";
  ctx.shadowColor="#22d3ee";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(player.x,player.y,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(34,211,238,0.35)";
  ctx.beginPath();ctx.arc(player.x,player.y,13,0,Math.PI*2);ctx.stroke();
}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
function kn(e){var k=e.key;return k.length===1?k.toLowerCase():k;}
document.addEventListener("keydown",function(e){
  var k=kn(e);
  if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"||k===" ")e.preventDefault();
  if(state!=="playing"){
    if(k===" "||k==="Enter")startGame();
    return;
  }
  keys[k]=true;
  if(k===" "&&!e.repeat)placeDecoy();
});
document.addEventListener("keyup",function(e){keys[kn(e)]=false;});
btnAct.addEventListener("click",placeDecoy);
var tId=null,lx=0,ly=0;
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  var t=e.changedTouches[0];tId=t.identifier;
  var r=cv.getBoundingClientRect();
  lx=(t.clientX-r.left)*(W/r.width);ly=(t.clientY-r.top)*(H/r.height);
},{passive:false});
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect(),i,t;
  for(i=0;i<e.changedTouches.length;i++){
    t=e.changedTouches[i];
    if(t.identifier===tId){
      var x=(t.clientX-r.left)*(W/r.width),y=(t.clientY-r.top)*(H/r.height);
      player.x=clamp(player.x+(x-lx),10,W-10);
      player.y=clamp(player.y+(y-ly),10,H-10);
      lx=x;ly=y;
    }
  }
},{passive:false});
function tEnd(e){
  var i;
  for(i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===tId)tId=null;}
}
cv.addEventListener("touchend",tEnd,{passive:false});
cv.addEventListener("touchcancel",tEnd,{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

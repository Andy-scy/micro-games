<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜市三摊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fbbf24;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fbbf24;font-size:16px}
.stage{position:relative;background:#1f1626;border:2px solid #3a2a44;border-radius:12px;padding:12px}
.stalls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stall{background:#251a2e;border:2px solid #3a2a44;border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;user-select:none}
.stall.cur{border-color:#fbbf24;box-shadow:0 0 14px rgba(251,191,36,.45)}
.stall .snm{font-size:14px;font-weight:700;color:#c7cbe8}
.stall .sic{font-size:22px;margin:4px 0}
.stall .seat{font-size:20px;min-height:26px}
.stall .pbar{height:8px;border-radius:4px;background:#111527;overflow:hidden;margin:4px 0}
.stall .pbar i{display:block;height:100%;background:#4ade80}
.stall .mbar{height:10px;border-radius:5px;background:#111527;overflow:hidden;margin-top:4px}
.stall .mbar i{display:block;height:100%;width:0;background:#fbbf24}
.stall .st{font-size:11px;color:#8b90b0;margin-top:4px;min-height:15px}
.acts{text-align:center;margin-top:12px}
.acts button{background:#fbbf24;color:#3a2408;border:none;border-radius:12px;padding:14px 38px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.acts button:active{transform:scale(.95)}
.keys{text-align:center;color:#555b80;font-size:12px;margin-top:6px}
.msg{text-align:center;color:#fbbf24;font-size:14px;font-weight:700;height:20px;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fbbf24}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#fbbf24;color:#3a2408;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>夜市三摊</h1>
  <p class="hint">你有三个摊位!<b style="color:#fbbf24">点摊位 / 按 1~2~3 切换</b>,在当前摊位狂按 空格 或按钮翻炒<br>离摊后火候会流失,客人耐心耗尽就跑,跑 3 位收摊!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>生命 <b id="life">♥♥♥</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <div class="stalls" id="stalls"></div>
    <div class="acts"><button id="btnMash">🥄 大火翻炒!(空格)</button></div>
    <div class="keys">数字键 1 / 2 / 3 快速切换摊位</div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">夜市三摊</h2>
      <p id="ovDesc">每个摊位都有自己的客人与火候条:只有你待在的摊位,翻炒才有效;离开的摊位火候每秒流失。火候满了自动出餐,客人耐心见底就跑人。切换摊位需要一点走动时间,注意统筹!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var ST=[["🍢","烤串摊"],["🍧","糖水摊"],["🍜","炒面摊"]];
var elScore=$("score"),elLife=$("life"),elBest=$("best");
var stallsEl=$("stalls"),btnMash=$("btnMash"),msg=$("msg");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s816");
var state="menu",stalls,active,switchT,score,lives,lastT,msgT;
var stallEls=[];

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function build(){
  for(var i=0;i<3;i++){
    var d=document.createElement("div");
    d.className="stall";
    d.setAttribute("data-i",String(i));
    d.innerHTML='<div class="snm">'+ST[i][1]+'</div><div class="sic">'+ST[i][0]+'</div>'
      +'<div class="seat">·</div><div class="pbar"><i></i></div>'
      +'<div class="mbar"><i></i></div><div class="st">等待客人</div>';
    stallsEl.appendChild(d);
    stallEls.push({box:d,seat:d.children[2],pfill:d.children[3].children[0],mfill:d.children[4].children[0],st:d.children[5]});
  }
}
function rate(){return Math.min(16,6+score*0.1);}
function reset(){
  stalls=[{cust:null,meter:0,spawnT:0.4},{cust:null,meter:0,spawnT:0.4},{cust:null,meter:0,spawnT:0.4}];
  active=0;switchT=0;score=0;lives=3;
  msg.textContent="";msgT=0;render();updateHud();
}
function updateHud(){
  elScore.textContent=score;elBest.textContent=best;
  var s="";for(var i=0;i<lives;i++)s+="♥";elLife.textContent=s||"—";
}
function showMsg(t,c){msg.textContent=t;msg.style.color=c||"#fbbf24";msgT=1.3;}
function render(){
  var i;
  for(i=0;i<3;i++){
    var s=stalls[i],e=stallEls[i];
    e.box.className="stall"+(i===active?" cur":"");
    if(!s.cust){e.seat.textContent="·";e.pfill.style.width="0";}
    else{
      e.seat.textContent="😋";
      var p=Math.max(0,s.cust.patience);
      e.pfill.style.width=p+"%";
      e.pfill.style.background=p>45?"#4ade80":"#f87171";
    }
    e.mfill.style.width=Math.min(100,s.meter)+"%";
    e.st.textContent=i===active?(switchT>0?"走动中…":"当前摊位"):"隔壁摊";
  }
}
function switchTo(i){
  if(state!=="playing"||i===active||switchT>0)return;
  active=i;switchT=0.35;
  render();
}
function mash(){
  if(state!=="playing")return;
  if(switchT>0)return;
  var s=stalls[active];
  if(!s.cust){showMsg("这个摊位还没客人!","#e8b06a");return;}
  s.meter+=7;
  render();
}
function gameOver(){
  state="over";
  if(score>best){best=score;saveBest("mg_s816",best);}
  ovTitle.textContent="今晚收摊";
  ovDesc.textContent="三位客人等不及走了,夜市口碑要慢慢攒。";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  render();updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  var dts=dt/1000;
  if(msgT>0){msgT-=dts;if(msgT<=0){msg.textContent="";msgT=0;}}
  if(state!=="playing")return;
  var i;
  if(switchT>0)switchT-=dts;
  for(i=0;i<3;i++){
    var s=stalls[i];
    if(i!==active&&s.meter>0)s.meter=Math.max(0,s.meter-3*dts);
    if(s.cust){
      s.cust.patience-=rate()*dts;
      if(s.cust.patience<=0){
        s.cust=null;s.spawnT=1;lives--;
        showMsg(ST[i][1]+"的客人跑单了!","#f87171");
        updateHud();
        if(lives<=0){render();gameOver();return;}
      }
    }else{
      s.spawnT-=dts;
      if(s.spawnT<=0){s.cust={patience:100};s.spawnT=0;}
    }
    if(s.cust&&s.meter>=100){
      var pts=20+Math.round(s.cust.patience/4);
      score+=pts;s.cust=null;s.meter=0;s.spawnT=0.9;
      showMsg(ST[i][1]+"出餐 +"+pts,"#4ade80");
      updateHud();
    }
  }
  render();
}
stallsEl.addEventListener("click",function(e){
  var n=e.target;
  while(n&&n!==stallsEl&&!n.getAttribute("data-i"))n=n.parentNode;
  if(n&&n!==stallsEl)switchTo(parseInt(n.getAttribute("data-i"),10));
});
btnMash.addEventListener("click",mash);
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.code==="Space"){e.preventDefault();if(state!=="playing")startGame();else mash();}
  else if(e.key==="1")switchTo(0);
  else if(e.key==="2")switchTo(1);
  else if(e.key==="3")switchTo(2);
});
btnGo.addEventListener("click",startGame);
build();
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熔岩追击</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:8px 0 2px;color:#ff5d33;letter-spacing:1px}
p.tip{margin:4px 0 10px;font-size:13px;color:#aab0d0;line-height:1.7}
#hud{display:flex;justify-content:space-between;font-size:14px;color:#cfd3ee;margin:0 2px 8px}
#hud b{color:#ff5d33}
#stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2c3154;background:#0f1220}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,26,.84);text-align:center;padding:16px}
.hidden{display:none}
.ovBig{font-size:26px;font-weight:bold;color:#ff5d33}
#ovTitle{font-size:26px;font-weight:bold;color:#ff5d73}
#ovInfo{font-size:14px;color:#aab0d0}
button{background:#ff5d33;color:#141628;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<h1>熔岩追击</h1>
<p class="tip">按住 鼠标 / 触屏 / 空格 上升,松开下坠。这次撞壁不会立刻死,但飞行器会踉跄减速,身后的熔岩墙就会逼近一步!被熔岩追上即失败,且熔岩从未停止缓慢爬升——保持干净飞行。</p>
<div id="hud"><span>距离:<b id="score">0</b> m</span><span>踉跄:<b id="st">0</b> 次</span><span>最佳:<b id="best">0</b> m</span></div>
<div id="stage">
<canvas id="cv" width="640" height="420"></canvas>
<div id="ovStart" class="overlay"><div class="ovBig">熔岩在身后!</div><div style="font-size:13px;color:#aab0d0">撞壁=踉跄减速 · 熔岩会借机逼近</div><button id="btnStart">开始游戏</button></div>
<div id="ovOver" class="overlay hidden"><div id="ovTitle">被熔岩吞没了!</div><div id="ovInfo"></div><button id="btnRe">再来一局</button></div>
</div>
</div>
<script>
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var COL=8;
var state="ready",holding=false,tG=0;
var scrollX,speed,dist,py,vy,cols,genX,parts,score;
var lavaX,stumbleT,stumbles;
var best=0;
function loadBest(k){try{var v=localStorage.getItem(k);return v?(parseInt(v,10)||0):0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
best=loadBest("mg892best");
$("best").textContent=best;

function reset(){
  scrollX=0;speed=165;dist=0;score=0;
  py=H/2;vy=0;cols=[];genX=-48;parts=[];
  lavaX=-240;stumbleT=0;stumbles=0;
  while(genX<W+96){pushCol();}
  updHud();
}
function terrainC(x){
  return H/2+Math.sin(x*0.0042)*58+Math.sin(x*0.0117+1.3)*30+Math.sin(x*0.031+4.1)*11;
}
function gapAt(x){return 180+Math.sin(x*0.006+2.0)*18;}
function pushCol(){
  var g=gapAt(genX),c=terrainC(genX);
  var m=g/2+26;
  c=Math.max(m,Math.min(H-m,c));
  cols.push({x:genX,t:c-g/2,b:c+g/2});
  genX+=COL;
}
function colAt(x){
  if(!cols.length)return{t:0,b:H};
  var i=Math.floor((x-cols[0].x)/COL);
  if(i<0)i=0;if(i>cols.length-2)i=cols.length-2;
  return cols[i];
}
function pX(){return scrollX+150;}
function updHud(){$("score").textContent=score;$("st").textContent=stumbles;}
function update(dt){
  speed=Math.min(300,165+dist*0.010);
  var eff=stumbleT>0?speed*0.35:speed;
  scrollX+=eff*dt;
  dist+=eff*dt;
  score=Math.floor(dist/10);
  while(genX<scrollX+W+96)pushCol();
  while(cols.length>2&&cols[0].x+COL<scrollX-64)cols.shift();
  vy+=(holding?-600:540)*dt;
  vy=Math.max(-280,Math.min(320,vy));
  py+=vy*dt;
  if(py<8){py=8;vy=Math.max(vy,0);}
  if(py>H-8){py=H-8;vy=Math.min(vy,0);}
  var c=colAt(pX());
  if(py-11<c.t||py+11>c.b){
    if(stumbleT<=0){
      stumbleT=0.85;stumbles++;vy=0;
      if(navigator.vibrate)navigator.vibrate(60);
    }
  }
  if(stumbleT>0){
    stumbleT-=dt;
    var mid=(c.t+c.b)/2;
    py+=(mid-py)*Math.min(1,5*dt);
  }
  lavaX+=(stumbleT>0?175:-22)*dt;
  if(lavaX<-260)lavaX=-260;
  if(lavaX>157){die();return;}
  var i;
  if(holding&&Math.random()<0.5)parts.push({x:132,y:py+5,life:0.45});
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x-=(eff+120)*dt;if(p.life<=0)parts.splice(i,1);}
  updHud();
}
function die(){
  if(state!=="play")return;
  state="over";
  if(score>best){best=score;saveBest("mg892best",best);$("best").textContent=best;}
  $("ovInfo").textContent="在熔岩前逃出了 "+score+" m(踉跄 "+stumbles+" 次),最佳 "+best+" m";
  $("ovOver").classList.remove("hidden");
}
function start(){reset();state="play";$("ovStart").classList.add("hidden");$("ovOver").classList.add("hidden");holding=false;}
function onHold(b){
  if(state==="ready"&&b){start();}
  if(state==="over")return;
  holding=b;
}
function drawBg(){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#1c1420");bg.addColorStop(1,"#120b12");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
}
function drawCave(){
  if(cols.length<2)return;
  var i0=0;
  while(i0<cols.length-1&&cols[i0].x+COL<scrollX-16)i0++;
  var last=cols.length-1;
  var ex=Math.min(W+16,cols[last].x-scrollX);
  ctx.fillStyle="#33253a";
  ctx.beginPath();ctx.moveTo(cols[i0].x-scrollX,0);
  for(var i=i0;i<cols.length&&cols[i].x<scrollX+W+16;i++)ctx.lineTo(cols[i].x-scrollX,cols[i].t);
  ctx.lineTo(ex,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cols[i0].x-scrollX,H);
  for(var j=i0;j<cols.length&&cols[j].x<scrollX+W+16;j++)ctx.lineTo(cols[j].x-scrollX,cols[j].b);
  ctx.lineTo(ex,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#8a5f6a";ctx.lineWidth=3;
  ctx.beginPath();var st=false;
  for(var k=i0;k<cols.length&&cols[k].x<scrollX+W+16;k++){var sx=cols[k].x-scrollX;if(!st){ctx.moveTo(sx,cols[k].t);st=true;}else ctx.lineTo(sx,cols[k].t);}
  ctx.stroke();
  ctx.beginPath();st=false;
  for(var k2=i0;k2<cols.length&&cols[k2].x<scrollX+W+16;k2++){var sx2=cols[k2].x-scrollX;if(!st){ctx.moveTo(sx2,cols[k2].b);st=true;}else ctx.lineTo(sx2,cols[k2].b);}
  ctx.stroke();
}
function drawLava(){
  var edge=lavaX;
  if(edge<-280)return;
  ctx.save();
  var g=ctx.createLinearGradient(edge-60,0,edge+30,0);
  g.addColorStop(0,"#8f1d1d");g.addColorStop(0.7,"#e04b1f");g.addColorStop(1,"#ffd166");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-20,-10);
  for(var y=-10;y<=H+10;y+=14){
    ctx.lineTo(edge+Math.sin(y*0.045+tG*6)*8+Math.sin(y*0.11-tG*3.7)*4,y);
  }
  ctx.lineTo(-20,H+10);
  ctx.closePath();ctx.fill();
  ctx.globalAlpha=0.35;
  ctx.fillStyle="#ff8c42";
  ctx.beginPath();
  ctx.moveTo(-20,-10);
  for(var y2=-10;y2<=H+10;y2+=14){
    ctx.lineTo(edge+18+Math.sin(y2*0.05+tG*5+2)*9,y2);
  }
  ctx.lineTo(-20,H+10);
  ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
  if(edge>-40){
    ctx.fillStyle="rgba(255,120,60,"+(0.5+0.3*Math.sin(tG*8))+")";
    ctx.font="bold 15px system-ui,sans-serif";
    ctx.textAlign="center";
    ctx.fillText("熔岩逼近!",Math.max(60,edge+8),H/2);
    ctx.textAlign="left";
  }
}
function drawShip(){
  var sx=150,sy=py;
  if(stumbleT>0&&Math.sin(tG*30)>0){
    ctx.save();ctx.restore();
  }else{
    ctx.save();ctx.translate(sx,sy);
    ctx.rotate(Math.max(-0.5,Math.min(0.5,vy*0.0016))+(stumbleT>0?Math.sin(tG*25)*0.12:0));
    ctx.fillStyle="rgba(255,209,102,0.7)";
    for(var i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillRect(p.x-150+16,p.y-py,3,3);}
    ctx.globalAlpha=1;
    ctx.fillStyle="#ffd166";
    ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-9);ctx.lineTo(-6,0);ctx.lineTo(-10,9);ctx.closePath();ctx.fill();
    ctx.fillStyle="#ff9f43";ctx.beginPath();ctx.arc(-2,0,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function draw(){
  ctx.save();
  if(stumbleT>0)ctx.translate((Math.random()-0.5)*5,(Math.random()-0.5)*5);
  drawBg();
  drawCave();
  drawLava();
  drawShip();
  ctx.restore();
}
$("btnStart").addEventListener("click",function(){start();});
$("btnRe").addEventListener("click",function(){start();});
cv.addEventListener("mousedown",function(e){e.preventDefault();onHold(true);});
window.addEventListener("mouseup",function(){onHold(false);});
cv.addEventListener("touchstart",function(e){e.preventDefault();onHold(true);},{passive:false});
window.addEventListener("touchend",function(){onHold(false);});
window.addEventListener("touchcancel",function(){onHold(false);});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();if(!e.repeat)onHold(true);}
});
window.addEventListener("keyup",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")onHold(false);
});
window.addEventListener("blur",function(){holding=false;});
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.033,((t-lastT)/1000)||0);lastT=t;
  tG+=dt;
  if(state==="play")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>

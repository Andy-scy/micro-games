<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竖巷快攻</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;gap:10px}
h1{margin:2px 0;font-size:22px;letter-spacing:4px;color:#fda4af}
#wrap{position:relative;width:min(92vw,560px)}
canvas{display:block;width:100%;height:auto;border-radius:14px;background:#141830;box-shadow:0 0 0 1px #262b4a;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,12,26,.86);border-radius:14px;text-align:center;padding:16px}
#overlay.hide{display:none}
#msg{font-size:15px;line-height:2;white-space:pre-line}
#row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{background:#fb7185;color:#2b0710;border:none;border-radius:10px;padding:10px 26px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>竖巷快攻</h1>
<div id="wrap">
<canvas id="cv" width="520" height="680"></canvas>
<div id="overlay"><div id="msg"></div><div id="row"></div></div>
</div>
<script>
'use strict';
var W=520,H=680,WIN=7,BASE=5.2;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var overlay=document.getElementById('overlay'),msg=document.getElementById('msg'),row=document.getElementById('row');
var state='menu';
var player={x:W/2-55,y:H-46,w:110,h:14};
var ai={x:W/2-55,y:32,w:110,h:14};
var ball={x:W/2,y:H/2,vx:0,vy:0,r:9,speed:BASE};
var sp=0,sa=0,serveT=0,keys={},mouseX=null;

function mkBtn(text,fn){
  var b=document.createElement('button');
  b.className='btn';b.textContent=text;
  b.addEventListener('click',fn);
  row.appendChild(b);
  return b;
}
var bStart=mkBtn('开始游戏',function(){start();});
function showMenu(){
  state='menu';
  msg.textContent='狭窄竖巷里的上下对攻，你守下方球门！\n先得 7 分者胜。\n操作：← → （A/D）左右移动，或鼠标/触屏左右滑动。';
  bStart.textContent='开始游戏';
  overlay.classList.remove('hide');
}
function start(){
  sp=0;sa=0;keys={};mouseX=null;
  player.x=W/2-player.w/2;ai.x=W/2-ai.w/2;
  serve(Math.random()<0.5?1:-1);
  state='play';
  overlay.classList.add('hide');
}
function serve(dir){
  ball.x=W/2+(Math.random()*140-70);ball.y=H/2;
  ball.speed=BASE;
  var a=Math.random()*0.7-0.35;
  ball.vx=Math.sin(a)*ball.speed;
  ball.vy=Math.cos(a)*ball.speed*dir;
  serveT=45;
}
function endGame(win){
  state='end';
  msg.textContent=(win?'胜利！竖巷之主':'败北…巷道太深球太快')+'\n最终比分 '+sp+' : '+sa;
  bStart.textContent='再来一局';
  overlay.classList.remove('hide');
}
function afterPoint(dir){
  if(sp>=WIN){endGame(true);}
  else if(sa>=WIN){endGame(false);}
  else{serve(dir);}
}
function hitPaddle(p,dir){
  if(ball.vy*dir>=0){return;}
  if(ball.x+ball.r<p.x||ball.x-ball.r>p.x+p.w||ball.y+ball.r<p.y||ball.y-ball.r>p.y+p.h){return;}
  var rel=(ball.x-(p.x+p.w/2))/(p.w/2);
  rel=Math.max(-1,Math.min(1,rel));
  var ang=rel*0.95;
  ball.speed=Math.min(11,ball.speed+0.25);
  ball.vx=Math.sin(ang)*ball.speed;
  ball.vy=Math.cos(ang)*ball.speed*dir;
  ball.y=dir>0?p.y+p.h+ball.r:p.y-ball.r;
}
function update(dt){
  var mv=0;
  if(keys.left){mv=-1;}else if(keys.right){mv=1;}
  if(mv!==0){mouseX=null;player.x+=mv*7.2*dt;}
  else if(mouseX!==null){player.x+=(mouseX-(player.x+player.w/2))*Math.min(1,0.3*dt);}
  player.x=Math.max(6,Math.min(W-player.w-6,player.x));
  var tx=ball.vy<0?ball.x:W/2;
  var diff=tx-(ai.x+ai.w/2);
  ai.x+=Math.max(-4.8*dt,Math.min(4.8*dt,diff*0.14));
  ai.x=Math.max(6,Math.min(W-ai.w-6,ai.x));
  if(serveT>0){serveT-=dt;return;}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}
  hitPaddle(player,-1);hitPaddle(ai,1);
  if(ball.y>H+26){sa++;afterPoint(1);}
  else if(ball.y<-26){sp++;afterPoint(-1);}
}
function pad(p,color){ctx.fillStyle=color;ctx.fillRect(p.x,p.y,p.w,p.h);}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(232,234,246,.14)';
  ctx.lineWidth=3;ctx.setLineDash([10,14]);
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign='center';
  ctx.font='bold 44px system-ui';
  ctx.fillStyle='rgba(232,234,246,.85)';
  ctx.fillText(sp,W/2-60,H/2-24);
  ctx.fillText(sa,W/2+60,H/2-24);
  ctx.font='13px system-ui';
  ctx.fillStyle='#fda4af';
  ctx.fillText('竖向场地 · 上下对攻 · 先得 7 分',W/2,H-12);
  pad(player,'#38bdf8');pad(ai,'#f472b6');
  ctx.fillStyle='#f8fafc';
  if(serveT>0){
    if(Math.floor(serveT/12)%2===0){
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    }
    ctx.font='20px system-ui';ctx.fillStyle='#facc15';
    ctx.fillText('准备…',W/2,H/2+60);
  }else{
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  }
}
var last=0;
function loop(t){
  var dt=Math.min(2.5,Math.max(0.2,(t-last)/16.7));
  last=t;
  if(state==='play'){update(dt);}
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){keys.left=true;e.preventDefault();}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){keys.right=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){keys.left=false;}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){keys.right=false;}
});
function ptrX(e){
  var r=cv.getBoundingClientRect();
  var cx=e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX;
  mouseX=(cx-r.left)*(W/r.width);
}
cv.addEventListener('mousemove',ptrX);
cv.addEventListener('touchstart',function(e){e.preventDefault();ptrX(e);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();ptrX(e);},{passive:false});
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>

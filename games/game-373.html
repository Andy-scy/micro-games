<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光斑连锁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#22d3ee;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#22d3ee;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#22d3ee}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#22d3ee;color:#04222a;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>光斑连锁</h1>
  <p class="hint">随节拍亮起的格子要尽快点掉 · 反应越快评级越高 · 连击提升倍率</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>倍率 <b id="mult">x1</b></span>
    <span>生命 <b id="life">5</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">光斑连锁</h2>
      <p id="ovDesc">每个节拍,九宫格上会随机亮起光斑。
在光斑熄灭前点掉它:亮起 0.35 秒内点中=完美!
光斑消失都没人点则扣生命,点错灭格会断连击。
连击每 8 点提升一档倍率,最高 4 倍;
节拍还会越来越快,漏 5 个游戏结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elMult=$("mult"),elLife=$("life");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,GX=60,GY=140,CELL=120,GAP=8;
var BPM0=100,BPMAX=160;
var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function sHit(per){tone("triangle",per?880:600,per?1300:600,0.1,0.22);noiseHit(0.03,0.08,6000);}
function sMiss(){tone("sawtooth",200,100,0.22,0.18);}
function sTick(){noiseHit(0.035,0.05,8000);}

var state="menu",bpm,pads,pops,score,combo,life,maxCombo,hits,total,beatNo,nextBeat;
function beatInt(){return 60000/bpm;}
function reset(){
  bpm=BPM0;pads=[];pops=[];
  for(var i=0;i<9;i++)pads.push({lit:false,litT:0,deadline:0});
  score=0;combo=0;life=5;maxCombo=0;hits=0;total=0;beatNo=0;
  nextBeat=performance.now()+1600;
  upd();
}
function start(){audio();reset();state="play";ov.classList.add("hide");}
function mult(){return Math.min(4,1+Math.floor(combo/8));}
function upd(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elMult.textContent="x"+mult();
  elLife.textContent=life;
}
function addPop(x,y,txt,color){pops.push({x:x,y:y,txt:txt,color:color,t0:performance.now()});}
function padCX(i){return GX+(i%3)*CELL+CELL/2;}
function padCY(i){return GY+Math.floor(i/3)*CELL+CELL/2;}
function gameOver(){
  state="over";
  ovTitle.textContent="光斑熄灭";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最高连击 "+maxCombo;
  ovDesc.textContent="点灭 "+hits+"/"+total+" 个光斑\n手速与节奏并重,再来一局!";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function fire(now){
  var litDur=beatInt()*0.72;
  var k=1;
  if(beatNo>=16&&Math.random()<0.6)k=2;
  var i,c,tries;
  for(c=0;c<k;c++){
    var picked=-1;
    for(tries=0;tries<24;tries++){
      i=(Math.random()*9)|0;
      if(!pads[i].lit){picked=i;break;}
    }
    if(picked<0)break;
    pads[picked].lit=true;
    pads[picked].litT=now;
    pads[picked].deadline=now+litDur;
    total++;
  }
}
function schedule(now){
  if(now-nextBeat>4000)nextBeat=now+400;
  while(now>=nextBeat){
    beatNo++;
    fire(nextBeat);
    sTick();
    nextBeat+=beatInt();
    if(beatNo%16===0&&bpm<BPMAX)bpm=Math.min(BPMAX,bpm+6);
  }
  var i;
  for(i=0;i<9;i++){
    if(pads[i].lit&&now>pads[i].deadline){
      pads[i].lit=false;
      combo=0;life--;sMiss();
      addPop(padCX(i),padCY(i),"熄灭","#f87171");
      upd();
      if(life<=0){gameOver();return;}
    }
  }
  for(i=pops.length-1;i>=0;i--){if(now-pops[i].t0>560)pops.splice(i,1);}
}
function clickAt(x,y){
  if(state!=="play")return;
  var now=performance.now(),i;
  for(i=0;i<9;i++){
    var cx=padCX(i),cy=padCY(i);
    if(Math.abs(x-cx)<=CELL/2-2&&Math.abs(y-cy)<=CELL/2-2){
      if(!pads[i].lit){
        combo=0;
        addPop(cx,cy,"误触","#8b90b0");
        sMiss();upd();return;
      }
      var rt=now-pads[i].litT;
      pads[i].lit=false;
      hits++;
      if(rt<=350){
        combo++;if(combo>maxCombo)maxCombo=combo;
        var g=200*mult();
        score+=g;
        addPop(cx,cy,"完美 +"+g,"#fbbf24");sHit(true);
      }else{
        combo++;score+=80*mult();
        addPop(cx,cy,"慢了 +"+(80*mult()),"#22d3ee");sHit(false);
      }
      upd();return;
    }
  }
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(now){
  var i,p,x,y;
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  for(i=0;i<9;i++){
    p=pads[i];
    x=GX+(i%3)*CELL+GAP/2;
    y=GY+Math.floor(i/3)*CELL+GAP/2;
    if(p.lit){
      var age=now-p.litT;
      var a=age<90?age/90:1;
      ctx.fillStyle="rgba(34,211,238,"+(0.35+0.4*a)+")";
      rrect(x,y,CELL-GAP,CELL-GAP,14);ctx.fill();
      ctx.strokeStyle="rgba(34,211,238,0.9)";
      rrect(x,y,CELL-GAP,CELL-GAP,14);ctx.stroke();
      var rr=(age/900)*70;
      if(rr<60){
        ctx.strokeStyle="rgba(34,211,238,"+(0.5*(1-rr/60))+")";
        ctx.beginPath();ctx.arc(padCX(i),padCY(i),20+rr,0,Math.PI*2);ctx.stroke();
      }
    }else{
      ctx.fillStyle="rgba(34,211,238,0.07)";
      rrect(x,y,CELL-GAP,CELL-GAP,14);ctx.fill();
      ctx.strokeStyle="rgba(34,211,238,0.18)";
      rrect(x,y,CELL-GAP,CELL-GAP,14);ctx.stroke();
    }
  }
  ctx.fillStyle="rgba(139,144,176,0.7)";
  ctx.font="13px system-ui";ctx.textAlign="center";
  ctx.fillText("节拍 "+Math.round(bpm)+" BPM",W/2,546);
  for(i=0;i<pops.length;i++){
    var pp=pops[i],pr=(now-pp.t0)/560;
    ctx.fillStyle=pp.color;ctx.globalAlpha=1-pr;
    ctx.font="bold 16px system-ui";
    ctx.fillText(pp.txt,pp.x,pp.y-pr*24);
    ctx.globalAlpha=1;
  }
}
function toXY(cx,cy){
  var rect=cv.getBoundingClientRect();
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
function onTap(cx,cy){
  var p=toXY(cx,cy);
  clickAt(p.x,p.y);
}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();onTap(e.clientX,e.clientY);});
}else{
  cv.addEventListener("mousedown",function(e){onTap(e.clientX,e.clientY);});
  cv.addEventListener("touchstart",function(e){e.preventDefault();var t=e.changedTouches[0];onTap(t.clientX,t.clientY);},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state!=="play")start();
  }
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play")schedule(now);
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摘星炮台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fde047;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fde047;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fde047}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#fde047;color:#3a3004;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>摘星炮台</h1>
  <p class="hint">移动鼠标瞄准 · 按住蓄力(力度来回摆动)· 松手发射 · 每关 5 发收齐 3 颗星</p>
  <div class="hud">
    <span>关卡 <b id="lv">1</b></span>
    <span>炮弹 <b id="am">5</b></span>
    <span>本关星 <b id="st">0/3</b></span>
    <span>总星 <b id="tot">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="520"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">摘星炮台</h2>
      <p id="ovDesc">左下角的炮台等待你的指挥:移动鼠标(或上下键)调整仰角,按住鼠标/空格开始蓄力——力度条会来回摆动,在合适的松手时机发射!炮弹会反弹,用有限的 5 发炮弹摘下关卡里的 3 颗星。用弹越少,星级越高!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=520,CX=50,CY=470,BR=7,GY=488,GRAV=0.0009;
function $(id){return document.getElementById(id);}
var elLv=$("lv"),elAm=$("am"),elSt=$("st"),elTot=$("tot"),elBest=$("best");
var ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s399");
var LEVELS=[
 {stars:[{x:300,y:200},{x:400,y:340},{x:180,y:120}],plats:[{x:260,y:420,w:180,h:14}]},
 {stars:[{x:420,y:120},{x:240,y:220},{x:120,y:300}],plats:[{x:150,y:380,w:200,h:14},{x:380,y:260,w:80,h:14}]},
 {stars:[{x:440,y:80},{x:300,y:160},{x:150,y:240}],plats:[{x:100,y:300,w:120,h:14},{x:280,y:220,w:100,h:14},{x:400,y:140,w:70,h:14}]}
];
var state,lv,ammo,starsGot,totalStars,stars,plats,ball,angle,charging,cPow,cDir,slowT,flyT,keyU,keyD,msg,msgT,pulse;
function reset(){lv=0;totalStars=0;loadLevel();updateHud();}
function loadLevel(){
  var L=LEVELS[lv],i;
  ammo=5;starsGot=0;
  stars=[];
  for(i=0;i<L.stars.length;i++)stars.push({x:L.stars[i].x,y:L.stars[i].y,got:false});
  plats=[];
  for(i=0;i<L.plats.length;i++)plats.push({x:L.plats[i].x,y:L.plats[i].y,w:L.plats[i].w,h:L.plats[i].h});
  ball=null;angle=-0.7;charging=false;cPow=0;cDir=1;slowT=0;flyT=0;
  keyU=false;keyD=false;
  elLv.textContent=lv+1;updateHud();
}
function updateHud(){
  elAm.textContent=ammo;elSt.textContent=starsGot+"/3";elTot.textContent=totalStars;elBest.textContent=best;
}
function collideRect(b,rc,rest){
  var l=rc.x-b.r,rt=rc.x+rc.w+b.r,t=rc.y-b.r,bt=rc.y+rc.h+b.r;
  if(b.x>l&&b.x<rt&&b.y>t&&b.y<bt){
    var pl=b.x-l,pr=rt-b.x,pt=b.y-t,pb=bt-b.y,m=Math.min(pl,pr,pt,pb);
    if(m===pt){b.y=t;if(b.vy>0)b.vy=-b.vy*rest;}
    else if(m===pb){b.y=bt;if(b.vy<0)b.vy=-b.vy*rest;}
    else if(m===pl){b.x=l;if(b.vx>0)b.vx=-b.vx*rest;}
    else{b.x=rt;if(b.vx<0)b.vx=-b.vx*rest;}
  }
}
function fire(){
  var v=0.18+cPow*0.42;
  ball={x:CX+Math.cos(angle)*24,y:CY+Math.sin(angle)*24,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v,r:BR};
  ammo--;flyT=0;slowT=0;charging=false;
  updateHud();
}
function endShot(){
  ball=null;
  if(starsGot>=3){
    var bonus=ammo*30;
    var used=5-ammo;
    var rank=used===1?3:(used<=3?2:1);
    totalStars+=rank;
    var pts=100+bonus+rank*50;
    scorePts+=pts;
    if(scorePts>best){best=scorePts;saveBest("mg_s399",best);}
    if(lv<LEVELS.length-1){
      msg="摘星成功!"+rank+"星 · +"+pts;msgT=1600;
      lv++;state="transition";
      window.setTimeout(function(){if(state==="transition"){loadLevel();state="playing";}},1200);
    }else finish(true,"三星炮手!总星数 "+totalStars+" · 得分 "+scorePts);
  }else if(ammo<=0){
    finish(false,"炮弹打光了,还有星星挂在夜空…");
  }
  updateHud();
}
var scorePts=0;
function finish(win,reason){
  state="over";
  ovT.textContent=win?"通关!":"游戏结束";
  ovD.textContent=reason;
  ovS.style.display="block";ovS.textContent="总星 "+totalStars+" · 得分 "+scorePts+" · 最佳 "+best;
  btn.textContent="再来一局";updateHud();
  ov.classList.remove("hide");
}
function ptOf(e){
  var r=cv.getBoundingClientRect(),p=e.touches?(e.touches[0]||e.changedTouches[0]):e;
  return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height};
}
function aimAt(p){
  var dx=p.x-CX,dy=p.y-CY;
  if(dx>4){
    var a=Math.atan2(dy,dx);
    if(a<-0.06)a=-0.06;
    if(a>-1.45)a=-1.45;
    angle=a;
  }
}
cv.addEventListener("mousedown",function(e){
  if(state!=="playing")return;
  var p=ptOf(e);aimAt(p);
  charging=true;cPow=0;cDir=1;
});
window.addEventListener("mousemove",function(e){if(state==="playing")aimAt(ptOf(e));});
window.addEventListener("mouseup",function(){if(state==="playing"&&charging&&ball===null)fire();charging=false;});
cv.addEventListener("touchstart",function(e){
  if(state!=="playing")return;
  var p=ptOf(e);aimAt(p);
  charging=true;cPow=0;cDir=1;
  e.preventDefault();
},{passive:false});
cv.addEventListener("touchmove",function(e){
  if(state!=="playing")return;
  aimAt(ptOf(e));e.preventDefault();
},{passive:false});
cv.addEventListener("touchend",function(){
  if(state==="playing"&&charging&&ball===null)fire();
  charging=false;
});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"){keyU=true;e.preventDefault();}
  if(e.key==="ArrowDown"){keyD=true;e.preventDefault();}
  if(e.key===" "){
    e.preventDefault();
    if(state==="menu"||state==="over"){startGame();return;}
    if(state==="playing"&&!charging&&ball===null){charging=true;cPow=0;cDir=1;}
  }
});
document.addEventListener("keyup",function(e){
  if(e.key==="ArrowUp")keyU=false;
  if(e.key==="ArrowDown")keyD=false;
  if(e.key===" "&&state==="playing"&&charging&&ball===null)fire();
});
function startGame(){scorePts=0;lvUsed=1;reset();state="playing";ov.classList.add("hide");}
btn.addEventListener("click",startGame);
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  pulse+=dt*0.004;
  if(msgT>0)msgT-=dt;
  if(state==="playing"){
    if(keyU)angle-=0.0016*dt;
    if(keyD)angle+=0.0016*dt;
    if(angle<-1.45)angle=-1.45;
    if(angle>-0.08)angle=-0.08;
    if(charging){
      cPow+=cDir*0.0022*dt;
      if(cPow>1){cPow=1;cDir=-1;}
      if(cPow<0){cPow=0;cDir=1;}
    }
    var i;
    if(ball){
      ball.vy+=GRAV*dt;
      ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx)*0.55;}
      if(ball.x>W-BR){ball.x=W-BR;ball.vx=-Math.abs(ball.vx)*0.55;}
      if(ball.y<BR){ball.y=BR;ball.vy=Math.abs(ball.vy)*0.55;}
      if(ball.y>GY-BR){ball.y=GY-BR;ball.vy=-Math.abs(ball.vy)*0.45;ball.vx*=0.985;}
      for(i=0;i<plats.length;i++)collideRect(ball,plats[i],0.5);
      flyT+=dt;
      var sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      if(sp<0.02)slowT+=dt;else slowT=0;
      if(flyT>7000||slowT>600){
        endShot();
      }
      if(ball)for(i=0;i<stars.length;i++){
        var s=stars[i];
        if(!s.got){
          var dx=s.x-ball.x,dy=s.y-ball.y;
          if(dx*dx+dy*dy<16*16){
            s.got=true;starsGot++;updateHud();
            if(starsGot>=3){endShot();break;}
          }
        }
      }
    }
  }
  draw();
}
function drawStar(x,y,r){
  ctx.beginPath();
  var i;
  for(i=0;i<10;i++){
    var rr=i%2===0?r:r*0.45;
    var a=-Math.PI/2+i*Math.PI/5;
    var px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0c1026";ctx.fillRect(0,0,W,H);
  for(i=0;i<26;i++){
    ctx.globalAlpha=0.15+0.2*Math.sin(pulse*2+i*1.7);
    ctx.fillStyle="#c7cbe8";
    ctx.fillRect((i*173)%W,(i*97)%300,2,2);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#1c2547";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#2b3663";ctx.fillRect(0,GY,W,3);
  for(i=0;i<plats.length;i++){
    var p=plats[i];
    ctx.fillStyle="#3b4a77";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#55679c";
    ctx.fillRect(p.x+2,p.y+2,p.w-4,3);
  }
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    if(s.got)continue;
    ctx.fillStyle="#fde047";
    ctx.shadowColor="#fde047";ctx.shadowBlur=14;
    drawStar(s.x,s.y,11+Math.sin(pulse*3+i)*1.5);
    ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(angle);
  ctx.fillStyle="#94a3b8";
  ctx.fillRect(0,-6,30,12);
  ctx.restore();
  ctx.fillStyle="#475569";
  ctx.beginPath();ctx.arc(CX,CY,15,Math.PI,0);ctx.fill();
  ctx.fillRect(CX-15,CY,30,18);
  if(charging){
    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.fillRect(CX-30,CY-52,60,8);
    ctx.fillStyle=cPow>0.8?"#f87171":"#fde047";
    ctx.fillRect(CX-28,CY-50,56*cPow,4);
  }
  if(ball){
    ctx.fillStyle="#fbbf24";
    ctx.shadowColor="#fbbf24";ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  if(msgT>0){
    ctx.globalAlpha=Math.min(1,msgT/500);
    ctx.fillStyle="#4ade80";ctx.font="bold 20px system-ui";ctx.textAlign="center";
    ctx.fillText(msg,W/2,150);ctx.globalAlpha=1;ctx.textAlign="left";
  }
}
reset();
state="menu";
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

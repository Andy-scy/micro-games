<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无旗硬核</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f87171;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f87171;font-size:15px}
.stage{position:relative}
.grid{display:grid;gap:2px;background:#0b0e1a;padding:7px;border-radius:10px;width:max-content;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:4px;background:#2a3050;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cs)*.5);cursor:pointer}
.cell.op{background:#12162b;cursor:default}
.cell.mn{background:#3b1d1d;color:#f87171}
.cell.bo{background:#7f1d1d;color:#fff}
.n1{color:#7dd3fc}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#c084fc}.n5{color:#fbbf24}.n6{color:#2dd4bf}.n7{color:#f472b6}.n8{color:#e8eaf6}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#f87171}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.9;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#f87171;color:#2b0606;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(20,24,44,.95);border:1px solid #32385e;color:#fbbf24;font-size:13px;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <h1>无旗硬核</h1>
  <p class="hint">硬核规则:本局禁止插旗,纯靠大脑记忆雷位!<br>点击翻开格子,9×9 内藏着 12 颗雷,翻开全部安全格获胜</p>
  <div class="hud">
    <span>总雷数 <b id="mtotal">12</b></span>
    <span>已翻开 <b id="prog">0/69</b></span>
    <span>最佳 <b id="best">--</b></span>
  </div>
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">无旗硬核</h2>
      <p id="ovP">没有旗帜、没有标记,
12 颗雷全靠脑子记!
真正的扫雷高手挑战。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">接受挑战</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=9,H=9,MINES=12,N=W*H;
var grid=document.getElementById("grid");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovS=document.getElementById("ovS"),btnGo=document.getElementById("btnGo");
var elM=document.getElementById("mtotal"),elP=document.getElementById("prog"),elB=document.getElementById("best"),toastEl=document.getElementById("toast");
var NB=[],cells=[],mines=[],num=[],st=[],opened=0,placed=false,over=false;
var t0=0,elapsed=0,best=loadBest("mg_m286"),toastT=null;
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show");},1300);}
(function(){var i,x,y,dx,dy,nx,ny;for(i=0;i<N;i++){x=i%W;y=(i/W)|0;var r=[];for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;nx=x+dx;ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H)r.push(ny*W+nx);}NB.push(r);}})();
function calcNums(){var i,k;num=new Array(N);for(i=0;i<N;i++)num[i]=0;for(i=0;i<N;i++){if(mines[i])continue;var c=0;for(k=0;k<NB[i].length;k++)if(mines[NB[i][k]])c++;num[i]=c;}}
function placeMines(safe){var i,cnt=0;mines=new Array(N);for(i=0;i<N;i++)mines[i]=false;while(cnt<MINES){var j=(Math.random()*N)|0;if(!mines[j]&&!safe[j]){mines[j]=true;cnt++;}}calcNums();}
function buildGrid(){
  grid.innerHTML="";grid.style.gridTemplateColumns="repeat("+W+", var(--cs))";
  var cs=Math.max(20,Math.min(38,Math.floor((Math.min(window.innerWidth,520)-44)/W)));
  grid.style.setProperty("--cs",cs+"px");
  cells=new Array(N);
  for(var i=0;i<N;i++){var d=document.createElement("div");d.className="cell";d.dataset.i=i;grid.appendChild(d);cells[i]=d;}
}
function render(i){
  var el=cells[i],s=st[i];el.className="cell";el.textContent="";
  if(s===1){el.classList.add("op");if(mines[i]){el.classList.add("bo");el.textContent="✸";}else if(num[i]>0){el.textContent=String(num[i]);el.classList.add("n"+num[i]);}}
  else{if(over&&mines[i]){el.classList.add(i===boomIdx?"bo":"mn");el.textContent="✸";}}
}
var boomIdx=-1;
function openCell(i){
  if(st[i]!==0||mines[i])return;
  var stk=[i];
  while(stk.length){
    var j=stk.pop();
    if(st[j]!==0||mines[j])continue;
    st[j]=1;opened++;render(j);
    if(num[j]===0){for(var k=0;k<NB[j].length;k++){if(st[NB[j][k]]===0&&!mines[NB[j][k]])stk.push(NB[j][k]);}}
  }
}
function chord(i){
  if(num[i]===0)return;
  var h=0,hid=[],k;
  for(k=0;k<NB[i].length;k++){var j=NB[i][k];if(st[j]!==1)h++;if(st[j]===0)hid.push(j);}
  if(h!==num[i]||!hid.length)return;
  for(k=0;k<hid.length;k++){
    if(mines[hid[k]]){hitMine(hid[k]);return;}
    openCell(hid[k]);
  }
  afterAction();
}
function hitMine(i){boomIdx=i;endGame(false);}
function updateHud(){elP.textContent=opened+"/"+(N-MINES);elB.textContent=best?best+" 秒":"--";}
function afterAction(){updateHud();if(opened===N-MINES)endGame(true);}
function endGame(w){
  if(over)return;over=true;
  var i;
  if(w){
    var sec=Math.floor((Date.now()-t0)/1000);
    if(!best||sec<best){best=sec;saveBest("mg_m286",best);}
    ovT.textContent="硬核通关!";ovT.style.color="#4ade80";
    ovP.textContent="无旗记忆扫雷完成,用时 "+sec+" 秒。";
  }else{
    for(i=0;i<N;i++){if(mines[i]&&st[i]!==1)render(i);}
    ovT.textContent="记忆失败";ovT.style.color="#f87171";
    ovP.textContent="雷位记错一步,满盘皆输。";
  }
  updateHud();btnGo.textContent="再来一局";ov.classList.remove("hide");
}
function onOpen(i){
  if(over)return;
  if(!placed){var safe={};safe[i]=true;placeMines(safe);placed=true;t0=Date.now();}
  if(st[i]===1){chord(i);return;}
  if(mines[i]){hitMine(i);return;}
  openCell(i);afterAction();
}
function cellIndex(e){var t=e.target;while(t&&t!==grid&&!t.classList.contains("cell"))t=t.parentNode;if(t&&t!==grid)return +t.dataset.i;return -1;}
grid.addEventListener("contextmenu",function(e){e.preventDefault();toast("本局禁止插旗,靠记忆!");});
grid.addEventListener("pointerdown",function(e){
  var i=cellIndex(e);if(i<0||over)return;
  if(e.pointerType==="touch"){
    e.preventDefault();
    if(!over)onOpen(i);
  }else if(e.button===0){onOpen(i);}
});
function reset(){
  over=false;placed=false;opened=0;boomIdx=-1;elapsed=0;
  st=new Array(N);for(var i=0;i<N;i++)st[i]=0;
  mines=new Array(N);num=new Array(N);
  buildGrid();updateHud();
}
function frame(){
  if(placed&&!over){elapsed=Math.floor((Date.now()-t0)/1000);}
  requestAnimationFrame(frame);
}
btnGo.addEventListener("click",function(){reset();ov.classList.add("hide");});
reset();updateHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>

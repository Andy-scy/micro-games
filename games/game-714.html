<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时光倒流</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.tb{flex:1;padding:12px 0;font-size:16px;background:#232a4a;color:#e8eaf6;border:0;border-radius:10px;touch-action:none;user-select:none;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>时光倒流</h1>
  <p class="tips">←→ 移动,空格跳跃。碰到尖刺或坠落时,若时光能量充足会自动倒流 1.5 秒回到过去;按住 K /「倒流」随时手动倒带。穿越 2 段刺谷!</p>
  <div class="card"><div class="row">
    <div class="mut">时光能量</div>
    <div class="big" id="en">100%</div>
    <div class="stat"><div class="mut">关卡</div><div class="big" id="lv">1/2</div></div>
    <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="480" height="360"></canvas></div>
  <div class="card row">
    <button class="tb" id="bL">◀</button><button class="tb" id="bR">▶</button><button class="tb" id="bJ">跳</button><button class="tb" id="bW">倒流</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">时光倒流</h2><p id="ovp">玩法说明:<br>· ←→ / A D 移动,空格 / ↑ 跳跃<br>· 受伤瞬间:能量 ≥30 自动倒流 1.5 秒,并短暂无敌<br>· 按住 K /「倒流」按钮:手动倒带,耗能更快<br>· 能量随时间缓慢恢复(满 100)<br>· 能量不足时受伤 = -1 生命,共 3 条<br>· 星屑 +50,过关 +200,共 2 段刺谷</p><button class="btn" id="obtn">出发</button></div></div>
<script>
'use strict';
var W=480,H=360;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $i(id){return document.getElementById(id)}
var LEVELS=[
{w:800,px:16,py:294,
 solids:[[0,320,180,40],[260,320,90,40],[430,320,120,40],[630,320,170,40],[150,240,90,14],[380,250,90,14],[580,240,90,14]],
 spikes:[[60,304,50,16],[280,304,40,16],[470,304,60,16],[660,304,50,16]],
 gems:[[120,210],[340,220],[610,210]],door:[740,268]},
{w:800,px:16,py:294,
 solids:[[0,320,800,40],[180,240,70,14],[420,240,70,14],[650,240,70,14]],
 spikes:[[100,304,70,16],[220,304,70,16],[340,304,70,16],[460,304,70,16],[580,304,70,16]],
 gems:[[250,200],[500,200],[700,200]],door:[740,268]}
];
var lv=0,solids=[],spikes=[],gems=[],worldW=800;
var door={x:0,y:0,w:34,h:52};
var px=16,py=294,vx=0,vy=0,pw=22,ph=26,onG=false,face=1;
var camX=0,score=0,lives=3;
var hist=[],energy=100,inv=0,rewindFx=0;
var running=false,lastT=0,bannerT=0,parts=[];
var keys={L:false,R:false,J:false,RW:false},jHeld=false;
function loadLv(n){
  var L=LEVELS[n],i;
  solids=[];
  for(i=0;i<L.solids.length;i++)solids.push({x:L.solids[i][0],y:L.solids[i][1],w:L.solids[i][2],h:L.solids[i][3]});
  spikes=[];
  for(i=0;i<L.spikes.length;i++)spikes.push({x:L.spikes[i][0],y:L.spikes[i][1],w:L.spikes[i][2],h:L.spikes[i][3]});
  gems=[];
  for(i=0;i<L.gems.length;i++)gems.push({x:L.gems[i][0],y:L.gems[i][1],got:false});
  door.x=L.door[0];door.y=L.door[1];
  worldW=L.w;px=L.px;py=L.py;vx=0;vy=0;camX=0;face=1;
  hist=[];inv=0;bannerT=1.4;
}
function reset(){score=0;lives=3;lv=0;parts=[];energy=100;loadLv(0);hud()}
function hud(){
  $i('en').textContent=Math.round(energy)+'%';
  $i('lv').textContent=(lv+1)+'/2';
  $i('sc').textContent=score;
  var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';
  $i('hp').textContent=h;
}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*2.5,c:c,life:0.3+Math.random()*0.3});}
}
function hitRect(s){return px<s.x+s.w&&px+pw>s.x&&py<s.y+s.h&&py+ph>s.y}
function hitSpikes(){
  for(var i=0;i<spikes.length;i++){var s=spikes[i];
    if(px<s.x+s.w-5&&px+pw>s.x+5&&py<s.y+s.h-6&&py+ph>s.y+6)return true}
  return false;
}
function physics(dt){
  var i,s;
  var acc=1500,mx=210;
  if(keys.L){vx-=acc*dt;face=-1}
  if(keys.R){vx+=acc*dt;face=1}
  if(!keys.L&&!keys.R)vx-=vx*Math.min(1,(onG?12:2)*dt);
  if(vx>mx)vx=mx;if(vx<-mx)vx=-mx;
  vy+=1500*dt;if(vy>900)vy=900;
  px+=vx*dt;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vx>0)px=s.x-pw;else if(vx<0)px=s.x+s.w;
      vx=0;
    }}
  if(px<0)px=0;if(px+pw>worldW)px=worldW-pw;
  py+=vy*dt;onG=false;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vy>0){py=s.y-ph;vy=0;onG=true}
      else if(vy<0){py=s.y+s.h;vy=0}
    }}
  if(keys.J&&!jHeld&&onG){vy=-560;onG=false}
}
function doRewind(frames){
  if(hist.length<frames+2)return false;
  var st=hist[hist.length-frames];
  hist.length=hist.length-frames;
  px=st.x;py=st.y;vx=0;vy=0;onG=false;
  return true;
}
function hurt(fromPit){
  if(!running)return;
  if(inv>0&&!fromPit)return;
  if(energy>=30&&hist.length>=95){
    energy-=30;inv=1.2;rewindFx=0.4;
    if(doRewind(90)){burst(px+pw/2,py+ph/2,'#4cc9f0',16);hud();return}
  }
  lives--;hud();
  burst(px+pw/2,py+ph/2,'#ff5c5c',12);
  if(lives<=0){lives=0;hud();endGame(false);return}
  loadLv(lv);hud();
}
function endGame(win){
  running=false;
  if(win){score+=lives*100;hud();$i('ovt').textContent='时间的主人!';$i('ovp').innerHTML='两段刺谷都被你倒着玩明白了!<br>最终得分:<b>'+score+'</b>';}
  else{$i('ovt').textContent='时光能量耗尽…';$i('ovp').innerHTML='省着点用倒流,能量是有限的!<br>最终得分:<b>'+score+'</b><br>止步于第 '+(lv+1)+' 段';}
  $i('obtn').textContent='再来一局';
  $i('overlay').classList.remove('hide');
}
function update(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  if(bannerT>0)bannerT-=dt;
  if(!running)return;
  if(rewindFx>0)rewindFx-=dt;
  if(inv>0)inv-=dt;
  var rewinding=false;
  if(keys.RW&&energy>0&&hist.length>12){
    rewinding=true;
    var steps=2;
    for(i=0;i<steps&&hist.length>1;i++){
      var st=hist.pop();px=st.x;py=st.y;
    }
    vx=0;vy=0;energy=Math.max(0,energy-45*dt);
    if(Math.random()<0.5)burst(px+pw/2,py+ph/2,'#4cc9f0',2);
  }else{
    energy=Math.min(100,energy+9*dt);
    physics(dt);
    hist.push({x:px,y:py});
    if(hist.length>480)hist.shift();
  }
  var target=px-W/2;
  if(target<0)target=0;if(target>worldW-W)target=worldW-W;
  camX+=(target-camX)*Math.min(1,8*dt);
  if(!rewinding){
    for(i=0;i<gems.length;i++){var gm=gems[i];
      if(gm.got)continue;
      var dx=gm.x-(px+pw/2),dy=gm.y-(py+ph/2);
      if(dx*dx+dy*dy<26*26){gm.got=true;score+=50;burst(gm.x,gm.y,'#ffd166',8);hud()}
    }
    if(hitSpikes())hurt(false);
    else if(py>H+80)hurt(true);
    else if(px+pw>door.x&&px<door.x+door.w&&py+ph>door.y&&py<door.y+door.h){
      score+=200;hud();
      if(lv>=LEVELS.length-1){endGame(true);return}
      lv++;loadLv(lv);hud();return;
    }
  }
  hud();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#101d33');g.addColorStop(1,'#0c1026');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  ctx.save();ctx.translate(-Math.round(camX),0);
  for(i=0;i<solids.length;i++){var s=solids[i];
    ctx.fillStyle='#2b3358';rr(s.x,s.y,s.w,s.h,4);ctx.fill();
    ctx.fillStyle='#4a5688';ctx.fillRect(s.x+2,s.y,s.w-4,3);
  }
  ctx.fillStyle='#aab4d4';
  for(i=0;i<spikes.length;i++){var sp=spikes[i];
    var n=Math.max(1,Math.round(sp.w/14));
    for(var k=0;k<n;k++){
      var x0=sp.x+k*(sp.w/n),x1=x0+sp.w/n;
      ctx.beginPath();ctx.moveTo(x0,sp.y+sp.h);ctx.lineTo((x0+x1)/2,sp.y);ctx.lineTo(x1,sp.y+sp.h);ctx.closePath();ctx.fill();
    }
  }
  var tail=Math.min(40,hist.length);
  for(i=0;i<tail;i++){
    var hp=hist[hist.length-1-i];
    ctx.globalAlpha=0.3*(1-i/tail);
    ctx.fillStyle='#4cc9f0';
    ctx.fillRect(hp.x+8,hp.y+8,6,6);
  }
  ctx.globalAlpha=1;
  for(i=0;i<gems.length;i++){var gm=gems[i];
    if(gm.got)continue;
    ctx.save();ctx.translate(gm.x,gm.y+Math.sin(Date.now()*0.004+i)*3);ctx.rotate(0.785);
    ctx.fillStyle='#ffd166';ctx.fillRect(-6,-6,12,12);
    ctx.fillStyle='#fff3c4';ctx.fillRect(-3,-3,6,6);
    ctx.restore();
  }
  ctx.fillStyle='#b388ff';
  rr(door.x,door.y,door.w,door.h,6);ctx.fill();
  ctx.fillStyle='#1a1f36';
  ctx.beginPath();ctx.arc(door.x+door.w/2,door.y+door.h/2,7,0,6.28);ctx.fill();
  if(inv>0&&Math.floor(Date.now()*0.02)%2===0)ctx.globalAlpha=0.35;
  ctx.fillStyle='#8fd3ff';
  rr(px,py,pw,ph,6);ctx.fill();
  ctx.fillStyle='#081226';
  ctx.fillRect(px+pw*0.28,py+7,4,5);
  ctx.fillRect(px+pw*0.62,py+7,4,5);
  ctx.globalAlpha=1;
  for(i=0;i<parts.length;i++){var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2.4);
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.fillStyle='rgba(15,18,32,.6)';rr(12,12,124,12,6);ctx.fill();
  ctx.fillStyle=energy>=30?'#4cc9f0':'#ef476f';
  ctx.fillRect(14,14,120*energy/100,8);
  if(rewindFx>0){
    ctx.globalAlpha=rewindFx*1.5;
    ctx.strokeStyle='#4cc9f0';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(px+pw/2,py+ph/2,60*(1-rewindFx*2),0,6.28);ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(bannerT>0){
    ctx.globalAlpha=Math.min(1,bannerT);
    ctx.fillStyle='rgba(15,18,32,.55)';ctx.fillRect(0,H/2-34,W,68);
    ctx.fillStyle='#ffd166';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText('第 '+(lv+1)+' 段刺谷',W/2,H/2+9);
    ctx.globalAlpha=1;
  }
}
function bindBtn(id,prop){
  var b=$i(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[prop]=true});
  b.addEventListener('pointerup',function(e){e.preventDefault();keys[prop]=false});
  b.addEventListener('pointercancel',function(){keys[prop]=false});
  b.addEventListener('pointerleave',function(){keys[prop]=false});
}
bindBtn('bL','L');bindBtn('bR','R');bindBtn('bJ','J');bindBtn('bW','RW');
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=true;
  if(e.code==='KeyK'||e.code==='KeyR')keys.RW=true;
  if(e.code==='Space'||e.code==='ArrowUp')e.preventDefault();
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=false;
  if(e.code==='KeyK'||e.code==='KeyR')keys.RW=false;
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  jHeld=keys.J;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

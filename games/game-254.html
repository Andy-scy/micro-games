<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长词巨兽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:760px}
canvas{display:block;width:100%;background:#151a30;border-radius:14px}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#ffd76a}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
button{background:#7c9cff;color:#10142a;border:0;border-radius:10px;padding:10px 24px;font-size:16px;font-family:inherit;cursor:pointer}
button:hover{background:#9ab1ff}
</style>
</head>
<body>
<h1>长词巨兽</h1>
<div id="tip">巨兽的血条是一个超长单词：每打对一个字母就是一发炮弹；打错会被反击！</div>
<div id="hud"></div>
<div id="wrap">
<canvas id="cv" width="760" height="470"></canvas>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<button id="ovBtn">开始游戏</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var BOSSES=[
{name:'风暴巨兽',word:'hurricane'},
{name:'裂地魔兽',word:'earthquake'},
{name:'深渊之主',word:'masterpiece'}
];
var MINIONS=["gob","orc","bat","slime","wisp","imp","rat","slug"];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var wrap=document.getElementById('wrap'),hud=document.getElementById('hud');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),btn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var phase,bossIdx,typed,score,baseHP,elapsed,shake,running,raf,tPrev,parts;
var minions,shotFlash,hurtFlash;
function fit(){var w=wrap.clientWidth||640;cv.width=w;cv.height=Math.max(340,Math.min(500,Math.round(w*0.6)));}
window.addEventListener('resize',fit);
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hudUpd(){
  hud.textContent='得分 '+score+'　基地 '+Math.max(0,baseHP)+'　巨兽 '+(bossIdx+1)+'/3　阶段：'+(phase==='boss'?'攻坚战':'清剿杂兵');
}
function reset(){
  phase='boss';bossIdx=0;typed=0;score=0;baseHP=100;elapsed=0;shake=0;parts=[];
  minions=[];shotFlash=0;hurtFlash=0;
  hudUpd();
}
function boom(x,y,col,n){for(var i=0;i<(n||16);i++)parts.push({x:x,y:y,vx:rnd(-140,140),vy:rnd(-180,40),life:rnd(.3,.8),c:col});}
function startBoss(){
  phase='boss';typed=0;hudUpd();
}
function startMinions(){
  phase='minions';minions=[];
  for(var i=0;i<3;i++){
    minions.push({text:pick(MINIONS),x:rnd(40,cv.width-90),y:rnd(-40-i*60,-30),vy:60+bossIdx*15});
  }
  hudUpd();
}
function handleChar(ch){
  if(!running)return;
  if(ch==='\b')return;
  ch=ch.toLowerCase();
  if(!/^[a-z]$/.test(ch))return;
  if(phase==='boss'){
    var word=BOSSES[bossIdx].word;
    if(ch===word.charAt(typed)){
      typed++;score+=15;shotFlash=0.2;
      boom(rnd(cv.width/2-40,cv.width/2+40),rnd(80,130),'#ffd76a',6);
      if(typed>=word.length){
        score+=100;
        boom(cv.width/2,110,'#ff9f43',40);
        shake=8;
        startMinions();
      }
      hudUpd();
    }else{
      baseHP-=10;hurtFlash=0.35;shake=6;
      hudUpd();
      if(baseHP<=0){baseHP=0;end(false);return;}
    }
  }else{
    var cand=-1;
    for(var i=0;i<minions.length;i++){
      if(minions[i].text.charAt(0)===ch){cand=i;break;}
    }
    if(cand>=0){
      var m=minions[cand];
      score+=20;
      boom(m.x+20,m.y+8,'#8f8f66',8);
      minions.splice(cand,1);
      if(minions.length===0){
        baseHP=Math.min(100,baseHP+15);
        bossIdx++;
        if(bossIdx>=BOSSES.length){end(true);return;}
        startBoss();
      }
      hudUpd();
    }else{
      baseHP-=5;hurtFlash=0.25;shake=4;
      hudUpd();
      if(baseHP<=0){baseHP=0;end(false);return;}
    }
  }
}
function update(dt){
  elapsed+=dt;shake=Math.max(0,shake-dt*11);
  shotFlash=Math.max(0,shotFlash-dt);hurtFlash=Math.max(0,hurtFlash-dt);
  if(phase==='minions'){
    for(var i=minions.length-1;i>=0;i--){
      var m=minions[i];m.y+=m.vy*dt;
      if(m.y>cv.height-40){
        minions.splice(i,1);
        baseHP-=10;shake=6;hurtFlash=0.3;hudUpd();
        if(baseHP<=0){baseHP=0;end(false);return;}
        if(minions.length===0){
          baseHP=Math.min(100,baseHP+15);
          bossIdx++;
          if(bossIdx>=BOSSES.length){end(true);return;}
          startBoss();
        }
      }
    }
  }
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;
    if(p.life<=0)parts.splice(j,1);
  }
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  if(hurtFlash>0){ctx.fillStyle='rgba(255,60,60,'+hurtFlash*0.5+')';ctx.fillRect(0,0,cv.width,cv.height);}
  ctx.fillStyle='#232a4a';
  ctx.fillRect(0,cv.height-24,cv.width,24);
  ctx.fillStyle='#6ee7a0';
  ctx.fillRect(0,cv.height-24,cv.width*Math.max(0,baseHP)/100,24);
  ctx.fillStyle='#0f1220';
  ctx.font='bold 12px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('基地耐久 '+Math.max(0,baseHP),cv.width/2,cv.height-8);
  if(phase==='boss'){
    var word=BOSSES[bossIdx].word;
    var bw=cv.width/2;
    var hue=120-typed/word.length*120;
    ctx.fillStyle='hsl('+hue+',70%,45%)';
    ctx.fillRect(bw-70,60,140,84);
    ctx.fillStyle='#0f1220';
    ctx.fillRect(bw-40,84,20,16);
    ctx.fillRect(bw+20,84,20,16);
    ctx.fillStyle='#ffd76a';
    ctx.fillRect(bw-70,40,140*typed/word.length,10);
    ctx.font='bold 30px ui-monospace, Consolas, monospace';
    var pre=word.slice(0,typed);
    ctx.fillStyle='#ffd76a';
    ctx.fillText(pre,bw-ctx.measureText(word).width/2,190);
    ctx.fillStyle='#e8eaf6';
    ctx.fillText(word.slice(typed),bw-ctx.measureText(word).width/2+ctx.measureText(pre).width,190);
    ctx.font='14px system-ui, sans-serif';
    ctx.fillStyle='#9aa3c0';
    ctx.fillText(BOSSES[bossIdx].name+'　HP '+typed+'/'+word.length,bw,215);
    if(shotFlash>0){
      ctx.strokeStyle='rgba(255,215,106,'+shotFlash*4+')';
      ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(bw,cv.height-24);ctx.lineTo(bw+rnd(-10,10),140);ctx.stroke();
    }
  }else{
    ctx.font='bold 20px ui-monospace, Consolas, monospace';
    for(var i=0;i<minions.length;i++){
      var m=minions[i];
      ctx.fillStyle='#8f8f66';
      ctx.fillText(m.text,m.x,m.y);
    }
    ctx.font='14px system-ui, sans-serif';
    ctx.fillStyle='#9aa3c0';
    ctx.fillText('击退所有杂兵即可恢复耐久并挑战下一巨兽',cv.width/2,cv.height/2+80);
  }
  ctx.textAlign='left';
  for(var j=0;j<parts.length;j++){
    var p=parts[j];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
function end(win){
  running=false;
  ovT.textContent=win?'三兽皆伏':'基地陷落';
  ovX.textContent='得分 '+score+'\n讨伐巨兽 '+(win?3:bossIdx)+'/3　基地耐久 '+baseHP+'\n用时 '+Math.round(elapsed)+' 秒';
  btn.textContent='再来一局';
  ov.classList.remove('hide');
}
function start(){
  fit();reset();ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  wrap.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
bindTyping(handleChar);
btn.addEventListener('click',start);
fit();reset();
ovT.textContent='长词巨兽';
ovX.textContent='巨兽的血条是一个 9-11 字母的超长单词。\n按顺序每打对一个字母就发射一发炮弹，打满全词即讨伐成功。\n打错一个字母会被反击 -10 耐久；击杀巨兽后进入杂兵波，清完恢复耐久并迎战下一只，共 3 只。';
btn.textContent='开始游戏';
})();
</script>
</body>
</html>

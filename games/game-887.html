<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竖井攀升</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:8px 0 2px;color:#ffd166;letter-spacing:1px}
p.tip{margin:4px 0 10px;font-size:13px;color:#aab0d0;line-height:1.7}
#hud{display:flex;justify-content:space-between;font-size:14px;color:#cfd3ee;margin:0 2px 8px}
#hud b{color:#ffd166}
#stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2c3154;background:#0f1220}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,26,.84);text-align:center;padding:16px}
.hidden{display:none}
.ovBig{font-size:26px;font-weight:bold;color:#ffd166}
#ovTitle{font-size:26px;font-weight:bold;color:#ff5d73}
#ovInfo{font-size:14px;color:#aab0d0}
button{background:#ffd166;color:#141628;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<h1>竖井攀升</h1>
<p class="tip">矿井电梯自动向竖井上方攀升:按 ←→ / A D(或按住屏幕左、右半边)左右移动笼子,穿过横梁上的豁口;按住 空格 / ↑ 加速攀升冲分。撞上横梁、岩架,或坠出井底都算失败。</p>
<div id="hud"><span>高度:<b id="score">0</b> m</span><span>最佳:<b id="best">0</b> m</span></div>
<div id="stage">
<canvas id="cv" width="640" height="420"></canvas>
<div id="ovStart" class="overlay"><div class="ovBig">电梯升井</div><div style="font-size:13px;color:#aab0d0">←→ 移动 · 空格加速 · 穿过横梁豁口</div><button id="btnStart">开始游戏</button></div>
<div id="ovOver" class="overlay hidden"><div id="ovTitle">攀升中止!</div><div id="ovInfo"></div><button id="btnRe">再来一局</button></div>
</div>
</div>
<script>
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var state="ready",holding=false,tG=0;
var cageX,cageY,vy,alt,score,beams,ledges,spawnAcc,prevHoleX,keyL,keyR,ptrDir,parts;
var best=0;
function loadBest(k){try{var v=localStorage.getItem(k);return v?(parseInt(v,10)||0):0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
best=loadBest("mg887best");
$("best").textContent=best;

function reset(){
  cageX=W/2;cageY=H-70;vy=0;alt=0;score=0;
  beams=[];ledges=[];spawnAcc=60;prevHoleX=W/2;
  keyL=false;keyR=false;ptrDir=0;parts=[];
  updHud();
}
function climbV(){return 100+Math.min(120,alt*0.005)+(holding?95:0);}
function updHud(){$("score").textContent=score;}
function update(dt){
  var cv2=climbV();
  alt+=cv2*dt/8;
  score=Math.floor(alt);
  vy+=(holding?-640:470)*dt;
  vy=Math.max(-330,Math.min(300,vy));
  cageY+=vy*dt;
  var kd=(keyL?-1:0)+(keyR?1:0);
  var d=kd!==0?kd:ptrDir;
  cageX+=d*250*dt;
  if(cageX<26)cageX=26;
  if(cageX>W-26)cageX=W-26;
  if(cageY<18){cageY=18;vy=Math.max(vy,0);}
  if(cageY>H+30){die("电梯坠入了深渊!");return;}
  spawnAcc+=cv2*dt;
  if(spawnAcc>=175){
    spawnAcc=0;
    if(Math.random()<0.7){
      var hw=Math.max(84,128-alt*0.02);
      var hx=prevHoleX+(Math.random()-0.5)*250;
      if(hx<30)hx=30;
      if(hx>W-30-hw)hx=W-30-hw;
      prevHoleX=hx;
      beams.push({y:-26,hx:hx,hw:hw});
    }else{
      var side=Math.random()<0.5?"L":"R";
      ledges.push({y:-26,side:side,len:70+Math.random()*60});
    }
  }
  var i;
  for(i=beams.length-1;i>=0;i--){
    var b=beams[i];
    b.y+=cv2*dt;
    if(b.y>H+40){beams.splice(i,1);continue;}
    if(cageY+13>b.y&&cageY-13<b.y+13){
      if(cageX-13<b.hx||cageX+13>b.hx+b.hw){die("撞上了横梁!");return;}
    }
  }
  for(i=ledges.length-1;i>=0;i--){
    var g=ledges[i];
    g.y+=cv2*dt;
    if(g.y>H+40){ledges.splice(i,1);continue;}
    var gx=g.side==="L"?16:W-16-g.len;
    if(cageY+12>g.y&&cageY-12<g.y+13&&cageX+12>gx&&cageX-12<gx+g.len){die("撞上了岩架!");return;}
  }
  if(holding&&Math.random()<0.6)parts.push({x:cageX-8+Math.random()*16,y:cageY+14,life:0.4});
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.y+=60*dt;if(p.life<=0)parts.splice(i,1);}
  updHud();
}
function die(msg){
  if(state!=="play")return;
  state="over";
  if(score>best){best=score;saveBest("mg887best",best);$("best").textContent=best;}
  $("ovInfo").textContent=msg+" 本次升到 "+score+" m,最佳 "+best+" m";
  $("ovOver").classList.remove("hidden");
}
function start(){reset();state="play";$("ovStart").classList.add("hidden");$("ovOver").classList.add("hidden");holding=false;}
function onHold(b){
  if(state==="ready"&&b){start();}
  if(state==="over")return;
  holding=b;
}
function drawBg(){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#1a1a10");bg.addColorStop(1,"#0e0d08");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#262b47";
  ctx.fillRect(0,0,16,H);ctx.fillRect(W-16,0,16,H);
  ctx.strokeStyle="#3d466f";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(22,H);ctx.moveTo(W-22,0);ctx.lineTo(W-22,H);ctx.stroke();
  ctx.strokeStyle="#565e8a";ctx.lineWidth=1;
  for(var yy=(alt*8)%40-40;yy<H;yy+=40){
    ctx.beginPath();ctx.moveTo(16,yy);ctx.lineTo(W-16,yy);ctx.stroke();
  }
}
function drawObjs(){
  var i;
  ctx.fillStyle="#7a5c3a";
  for(i=0;i<beams.length;i++){
    var b=beams[i];
    if(b.y<-30||b.y>H+10)continue;
    ctx.fillRect(16,b.y,Math.max(0,b.hx-16),13);
    ctx.fillRect(b.hx+b.hw,b.y,Math.max(0,W-16-(b.hx+b.hw)),13);
    ctx.fillStyle="#a8845a";
    ctx.fillRect(b.hx-3,b.y,3,13);ctx.fillRect(b.hx+b.hw,b.y,3,13);
    ctx.fillStyle="#7a5c3a";
  }
  ctx.fillStyle="#3d466f";
  for(i=0;i<ledges.length;i++){
    var g=ledges[i];
    if(g.y<-30||g.y>H+10)continue;
    var gx=g.side==="L"?16:W-16-g.len;
    ctx.fillRect(gx,g.y,g.len,13);
  }
}
function drawCage(){
  ctx.strokeStyle="#8fa0ff";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cageX,cageY-12);ctx.quadraticCurveTo(cageX+Math.sin(tG*3)*8,cageY*0.5,cageX+Math.sin(tG*2)*4,0);ctx.stroke();
  ctx.fillStyle="rgba(255,209,102,0.7)";
  for(var i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillRect(p.x,p.y,3,3);}
  ctx.globalAlpha=1;
  ctx.fillStyle="#ffd166";
  ctx.fillRect(cageX-13,cageY-11,26,22);
  ctx.strokeStyle="#b3541e";ctx.lineWidth=2;
  ctx.strokeRect(cageX-13,cageY-11,26,22);
  ctx.fillStyle="#141628";
  ctx.fillRect(cageX-7,cageY-6,14,9);
  ctx.fillStyle="#ff9f43";
  ctx.beginPath();ctx.arc(cageX,cageY+2,2.5,0,Math.PI*2);ctx.fill();
}
function draw(){
  drawBg();
  drawObjs();
  drawCage();
}
$("btnStart").addEventListener("click",function(){start();});
$("btnRe").addEventListener("click",function(){start();});
function ptrSide(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width;
  return x<0.5?-1:1;
}
cv.addEventListener("mousedown",function(e){e.preventDefault();if(state==="ready"){start();return;}if(state==="play")ptrDir=ptrSide(e);});
window.addEventListener("mouseup",function(){ptrDir=0;});
cv.addEventListener("touchstart",function(e){e.preventDefault();if(state==="ready"){start();return;}if(state==="play")ptrDir=ptrSide(e.touches[0]);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();if(state==="play")ptrDir=ptrSide(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){ptrDir=0;});
window.addEventListener("touchcancel",function(){ptrDir=0;});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();if(!e.repeat)onHold(true);}
  if(e.code==="ArrowLeft"||e.code==="KeyA"){e.preventDefault();keyL=true;}
  if(e.code==="ArrowRight"||e.code==="KeyD"){e.preventDefault();keyR=true;}
});
window.addEventListener("keyup",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")onHold(false);
  if(e.code==="ArrowLeft"||e.code==="KeyA")keyL=false;
  if(e.code==="ArrowRight"||e.code==="KeyD")keyR=false;
});
window.addEventListener("blur",function(){holding=false;keyL=false;keyR=false;ptrDir=0;});
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.033,((t-lastT)/1000)||0);lastT=t;
  tG+=dt;
  if(state==="play")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>

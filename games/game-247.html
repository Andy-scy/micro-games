<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城墙守卫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:760px}
canvas{display:block;width:100%;background:#151a30;border-radius:14px}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#ffb46b}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
button{background:#7c9cff;color:#10142a;border:0;border-radius:10px;padding:10px 24px;font-size:16px;font-family:inherit;cursor:pointer}
button:hover{background:#9ab1ff}
</style>
</head>
<body>
<h1>城墙守卫</h1>
<div id="tip">敌军单词从右侧进军：完整打出即可从城头发炮摧毁；单词撞墙会削减城墙耐久</div>
<div id="hud"></div>
<div id="wrap">
<canvas id="cv" width="760" height="470"></canvas>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<button id="ovBtn">开始游戏</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var WORDS=["rush","raid","siege","armor","arrow","torch","guard","spear","shield","arrow","knight","cannon","fort","camp","drum","flag","helm","march","pike","ram","scout","banner","troop","watch","blade","chain","crown","duke","ember","forge","giant","grit","haste","ivory","joust","lance","mail","oath","plume","quake","rally","sentry","tunnel","vigor","watch","yell"];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var wrap=document.getElementById('wrap'),hud=document.getElementById('hud');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),btn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var WALL_X=64,LANES=5;
var words,buffer,target,score,wall,kills,level,spawnT,elapsed,shake,running,raf,tPrev;
var parts,beams;
function fit(){var w=wrap.clientWidth||640;cv.width=w;cv.height=Math.max(340,Math.min(500,Math.round(w*0.6)));}
window.addEventListener('resize',fit);
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hudUpd(){hud.textContent='得分 '+score+'　城墙 '+wall+'　歼敌 '+kills+'　波次 '+level;}
function reset(){
  words=[];buffer='';target=-1;score=0;wall=100;kills=0;level=1;spawnT=1;elapsed=0;shake=0;parts=[];beams=[];
  hudUpd();
}
function laneY(i){return 56+i*((cv.height-110)/(LANES-1));}
function spawn(){
  var t=pick(WORDS);
  for(var k=0;k<words.length;k++){if(words[k].text===t)return;}
  var lane=Math.floor(Math.random()*LANES);
  words.push({text:t,x:cv.width+30,y:laneY(lane),vx:26+level*7+rnd(0,12),lane:lane});
}
function boom(x,y,col){for(var i=0;i<12;i++)parts.push({x:x,y:y,vx:rnd(-110,110),vy:rnd(-130,40),life:rnd(.25,.6),c:col});}
function fire(i){
  var w=words[i];
  beams.push({x2:w.x,y2:w.y,life:0.14});
  score+=w.text.length*10;kills++;
  if(kills%8===0){
    level=Math.min(9,level+1);
    wall=Math.min(100,wall+5);
  }
  boom(w.x+30,w.y,'#ffb46b');
  words.splice(i,1);
  if(target===i){target=-1;buffer='';}else if(target>i)target--;
  hudUpd();
}
function handleChar(ch){
  if(!running)return;
  if(ch==='\b')return;
  ch=ch.toLowerCase();
  if(!/^[a-z]$/.test(ch))return;
  var cand=-1;
  if(target>=0&&words[target]&&words[target].text.charAt(buffer.length)===ch)cand=target;
  if(cand<0){
    for(var i=0;i<words.length;i++){
      if(i!==target&&words[i].text.charAt(0)===ch){cand=i;break;}
    }
    if(cand>=0)buffer='';
  }
  if(cand<0){buffer='';target=-1;return;}
  target=cand;buffer+=ch;
  if(buffer===words[target].text)fire(target);
}
function update(dt){
  elapsed+=dt;shake=Math.max(0,shake-dt*12);
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(0.9,2.0-level*0.12);}
  for(var i=words.length-1;i>=0;i--){
    var w=words[i];w.x-=w.vx*dt;
    if(w.x<WALL_X+14){
      boom(WALL_X+16,w.y,'#ff6b6b');words.splice(i,1);
      if(target===i){target=-1;buffer='';}else if(target>i)target--;
      wall-=6+w.text.length*2;shake=7;hudUpd();
      if(wall<=0){wall=0;end(false);return;}
    }
  }
  for(var j=beams.length-1;j>=0;j--){
    beams[j].life-=dt;
    if(beams[j].life<=0)beams.splice(j,1);
  }
  for(var m=parts.length-1;m>=0;m--){
    var p=parts[m];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;
    if(p.life<=0)parts.splice(m,1);
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  ctx.fillStyle='#3a4468';
  ctx.fillRect(0,0,WALL_X,cv.height);
  ctx.fillStyle='#2c3452';
  for(var by=0;by<cv.height;by+=22){
    for(var bx=(by/22)%2===0?0:-16;bx<WALL_X;bx+=32){
      ctx.fillRect(bx+2,by+2,28,18);
    }
  }
  ctx.fillStyle=wall>35?'#6ee7a0':'#ff6b6b';
  ctx.fillRect(0,0,Math.max(2,WALL_X*wall/100),4);
  ctx.fillStyle='#ffd76a';
  ctx.fillRect(WALL_X-6,cv.height/2-12,10,24);
  ctx.font='bold 19px system-ui, sans-serif';
  for(var i=0;i<words.length;i++){
    var w=words[i],tw=ctx.measureText(w.text).width;
    ctx.fillStyle='rgba(255,180,107,.14)';rr(w.x-8,w.y-15,tw+16,28,6);ctx.fill();
    if(i===target){ctx.strokeStyle='#ffd76a';ctx.lineWidth=2;rr(w.x-8,w.y-15,tw+16,28,6);ctx.stroke();}
    var done=(i===target)?buffer:'';
    var pre=w.text.slice(0,done.length);
    ctx.fillStyle='#ffd76a';ctx.fillText(pre,w.x,w.y+6);
    ctx.fillStyle='#e8eaf6';ctx.fillText(w.text.slice(done.length),w.x+ctx.measureText(pre).width,w.y+6);
  }
  ctx.lineWidth=3;
  for(var b=0;b<beams.length;b++){
    var bm=beams[b];
    ctx.globalAlpha=Math.max(0,bm.life*7);
    ctx.strokeStyle='#ffd76a';
    ctx.beginPath();ctx.moveTo(WALL_X-2,cv.height/2);ctx.lineTo(bm.x2,bm.y2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(var m=0;m<parts.length;m++){
    var p=parts[m];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
function end(win){
  running=false;
  ovT.textContent=win?'守城成功':'城墙陷落';
  ovX.textContent='得分 '+score+'\n歼敌 '+kills+' 个单词　波次 '+level+'\n坚守 '+Math.round(elapsed)+' 秒';
  btn.textContent='再来一局';
  ov.classList.remove('hide');
}
function start(){
  fit();reset();ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  wrap.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
bindTyping(handleChar);
btn.addEventListener('click',start);
fit();reset();
ovT.textContent='城墙守卫';
ovX.textContent='敌方单词列队从右侧向城墙进军。\n完整打出一个单词，城头火炮立即发炮将其摧毁。\n单词撞墙按长度扣城墙耐久，每歼灭 8 个修墙 +5，耐久归零则城破。';
btn.textContent='开始游戏';
})();
</script>
</body>
</html>

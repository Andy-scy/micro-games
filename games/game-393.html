<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>折射弹墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#e879a9;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#e879a9;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.ctrl{display:flex;gap:10px;justify-content:center;margin-top:10px}
.ctrl button{background:#e879a9;color:#3d0a24;border:none;border-radius:10px;padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl button:active{transform:scale(.96)}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#e879a9}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#e879a9;color:#3d0a24;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>折射弹墙</h1>
  <p class="hint">拖拽空白处画镜面(次数有限)· 从炮台拖拽并松手发射 · 收集全部宝石后进入传送门</p>
  <div class="hud">
    <span>关卡 <b id="lv">1</b></span>
    <span>镜子 <b id="mir">0</b></span>
    <span>机会 <b id="try">0</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">折射弹墙</h2>
      <p id="ovDesc">先规划弹道:在空白处拖拽画出镜面墙(每关次数有限),然后按住左下角炮台拖动瞄准,松手发射!弹球沿直线飞行并被镜面与四壁完美反射,吃掉全部宝石后撞向传送门。机会用尽前未完成即失败,可随时撤销重画。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
  <div class="ctrl">
    <button id="btnUndo">撤销一面</button>
    <button id="btnReset">全部重摆</button>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,BR=7,SPD=0.45,LX=40,LY=400;
function $(id){return document.getElementById(id);}
var elLv=$("lv"),elMir=$("mir"),elTry=$("try"),elSc=$("score"),elBest=$("best");
var ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
var btnUndo=$("btnUndo"),btnReset=$("btnReset");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s393");
var LEVELS=[
 {gems:[{x:240,y:120},{x:380,y:200},{x:240,y:300}],exit:{x:420,y:420},mirrors:4,tries:3},
 {gems:[{x:120,y:100},{x:360,y:100},{x:240,y:240},{x:120,y:380}],exit:{x:400,y:380},mirrors:5,tries:3},
 {gems:[{x:80,y:80},{x:400,y:80},{x:240,y:240},{x:80,y:400},{x:400,y:400}],exit:{x:240,y:60},mirrors:6,tries:3}
];
var state,lv,score,mirrors,gems,exitP,mirBudget,tries,ball,drag,dragFrom,aim,msg,msgT,pulse;
function reset(){lv=0;score=0;loadLevel();updateHud();}
function loadLevel(){
  var L=LEVELS[lv],i;
  mirrors=[];mirBudget=L.mirrors;tries=L.tries;
  gems=[];for(i=0;i<L.gems.length;i++)gems.push({x:L.gems[i].x,y:L.gems[i].y,got:false});
  exitP={x:L.exit.x,y:L.exit.y};
  ball=null;drag=false;dragFrom=null;aim=null;
  elLv.textContent=lv+1;updateHud();
}
function updateHud(){
  elMir.textContent=mirBudget;elTry.textContent=tries;elSc.textContent=score;elBest.textContent=best;
}
function gemsLeft(){var n=0,i;for(i=0;i<gems.length;i++)if(!gems[i].got)n++;return n;}
function ptOf(e){
  var r=cv.getBoundingClientRect(),p=e.touches?(e.touches[0]||e.changedTouches[0]):e;
  return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*W/r.height};
}
function segLen(s){var dx=s.x2-s.x1,dy=s.y2-s.y1;return Math.sqrt(dx*dx+dy*dy);}
function down(e){
  if(state!=="placing")return;
  var p=ptOf(e);
  drag=true;dragFrom=p;aim=null;
  if(Math.sqrt((p.x-LX)*(p.x-LX)+(p.y-LY)*(p.y-LY))<30)dragFrom=null;
  e.preventDefault();
}
function move(e){
  if(!drag)return;
  var p=ptOf(e);
  if(dragFrom===null)aim=p;
  else aim={x1:dragFrom.x,y1:dragFrom.y,x2:p.x,y2:p.y};
  e.preventDefault();
}
function up(e){
  if(!drag)return;
  drag=false;
  var p=ptOf(e);
  if(dragFrom===null){
    var dx=p.x-LX,dy=p.y-LY,d=Math.sqrt(dx*dx+dy*dy);
    if(d>26&&state==="placing"){
      ball={x:LX,y:LY,vx:dx/d*SPD,vy:dy/d*SPD,b:0,t:0};
      state="flying";
    }
  }else{
    var s={x1:dragFrom.x,y1:dragFrom.y,x2:p.x,y2:p.y};
    if(segLen(s)>=28&&segLen(s)<=180&&mirBudget>0){
      mirrors.push(s);mirBudget--;updateHud();
    }
  }
  aim=null;dragFrom=null;
  if(e&&e.preventDefault)e.preventDefault();
}
cv.addEventListener("mousedown",down);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",up);
cv.addEventListener("touchstart",down,{passive:false});
cv.addEventListener("touchmove",move,{passive:false});
cv.addEventListener("touchend",up,{passive:false});
btnUndo.addEventListener("click",function(){
  if(state!=="placing"||mirrors.length===0)return;
  mirrors.pop();mirBudget++;updateHud();
});
btnReset.addEventListener("click",function(){
  if(state!=="placing")return;
  mirBudget+=mirrors.length;mirrors=[];updateHud();
});
document.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&(state==="menu"||state==="over")){e.preventDefault();startGame();}
});
function startGame(){reset();state="placing";ov.classList.add("hide");}
btn.addEventListener("click",startGame);
function reflectSeg(b,s){
  var dx=s.x2-s.x1,dy=s.y2-s.y1;
  var len2=dx*dx+dy*dy;
  if(len2===0)return;
  var t=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  var cx=s.x1+dx*t,cy=s.y1+dy*t;
  var ddx=b.x-cx,ddy=b.y-cy;
  var d=Math.sqrt(ddx*ddx+ddy*ddy);
  if(d<BR+2&&d>0.001){
    var nx=ddx/d,ny=ddy/d;
    var dot=b.vx*nx+b.vy*ny;
    if(dot<0){
      b.vx-=2*dot*nx;b.vy-=2*dot*ny;
      b.b++;
    }
    b.x=cx+nx*(BR+2.5);b.y=cy+ny*(BR+2.5);
  }
}
function finish(win,reason){
  state="over";
  if(score>best){best=score;saveBest("mg_s393",best);}
  ovT.textContent=win?"通关!":"游戏结束";
  ovD.textContent=reason;
  ovS.style.display="block";ovS.textContent="得分 "+score+" · 最佳 "+best;
  btn.textContent="再来一局";updateHud();
  ov.classList.remove("hide");
}
function attemptFail(){
  tries--;updateHud();
  if(tries<=0){finish(false,"机会用尽,宝石仍未集齐…");return;}
  msg="弹道未完成!剩余机会 "+tries+" · 可继续调整镜面";msgT=1800;
  ball=null;state="placing";
}
function clearLevel(){
  score+=100+tries*30;updateHud();
  if(lv<LEVELS.length-1){
    msg="折射完美!+"+(100+tries*30);msgT=1500;
    lv++;state="transition";
    window.setTimeout(function(){if(state==="transition"){loadLevel();state="placing";}},1100);
  }else finish(true,"三关宝石尽收,光学大师!");
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(msgT>0)msgT-=dt;
  if(state==="flying"&&ball){
    var it,i;
    for(it=0;it<2;it++){
      ball.x+=ball.vx*dt/2;ball.y+=ball.vy*dt/2;
      if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx);ball.b++;}
      if(ball.x>W-BR){ball.x=W-BR;ball.vx=-Math.abs(ball.vx);ball.b++;}
      if(ball.y<BR){ball.y=BR;ball.vy=Math.abs(ball.vy);ball.b++;}
      if(ball.y>W-BR){ball.y=W-BR;ball.vy=-Math.abs(ball.vy);ball.b++;}
      for(i=0;i<mirrors.length;i++)reflectSeg(ball,mirrors[i]);
      var sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      if(sp>0){ball.vx*=SPD/sp;ball.vy*=SPD/sp;}
    }
    ball.t+=dt;
    for(i=0;i<gems.length;i++){
      var g=gems[i];
      if(!g.got){
        var dx=g.x-ball.x,dy=g.y-ball.y;
        if(dx*dx+dy*dy<18*18){g.got=true;score+=20;updateHud();}
      }
    }
    var ex=exitP.x-ball.x,ey=exitP.y-ball.y;
    if(ex*ex+ey*ey<16*16){
      if(gemsLeft()===0)clearLevel();
      else{
        var d2=Math.sqrt(ex*ex+ey*ey);
        if(d2>0.001){
          var nx2=ex/d2,ny2=ey/d2;
          var dot2=ball.vx*nx2+ball.vy*ny2;
          if(dot2<0){ball.vx-=2*dot2*nx2;ball.vy-=2*dot2*ny2;ball.b++;}
          ball.x=exitP.x-nx2*18;ball.y=exitP.y-ny2*18;
        }
      }
    }
    if(ball.t>9000||ball.b>60)attemptFail();
  }
  draw();
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle="#0d1428";ctx.fillRect(0,0,W,W);
  ctx.strokeStyle="rgba(232,121,169,0.08)";ctx.lineWidth=1;
  for(i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,W);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
  ctx.strokeStyle="#3b4a77";ctx.lineWidth=5;ctx.strokeRect(2,2,W-4,W-4);
  for(i=0;i<gems.length;i++){
    var g=gems[i];
    if(g.got)continue;
    ctx.save();
    ctx.translate(g.x,g.y);
    ctx.rotate(pulse);
    ctx.fillStyle="#4ade80";
    ctx.shadowColor="#4ade80";ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.moveTo(0,-10);ctx.lineTo(8,0);ctx.lineTo(0,10);ctx.lineTo(-8,0);
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
  var open=gemsLeft()===0;
  ctx.fillStyle=open?"rgba(167,139,250,0.3)":"rgba(100,116,139,0.15)";
  ctx.beginPath();ctx.arc(exitP.x,exitP.y,15+pulse*3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=open?"#a78bfa":"#475569";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(exitP.x,exitP.y,15,0,Math.PI*2);ctx.stroke();
  if(open){
    ctx.fillStyle="#a78bfa";ctx.font="11px system-ui";ctx.textAlign="center";
    ctx.fillText("入口开启",exitP.x,exitP.y-22);
    ctx.textAlign="left";
  }
  for(i=0;i<mirrors.length;i++){
    var s=mirrors[i];
    ctx.strokeStyle="#e879a9";
    ctx.shadowColor="#e879a9";ctx.shadowBlur=10;
    ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.strokeStyle="#fce7f3";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
  }
  if(aim&&dragFrom!==null){
    var L2=segLen(aim);
    if(L2>=28&&L2<=180&&mirBudget>0){
      ctx.strokeStyle="rgba(232,121,169,0.6)";ctx.setLineDash([6,5]);ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(aim.x1,aim.y1);ctx.lineTo(aim.x2,aim.y2);ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  if(aim&&dragFrom===null&&state==="placing"){
    ctx.strokeStyle="rgba(251,191,36,0.5)";ctx.setLineDash([4,6]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(LX,LY);ctx.lineTo(aim.x,aim.y);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle="#94a3b8";
  ctx.beginPath();ctx.arc(LX,LY,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#475569";
  ctx.beginPath();ctx.arc(LX,LY,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#cbd5e1";ctx.font="11px system-ui";ctx.textAlign="center";
  ctx.fillText("炮台",LX,LY+30);
  ctx.textAlign="left";
  if(ball){
    ctx.fillStyle="#fbbf24";
    ctx.shadowColor="#fbbf24";ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  if(state==="placing"&&!drag){
    ctx.fillStyle="rgba(139,144,176,0.8)";ctx.font="13px system-ui";ctx.textAlign="center";
    ctx.fillText("拖拽画镜面 · 按住炮台拖动瞄准发射",W/2,466);
    ctx.textAlign="left";
  }
  if(msgT>0){
    ctx.globalAlpha=Math.min(1,msgT/500);
    ctx.fillStyle="#fbbf24";ctx.font="bold 19px system-ui";ctx.textAlign="center";
    ctx.fillText(msg,W/2,70);ctx.globalAlpha=1;ctx.textAlign="left";
  }
}
reset();
state="menu";
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

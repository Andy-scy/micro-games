<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹射连击</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#c084fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#c084fc;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#c084fc}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#c084fc;color:#2a0a45;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>弹射连击</h1>
  <p class="hint">点击 / 触屏顶部选择落球点 · 连续快速击钉可叠连击倍率 · 目标 600 分</p>
  <div class="hud">
    <span>目标 <b>600</b></span>
    <span>剩余球 <b id="balls">8</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="520"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">弹射连击</h2>
      <p id="ovDesc">点击顶部任意位置落下一颗弹珠,穿过钉阵。1.6 秒内连续击中钉子会叠起连击倍率(每钉 10×倍率),钉子被击中后点亮退休。球落入底部料斗:有的加分、有的送球、有的空手而归。8 颗球内拿到 600 分即通关!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=520,BR=8,GRAV=0.0009,TARGET=600,BINSY=462;
function $(id){return document.getElementById(id);}
var elBalls=$("balls"),elSc=$("score"),elBest=$("best");
var ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s394");
var BINS=[{t:"+30",v:30},{t:"+1球",v:1},{t:"空",v:0},{t:"+30",v:30},{t:"空",v:0},{t:"+1球",v:1}];
var state,pegs,ball,ballsLeft,score,combo,comboT,pops,binFlash,binFlashT;
function reset(){
  pegs=[];
  var r,c;
  for(r=0;r<6;r++){
    var y=140+r*36,off=r%2===0?0:27,n=r%2===0?8:8;
    for(c=0;c<n;c++){
      var x=off===0?48+c*54:21+c*54;
      pegs.push({x:x,y:y,lit:false,f:0});
    }
  }
  ball=null;ballsLeft=8;score=0;combo=0;comboT=0;pops=[];binFlash=-1;binFlashT=0;
  updateHud();
}
function updateHud(){
  elBalls.textContent=ballsLeft;elSc.textContent=score;elBest.textContent=best;
}
function finish(win){
  state="over";
  if(win){score+=ballsLeft*20;}
  if(score>best){best=score;saveBest("mg_s394",best);}
  ovT.textContent=win?"目标达成!":"游戏结束";
  ovD.textContent=win?"连击如潮,弹珠台为你清空!剩余球折算奖励。":"8 颗球没能攒够 600 分,再算算落点与节奏吧!";
  ovS.style.display="block";ovS.textContent="得分 "+score+" · 最佳 "+best;
  btn.textContent="再来一局";updateHud();
  ov.classList.remove("hide");
}
function drop(x){
  if(state!=="playing")return;
  if(ball)return;
  if(ballsLeft<=0)return;
  ballsLeft--;updateHud();
  ball={x:Math.max(BR+6,Math.min(W-BR-6,x)),y:26,vx:0,vy:0.05};
}
function ptOf(e){
  var r=cv.getBoundingClientRect(),p=e.touches?(e.touches[0]||e.changedTouches[0]):e;
  return(p.clientX-r.left)*W/r.width;
}
cv.addEventListener("mousedown",function(e){drop(ptOf(e));});
cv.addEventListener("touchstart",function(e){drop(ptOf(e));e.preventDefault();},{passive:false});
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    if(state!=="playing")startGame();
    else drop(W/2);
  }
});
function startGame(){reset();state="playing";ov.classList.add("hide");}
btn.addEventListener("click",startGame);
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  if(state!=="over"){
    var i;
    if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
    for(i=0;i<pops.length;i++)pops[i].life-=dt;
    for(i=pops.length-1;i>=0;i--)if(pops[i].life<=0)pops.splice(i,1);
    for(i=0;i<pegs.length;i++)if(pegs[i].f>0)pegs[i].f-=dt;
    if(binFlashT>0){binFlashT-=dt;if(binFlashT<=0)binFlash=-1;}
  }
  if(state==="playing"&&ball){
    ball.vy+=GRAV*dt;
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx)*0.8;}
    if(ball.x>W-BR){ball.x=W-BR;ball.vx=-Math.abs(ball.vx)*0.8;}
    for(i=0;i<pegs.length;i++){
      var p=pegs[i];
      var dx=ball.x-p.x,dy=ball.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<BR+6&&d>0.001){
        var nx=dx/d,ny=dy/d;
        var dot=ball.vx*nx+ball.vy*ny;
        if(dot<0){
          ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;
          ball.vx*=0.82;ball.vy*=0.82;
          ball.vx+=nx*0.02;ball.vy+=ny*0.02;
          if(!p.lit){
            p.lit=true;p.f=350;
            combo=comboT>0?combo+1:1;
            comboT=1600;
            var pts=10*Math.min(9,combo);
            score+=pts;
            pops.push({x:p.x,y:p.y-12,txt:"+"+pts+(combo>1?" x"+combo:""),life:900});
            updateHud();
          }
        }
        ball.x=p.x+nx*(BR+6.5);ball.y=p.y+ny*(BR+6.5);
      }
    }
    if(ball.y>BINSY-6){
      var bi=Math.max(0,Math.min(5,Math.floor(ball.x/80)));
      var bin=BINS[bi];
      binFlash=bi;binFlashT=500;
      if(bin.v===30){score+=30;pops.push({x:bi*80+40,y:BINSY-24,txt:"+30",life:900});}
      else if(bin.v===1){ballsLeft++;pops.push({x:bi*80+40,y:BINSY-24,txt:"+1球",life:900});}
      else pops.push({x:bi*80+40,y:BINSY-24,txt:"空…",life:900});
      updateHud();
      ball=null;
      if(score>=TARGET){finish(true); }
      else if(ballsLeft<=0)finish(false);
    }
  }
  draw();
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0d1428";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(192,132,252,0.07)";ctx.fillRect(0,0,W,26);
  ctx.fillStyle="#8b90b0";ctx.font="11px system-ui";ctx.textAlign="center";
  ctx.fillText("▼ 点击此处落球 ▼",W/2,17);
  ctx.textAlign="left";
  for(i=0;i<pegs.length;i++){
    var p=pegs[i];
    ctx.fillStyle=p.lit?"#fbbf24":"#5b6bb5";
    if(p.f>0){
      ctx.shadowColor="#fbbf24";ctx.shadowBlur=14;
    }
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    if(p.lit){
      ctx.fillStyle="rgba(251,191,36,0.25)";
      ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.fillStyle="#1c2547";ctx.fillRect(0,BINSY,W,H-BINSY);
  for(i=0;i<BINS.length;i++){
    var bx=i*80;
    ctx.strokeStyle="#3b4a77";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx,BINSY);ctx.lineTo(bx,H);ctx.stroke();
    ctx.fillStyle=i===binFlash?"#fbbf24":"#2dd4bf";
    ctx.font="bold 13px system-ui";ctx.textAlign="center";
    ctx.fillText(BINS[i].t,bx+40,BINSY+30);
  }
  ctx.beginPath();ctx.moveTo(W,BINSY);ctx.lineTo(W,H);ctx.stroke();
  ctx.textAlign="left";
  if(ball){
    ctx.fillStyle="#fbbf24";
    ctx.shadowColor="#fbbf24";ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  for(i=0;i<pops.length;i++){
    var pp=pops[i];
    ctx.globalAlpha=Math.min(1,pp.life/400);
    ctx.fillStyle="#4ade80";ctx.font="bold 15px system-ui";ctx.textAlign="center";
    ctx.fillText(pp.txt,pp.x,pp.y-(900-pp.life)*0.02);
    ctx.textAlign="left";
    ctx.globalAlpha=1;
  }
  if(combo>1){
    ctx.fillStyle="#c084fc";ctx.font="bold 24px system-ui";ctx.textAlign="center";
    ctx.fillText("连击 x"+combo,W/2,110);
    ctx.textAlign="left";
    ctx.fillStyle="rgba(192,132,252,0.4)";
    ctx.fillRect(W/2-60,118,120*Math.min(1,comboT/1600),4);
  }
}
reset();
state="menu";
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>描红显形</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fde68a;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fde68a;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #78350f;background:#0a0c16;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.msg{text-align:center;color:#fbbf24;font-size:13px;height:18px;margin-top:8px}
.overlay{position:absolute;inset:0;background:rgba(8,8,4,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fde68a}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#fde68a;color:#451a03;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>描红显形</h1>
  <p class="hint">画布上藏着一幅彩色的画,黑幕之下什么都看不见;<br>用毛刷<b style="color:#fde68a">刷开黑幕</b>,让画面显形 55% 以上!瞎刷会拉低精细度,最终评分更难看。</p>
  <div class="hud"><span>画幅 <b id="lv">1/2</b></span><span>显形 <b id="cov">0%</b></span><span>精细 <b id="prec">0%</b></span><span>时间 <b id="time">60</b>秒</span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">描红显形</h2>
      <p id="ovP">像擦玻璃上的雾气一样,把黑幕刷开,藏在下面的画就会显形。60 秒内显形过半即完成这一幅;刷得越准,精细度越高。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">举起毛刷</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo");
var elLv=$("lv"),elCov=$("cov"),elPrec=$("prec"),elTime=$("time"),elMsg=$("msg");
var N=96,CELL=5;
var state="menu",lv=0,score=0,timeLeft=60;
var cmask=null,ccnt=0,rev=null,cntRev=0,cntRevC=0;
var sceneCv=document.createElement("canvas");sceneCv.width=480;sceneCv.height=480;
var sctx=sceneCv.getContext("2d");
var maskCv=document.createElement("canvas");maskCv.width=480;maskCv.height=480;
var mctx=maskCv.getContext("2d");
var isDown=false,last=null,lastT=0;
function sceneMushroom(g){
  g.fillStyle="#fde047";g.beginPath();g.arc(408,84,34,0,Math.PI*2);g.fill();
  g.fillStyle="#15803d";g.fillRect(0,388,480,92);
  g.fillStyle="#fef3c7";g.fillRect(206,258,68,132);
  g.fillStyle="#dc2626";
  g.beginPath();g.arc(240,258,132,Math.PI,0);g.closePath();g.fill();
  g.fillStyle="#fef9c3";
  g.beginPath();g.arc(180,196,15,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(262,178,19,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(318,216,12,0,Math.PI*2);g.fill();
  g.fillStyle="#1f2937";
  g.beginPath();g.arc(222,300,6,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(258,300,6,0,Math.PI*2);g.fill();
  g.strokeStyle="#1f2937";g.lineWidth=3;
  g.beginPath();g.arc(240,304,15,0.25,Math.PI-0.25);g.stroke();
  g.fillStyle="#f9a8d4";
  g.beginPath();g.arc(202,314,7,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(278,314,7,0,Math.PI*2);g.fill();
}
function sceneBoat(g){
  g.fillStyle="#fbbf24";g.beginPath();g.arc(84,80,32,0,Math.PI*2);g.fill();
  g.fillStyle="#0284c7";g.fillRect(0,320,480,160);
  g.strokeStyle="#38bdf8";g.lineWidth=4;
  g.beginPath();g.arc(80,330,26,Math.PI*1.1,Math.PI*1.9);g.stroke();
  g.beginPath();g.arc(300,342,30,Math.PI*1.1,Math.PI*1.9);g.stroke();
  g.beginPath();g.arc(430,326,22,Math.PI*1.1,Math.PI*1.9);g.stroke();
  g.fillStyle="#92400e";
  g.beginPath();g.moveTo(110,330);g.lineTo(370,330);g.lineTo(326,392);g.lineTo(154,392);g.closePath();g.fill();
  g.fillStyle="#713f12";g.fillRect(236,150,8,182);
  g.fillStyle="#f8fafc";
  g.beginPath();g.moveTo(244,158);g.lineTo(244,318);g.lineTo(352,318);g.closePath();g.fill();
  g.fillStyle="#ef4444";
  g.beginPath();g.moveTo(236,150);g.lineTo(196,168);g.lineTo(236,186);g.closePath();g.fill();
}
var SCENES=[sceneMushroom,sceneBoat];
function covNow(){return ccnt?cntRevC/ccnt*100:0;}
function precNow(){return cntRev?cntRevC/cntRev*100:0;}
function loadLevel(){
  sctx.clearRect(0,0,480,480);
  SCENES[lv](sctx);
  var dat=sctx.getImageData(0,0,480,480).data;
  cmask=new Uint8Array(N*N);ccnt=0;
  var i,j;
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    if(dat[((j*CELL+2)*480+(i*CELL+2))*4+3]>50){cmask[i*N+j]=1;ccnt++;}
  }
  rev=new Uint8Array(N*N);cntRev=0;cntRevC=0;
  mctx.clearRect(0,0,480,480);
  isDown=false;last=null;timeLeft=60;
  elLv.textContent=(lv+1)+"/2";elMsg.textContent="";
  hud();render();
}
function hud(){
  elCov.textContent=Math.floor(covNow())+"%";
  elPrec.textContent=Math.floor(precNow())+"%";
  elTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function stamp(x,y){
  var g=mctx.createRadialGradient(x,y,2,x,y,20);
  g.addColorStop(0,"rgba(255,255,255,1)");
  g.addColorStop(1,"rgba(255,255,255,0)");
  mctx.fillStyle=g;
  mctx.beginPath();mctx.arc(x,y,20,0,Math.PI*2);mctx.fill();
  var gx0=Math.max(0,Math.floor((x-15)/CELL)),gx1=Math.min(N-1,Math.floor((x+15)/CELL));
  var gy0=Math.max(0,Math.floor((y-15)/CELL)),gy1=Math.min(N-1,Math.floor((y+15)/CELL));
  var i,j;
  for(i=gx0;i<=gx1;i++)for(j=gy0;j<=gy1;j++){
    var cx=i*CELL+2.5,cy=j*CELL+2.5;
    if((cx-x)*(cx-x)+(cy-y)*(cy-y)<=225&&!rev[i*N+j]){
      rev[i*N+j]=1;cntRev++;
      if(cmask[i*N+j])cntRevC++;
    }
  }
  hud();
}
function begin(e){
  if(state!=="playing")return;
  var p=pos(e);isDown=true;last=p;stamp(p.x,p.y);
}
function moveP(e){
  if(!isDown||state!=="playing")return;
  var p=pos(e),d=Math.hypot(p.x-last.x,p.y-last.y),n=Math.max(1,Math.ceil(d/9)),k;
  for(k=1;k<=n;k++)stamp(last.x+(p.x-last.x)*k/n,last.y+(p.y-last.y)*k/n);
  last=p;
}
function endP(){isDown=false;last=null;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function render(){
  ctx.fillStyle="#0a0c16";ctx.fillRect(0,0,480,480);
  ctx.drawImage(sceneCv,0,0);
  ctx.globalCompositeOperation="destination-in";
  ctx.drawImage(maskCv,0,0);
  ctx.globalCompositeOperation="source-over";
}
function finish(){
  state="over";
  ovT.textContent="画匣清空,全部显形!";
  ovP.textContent="两幅藏画都被你细心刷了出来,精细度手感一流。";
  ovS.style.display="block";ovS.textContent="总分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function levelEnd(win){
  var c=Math.floor(covNow()),p=Math.floor(precNow());
  if(win){
    score+=c;lv++;
    if(lv>=2){finish();return;}
    state="over";
    ovT.textContent="显形 "+c+"%!";
    ovP.textContent="精细度 "+p+"%,画浮出水面了,再看下一幅。";
    ovS.style.display="block";ovS.textContent="总分 "+score;
    btnGo.textContent="下一幅";
  }else{
    state="over";
    ovT.textContent="时间到";
    ovP.textContent="显形只有 "+c+"%,精细度 "+p+"%。\n黑幕太厚,按住毛刷贴着画面慢慢找!";
    ovS.style.display="block";ovS.textContent="总分 "+score;
    btnGo.textContent="再刷一幅";
  }
  ov.classList.remove("hide");
}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT)/1000;lastT=t;
  if(state!=="playing")return;
  timeLeft-=dt;
  hud();
  if(timeLeft<=0){timeLeft=0;levelEnd(covNow()>=55);return;}
  if(covNow()>=55)levelEnd(true);
}
btnGo.addEventListener("click",function(){
  var fresh=state==="menu";
  if(fresh){lv=0;score=0;}
  state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  loadLevel();
});
loadLevel();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

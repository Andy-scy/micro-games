<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星屑收集者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.tb{flex:1;padding:12px 0;font-size:16px;background:#232a4a;color:#e8eaf6;border:0;border-radius:10px;touch-action:none;user-select:none;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>星屑收集者</h1>
  <p class="tips">←→ / A D 移动,空格 / ↑ 跳跃。收集本关全部星屑点亮传送门,走进传送门前往下一关。</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
    <div class="stat"><div class="mut">星屑</div><div class="big" id="st">0/0</div></div>
    <div class="stat"><div class="mut">关卡</div><div class="big" id="lv">1/3</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="480" height="360"></canvas></div>
  <div class="card row">
    <button class="tb" id="bL">◀</button><button class="tb" id="bR">▶</button><button class="tb" id="bJ">跳</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">星屑收集者</h2><p id="ovp">玩法说明:<br>· ←→ / A D 移动,空格 / ↑ / W 跳跃<br>· 收集本关全部星屑,传送门才会点亮<br>· 走进点亮的传送门进入下一关,共 3 关<br>· 掉进深渊 -1 生命,共 3 条生命<br>· 星屑 +50,过关 +200,通关时每条剩余生命 +100</p><button class="btn" id="obtn">出发</button></div></div>
<script>
'use strict';
var W=480,H=360;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $i(id){return document.getElementById(id)}
var LEVELS=[
{w:1000,
 solids:[[0,320,300,40],[360,320,240,40],[660,320,340,40],[120,244,90,14],[265,190,90,14],[430,236,90,14],[560,176,100,14],[760,238,90,14],[862,168,100,14]],
 stars:[[70,282],[300,148],[400,290],[505,196],[610,132],[700,290],[912,126]],
 door:[950,268]},
{w:1040,
 solids:[[0,320,200,40],[260,320,140,40],[470,320,150,40],[700,320,120,40],[880,320,160,40],[140,250,70,14],[250,180,80,14],[380,250,70,14],[480,170,80,14],[600,250,70,14],[660,170,80,14],[800,250,80,14],[900,180,90,14]],
 stars:[[100,285],[285,138],[415,210],[515,128],[635,210],[700,128],[835,210],[942,138]],
 door:[990,268]},
{w:1080,
 solids:[[0,320,160,40],[230,320,110,40],[400,320,110,40],[580,320,120,40],[770,320,110,40],[930,320,150,40],[110,240,60,14],[220,170,60,14],[330,240,60,14],[430,160,60,14],[540,240,60,14],[640,170,60,14],[750,240,60,14],[850,170,60,14],[960,240,70,14]],
 stars:[[60,290],[250,128],[360,210],[460,118],[570,210],[670,128],[780,210],[880,128],[1000,202]],
 door:[1020,268]}
];
var lv=0,solids=[],stars=[],worldW=1000;
var door={x:0,y:0,w:34,h:52};
var px=26,py=260,vx=0,vy=0,pw=22,ph=26,onG=false,face=1;
var camX=0,score=0,lives=3,have=0,total=0,doorOpen=false;
var running=false,lastT=0,bannerT=0,parts=[];
var keys={L:false,R:false,J:false},jHeld=false;
function loadLv(n){
  var L=LEVELS[n],i;
  solids=[];
  for(i=0;i<L.solids.length;i++)solids.push({x:L.solids[i][0],y:L.solids[i][1],w:L.solids[i][2],h:L.solids[i][3]});
  stars=[];
  for(i=0;i<L.stars.length;i++)stars.push({x:L.stars[i][0],y:L.stars[i][1],got:false});
  door.x=L.door[0];door.y=L.door[1];
  worldW=L.w;have=0;total=stars.length;doorOpen=false;
  px=26;py=240;vx=0;vy=0;camX=0;bannerT=1.6;
}
function reset(){score=0;lives=3;lv=0;parts=[];loadLv(0);hud()}
function hud(){
  $i('sc').textContent=score;
  $i('st').textContent=have+'/'+total;
  $i('lv').textContent=(lv+1)+'/3';
  var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';
  $i('hp').textContent=h;
}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*2.5,c:c,life:0.3+Math.random()*0.3});}
}
function hitRect(s){return px<s.x+s.w&&px+pw>s.x&&py<s.y+s.h&&py+ph>s.y}
function physics(dt){
  var acc=1500,mx=210;
  if(keys.L){vx-=acc*dt;face=-1}
  if(keys.R){vx+=acc*dt;face=1}
  if(!keys.L&&!keys.R)vx-=vx*Math.min(1,12*dt);
  if(vx>mx)vx=mx;if(vx<-mx)vx=-mx;
  if(keys.J&&!jHeld&&onG){vy=-560;onG=false;burst(px+pw/2,py+ph,'#7f8ab0',3)}
  vy+=1500*dt;if(vy>900)vy=900;
  px+=vx*dt;
  var i,s;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vx>0)px=s.x-pw;else if(vx<0)px=s.x+s.w;
      vx=0;
    }}
  if(px<0)px=0;if(px+pw>worldW)px=worldW-pw;
  py+=vy*dt;onG=false;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vy>0){py=s.y-ph;vy=0;onG=true}
      else if(vy<0){py=s.y+s.h;vy=0}
    }}
}
function endGame(win){
  running=false;
  if(win){$i('ovt').textContent='星辰归位!';$i('ovp').innerHTML='三关全部通过!<br>最终得分:<b>'+score+'</b>';}
  else{$i('ovt').textContent='坠入深渊…';$i('ovp').innerHTML='别灰心,再试一次。<br>最终得分:<b>'+score+'</b>';}
  $i('obtn').textContent='再来一局';
  $i('overlay').classList.remove('hide');
}
function update(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  if(bannerT>0)bannerT-=dt;
  if(!running)return;
  physics(dt);
  var target=px-W/2;
  if(target<0)target=0;if(target>worldW-W)target=worldW-W;
  camX+=(target-camX)*Math.min(1,8*dt);
  for(i=0;i<stars.length;i++){var st=stars[i];
    if(st.got)continue;
    var dx=st.x-(px+pw/2),dy=st.y-(py+ph/2);
    if(dx*dx+dy*dy<26*26){st.got=true;have++;score+=50;burst(st.x,st.y,'#ffd166',8);hud();}
  }
  if(!doorOpen&&have>=total){doorOpen=true;burst(door.x+door.w/2,door.y+26,'#4cc9f0',14)}
  if(doorOpen&&px+pw>door.x&&px<door.x+door.w&&py+ph>door.y&&py<door.y+door.h){
    score+=200;hud();
    if(lv>=LEVELS.length-1){score+=lives*100;hud();endGame(true);return;}
    lv++;loadLv(lv);hud();return;
  }
  if(py>H+80){
    lives--;hud();burst(px+pw/2,H-6,'#ff5c5c',12);
    if(lives<=0){lives=0;hud();endGame(false);return;}
    px=26;py=240;vx=0;vy=0;
  }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141a38');g.addColorStop(1,'#0c1026');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<26;i++){
    var sx=(i*173+40-camX*0.3)%(W+40),sy=(i*97+30)%(H-60);
    if(sx<0)sx+=W+40;
    ctx.globalAlpha=0.25+0.2*Math.sin(i*2.1+Date.now()*0.001);
    ctx.fillStyle='#8fa3d9';ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(-Math.round(camX),0);
  for(i=0;i<solids.length;i++){var s=solids[i];
    ctx.fillStyle='#2b3358';rr(s.x,s.y,s.w,s.h,4);ctx.fill();
    ctx.fillStyle='#4a5688';ctx.fillRect(s.x+2,s.y,s.w-4,3);
  }
  ctx.fillStyle='#4cc9f0';
  if(doorOpen){
    ctx.globalAlpha=0.25+0.15*Math.sin(Date.now()*0.006);
    ctx.beginPath();ctx.arc(door.x+door.w/2,door.y+door.h/2,44,0,6.28);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=doorOpen?'#4cc9f0':'#39406b';
  rr(door.x,door.y,door.w,door.h,6);ctx.fill();
  if(doorOpen){
    ctx.strokeStyle='#aef1ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(door.x+door.w/2,door.y+door.h/2,door.w*0.32,door.h*0.36,0,0,6.28);ctx.stroke();
  }
  for(i=0;i<stars.length;i++){var st=stars[i];
    if(st.got)continue;
    var tw=0.8+0.25*Math.sin(Date.now()*0.004+i*1.7);
    ctx.save();ctx.translate(st.x,st.y);ctx.rotate(Date.now()*0.001+i);
    ctx.fillStyle='#ffd166';
    ctx.beginPath();
    for(var k=0;k<5;k++){
      var a=k/5*6.2832-1.57;
      ctx.lineTo(Math.cos(a)*9*tw,Math.sin(a)*9*tw);
      var a2=a+0.628;
      ctx.lineTo(Math.cos(a2)*3.8*tw,Math.sin(a2)*3.8*tw);
    }
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#8fd3ff';
  rr(px,py,pw,ph,6);ctx.fill();
  ctx.fillStyle='#081226';
  ctx.fillRect(px+pw*0.28,py+7,4,5);
  ctx.fillRect(px+pw*0.62,py+7,4,5);
  for(i=0;i<parts.length;i++){var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2.4);
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if(bannerT>0){
    ctx.globalAlpha=Math.min(1,bannerT);
    ctx.fillStyle='rgba(15,18,32,.55)';ctx.fillRect(0,H/2-34,W,68);
    ctx.fillStyle='#ffd166';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText('第 '+(lv+1)+' 关 · 星屑 '+total+' 颗',W/2,H/2+9);
    ctx.globalAlpha=1;
  }
  ctx.font='12px system-ui';ctx.fillStyle='#7f8ab0';ctx.textAlign='left';
  ctx.fillText(doorOpen?'传送门已点亮,出发!':'还需星屑 '+(total-have)+' 颗',10,H-10);
}
function bindBtn(id,prop){
  var b=$i(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[prop]=true});
  b.addEventListener('pointerup',function(e){e.preventDefault();keys[prop]=false});
  b.addEventListener('pointercancel',function(){keys[prop]=false});
  b.addEventListener('pointerleave',function(){keys[prop]=false});
}
bindBtn('bL','L');bindBtn('bR','R');bindBtn('bJ','J');
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keys.J=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=false;
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  jHeld=keys.J;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

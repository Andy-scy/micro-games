<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引力反转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#a78bfa;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#a78bfa;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#a78bfa}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#a78bfa;color:#241a4d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>引力反转</h1>
  <p class="hint">空格 / 点击 反转重力 · 在地板与天花板间切换,抵达传送门</p>
  <div class="hud">
    <span>关卡 <b id="lv">1</b></span>
    <span>生命 <b id="lives">3</b></span>
    <span>进度 <b id="prog">0%</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="520"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">引力反转</h2>
      <p id="ovDesc">小球自动向右飞驰。按空格或点击屏幕反转重力,在地板与天花板之间切换:地板尖刺要贴顶飞,天花板尖刺要贴地跑,闸门只留一侧通道。抵达紫色传送门即过关,共三关!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=520,BX=150,BR=10,FLOOR=460,CEIL=70,G=0.0011;
function $(id){return document.getElementById(id);}
var elLv=$("lv"),elLives=$("lives"),elProg=$("prog"),elSc=$("score"),elBest=$("best");
var ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s384");
var LEVELS=[
 {spd:0.16,seq:["spikeF","spikeC","spikeF","gateT","spikeC","gateB","spikeF"]},
 {spd:0.18,seq:["spikeC","gateT","spikeF","spikeC","gateB","gateT","spikeF","spikeC"]},
 {spd:0.20,seq:["gateB","spikeF","gateT","spikeC","gateB","spikeF","gateT","spikeC","gateB"]}
];
var state,lv,lives,score,wx,spd,g,by,vy,cd,flash,obstacles,goalX,needM,msg,msgT,portalA;
function reset(){lv=0;lives=3;score=0;startLevel();updateHud();}
function startLevel(){
  var L=LEVELS[lv],i,x=360;
  spd=L.spd;wx=0;g=1;by=FLOOR-BR;vy=0;cd=0;flash=0;
  obstacles=[];
  for(i=0;i<L.seq.length;i++){obstacles.push({type:L.seq[i],x:x});x+=250+(i%2)*40;}
  goalX=x+160;
  needM=Math.round(goalX/10);
  elLv.textContent=lv+1;updateHud();
}
function updateHud(){
  elLives.textContent=lives;elSc.textContent=score;elBest.textContent=best;
  elProg.textContent=Math.min(100,Math.round((wx+BX)/goalX*100))+"%";
}
function circleRect(cx,cy,r,rc){
  var nx=Math.max(rc.x,Math.min(cx,rc.x+rc.w)),ny=Math.max(rc.y,Math.min(cy,rc.y+rc.h));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function obsRect(o){
  if(o.type==="spikeF")return{x:o.x,y:FLOOR-18,w:60,h:18};
  if(o.type==="spikeC")return{x:o.x,y:CEIL,w:60,h:18};
  if(o.type==="gateT")return{x:o.x,y:FLOOR-190,w:16,h:190};
  return{x:o.x,y:CEIL,w:16,h:190};
}
function flip(){
  if(cd>0)return;
  g=-g;cd=260;flash=200;
}
function death(){
  lives--;updateHud();
  if(lives<=0){finish(false,"撞毁在关卡 "+(lv+1)+"!引力掌握还需练习~");return;}
  msg="坠毁!剩余生命 "+lives+" · 本关重新开始";msgT=1400;
  startLevel();
}
function clearLevel(){
  score+=100+lv*50;updateHud();
  if(lv<LEVELS.length-1){
    msg="过关!+"+(100+lv*50)+" · 下一关更快!";msgT=1500;
    lv++;window.setTimeout(function(){if(state==="transition"){startLevel();state="playing";}},1100);
    state="transition";
  }else finish(true,"三关全部穿越,引力大师!");
}
function finish(win,reason){
  state="over";
  if(score>best){best=score;saveBest("mg_s384",best);}
  ovT.textContent=win?"通关!":"游戏结束";
  ovD.textContent=reason;
  ovS.style.display="block";ovS.textContent="得分 "+score+" · 最佳 "+best;
  btn.textContent="再来一局";updateHud();
  ov.classList.remove("hide");
}
function act(){
  if(state==="playing")flip();
}
cv.addEventListener("mousedown",function(e){act();e.preventDefault();});
cv.addEventListener("touchstart",function(e){act();e.preventDefault();},{passive:false});
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="Enter"){
    e.preventDefault();
    if(state!=="playing")startGame();else act();
  }
});
function startGame(){reset();state="playing";ov.classList.add("hide");}
btn.addEventListener("click",startGame);
var lastT=0,stars=[];
for(var si=0;si<50;si++)stars.push({x:Math.random()*W,y:Math.random()*H,tw:Math.random()*6});
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  portalA+=dt*0.004;
  if(state==="playing"){
    if(msgT>0)msgT-=dt;
    if(flash>0)flash-=dt;
    if(cd>0)cd-=dt;
    wx+=spd*dt;
    vy+=G*g*dt;by+=vy*dt;
    if(g>0&&by>=FLOOR-BR){by=FLOOR-BR;vy=0;}
    if(g<0&&by<=CEIL+BR){by=CEIL+BR;vy=0;}
    var i,hit=false,wx2=wx+BX;
    for(i=0;i<obstacles.length;i++){
      var o=obstacles[i];
      if(o.x<wx2-120||o.x>wx2+120)continue;
      if(circleRect(BX,by,BR,obsRect(o))){hit=true;break;}
    }
    if(hit)death();
    else if(wx2>=goalX)clearLevel();
    updateHud();
  }
  draw();
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0d1126";ctx.fillRect(0,0,W,H);
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.25+0.2*Math.sin(s.tw+portalA*2);
    ctx.fillStyle="#c7cbe8";ctx.fillRect(s.x,s.y,2,2);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#1c2547";ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle="#2b3663";ctx.fillRect(0,FLOOR,W,3);
  ctx.fillStyle="#1c2547";ctx.fillRect(0,0,W,CEIL);
  ctx.fillStyle="#2b3663";ctx.fillRect(0,CEIL-3,W,3);
  for(i=0;i<obstacles.length;i++){
    var o=obstacles[i],sx=o.x-wx;
    if(sx<-90||sx>W+30)continue;
    var rc=obsRect(o),j;
    if(o.type==="spikeF"||o.type==="spikeC"){
      for(j=0;j<5;j++){
        var bx0=sx+j*12;
        ctx.fillStyle="#f87171";
        ctx.beginPath();
        if(o.type==="spikeF"){ctx.moveTo(bx0,FLOOR);ctx.lineTo(bx0+6,FLOOR-16);ctx.lineTo(bx0+12,FLOOR);}
        else{ctx.moveTo(bx0,CEIL);ctx.lineTo(bx0+6,CEIL+16);ctx.lineTo(bx0+12,CEIL);}
        ctx.closePath();ctx.fill();
      }
    }else{
      ctx.fillStyle="#5b6bb5";
      ctx.fillRect(sx,rc.y,rc.w,rc.h);
      ctx.fillStyle="#fbbf24";
      for(j=0;j<rc.h-8;j+=16)ctx.fillRect(sx+3,rc.y+4+j,rc.w-6,6);
    }
  }
  var pgx=goalX-wx;
  if(pgx>-40&&pgx<W+40){
    ctx.save();
    ctx.translate(pgx,265);
    ctx.rotate(portalA);
    ctx.strokeStyle="#a78bfa";ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*1.5);ctx.stroke();
    ctx.rotate(1.1);
    ctx.strokeStyle="#c4b5fd";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*1.3);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle=g>0?"#a78bfa":"#f0abfc";
  ctx.shadowColor=g>0?"#a78bfa":"#f0abfc";ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(BX,by,BR,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  if(flash>0){
    ctx.globalAlpha=flash/200*0.25;
    ctx.fillStyle="#f0abfc";ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle="rgba(139,144,176,0.85)";ctx.font="13px system-ui";ctx.textAlign="center";
  ctx.fillText(g>0?"重力:向下":"重力:向上",BX,by+(g>0?-24:32));
  ctx.textAlign="left";
  if(msgT>0){
    ctx.globalAlpha=Math.min(1,msgT/500);
    ctx.fillStyle="#fbbf24";ctx.font="bold 20px system-ui";ctx.textAlign="center";
    ctx.fillText(msg,W/2,140);ctx.globalAlpha=1;ctx.textAlign="left";
  }
}
reset();
state="menu";
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

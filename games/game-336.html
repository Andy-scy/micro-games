<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点灯闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fbbf24;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fbbf24;font-size:16px}
.gbtn{background:#3a2c03;color:#fbbf24;border:1px solid #fbbf24;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#fbbf24;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.grid{display:grid;gap:8px;max-width:400px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:9px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.on{background:linear-gradient(145deg,#fde68a,#d97706);border-color:#fef3c7;box-shadow:0 0 13px rgba(251,191,36,.55)}
.cell.cur{outline:2px solid rgba(251,191,36,.75);outline-offset:2px}
.cell:active{transform:scale(.92)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#fbbf24;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#fbbf24;color:#3a2c03;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>点灯闯关</h1>
  <p class="hint">六关征程:棋盘从 3×3 一路换到 5×5,每关目标都是熄灭全部灯。点击翻转十字,关关由目标状态打乱而来,必定可解。越往后,盘越大、手越要稳。</p>
  <div class="hud">
    <span>关卡 <b id="lv">1</b>/6</span>
    <span>棋盘 <b id="size">3×3</b></span>
    <span>本关步数 <b id="moves">0</b></span>
    <span>总步数 <b id="total">0</b></span>
    <button class="gbtn" id="btnRe">重开本关</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">点灯闯关</h2>
    <p id="ovDesc">从小盘练到大盘的完整旅程:3×3 热身,4×4 上强度,5×5 见真章,最后还有高压关。全程只统计一件事——你一共按了多少次灯。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始闯关</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var LEVELS=[{n:3,k:3},{n:4,k:4},{n:5,k:5},{n:4,k:6},{n:5,k:7},{n:5,k:9}];
var gridEl=$("grid"),elLv=$("lv"),elSize=$("size"),elMoves=$("moves"),elTotal=$("total"),elMsg=$("msg"),btnRe=$("btnRe");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],N=3,CNT=9,level=1,moves=0,total=0,state="menu";
var best=loadNum("mg336_best");

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2200);}
function buildGrid(){
  var cfg=LEVELS[level-1];
  N=cfg.n;CNT=N*N;
  gridEl.style.gridTemplateColumns="repeat("+N+",1fr)";
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++)board[list[i]]^=1;
  if(!silent){
    moves++;total++;
    for(i=0;i<list.length;i++)paint(list[i]);
  }
}
function litCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i])n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function updateHud(){
  elLv.textContent=level;elSize.textContent=N+"×"+N;
  elMoves.textContent=moves;elTotal.textContent=total;
}
function newLevel(){
  var cfg=LEVELS[level-1];
  buildGrid();
  board=[];for(var i=0;i<CNT;i++)board.push(0);
  moves=0;
  var ps=pickCells(cfg.k),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(litCount()===0){
    if(level<6){
      state="lock";
      setMsg("第 "+level+" 关熄灯成功!");
      setTimeout(function(){level++;newLevel();state="playing";setMsg("第 "+level+" 关:"+N+"×"+N+" 棋盘");},900);
    }else win();
  }
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||total<best){best=total;saveNum("mg336_best",best);isNew=true;}
  ovTitle.textContent="六关全熄!";
  ovDesc.textContent=isNew?"新纪录!全程最少步数完成闯关。":"从 3×3 到 5×5,一路熄到终点,火候已到。";
  ovScore.style.display="block";
  ovScore.textContent="总步数 "+total+(best>0?" · 历史最少 "+best:"");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function start(){
  level=1;total=0;state="playing";
  newLevel();ov.classList.add("hide");
  setMsg("第 1 关:3×3 热身局");
}
var cur=-1;
function setCur(i){
  if(cur>=0&&cur<CNT&&cells[cur])cells[cur].classList.remove("cur");
  cur=i;
  if(cur>=0&&cur<CNT&&cells[cur])cells[cur].classList.add("cur");
}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(cur<0||cur>=CNT)setCur(((N/2)|0)*N+((N/2)|0));
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnRe.addEventListener("click",function(){
  if(state==="menu"||state==="lock")return;
  total-=moves;state="playing";newLevel();setMsg("本关已重置");
});
buildGrid();
board=[];for(var z=0;z<CNT;z++)board.push(0);
var ps0=pickCells(LEVELS[0].k),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
})();
</script>
</body>
</html>

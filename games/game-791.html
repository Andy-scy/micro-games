<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜光垂钓</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1220;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;user-select:none}
h1{font-size:21px;color:#7fd4ff;margin:2px 0}
.tip{font-size:13px;color:#9aa3b5;text-align:center;max-width:520px;line-height:1.6;margin-bottom:6px}
#hud{display:flex;gap:16px;font-size:15px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#hud b{color:#ffd75e}
canvas{border-radius:14px;max-width:96vw;touch-action:none;display:block}
#ov{position:fixed;inset:0;background:rgba(6,8,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:9}
#ov h2{font-size:26px;color:#ffd75e}
#ov p{color:#c8cfdd;font-size:15px;max-width:380px;line-height:1.8}
#ov button{background:linear-gradient(180deg,#5db8ff,#2f8fe0);color:#04101f;border:0;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<h1>夜光垂钓</h1>
<p class="tip">伸手不见五指,只有萤鱼自己发着光;它们会被你的灯光吸引。移动灯光引鱼入圈,点屏幕/空格在灯下撒网;月光亮起的瞬间能瞥见无光的月影鱼,一条 120 分!</p>
<div id="hud"><span>得分 <b id="s1">0</b></span><span>时间 <b id="s2">75</b> 秒</span><span>目标 <b>450</b> 分</span></div>
<canvas id="cv" width="480" height="560"></canvas>
<div id="ov"><h2 id="ot">夜光垂钓</h2><p id="op">夜钓全凭一盏灯。<br>灯光引来萤鱼(30 分),月光照亮月影鱼(120 分)。<br>把灯移到鱼群上,撒网!</p><button id="ob">点亮灯盏</button></div>
<script>
(function(){
var cv=document.getElementById('cv'),X=cv.getContext('2d');
var ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),ob=document.getElementById('ob');
var eS=document.getElementById('s1'),eT=document.getElementById('s2');
var W=cv.width,H=cv.height;
var state='ready',tl=75,score=0,msg='',cd=0,moonT=0;
var lamp={x:240,y:280};
var glow=[],shade=[],respawnQ=[];
function rnd(a,b){return a+Math.random()*(b-a)}
function edgePos(){
  var side=Math.floor(Math.random()*4),x,y;
  if(side===0){x=-16;y=rnd(24,H-24)}else if(side===1){x=W+16;y=rnd(24,H-24)}
  else if(side===2){x=rnd(24,W-24);y=-16}else{x=rnd(24,W-24);y=H+16}
  return {x:x,y:y};
}
function spawnFish(isShade){
  var p=edgePos();
  var f={x:p.x,y:p.y,a:Math.atan2(H/2-p.y,W/2-p.x)+rnd(-0.5,0.5),sp:isShade?rnd(90,130):rnd(45,75)};
  if(isShade){f.v=120;shade.push(f)}else{f.v=30;f.col=Math.random()<0.5?'#7ff0e0':'#ffd98f';glow.push(f)}
}
function moonOn(){var c=moonT%9;return c>=6&&c<=7.4}
function net(){
  if(state!=='play'||cd>0)return;
  cd=0.9;
  var moon=moonOn(),best=null,bd=60,i;
  for(i=0;i<glow.length;i++){
    var d=Math.sqrt((glow[i].x-lamp.x)*(glow[i].x-lamp.x)+(glow[i].y-lamp.y)*(glow[i].y-lamp.y));
    if(d<bd){bd=d;best={f:glow[i],arr:glow,idx:i}}
  }
  if(moon){
    for(i=0;i<shade.length;i++){
      var d2=Math.sqrt((shade[i].x-lamp.x)*(shade[i].x-lamp.x)+(shade[i].y-lamp.y)*(shade[i].y-lamp.y));
      if(d2<bd){bd=d2;best={f:shade[i],arr:shade,idx:i}}
    }
  }
  if(best){
    score+=best.f.v;
    msg=(best.arr===shade?'月影鱼!!+':'萤鱼上网!+')+best.f.v+' 分';
    best.arr.splice(best.idx,1);
    respawnQ.push({t:2,shade:best.arr===shade});
  }else{
    msg='网里空空,鱼没聚过来…';
  }
}
function finish(win){
  state='over';ob.textContent='再守一夜';
  ot.textContent=win?'满网星光!':'夜色沉沉…';
  op.innerHTML='本次得分 <b style="color:#ffd75e">'+score+'</b> / 目标 450 分<br>'+(win?'灯下鱼群如星河倾泻!':'月光一闪别愣神,那是大买卖。');
  ov.classList.remove('hide');
}
function start(){
  tl=75;score=0;msg='';cd=0;moonT=0;lamp.x=240;lamp.y=280;
  glow=[];shade=[];respawnQ=[];
  var i;for(i=0;i<6;i++)spawnFish(false);
  for(i=0;i<2;i++)spawnFish(true);
  state='play';ov.classList.add('hide');
}
function moveFish(f,dt,attract){
  if(attract){
    var dx=lamp.x-f.x,dy=lamp.y-f.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<150&&d>12){
      var ta=Math.atan2(dy,dx),diff=ta-f.a;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      f.a+=Math.max(-2.5*dt,Math.min(2.5*dt,diff));
    }
  }
  f.a+=rnd(-1,1)*dt*1.5;
  f.x+=Math.cos(f.a)*f.sp*dt;
  f.y+=Math.sin(f.a)*f.sp*dt;
  if(f.x<24){f.x=24;f.a=Math.PI-f.a}
  if(f.x>W-24){f.x=W-24;f.a=Math.PI-f.a}
  if(f.y<24){f.y=24;f.a=-f.a}
  if(f.y>H-24){f.y=H-24;f.a=-f.a}
}
function update(dt){
  if(state!=='play')return;
  if(cd>0)cd-=dt;
  moonT+=dt;
  tl-=dt;if(tl<=0){tl=0;finish(score>=450);return}
  var i;
  for(i=0;i<glow.length;i++)moveFish(glow[i],dt,true);
  for(i=0;i<shade.length;i++)moveFish(shade[i],dt,false);
  for(i=respawnQ.length-1;i>=0;i--){
    respawnQ[i].t-=dt;
    if(respawnQ[i].t<=0){spawnFish(respawnQ[i].shade);respawnQ.splice(i,1)}
  }
}
function draw(){
  X.fillStyle='#05070f';X.fillRect(0,0,W,H);
  var i,t=Date.now()*0.001;
  X.strokeStyle='rgba(90,120,170,.10)';X.lineWidth=1.5;
  for(i=0;i<5;i++){
    X.beginPath();X.arc((i*151+40)%W,(i*97+60)%H,20+((i*13)%30),0,7);X.stroke();
  }
  var lg=X.createRadialGradient(lamp.x,lamp.y,8,lamp.x,lamp.y,95);
  lg.addColorStop(0,'rgba(255,232,160,.32)');
  lg.addColorStop(1,'rgba(255,232,160,0)');
  X.fillStyle=lg;
  X.beginPath();X.arc(lamp.x,lamp.y,95,0,7);X.fill();
  for(i=0;i<glow.length;i++){
    var f=glow[i];
    X.shadowColor=f.col;X.shadowBlur=16;
    X.fillStyle=f.col;
    X.beginPath();X.ellipse(f.x,f.y,7,3.5,f.a,0,7);X.fill();
    X.shadowBlur=0;
  }
  var moon=moonOn();
  if(moon){
    X.fillStyle='rgba(150,170,230,.07)';X.fillRect(0,0,W,H);
    X.fillStyle='rgba(190,205,255,.8)';X.font='bold 14px system-ui';X.textAlign='center';
    X.fillText('月光如练……月影鱼现!',W/2,30);
    for(i=0;i<shade.length;i++){
      var s=shade[i];
      X.strokeStyle='rgba(160,180,225,.6)';X.lineWidth=1.6;
      X.beginPath();X.ellipse(s.x,s.y,15,6,s.a,0,7);X.stroke();
      X.beginPath();X.moveTo(s.x-Math.cos(s.a)*13,s.y-Math.sin(s.a)*13);
      X.lineTo(s.x-Math.cos(s.a)*24,s.y-Math.sin(s.a)*24-5);
      X.lineTo(s.x-Math.cos(s.a)*24,s.y-Math.sin(s.a)*24+5);
      X.closePath();X.stroke();
    }
  }
  X.fillStyle='#2c3a55';
  X.beginPath();X.ellipse(lamp.x,lamp.y,18,10,0,0,7);X.fill();
  X.fillStyle='#ffd75e';
  X.beginPath();X.arc(lamp.x,lamp.y,4,0,7);X.fill();
  X.fillStyle='#ffe9a3';X.font='bold 15px system-ui';X.textAlign='center';
  X.fillText(cd>0?'收网中…':msg,W/2,H-42);
  X.fillStyle='rgba(154,163,181,.85)';X.font='13px system-ui';
  X.fillText('移动鼠标/手指 提灯引鱼 · 点击/空格 撒网',W/2,H-16);
}
cv.addEventListener('pointermove',function(e){
  var r=cv.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  lamp.x=Math.max(30,Math.min(W-30,mx));
  lamp.y=Math.max(30,Math.min(H-30,my));
});
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  lamp.x=Math.max(30,Math.min(W-30,mx));
  lamp.y=Math.max(30,Math.min(H-30,my));
  if(state!=='play')return;
  net();
});
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.code==='Space'){
    e.preventDefault();
    if(state!=='play')start();else net();
  }
});
ob.addEventListener('click',start);
var last=0;
function loop(ts){
  var dt=(ts-last)/1000;last=ts;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  eS.textContent=score;eT.textContent=Math.ceil(tl);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

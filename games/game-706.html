<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>碎雪遗迹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.tb{flex:1;padding:12px 0;font-size:16px;background:#232a4a;color:#e8eaf6;border:0;border-radius:10px;touch-action:none;user-select:none;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>碎雪遗迹</h1>
  <p class="tips">←→ 移动,空格跳跃。积雪石板踩上 0.5 秒就会碎裂坠毁,收集 8 枚水晶开启神殿之门。</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">水晶</div><div class="big" id="cr">0/8</div></div>
    <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
    <div class="stat"><div class="mut">提示</div><div class="big" id="hint">规划路线</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="480" height="400"></canvas></div>
  <div class="card row">
    <button class="tb" id="bL">◀</button><button class="tb" id="bR">▶</button><button class="tb" id="bJ">跳</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">碎雪遗迹</h2><p id="ovp">玩法说明:<br>· ←→ / A D 移动,空格 / ↑ 跳跃<br>· 白色雪板被踩住 0.5 秒就会碎裂坠毁<br>· 碎掉的雪板过一阵会重新凝出<br>· 灰色石阶永远稳固,可以安心歇脚<br>· 收集全部 8 枚水晶,神殿之门才会开启<br>· 掉进中央深井 -1 生命,石板全部复原</p><button class="btn" id="obtn">进入遗迹</button></div></div>
<script>
'use strict';
var W=480,H=400;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $i(id){return document.getElementById(id)}
var STONES=[{x:0,y:370,w:120,h:30},{x:360,y:370,w:120,h:30}];
var SNOWDEF=[
[130,320,100],[250,320,100],
[60,260,80],[170,260,70],[290,260,80],[390,260,70],
[110,200,80],[240,200,90],[360,200,60],
[40,140,70],[160,140,70],[280,140,70],[390,140,70],
[120,80,110],[290,80,110]
];
var CRYS=[[180,290],[100,230],[210,230],[330,230],[150,170],[310,170],[175,110],[345,110]];
var DOOR={x:300,y:28,w:34,h:52};
var snow=[],crys=[];
var px=14,py=340,vx=0,vy=0,pw=22,ph=26,onG=false;
var score=0,lives=3,got=0,doorOpen=false;
var running=false,lastT=0,parts=[],won=false,winT=0;
var keys={L:false,R:false,J:false},jHeld=false;
function build(){
  snow=[];crys=[];
  var i;
  for(i=0;i<SNOWDEF.length;i++)snow.push({x:SNOWDEF[i][0],y:SNOWDEF[i][1],w:SNOWDEF[i][2],h:12,timer:0,state:0,fy:0,rt:0});
  for(i=0;i<CRYS.length;i++)crys.push({x:CRYS[i][0],y:CRYS[i][1],got:false});
}
function reset(){
  build();
  px=14;py=340;vx=0;vy=0;
  score=0;lives=3;got=0;doorOpen=false;
  parts=[];won=false;winT=0;
  hud();
}
function hud(){
  $i('cr').textContent=got+'/8';
  $i('sc').textContent=score;
  var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';
  $i('hp').textContent=h;
  $i('hint').textContent=doorOpen?'门已开启,登顶!':'水晶 '+got+'/8';
}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*2.5,c:c,life:0.3+Math.random()*0.3});}
}
function hitRect(s){return px<s.x+s.w&&px+pw>s.x&&py<s.y+s.h&&py+ph>s.y}
function solidList(){
  var a=[],i;
  for(i=0;i<STONES.length;i++)a.push(STONES[i]);
  for(i=0;i<snow.length;i++)if(snow[i].state<2)a.push(snow[i]);
  return a;
}
function endGame(){
  running=false;
  if(won){$i('ovt').textContent='遗迹之主!';$i('ovp').innerHTML='8 枚水晶,神殿认了你!<br>最终得分:<b>'+score+'</b>';}
  else{$i('ovt').textContent='坠入深井…';$i('ovp').innerHTML='雪板会再凝,你也会再来。<br>最终得分:<b>'+score+'</b><br>收集水晶:<b>'+got+'/8</b>';}
  $i('obtn').textContent='再来一局';
  $i('overlay').classList.remove('hide');
}
function physics(dt){
  var solids=solidList();
  var acc=1500,mx=200;
  if(keys.L)vx-=acc*dt;
  if(keys.R)vx+=acc*dt;
  if(!keys.L&&!keys.R)vx-=vx*Math.min(1,11*dt);
  if(vx>mx)vx=mx;if(vx<-mx)vx=-mx;
  if(keys.J&&!jHeld&&onG){vy=-560;onG=false;}
  vy+=1500*dt;if(vy>880)vy=880;
  px+=vx*dt;
  var i,s;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){if(vx>0)px=s.x-pw;else if(vx<0)px=s.x+s.w;vx=0;}
  }
  if(px<0)px=0;if(px+pw>W)px=W-pw;
  py+=vy*dt;onG=false;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vy>0){py=s.y-ph;vy=0;onG=true;}
      else if(vy<0){py=s.y+s.h;vy=0;}
    }}
}
function update(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  if(!running)return;
  if(won){winT+=dt;if(winT>1.2){score+=lives*100;hud();endGame();}return;}
  for(i=0;i<snow.length;i++){var s=snow[i];
    if(s.state===2){
      s.fy+=260*dt;
      s.rt-=dt;
      if(s.rt<=0){s.state=0;s.timer=0;s.fy=0;}
      continue;
    }
    if(s.state===1){
      var standing=onG&&Math.abs((py+ph)-s.y)<3&&px+pw>s.x&&px<s.x+s.w;
      if(!standing){s.timer-=dt*1.6;if(s.timer<0)s.timer=0;}
      else{
        s.timer+=dt;
        if(s.timer>0.5){
          s.state=2;s.rt=2.6;s.fy=0;
          burst(s.x+s.w/2,s.y,'#dfe9ff',10);
        }
      }
    }else{
      var standing2=onG&&Math.abs((py+ph)-s.y)<3&&px+pw>s.x&&px<s.x+s.w;
      if(standing2)s.state=1;
    }
  }
  physics(dt);
  for(i=0;i<crys.length;i++){var c=crys[i];
    if(c.got)continue;
    var dx=c.x-(px+pw/2),dy=c.y-(py+ph/2);
    if(dx*dx+dy*dy<25*25){c.got=true;got++;score+=40;burst(c.x,c.y,'#7bf1d8',7);hud();}
  }
  if(!doorOpen&&got>=crys.length){doorOpen=true;burst(DOOR.x+17,DOOR.y+26,'#4cc9f0',14);}
  if(doorOpen&&px+pw>DOOR.x&&px<DOOR.x+DOOR.w&&py+ph>DOOR.y&&py<DOOR.y+DOOR.h){
    won=true;score+=400;burst(DOOR.x+17,DOOR.y+26,'#ffe9a3',22);
  }
  if(py>H+50){
    lives--;hud();burst(px+pw/2,H-8,'#ff5c5c',12);
    if(lives<=0){lives=0;hud();endGame();return;}
    px=14;py=340;vx=0;vy=0;
    for(i=0;i<snow.length;i++){snow[i].state=0;snow[i].timer=0;snow[i].fy=0;snow[i].rt=0;}
  }
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#171b33');g.addColorStop(1,'#0c0f22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  ctx.fillStyle='#070915';
  ctx.fillRect(120,H-40,240,40);
  for(var xx=128;xx<360;xx+=24){
    ctx.fillStyle='#1c2240';
    ctx.beginPath();ctx.moveTo(xx,H);ctx.lineTo(xx+12,H-8);ctx.lineTo(xx+24,H);ctx.closePath();ctx.fill();
  }
  for(i=0;i<STONES.length;i++){var st=STONES[i];
    ctx.fillStyle='#3a4162';ctx.fillRect(st.x,st.y,st.w,st.h);
    ctx.fillStyle='#5c669a';ctx.fillRect(st.x,st.y,st.w,4);
  }
  for(i=0;i<snow.length;i++){var s=snow[i];
    if(s.state===2){
      ctx.globalAlpha=Math.max(0,Math.min(1,s.rt/1.2));
      ctx.fillStyle='#232a4a';
      ctx.fillRect(s.x,s.y+s.fy,s.w,s.h);
      ctx.globalAlpha=1;
      continue;
    }
    var jx=s.state===1?(Math.random()*2-1)*2.2:0;
    var jy=s.state===1?(Math.random()*2-1)*1.4:0;
    ctx.fillStyle=s.state===1?'#e8efff':'#c7d4f5';
    ctx.fillRect(s.x+jx,s.y+jy,s.w,s.h);
    ctx.fillStyle='#8fa3d9';
    ctx.fillRect(s.x+jx,s.y+jy+s.h-3,s.w,3);
    if(s.state===1){
      ctx.fillStyle='rgba(255,120,120,'+(0.3+0.4*Math.sin(Date.now()*0.02))+')';
      ctx.fillRect(s.x+jx,s.y+jy,s.w,2);
    }
  }
  if(doorOpen){
    ctx.globalAlpha=0.25+0.15*Math.sin(Date.now()*0.006);
    ctx.fillStyle='#4cc9f0';
    ctx.beginPath();ctx.arc(DOOR.x+17,DOOR.y+26,40,0,6.28);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=doorOpen?'#4cc9f0':'#39406b';
  ctx.fillRect(DOOR.x,DOOR.y,DOOR.w,DOOR.h);
  if(doorOpen){
    ctx.strokeStyle='#aef1ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(DOOR.x+17,DOOR.y+26,10,17,0,0,6.28);ctx.stroke();
  }
  for(i=0;i<crys.length;i++){var c=crys[i];
    if(c.got)continue;
    var tw=0.8+0.25*Math.sin(Date.now()*0.004+i*2);
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Date.now()*0.0015+i);
    ctx.fillStyle='#7bf1d8';
    ctx.beginPath();
    ctx.moveTo(0,-8*tw);ctx.lineTo(6*tw,0);ctx.lineTo(0,8*tw);ctx.lineTo(-6*tw,0);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#8fd3ff';
  ctx.fillRect(px,py,pw,ph);
  ctx.fillStyle='#081226';
  ctx.fillRect(px+pw*0.28,py+7,4,5);
  ctx.fillRect(px+pw*0.62,py+7,4,5);
  for(i=0;i<parts.length;i++){var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2.4);
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font='12px system-ui';ctx.fillStyle='#7f8ab0';ctx.textAlign='left';
  ctx.fillText('白板会碎 · 灰石稳固 · 集齐水晶开门',10,H-8);
}
function bindBtn(id,prop){
  var b=$i(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[prop]=true});
  b.addEventListener('pointerup',function(e){e.preventDefault();keys[prop]=false});
  b.addEventListener('pointercancel',function(){keys[prop]=false});
  b.addEventListener('pointerleave',function(){keys[prop]=false});
}
bindBtn('bL','L');bindBtn('bR','R');bindBtn('bJ','J');
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keys.J=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=false;
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  jHeld=keys.J;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

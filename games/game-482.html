<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移动靶场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#4fc3f7;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px}
.hud{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:14px;color:#c7cbe8;margin-bottom:6px}
.hud b{color:#4fc3f7;font-size:15px}
#msg{min-height:18px;text-align:center;color:#fbbf24;font-size:13px;margin-bottom:6px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#4fc3f7}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#4fc3f7;color:#06283a;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>移动靶场</h1>
  <p class="hint">点击移动的靶子 · 打得越快靶越快 · 45 秒拿 150 分</p>
  <div class="hud">
    <span>得分 <b id="sc">0</b></span>
    <span>时间 <b id="tm">45</b>秒</span>
    <span>连击 <b id="cb">0</b></span>
    <span>目标 <b>150</b></span>
  </div>
  <div id="msg"></div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">移动靶场</h2>
      <p id="ovD">两只靶子在场上左右巡游,时间越久跑得越快。提前量、扣扳机的时机都靠手感:连续命中会累积连击加分,打空则连击清零。45 秒内拿满 150 分算你赢。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btn">开始挑战</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
const $=function(id){return document.getElementById(id);};
const cv=$("cv"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
const ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btn=$("btn");
const elSc=$("sc"),elTm=$("tm"),elCb=$("cb"),elMsg=$("msg");
const GOAL=150,DUR=45,OX=240,OY=545,FLIGHT=0.16;
let state="menu",score=0,timeLeft=DUR,elapsed=0,tp=0,combo=0;
let mouse={x:240,y:260},targets=[],flies=[],pops=[];
function evPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function spawnT(t,fromLeft){
  const dir=fromLeft?1:-1;
  t.x=fromLeft?-40:520;
  t.baseY=110+Math.random()*250;t.y=t.baseY;
  t.vx=dir*(130+elapsed*2.6);
  t.r=34;t.ph=Math.random()*6.28;t.hide=0.35;
}
function resetTargets(){
  targets=[];
  for(let i=0;i<2;i++){const t={};spawnT(t,i===0);t.x=90+Math.random()*300;targets.push(t);}
}
function fire(){
  if(state!=="play")return;
  flies.push({x0:OX,y0:OY,x1:mouse.x,y1:mouse.y,t:0});
}
function burst(x,y,col){
  for(let i=0;i<10;i++){
    const a=Math.random()*6.28,s=60+Math.random()*140;
    pops.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.5,c:col});
  }
}
function resolve(f){
  let hit=null;
  for(let i=0;i<targets.length;i++){
    const t=targets[i];
    if(t.hide>0)continue;
    if(Math.hypot(f.x1-t.x,f.y1-t.y)<t.r+8){hit=t;break;}
  }
  if(hit){
    const gain=10+Math.floor(Math.abs(hit.vx)/30)+combo;
    score+=gain;combo++;
    elMsg.textContent="命中 +"+gain+(combo>1?" · 连击 x"+combo:"");
    burst(hit.x,hit.y,"#ff8a65");
    spawnT(hit,Math.random()<0.5);
  }else{
    combo=0;elMsg.textContent="落空,连击中断";
  }
  elSc.textContent=score;elCb.textContent=combo;
}
function startGame(){
  score=0;timeLeft=DUR;elapsed=0;tp=0;combo=0;
  flies=[];pops=[];resetTargets();
  elMsg.textContent="";elSc.textContent="0";elTm.textContent=DUR;elCb.textContent="0";
  state="play";ov.classList.add("hide");
}
function finish(){
  state="over";
  const win=score>=GOAL;
  ovT.textContent=win?"神臂弓手!":"时间到";
  ovD.textContent=win?"移动靶在你眼里不过慢动作,预判与节奏俱佳。":"移动靶不好对付:瞄它的去向,而不是它现在所在。再试一次。";
  ovS.textContent="得分 "+score+" · 目标 "+GOAL+" 分";
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
btn.addEventListener("click",function(){startGame();});
cv.addEventListener("mousemove",function(e){mouse=evPos(e);});
cv.addEventListener("mousedown",function(e){mouse=evPos(e);fire();});
cv.addEventListener("touchstart",function(e){mouse=evPos(e.touches[0]);fire();e.preventDefault();},{passive:false});
document.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&state!=="play"){e.preventDefault();startGame();}
});
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  tp+=dt;
  if(state==="play"){
    elapsed+=dt;timeLeft-=dt;
    elTm.textContent=Math.max(0,Math.ceil(timeLeft));
    for(let i=0;i<targets.length;i++){
      const tr=targets[i];
      if(tr.hide>0)tr.hide-=dt;
      tr.x+=tr.vx*dt;
      if(tr.x<40&&tr.vx<0)tr.vx=-tr.vx;
      if(tr.x>440&&tr.vx>0)tr.vx=-tr.vx;
      tr.y=tr.baseY+Math.sin(tp*2+tr.ph)*10;
    }
    for(let i=flies.length-1;i>=0;i--){
      const f=flies[i];f.t+=dt/FLIGHT;
      if(f.t>=1){resolve(f);flies.splice(i,1);}
    }
    for(let i=pops.length-1;i>=0;i--){
      const p=pops[i];p.l-=dt;
      if(p.l<=0){pops.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;
    }
    if(timeLeft<=0)finish();
  }
  draw();
}
function drawTarget(t){
  if(t.hide>0)return;
  ctx.save();ctx.translate(t.x,t.y);
  ctx.strokeStyle="rgba(0,0,0,0.35)";ctx.lineWidth=1;
  const cols=["#eceff1","#e53935","#ffc107"];
  const rs=[1,0.62,0.3];
  for(let i=0;i<3;i++){
    ctx.fillStyle=cols[i];
    ctx.beginPath();ctx.arc(0,0,t.r*rs[i],0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle="#263238";ctx.fillRect(-2,-t.r-16,4,10);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#16203a");g.addColorStop(1,"#0e1322");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,0.05)";ctx.lineWidth=1;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,90+i*80);ctx.lineTo(W,90+i*80);ctx.stroke();}
  for(let i=0;i<targets.length;i++)drawTarget(targets[i]);
  for(let i=0;i<pops.length;i++){
    const p=pops[i];
    ctx.globalAlpha=Math.max(0,p.l/0.5);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle="#c8a253";ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(OX,OY,26,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  for(let i=0;i<flies.length;i++){
    const f=flies[i],e=Math.min(1,f.t);
    const px=f.x0+(f.x1-f.x0)*e,py=f.y0+(f.y1-f.y0)*e;
    const ang=Math.atan2(f.y1-f.y0,f.x1-f.x0);
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);
    ctx.strokeStyle="#e0c987";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(0,0);ctx.stroke();
    ctx.restore();
  }
  if(state==="play"){
    ctx.strokeStyle="#4fc3f7";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,12,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(mouse.x-18,mouse.y);ctx.lineTo(mouse.x-6,mouse.y);
    ctx.moveTo(mouse.x+6,mouse.y);ctx.lineTo(mouse.x+18,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-18);ctx.lineTo(mouse.x,mouse.y-6);
    ctx.moveTo(mouse.x,mouse.y+6);ctx.lineTo(mouse.x,mouse.y+18);ctx.stroke();
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

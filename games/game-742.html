<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷宫突袭</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#stage{position:relative}
canvas{display:block;background:#0d1024;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:24px;margin-top:8px;user-select:none;-webkit-user-select:none;align-items:center}
#dpad{display:grid;grid-template-areas:". u ." "l d r";gap:6px}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pbtn.fire{width:84px;height:84px;border-radius:50%;font-size:16px;font-weight:700;background:#5a2a2a;border-color:#8a4444}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>迷宫突袭</h1>
<div id="hud"><span>生命 <b id="hA">3</b></span><span>关卡 <b id="hB">1/3</b></span><span>敌堡 <b id="hC">0</b></span><span>分数 <b id="hD">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>迷宫突袭</h2>
  <p id="ovP">每关是一座随机迷宫,深处藏有敌方堡垒(红色)。<br>沿走廊搜索,炮击堡垒直到摧毁,共 3 关。<br>方向键 / WASD 移动,空格开火;小心巡逻敌坦。</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="pbtn" data-k="ArrowUp" style="grid-area:u">▲</div>
    <div class="pbtn" data-k="ArrowLeft" style="grid-area:l">◀</div>
    <div class="pbtn" data-k="ArrowDown" style="grid-area:d">▼</div>
    <div class="pbtn" data-k="ArrowRight" style="grid-area:r">▶</div>
  </div>
  <div class="pbtn fire" data-k="Space">开火</div>
</div>
<script>
"use strict";
const TS=32,COLS=15,ROWS=13;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hA=document.getElementById('hA'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD');
let grid,score,hp,level,forts,guards,bullets,parts,floats,arrow,player,frame=0,state='start',banner,bannerT;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function genMaze(){
  grid=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push(2);grid.push(r);}
  const st=[[1,1]];grid[1][1]=0;
  while(st.length){
    const cur=st[st.length-1];
    const opts=[];
    const cands=[[2,0],[-2,0],[0,2],[0,-2]];
    for(const d of cands){
      const nx=cur[0]+d[0],ny=cur[1]+d[1];
      if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&grid[ny][nx]===2)opts.push(d);
    }
    if(!opts.length){st.pop();continue;}
    const d=opts[Math.floor(Math.random()*opts.length)];
    grid[cur[1]+d[1]/2][cur[0]+d[0]/2]=0;
    grid[cur[1]+d[1]][cur[0]+d[0]]=0;
    st.push([cur[0]+d[0],cur[1]+d[1]]);
  }
  for(let i=0;i<8;i++){
    const x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
    if(grid[y][x]===2){
      if(grid[y][x-1]===0&&grid[y][x+1]===0)grid[y][x]=0;
      else if(grid[y-1]&&grid[y+1]&&grid[y-1][x]===0&&grid[y+1][x]===0)grid[y][x]=0;
    }
  }
}
function bfsDist(sx,sy){
  const dist=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push(-1);dist.push(r);}
  dist[sy][sx]=0;const q=[[sx,sy]];
  for(let qi=0;qi<q.length;qi++){
    const c=q[qi];
    for(const d of DIRS){
      const nx=c[0]+d[0],ny=c[1]+d[1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]!==0||dist[ny][nx]>=0)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;q.push([nx,ny]);
    }
  }
  return dist;
}
function mkGuard(x,y){
  return {x:x,y:y,dir:2,cd:50+Math.random()*50,think:20,spd:1.1};
}
function buildLevel(){
  genMaze();
  const dist=bfsDist(1,1);
  const ends=[];
  for(let y=1;y<ROWS;y+=1)for(let x=1;x<COLS;x+=1){
    if(grid[y][x]!==0||dist[y][x]<0)continue;
    let open=0;
    for(const d of DIRS){const nx=x+d[0],ny=y+d[1];if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&grid[ny][nx]===0)open++;}
    if(open<=1&&dist[y][x]>6)ends.push([x,y,dist[y][x]]);
  }
  ends.sort((a,b)=>b[2]-a[2]);
  const nf=level+1;
  forts=[];
  for(const e of ends){
    if(forts.length>=nf)break;
    let ok=true;
    for(const f of forts){if(Math.abs(f.cx-e[0])+Math.abs(f.cy-e[1])<6)ok=false;}
    if(ok)forts.push({cx:e[0],cy:e[1],hp:3});
  }
  let gi=0;
  while(forts.length<nf){
    const x=1+2*Math.floor(Math.random()*7),y=1+2*Math.floor(Math.random()*6);
    if(grid[y]&&grid[y][x]===0&&!forts.some(f=>f.cx===x&&f.cy===y)){forts.push({cx:x,cy:y,hp:3});}
  }
  for(const f of forts)grid[f.cy][f.cx]=4;
  guards=[];
  const gcount=2+level;
  let tries=0;
  while(guards.length<gcount&&tries<400){
    tries++;
    const x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
    if(grid[y][x]!==0||dist[y][x]<5)continue;
    let ok=true;
    for(const g of guards){if(Math.abs(g.x/TS-x)<3&&Math.abs(g.y/TS-y)<3)ok=false;}
    if(ok)guards.push(mkGuard(x*TS+2,y*TS+2));
  }
  player={x:TS+2,y:TS+2,dir:1,cd:0,inv:60};
  bullets=[];parts=[];floats=[];
  banner='第 '+level+' 关 · 摧毁 '+nf+' 座敌堡';bannerT=110;
  updateCompass();
}
function updateCompass(){
  let best=null,bd=1e9;
  for(const f of forts){
    const d=Math.abs(f.cx*TS-player.x)+Math.abs(f.cy*TS-player.y);
    if(d<bd){bd=d;best=f;}
  }
  arrow=best;
}
function rectVsGrid(x,y){
  if(x<0||y<0||x+28>cv.width||y+28>cv.height)return true;
  const x0=Math.floor(x/TS),y0=Math.floor(y/TS),x1=Math.floor((x+27)/TS),y1=Math.floor((y+27)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(grid[ty][tx]!==0)return true;}
  return false;
}
function moveTank(t,d){
  if(t.dir!==d){
    if(t.dir%2!==d%2){
      if(d%2===0)t.x=Math.round((t.x-2)/TS)*TS+2;else t.y=Math.round((t.y-2)/TS)*TS+2;
    }
    t.dir=d;
  }
  const v=DIRS[d],nx=t.x+v[0]*t.spd,ny=t.y+v[1]*t.spd;
  if(!rectVsGrid(nx,ny)){t.x=nx;t.y=ny;return true;}
  return false;
}
function fire(t,from){
  const v=DIRS[t.dir];
  bullets.push({x:t.x+14+v[0]*17-3,y:t.y+14+v[1]*17-3,vx:v[0]*5.5,vy:v[1]*5.5,from:from,life:200});
}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20+Math.random()*14,max:34,c:c||'#ffb050'});}
function floatTxt(x,y,txt){floats.push({x:x,y:y,txt:txt,life:40});}
function los(c0,r0,c1,r1){
  let x0=c0,y0=r0;
  const dx=Math.abs(c1-c0),dy=Math.abs(r1-r0),sx=c0<c1?1:-1,sy=r0<r1?1:-1,err=dx-dy;
  while(!(x0===c1&&y0===r1)){
    const e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
    if(x0===c1&&y0===r1)break;
    if(grid[y0][x0]!==0)return false;
  }
  return true;
}
function initGame(){
  score=0;hp=3;level=1;frame=0;
  buildLevel();
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function updPlayer(){
  let d=-1;
  if(keys.ArrowUp||keys.KeyW)d=0;else if(keys.ArrowRight||keys.KeyD)d=1;
  else if(keys.ArrowDown||keys.KeyS)d=2;else if(keys.ArrowLeft||keys.KeyA)d=3;
  if(d>=0)moveTank(player,d);
  if(player.inv>0)player.inv--;
  player.cd--;
  if((keys.Space||keys.KeyJ)&&player.cd<=0){
    let n=0;for(const b of bullets)if(b.from==='p')n++;
    if(n<2){fire(player,'p');player.cd=20;}
  }
}
function updGuards(){
  for(const g of guards){
    g.think--;g.cd--;
    const moved=moveTank(g,g.dir);
    if(!moved||g.think<=0){
      const opts=[];
      for(let d=0;d<4;d++){
        const v=DIRS[d],nx=g.x+v[0]*TS,ny=g.y+v[1]*TS;
        if(!rectVsGrid(nx,ny))opts.push(d);
      }
      if(opts.length){
        let d=opts[Math.floor(Math.random()*opts.length)];
        if(moved&&opts.indexOf(g.dir)>=0&&Math.random()<0.6)d=g.dir;
        g.dir=d;
      }
      g.think=25+Math.random()*40;
    }
    if(g.cd<=0&&player){
      const gc=Math.floor((g.x+14)/TS),gr=Math.floor((g.y+14)/TS);
      const pc=Math.floor((player.x+14)/TS),pr=Math.floor((player.y+14)/TS);
      const pd=Math.abs(g.x-player.x)+Math.abs(g.y-player.y);
      if(pd<300&&los(gc,gr,pc,pr)){
        g.dir=Math.abs(g.x-player.x)>Math.abs(g.y-player.y)?(player.x>g.x?1:3):(player.y>g.y?2:0);
        fire(g,'e');g.cd=80+Math.random()*50;
      }
    }
  }
}
function end(win,msg){
  state=win?'win':'over';
  ov.children[0].textContent=win?'凯旋而归!':'游戏结束';
  ovP.innerHTML=msg+'<br>最终得分:'+score;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function updBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let dead=false;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0)dead=true;
    if(b.x<0||b.y<0||b.x+6>cv.width||b.y+6>cv.height)dead=true;
    if(!dead){
      const tx=Math.floor((b.x+3)/TS),ty=Math.floor((b.y+3)/TS);
      if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){
        const t=grid[ty][tx];
        if(t===2)dead=true;
        else if(t===4){
          dead=true;
          for(const f of forts){
            if(f.cx===tx&&f.cy===ty){
              f.hp--;boom(b.x+3,b.y+3,5,'#ff7a6a');
              if(f.hp<=0){
                grid[ty][tx]=0;
                score+=500;floatTxt(tx*TS,ty*TS,'+500');
                boom(tx*TS+16,ty*TS+16,20,'#ff9d6a');
                updateCompass();
              }
              break;
            }
          }
        }
      }
    }
    if(!dead){
      if(b.from==='e'){
        if(player.inv<=0&&Math.abs(b.x+3-(player.x+14))<16&&Math.abs(b.y+3-(player.y+14))<16){
          dead=true;hp--;boom(player.x+14,player.y+14,12,'#7fe08a');
          if(hp<=0){end(false,'座车被击毁,突袭失败!');}
          else player.inv=120;
        }
      }else{
        for(const g of guards){
          if(Math.abs(b.x+3-(g.x+14))<16&&Math.abs(b.y+3-(g.y+14))<16){
            dead=true;guards.splice(guards.indexOf(g),1);
            score+=150;floatTxt(g.x,g.y,'+150');
            boom(g.x+14,g.y+14,12,'#ffb050');
            break;
          }
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
function checkLevel(){
  if(forts.length===0&&state==='play'){
    if(level>=3){end(true,'三座迷宫全部肃清!');return;}
    level++;score+=300;
    buildLevel();
  }
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=0.6;f.life--;if(f.life<=0)floats.splice(i,1);}
  if(bannerT>0)bannerT--;
}
function updHud(){
  hA.textContent=hp;hB.textContent=level+'/3';
  hC.textContent=forts.length;hD.textContent=score;
}
function drawTile(t,X,Y){
  if(t===2){
    ctx.fillStyle='#3c4468';ctx.fillRect(X,Y,TS,TS);
    ctx.fillStyle='#4d5680';ctx.fillRect(X+1,Y+1,TS-2,TS-2);
    ctx.fillStyle='#333a5c';ctx.fillRect(X+3,Y+3,TS-6,TS-6);
  }else if(t===4){
    const f=forts.find(q=>q.cx===X/TS&&q.cy===Y/TS);
    ctx.fillStyle='#5a2020';ctx.fillRect(X,Y,TS,TS);
    ctx.fillStyle='#b04a3a';ctx.fillRect(X+3,Y+3,TS-6,TS-6);
    ctx.fillStyle='#ffd0a0';
    ctx.fillRect(X+8,Y+10,16,4);ctx.fillRect(X+14,Y+6,4,20);
    if(f&&f.hp<3){
      ctx.fillStyle='#1a1010';ctx.fillRect(X+2,Y+2,4,4*(3-f.hp));
    }
  }
}
function drawTank(t,isP){
  if(!t)return;
  if(isP&&t.inv>0&&frame%6<3)return;
  const cs=isP?'#5fbf68':'#c07070';
  const x=t.x,y=t.y;
  ctx.fillStyle='#141830';ctx.fillRect(x,y,28,28);
  ctx.fillStyle=cs;ctx.fillRect(x+4,y+4,20,20);
  const c=x+14;
  ctx.fillStyle='#0e1122';
  if(t.dir===0)ctx.fillRect(c-2,y,4,14);
  else if(t.dir===1)ctx.fillRect(c,y+12,14,4);
  else if(t.dir===2)ctx.fillRect(c-2,y+14,4,14);
  else ctx.fillRect(x,y+12,14,4);
  ctx.fillStyle=cs;ctx.fillRect(x+9,y+9,10,10);
}
function draw(){
  ctx.fillStyle='#0d1024';ctx.fillRect(0,0,cv.width,cv.height);
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    if(grid[ty][tx]!==0)drawTile(grid[ty][tx],tx*TS,ty*TS);
  }
  for(const g of guards)drawTank(g,false);
  drawTank(player,true);
  for(const b of bullets){
    ctx.fillStyle=b.from==='p'?'#ffe9a0':'#ff9d6a';
    ctx.fillRect(b.x,b.y,6,6);
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(p.life/p.max,0);
    ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(arrow){
    const ax=arrow.cx*TS+16-player.x-14,ay=arrow.cy*TS+16-player.y-14;
    const d=Math.hypot(ax,ay);
    if(d>90){
      const ux=ax/d,uy=ay/d;
      const px=player.x+14+ux*40,py=player.y+14+uy*40;
      ctx.fillStyle='rgba(255,215,106,0.8)';
      ctx.beginPath();
      ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.font='bold 13px system-ui';ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=Math.min(f.life/20,1);
    ctx.fillStyle='#ffd76a';ctx.fillText(f.txt,f.x+10,f.y);
  }
  ctx.globalAlpha=1;
  if(bannerT>0&&banner){
    ctx.globalAlpha=Math.min(bannerT/40,1);
    ctx.fillStyle='#ffd76a';ctx.font='bold 24px system-ui';
    ctx.fillText(banner,cv.width/2,cv.height/2-10);
    ctx.globalAlpha=1;
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){
    frame++;
    updPlayer();updGuards();updBullets();checkLevel();updParts();updHud();
  }
  draw();
}
initGame();
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上升气流</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#2dd4bf;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#2dd4bf;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#2dd4bf}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#2dd4bf;color:#042e28;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>上升气流</h1>
  <p class="hint">按住 空格/画面 展开滑翔翼,在青色气流柱里会被托升 · ←/→ 或拖动微调位置 · 撞上浮岩或跌出画面即失败,飞得越高分越高</p>
  <div class="hud">
    <span>高度 <b id="score">0</b> 米</span>
    <span>最佳 <b id="best">0</b> 米</span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="360"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">上升气流</h2>
      <p id="ovDesc">峡谷底部热气翻腾,只有气流柱能把你托向高空!找对气流、躲开浮岩,看你能飞到多少米——掉出画面就完啦。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d"),W=480,H=360;
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elScore=$("score"),elBest=$("best");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s437");
var state="menu",cols,rocks,px,py,vy,held,camY,nextY,maxAlt,moveL,moveR,targetX,t,startY;
function rr(x,y,w,h,r){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function reset(){
  cols=[];rocks=[];px=200;py=-30;vy=0;held=false;camY=-190;nextY=-160;
  maxAlt=0;moveL=false;moveR=false;targetX=-1;t=0;startY=-30;
  genWorld();
  elBest.textContent=best;
}
function genWorld(){
  while(nextY>camY-120){
    var drift=cols.length>5;
    cols.push({bx:30+Math.random()*(W-180),y:nextY,w:92,h:240,ph:Math.random()*6,drift:drift});
    if(Math.random()<0.6){
      var rr2=12+Math.random()*9;
      rocks.push({x:30+Math.random()*(W-70),y:nextY+70+Math.random()*110,r:rr2,ph:Math.random()*6});
    }
    nextY-=170+Math.random()*85;
  }
}
function colX(c){
  if(!c.drift)return c.bx;
  return c.bx+Math.sin(t*0.7+c.ph)*Math.min(52,maxAlt*0.06);
}
function updateHud(){
  elScore.textContent=maxAlt;
}
function gameOver(msg){
  state="over";
  if(maxAlt>best){best=maxAlt;saveBest("mg_s437",best);elBest.textContent=best;}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="飞行高度 "+maxAlt+" 米 · 最佳 "+best+" 米";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleHit(cx,cy,r,b){
  var nx=Math.max(b.x,Math.min(cx,b.x+b.w));
  var ny=Math.max(b.y,Math.min(cy,b.y+b.h));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var s=dt/1000,i;
  t+=s;
  if(moveL)vxAdd(-1);
  else if(moveR)vxAdd(1);
  else if(targetX>=0){
    var diff=targetX-px;
    px+=Math.max(-260*s,Math.min(260*s,diff*6*s));
  }
  function vxAdd(d){px+=d*250*s;}
  if(px<6){px=6;}
  if(px>W-34){px=W-34;}
  var inCol=false;
  for(i=0;i<cols.length;i++){
    var c=cols[i],cx2=colX(c);
    if(px+13>cx2&&px+13<cx2+c.w&&py+15>c.y&&py+15<c.y+c.h){inCol=true;break;}
  }
  if(held&&inCol)vy-=1080*s;
  vy+=380*s;
  if(vy<-260)vy=-260;if(vy>330)vy=330;
  py+=vy*s;
  camY=Math.min(camY,py-160);
  var alt=Math.max(0,Math.floor((startY-py)/10));
  if(alt>maxAlt)maxAlt=alt;
  for(i=rocks.length-1;i>=0;i--){
    var r=rocks[i];
    r.x+=Math.sin(t*1.3+r.ph)*14*s;
    if(r.y>camY+H+60){rocks.splice(i,1);continue;}
    if(circleHit(r.x,r.y,r.r-2,{x:px+3,y:py+3,w:20,h:24})){gameOver("撞上了浮岩——气流里也要看路!");return;}
  }
  for(i=cols.length-1;i>=0;i--){
    if(cols[i].y>camY+H+80)cols.splice(i,1);
  }
  genWorld();
  if(py-camY>H+50){gameOver("跌出了气流层,坠入深谷……");return;}
  updateHud();
}
function draw(){
  var i,c,cx2,grd,alt=maxAlt;
  grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#0c1522");grd.addColorStop(1,"#14232e");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"rgba(45,212,191,"+Math.min(0.14,alt*0.0004)+")");
  grd.addColorStop(1,"rgba(45,212,191,0)");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  for(i=0;i<cols.length;i++){
    c=cols[i];cx2=colX(c);
    var sy=c.y-camY;
    if(sy>H+40||sy+c.h<-40)continue;
    grd=ctx.createLinearGradient(0,sy,0,sy+c.h);
    grd.addColorStop(0,"rgba(45,212,191,.03)");
    grd.addColorStop(0.5,"rgba(45,212,191,.14)");
    grd.addColorStop(1,"rgba(45,212,191,.03)");
    ctx.fillStyle=grd;
    ctx.fillRect(cx2,sy,c.w,c.h);
    ctx.strokeStyle="rgba(45,212,191,.35)";
    ctx.beginPath();ctx.moveTo(cx2,sy);ctx.lineTo(cx2,sy+c.h);
    ctx.moveTo(cx2+c.w,sy);ctx.lineTo(cx2+c.w,sy+c.h);ctx.stroke();
    ctx.fillStyle="rgba(153,246,228,.5)";
    var off=(t*150)%44;
    for(var k=0;k<6;k++){
      var ay=sy+c.h-((k*44+off)%c.h);
      ctx.beginPath();
      ctx.moveTo(cx2+10,ay);ctx.lineTo(cx2+c.w/2,ay-9);ctx.lineTo(cx2+c.w-10,ay);
      ctx.fill();
    }
  }
  for(i=0;i<rocks.length;i++){
    var r=rocks[i],rsy=r.y-camY;
    if(rsy<-40||rsy>H+40)continue;
    ctx.fillStyle="#3d4657";
    ctx.beginPath();
    ctx.moveTo(r.x-r.r,rsy);
    ctx.lineTo(r.x-r.r*0.5,rsy-r.r*0.85);
    ctx.lineTo(r.x+r.r*0.6,rsy-r.r);
    ctx.lineTo(r.x+r.r,rsy-r.r*0.2);
    ctx.lineTo(r.x+r.r*0.4,rsy+r.r*0.9);
    ctx.lineTo(r.x-r.r*0.6,rsy+r.r*0.7);
    ctx.fill();
    ctx.fillStyle="#2b3240";
    ctx.beginPath();ctx.arc(r.x-r.r*0.2,rsy+2,r.r*0.4,0,Math.PI*2);ctx.fill();
  }
  var psy=py-camY;
  var tilt=Math.max(-0.4,Math.min(0.4,vy*0.0012));
  ctx.save();
  ctx.translate(px+13,psy+15);
  ctx.rotate(tilt);
  ctx.fillStyle="rgba(153,246,228,.85)";
  ctx.beginPath();ctx.moveTo(-4,-2);ctx.lineTo(-26,-8);ctx.lineTo(-4,4);ctx.fill();
  ctx.beginPath();ctx.moveTo(4,-2);ctx.lineTo(26,-8);ctx.lineTo(4,4);ctx.fill();
  ctx.fillStyle="#2dd4bf";
  rr(-10,-8,20,22,8);ctx.fill();
  ctx.fillStyle="#042e28";
  ctx.beginPath();ctx.arc(-4,-1,2.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-1,2.4,0,Math.PI*2);ctx.fill();
  if(held){
    ctx.strokeStyle="rgba(153,246,228,.6)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(0,26+Math.random()*6);ctx.stroke();
    ctx.lineWidth=1;
  }
  ctx.restore();
}
var lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT)lastT=ts;
  var dt=Math.min(50,ts-lastT);lastT=ts;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k===" "||k==="ArrowLeft"||k==="ArrowRight")e.preventDefault();
  if(state!=="playing"){if(k===" "||k==="Enter")startGame();return;}
  if(k===" "||k==="ArrowUp"||k==="w"||k==="W")held=true;
  if(k==="ArrowLeft"||k==="a"||k==="A")moveL=true;
  if(k==="ArrowRight"||k==="d"||k==="D")moveR=true;
});
document.addEventListener("keyup",function(e){
  var k=e.key;
  if(k===" "||k==="ArrowUp"||k==="w"||k==="W")held=false;
  if(k==="ArrowLeft"||k==="a"||k==="A")moveL=false;
  if(k==="ArrowRight"||k==="d"||k==="D")moveR=false;
});
cv.addEventListener("touchstart",function(e){
  e.preventDefault();held=true;
  var t2=e.changedTouches[0],rect=cv.getBoundingClientRect();
  targetX=(t2.clientX-rect.left)/rect.width*W-13;
},{passive:false});
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  var t2=e.changedTouches[0],rect=cv.getBoundingClientRect();
  targetX=(t2.clientX-rect.left)/rect.width*W-13;
},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();held=false;targetX=-1;},{passive:false});
cv.addEventListener("mousedown",function(){held=true;});
document.addEventListener("mouseup",function(){held=false;});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

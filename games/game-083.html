<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火力全开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#7ee787;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#7ee787;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#7ee787;color:#0a2210;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#7ee787;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>火力全开</h1>
<p class="tip">←→/AD 或按住拖动移动,空格 / 按住屏幕开火。接住敌机掉落的「P」能量舱升级火力,中弹会降一级,拿到三级火力并拿到 800 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">火力全开</h2>
<p id="ovX">击坠敌机回收 P 能量舱:单发 → 双发 → 三向散射。被击中会损失一级火力,保持火力才能碾碎敌群。</p>
<button id="btn">开始游戏</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>火力<b id="hP">1</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hP=document.getElementById("hP"),hH=document.getElementById("hH");
var GOAL=800,PN=["单发","双发","三向散射"];
var state="ready",score=0,hp=3,power=1,inv=0,cool=0,spawn=1,t=0;
var ship={x:W/2,y:H-80};
var bullets=[],ebullets=[],enemies=[],drops=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*24+8});}
function reset(){
  score=0;hp=3;power=1;inv=0;cool=0;spawn=0.5;t=0;
  ship.x=W/2;ship.y=H-80;
  bullets=[];ebullets=[];enemies=[];drops=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"火力全开!":"战机坠毁";
  ovX.textContent="最终得分:"+score+(win?" · 敌群在你的炮火下溃散。":" · 记得多接 P 能量舱提升火力。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function fire(){
  if(power===1){
    bullets.push({x:ship.x,y:ship.y-18,vx:0,vy:-540});
  }else if(power===2){
    bullets.push({x:ship.x-8,y:ship.y-14,vx:0,vy:-540});
    bullets.push({x:ship.x+8,y:ship.y-14,vx:0,vy:-540});
  }else{
    bullets.push({x:ship.x,y:ship.y-18,vx:0,vy:-560});
    bullets.push({x:ship.x-10,y:ship.y-10,vx:-160,vy:-500});
    bullets.push({x:ship.x+10,y:ship.y-10,vx:160,vy:-500});
  }
}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;spawn-=dt;
  var sp=280;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.5,Math.min(H-40,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0){cool=0.18;fire();}
  if(spawn<=0){
    spawn=Math.max(0.5,1.3-score*0.0006);
    if(Math.random()<0.22){
      enemies.push({x:40+Math.random()*(W-80),y:-30,hp:3,vy:60,ph:Math.random()*6.283,heavy:true});
    }else{
      enemies.push({x:40+Math.random()*(W-80),y:-30,hp:1,vy:130+Math.random()*60,ph:Math.random()*6.283,heavy:false});
    }
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    var b=bullets[bi];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.x<-10||b.x>W+10)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.vy*dt;
    e.x+=Math.sin(t*3+e.ph)*40*dt;
    if(e.y>H+30){enemies.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<24&&Math.abs(e.y-ship.y)<24){
      enemies.splice(i,1);boom(e.x,e.y,12,"#ff6b6b");
      hp--;inv=1.3;power=Math.max(1,power-1);continue;
    }
  }
  for(i=ebullets.length-1;i>=0;i--){
    var eb=ebullets[i];
    eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;
    if(eb.x<-10||eb.x>W+10||eb.y>H+10)ebullets.splice(i,1);
    else if(inv<=0&&Math.abs(eb.x-ship.x)<12&&Math.abs(eb.y-ship.y)<14){
      ebullets.splice(i,1);hp--;inv=1.3;power=Math.max(1,power-1);
      boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      if(Math.abs(bl.x-e2.x)<(e2.heavy?26:20)&&Math.abs(bl.y-e2.y)<(e2.heavy?26:20)){
        bullets.splice(bi,1);
        e2.hp--;
        if(e2.hp<=0){
          boom(e2.x,e2.y,12,e2.heavy?"#ffd166":"#7ee787");
          score+=e2.heavy?40:15;
          if(Math.random()<0.2)drops.push({x:e2.x,y:e2.y,vy:120});
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=drops.length-1;i>=0;i--){
    var d=drops[i];
    d.y+=d.vy*dt;
    if(d.y>H+20){drops.splice(i,1);continue;}
    if(Math.abs(d.x-ship.x)<26&&Math.abs(d.y-ship.y)<30){
      drops.splice(i,1);
      if(power<3){power++;boom(ship.x,ship.y,10,"#7ee787");}
      else score+=50;
    }
  }
  if(enemies.length&&Math.random()<dt*0.7){
    var e3=enemies[Math.floor(Math.random()*enemies.length)];
    var dx=ship.x-e3.x,dy=ship.y-e3.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
    ebullets.push({x:e3.x,y:e3.y+14,vx:dx/dd*170,vy:dy/dd*170});
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(score>=GOAL)gameOver(true);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#7ee787";
  for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-2,bullets[i].y-10,4,14);
  ctx.fillStyle="#ff9f43";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    if(e.heavy){
      ctx.fillStyle="#c0456c";
      ctx.fillRect(-18,-14,36,28);
      ctx.fillStyle="#ffd166";ctx.fillRect(-8,-6,16,12);
    }else{
      ctx.fillStyle="#ff6b6b";
      ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(-14,-10);ctx.lineTo(14,-10);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  for(i=0;i<drops.length;i++){
    var d=drops[i];
    ctx.fillStyle="#7ee787";
    ctx.beginPath();ctx.arc(d.x,d.y,11,0,6.283);ctx.fill();
    ctx.fillStyle="#0a2210";ctx.font="bold 13px system-ui";ctx.textAlign="center";
    ctx.fillText("P",d.x,d.y+5);
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#7ee787";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;hP.textContent=power===3?PN[2]:PN[power-1];hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

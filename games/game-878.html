<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去而复返</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px}
h1{text-align:center;font-size:21px;margin:4px 0}
.tip{text-align:center;color:#8f97c0;font-size:12.5px;line-height:1.6;margin-bottom:8px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:8px}
.hud b{color:#fbbf24}
canvas{display:block;width:100%;max-width:420px;margin:0 auto;background:#181d33;border:1px solid #262d52;border-radius:12px}
.pad{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.pbtn{width:60px;height:42px;border:none;border-radius:10px;background:#2a3157;color:#e8eaf6;font-size:18px;font-family:inherit;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pbtn:active{background:#4f6ef7}
.btnrow{display:flex;justify-content:center;gap:10px;margin-top:8px}
.btn{background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:24px 30px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:8px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>去而复返</h1>
<p class="tip">方向键 / WASD 或下方按钮跳跃。单程不算赢:先踩浮木渡河、穿公路摸到对岸小旗,拿到旗的那一刻"返程高峰"立刻开始——车流和河水全部提速五成,你必须原路活着回来才算得分!</p>
<div class="hud"><span>得分 <b id="sS">0</b></span><span>生命 <b id="sL">3</b></span><span>阶段 <b id="sP">去程</b></span></div>
<canvas id="cv" width="420" height="560"></canvas>
<div class="pad">
<button class="pbtn" data-k="left">←</button><button class="pbtn" data-k="up">↑</button><button class="pbtn" data-k="down">↓</button><button class="pbtn" data-k="right">→</button>
</div>
<div class="btnrow"><button class="btn" id="bR">重新开始</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn" id="ovB">开始游戏</button></div></div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var CELL=40,COLS=10,ROWS=14;
var sS=document.getElementById("sS"),sL=document.getElementById("sL"),sP=document.getElementById("sP");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovB=document.getElementById("ovB");
var CAR_COLORS=["#e05656","#e8a33d","#3fa66a","#4f8ef7","#b06ee0","#d05fa2","#4bb8c9"];
var lanes,logs,frog,score,lives,round,phase,flagC,deadT,state,gt=0;
function rnd(a,b){return a+Math.random()*(b-a);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeLane(r){
  var dir=(r%2===1)?1:-1,speed=rnd(52,95),cars=[],x0=rnd(0,420),i;
  for(i=0;i<3;i++)cars.push({x:(x0+i*165+rnd(-30,30)+420)%420,w:rnd(46,74),c:CAR_COLORS[(r+i)%CAR_COLORS.length]});
  return{r:r,dir:dir,base:speed,cars:cars};
}
function makeLogRow(r){
  var dir=(r%2===0)?1:-1,ls=[],x0=rnd(0,420),i;
  for(i=0;i<3;i++)ls.push({p:(x0+i*150+rnd(-24,24)+420)%420,w:rnd(100,140)});
  return{r:r,dir:dir,base:rnd(34,62),logs:ls};
}
function buildWorld(){
  lanes=[];logs=[];var r;
  for(r=1;r<=4;r++)logs.push(makeLogRow(r));
  for(r=6;r<=10;r++)lanes.push(makeLane(r));
}
function speedMul(){return phase===2?1.5:1;}
function resetFrog(){
  if(phase===2){frog={x:5.5*CELL,r:0,y:0};}
  else{frog={x:5.5*CELL,r:13,y:13*CELL};}
}
function updHud(){sS.textContent=score;sL.textContent=lives;sP.textContent=phase===2?"返程":"去程";}
function reset(){score=0;lives=3;round=1;phase=1;flagC=2+Math.floor(rnd(0,6));deadT=0;buildWorld();resetFrog();updHud();}
function show(t,p,btn){ovT.textContent=t;ovP.textContent=p;ovB.textContent=btn||"再来一局";ov.classList.remove("hide");}
function start(){reset();state="play";ov.classList.add("hide");}
function die(msg){
  deadT=0.8;lives--;updHud();
  if(lives<=0){state="over";show("游戏结束",""+msg+" 最终得分 "+score+",完成到第 "+round+" 轮。");}
}
function logUnder(){
  var i,ln,lg,k;
  for(i=0;i<logs.length;i++){
    ln=logs[i];
    if(ln.r!==frog.r)continue;
    for(k=0;k<ln.logs.length;k++){
      lg=ln.logs[k];
      if(frog.x>lg.p-12&&frog.x<lg.p+lg.w+12)return lg;
    }
  }
  return null;
}
function arrive(){
  if(frog.r===0&&phase===1){
    if(Math.abs(frog.x-(flagC+0.5)*CELL)<26){
      phase=2;score+=150;updHud();
    }
  }else if(frog.r>=11&&phase===2){
    phase=1;score+=250+round*40;round++;
    flagC=2+Math.floor(rnd(0,6));
    buildWorld();resetFrog();updHud();
  }
}
function doHop(d){
  if(state!=="play"||deadT>0)return;
  var r=frog.r,x=frog.x;
  if(d==="left")x-=CELL;else if(d==="right")x+=CELL;
  else if(d==="up")r--;else r++;
  x=Math.max(20,Math.min(400,x));r=Math.max(0,Math.min(ROWS-1,r));
  frog.x=x;frog.r=r;
  arrive();
}
function update(dt){
  var i,j,k,ln,mul;
  if(state!=="play")return;
  if(deadT>0){deadT-=dt;if(deadT<=0)resetFrog();return;}
  mul=speedMul();
  for(i=0;i<logs.length;i++){
    ln=logs[i];
    for(k=0;k<ln.logs.length;k++){
      var lg=ln.logs[k];
      lg.p+=ln.dir*ln.base*mul*dt;
      if(ln.dir>0&&lg.p>420)lg.p=-lg.w;
      if(ln.dir<0&&lg.p<-lg.w)lg.p=420;
    }
  }
  for(i=0;i<lanes.length;i++){
    ln=lanes[i];
    for(j=0;j<ln.cars.length;j++){
      var car=ln.cars[j];
      car.x=(car.x+ln.dir*ln.base*mul*dt+420)%420;
      var cx=car.x-20,cy=ln.r*CELL;
      if(Math.abs(cx+car.w/2-frog.x)<car.w/2+11&&frog.y+34>cy+4&&frog.y+8<cy+36){die("被车撞了!");return;}
    }
  }
  if(frog.r>=1&&frog.r<=4){
    var lg=logUnder();
    if(!lg){die("扑通!掉进了河里。");return;}
    var lv=0,m2;
    for(m2=0;m2<logs.length;m2++)if(logs[m2].r===frog.r)lv=logs[m2].dir*logs[m2].base*mul;
    frog.x+=lv*dt;
    if(frog.x<8||frog.x>412){die("被河水冲走了!");return;}
  }
}
function draw(){
  var r,i,j,k,ln,fx,fy;
  for(r=0;r<ROWS;r++){
    if(r===0)ctx.fillStyle="#2a4a6b";
    else if(r<=4)ctx.fillStyle="#1d3d5c";
    else if(r===5)ctx.fillStyle="#31435c";
    else if(r>=11)ctx.fillStyle="#1e3b26";
    else ctx.fillStyle="#232741";
    ctx.fillRect(0,r*CELL,420,CELL);
  }
  ctx.fillStyle="#e8eaf6";ctx.font="11px system-ui";ctx.textAlign="center";
  ctx.fillText(phase===2?"返程高峰!活着回到南岸":"对岸 · 摸到小旗立刻返程",210,24);
  var fx2=(flagC+0.5)*CELL;
  ctx.strokeStyle="#cfd8ff";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(fx2,10);ctx.lineTo(fx2,34);ctx.stroke();
  ctx.fillStyle=phase===1?"#ffd668":"#7a85a8";
  ctx.beginPath();ctx.moveTo(fx2,10);ctx.lineTo(fx2+16,16);ctx.lineTo(fx2,22);ctx.closePath();ctx.fill();
  for(i=0;i<logs.length;i++){
    ln=logs[i];
    for(k=0;k<ln.logs.length;k++){
      var lg=ln.logs[k],lx=lg.p;
      if(lx>420||lx+lg.w<0)continue;
      ctx.fillStyle="#8a6238";rr(lx,ln.r*CELL+9,lg.w,22,10);ctx.fill();
      ctx.strokeStyle="#6b4b2a";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(lx+10,ln.r*CELL+20);ctx.lineTo(lx+lg.w-10,ln.r*CELL+20);ctx.stroke();
    }
  }
  for(i=0;i<lanes.length;i++){
    ln=lanes[i];var cy=ln.r*CELL;
    for(j=0;j<ln.cars.length;j++){
      var car=ln.cars[j],cx=car.x-20;
      if(cx>420||cx+car.w<0)continue;
      ctx.fillStyle=car.c;rr(cx+2,cy+6,car.w-4,28,7);ctx.fill();
      ctx.fillStyle="rgba(20,24,48,.55)";rr(cx+car.w/2-7,cy+11,14,8,3);ctx.fill();
    }
  }
  if(deadT<=0||Math.floor(gt*12)%2===0){
    fx=frog.x;fy=frog.r*CELL;
    ctx.fillStyle="#5ad469";
    ctx.beginPath();ctx.ellipse(fx,fy+22,12,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#2f7d3f";
    ctx.beginPath();ctx.arc(fx-6,fy+11,5,0,Math.PI*2);ctx.arc(fx+6,fy+11,5,0,Math.PI*2);ctx.fill();
  }
  if(phase===2){
    ctx.fillStyle="rgba(255,82,82,.9)";ctx.font="bold 13px system-ui";ctx.textAlign="left";
    ctx.fillText("返程高峰 ×1.5",10,565-14);
  }
  if(state==="ready"){
    ctx.fillStyle="rgba(7,9,22,.6)";ctx.fillRect(0,200,420,120);
    ctx.fillStyle="#e8eaf6";ctx.font="bold 21px system-ui";ctx.textAlign="center";
    ctx.fillText("点击「开始游戏」出发",210,250);
    ctx.font="13px system-ui";ctx.fillStyle="#aab2dd";
    ctx.fillText("拿到小旗后全场景提速,活着回来才算赢",210,280);
  }
}
var last=0;
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  if(!(dt>0))dt=0.016;
  gt+=dt;update(dt);draw();
  requestAnimationFrame(loop);
}
var KM={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
window.addEventListener("keydown",function(e){var k=KM[e.key];if(k){e.preventDefault();doHop(k);}});
var btns=document.querySelectorAll(".pbtn"),bi;
for(bi=0;bi<btns.length;bi++){
  (function(b){b.addEventListener("pointerdown",function(e){e.preventDefault();doHop(b.getAttribute("data-k"));});})(btns[bi]);
}
document.getElementById("bR").addEventListener("click",start);
ovB.addEventListener("click",start);
reset();state="ready";
show("去而复返","过了河不算回家!先踩浮木、穿公路摸到对岸的小旗;旗子到手瞬间进入返程高峰,车流和河水统统提速一半,你要顶着高峰原路返回南岸。每完成一程,旗子换位、难度递增。","开始游戏");
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹球钉阵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#34d399;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#34d399;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#34d399}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#34d399;color:#052b1c;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>弹球钉阵</h1>
  <p class="hint">↑↓ 调角度 · 空格蓄力发射 · 拖拽瞄准 · 5 发弹丸冲击 700 分,小心炸弹槽</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>弹丸 <b id="ammo">5</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="420"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">弹球钉阵</h2>
      <p id="ovDesc">炮口朝天的弹珠场:炮弹射入钉阵后被碰得叮当作乱,
最终落进底部奖槽。中央 500 分,两侧递减,但有两个槽是炸弹,落进去倒扣 150!
钉子会让弹道完全失控,多试几次找手感。5 发冲击 700 分。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=420,GY=384,G=0.17;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elAmmo=$("ammo"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var CX=42,PIV=GY-12,R=6;
var best=loadBest("mg_s471");
var state="menu",ang=60,pow=55,charging=false,cd=1;
var ball=null,trail=[],ammo=5,score=0,pegs=[],slots=[],parts=[],txts=[],slowT=0,settle=0;
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a);}
function spd(p){return 1+p*0.125;}
function rad(d){return d*Math.PI/180;}
function muzzle(){var a=rad(ang);return{x:CX+Math.cos(a)*30,y:PIV-Math.sin(a)*30};}
function buildBoard(){
  pegs=[];slots=[];
  var r,c,x,y;
  for(r=0;r<6;r++){
    y=86+r*36;
    x=(r%2===0)?76:98;
    while(x<=416){
      if(Math.random()>0.18)pegs.push({x:x,y:y});
      x+=44;
    }
  }
  var vals=[100,200,300,500,300,200,100];
  for(c=0;c<7;c++)slots.push({v:vals[c],bomb:false});
  var pool=[0,1,2,4,5,6];
  for(r=0;r<2;r++){
    var k=(Math.random()*pool.length)|0;
    slots[pool[k]].bomb=true;
    pool.splice(k,1);
  }
}
function reset(){
  score=0;ammo=5;ball=null;trail=[];parts=[];txts=[];slowT=0;settle=0;
  buildBoard();ang=60;pow=55;charging=false;hud();
}
function hud(){elScore.textContent=score;elAmmo.textContent=ammo;elBest.textContent=best;}
function canFire(){return state==="playing"&&!ball&&ammo>0;}
function fire(){
  if(!canFire())return;
  ammo--;charging=false;
  var m=muzzle(),a=rad(ang),v=spd(pow);
  ball={x:m.x,y:m.y,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,t:0};
  trail=[];slowT=0;hud();
}
function boom(x,y,col,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-2.2,2.2),vy:rnd(-2.8,0.5),l:rnd(16,36),c:col});
}
function floatTxt(x,y,s,col){txts.push({x:x,y:y,s:s,c:col,l:55});}
function tick(){
  var i;
  if(charging&&canFire()){pow+=cd*1.9;if(pow>=100){pow=100;cd=-1;}if(pow<=18){pow=18;cd=1;}}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.l--;if(p.l<=0)parts.splice(i,1);}
  for(i=txts.length-1;i>=0;i--){txts[i].y-=0.6;txts[i].l--;if(txts[i].l<=0)txts.splice(i,1);}
  if(ball){
    for(var s=0;s<2;s++){
      ball.t++;ball.vy+=G;ball.x+=ball.vx;ball.y+=ball.vy;
      for(i=0;i<pegs.length;i++){
        var g=pegs[i],dx=ball.x-g.x,dy=ball.y-g.y,d=Math.hypot(dx,dy);
        if(d<11&&d>0.001){
          var nx=dx/d,ny=dy/d,vn=ball.vx*nx+ball.vy*ny;
          ball.x=g.x+nx*11;ball.y=g.y+ny*11;
          if(vn<0){ball.vx-=1.72*vn*nx;ball.vy-=1.72*vn*ny;}
          ball.vx+=rnd(-0.22,0.22);
          boom(g.x,g.y,"#34d399",3);
        }
      }
      if(ball.x<R+2){ball.x=R+2;ball.vx=Math.abs(ball.vx)*0.8;}
      if(ball.x>W-R-2){ball.x=W-R-2;ball.vx=-Math.abs(ball.vx)*0.8;}
      trail.push({x:ball.x,y:ball.y});if(trail.length>22)trail.shift();
      if(ball.y>GY-34){
        var idx=(ball.x-23)/62;
        idx=Math.max(0,Math.min(6,idx|0));
        var sl=slots[idx];
        var val=sl.bomb?-150:sl.v;
        score+=val;
        floatTxt(23+idx*62+31,GY-44,(val>0?"+":"")+val,sl.bomb?"#f87171":"#fbbf24");
        boom(ball.x,GY-30,sl.bomb?"#f87171":"#fbbf24",12);
        ball=null;hud();break;
      }
      if(ball.y<-80){ball=null;break;}
      if(Math.hypot(ball.vx,ball.vy)<0.9){slowT++;if(slowT>70){boom(ball.x,ball.y,"#8b93c8",6);ball=null;break;}}
      else slowT=0;
      if(ball.t>1200){ball=null;break;}
    }
  }
  if(state==="playing"&&ammo<=0&&!ball){settle++;if(settle>40)finish();}
}
function finish(){
  state="over";
  var win=score>=700;
  if(score>best){best=score;saveBest("mg_s471",best);}
  ovTitle.textContent=win?"头奖!钉阵之主":"弹丸用尽";
  ovDesc.textContent="最终得分 "+score+" 分。\n"+(win?"500 中央槽在手,天下我有!":"试着让球先撞上排钉子减速,再滑进中央高分区。");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  hud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawCannon(){
  ctx.fillStyle="#39406b";ctx.fillRect(CX-16,GY-6,32,6);
  ctx.save();ctx.translate(CX,PIV);ctx.rotate(-rad(ang));
  ctx.fillStyle="#8b93c8";rr(-8,-6,34,12,5);ctx.fill();
  ctx.restore();
  ctx.fillStyle="#6a74ad";ctx.beginPath();ctx.arc(CX,PIV,11,Math.PI,0);ctx.fill();
  if(charging){
    ctx.fillStyle="#20263f";rr(CX-40,PIV-92,10,80,5);ctx.fill();
    ctx.fillStyle=pow>80?"#f87171":"#34d399";
    var bh=80*(pow-18)/82;
    rr(CX-40,PIV-12-bh,10,bh,4);ctx.fill();
  }
}
function draw(){
  var i;
  ctx.fillStyle="#10142a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1b2138";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#2a3154";ctx.fillRect(0,GY,W,3);
  ctx.fillStyle="#8b93c8";
  for(i=0;i<pegs.length;i++){ctx.beginPath();ctx.arc(pegs[i].x,pegs[i].y,5,0,Math.PI*2);ctx.fill();}
  ctx.font="bold 13px system-ui";ctx.textAlign="center";
  for(i=0;i<7;i++){
    var sx=23+i*62,sl=slots[i];
    ctx.fillStyle=sl.bomb?"rgba(248,113,113,0.25)":"rgba(52,211,153,0.18)";
    rr(sx+3,GY-30,56,28,6);ctx.fill();
    ctx.strokeStyle=sl.bomb?"#f87171":"rgba(52,211,153,0.6)";ctx.lineWidth=2;
    rr(sx+3,GY-30,56,28,6);ctx.stroke();
    ctx.fillStyle=sl.bomb?"#f87171":"#fbbf24";
    ctx.fillText(sl.bomb?"炸-150":""+sl.v,sx+31,GY-11);
  }
  if(canFire()){
    var m=muzzle(),a=rad(ang),v=spd(pow);
    var x=m.x,y=m.y,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;
    ctx.fillStyle="rgba(232,234,246,0.3)";
    for(i=0;i<46;i++){
      vy+=G;x+=vx;y+=vy;
      if(y>GY-34)break;
      if(i%3===0)ctx.fillRect(x-1.5,y-1.5,3,3);
    }
  }
  drawCannon();
  for(i=0;i<trail.length;i++){ctx.fillStyle="rgba(139,147,200,"+(i/trail.length*0.5)+")";ctx.fillRect(trail[i].x-1.5,trail[i].y-1.5,3,3);}
  if(ball){ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,Math.PI*2);ctx.fill();}
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  for(i=0;i<txts.length;i++){var t=txts[i];ctx.globalAlpha=Math.min(1,t.l/30);ctx.fillStyle=t.c;ctx.font="bold 15px system-ui";ctx.textAlign="center";ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
}
var lastT=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing"){acc+=dt;var n=0;while(acc>=16.6&&n<4){acc-=16.6;n++;tick();}if(n===4)acc=0;}
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}return;}
  if(e.key==="ArrowUp"){ang=Math.min(85,ang+2);e.preventDefault();}
  else if(e.key==="ArrowDown"){ang=Math.max(15,ang-2);e.preventDefault();}
  else if(e.key===" "){e.preventDefault();if(!charging&&canFire()){charging=true;pow=18;cd=1;}}
});
document.addEventListener("keyup",function(e){
  if(e.key===" "&&state==="playing"&&charging)fire();
});
var drag=false,dragMoved=false;
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function aimAt(p){
  var dx=p.x-CX,dy=PIV-p.y;
  if(dy<6||dx<2)return;
  ang=Math.max(15,Math.min(85,Math.atan2(dy,dx)*180/Math.PI));
  pow=Math.max(18,Math.min(100,Math.hypot(dx,dy)/2.2));
  dragMoved=true;
}
cv.addEventListener("mousedown",function(e){if(state!=="playing")return;drag=true;dragMoved=false;aimAt(pos(e));e.preventDefault();});
window.addEventListener("mousemove",function(e){if(drag)aimAt(pos(e));});
window.addEventListener("mouseup",function(e){if(drag){drag=false;if(dragMoved&&canFire())fire();}});
cv.addEventListener("touchstart",function(e){if(state!=="playing")return;drag=true;dragMoved=false;aimAt(pos(e.changedTouches[0]));e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",function(e){if(drag)aimAt(pos(e.changedTouches[0]));e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){if(drag){drag=false;if(dragMoved&&canFire())fire();}e.preventDefault();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多球风暴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#38bdf8;text-align:center;letter-spacing:2px;margin-bottom:2px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin-bottom:8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#38bdf8;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#38bdf8}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#38bdf8;color:#04263b;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>多球风暴</h1>
  <p class="hint">← → 或 A/D 控制双翼 · 空格蓄力发射 · 撞分裂靶加球</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>在场球 <b id="nb">1</b></span>
    <span>倍率 <b id="mult">x1</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="400" height="620"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">多球风暴</h2>
      <p id="ovDesc">撞击中央的分裂靶可额外分裂出一颗新球(最多 5 颗同屏)。两球及以上全场得分翻倍,但任何一颗球都不容有失——最后一颗球掉落即结束!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var elScore=$("score"),elNb=$("nb"),elMult=$("mult"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var W=400,H=620,G=1000,MAXS=1250,TAU=6.2832;
var best=0;
try{best=parseInt(localStorage.getItem("mg923")||"0",10)||0;}catch(e){best=0;}
function saveBest(){try{localStorage.setItem("mg923",String(best));}catch(e){}}
var state="menu",score=0,lastT=0,shake=0,maxNb=1;
var balls=[],segs=[],circs=[],flL=null,flR=null;
var charging=false,charge=0;
var pops=[];
function S(x1,y1,x2,y2,o){var s={x1:x1,y1:y1,x2:x2,y2:y2,e:0.5,pad:2,kick:0,ow:0,cd:0};if(o)for(var k in o)s[k]=o[k];segs.push(s);return s;}
function C(x,y,r,o){var c={x:x,y:y,r:r,e:0.9,kick:0,cd:0,val:0};if(o)for(var k in o)c[k]=o[k];circs.push(c);return c;}
function mkFL(px,py,mir,len){len=len||58;return{px:px,py:py,len:len,rest:mir?Math.PI-0.55:0.55,up:mir?Math.PI+0.62:-0.62,ang:mir?Math.PI-0.55:0.55,om:0,spd:15,pressed:false};}
function reset(){
  segs=[];circs=[];pops=[];
  S(10,44,326,44);
  S(326,44,390,112);
  S(350,138,390,112,{ow:1,e:0.4});
  S(10,44,10,588);
  S(390,112,390,588);
  S(358,138,358,588);
  S(358,588,390,588,{e:0});
  S(62,460,94,540);
  S(338,460,306,540);
  S(86,454,134,532,{e:1.05,kick:300,col:"#f472b6"});
  S(314,454,266,532,{e:1.05,kick:300,col:"#f472b6"});
  S(134,532,144,552);
  S(266,532,256,552);
  C(200,150,18,{kick:360,val:200,onHit:splitBall});
  C(100,240,20,{kick:320,val:150});
  C(300,240,20,{kick:320,val:150});
  C(60,150,8,{e:0.8,val:50});
  C(340,150,8,{e:0.8,val:50});
  C(140,330,8,{e:0.8,val:50});
  C(260,330,8,{e:0.8,val:50});
  flL=mkFL(140,547,false);flR=mkFL(260,547,true);
}
function fseg(f){return{x1:f.px,y1:f.py,x2:f.px+f.len*Math.cos(f.ang),y2:f.py+f.len*Math.sin(f.ang),e:0.3,pad:5,om:f.om,ang:f.ang};}
function upFlip(f,h){
  var target=f.pressed?f.up:f.rest,prev=f.ang,step=f.spd*h,d=target-f.ang;
  if(Math.abs(d)<=step)f.ang=target;else f.ang+=(d>0?step:-step);
  f.om=(f.ang-prev)/h;
}
function curMult(){return balls.length>1?2:1;}
function addScore(v,x,y){
  score+=v*curMult();elScore.textContent=score;
  if(x!==undefined&&pops.length<8)pops.push({x:x,y:y,txt:"+"+(v*curMult()),life:900});
}
function splitBall(){
  if(balls.length>=5)return;
  balls.push({x:200,y:70,vx:(Math.random()-0.4)*90,vy:80,r:9});
  if(balls.length>maxNb)maxNb=balls.length;
  elNb.textContent=balls.length;
  elMult.textContent="x"+curMult();
  pops.push({x:200,y:110,txt:"加球!",life:1000});
}
function toReady(){
  balls=[{x:374,y:574,vx:0,vy:0,r:9}];
  charging=false;charge=0;state="ready";
  elNb.textContent=1;elMult.textContent="x1";
}
function launch(){
  var m=balls[0];
  m.vx=-10;m.vy=-(640+820*charge);
  charge=0;charging=false;state="playing";
}
function gameOver(msg){
  state="over";
  if(score>best){best=score;saveBest();}
  elBest.textContent=best;
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  reset();score=0;maxNb=1;
  elScore.textContent=0;elBest.textContent=best;
  toReady();
  ov.classList.add("hide");
}
function collideSeg(s,now,bb){
  var dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy;
  var t=L2>0?((bb.x-s.x1)*dx+(bb.y-s.y1)*dy)/L2:0;
  t=t<0?0:t>1?1:t;
  var px=s.x1+t*dx,py=s.y1+t*dy;
  var ex=bb.x-px,ey=bb.y-py,d2=ex*ex+ey*ey,R=bb.r+(s.pad||0);
  if(d2>=R*R)return false;
  if(s.ow===1&&bb.vy<0)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=0;}
  var nx=ex/d,ny=ey/d;
  bb.x=px+nx*R;bb.y=py+ny*R;
  var ox=0,oy=0;
  if(s.om){
    var segLen=Math.sqrt(L2),l=(t-(s.pv||0))*segLen;
    var sA=Math.sin(s.ang),cA=Math.cos(s.ang);
    ox=-s.om*l*sA;oy=s.om*l*cA;
  }
  var rvx=bb.vx-ox,rvy=bb.vy-oy,vn=rvx*nx+rvy*ny;
  if(vn<0){
    bb.vx-=(1+s.e)*vn*nx;bb.vy-=(1+s.e)*vn*ny;
    if(s.kick&&now-s.cd>90){s.cd=now;bb.vx+=s.kick*nx;bb.vy+=s.kick*ny;addScore(50,px,py);}
  }
  return true;
}
function collideCirc(c,now,bb){
  var ex=bb.x-c.x,ey=bb.y-c.y,R=bb.r+c.r,d2=ex*ex+ey*ey;
  if(d2>=R*R)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=-0.001;}
  var nx=ex/d,ny=ey/d;
  bb.x=c.x+nx*R;bb.y=c.y+ny*R;
  var vn=bb.vx*nx+bb.vy*ny;
  if(vn<0){
    bb.vx-=(1+c.e)*vn*nx;bb.vy-=(1+c.e)*vn*ny;
    if(now-c.cd>120){
      c.cd=now;
      if(c.kick){bb.vx+=c.kick*nx;bb.vy+=c.kick*ny;}
      if(c.val)addScore(c.val,c.x,c.y-c.r-8);
      if(c.onHit)c.onHit();
    }
  }
  return true;
}
function stepOne(bb,h,now){
  bb.vy+=G*h;
  var sp=Math.sqrt(bb.vx*bb.vx+bb.vy*bb.vy);
  if(sp>MAXS){bb.vx*=MAXS/sp;bb.vy*=MAXS/sp;}
  bb.x+=bb.vx*h;bb.y+=bb.vy*h;
  var i;
  for(i=0;i<segs.length;i++)collideSeg(segs[i],now,bb);
  collideSeg(fseg(flL),now,bb);
  collideSeg(fseg(flR),now,bb);
  for(i=0;i<circs.length;i++)collideCirc(circs[i],now,bb);
  if(bb.x<12){bb.x=12;if(bb.vx<0)bb.vx=-bb.vx;}
  if(bb.x>388){bb.x=388;if(bb.vx>0)bb.vx=-bb.vx;}
  return bb.y>H+25;
}
function frame(t){
  requestAnimationFrame(frame);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  if(state==="playing"||state==="ready"){upFlip(flL,dt/1000);upFlip(flR,dt/1000);}
  if(state==="ready"){
    if(charging){charge+=dt*0.0013;if(charge>1)charge=1;}
  }else if(state==="playing"){
    var n=5,i,k,drain=false;
    for(i=0;i<n;i++){
      for(k=balls.length-1;k>=0;k--){
        if(stepOne(balls[k],dt/1000/n,t)){
          if(balls.length===1)drain=true;
          balls.splice(k,1);
        }
      }
    }
    if(drain){gameOver("最后一颗弹珠掉落!同屏最多曾 "+maxNb+" 颗。"); }
    else{elNb.textContent=balls.length;elMult.textContent="x"+curMult();}
  }
  if(shake>0.3)shake*=0.85;
  var j;
  for(j=pops.length-1;j>=0;j--){pops[j].life-=dt;pops[j].y-=dt*0.028;if(pops[j].life<=0)pops.splice(j,1);}
  draw(t);
}
function drawSegs(){
  ctx.lineCap="round";
  var i,s;
  for(i=0;i<segs.length;i++){
    s=segs[i];
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
    if(s.ow===1){ctx.setLineDash([6,5]);ctx.strokeStyle="#33406e";ctx.lineWidth=3;}
    else{ctx.setLineDash([]);ctx.strokeStyle=s.col||"#3d4370";ctx.lineWidth=5;}
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawFL(f){
  var x2=f.px+f.len*Math.cos(f.ang),y2=f.py+f.len*Math.sin(f.ang);
  ctx.strokeStyle="#38bdf8";ctx.lineWidth=12;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(f.px,f.py);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle="#dbeafe";ctx.beginPath();ctx.arc(f.px,f.py,5,0,TAU);ctx.fill();
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(200,300,40,200,300,420);
  g.addColorStop(0,"rgba(56,189,248,0.10)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawSegs();
  var i,c,hot;
  for(i=0;i<circs.length;i++){
    c=circs[i];
    if(c.r<=9){ctx.fillStyle="#5b6398";ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();}
    else{
      hot=t-c.cd<130;
      ctx.fillStyle=hot?"#e0f2fe":"#12253c";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();
      ctx.strokeStyle=hot?"#38bdf8":"#2c5d8f";ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle=hot?"#38bdf8":"#7dd3fc";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r*0.4,0,TAU);ctx.fill();
    }
  }
  ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.fillStyle="#7dd3fc";
  ctx.fillText("分裂靶",200,178);
  drawFL(flL);drawFL(flR);
  if(state==="ready"&&balls.length){ctx.fillStyle="#f97316";ctx.fillRect(368,584+charge*10,12,5);}
  ctx.font="bold 14px system-ui";
  for(i=0;i<balls.length;i++){
    var bb=balls[i];
    var bg2=ctx.createRadialGradient(bb.x-3,bb.y-4,1,bb.x,bb.y,10);
    bg2.addColorStop(0,"#ffffff");bg2.addColorStop(1,balls.length>1?"#fbbf24":"#7dd3fc");
    ctx.fillStyle=bg2;ctx.shadowColor="#38bdf8";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(bb.x,bb.y,bb.r,0,TAU);ctx.fill();ctx.shadowBlur=0;
  }
  for(i=0;i<pops.length;i++){
    ctx.globalAlpha=Math.min(1,pops[i].life/500);
    ctx.fillStyle="#bae6fd";ctx.fillText(pops[i].txt,pops[i].x,pops[i].y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){flL.pressed=true;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){flR.pressed=true;e.preventDefault();}
  else if(k===" "||k==="ArrowDown"){
    e.preventDefault();
    if(state==="ready")charging=true;
    else if(state==="menu"||state==="over")startGame();
  }else if(k==="Enter"&&(state==="menu"||state==="over"))startGame();
});
document.addEventListener("keyup",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A")flL.pressed=false;
  else if(k==="ArrowRight"||k==="d"||k==="D")flR.pressed=false;
  else if(k===" "||k==="ArrowDown"){
    if(state==="ready"&&charging)launch();
    charging=false;
  }
});
var tCharge=false;
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(state==="ready"){tCharge=true;charging=true;return;}
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=true;else flR.pressed=true;
  }
},{passive:false});
cv.addEventListener("touchend",function(e){
  e.preventDefault();
  if(state==="ready"){
    if(tCharge){tCharge=false;charge=Math.max(charge,0.55);launch();}
    return;
  }
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=false;else flR.pressed=false;
  }
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
elBest.textContent=best;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

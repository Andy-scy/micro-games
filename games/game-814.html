<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文火慢炖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fb923c;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fb923c;font-size:16px}
.stage{position:relative;background:#211713;border:2px solid #3c2a1c;border-radius:12px;padding:14px;display:flex;gap:16px;justify-content:center}
.gaugeWrap{position:relative;width:64px;height:240px;border-radius:12px;background:#141826;border:2px solid #2a3158;overflow:hidden}
.band{position:absolute;left:0;right:0;background:rgba(74,222,128,.3);border-top:2px solid #4ade80;border-bottom:2px solid #4ade80}
.needle{position:absolute;left:0;right:0;height:5px;background:#fff;box-shadow:0 0 8px #fff}
.hot{position:absolute;left:0;right:0;top:0;height:12%;background:rgba(248,113,113,.25);border-bottom:1px dashed #f87171}
.glab{position:absolute;right:6px;top:4px;font-size:10px;color:#f87171}
.side{display:flex;flex-direction:column;justify-content:center;gap:10px;width:190px}
.plabel{font-size:12px;color:#8b90b0}
.pbar{height:14px;border-radius:7px;background:#0b0f1e;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:#fb923c}
.pbar.burn i{background:#f87171}
.tempv{font-size:13px;color:#c7cbe8}
.holdb{margin-top:6px;background:#fb923c;color:#3a1c05;border:none;border-radius:12px;padding:16px 10px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;user-select:none;touch-action:none}
.holdb.on{background:#fde047;transform:scale(.97)}
.msg{text-align:center;color:#fbbf24;font-size:14px;font-weight:700;height:20px;margin-top:8px}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fb923c}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#fb923c;color:#3a1c05;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>文火慢炖</h1>
  <p class="hint">汤锅温度会自己漂移,<b style="color:#4ade80">按住加火(或 ↑ 键)</b>把白色指针稳在绿色温区<br>在温区内炖煮进度才会涨,冲进红色高温区会烧糊,糊锅 3 次出局!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>出锅 <b id="dishes">0</b></span>
    <span>时间 <b id="time">75</b>秒</span>
    <span>生命 <b id="life">♥♥♥</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <div class="gaugeWrap" id="gauge">
      <div class="hot"></div>
      <div class="band" id="band"></div>
      <div class="needle" id="needle"></div>
      <div class="glab">烫!</div>
    </div>
    <div class="side">
      <div class="plabel">炖煮进度</div>
      <div class="pbar"><i id="pfill"></i></div>
      <div class="plabel">烧糊程度</div>
      <div class="pbar burn"><i id="bfill"></i></div>
      <div class="tempv" id="tempv">温度 50°</div>
      <button class="holdb" id="holdb">🔥 加火(按住)<br>↑ 键也行</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">文火慢炖</h2>
      <p id="ovDesc">绿色温区会缓缓上下移动,指针停在区内进度才增长;顶部红色区域是危险高温,烧糊积满一格就废一锅。手要又稳又勤,75 秒看你能出几道菜!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elScore=$("score"),elDishes=$("dishes"),elTime=$("time"),elLife=$("life"),elBest=$("best");
var gauge=$("gauge"),band=$("band"),needle=$("needle"),pfill=$("pfill"),bfill=$("bfill"),tempv=$("tempv");
var holdb=$("holdb"),msg=$("msg");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s814");
var state="menu",temp,progress,burn,score,dishes,lives,timeLeft,lastT,msgT,held,phase;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function reset(){
  temp=50;progress=0;burn=0;score=0;dishes=0;lives=3;timeLeft=75;held=false;phase=0;
  msg.textContent="";msgT=0;render();updateHud();
}
function updateHud(){
  elScore.textContent=score;elDishes.textContent=dishes;elBest.textContent=best;
  elTime.textContent=Math.max(0,Math.ceil(timeLeft));
  var s="";for(var i=0;i<lives;i++)s+="♥";elLife.textContent=s||"—";
}
function showMsg(t,c){msg.textContent=t;msg.style.color=c||"#fbbf24";msgT=1.3;}
function bandCenter(){return 50+22*Math.sin(phase*0.45+2.1);}
function bandHalf(){return Math.max(6.5,11-dishes*0.5);}
function render(){
  var bc=bandCenter(),bh=bandHalf();
  band.style.bottom=(bc-bh)+"%";
  band.style.height=(bh*2)+"%";
  needle.style.bottom="calc("+temp+"% - 2px)";
  pfill.style.width=Math.min(100,progress)+"%";
  bfill.style.width=Math.min(100,burn)+"%";
  tempv.textContent="温度 "+Math.round(temp)+"°(目标区 "+Math.round(bc-bh)+"~"+Math.round(bc+bh)+"°)";
  holdb.className="holdb"+(held?" on":"");
}
function gameOver(){
  state="over";held=false;
  if(score>best){best=score;saveBest("mg_s814",best);}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent="糊了三锅汤,主厨没收你的锅铲。共出锅 "+dishes+" 道。";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  render();updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  var dts=dt/1000;
  if(msgT>0){msgT-=dts;if(msgT<=0){msg.textContent="";msgT=0;}}
  if(state!=="playing")return;
  timeLeft-=dts;
  if(timeLeft<=0){timeLeft=0;updateHud();gameOver();return;}
  phase+=dts;
  var dv=(held?27:-16)+(Math.random()-0.5)*9;
  temp+=dv*dts;
  if(temp<0)temp=0;
  if(temp>100)temp=100;
  var bc=bandCenter(),bh=bandHalf();
  if(temp>88){
    burn+=9*dts;
    if(burn>=100){
      burn=0;temp=42;lives--;
      showMsg("糊锅了!刷锅重来…","#f87171");
      updateHud();
      if(lives<=0){render();gameOver();return;}
    }
  }else if(temp>=bc-bh&&temp<=bc+bh){
    progress+=100/8.5*dts;
    if(progress>=100){
      progress=0;dishes++;score+=20+dishes*2;
      showMsg("出锅!+分数","#4ade80");
      updateHud();
    }
  }else{
    burn=Math.max(0,burn-6*dts);
  }
  render();updateHud();
}
function holdOn(){if(state==="playing")held=true;}
function holdOff(){held=false;}
holdb.addEventListener("mousedown",holdOn);
holdb.addEventListener("mouseup",holdOff);
holdb.addEventListener("mouseleave",holdOff);
holdb.addEventListener("touchstart",function(e){e.preventDefault();holdOn();},{passive:false});
holdb.addEventListener("touchend",function(e){e.preventDefault();holdOff();},{passive:false});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W"){
    e.preventDefault();holdOn();
  }else if(e.key===" "||e.code==="Space"){
    e.preventDefault();
    if(state!=="playing")startGame();
  }
});
document.addEventListener("keyup",function(e){
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")holdOff();
});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素复刻师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fbbf24;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.hud{font-size:14px;color:#c7cbe8;display:flex;flex-direction:column;gap:4px}
.hud b{color:#fbbf24;font-size:16px}
.refbox{text-align:center}
.refbox span{display:block;font-size:12px;color:#8b90b0;margin-bottom:2px}
#ref{background:#10141f;border:1px solid #2a3050;border-radius:8px;image-rendering:pixelated}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #4a3a10;background:#10141f;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.pal{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:10px}
.pal button{display:flex;align-items:center;gap:5px;background:#241d33;color:#e8eaf6;border:1px solid #4c3a72;border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.pal button i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.25)}
.pal button.on{border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.35)}
.bar{display:flex;justify-content:center;gap:10px;margin-top:10px}
.bar button{background:#fbbf24;color:#3b2503;border:none;border-radius:10px;padding:10px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.msg{text-align:center;color:#f87171;font-size:13px;height:18px;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(10,8,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fbbf24}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#fbbf24;color:#3b2503;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>像素复刻师</h1>
  <p class="hint">对照右上角参考图,选颜色点格子(可拖动连涂),把 10×10 像素画复刻到 <b style="color:#fbbf24">相似度 85%</b> 以上再提交!</p>
  <div class="top">
    <div class="hud"><span>关卡 <b id="lv">1/3</b></span><span>相似度 <b id="sim">0%</b></span><span>得分 <b id="score">0</b></span></div>
    <div class="refbox"><span>参考图</span><canvas id="ref" width="100" height="100"></canvas></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">像素复刻师</h2>
      <p id="ovP">三幅像素小画等你复刻:爱心、小猫、小树。空格也是颜色——橡皮可以把格子擦回空白。提交时相似度不足会打回重修哦。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
  <div class="pal" id="pal"></div>
  <div class="bar"><button id="btnSub">提交作品</button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d"),ref=$("ref"),rctx=ref.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo");
var elLv=$("lv"),elSim=$("sim"),elScore=$("score"),elMsg=$("msg"),palEl=$("pal"),btnSub=$("btnSub");
var LV=[
 {name:"爱心",rows:[
 "..rr..rr..",
 ".rrrrrrrr.",
 "rrrrrrrrrr",
 "rrrrrrrrrr",
 ".rrrrrrrr.",
 "..rrrrrr..",
 "...rrrr...",
 "....rr....",
 "..........",
 ".........."]},
 {name:"小猫",rows:[
 ".k......k.",
 ".kk....kk.",
 "kkkkkkkkkk",
 "kkwwkkwwkk",
 "kkkkkkkkkk",
 "kkkkwwkkkk",
 ".kkkkkkkk.",
 "..kkkkkk..",
 "..kk..kk..",
 "..kk..kk.."]},
 {name:"小树",rows:[
 "....gg....",
 "...gggg...",
 "..gggggg..",
 ".gggggggg.",
 "..gggggg..",
 ".gggggggg.",
 "gggggggggg",
 "....yy....",
 "....yy....",
 "....yy...."]}
];
var COL={r:"#ef4444",y:"#eab308",g:"#22c55e",b:"#3b82f6",w:"#f8fafc",k:"#64748b"};
var PAL=[["o","橡皮","transparent"],["r","红",COL.r],["y","黄",COL.y],["g","绿",COL.g],["b","蓝",COL.b],["w","白",COL.w],["k","灰",COL.k]];
var N=10,CELL=48;
var state="menu",lv=0,score=0,board=[],sel="r",isDown=false;
function drawAll(){
  var r,c;
  ctx.fillStyle="#10141f";ctx.fillRect(0,0,480,480);
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    var v=board[r*N+c];
    if(v!=="o"){ctx.fillStyle=COL[v]||"#f8fafc";ctx.fillRect(c*CELL,r*CELL,CELL,CELL);}
  }
  ctx.strokeStyle="rgba(139,144,176,0.35)";ctx.lineWidth=1;
  for(r=0;r<=N;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(480,r*CELL);ctx.stroke();
    ctx.beginPath();ctx.moveTo(r*CELL,0);ctx.lineTo(r*CELL,480);ctx.stroke();}
  rctx.fillStyle="#10141f";rctx.fillRect(0,0,100,100);
  var rows=LV[lv].rows;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    var ch=rows[r].charAt(c);
    if(ch!=="."){rctx.fillStyle=COL[ch];rctx.fillRect(c*10,r*10,10,10);}
  }
  elSim.textContent=similarity()+"%";
}
function similarity(){
  var rows=LV[lv].rows,m=0,r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    var want=rows[r].charAt(c)==="."?"o":rows[r].charAt(c);
    if(board[r*N+c]===want)m++;
  }
  return Math.round(m/(N*N)*100);
}
function loadLevel(){
  board=[];var i;
  for(i=0;i<N*N;i++)board.push("o");
  elLv.textContent=(lv+1)+"/3";elMsg.textContent="";
  drawAll();
}
function paintAt(p){
  if(state!=="playing")return;
  var c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);
  if(c<0||c>=N||r<0||r>=N)return;
  var id=r*N+c;
  if(board[id]!==sel){
    board[id]=sel;elMsg.textContent="";
    drawAll();
  }
}
function pos(e){
  var rc=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-rc.left)*cv.width/rc.width,y:(t.clientY-rc.top)*cv.height/rc.height};
}
function begin(e){var p=pos(e);isDown=true;paintAt(p);}
function moveP(e){if(!isDown)return;paintAt(pos(e));}
function endP(){isDown=false;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
var i;
for(i=0;i<PAL.length;i++){
  (function(p){
    var b=document.createElement("button");
    b.innerHTML='<i style="background:'+p[2]+'"></i>'+p[1];
    if(p[0]==="r")b.className="on";
    b.addEventListener("click",function(){
      sel=p[0];
      var bs=palEl.children,k;
      for(k=0;k<bs.length;k++)bs[k].className="";
      b.className="on";
    });
    palEl.appendChild(b);
  })(PAL[i]);
}
function finish(){
  state="over";
  var avg=Math.round(score/3);
  ovT.textContent="复刻完成!";
  ovP.textContent="三幅像素画都交付了,平均相似度 "+avg+"%。\n"+(avg>=95?"大师级复刻!":"熟能生巧,再来冲一次满分!");
  ovS.style.display="block";ovS.textContent="总分 "+score+" / 300";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
btnSub.addEventListener("click",function(){
  if(state!=="playing")return;
  var s=similarity();
  if(s>=85){
    score+=s;
    elScore.textContent=score;
    lv++;
    if(lv>=3){finish();return;}
    loadLevel();
  }else{
    elMsg.textContent="相似度不足 85%,继续修改!";
  }
});
btnGo.addEventListener("click",function(){
  lv=0;score=0;elScore.textContent=0;state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  loadLevel();
});
loadLevel();
})();
</script>
</body>
</html>

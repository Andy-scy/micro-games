<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匠人拆墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#facc15;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#facc15;font-size:16px}
.gbtn{background:#3a3003;color:#facc15;border:1px solid #facc15;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.96)}
.msg{color:#facc15;font-size:13px;min-height:18px;text-align:center;margin-bottom:6px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#facc15}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#facc15;color:#3a3003;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>匠人拆墙</h1>
  <p class="hint">方向键 / WASD 移动与转身 · 空格或按钮凿墙 · 触屏滑动移动</p>
  <div class="hud">
    <span>镐点 <b id="digs">8</b>/8</span>
    <span>步数 <b id="steps">0</b></span>
    <span>最少用镐纪录 <b id="best">--</b></span>
    <button class="gbtn" id="btnDig">凿墙 [空格]</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">匠人拆墙</h2>
      <p id="ovDesc">你不仅是走迷宫的人,还是改迷宫的人:背包里有 8 个镐点,面朝一堵墙按下空格就能把它凿开成路。别浪费镐点——剩余的每一个都会写进你的结算评价。走到绿色出口即胜利!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">拿起铁镐</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
function $(id){return document.getElementById(id);}
var elDigs=$("digs"),elSteps=$("steps"),elBest=$("best"),elMsg=$("msg"),btnDig=$("btnDig");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s280");
var state="menu";
var MAXDIG=8;
var grid,player,exitCell,facing,dug,digLeft,steps,elapsed,pulse,msgT,msgText,shakeT;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function setMsg(s){msgText=s;msgT=2.4;}
function reset(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  facing={x:1,y:0};
  dug=[];
  var y;
  for(y=0;y<ROWS;y++)dug.push(new Array(COLS));
  digLeft=MAXDIG;steps=0;elapsed=0;pulse=0;msgT=0;shakeT=0;
  updateHud();
}
function updateHud(){
  elDigs.textContent=digLeft;
  elSteps.textContent=steps;
  elBest.textContent=best>0?best+" 镐":"--";
}
function diggableAt(x,y){
  return x>0&&y>0&&x<COLS-1&&y<ROWS-1&&grid[y][x]===1;
}
function doDig(){
  if(state!=="playing")return;
  var tx=player.x+facing.x,ty=player.y+facing.y;
  if(!diggableAt(tx,ty)){setMsg("面前没有可以凿的墙");return;}
  if(digLeft<=0){setMsg("镐点用完了,只能靠双腿了");return;}
  grid[ty][tx]=0;
  dug[ty][tx]=true;
  digLeft--;
  shakeT=1;
  setMsg("凿开一堵墙!剩余镐点 "+digLeft);
  updateHud();
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  facing={x:dx,y:dy};
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1){
    if(diggableAt(nx,ny))setMsg("面朝一堵可凿之墙,按空格或点按钮");
    else setMsg("这堵墙太厚,凿不动");
    return;
  }
  player.x=nx;player.y=ny;
  steps++;
  if(nx===exitCell.x&&ny===exitCell.y){win();return;}
  updateHud();
}
function win(){
  state="over";
  var used=MAXDIG-digLeft;
  var isNew=false;
  if(best===0||used<best){best=used;saveBest("mg_s280",best);isNew=true;}
  ovTitle.textContent="匠心通关!";
  ovDesc.textContent=isNew?"新纪录!你用最少的镐点完成了这场改建。":"迷宫被你凿出了自己的路,出口敞开。";
  ovScore.style.display="block";
  ovScore.textContent="用镐 "+used+"/"+MAXDIG+" · 步数 "+steps+" · 用时 "+elapsed.toFixed(1)+"s";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#3a3222";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#4d4430";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function draw(){
  var x,y;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
    else if(dug[y][x]){
      ctx.fillStyle="rgba(250,204,21,0.25)";
      ctx.beginPath();
      ctx.arc(x*CELL+7,y*CELL+9,2,0,Math.PI*2);
      ctx.arc(x*CELL+14,y*CELL+7,1.6,0,Math.PI*2);
      ctx.arc(x*CELL+11,y*CELL+15,2.2,0,Math.PI*2);
      ctx.fill();
    }
  }
  var fx=player.x+facing.x,fy=player.y+facing.y;
  if(state==="playing"&&diggableAt(fx,fy)&&digLeft>0){
    ctx.strokeStyle="rgba(250,204,21,"+(0.4+Math.sin(pulse*4)*0.3).toFixed(3)+")";
    ctx.lineWidth=2.5;
    ctx.strokeRect(fx*CELL+2,fy*CELL+2,CELL-4,CELL-4);
    ctx.lineWidth=1;
  }
  var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
  var pr=8+Math.sin(pulse)*2;
  ctx.fillStyle="#4ade80";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#05230f";
  ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("出",ex,ey);
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.save();
  if(shakeT>0){
    ctx.translate(Math.sin(shakeT*40)*2,0);
    shakeT=Math.max(0,shakeT-0.05);
  }
  ctx.fillStyle="#fef08a";
  ctx.shadowColor="#facc15";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle="#b45309";
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(px+facing.x*4,py+facing.y*4);
  ctx.lineTo(px+facing.x*9,py+facing.y*9);
  ctx.stroke();
  ctx.lineWidth=1;
  ctx.restore();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(msgT>0){msgT-=dt/1000;elMsg.textContent=msgText;}
  else elMsg.textContent="";
  if(state==="playing")elapsed+=dt/1000;
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k===" "){e.preventDefault();doDig();return;}
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
btnDig.addEventListener("click",doDig);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

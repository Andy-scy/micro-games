<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摇摆乐章</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#e879f9;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#e879f9;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#e879f9}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#e879f9;color:#2b0a2b;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>摇摆乐章</h1>
  <p class="hint">钟摆扫过中心的一瞬敲击 · 每八拍更换乐章,速度骤变 · 空格 / 点击 / 触屏</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>生命 <b id="life">3</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">摇摆乐章</h2>
      <p id="ovDesc">老式节拍器为你打拍子:钟摆每次扫过中心即一拍。
每八拍进入新乐章,行板、快板、慢板、急板轮番登场,
请紧盯乐章预告,随时切换你的心跳!
失手 3 次演出结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elLife=$("life"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,PX=240,PY=84,PLEN=330,MAXA=0.55;
var SEQ=[{n:"行板",b:76},{n:"快板",b:120},{n:"慢板",b:60},{n:"急板",b:168},{n:"中板",b:96},{n:"小快板",b:132}];
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_g372");
var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function sTick(b){tone("square",500+b,0,0.05,0.15);}
function sPerfect(){tone("triangle",880,1400,0.12,0.22);}
function sGood(){tone("triangle",640,640,0.08,0.18);}
function sMiss(){tone("sawtooth",200,90,0.26,0.2);}

var state="menu",score,combo,life,maxCombo,hits,ticks,nextT,m,flashes;
function reset(){
  score=0;combo=0;life=3;maxCombo=0;hits=0;
  m=0;ticks=[];flashes=[];
  nextT=performance.now()+1600;
  upd();
}
function start(){audio();reset();state="play";ov.classList.add("hide");}
function upd(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elLife.textContent=life;
  elBest.textContent=best;
}
function addPop(txt,color){flashes.push({txt:txt,color:color,t0:performance.now()});}
function gameOver(){
  state="over";
  if(score>best){best=score;saveBest("mg_g372",best);}
  upd();
  ovTitle.textContent="乐章中断";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  ovDesc.textContent="共命中 "+hits+" 拍 · 最高连击 "+maxCombo+"\n盯紧预告,跟上每一次变速!";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function schedule(now){
  if(nextT-now>4000)nextT=now+400;
  while(nextT-now<700){
    m++;
    var sec=SEQ[Math.floor((m-1)/8)%SEQ.length];
    ticks.push({m:m,t:nextT,used:false,run:false,bpm:sec.b});
    var iv=60000/sec.b;
    nextT+=iv;
  }
  var i,tk;
  for(i=ticks.length-1;i>=0;i--){
    tk=ticks[i];
    if(!tk.run&&now>=tk.t){
      tk.run=true;
      sTick(tk.bpm);
      if((tk.m-1)%8===0&&tk.m>1)addPop("变奏!"+SEQ[Math.floor((tk.m-1)/8)%SEQ.length].n+" "+tk.bpm,"#e879f9");
    }
    if(tk.run&&!tk.used&&now>tk.t+175){
      tk.used=true;
      combo=0;life--;sMiss();
      addPop("失拍!","#f87171");
      upd();
      if(life<=0){gameOver();return;}
    }
    if(tk.used&&now>tk.t+420)ticks.splice(i,1);
  }
}
function press(){
  if(state!=="play")return;
  var now=performance.now(),i,tk,dt,bi=-1,bd=1e9;
  for(i=0;i<ticks.length;i++){
    tk=ticks[i];if(tk.used)continue;
    dt=now-tk.t;
    if(Math.abs(dt)>165)continue;
    if(Math.abs(dt)<Math.abs(bd)){bd=dt;bi=i;}
  }
  if(bi<0){addPop("乱拍","#8b90b0");combo=0;upd();return;}
  tk=ticks[bi];tk.used=true;hits++;
  if(Math.abs(bd)<=70){
    combo++;if(combo>maxCombo)maxCombo=combo;
    score+=200+combo*8;
    addPop("完美 +"+(200+combo*8),"#fbbf24");sPerfect();
  }else{
    combo++;score+=80+combo*3;
    addPop("尚可 +"+(80+combo*3),"#e879f9");sGood();
  }
  upd();
}
function draw(now){
  var i;
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  var tk=null;
  for(i=0;i<ticks.length;i++){if(!ticks[i].run){tk=ticks[i];break;}}
  var iv=tk?60000/tk.bpm:800;
  var prog=tk?Math.max(0,Math.min(1,(now-(tk.t-iv))/iv)):0;
  var ang=MAXA*Math.sin(Math.PI*prog);
  var bx=PX+Math.sin(ang)*PLEN,by=PY+Math.cos(ang)*PLEN;
  ctx.strokeStyle="rgba(232,121,249,0.25)";
  ctx.beginPath();ctx.arc(PX,PY,PLEN,Math.PI/2-MAXA,Math.PI/2+MAXA);ctx.stroke();
  ctx.strokeStyle="#e879f9";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(PX,PY);ctx.lineTo(bx,by);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle="#e879f9";
  ctx.beginPath();ctx.arc(bx,by,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(232,234,246,0.5)";
  ctx.beginPath();ctx.arc(PX,PY,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(232,121,249,0.8)";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(PX-70,PY-20);ctx.lineTo(PX+70,PY-20);ctx.stroke();ctx.lineWidth=1;
  var sec=SEQ[Math.floor(((tk?tk.m:1)-1)/8)%SEQ.length];
  ctx.fillStyle="#e879f9";
  ctx.font="bold 30px system-ui";ctx.textAlign="center";
  ctx.fillText(sec.n+" · "+sec.b+" BPM",W/2,470);
  if(tk&&tk.m>1){
    var nextStart=8*Math.floor((tk.m-1)/8)+1;
    var away=nextStart-tk.m;
    if(away<=4){
      var ns=SEQ[Math.floor((nextStart-1)/8)%SEQ.length];
      ctx.fillStyle="#fbbf24";
      ctx.font="bold 20px system-ui";
      ctx.fillText("预告:"+ns.n+" "+ns.b+" BPM",W/2,506);
    }
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=(now-f.t0)/620;
    ctx.fillStyle=f.color;ctx.globalAlpha=1-pr;
    ctx.font="bold 18px system-ui";
    ctx.fillText(f.txt,W/2,400-pr*24);
    ctx.globalAlpha=1;
  }
  for(i=flashes.length-1;i>=0;i--){if(now-flashes[i].t0>640)flashes.splice(i,1);}
}
function onTap(){press();}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();onTap();});
}else{
  cv.addEventListener("mousedown",function(e){onTap();});
  cv.addEventListener("touchstart",function(e){e.preventDefault();onTap();},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state!=="play")start();
    else press();
  }
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play")schedule(now);
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关卡工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none;cursor:crosshair}
.tb{flex:1;padding:12px 0;font-size:16px;background:#232a4a;color:#e8eaf6;border:0;border-radius:10px;touch-action:none;user-select:none;font-weight:700}
.tl{flex:1;padding:10px 0;font-size:14px;background:#31406b;color:#e8eaf6;border:0;border-radius:10px;cursor:pointer;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>关卡工坊</h1>
  <p class="tips">编辑模式:点击/拖动摆放方块,再点一次擦除;左侧小人出生,右侧小门终点。摆好后点「试玩」亲自通关你的关卡!</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">模式</div><div class="big" id="md">编辑</div></div>
    <div class="stat"><div class="mut">方块</div><div class="big" id="tc">0</div></div>
    <div class="stat"><div class="mut">用时</div><div class="big" id="pt">0.0s</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="480" height="360"></canvas></div>
  <div class="card row">
    <button class="tl" id="tPlay">▶ 试玩</button><button class="tl" id="tDemo">示例关</button><button class="tl" id="tClr">清空</button>
  </div>
  <div class="card row" id="padRow">
    <button class="tb" id="bL">◀</button><button class="tb" id="bR">▶</button><button class="tb" id="bJ">跳</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">关卡工坊</h2><p id="ovp">玩法说明:<br>· 编辑:点/拖 放置平台,再点一次擦除<br>· 左下角小人 = 出生点,右下角小门 = 终点<br>· 至少放 3 块方块才能试玩<br>· 试玩:←→ 移动,空格跳跃,抵达小门即通关<br>· 关卡会自动保存,下次打开还在<br>· 通关后返回编辑继续打磨你的关卡</p><button class="btn" id="obtn">开始搭建</button></div></div>
<script>
'use strict';
var W=480,H=360,CELL=40,COLS=12,ROWS=9;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $i(id){return document.getElementById(id)}
var grid=[],mode='edit',paintVal=1,painting=false;
var px=6,py=294,vx=0,vy=0,pw=22,ph=26,onG=false,face=1;
var solids=[],playT=0,clearT=0;
var door={x:443,y:268,w:34,h:52};
var running=false,lastT=0,bannerT=0,parts=[];
var keys={L:false,R:false,J:false},jHeld=false;
var SAMPLE=[[0,8,4,1],[5,8,3,1],[9,8,3,1],[2,6,2,1],[5,5,2,1],[8,6,2,1]];
function blank(){grid=[];for(var i=0;i<COLS*ROWS;i++)grid.push(0)}
function stamp(rects){
  for(var k=0;k<rects.length;k++){
    var rc=rects[k];
    for(var r=rc[1];r<rc[1]+rc[3]&&r<ROWS;r++)
      for(var c=rc[0];c<rc[0]+rc[2]&&c<COLS;c++)grid[r*COLS+c]=rc[4];
  }
}
function save(){try{localStorage.setItem('mg715level',grid.join(''))}catch(e){}}
function restore(){
  var ok=false;
  try{
    var sv=localStorage.getItem('mg715level');
    if(sv&&sv.length===COLS*ROWS&&/^[01]+$/.test(sv)){
      grid=[];for(var i=0;i<sv.length;i++)grid.push(sv.charAt(i)==='1'?1:0);
      ok=true;
    }
  }catch(e){}
  if(!ok){blank();stamp(SAMPLE)}
}
function countTiles(){var n=0;for(var i=0;i<grid.length;i++)if(grid[i])n++;return n}
function hud(){
  $i('md').textContent=mode==='edit'?'编辑':'试玩';
  $i('tc').textContent=countTiles();
  $i('pt').textContent=playT.toFixed(1)+'s';
}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*2.5,c:c,life:0.3+Math.random()*0.3});}
}
function buildSolids(){
  solids=[];
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)
    if(grid[r*COLS+c])solids.push({x:c*CELL,y:r*CELL,w:CELL,h:CELL});
}
function startPlay(){
  if(countTiles()<3){bannerT=1.6;hud();return}
  buildSolids();
  px=6;py=294;vx=0;vy=0;face=1;playT=0;
  mode='play';$i('padRow').style.display='flex';hud();
}
function stopPlay(){
  mode='edit';$i('padRow').style.display='none';hud();
}
function hitRect(s){return px<s.x+s.w&&px+pw>s.x&&py<s.y+s.h&&py+ph>s.y}
function physics(dt){
  var i,s;
  var acc=1500,mx=210;
  if(keys.L){vx-=acc*dt;face=-1}
  if(keys.R){vx+=acc*dt;face=1}
  if(!keys.L&&!keys.R)vx-=vx*Math.min(1,(onG?12:2)*dt);
  if(vx>mx)vx=mx;if(vx<-mx)vx=-mx;
  vy+=1500*dt;if(vy>900)vy=900;
  px+=vx*dt;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vx>0)px=s.x-pw;else if(vx<0)px=s.x+s.w;
      vx=0;
    }}
  if(px<0)px=0;if(px+pw>W)px=W-pw;
  py+=vy*dt;onG=false;
  for(i=0;i<solids.length;i++){s=solids[i];
    if(hitRect(s)){
      if(vy>0){py=s.y-ph;vy=0;onG=true}
      else if(vy<0){py=s.y+s.h;vy=0}
    }}
  if(keys.J&&!jHeld&&onG){vy=-560;onG=false}
}
function update(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  if(bannerT>0)bannerT-=dt;
  if(mode!=='play')return;
  playT+=dt;
  physics(dt);
  if(py>H+80){
    burst(px+pw/2,H-8,'#ff5c5c',10);
    px=6;py=294;vx=0;vy=0;
  }
  if(px+pw>door.x&&px<door.x+door.w&&py+ph>door.y&&py<door.y+door.h){
    if(clearT===0)clearT=playT;
    burst(door.x+door.w/2,door.y+door.h/2,'#4cc9f0',16);
    $i('ovt').textContent='抵达终点!';
    $i('ovp').innerHTML='你自己的关卡被自己通关了!<br>用时:<b>'+playT.toFixed(1)+' 秒</b><br>方块数:<b>'+countTiles()+'</b><br>返回编辑继续打磨,或再来一次冲刺更快纪录!';
    $i('obtn').textContent='返回编辑';
    $i('overlay').classList.remove('hide');
    stopPlay();
  }
  hud();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawMarker(){
  ctx.fillStyle='#8fd3ff';
  rr(6,294,22,26,6);ctx.fill();
  ctx.fillStyle='#081226';
  ctx.fillRect(12,301,4,5);ctx.fillRect(20,301,4,5);
  ctx.fillStyle='#c3c9e8';ctx.font='11px system-ui';ctx.textAlign='left';
  ctx.fillText('出发',2,286);
  ctx.fillStyle='#b388ff';
  rr(door.x,door.y,door.w,door.h,6);ctx.fill();
  ctx.fillStyle='#1a1f36';
  ctx.beginPath();ctx.arc(door.x+door.w/2,door.y+door.h/2,7,0,6.28);ctx.fill();
  ctx.fillStyle='#c3c9e8';ctx.textAlign='right';
  ctx.fillText('终点',door.x+door.w,H-6);
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141a38');g.addColorStop(1,'#0c1026');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  if(mode==='edit'){
    ctx.strokeStyle='rgba(143,163,217,.14)';ctx.lineWidth=1;
    for(i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke()}
    for(i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(W,i*CELL);ctx.stroke()}
    ctx.fillStyle='#4a5688';
    for(i=0;i<grid.length;i++)if(grid[i])rr((i%COLS)*CELL+1,Math.floor(i/COLS)*CELL+1,CELL-2,CELL-2,5),ctx.fill();
    drawMarker();
    ctx.fillStyle='#9aa3c0';ctx.font='12px system-ui';ctx.textAlign='center';
    ctx.fillText('点击 / 拖动 放置 · 再点一次擦除',W/2,20);
  }else{
    for(i=0;i<solids.length;i++){var s=solids[i];
      ctx.fillStyle='#2b3358';rr(s.x,s.y,s.w,s.h,4);ctx.fill();
      ctx.fillStyle='#4a5688';ctx.fillRect(s.x+2,s.y,s.w-4,3);
    }
    ctx.fillStyle='#b388ff';
    rr(door.x,door.y,door.w,door.h,6);ctx.fill();
    ctx.globalAlpha=0.25+0.15*Math.sin(Date.now()*0.006);
    ctx.beginPath();ctx.arc(door.x+door.w/2,door.y+door.h/2,34,0,6.28);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#8fd3ff';
    rr(px,py,pw,ph,6);ctx.fill();
    ctx.fillStyle='#081226';
    ctx.fillRect(px+pw*0.28,py+7,4,5);
    ctx.fillRect(px+pw*0.62,py+7,4,5);
  }
  for(i=0;i<parts.length;i++){var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2.4);
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(bannerT>0){
    ctx.globalAlpha=Math.min(1,bannerT);
    ctx.fillStyle='rgba(15,18,32,.55)';ctx.fillRect(0,H/2-34,W,68);
    ctx.fillStyle='#ffd166';ctx.font='bold 20px system-ui';ctx.textAlign='center';
    ctx.fillText('至少放 3 块方块才能试玩',W/2,H/2+7);
    ctx.globalAlpha=1;
  }
}
function canvasPos(e){
  var rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*(W/rect.width),y:(e.clientY-rect.top)*(H/rect.height)};
}
cv.addEventListener('pointerdown',function(e){
  if(mode!=='edit')return;
  e.preventDefault();
  var pt=canvasPos(e);
  var c=Math.floor(pt.x/CELL),r=Math.floor(pt.y/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  if(r===7&&(c===0||c===11))return;
  if(r===8&&(c===0||c===11))return;
  painting=true;
  paintVal=grid[r*COLS+c]===1?0:1;
  grid[r*COLS+c]=paintVal;
  save();hud();
});
cv.addEventListener('pointermove',function(e){
  if(mode!=='edit'||!painting)return;
  e.preventDefault();
  var pt=canvasPos(e);
  var c=Math.floor(pt.x/CELL),r=Math.floor(pt.y/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  if(r===7&&(c===0||c===11))return;
  if(r===8&&(c===0||c===11))return;
  if(grid[r*COLS+c]!==paintVal){grid[r*COLS+c]=paintVal;save();hud()}
});
window.addEventListener('pointerup',function(){painting=false});
function bindBtn(id,prop){
  var b=$i(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[prop]=true});
  b.addEventListener('pointerup',function(e){e.preventDefault();keys[prop]=false});
  b.addEventListener('pointercancel',function(){keys[prop]=false});
  b.addEventListener('pointerleave',function(){keys[prop]=false});
}
bindBtn('bL','L');bindBtn('bR','R');bindBtn('bJ','J');
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=true;
  if(e.code==='Space'||e.code==='ArrowUp')e.preventDefault();
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=false;
});
$i('tPlay').addEventListener('click',function(){
  if(mode==='edit')startPlay();else stopPlay();
});
$i('tDemo').addEventListener('click',function(){
  blank();stamp(SAMPLE);save();hud();
});
$i('tClr').addEventListener('click',function(){
  blank();save();hud();
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  running=true;hud();
});
restore();
$i('padRow').style.display='none';
hud();
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  jHeld=keys.J;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

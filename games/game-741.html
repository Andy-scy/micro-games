<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钢铁防线</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#stage{position:relative}
canvas{display:block;background:#10142a;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:24px;margin-top:8px;user-select:none;-webkit-user-select:none;align-items:center}
#dpad{display:grid;grid-template-areas:". u ." "l d r";gap:6px}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pbtn.fire{width:84px;height:84px;border-radius:50%;font-size:16px;font-weight:700;background:#5a2a2a;border-color:#8a4444}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>钢铁防线</h1>
<div id="hud"><span>分数 <b id="hA">0</b></span><span>生命 <b id="hB">3</b></span><span>波次 <b id="hC">1/3</b></span><span>残敌 <b id="hD">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>钢铁防线</h2>
  <p id="ovP">方向键 / WASD 移动,空格或 J 开火。<br>敌军分 3 波进攻,守住底部基地金鹰!<br>砖墙可被摧毁,钢墙无法击穿。</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="pbtn" data-k="ArrowUp" style="grid-area:u">▲</div>
    <div class="pbtn" data-k="ArrowLeft" style="grid-area:l">◀</div>
    <div class="pbtn" data-k="ArrowDown" style="grid-area:d">▼</div>
    <div class="pbtn" data-k="ArrowRight" style="grid-area:r">▶</div>
  </div>
  <div class="pbtn fire" data-k="Space">开火</div>
</div>
<script>
"use strict";
const TS=32,COLS=15,ROWS=13;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hA=document.getElementById('hA'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD');
const MAP=[
"...............",
".BB.BB...BB.BB.",
".BB.BB...BB.BB.",
".BB.BB.S.BB.BB.",
"...............",
"BB.BB.BSB.BB.BB",
"BB.BB...B.BB.BB",
"...BB.....BB...",
"...BB.....BB...",
"....S.....S....",
"...............",
"..BB..BBB..BB..",
"......BEB......"
];
const WAVES=[{n:6,f:0,h:0},{n:8,f:3,h:1},{n:11,f:4,h:3}];
let grid,score,lives,wave,spawnLeft,fastLeft,heavyLeft,spawned,player,enemies,bullets,parts,floats,banner,bannerT,spawnT,frame=0,state='start';
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function buildGrid(){return MAP.map(r=>r.split('').map(c=>c==='B'?1:(c==='S'?2:(c==='E'?3:0))));}
function mkTank(x,y,dir,kind){
  const spd=kind==='p'?1.5:(kind==='h'?0.8:(kind==='f'?1.9:1.2));
  return {x:x,y:y,dir:dir,kind:kind,spd:spd,hp:kind==='h'?3:1,cd:40+Math.random()*40,think:Math.random()*50,inv:kind==='p'?110:0};
}
function rectVsGrid(x,y){
  if(x<0||y<0||x+28>cv.width||y+28>cv.height)return true;
  const x0=Math.floor(x/TS),y0=Math.floor(y/TS),x1=Math.floor((x+27)/TS),y1=Math.floor((y+27)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(grid[ty][tx]!==0)return true;}
  return false;
}
function allTanks(){const a=[];if(player)a.push(player);for(const e of enemies)a.push(e);return a;}
function tankOverlap(x,y,self){
  for(const t of allTanks()){if(t===self)continue;if(Math.abs(t.x-x)<27&&Math.abs(t.y-y)<27)return true;}
  return false;
}
function moveTank(t,d){
  if(t.dir!==d){
    if(t.dir%2!==d%2){
      if(d%2===0)t.x=Math.round((t.x-2)/TS)*TS+2;else t.y=Math.round((t.y-2)/TS)*TS+2;
    }
    t.dir=d;
  }
  const v=DIRS[d],nx=t.x+v[0]*t.spd,ny=t.y+v[1]*t.spd;
  if(!rectVsGrid(nx,ny)&&!tankOverlap(nx,ny,t)){t.x=nx;t.y=ny;}
}
function fire(t,from){
  const v=DIRS[t.dir];
  bullets.push({x:t.x+14+v[0]*17-3,y:t.y+14+v[1]*17-3,vx:v[0]*5,vy:v[1]*5,from:from,life:220});
}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20+Math.random()*15,max:34,c:c||'#ffb050'});}
function floatTxt(x,y,txt){floats.push({x:x,y:y,txt:txt,life:40});}
function initGame(){
  grid=buildGrid();score=0;lives=3;wave=0;enemies=[];bullets=[];parts=[];floats=[];
  banner='第 1 波';bannerT=90;spawnT=50;spawned=0;
  spawnLeft=WAVES[0].n;fastLeft=WAVES[0].f;heavyLeft=WAVES[0].h;
  player=mkTank(7*TS+2,10*TS+2,0,'p');
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function updPlayer(){
  if(!player)return;
  let d=-1;
  if(keys.ArrowUp||keys.KeyW)d=0;else if(keys.ArrowRight||keys.KeyD)d=1;
  else if(keys.ArrowDown||keys.KeyS)d=2;else if(keys.ArrowLeft||keys.KeyA)d=3;
  if(d>=0)moveTank(player,d);
  if(player.inv>0)player.inv--;
  player.cd--;
  if((keys.Space||keys.KeyJ)&&player.cd<=0){
    let n=0;for(const b of bullets)if(b.from==='p')n++;
    if(n<2){fire(player,'p');player.cd=18;}
  }
}
function chooseDir(e){
  const r=Math.random();
  if(r<0.4&&player){
    e.dir=Math.abs(player.x-e.x)>Math.abs(player.y-e.y)?(player.x>e.x?1:3):(player.y>e.y?2:0);
  }else if(r<0.65){
    e.dir=7*TS+2-e.x>0?1:3;
  }else if(r<0.85){
    e.dir=12*TS-e.y>0?2:0;
  }else e.dir=Math.floor(Math.random()*4);
}
function updEnemies(){
  for(const e of enemies){
    e.think--;e.cd--;
    const bx=e.x,by=e.y;
    moveTank(e,e.dir);
    if(e.think<=0){chooseDir(e);e.think=30+Math.random()*60;}
    if(e.x===bx&&e.y===by){chooseDir(e);e.think=20+Math.random()*40;}
    if(e.cd<=0){
      let want=Math.random()<0.02;
      if(player&&Math.abs(e.x-player.x)<12){e.dir=player.y>e.y?2:0;want=true;}
      else if(player&&Math.abs(e.y-player.y)<12){e.dir=player.x>e.x?1:3;want=true;}
      if(want){fire(e,'e');e.cd=55+Math.random()*60;}else e.cd=12;
    }
  }
}
function updSpawns(){
  if(spawnLeft<=0)return;
  spawnT--;
  if(spawnT>0||enemies.length>=4)return;
  spawnT=140;
  const pts=[[0,0],[7,0],[14,0]];
  for(const p of pts){
    const px=p[0]*TS+2,py=p[1]*TS+2;
    if(!rectVsGrid(px,py)&&!tankOverlap(px,py,null)){
      spawned++;spawnLeft--;
      let kind='e';
      if(heavyLeft>0&&spawned%5===0){kind='h';heavyLeft--;}
      else if(fastLeft>0&&spawned%3===2){kind='f';fastLeft--;}
      enemies.push(mkTank(px,py,2,kind));
      return;
    }
  }
}
function removeEnemy(e){
  const i=enemies.indexOf(e);
  if(i>=0)enemies.splice(i,1);
}
function addScore(e){
  const v=e.kind==='h'?300:(e.kind==='f'?150:100);
  score+=v;floatTxt(e.x+4,e.y,'+'+v);
  boom(e.x+14,e.y+14,12,'#ffb050');
}
function killPlayer(){
  boom(player.x+14,player.y+14,16,'#7fe08a');
  lives--;
  if(lives<=0){player=null;end(false,'坦克部队全军覆没,基地失守!');return;}
  player.x=7*TS+2;player.y=10*TS+2;player.dir=0;player.inv=130;player.cd=40;
}
function end(win,msg){
  state=win?'win':'over';
  ov.children[0].textContent=win?'任务完成!':'游戏结束';
  ovP.innerHTML=msg+'<br>最终得分:'+score;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function updBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let dead=false;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0)dead=true;
    if(b.x<0||b.y<0||b.x+6>cv.width||b.y+6>cv.height)dead=true;
    if(!dead){
      const tx=Math.floor((b.x+3)/TS),ty=Math.floor((b.y+3)/TS);
      if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){
        const t=grid[ty][tx];
        if(t===1){grid[ty][tx]=0;dead=true;boom(b.x+3,b.y+3,4,'#d08a50');}
        else if(t===2){dead=true;boom(b.x+3,b.y+3,3,'#cfd6ee');}
        else if(t===3&&b.from==='e'){dead=true;baseDown();}
        else if(t===3)dead=true;
      }
    }
    if(!dead){
      if(b.from==='e'){
        if(player&&player.inv<=0&&Math.abs(b.x+3-(player.x+14))<16&&Math.abs(b.y+3-(player.y+14))<16){dead=true;killPlayer();}
      }else{
        for(const e of enemies){
          if(Math.abs(b.x+3-(e.x+14))<16&&Math.abs(b.y+3-(e.y+14))<16){
            dead=true;e.hp--;
            if(e.hp<=0){removeEnemy(e);addScore(e);}else boom(b.x+3,b.y+3,4,'#ffb050');
            break;
          }
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
function baseDown(){
  boom(7*TS+16,12*TS+16,24,'#ffd76a');
  end(false,'基地金鹰被摧毁!');
}
function checkWave(){
  if(spawnLeft>0||enemies.length>0)return;
  if(wave>=WAVES.length-1){end(true,'三波敌军全部被歼灭!');return;}
  wave++;
  const w=WAVES[wave];
  spawnLeft=w.n;fastLeft=w.f;heavyLeft=w.h;spawned=0;
  banner='第 '+(wave+1)+' 波来袭!';bannerT=110;spawnT=70;
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=0.6;f.life--;if(f.life<=0)floats.splice(i,1);}
}
function updHud(){
  hA.textContent=score;hB.textContent=lives;
  hC.textContent=(wave+1)+'/'+WAVES.length;
  hD.textContent=enemies.length+spawnLeft;
}
function drawTile(t,X,Y){
  if(t===1){
    ctx.fillStyle='#8a4a28';ctx.fillRect(X,Y,TS,TS);
    ctx.fillStyle='#5c2f18';ctx.fillRect(X,Y+15,TS,2);ctx.fillRect(X,Y+31,TS,1);
    ctx.fillStyle='#a55c32';
    ctx.fillRect(X+1,Y+1,14,13);ctx.fillRect(X+17,Y+1,14,13);
    ctx.fillRect(X+1,Y+17,6,13);ctx.fillRect(X+9,Y+17,14,13);ctx.fillRect(X+25,Y+17,6,13);
  }else if(t===2){
    ctx.fillStyle='#6b7694';ctx.fillRect(X+1,Y+1,TS-2,TS-2);
    ctx.fillStyle='#9aa6c4';ctx.fillRect(X+5,Y+5,TS-10,TS-10);
    ctx.fillStyle='#c8d2ea';ctx.fillRect(X+8,Y+8,8,8);
  }else if(t===3){
    ctx.fillStyle='#3a3020';ctx.fillRect(X,Y,TS,TS);
    ctx.fillStyle='#e8b83a';ctx.fillRect(X+7,Y+8,18,17);
    ctx.fillStyle='#8a6a1a';
    ctx.fillRect(X+10,Y+12,12,4);ctx.fillRect(X+14,Y+16,4,8);
  }
}
function drawTank(t){
  if(!t)return;
  if(t.inv>0&&frame%6<3)return;
  const cs=t.kind==='p'?'#5fbf68':(t.kind==='f'?'#e0a94e':(t.kind==='h'?'#c46a6a':'#8fa0c8'));
  const x=t.x,y=t.y;
  ctx.fillStyle='#171b2e';ctx.fillRect(x,y,28,28);
  ctx.fillStyle=cs;ctx.fillRect(x+4,y+4,20,20);
  const c=x+14;
  ctx.fillStyle='#12152a';
  if(t.dir===0)ctx.fillRect(c-2,y,4,14);
  else if(t.dir===1)ctx.fillRect(c,y+12,14,4);
  else if(t.dir===2)ctx.fillRect(c-2,y+14,4,14);
  else ctx.fillRect(x,y+12,14,4);
  ctx.fillStyle=cs;ctx.fillRect(x+9,y+9,10,10);
  if(t.kind==='h'&&t.hp<3){
    ctx.fillStyle='#401818';ctx.fillRect(x+2,y-5,24,3);
    ctx.fillStyle='#e05555';ctx.fillRect(x+2,y-5,24*t.hp/3,3);
  }
}
function draw(){
  ctx.fillStyle='#10142a';ctx.fillRect(0,0,cv.width,cv.height);
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++)drawTile(grid[ty][tx],tx*TS,ty*TS);
  for(const e of enemies)drawTank(e);
  drawTank(player);
  for(const b of bullets){
    ctx.fillStyle=b.from==='p'?'#ffe9a0':'#ff9d6a';
    ctx.fillRect(b.x,b.y,6,6);
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(p.life/p.max,0);
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  ctx.font='bold 13px system-ui';ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=Math.min(f.life/20,1);
    ctx.fillStyle='#ffd76a';ctx.fillText(f.txt,f.x+10,f.y);
  }
  ctx.globalAlpha=1;
  if(bannerT>0&&banner){
    ctx.globalAlpha=Math.min(bannerT/40,1);
    ctx.fillStyle='#ffd76a';ctx.font='bold 26px system-ui';
    ctx.fillText(banner,cv.width/2,cv.height/2-10);
    ctx.globalAlpha=1;
  }
}
function loop(){requestAnimationFrame(loop);if(state==='play'){frame++;updPlayer();updEnemies();updBullets();updSpawns();checkWave();updParts();if(bannerT>0)bannerT--;updHud();}draw();}
initGame();
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫兵巡逻</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f87171;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#f87171;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f87171}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f87171;color:#3d0606;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>卫兵巡逻</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 别碰红衣卫兵,逃向绿色出口</p>
  <div class="hud">
    <span>巡逻卫兵 <b>3</b></span>
    <span>用时 <b id="time">0.0s</b></span>
    <span>最快逃脱 <b id="best">--</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">卫兵巡逻</h2>
      <p id="ovDesc">这座迷宫由 3 名红衣卫兵看守,他们沿走廊来回巡逻、越走越远。一旦相撞就会被当场抓住!观察他们的路线,借死角迂回,抵达右下角的绿色出口即可逃脱。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">潜入迷宫</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
function $(id){return document.getElementById(id);}
var elTime=$("time"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s265");
var state="menu";
var grid,player,exitCell,guards,elapsed,pulse;

function loadBest(k){try{return parseFloat(localStorage.getItem(k)||"0")||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function bfs(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function guardNext(g){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]],opts=[],i,j;
  for(i=0;i<4;i++){
    var nx=g.x+dirs[i][0],ny=g.y+dirs[i][1];
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
    if(grid[ny][nx]===1)continue;
    if(nx===g.px&&ny===g.py)continue;
    opts.push({x:nx,y:ny});
  }
  if(!opts.length){opts.push({x:g.px,y:g.py});}
  var pick=opts[(Math.random()*opts.length)|0];
  g.px=g.x;g.py=g.y;
  g.nx=pick.x;g.ny=pick.y;
}
function reset(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dist=bfs(1,1),cells=[],x,y;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]===0&&dist[y][x]>=9&&!(x===exitCell.x&&y===exitCell.y))cells.push({x:x,y:y});
  }
  guards=[];
  var guard=0;
  while(guards.length<3&&cells.length&&guard<400){
    guard++;
    var i=(Math.random()*cells.length)|0,c=cells[i],bad=false,j;
    for(j=0;j<guards.length;j++)if(guards[j].x===c.x&&guards[j].y===c.y)bad=true;
    if(!bad){
      guards.push({x:c.x,y:c.y,px:c.x,py:c.y,nx:c.x,ny:c.y,prog:0,spd:2.6+Math.random()*0.8});
      guardNext(guards[guards.length-1]);
    }
    cells.splice(i,1);
  }
  elapsed=0;pulse=0;
  updateHud();
}
function updateHud(){
  elBest.textContent=best>0?best.toFixed(1)+"s":"--";
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  if(nx===exitCell.x&&ny===exitCell.y)win();
}
function guardPos(g){
  return {x:g.x+(g.nx-g.x)*g.prog,y:g.y+(g.ny-g.y)*g.prog};
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||elapsed<best){best=elapsed;saveBest("mg_s265",best);isNew=true;}
  ovTitle.textContent="逃脱成功!";
  ovDesc.textContent=isNew?"新纪录!你在卫兵眼皮底下溜了出去。":"趁卫兵转身,你已经消失在出口的绿光里。";
  ovScore.style.display="block";
  ovScore.textContent="用时 "+elapsed.toFixed(1)+"s · 最快逃脱 "+(best>0?best.toFixed(1)+"s":"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function lose(){
  state="over";
  ovTitle.textContent="被抓住了!";
  ovDesc.textContent="红衣卫兵一把揪住了你。观察他们的巡逻节奏,从背后的死角绕过去。";
  ovScore.style.display="block";
  ovScore.textContent="坚持了 "+elapsed.toFixed(1)+"s";
  btnGo.textContent="再试一次";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#232a4d";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#2c3560";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
  var pr=8+Math.sin(pulse)*2;
  ctx.fillStyle="#4ade80";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle="#67e8f9";
  ctx.shadowColor="#22d3ee";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  for(i=0;i<guards.length;i++){
    var gp=guardPos(guards[i]);
    var gx=gp.x*CELL+CELL/2,gy=gp.y*CELL+CELL/2;
    var dx=gx-px,dy=gy-py;
    var near=Math.max(0,1-Math.sqrt(dx*dx+dy*dy)/(CELL*4));
    if(near>0){
      ctx.strokeStyle="rgba(248,113,113,"+(0.12+near*0.25).toFixed(3)+")";
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(gx,gy,CELL/2+4,0,Math.PI*2);ctx.stroke();
      ctx.lineWidth=1;
    }
    ctx.fillStyle="#f87171";
    var s=CELL-8;
    if(gx<0.5)gx=0.5;
    ctx.fillRect(gx-s/2,gy-s/2,s,s);
    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.arc(gx-3.5,gy-2,2,0,Math.PI*2);
    ctx.arc(gx+3.5,gy-2,2,0,Math.PI*2);
    ctx.fill();
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT)/1000;lastT=t;
  pulse+=dt*3;
  if(state==="playing"){
    elapsed+=dt;
    elTime.textContent=elapsed.toFixed(1)+"s";
    var i;
    for(i=0;i<guards.length;i++){
      var g=guards[i];
      g.prog+=g.spd*dt;
      while(g.prog>=1){
        g.prog-=1;
        g.x=g.nx;g.y=g.ny;
        guardNext(g);
      }
      var gp=guardPos(g);
      var gx=gp.x,gy=gp.y;
      var ddx=gx-player.x,ddy=gy-player.y;
      if(Math.sqrt(ddx*ddx+ddy*ddy)<0.62){lose();break;}
    }
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

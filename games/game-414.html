<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>镜影叠塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:21px;margin:4px 0 2px;color:#66d9e8}
.hint{font-size:13px;color:#9aa3c0;margin-bottom:6px;text-align:center;line-height:1.5}
#cv{background:#141933;border-radius:14px;max-width:100%;touch-action:none}
.ov{position:fixed;inset:0;background:rgba(8,10,22,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1b2040;border:1px solid #2e3660;border-radius:16px;padding:24px 28px;text-align:center;max-width:86%}
.card h2{color:#66d9e8;margin-bottom:10px;font-size:22px}
.card p{font-size:14px;color:#c3cae6;margin-bottom:8px;line-height:1.7}
.card .sc{font-size:17px;color:#7ee0a3}
button{margin-top:8px;background:#66d9e8;color:#141933;border:none;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>镜影叠塔</h1>
<p class="hint">左右两块镜像滑行(速度略不同)· 一键同锁,越对称越稳,点击或空格</p>
<canvas id="cv" width="420" height="640"></canvas>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">镜影叠塔</h2><p id="ovM">左右两个滑块像照镜子一样移动,但右侧速度稍快,相位会悄悄错开!<br>一键同时锁定两块:位置越接近镜像对称,失衡槽越少;<br>失衡槽满塔就塌。两侧还各自保留切割叠法,接空即输。</p><p class="sc" id="ovS"></p><button id="ovB">开始游戏</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovM=document.getElementById('ovM'),ovS=document.getElementById('ovS'),ovB=document.getElementById('ovB');
var W=cv.width,H=cv.height,GROUND=560,BH=22;
var towers,lb,rb,fx,pops,score,state='ready',cam=0,imbalance;

function layerC(i){return 'hsl('+((i*14+185)%360)+',55%,58%)';}
function topL(){var t=towers[0];return t[t.length-1];}
function topR(){var t=towers[1];return t[t.length-1];}
function reset(){
  towers=[[{x:115,w:120}],[{x:305,w:120}]];
  lb={x:50,dir:1,spd:2.0};rb={x:W-50,dir:-1,spd:2.0*1.07};
  score=0;fx=[];pops=[];cam=0;imbalance=0;
}
function pop(txt,x,y,c){pops.push({t:txt,x:x,y:y,c:c||'#66d9e8',life:1});}
function slicePair(){
  var tl=topL(),tr=topR(),n=towers[0].length;
  var byY=GROUND-(n+1)*BH+BH/2;
  var dl=lb.x-tl.x,adl=Math.abs(dl),ovl=tl.w-adl;
  var dr=rb.x-tr.x,adr=Math.abs(dr),ovr=tr.w-adr;
  if(ovl<=0||ovr<=0){
    if(ovl<=0)fx.push({x:lb.x,y:byY,w:lb.w,vx:-90,vy:-60,rot:0,vr:-2.4,life:1.5,c:layerC(n)});
    if(ovr<=0)fx.push({x:rb.x,y:byY,w:rb.w,vx:90,vy:-60,rot:0,vr:2.4,life:1.5,c:layerC(n)});
    finish();return;
  }
  var nlx,nlw;
  if(adl<=6){nlx=tl.x;nlw=tl.w;score+=8;}
  else{
    score+=5;
    var cl=lb.x-lb.w/2,cr=lb.x+lb.w/2,tll=tl.x-tl.w/2,trl=tl.x+tl.w/2;
    var ol=Math.max(cl,tll),orr=Math.min(cr,trl);
    nlx=(ol+orr)/2;nlw=orr-ol;
    var pw=dl>0?cr-trl:tll-cl,px=dl>0?(trl+cr)/2:(tll+cl)/2;
    if(pw>1)fx.push({x:px,y:byY,w:pw,vx:dl>0?-130:130,vy:-40,rot:0,vr:dl>0?-2.6:2.6,life:1.5,c:layerC(n)});
  }
  var nrx,nrw;
  if(adr<=6){nrx=tr.x;nrw=tr.w;score+=8;}
  else{
    score+=5;
    var c2l=rb.x-rb.w/2,c2r=rb.x+rb.w/2,t2l=tr.x-tr.w/2,t2r=tr.x+tr.w/2;
    var o2l=Math.max(c2l,t2l),o2r=Math.min(c2r,t2r);
    nrx=(o2l+o2r)/2;nrw=o2r-o2l;
    var pw2=dr>0?c2r-t2r:t2l-c2l,px2=dr>0?(t2r+c2r)/2:(t2l+c2l)/2;
    if(pw2>1)fx.push({x:px2,y:byY,w:pw2,vx:dr>0?130:-130,vy:-40,rot:0,vr:dr>0?2.6:-2.6,life:1.5,c:layerC(n)});
  }
  towers[0].push({x:nlx,w:nlw});
  towers[1].push({x:nrx,w:nrw});
  var err=Math.abs(W-(lb.x+rb.x));
  if(err<10){
    imbalance=Math.max(0,imbalance-14);score+=30;
    pop('完美镜像 +30',210,byY-14,'#7ee0a3');
  }else{
    imbalance+=err*0.12;score+=5;
    pop('偏斜 +'+err.toFixed(0),210,byY-14,'#ffa94d');
  }
  if(imbalance>=100){finish();return;}
  var tot=towers[0].length-1;
  lb.spd=2.0+tot*0.05;rb.spd=lb.spd*1.07;
}
function finish(){
  state='over';
  var h=towers[0].length-1;
  window.setTimeout(function(){
    ovT.textContent='镜影破碎!';
    ovS.textContent='塔高 '+h+' 层 · 得分 '+score;
    ovM.textContent='盯着两侧的相对位置,在它们互为倒影的那一刻出手';
    ovB.textContent='再来一局';
    ov.style.display='flex';
  },650);
}
function start(){reset();state='play';ov.style.display='none';}
function step(dt){
  if(state==='play'){
    lb.x+=lb.spd*lb.dir*dt*60;
    rb.x+=rb.spd*rb.dir*dt*60;
    if(lb.x<50){lb.x=50;lb.dir=1;}if(lb.x>210){lb.x=210;lb.dir=-1;}
    if(rb.x<210){rb.x=210;rb.dir=1;}if(rb.x>W-50){rb.x=W-50;rb.dir=-1;}
  }
  var i;
  for(i=fx.length-1;i>=0;i--){var f=fx[i];f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var p=pops[i];p.life-=dt;p.y-=34*dt;if(p.life<=0)pops.splice(i,1);}
  cam=Math.max(0,300-(GROUND-towers[0].length*BH));
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#132d33');g.addColorStop(1,'#0f1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var gy=GROUND-cam;
  ctx.fillStyle='#1d2447';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2e3660';ctx.fillRect(0,gy,W,5);
  var i,k,b,y;
  ctx.strokeStyle='rgba(102,217,232,.25)';ctx.lineWidth=1;ctx.setLineDash([5,9]);
  ctx.beginPath();ctx.moveTo(210,40);ctx.lineTo(210,gy);ctx.stroke();ctx.setLineDash([]);
  for(k=0;k<2;k++){
    var arr=towers[k],n=arr.length;
    for(i=0;i<n;i++){
      b=arr[i];y=GROUND-(n-i)*BH-cam;
      if(y<-BH||y>H)continue;
      ctx.fillStyle=layerC(i);rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(b.x-b.w/2+4,y+5,Math.max(0,b.w-8),4);
    }
  }
  if(state==='play'){
    y=GROUND-(towers[0].length+1)*BH-cam;
    ctx.fillStyle=layerC(towers[0].length);rr(lb.x-lb.w/2,y+2,lb.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';rr(lb.x-lb.w/2,y+2,lb.w,BH-4,5);ctx.stroke();
    ctx.fillStyle=layerC(towers[1].length);rr(rb.x-rb.w/2,y+2,rb.w,BH-4,5);ctx.fill();
    rr(rb.x-rb.w/2,y+2,rb.w,BH-4,5);ctx.stroke();
  }
  for(i=0;i<fx.length;i++){
    var f=fx[i];ctx.save();ctx.translate(f.x,f.y-cam);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.c;ctx.fillRect(-f.w/2,-(BH-4)/2,f.w,BH-4);ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,14,32);
  ctx.textAlign='right';ctx.fillText('高度 '+(towers[0].length-1)+' 层',W-14,32);
  ctx.fillStyle='#2e3660';rr(90,46,240,12,6);ctx.fill();
  ctx.fillStyle=imbalance>70?'#ff6b6b':'#66d9e8';rr(92,48,Math.max(3,236*Math.min(1,imbalance/100)),8,4);ctx.fill();
  ctx.fillStyle='#9aa3c0';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('失衡槽',210,76);
  for(i=0;i<pops.length;i++){var p=pops[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y-cam);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function tap(){if(state==='play')slicePair();}
if(window.PointerEvent){cv.addEventListener('pointerdown',function(e){e.preventDefault();tap();});}
else{cv.addEventListener('mousedown',function(){tap();});cv.addEventListener('touchstart',function(e){e.preventDefault();tap();});}
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowDown'||e.key===' '){e.preventDefault();tap();}});
ovB.addEventListener('click',start);
reset();
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,0.033);if(dt<0)dt=0;last=ts;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

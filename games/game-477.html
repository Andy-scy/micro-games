<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>过热狂射</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fb7185;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fb7185;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fb7185}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#fb7185;color:#3d0a14;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>过热狂射</h1>
  <p class="hint">炮口自动跟随指针 · 点击 / 空格开火 · 炮管过热会卡壳 2 秒!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>时间 <b id="time">60</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>逃走 <b id="esc">0/8</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="420"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">过热狂射</h2>
      <p id="ovDesc">气球从右下角源源升起,指针指向哪炮口就转向哪,点击即射!
但每发炮弹都会加热炮管:热量涨到 100% 就卡壳 2 秒,要控制射击节奏。
气球逃出画面顶部 8 只就提前结束,连击越高单发分越多。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=420,GY=384,G=0.1;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elTime=$("time"),elCombo=$("combo"),elEsc=$("esc");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var CX=42,PIV=GY-12;
var state="menu",ang=45;
var balls=[],score=0,time=60000,heat=0,hot=false,fireCd=0,spawnT=30,combo=0,escapes=0,balloons=[],parts=[];
var COLORS=["#fb7185","#fbbf24","#60a5fa","#4ade80","#c084fc","#22d3ee"];
function rnd(a,b){return a+Math.random()*(b-a);}
function rad(d){return d*Math.PI/180;}
function muzzle(){var a=rad(ang);return{x:CX+Math.cos(a)*30,y:PIV-Math.sin(a)*30};}
function reset(){
  balls=[];score=0;time=60000;heat=0;hot=false;fireCd=0;spawnT=20;combo=0;escapes=0;balloons=[];parts=[];
  ang=45;hud();
}
function hud(){
  elScore.textContent=score;
  elTime.textContent=Math.max(0,Math.ceil(time/1000));
  elCombo.textContent=combo;
  elEsc.textContent=escapes+"/8";
}
function shoot(){
  if(state!=="playing"||hot||fireCd>0)return;
  fireCd=9;
  var m=muzzle(),a=rad(ang);
  balls.push({x:m.x,y:m.y,vx:Math.cos(a)*11.2,vy:-Math.sin(a)*11.2,t:0,hit:false});
  heat+=17;
  if(heat>=100){heat=100;hot=true;}
}
function boom(x,y,col,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-2.4,2.4),vy:rnd(-2.4,2.4),l:rnd(14,30),c:col});
}
function tick(){
  var i,k;
  if(fireCd>0)fireCd--;
  heat-=0.19;
  if(heat<0)heat=0;
  if(hot&&heat<=32)hot=false;
  time-=16.6;
  spawnT--;
  if(spawnT<=0&&balloons.length<8){
    balloons.push({x:rnd(120,465),y:GY+16,v:rnd(0.5,1.6),r:rnd(10,17),c:COLORS[(Math.random()*COLORS.length)|0],ph:rnd(0,6)});
    spawnT=(34+Math.random()*26)|0;
  }
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0)parts.splice(i,1);}
  for(i=balloons.length-1;i>=0;i--){
    var b=balloons[i];
    b.ph+=0.06;
    b.y-=b.v;
    b.x+=Math.sin(b.ph)*0.5;
    if(b.y<-24){
      balloons.splice(i,1);
      escapes++;combo=0;
      if(escapes>=8){hud();finish();return;}
    }
  }
  for(i=balls.length-1;i>=0;i--){
    var s=balls[i];
    s.t++;s.vy+=G;s.x+=s.vx;s.y+=s.vy;
    for(k=0;k<balloons.length;k++){
      var bl=balloons[k];
      if(Math.hypot(s.x-bl.x,s.y-bl.y)<bl.r+5){
        combo++;
        score+=40+Math.round(bl.r*2)+combo*8;
        boom(bl.x,bl.y,bl.c,12);
        balloons.splice(k,1);
        s.hit=true;
        break;
      }
    }
    if(s.hit||s.x>W+30||s.x<-30||s.y<-30||s.y>H+30||s.t>400)balls.splice(i,1);
  }
  hud();
  if(time<=0)finish();
}
function finish(){
  state="over";
  var rank=score>=1500?"炮王":(score>=900?"防空老兵":"新兵炮手");
  ovTitle.textContent="战斗结束 · "+rank;
  ovDesc.textContent="击落无数气球,总分 "+score+" 分。\n"+(escapes>=8?"8 只气球逃出了防线。":"守住节奏,别让炮管过热!");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  hud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawCannon(){
  ctx.fillStyle="#39406b";ctx.fillRect(CX-16,GY-6,32,6);
  ctx.save();ctx.translate(CX,PIV);ctx.rotate(-rad(ang));
  ctx.fillStyle=hot?"#f87171":"#8b93c8";rr(-8,-6,34,12,5);ctx.fill();
  ctx.restore();
  ctx.fillStyle="#6a74ad";ctx.beginPath();ctx.arc(CX,PIV,11,Math.PI,0);ctx.fill();
}
function drawHeat(){
  var bx=W-156,by=14,bw=140,bh=14;
  ctx.fillStyle="#20263f";rr(bx,by,bw,bh,7);ctx.fill();
  var col=hot?"#f87171":(heat>60?"#fb923c":"#4ade80");
  ctx.fillStyle=col;
  rr(bx+3,by+3,Math.max(2,(bw-6)*heat/100),bh-6,5);ctx.fill();
  ctx.fillStyle="#8b90b0";ctx.font="11px system-ui";ctx.textAlign="right";
  ctx.fillText(hot?"过热卡壳!":"炮管温度",W-16,by+30);
}
function draw(){
  var i;
  ctx.fillStyle="#10142a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1b2138";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#2a3154";ctx.fillRect(0,GY,W,3);
  for(i=0;i<balloons.length;i++){
    var b=balloons[i];
    ctx.strokeStyle="rgba(200,206,240,0.35)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(b.x,b.y+b.r);ctx.quadraticCurveTo(b.x+4,b.y+b.r+10,b.x,b.y+b.r+20);ctx.stroke();
    ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*1.15,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.45)";ctx.beginPath();ctx.ellipse(b.x-b.r*0.35,b.y-b.r*0.4,b.r*0.22,b.r*0.3,-0.5,0,Math.PI*2);ctx.fill();
  }
  drawCannon();
  for(i=0;i<balls.length;i++){ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(balls[i].x,balls[i].y,4,0,Math.PI*2);ctx.fill();}
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  ctx.globalAlpha=1;
  drawHeat();
  if(combo>=3){
    ctx.fillStyle="#fbbf24";ctx.font="bold 16px system-ui";ctx.textAlign="left";
    ctx.fillText("连击 x"+combo,16,32);
  }
}
var lastT=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing"){acc+=dt;var n=0;while(acc>=16.6&&n<4){acc-=16.6;n++;tick();}if(n===4)acc=0;}
  draw();
}
function aimAt(p){
  var r=cv.getBoundingClientRect();
  var mx=(p.clientX-r.left)*W/r.width,my=(p.clientY-r.top)*H/r.height;
  var dx=mx-CX,dy=PIV-my;
  if(dy<2)return;
  ang=Math.max(5,Math.min(85,Math.atan2(dy,dx)*180/Math.PI));
}
cv.addEventListener("mousemove",function(e){if(state==="playing")aimAt(e);});
cv.addEventListener("mousedown",function(e){if(state==="playing"){shoot();e.preventDefault();}});
cv.addEventListener("touchstart",function(e){if(state==="playing"){aimAt(e.changedTouches[0]);shoot();}e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",function(e){if(state==="playing")aimAt(e.changedTouches[0]);e.preventDefault();},{passive:false});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}return;}
  if(e.key===" "){e.preventDefault();shoot();}
});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

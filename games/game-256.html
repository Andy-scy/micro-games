<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星环侵蚀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:700px}
canvas{display:block;width:100%;background:#10142a;border-radius:14px}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#6bd6ff}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
button{background:#7c9cff;color:#10142a;border:0;border-radius:10px;padding:10px 24px;font-size:16px;font-family:inherit;cursor:pointer}
button:hover{background:#9ab1ff}
</style>
</head>
<body>
<h1>星环侵蚀</h1>
<div id="tip">单词沿星环环绕飞行并不断向核心收缩：完整打出即可击碎，撞上核心扣护盾</div>
<div id="hud"></div>
<div id="wrap">
<canvas id="cv" width="700" height="470"></canvas>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<button id="ovBtn">开始游戏</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var WORDS=["star","orbit","comet","lunar","solar","nova","gemini","cosmos","meteor","galaxy","nebula","quasar","pulsar","gravity","eclipse","asteroid","saturn","venus","mars","helios","ion","core","flux","ring","drift","spark","void","beam","dust","tail"];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var wrap=document.getElementById('wrap'),hud=document.getElementById('hud');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),btn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var words,buffer,target,score,shields,kills,spawnT,elapsed,shake,running,raf,tPrev,parts;
function fit(){var w=wrap.clientWidth||640;cv.width=w;cv.height=Math.max(340,Math.min(500,Math.round(w*0.6)));}
window.addEventListener('resize',fit);
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function hudUpd(){hud.textContent='得分 '+score+'　护盾 '+shields+'　击碎 '+kills+'　侵蚀时间 '+Math.round(elapsed)+'s';}
function reset(){words=[];buffer='';target=-1;score=0;shields=4;kills=0;spawnT=0.5;elapsed=0;shake=0;parts=[];hudUpd();}
function spawn(){
  var t=pick(WORDS);
  for(var k=0;k<words.length;k++){if(words[k].text===t)return;}
  var dir=Math.random()<0.5?1:-1;
  words.push({
    text:t,ang:rnd(0,Math.PI*2),
    r:Math.min(cv.width,cv.height)/2-40,
    w:dir*rnd(0.5,0.9),vr:rnd(8,14)+elapsed*0.35
  });
}
function boom(x,y,col){for(var i=0;i<12;i++)parts.push({x:x,y:y,vx:rnd(-110,110),vy:rnd(-110,110),life:rnd(.3,.6),c:col});}
function killWord(i){
  var wd=words[i],c=coreC();
  var x=c.x+Math.cos(wd.ang)*wd.r,y=c.y+Math.sin(wd.ang)*wd.r;
  score+=wd.text.length*10;kills++;
  boom(x,y,'#6bd6ff');
  words.splice(i,1);
  if(target===i){target=-1;buffer='';}else if(target>i)target--;
  hudUpd();
}
function coreC(){
  return {x:cv.width/2,y:cv.height/2};
}
function handleChar(ch){
  if(!running)return;
  if(ch==='\b')return;
  ch=ch.toLowerCase();
  if(!/^[a-z]$/.test(ch))return;
  var cand=-1;
  if(target>=0&&words[target]&&words[target].text.charAt(buffer.length)===ch)cand=target;
  if(cand<0){
    for(var i=0;i<words.length;i++){
      if(i!==target&&words[i].text.charAt(0)===ch){cand=i;break;}
    }
    if(cand>=0)buffer='';
  }
  if(cand<0){buffer='';target=-1;return;}
  target=cand;buffer+=ch;
  if(buffer===words[target].text)killWord(target);
}
function update(dt){
  elapsed+=dt;shake=Math.max(0,shake-dt*12);
  spawnT-=dt;
  if(spawnT<=0&&words.length<6){spawn();spawnT=Math.max(0.9,2.2-elapsed*0.04);}
  var c=coreC(),coreR=34;
  for(var i=words.length-1;i>=0;i--){
    var wd=words[i];
    wd.ang+=wd.w*dt;
    wd.r-=wd.vr*dt;
    if(wd.r<=coreR+10){
      boom(c.x,c.y,'#ff6b6b',20);
      words.splice(i,1);
      if(target===i){target=-1;buffer='';}else if(target>i)target--;
      shields--;shake=8;hudUpd();
      if(shields<=0){end(false);return;}
    }
  }
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0)parts.splice(j,1);
  }
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  var c=coreC();
  for(var g=1;g<=3;g++){
    ctx.strokeStyle='rgba(107,214,255,'+(0.05+g*0.03)+')';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(c.x,c.y,34+g*52,0,Math.PI*2);ctx.stroke();
  }
  var pulse=3*Math.sin(elapsed*3);
  ctx.fillStyle='#6bd6ff';
  ctx.beginPath();ctx.arc(c.x,c.y,34+pulse,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0f1220';
  ctx.font='bold 12px system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('核心',c.x,c.y+4);
  ctx.textAlign='left';
  ctx.font='bold 17px ui-monospace, Consolas, monospace';
  for(var i=0;i<words.length;i++){
    var wd=words[i];
    var x=c.x+Math.cos(wd.ang)*wd.r,y=c.y+Math.sin(wd.ang)*wd.r;
    var tw=wd.text.length*11+16;
    var danger=wd.r<110;
    ctx.fillStyle=danger?'rgba(255,107,107,.2)':'rgba(107,214,255,.14)';
    ctx.fillRect(x-tw/2,y-12,tw,24);
    if(i===target){ctx.strokeStyle='#ffd76a';ctx.lineWidth=2;ctx.strokeRect(x-tw/2,y-12,tw,24);}
    var done=(i===target)?buffer:'';
    var pre=wd.text.slice(0,done.length);
    ctx.fillStyle='#ffd76a';
    ctx.fillText(pre,x-tw/2+8,y+6);
    ctx.fillStyle=danger?'#ff8f8f':'#e8eaf6';
    ctx.fillText(wd.text.slice(done.length),x-tw/2+8+ctx.measureText(pre).width,y+6);
  }
  for(var j=0;j<parts.length;j++){
    var p=parts[j];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
function end(win){
  running=false;
  ovT.textContent=win?'星环净空':'核心被侵蚀';
  ovX.textContent='得分 '+score+'\n击碎 '+kills+' 个单词　坚守 '+Math.round(elapsed)+' 秒';
  btn.textContent='再来一局';
  ov.classList.remove('hide');
}
function start(){
  fit();reset();ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  wrap.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
bindTyping(handleChar);
btn.addEventListener('click',start);
fit();reset();
ovT.textContent='星环侵蚀';
ovX.textContent='单词贴着星环公转，同时轨道半径不断收缩，越到后期越快。\n完整打出一个单词即可在其撞上核心前击碎它。\n核心被撞一次扣 1 格护盾，共 4 格。';
btn.textContent='开始游戏';
})();
</script>
</body>
</html>

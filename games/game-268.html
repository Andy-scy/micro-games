<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千回巨廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#818cf8;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#818cf8;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#818cf8}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#818cf8;color:#171243;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>千回巨廊</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 41×41 巨型迷宫,视口随你滚动</p>
  <div class="hud">
    <span>步数 <b id="steps">0</b></span>
    <span>探索率 <b id="explored">0%</b></span>
    <span>用时 <b id="time">0.0s</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="460" height="460"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">千回巨廊</h2>
      <p id="ovDesc">一座 41×41 的巨型迷宫,镜头只展示你身边的一角,右上角的小地图会缓缓拼出你踩过的足迹。出口藏在迷宫深处,只有亲眼见过才会在地图上显现。把整座巨廊踩在脚下吧!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">步入巨廊</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=41,ROWS=41,CELL=24,W=460,H=460,WORLD=COLS*CELL;
function $(id){return document.getElementById(id);}
var elSteps=$("steps"),elExp=$("explored"),elTime=$("time");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s268");
var state="menu";
var grid,player,exitCell,seen,seenChannel,totalChannel,steps,elapsed,pulse,camX,camY;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function reset(){
  grid=genMaze(20,20);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  seen=[];
  var y,x;
  for(y=0;y<ROWS;y++)seen.push(new Array(COLS));
  totalChannel=0;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++)if(grid[y][x]===0)totalChannel++;
  seenChannel=0;steps=0;elapsed=0;pulse=0;
  camX=0;camY=0;
  markSeen();
  updateHud();
}
function markSeen(){
  var px=player.x,py=player.y,dx,dy;
  for(dy=-2;dy<=2;dy++)for(dx=-2;dx<=2;dx++){
    if(dx*dx+dy*dy>6.25)continue;
    var nx=px+dx,ny=py+dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
    if(!seen[ny][nx]&&grid[ny][nx]===0){seenChannel++;seen[ny][nx]=true;}
    else if(grid[ny][nx]===0)seen[ny][nx]=true;
  }
  updateHud();
}
function updateHud(){
  elSteps.textContent=steps;
  elExp.textContent=Math.round(seenChannel/totalChannel*100)+"%";
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  steps++;
  markSeen();
  if(nx===exitCell.x&&ny===exitCell.y)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||steps<best){best=steps;saveBest("mg_s268",best);isNew=true;}
  ovTitle.textContent="走出巨廊!";
  ovDesc.textContent=isNew?"新纪录!巨廊的每一条岔路都记住了你。":"在走了无数个弯之后,你终于看见了出口。";
  ovScore.style.display="block";
  ovScore.textContent="步数 "+steps+" · 探索率 "+Math.round(seenChannel/totalChannel*100)+"% · 用时 "+elapsed.toFixed(1)+"s · 最少步纪录 "+(best>0?best:"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function draw(){
  var x,y;
  ctx.clearRect(0,0,W,H);
  var x0=Math.max(0,Math.floor(camX/CELL)-1),y0=Math.max(0,Math.floor(camY/CELL)-1);
  var x1=Math.min(COLS-1,Math.ceil((camX+W)/CELL)),y1=Math.min(ROWS-1,Math.ceil((camY+H)/CELL));
  for(y=y0;y<=y1;y++)for(x=x0;x<=x1;x++){
    var sx=x*CELL-camX,sy=y*CELL-camY;
    if(grid[y][x]===1){
      var witness=seen[y][x];
      if(!witness){
        var ddx,ddy;
        for(ddy=-1;ddy<=1&&!witness;ddy++)for(ddx=-1;ddx<=1;ddx++){
          var wx=x+ddx,wy=y+ddy;
          if(wx<0||wy<0||wx>=COLS||wy>=ROWS)continue;
          if(grid[wy][wx]===0&&seen[wy][wx]){witness=true;break;}
        }
      }
      if(witness){
        ctx.fillStyle="#232a4d";
        ctx.fillRect(sx,sy,CELL,CELL);
        ctx.fillStyle="#2c3560";
        ctx.fillRect(sx,sy,CELL,3);
      }
    }else if(seen[y][x]){
      ctx.fillStyle="rgba(129,140,248,0.16)";
      ctx.fillRect(sx+1,sy+1,CELL-2,CELL-2);
    }
  }
  if(seen[exitCell.y][exitCell.x]){
    var ex=exitCell.x*CELL-camX+CELL/2,ey=exitCell.y*CELL-camY+CELL/2;
    var pr=8+Math.sin(pulse)*2;
    ctx.fillStyle="#4ade80";
    ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#05230f";
    ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("出",ex,ey);
  }
  var px=player.x*CELL-camX+CELL/2,py=player.y*CELL-camY+CELL/2;
  ctx.fillStyle="#a5b4fc";
  ctx.shadowColor="#818cf8";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
  var ms=3,mx=W-COLS*ms-8,my=8;
  ctx.fillStyle="rgba(8,10,22,0.82)";
  ctx.fillRect(mx-2,my-2,COLS*ms+4,ROWS*ms+4);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(!seen[y][x])continue;
    if(grid[y][x]===0){
      ctx.fillStyle="#4a5490";
      ctx.fillRect(mx+x*ms+1,my+y*ms+1,ms-1,ms-1);
    }
  }
  ctx.fillStyle="#ffffff";
  ctx.fillRect(mx+player.x*ms,my+player.y*ms,ms+1,ms+1);
  ctx.strokeStyle="#818cf8";
  ctx.strokeRect(mx-2,my-2,COLS*ms+4,ROWS*ms+4);
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  var tx=player.x*CELL+CELL/2-W/2,ty=player.y*CELL+CELL/2-H/2;
  tx=Math.max(0,Math.min(WORLD-W,tx));
  ty=Math.max(0,Math.min(WORLD-H,ty));
  camX+=(tx-camX)*Math.min(1,dt*0.008);
  camY+=(ty-camY)*Math.min(1,dt*0.008);
  if(state==="playing"){
    elapsed+=dt/1000;
    elTime.textContent=elapsed.toFixed(1)+"s";
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

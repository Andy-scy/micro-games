<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灼热躲避球</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#170f1d;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>灼热躲避球</h1>
<div id="tip">灼热的球在铁笼里横冲直撞!玩家1:WASD 移动 + F 冲刺(冲刺瞬间无敌)· 玩家2:方向键移动 + K 冲刺 · 被砸中扣 1 生命,之后球越来越快、越来越多 · 3 条命,最后存活者获胜</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">灼热躲避球</div><div id="ovS">一颗灼热的球在铁笼里弹来弹去,还会加速、增员<br>玩家1:WASD 移动,F 冲刺(冲刺瞬间无敌)· 玩家2:方向键移动,K 冲刺<br>被砸中扣 1 生命并短暂无敌;球每次命中后都会提速<br>3 条命,最后存活者获胜;同归于尽则平局</div><button id="ovB">开始躲避</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var keys={},st;
function mkP(i){return{x:i===0?120:600,y:240,vx:0,vy:0,fx:i===0?1:-1,fy:0,dash:0,inv:0,hp:3};}
function mkBall(){
 var a=Math.random()*6.2832,sp=3.2*st.mult;
 return{x:360,y:240,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp};
}
function reset(){
 st={ph:"count",cd:70,p:[mkP(0),mkP(1)],balls:[],spawnT:0,mult:1,time:0,flash:[0,0],nextBall:1400,note:"",noteT:0};
 st.balls.push(mkBall());
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function tryDash(i){
 var p=st.p[i];
 if(st.ph!=="play"||p.dash>0)return;
 p.vx+=p.fx*7.5;p.vy+=p.fy*7.5;p.dash=110;
 p.inv=Math.max(p.inv,14);
}
function moveP(i,dt){
 var p=st.p[i],ix=0,iy=0;
 if(i===0){if(keys["a"])ix--;if(keys["d"])ix++;if(keys["w"])iy--;if(keys["s"])iy++;}
 else{if(keys["arrowleft"])ix--;if(keys["arrowright"])ix++;if(keys["arrowup"])iy--;if(keys["arrowdown"])iy++;}
 if(ix!==0||iy!==0){var l=Math.hypot(ix,iy);p.fx=ix/l;p.fy=iy/l;}
 p.vx+=(ix*0.42-p.vx*0.2)*dt;p.vy+=(iy*0.42-p.vy*0.2)*dt;
 var v=Math.hypot(p.vx,p.vy);if(v>3.3){p.vx*=3.3/v;p.vy*=3.3/v;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.x<34){p.x=34;p.vx=0;}
 if(p.x>686){p.x=686;p.vx=0;}
 if(p.y<34){p.y=34;p.vy=0;}
 if(p.y>446){p.y=446;p.vy=0;}
 if(p.dash>0)p.dash-=dt;
 if(p.inv>0)p.inv-=dt;
}
function step(dt){
 var i,j,d0=false,d1=false;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.time+=dt;
  if(st.time>=st.nextBall&&st.balls.length<4){
   st.balls.push(mkBall());
   st.nextBall+=1400;
   st.note="新球来袭!";st.noteT=70;
  }
  if(st.noteT>0)st.noteT-=dt;
  for(i=0;i<2;i++){moveP(i,dt);if(st.flash[i]>0)st.flash[i]-=dt;}
  if(st.spawnT>0){
   st.spawnT-=dt;
   if(st.spawnT<=0)st.balls.push(mkBall());
  }
  for(j=st.balls.length-1;j>=0;j--){
   var b=st.balls[j];
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.x<29){b.x=29;b.vx=Math.abs(b.vx);}
   if(b.x>691){b.x=691;b.vx=-Math.abs(b.vx);}
   if(b.y<29){b.y=29;b.vy=Math.abs(b.vy);}
   if(b.y>451){b.y=451;b.vy=-Math.abs(b.vy);}
   for(i=0;i<2;i++){
    var p=st.p[i];
    if(p.inv<=0&&Math.hypot(p.x-b.x,p.y-b.y)<27){
     p.hp--;p.inv=70;p.flash=16;
     st.balls.splice(j,1);
     st.spawnT=45;
     st.mult=Math.min(2.4,st.mult*1.07);
     break;
    }
   }
  }
  var dead0=st.p[0].hp<=0,dead1=st.p[1].hp<=0;
  if(dead0||dead1){
   st.ph="over";
   if(dead0&&dead1)show("同归于尽,平局!","双方 0 : 0 存活");
   else show(dead0?"橙方存活到最后!":"蓝方存活到最后!","剩余生命 蓝方 "+Math.max(0,st.p[0].hp)+" : "+Math.max(0,st.p[1].hp)+" 橙方");
  }
 }
}
function draw(){
 ctx.clearRect(0,0,720,480);
 ctx.strokeStyle="#3d3354";ctx.lineWidth=4;
 ctx.strokeRect(18,18,684,444);
 var i,j;
 for(j=0;j<st.balls.length;j++){
  var b=st.balls[j];
  ctx.fillStyle="rgba(255,120,60,.3)";
  ctx.beginPath();ctx.arc(b.x,b.y,18,0,6.2832);ctx.fill();
  ctx.fillStyle="#ff8a3d";
  ctx.beginPath();ctx.arc(b.x,b.y,11,0,6.2832);ctx.fill();
  ctx.fillStyle="#ffe0b0";
  ctx.beginPath();ctx.arc(b.x-3,b.y-3,4,0,6.2832);ctx.fill();
 }
 for(i=0;i<2;i++){
  var p=st.p[i];
  if(p.inv>0&&Math.floor(p.inv/4)%2===0)ctx.globalAlpha=0.4;
  ctx.beginPath();ctx.arc(p.x,p.y,16,0,6.2832);
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle="#0f1220";ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle="#0f1220";ctx.font="bold 13px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(i===0?"1":"2",p.x,p.y+1);
  if(p.dash>0){
   ctx.beginPath();ctx.arc(p.x,p.y,22,-1.5708,-1.5708+6.2832*(1-p.dash/110));
   ctx.strokeStyle="rgba(255,255,255,.45)";ctx.lineWidth=2;ctx.stroke();
  }
  var lx=i===0?26:646;
  for(j=0;j<3;j++){
   ctx.beginPath();ctx.arc(lx+j*20,10,6,0,6.2832);
   ctx.fillStyle=j<p.hp?(i===0?"#4fd1c5":"#f6ad55"):"#2a3354";
   ctx.fill();
  }
 }
 ctx.font="bold 13px system-ui";ctx.textBaseline="top";
 ctx.textAlign="center";ctx.fillStyle="#8b93b0";
 ctx.fillText("球速倍率 "+st.mult.toFixed(2)+" · 场上球数 "+st.balls.length,360,462);
 if(st.noteT>0){
  ctx.fillStyle="#ff8a3d";ctx.font="bold 24px system-ui";
  ctx.fillText(st.note,360,220);
 }
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 42px system-ui";
  ctx.fillText("灼球将至!",360,150);
  ctx.font="bold 26px system-ui";
  ctx.fillText(String(Math.ceil(st.cd/24)),360,208);
 }
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 keys[k]=true;
 if((k==="f"||k===" ")&&!e.repeat)tryDash(0);
 if((k==="k"||k==="enter")&&!e.repeat)tryDash(1);
});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

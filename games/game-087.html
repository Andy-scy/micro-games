<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光刃双形</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#ffd166;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#ffd166;color:#33260a;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#ffd166;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>光刃双形</h1>
<p class="tip">←→↑↓/WASD 移动,空格开火,X(触屏双指轻点)切换形态。集束形态双发高伤并回复能量,散射形态三向大范围但持续耗能,耗尽会强制切回。拿到 800 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">光刃双形</h2>
<p id="ovX">一架战机、两副炮刃:散开的光刃横扫蜂群,收拢的双刃洞穿重甲。在形态与能量之间做取舍吧。</p>
<button id="btn">开始游戏</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>形态<b id="hF">集束</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hF=document.getElementById("hF"),hH=document.getElementById("hH");
var GOAL=800;
var state="ready",score=0,hp=3,inv=0,cool=0,t=0,energy=100,form=1,lockForm=false;
var squad=1.2,heavy=4;
var ship={x:W/2,y:H-80};
var bullets=[],ebullets=[],enemies=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*24+8});}
function reset(){
  score=0;hp=3;inv=0;cool=0;t=0;energy=100;form=1;lockForm=false;squad=1;heavy=4.5;
  ship.x=W/2;ship.y=H-80;
  bullets=[];ebullets=[];enemies=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"双刃合一":"战机坠毁";
  ovX.textContent="最终得分:"+score+(win?" · 你找到了两副炮刃的完美节奏。":" · 试试用散射清蜂群、集束打重甲。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function toggleForm(){
  if(lockForm)return;
  form=form===1?2:1;
}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;
  var sp=280;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.45,Math.min(H-40,ship.y));
  var firing=(keys[" "]||keys.z||pressed)&&cool<=0;
  if(firing){
    if(form===1){
      cool=0.22;
      bullets.push({x:ship.x-7,y:ship.y-12,vx:0,vy:-560,dmg:2,life:99});
      bullets.push({x:ship.x+7,y:ship.y-12,vx:0,vy:-560,dmg:2,life:99});
      energy=Math.min(100,energy+13*dt);
    }else{
      cool=0.3;
      bullets.push({x:ship.x,y:ship.y-18,vx:0,vy:-540,dmg:1,life:0.42});
      bullets.push({x:ship.x-8,y:ship.y-10,vx:-190,vy:-500,dmg:1,life:0.42});
      bullets.push({x:ship.x+8,y:ship.y-10,vx:190,vy:-500,dmg:1,life:0.42});
      energy-=20*dt;
      if(energy<=0){energy=0;form=1;lockForm=true;}
    }
  }else if(form===1){
    energy=Math.min(100,energy+13*dt);
  }
  if(lockForm&&energy>=30)lockForm=false;
  squad-=dt;heavy-=dt;
  if(squad<=0){
    squad=Math.max(1.4,2.6-score*0.001);
    var bx=50+Math.random()*(W-180),k;
    for(k=0;k<4;k++){
      enemies.push({x:bx+k*34,y:-26-(k%2)*26,vy:120,hp:1,ph:k*0.9,kind:0});
    }
  }
  if(heavy<=0){
    heavy=Math.max(2.6,5-score*0.0015);
    enemies.push({x:60+Math.random()*(W-120),y:-34,vy:55,hp:5,ph:Math.random()*6.283,kind:1});
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    var b=bullets[bi];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.y<-20||b.life<=0||b.x<-10||b.x>W+10)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.vy*dt;
    e.x+=Math.sin(t*4+e.ph)*(e.kind===0?70:30)*dt;
    if(e.y>H+30){enemies.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<(e.kind===0?18:26)&&Math.abs(e.y-ship.y)<(e.kind===0?18:24)){
      enemies.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  if(Math.random()<dt*0.55&&enemies.length){
    var e3=enemies[Math.floor(Math.random()*enemies.length)];
    var dx=ship.x-e3.x,dy=ship.y-e3.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    ebullets.push({x:e3.x,y:e3.y+12,vx:dx/d*180,vy:dy/d*180});
  }
  for(i=ebullets.length-1;i>=0;i--){
    var eb=ebullets[i];
    eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;
    if(eb.x<-10||eb.x>W+10||eb.y>H+10){ebullets.splice(i,1);continue;}
    if(inv<=0&&Math.abs(eb.x-ship.x)<11&&Math.abs(eb.y-ship.y)<13){
      ebullets.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,12,"#ff6b6b");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      var rr=e2.kind===0?16:26;
      var ddx=bl.x-e2.x,ddy=bl.y-e2.y;
      if(ddx*ddx+ddy*ddy<rr*rr){
        bullets.splice(bi,1);
        e2.hp-=bl.dmg;
        if(e2.hp<=0){
          boom(e2.x,e2.y,10+e2.kind*4,"#ffd166");
          score+=e2.kind===0?15:45;
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(score>=GOAL)gameOver(true);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle=form===1?"#ffd166":"#7ee787";
  for(i=0;i<bullets.length;i++){
    var b=bullets[i];
    ctx.fillRect(b.x-2,b.y-10,4,14);
  }
  ctx.fillStyle="#ff9f43";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    if(e.kind===0){
      ctx.fillStyle="#ff6b6b";
      ctx.beginPath();ctx.moveTo(0,11);ctx.lineTo(-10,-8);ctx.lineTo(10,-8);
      ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle="#c0456c";
      ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(-24,-12);ctx.lineTo(0,-4);ctx.lineTo(24,-12);
      ctx.closePath();ctx.fill();
      ctx.fillStyle="#ffd166";ctx.fillRect(-6,-2,12,10);
    }
    ctx.restore();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle=form===1?"#ffd166":"#7ee787";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    if(form===2){
      ctx.fillRect(-26,-2,8,4);
      ctx.fillRect(18,-2,8,4);
    }
    ctx.restore();
    ctx.fillStyle="#1d2440";ctx.fillRect(20,H-14,180,8);
    ctx.fillStyle=lockForm?"#e05555":(form===1?"#ffd166":"#7ee787");
    ctx.fillRect(20,H-14,180*energy/100,8);
    ctx.font="12px system-ui";ctx.textAlign="left";
    ctx.fillText(lockForm?"能量耗尽·强制集束":(form===1?"集束形态·回复能量":"散射形态·消耗能量"),20,H-20);
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;
  hF.textContent=form===1?"集束":"散射";
  hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(e.touches.length>=2){toggleForm();return;}
  ptr(e.touches[0]);pressed=true;
},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();if(e.touches.length===1)ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(e){pressed=e.touches.length>0;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="x"||e.key==="X")toggleForm();
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

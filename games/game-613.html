<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>负数电梯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#818cf8;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#818cf8;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.task{text-align:center;font-size:19px;font-weight:800;margin:10px 0 8px;min-height:26px}
.task b{color:#818cf8}
.task .neg{color:#fbbf24}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pads button{background:#232949;color:#e8eaf6;border:none;border-radius:10px;padding:13px 0;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
.pads button:active{transform:scale(.95)}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:8px;color:#8b90b0}
.msg.good{color:#4ade80}
.msg.badc{color:#f87171}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#818cf8}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#818cf8;color:#1e1b4b;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>负数电梯</h1>
  <p class="hint">按任务计算要去的楼层:当前层 + 移动量 · 点击井道或用 ▲▼ 按钮开梯 · 地下 9 层到地上 9 层</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连对 <b id="combo">0</b></span>
    <span>送达 <b id="done">0</b></span>
    <span>生命 <b id="lives">❤❤❤</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="300" height="472"></canvas>
    <div class="task" id="task">当前 <b>3</b> 层 · 移动 <b class="neg">−7</b> 层</div>
    <div class="pads">
      <button id="btnUp">▲ 上一层</button>
      <button id="btnDn">▼ 下一层</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">负数电梯</h2>
      <p id="ovD">电梯在大楼与地下之间穿行:地上 9 层到地下 9 层(用负数表示)。看清任务里的移动量(负数向下,正数向上),把电梯准确开到目标层。停错层扣一颗心!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始运营</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var elScore=$("score"),elCombo=$("combo"),elDone=$("done"),elLives=$("lives");
var elTask=$("task"),elMsg=$("msg");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo");
var W=300,H=472,TOP=8,CELL=24,LX=38,RX=268;
var state,score,combo,lives,done,curF,target,dispY,pendingEval,flash,lastT;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function floorY(f){return TOP+(9-f)*CELL;}
function updHud(){
  elScore.textContent=score;elCombo.textContent=combo;elDone.textContent=done;
  var h="",i;
  for(i=0;i<3;i++)h+=i<lives?"❤":"♡";
  elLives.textContent=h;
}
function setMsg(t,cls){
  elMsg.textContent=t;
  elMsg.className="msg"+(cls?" "+cls:"");
}
function newTask(){
  var d;
  do{
    d=rnd(-9,9);
    target=curF+d;
  }while(target<-9||target>9||target===curF);
  pendingEval=false;
  var ds=(d>0?"+":"−")+Math.abs(d);
  elTask.innerHTML="当前 <b>"+curF+"</b> 层 · 移动 <b class='neg'>"+ds+"</b> 层";
  setMsg("电梯正在待命,点击井道出发","");
}
function moveTo(f){
  if(state!=="playing")return;
  if(f<-9||f>9||f===curF)return;
  curF=f;
  pendingEval=true;
  setMsg("电梯运行中…","");
}
function arrived(){
  if(!pendingEval)return;
  pendingEval=false;
  if(target===null||target===undefined)return;
  if(curF===target){
    target=null;
    score+=10+combo*2;combo++;done++;
    setMsg("送达 "+target+" 层!干得漂亮","good");
    updHud();
    setTimeout(function(){if(state==="playing")newTask();},800);
  }else{
    combo=0;lives--;
    flash=1;
    setMsg("停错层了!目标是 "+target+" 层,生命 -1","badc");
    updHud();
    if(lives<=0)setTimeout(gameOver,900);
  }
}
function gameOver(){
  state="over";
  ovT.textContent="电梯停运…";
  ovD.textContent="共送达 "+done+" 位乘客。记住:向下用减法,负负得正!";
  ovS.style.display="block";
  ovS.textContent="得分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  state="playing";score=0;combo=0;lives=3;done=0;flash=0;lastT=0;
  curF=0;dispY=floorY(0);
  ovS.style.display="none";
  newTask();updHud();
  ov.classList.add("hide");
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var f,y;
  for(f=9;f>=-9;f--){
    y=floorY(f);
    ctx.strokeStyle="rgba(255,255,255,0.06)";
    ctx.beginPath();ctx.moveTo(LX,y);ctx.lineTo(RX,y);ctx.stroke();
    ctx.fillStyle=f===0?"#e8eaf6":"#7c82a8";
    ctx.font="12px system-ui";
    ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.fillText(f===0?"0 层":(f<0?"B"+(-f):f+"F"),LX-5,y);
    if(f===target&&state==="playing"){
      ctx.fillStyle="rgba(251,191,36,0.18)";
      ctx.fillRect(LX,y-CELL/2,RX-LX,CELL);
      ctx.fillStyle="#fbbf24";
      ctx.textAlign="left";
      ctx.fillText("目标",RX-36,y);
    }
  }
  var cy=floorY(curF),dy=dispY;
  var col=flash>0?"#f87171":"#818cf8";
  ctx.fillStyle=col;
  if(ctx.roundRect){
    ctx.beginPath();
    ctx.roundRect(LX+14,dy-CELL/2+2,RX-LX-28,CELL-4,6);
    ctx.fill();
  }else{
    ctx.fillRect(LX+14,dy-CELL/2+2,RX-LX-28,CELL-4);
  }
  ctx.fillStyle="#0b0e1a";
  ctx.font="bold 13px system-ui";
  ctx.textAlign="center";
  ctx.fillText(curF+" 层",(LX+RX)/2,dy+1);
  ctx.strokeStyle="rgba(129,140,248,0.35)";
  ctx.beginPath();ctx.moveTo(LX,cy);ctx.lineTo(RX,cy);ctx.stroke();
}
function pos(ev){
  var rect=cv.getBoundingClientRect();
  var cx=ev.clientX!==undefined?ev.clientX:(ev.touches&&ev.touches[0]?ev.touches[0].clientX:0);
  var cy2=ev.clientY!==undefined?ev.clientY:(ev.touches&&ev.touches[0]?ev.touches[0].clientY:0);
  return {x:(cx-rect.left)*W/rect.width,y:(cy2-rect.top)*H/rect.height};
}
cv.addEventListener("click",function(e){
  if(state!=="playing")return;
  var p=pos(e);
  var f=9-Math.floor((p.y-TOP)/CELL);
  moveTo(f);
});
$("btnUp").addEventListener("click",function(){moveTo(curF+1);});
$("btnDn").addEventListener("click",function(){moveTo(curF-1);});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
    return;
  }
  if(e.key==="ArrowUp"){e.preventDefault();moveTo(curF+1);}
  else if(e.key==="ArrowDown"){e.preventDefault();moveTo(curF-1);}
});
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(80,t-lastT);lastT=t;
  var ty=floorY(curF);
  dispY+=(ty-dispY)*Math.min(1,dt*0.012);
  if(Math.abs(ty-dispY)<0.6){
    dispY=ty;
    if(state==="playing"&&pendingEval&&curF!==undefined)arrived();
  }
  if(flash>0)flash=Math.max(0,flash-dt*0.003);
  draw();
}
startGame();
state="menu";
ov.classList.remove("hide");
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

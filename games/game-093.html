<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹药危机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#f28cb1;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#f28cb1;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#f28cb1;color:#33101c;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#f28cb1;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>弹药危机</h1>
<p class="tip">←→↑↓/WASD 或按住拖动移动,空格 / 按住屏幕开火。弹药极其有限(开局 45 发),只能靠击坠掉落的弹药箱和缓慢补给续命,每一发都要有目标。拿到 700 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">弹药危机</h2>
<p id="ovX">补给线被切断了,弹舱里的每一发炮弹都弥足珍贵。打得准,才能活下去。</p>
<button id="btn">开始节流</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>弹药<b id="hA">45</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hA=document.getElementById("hA"),hH=document.getElementById("hH");
var GOAL=700;
var state="ready",score=0,hp=3,ammo=45,inv=0,cool=0,t=0,spawn=0.8,trickle=3;
var ship={x:W/2,y:H-80};
var bullets=[],ebullets=[],enemies=[],crates=[],parts=[],texts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*24+8});}
function reset(){
  score=0;hp=3;ammo=45;inv=0;cool=0;t=0;spawn=0.7;trickle=3;
  ship.x=W/2;ship.y=H-80;
  bullets=[];ebullets=[];enemies=[];crates=[];parts=[];texts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function ftext(x,y,txt,col){
  texts.push({x:x,y:y,txt:txt,col:col,life:0.9});
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"弹尽功成":"战机坠毁";
  ovX.textContent="最终得分:"+score+(win?" · 用最少的弹药打出最大的战果。":" · 弹药见底了?多引诱敌机扎堆,一石三鸟。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;spawn-=dt;
  trickle-=dt;
  if(trickle<=0){
    trickle=3;
    if(ammo<60){ammo++;ftext(ship.x,ship.y-30,"补给 +1","#f28cb1");}
  }
  var sp=280;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.45,Math.min(H-40,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0){
    cool=0.24;
    if(ammo>0){
      ammo--;
      bullets.push({x:ship.x,y:ship.y-18});
    }else{
      ftext(ship.x,ship.y-30,"弹药耗尽!","#e05555");
    }
  }
  if(spawn<=0){
    spawn=Math.max(0.7,1.6-score*0.0007);
    enemies.push({x:40+Math.random()*(W-80),y:-30,vy:100+Math.random()*50,hp:1,ph:Math.random()*6.283});
    if(Math.random()<0.3)enemies.push({x:40+Math.random()*(W-80),y:-30,vy:60,hp:3,ph:Math.random()*6.283,heavy:true});
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    bullets[bi].y-=560*dt;
    if(bullets[bi].y<-20)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.vy*dt;
    e.x+=Math.sin(t*2.6+e.ph)*50*dt;
    if(e.y>H+30){enemies.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<22&&Math.abs(e.y-ship.y)<22){
      enemies.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  if(Math.random()<dt*0.5&&enemies.length){
    var e3=enemies[Math.floor(Math.random()*enemies.length)];
    var dx=ship.x-e3.x,dy=ship.y-e3.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    ebullets.push({x:e3.x,y:e3.y+14,vx:dx/d*180,vy:dy/d*180});
  }
  for(i=ebullets.length-1;i>=0;i--){
    var b=ebullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-10||b.x>W+10||b.y>H+10){ebullets.splice(i,1);continue;}
    if(inv<=0&&Math.abs(b.x-ship.x)<11&&Math.abs(b.y-ship.y)<13){
      ebullets.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,12,"#ff6b6b");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      var rr=e2.heavy?24:18;
      var dx2=bl.x-e2.x,dy2=bl.y-e2.y;
      if(dx2*dx2+dy2*dy2<rr*rr){
        bullets.splice(bi,1);
        e2.hp--;
        if(e2.hp<=0){
          boom(e2.x,e2.y,12,"#ffd166");
          var pts=e2.heavy?40:15;
          score+=pts;
          ftext(e2.x,e2.y,"+"+pts,"#ffd166");
          if(Math.random()<0.28)crates.push({x:e2.x,y:e2.y,vy:110});
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=crates.length-1;i>=0;i--){
    var c=crates[i];
    c.y+=c.vy*dt;
    if(c.y>H+20){crates.splice(i,1);continue;}
    if(Math.abs(c.x-ship.x)<26&&Math.abs(c.y-ship.y)<30){
      crates.splice(i,1);
      ammo=Math.min(60,ammo+8);
      ftext(c.x,c.y,"弹药 +8","#f28cb1");
      boom(c.x,c.y,6,"#f28cb1");
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(i=texts.length-1;i>=0;i--){
    var tx=texts[i];
    tx.y-=40*dt;tx.life-=dt;
    if(tx.life<=0)texts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(score>=GOAL)gameOver(true);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#f28cb1";
  for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-2,bullets[i].y-10,4,14);
  ctx.fillStyle="#ff9f43";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    if(e.heavy){
      ctx.fillStyle="#c0456c";
      ctx.fillRect(-18,-14,36,28);
      ctx.fillStyle="#ffd166";ctx.fillRect(-7,-6,14,12);
    }else{
      ctx.fillStyle="#ff6b6b";
      ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(-14,-10);ctx.lineTo(14,-10);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  for(i=0;i<crates.length;i++){
    var c=crates[i];
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(t*3)*0.2);
    ctx.fillStyle="#f28cb1";
    ctx.fillRect(-10,-8,20,16);
    ctx.fillStyle="#33101c";
    ctx.fillRect(-6,-2,12,4);
    ctx.restore();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  for(i=0;i<texts.length;i++){
    var tx=texts[i];
    ctx.globalAlpha=Math.min(1,tx.life*1.6);
    ctx.fillStyle=tx.col;
    ctx.font="bold 13px system-ui";ctx.textAlign="center";
    ctx.fillText(tx.txt,tx.x,tx.y);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#f28cb1";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  if(state==="play"&&ammo<=5){
    ctx.fillStyle=ammo===0?"#e05555":"#ffd166";
    ctx.font="bold 15px system-ui";ctx.textAlign="center";
    ctx.fillText(ammo===0?"弹药耗尽,等待补给!":"弹药即将耗尽!",W/2,90);
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;hA.textContent=ammo;hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

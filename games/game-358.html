<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渐弱微光</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#a5b4fc;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#a5b4fc;font-size:16px}
.gbtn{background:#1c2150;color:#a5b4fc;border:1px solid #a5b4fc;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#a5b4fc;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto;touch-action:manipulation}
.pad{aspect-ratio:1/1;border-radius:16px;background:#141830;border:2px solid #2a3258;cursor:pointer;transition:transform .06s;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.94)}
.vol{height:12px;border-radius:6px;background:#0b0e1c;border:1px solid #2a3258;overflow:hidden;max-width:320px;margin:0 auto 12px}
.vbar{height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#a5b4fc);transition:width .15s}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#a5b4fc;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#a5b4fc;color:#1c2150;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>渐弱微光</h1>
  <p class="hint">渐弱版记忆序列:演示时第 1 步又亮又响,之后每一步的亮度与音量都衰减两成多,最后几步几乎是耳语微光!盯紧听细,把渐隐的序列完整接住。支持键盘 1-4。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>当前音量 <b id="vol">--</b></span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="vol"><div class="vbar" id="vbar"></div></div>
  <div class="pads" id="pads">
    <div class="pad" data-i="0"></div>
    <div class="pad" data-i="1"></div>
    <div class="pad" data-i="2"></div>
    <div class="pad" data-i="3"></div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">渐弱微光</h2>
    <p id="ovDesc">序列像回声一样越传越弱:开头洪亮,结尾几乎消失。你要在微光与轻音里捕回每一步。注意力不够细的人,总会在最安静的地方掉链子。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg358_best",FREQ=[329.63,261.63,220,164.81],GAP=680,FLASH=440;
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var pads=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elVol=$("vol"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew"),vbar=$("vbar");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.3;v=v==null?0.16:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(Math.max(0.004,v),t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var box=$("pads"),list=box.querySelectorAll(".pad");for(var i=0;i<list.length;i++){pads.push(list[i]);list[i].dataset.i=String(i);}})();
function intenOf(k){return Math.max(0.07,0.9*Math.pow(0.75,k));}
function flashFade(i,k,ms){var el=pads[i],v=intenOf(k);
el.style.background="rgba(129,140,248,"+v.toFixed(3)+")";
el.style.boxShadow="0 0 "+(36*v).toFixed(1)+"px rgba(129,140,248,"+(0.9*v).toFixed(3)+")";
el.style.borderColor="rgba(165,180,252,"+Math.min(1,0.25+v).toFixed(3)+")";
tone(FREQ[i],0.34,0.24*v);
vbar.style.width=(v*100).toFixed(0)+"%";elVol.textContent=(v*100).toFixed(0)+"%";
timers.push(setTimeout(function(){el.style.background="";el.style.boxShadow="";el.style.borderColor="";},ms||FLASH));}
function flashFull(i,ms){var el=pads[i];
el.style.background="rgba(129,140,248,1)";el.style.boxShadow="0 0 36px rgba(129,140,248,.9)";el.style.borderColor="#c7d2fe";
tone(FREQ[i],0.2,0.16);
timers.push(setTimeout(function(){el.style.background="";el.style.boxShadow="";el.style.borderColor="";},ms||200));}
function clearFx(){for(var i=0;i<4;i++){pads[i].style.background="";pads[i].style.boxShadow="";pads[i].style.borderColor="";}
vbar.style.width="0%";elVol.textContent="--";}
function rnd(){var n;do{n=(Math.random()*4)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function updateHud(){elLv.textContent=level;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";setMsg("声音在变小,竖起耳朵…");var i=0;(function step(){
if(i>=seq.length){vbar.style.width="0%";elVol.textContent="--";
state="input";pos=0;setMsg("把渐弱的序列复述出来!");return;}
flashFade(seq[i],i);i++;timers.push(setTimeout(step,GAP));})();}
function nextRound(){seq.push(rnd());updateHud();playSeq();}
function newGame(){clearTimers();clearFx();seq=[];pos=0;level=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,650));}
function winStep(){level++;state="wait";setMsg("细到极致!序列加长…");updateHud();timers.push(setTimeout(nextRound,800));}
function fail(){clearTimers();clearFx();state="over";tone(92,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="微光熄灭";
ovDesc.textContent="序列在第 "+seq.length+" 步的轻音里溜走了。越靠后的步越难听清,别急,节奏数拍能帮你补上漏掉的音。";
ovScore.style.display="block";ovScore.textContent="成功复述 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flashFull(i);
if(seq[pos]===i){pos++;if(pos>=seq.length)winStep();}else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
$("pads").addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;if(k==="1")press(0);else if(k==="2")press(1);else if(k==="3")press(2);else if(k==="4")press(3);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>满仓金币</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#facc15;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:6px;align-items:center}
.hud b{color:#facc15;font-size:16px}
.msg{color:#facc15;font-size:13px;min-height:18px;text-align:center;margin-bottom:6px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#facc15}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#facc15;font-weight:700}
.overlay button{margin-top:6px;background:#facc15;color:#3a3003;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>满仓金币</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 集齐全部金币出口才会解锁</p>
  <div class="hud">
    <span>金币 <b id="coins">0/16</b></span>
    <span>步数 <b id="steps">0</b></span>
    <span>最少步纪录 <b id="best">--</b></span>
  </div>
  <div class="msg" id="msg"></div>
  <div class="stage">
    <canvas id="cv" width="456" height="456"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">满仓金币</h2>
      <p id="ovDesc">出口被一道金币封印锁住:必须把迷宫里 16 枚金币一枚不剩全部吃掉,绿色的出口门才会解锁敞开。光顾着逃是出不去的——做一只贪心的寻宝鼠吧!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始搜刮</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=19,ROWS=19,CELL=24,W=456,H=456;
function $(id){return document.getElementById(id);}
var elCoins=$("coins"),elSteps=$("steps"),elBest=$("best"),elMsg=$("msg");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s269");
var state="menu";
var grid,player,exitCell,coins,got,steps,elapsed,pulse,msgT,msgText;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function bfs(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function setMsg(s){msgText=s;msgT=2.2;}
function reset(){
  grid=genMaze(9,9);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dist=bfs(1,1),cells=[],x,y;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]===0&&dist[y][x]>=3&&!(x===exitCell.x&&y===exitCell.y))cells.push({x:x,y:y});
  }
  coins=[];
  var guard=0;
  while(coins.length<16&&cells.length&&guard<600){
    guard++;
    var i=(Math.random()*cells.length)|0,c=cells[i],bad=false,j;
    for(j=0;j<coins.length;j++)if(coins[j].x===c.x&&coins[j].y===c.y)bad=true;
    if(!bad)coins.push({x:c.x,y:c.y});
    cells.splice(i,1);
  }
  got=0;steps=0;elapsed=0;pulse=0;msgT=0;
  updateHud();
}
function updateHud(){
  elCoins.textContent=got+"/"+coins.length;
  elSteps.textContent=steps;
  elBest.textContent=best>0?best+" 步":"--";
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  steps++;
  var i;
  for(i=0;i<coins.length;i++){
    if(!coins[i].got&&coins[i].x===nx&&coins[i].y===ny){
      coins[i].got=true;got++;
      if(got===coins.length)setMsg("叮!最后一枚金币入手,出口解锁了!");
    }
  }
  if(nx===exitCell.x&&ny===exitCell.y){
    if(got>=coins.length){win();return;}
    setMsg("出口封印中,还差 "+(coins.length-got)+" 枚金币");
  }
  updateHud();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||steps<best){best=steps;saveBest("mg_s269",best);isNew=true;}
  ovTitle.textContent="满载而归!";
  ovDesc.textContent=isNew?"新纪录!一枚金币都没漏掉,路线堪称艺术。":"全部金币收入囊中,封印应声而碎。";
  ovScore.style.display="block";
  ovScore.textContent="金币 "+got+"/"+coins.length+" · 步数 "+steps+" · 用时 "+elapsed.toFixed(1)+"s";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#232a4d";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#2c3560";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  var unlocked=got>=coins.length;
  var ex=exitCell.x*CELL,ey=exitCell.y*CELL;
  if(unlocked){
    var ecx=ex+CELL/2,ecy=ey+CELL/2;
    var pr=8+Math.sin(pulse)*2;
    ctx.fillStyle="#4ade80";
    ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(ecx,ecy,pr,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#05230f";
    ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("出",ecx,ecy);
  }else{
    ctx.fillStyle="#3a4266";
    ctx.fillRect(ex+4,ey+4,CELL-8,CELL-8);
    ctx.fillStyle="#9ca3af";
    ctx.fillRect(ex+CELL/2-3,ey+9,6,7);
    ctx.strokeStyle="#9ca3af";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(ex+CELL/2,ey+9,3.5,Math.PI,0);ctx.stroke();
    ctx.lineWidth=1;
  }
  for(i=0;i<coins.length;i++){
    if(coins[i].got)continue;
    var cx=coins[i].x*CELL+CELL/2;
    var cy=coins[i].y*CELL+CELL/2+Math.sin(pulse*2+i)*1.5;
    ctx.fillStyle="#facc15";
    ctx.shadowColor="#facc15";ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#fef9c3";
    ctx.beginPath();ctx.arc(cx-1.5,cy-1.5,1.5,0,Math.PI*2);ctx.fill();
  }
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle="#67e8f9";
  ctx.shadowColor="#22d3ee";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(state==="playing"){
    elapsed+=dt/1000;
  }
  if(msgT>0){msgT-=dt/1000;elMsg.textContent=msgText;}
  else elMsg.textContent="";
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真假之门</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:14px}
.wrap{width:100%;max-width:460px}
h1{text-align:center;font-size:22px;margin:6px 0}
.tip{text-align:center;color:#8f97c0;font-size:13px;line-height:1.5;margin-bottom:10px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:10px}
#doors{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.door{width:30%;max-width:110px;background:#232946;border:2px solid #3a4470;border-radius:12px 12px 6px 6px;padding:10px 6px;cursor:pointer;text-align:center;transition:border-color .15s}
.door:hover{border-color:#4f6ef7}
.door.sel{border-color:#ffd668;background:#2e2a1e}
.door .no{font-size:17px;font-weight:800;color:#e8eaf6;margin-bottom:8px}
.door .plate{font-size:12px;color:#9fd8ff;line-height:1.6;min-height:58px;display:flex;align-items:center;justify-content:center;background:#1a2038;border-radius:8px;padding:5px}
.btn{background:#2a3157;color:#e8eaf6;border:none;border-radius:10px;padding:9px 18px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.btn.pri{background:#4f6ef7;color:#fff}
.btnrow{display:flex;justify-content:center;gap:10px;margin-top:8px}
#msg{text-align:center;min-height:20px;font-size:13px;color:#fbbf24;margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:26px 30px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:10px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:16px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>真假之门</h1>
<p class="tip">三扇门各挂一块牌子,三块牌子中<b>恰好只有一块</b>是真话。<br>推理出唯一安全的门,连闯 3 层!</p>
<div class="hud"><span id="hF">第 1/3 层</span></div>
<div id="doors"></div>
<div id="msg"></div>
<div class="btnrow"><button class="btn pri" id="bOpen">打开这扇门</button><button class="btn" id="bNew">重新开始</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn pri" id="ovB">再来一局</button></div></div>
<script>
"use strict";
function ri(n){return Math.floor(Math.random()*n);}
function makePlate(tpl,d,x){
  if(tpl===0)return {text:(x===d?"本门":"【"+(x+1)+"号门】")+"是安全的",f:s=>s===x};
  if(tpl===1)return {text:(x===d?"本门":"【"+(x+1)+"号门】")+"后有猛兽",f:s=>s!==x};
  return {text:"本门不是安全门",f:s=>d!==s};
}
function genFloor(){
  for(let t=0;t<500;t++){
    const safe=ri(3);
    const plates=[];
    for(let d=0;d<3;d++){
      const tpl=ri(3);
      const x=(tpl===2)?d:ri(3);
      plates.push(makePlate(tpl,d,x));
    }
    const valid=[];
    for(let s2=0;s2<3;s2++){
      let tr=0;
      for(const pl of plates)if(pl.f(s2))tr++;
      if(tr===1)valid.push(s2);
    }
    if(valid.length===1&&valid[0]===safe)return {safe:safe,plates:plates};
  }
  return {safe:1,plates:[makePlate(0,0,1),makePlate(2,1,1),makePlate(1,2,1)]};
}
let floor=null,lvl=0,sel=-1,over=false,lock=false;
const doorsEl=document.getElementById("doors");
const doorEls=[];
for(let d=0;d<3;d++){
  const el=document.createElement("div");
  el.className="door";
  el.innerHTML='<div class="no">'+(d+1)+'号门</div><div class="plate"></div>';
  el.addEventListener("click",()=>{
    if(over||lock)return;
    sel=d;
    doorEls.forEach((x,i)=>x.classList.toggle("sel",i===d));
    document.getElementById("msg").textContent="";
  });
  doorsEl.appendChild(el);doorEls.push(el);
}
function loadFloor(){
  floor=genFloor();sel=-1;lock=false;
  for(let d=0;d<3;d++){
    doorEls[d].classList.remove("sel");
    doorEls[d].querySelector(".plate").textContent="「"+floor.plates[d].text+"」";
  }
  document.getElementById("hF").textContent="第 "+(lvl+1)+"/3 层";
  document.getElementById("msg").textContent="";
}
function openDoor(){
  if(over||lock)return;
  const msg=document.getElementById("msg");
  if(sel<0){msg.textContent="先点击一扇门选中它";return;}
  if(sel===floor.safe){
    lock=true;msg.textContent="门后是通道!进入下一层";
    setTimeout(()=>{
      lvl++;
      if(lvl>=3){
        over=true;
        show("逃出生天!","连续识破 3 层真假门,推理力惊人");
      }else loadFloor();
    },800);
  }else{
    over=true;
    let truth="";
    for(let d=0;d<3;d++)if(floor.plates[d].f(floor.safe))truth=(d+1)+"号门上的牌子";
    show("猛兽扑出……","安全门其实是 "+(floor.safe+1)+" 号,真话牌是"+truth+"。");
  }
}
function show(t,p){document.getElementById("ovT").textContent=t;document.getElementById("ovP").textContent=p;document.getElementById("ov").classList.remove("hide");}
function init(){
  over=false;lvl=0;
  document.getElementById("ov").classList.add("hide");
  loadFloor();
}
document.getElementById("bOpen").addEventListener("click",openDoor);
document.getElementById("bNew").addEventListener("click",init);
document.getElementById("ovB").addEventListener("click",init);
init();
</script>
</body>
</html>

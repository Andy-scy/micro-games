<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喷绘涂鸦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#22d3ee;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#22d3ee;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #155e75;background:#10141f;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.bar{display:flex;justify-content:center;margin-top:10px}
.bar button{background:#22d3ee;color:#083344;border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.msg{text-align:center;color:#fbbf24;font-size:13px;height:18px;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(5,14,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#22d3ee}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#22d3ee;color:#083344;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>喷绘涂鸦</h1>
  <p class="hint">按住移动喷漆,把暗金轮廓区域喷到 <b style="color:#22d3ee">覆盖 85%</b> 以上,喷出界不能超过 <b style="color:#f87171">12%</b>;<br>喷嘴有雾状散布,离中线越近越实。达标自动验收,也可提前「提交本幅」。</p>
  <div class="hud"><span>画作 <b id="lv">1/3</b></span><span>覆盖 <b id="cov">0%</b></span><span>出界 <b id="over">0%</b></span><span>得分 <b id="score">0</b></span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">喷绘涂鸦</h2>
      <p id="ovP">街头的模板喷绘:五角星、爱心、小火箭。喷进轮廓是青色,喷出界会变红扣分。手别抖,匀速平行扫!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">摇匀喷漆</button>
    </div>
  </div>
  <div class="bar"><button id="btnSub">提交本幅</button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo"),btnSub=$("btnSub");
var elLv=$("lv"),elCov=$("cov"),elOver=$("over"),elScore=$("score"),elMsg=$("msg");
function starPts(cx,cy,R,r,n){
  var pts=[],i;
  for(i=0;i<n*2;i++){
    var rad=(i%2===0)?R:r,a=-Math.PI/2+Math.PI*i/n;
    pts.push([cx+rad*Math.cos(a),cy+rad*Math.sin(a)]);
  }
  return pts;
}
function heartPoly(cx,cy,s){
  var pts=[],t;
  for(t=0;t<Math.PI*2;t+=Math.PI/18){
    var x=16*Math.pow(Math.sin(t),3);
    var y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    pts.push([cx+x*s,cy-y*s]);
  }
  return pts;
}
var N=96,CELL=5,RAD=4.5;
var LV=[
 {name:"五角星",polys:[starPts(48,50,40,17,5)]},
 {name:"爱心",polys:[heartPoly(48,52,2.2)]},
 {name:"小火箭",polys:[[[48,8],[64,32],[64,76],[32,76],[32,32]],[[32,50],[12,70],[12,82],[32,76]],[[64,50],[84,70],[84,82],[64,76]],[[40,76],[56,76],[48,92]]]}
];
var state="menu",lv=0,score=0,tmask=null,tcnt=0,paint=null,cntP=0,cntPT=0,cntOver=0,isDown=false,px=0,py=0;
var tmp=document.createElement("canvas");tmp.width=N;tmp.height=N;
var tctx=tmp.getContext("2d"),img=tctx.createImageData(N,N);
function inPoly(x,y,pts){
  var ins=false,i,j,n=pts.length;
  for(i=0,j=n-1;i<n;j=i++){
    if(((pts[i][1]>y)!==(pts[j][1]>y))&&(x<(pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1])+pts[i][0]))ins=!ins;
  }
  return ins;
}
function covNow(){return tcnt?cntPT/tcnt*100:0;}
function overNow(){return cntP?cntOver/cntP*100:0;}
function loadLevel(){
  tmask=new Uint8Array(N*N);tcnt=0;
  paint=new Uint8Array(N*N);cntP=0;cntPT=0;cntOver=0;
  var polys=LV[lv].polys,i,j,k;
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var x=i+0.5,y=j+0.5;
    for(k=0;k<polys.length;k++){
      if(inPoly(x,y,polys[k])){tmask[i*N+j]=1;tcnt++;break;}
    }
  }
  elLv.textContent=(lv+1)+"/3";elMsg.textContent="";
  hud();render();
}
function hud(){
  elCov.textContent=Math.floor(covNow())+"%";
  elOver.textContent=Math.floor(overNow())+"%";
  elScore.textContent=score;
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function begin(e){if(state!=="playing")return;var p=pos(e);isDown=true;px=p.x;py=p.y;}
function moveP(e){if(!isDown)return;var p=pos(e);px=p.x;py=p.y;}
function endP(){isDown=false;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function spray(){
  if(!isDown)return;
  var cx=px/CELL,cy=py/CELL,i,j;
  for(i=Math.floor(cx-RAD);i<=cx+RAD;i++)for(j=Math.floor(cy-RAD);j<=cy+RAD;j++){
    if(i<0||i>=N||j<0||j>=N)continue;
    var dx=i+0.5-cx,dy=j+0.5-cy,d=Math.sqrt(dx*dx+dy*dy);
    if(d>RAD)continue;
    var id=i*N+j;
    if(paint[id])continue;
    if(Math.random()<(1-d/RAD)*0.85){
      paint[id]=1;cntP++;
      if(tmask[id])cntPT++;else cntOver++;
    }
  }
  hud();
}
function render(){
  var d=img.data,i,total=N*N;
  for(i=0;i<total;i++){
    var o=i*4;
    if(paint[i]){
      if(tmask[i]){d[o]=103;d[o+1]=232;d[o+2]=249;}
      else{d[o]=248;d[o+1]=113;d[o+2]=113;}
      d[o+3]=255;
    }else if(tmask[i]){d[o]=94;d[o+1]=70;d[o+2]=16;d[o+3]=255;}
    else{d[o]=16;d[o+1]=20;d[o+2]=31;d[o+3]=255;}
  }
  tctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(tmp,0,0,480,480);
  ctx.strokeStyle="rgba(232,234,246,0.5)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(px,py,RAD*CELL,0,Math.PI*2);ctx.stroke();
}
function bankScore(){
  var c=covNow(),ov2=overNow();
  var gain=Math.max(0,Math.round(c-Math.max(0,ov2-12)*1.5));
  score+=gain;hud();
  return gain;
}
function finish(){
  state="over";
  ovT.textContent="整面墙都是你的作品!";
  ovP.textContent="三幅模板喷绘全部交付,街头涂鸦圈有你的名号了。";
  ovS.style.display="block";ovS.textContent="总分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function levelEnd(auto){
  var gain=bankScore(),c=Math.floor(covNow()),ov2=Math.floor(overNow());
  var good=auto;
  lv++;
  if(lv>=3){finish();return;}
  state="over";
  ovT.textContent=good?"喷得漂亮!":"提前交卷";
  ovP.textContent="《"+LV[lv-1].name+"》覆盖 "+c+"%,出界 "+ov2+"%,得 "+gain+" 分。\n"+(good?"边缘干净利落!":"轮廓边缘还有留白,别急着交。");
  ovS.style.display="block";ovS.textContent="总分 "+score;
  btnGo.textContent="下一幅";
  ov.classList.remove("hide");
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT);lastT=t;
  if(state!=="playing")return;
  spray();
  render();
  if(covNow()>=85&&overNow()<=12)levelEnd(true);
}
btnSub.addEventListener("click",function(){
  if(state!=="playing")return;
  if(cntP===0){elMsg.textContent="还没喷任何漆呢!";return;}
  levelEnd(false);
});
btnGo.addEventListener("click",function(){
  if(state==="over"&&lv>=1&&lv<3){state="playing";ovS.style.display="none";ov.classList.add("hide");loadLevel();return;}
  lv=0;score=0;state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  loadLevel();
});
loadLevel();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>异形快找</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#38bdf8;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#38bdf8;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#38bdf8}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#38bdf8;color:#04283f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>异形快找</h1>
  <p class="hint">图形闪现一瞬后全部遮住 · 点出混在里面的那只异形</p>
  <div class="hud">
    <span>轮次 <b id="round">1</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>机会 <b id="lives">3</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="400"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">异形快找</h2>
      <p id="ovDesc">一屏相同图形里藏着 1 个形状不同的异形,它们只闪现一小会儿,然后全部被盖住。凭眼力和记忆点出异形的位置!轮次越高图形越多、闪现越短,点错扣一次机会。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=400,KEY="mg_s226";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elRound=$("round"),elScore=$("score"),elLives=$("lives"),elBest=$("best");
var state="menu",round=1,score=0,lives=3;
var cols=4,rows=3,oddIdx=0,baseShape=0,oddShape=1;
var phase="reveal",phaseUntil=0,answered=false,answerIdx=-1,answerOk=false;
var best=loadBest(KEY);
function loadBest(k){try{var v=parseInt(localStorage.getItem(k)||"0",10);return v>0?v:0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function updateHud(){
  elRound.textContent=round;
  elScore.textContent=score;
  elLives.textContent=lives;
  elBest.textContent=best;
}
function layoutFor(r){
  var steps=[{c:4,r:3},{c:4,r:4},{c:5,r:4},{c:6,r:4}];
  var i=Math.min(3,Math.floor((r-1)/3));
  return steps[i];
}
function startRound(t){
  var lay=layoutFor(round);
  cols=lay.c;rows=lay.r;
  baseShape=(Math.random()*3)|0;
  oddShape=(baseShape+1+((Math.random()*2)|0))%3;
  oddIdx=(Math.random()*cols*rows)|0;
  phase="reveal";
  answered=false;answerIdx=-1;answerOk=false;
  phaseUntil=t+Math.max(420,1200-round*70);
}
function drawShape(cx,cy,kind,size,color){
  ctx.fillStyle=color;
  var s=size;
  if(kind===0){
    ctx.fillRect(cx-s,cy-s,s*2,s*2);
  }else if(kind===1){
    ctx.beginPath();ctx.arc(cx,cy,s,0,Math.PI*2);ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(cx,cy-s*1.15);
    ctx.lineTo(cx+s*1.1,cy+s*0.8);
    ctx.lineTo(cx-s*1.1,cy+s*0.8);
    ctx.closePath();ctx.fill();
  }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function draw(t){
  ctx.clearRect(0,0,W,H);
  var cw=W/cols,ch=H/rows,i;
  var size=Math.min(cw,ch)*0.24;
  if(state!=="playing"){
    ctx.fillStyle="#3b457c";
    ctx.font="16px system-ui,sans-serif";
    ctx.textAlign="center";
    ctx.fillText("点击「开始游戏」",W/2,H/2);
    return;
  }
  if(phase==="reveal"&&t>phaseUntil)phase="guess";
  for(i=0;i<cols*rows;i++){
    var cx=(i%cols)*cw+cw/2;
    var cy=Math.floor(i/cols)*ch+ch/2;
    var kind=(i===oddIdx)?oddShape:baseShape;
    if(phase==="reveal"){
      drawShape(cx,cy,kind,size,"#38bdf8");
    }else{
      ctx.fillStyle="#1b2140";
      rr(cx-cw/2+6,cy-ch/2+6,cw-12,ch-12,8);
      ctx.fill();
      ctx.strokeStyle="#26305c";
      ctx.stroke();
    }
  }
  if(phase==="guess"&&answered){
    var ocx=(oddIdx%cols)*cw+cw/2;
    var ocy=Math.floor(oddIdx/cols)*ch+ch/2;
    drawShape(ocx,ocy,oddShape,size,answerOk?"#4ade80":"#4ade80");
    if(!answerOk&&answerIdx>=0){
      var acx=(answerIdx%cols)*cw+cw/2;
      var acy=Math.floor(answerIdx/cols)*ch+ch/2;
      drawShape(acx,acy,baseShape,size,"#ef4444");
    }
  }
}
function loop(t){
  requestAnimationFrame(loop);
  draw(t);
}
function pos(e){
  var r=cv.getBoundingClientRect();
  var x,y;
  if(e.changedTouches&&e.changedTouches.length){x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY;}
  else{x=e.clientX;y=e.clientY;}
  return{x:(x-r.left)*(W/r.width),y:(y-r.top)*(H/r.height)};
}
function onTap(e){
  if(state!=="playing"||phase!=="guess"||answered)return;
  var p=pos(e);
  var col=Math.floor(p.x/(W/cols));
  var row=Math.floor(p.y/(H/rows));
  if(col<0||col>=cols||row<0||row>=rows)return;
  var idx=row*cols+col;
  answered=true;
  answerIdx=idx;
  answerOk=idx===oddIdx;
  if(answerOk){
    score+=50+round*5;
    round++;
  }else{
    lives--;
  }
  updateHud();
  if(!answerOk&&lives<=0){
    setTimeout(function(){
      state="over";
      if(score>best){best=score;saveBest(KEY,best);}
      ovTitle.textContent="游戏结束";
      ovDesc.textContent="坚持到了第 "+round+" 轮";
      ovScore.style.display="block";
      ovScore.textContent="得分 "+score+" · 最佳 "+best;
      btnGo.textContent="再来一局";
      ov.classList.remove("hide");
      updateHud();
    },700);
  }else{
    setTimeout(function(){if(state==="playing")startRound(performance.now());},700);
  }
}
cv.addEventListener("mousedown",onTap);
cv.addEventListener("touchstart",function(e){e.preventDefault();onTap(e);},{passive:false});
document.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&state!=="playing"){e.preventDefault();startGame();}
});
function startGame(){
  round=1;score=0;lives=3;
  state="playing";
  ov.classList.add("hide");
  updateHud();
  startRound(performance.now());
}
btnGo.addEventListener("click",startGame);
updateHud();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

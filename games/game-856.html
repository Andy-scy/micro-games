<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑士巡游</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:14px}
.wrap{width:100%;max-width:430px}
h1{text-align:center;font-size:22px;margin:6px 0}
.tip{text-align:center;color:#8f97c0;font-size:13px;line-height:1.5;margin-bottom:10px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:10px}
.panel{background:#181d33;border:1px solid #262d52;border-radius:14px;padding:10px;margin-bottom:10px;display:flex;justify-content:center}
#board{display:grid;grid-template-columns:repeat(5,50px);grid-auto-rows:50px;gap:3px}
.sq{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;cursor:pointer;color:#e8eaf6;user-select:none}
.sq.dark{background:#20263f}
.sq.light{background:#2c3454}
.sq.cur{background:#4f6ef7;color:#fff;font-size:20px}
.sq.next{outline:2px solid #ffd668;outline-offset:-2px}
.sq.next::after{content:"·";font-size:34px;color:#ffd668}
.sq.startable{box-shadow:inset 0 0 0 2px #4ade80}
#msg{text-align:center;min-height:20px;font-size:13px;color:#fbbf24;margin-bottom:8px}
.btn{background:#2a3157;color:#e8eaf6;border:none;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.btn.pri{background:#4f6ef7;color:#fff}
.btnrow{display:flex;justify-content:center;gap:10px}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:26px 34px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:10px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:16px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<h1>骑士巡游</h1>
<p class="tip">马走「日」字。从任意浅色格出发(绿框格),<br>用马步踏遍 25 格且每格只停一次。被困可回退。</p>
<div class="hud"><span id="hS">已走 0/25 格</span><span id="hT">用时 0 秒</span></div>
<div class="panel"><div id="board"></div></div>
<div id="msg"></div>
<div class="btnrow"><button class="btn" id="bUndo">回退</button><button class="btn pri" id="bNew">重开一局</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn pri" id="ovB">再来一局</button></div></div>
<script>
"use strict";
const N=5;
const DELTA=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
let path=[],sec=0,timer=null,over=false;
const boardEl=document.getElementById("board");
const cells=[];
for(let i=0;i<N*N;i++){
  const d=document.createElement("div");
  d.className="sq";d.dataset.i=String(i);
  const r=Math.floor(i/N),c=i%N;
  d.classList.add((r+c)%2===0?"light":"dark");
  boardEl.appendChild(d);cells.push(d);
}
boardEl.addEventListener("click",e=>{
  const t=e.target;
  if(!t.dataset||t.dataset.i===undefined||over)return;
  clickSq(parseInt(t.dataset.i,10));
});
function visited(i){return path.indexOf(i)>=0;}
function legalFrom(i){
  const r=Math.floor(i/N),c=i%N,out=[];
  for(const d of DELTA){
    const nr=r+d[0],nc=c+d[1];
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    const ni=nr*N+nc;
    if(!visited(ni))out.push(ni);
  }
  return out;
}
function clickSq(i){
  const msg=document.getElementById("msg");
  if(!path.length){
    if((Math.floor(i/N)+i%N)%2!==0){msg.textContent="开局请选浅色格(绿框格),否则 25 格走不完";return;}
    path=[i];msg.textContent="好出发!继续点击高亮格走马步";render();return;
  }
  const cur=path[path.length-1];
  if(i===cur)return;
  if(legalFrom(cur).indexOf(i)<0){msg.textContent=visited(i)?"这格已经走过了":"马走不到那里(要走「日」字)";return;}
  path.push(i);msg.textContent="";render();
  if(path.length===N*N){
    over=true;clearInterval(timer);
    show("巡游成功!","25 格全部踏遍 · 用时 "+sec+" 秒");
    return;
  }
  if(!legalFrom(i).length)msg.textContent="马被困住了!点「回退」换个走法";
}
function render(){
  const cur=path.length?path[path.length-1]:-1;
  const legal=cur>=0?legalFrom(cur):[];
  for(let i=0;i<N*N;i++){
    const d=cells[i],order=path.indexOf(i);
    d.classList.remove("cur","next","startable");
    if(cur<0){d.textContent=(Math.floor(i/N)+i%N)%2===0?"起":"";}
    else if(i===cur){d.textContent="马";d.classList.add("cur");}
    else if(order>=0){d.textContent=String(order+1);}
    else if(legal.indexOf(i)>=0){d.textContent="";d.classList.add("next");}
    else d.textContent="";
    if(cur<0&&(Math.floor(i/N)+i%N)%2===0)d.classList.add("startable");
  }
  document.getElementById("hS").textContent="已走 "+path.length+"/"+(N*N)+" 格";
}
function undo(){
  if(over||!path.length)return;
  path.pop();
  document.getElementById("msg").textContent="";
  render();
}
function show(t,p){document.getElementById("ovT").textContent=t;document.getElementById("ovP").textContent=p;document.getElementById("ov").classList.remove("hide");}
function startTimer(){
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{sec++;document.getElementById("hT").textContent="用时 "+sec+" 秒";},1000);
}
function init(){
  path=[];sec=0;over=false;
  document.getElementById("msg").textContent="";
  document.getElementById("hT").textContent="用时 0 秒";
  document.getElementById("ov").classList.add("hide");
  render();startTimer();
}
document.getElementById("bUndo").addEventListener("click",undo);
document.getElementById("bNew").addEventListener("click",init);
document.getElementById("ovB").addEventListener("click",init);
init();
</script>
</body>
</html>

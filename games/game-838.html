<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>齿轮画环</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#5eead4;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#5eead4;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #115e59;background:#0d1320;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.tools{display:flex;justify-content:center;gap:8px;margin-top:10px}
.tools button{background:#152a34;color:#e8eaf6;border:1px solid #23445e;border-radius:9px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.tools button.on{border-color:#5eead4;box-shadow:0 0 0 2px rgba(94,234,212,.3)}
.msg{text-align:center;color:#fbbf24;font-size:13px;height:18px;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(5,12,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#5eead4}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#5eead4;color:#042f2e;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>齿轮画环</h1>
  <p class="hint">选一枚内齿轮卡进大环,笔尖被<b style="color:#5eead4">齿轮约束</b>:拖动方向改变笔位,轨迹是固定的玫瑰线;<br>对准暗金色目标花纹描,墨水有限,先看花瓣数再选齿轮!</p>
  <div class="hud"><span>覆盖 <b id="cov">0%</b></span><span>墨水 <b id="ink">100%</b></span><span>齿轮 <b id="gear">未选</b></span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">齿轮画环</h2>
      <p id="ovP">万花尺的秘密:不同齿轮画出不同花瓣数的目标花纹。数一数暗金目标有几瓣,选对齿轮再下笔,沿着它绕圈,墨水才够用!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始画环</button>
    </div>
  </div>
  <div class="tools">
    <button data-g="0">齿轮·甲</button><button data-g="1">齿轮·乙</button><button data-g="2">齿轮·丙</button>
    <button id="btnSub">交付</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo"),btnSub=$("btnSub");
var elCov=$("cov"),elInk=$("ink"),elGear=$("gear"),elMsg=$("msg");
var CX=240,CY=240,R=170,INK=4200;
var CFG=[{name:"甲",r:68,d:44},{name:"乙",r:51,d:30},{name:"丙",r:60,d:24}];
var state="menu",cfg=-1,tgtCfg=0,samples=[],marks=[],marked=0,ink=INK;
var isDown=false,prevTheta=null,prevPen=null,theta=0,pen=null;
var pcv=document.createElement("canvas");pcv.width=480;pcv.height=480;
var pctx=pcv.getContext("2d");
function gcd(a,b){while(b){var t=a%b;a=b;b=t;}return a;}
function f(c,t){
  var k=(R-c.r)/c.r;
  return {x:CX+(R-c.r)*Math.cos(t)+c.d*Math.cos(k*t),y:CY+(R-c.r)*Math.sin(t)-c.d*Math.sin(k*t)};
}
function buildTarget(){
  samples=[];marks=[];
  var c=CFG[tgtCfg],g=gcd(R-c.r,c.r),q=c.r/g,tmax=Math.PI*2*q,i;
  var n=700;
  for(i=0;i<=n;i++){
    var t=tmax*i/n;
    samples.push(f(c,t));
    marks.push(0);
  }
  marked=0;
}
function chooseGear(i){
  if(state==="playing"||state==="pick"){
    cfg=i;
    elGear.textContent=CFG[i].name;
    if(state==="pick"){
      state="playing";ink=INK;
      pctx.clearRect(0,0,480,480);
      elMsg.textContent="按住拖动,沿金色花纹绕圈!";
    }else{
      elMsg.textContent="换齿轮!轨迹会变,已画的线保留";
    }
    prevTheta=null;prevPen=null;
    var bs=document.querySelectorAll(".tools button[data-g]"),k;
    for(k=0;k<bs.length;k++)bs[k].className=k===i?"on":"";
  }
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function begin(e){
  if(state!=="playing"||cfg<0)return;
  var p=pos(e);
  isDown=true;
  theta=Math.atan2(p.y-CY,p.x-CX);
  prevTheta=theta;prevPen=f(CFG[cfg],theta);
}
function moveP(e){
  if(!isDown||state!=="playing"||cfg<0)return;
  var p=pos(e);
  var th=Math.atan2(p.y-CY,p.x-CX);
  var dth=th-prevTheta;
  if(dth>Math.PI)dth-=Math.PI*2;
  if(dth<-Math.PI)dth+=Math.PI*2;
  if(Math.abs(dth)>1.2){prevTheta=th;prevPen=f(CFG[cfg],th);return;}
  var pen2=f(CFG[cfg],th);
  var d=Math.hypot(pen2.x-prevPen.x,pen2.y-prevPen.y);
  ink-=d;
  if(ink<0)ink=0;
  if(d>0.5){
    pctx.strokeStyle="#5eead4";pctx.lineWidth=2;pctx.lineCap="round";
    pctx.beginPath();pctx.moveTo(prevPen.x,prevPen.y);pctx.lineTo(pen2.x,pen2.y);pctx.stroke();
  }
  var i;
  for(i=0;i<samples.length;i++){
    if(!marks[i]){
      var dx=samples[i].x-pen2.x,dy=samples[i].y-pen2.y;
      if(dx*dx+dy*dy<144){marks[i]=1;marked++;}
    }
  }
  prevTheta=th;prevPen=pen2;theta=th;pen=pen2;
  hud();
  if(ink<=0)submit(true);
}
function endP(){isDown=false;prevTheta=null;prevPen=null;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function hud(){
  elCov.textContent=Math.round(marked/samples.length*100)+"%";
  elInk.textContent=Math.round(ink/INK*100)+"%";
}
function draw(){
  ctx.fillStyle="#0d1320";ctx.fillRect(0,0,480,480);
  ctx.strokeStyle="rgba(139,144,176,0.4)";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="rgba(251,191,36,0.55)";ctx.lineWidth=1.5;ctx.setLineDash([3,5]);
  ctx.beginPath();
  var i;
  for(i=0;i<samples.length;i++){
    if(i===0)ctx.moveTo(samples[i].x,samples[i].y);else ctx.lineTo(samples[i].x,samples[i].y);
  }
  ctx.closePath();ctx.stroke();ctx.setLineDash([]);
  ctx.drawImage(pcv,0,0);
  if(cfg>=0){
    var c=CFG[cfg],gc={x:CX+(R-c.r)*Math.cos(theta),y:CY+(R-c.r)*Math.sin(theta)};
    var pp=pen||f(c,theta);
    ctx.strokeStyle="rgba(94,234,212,0.7)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(gc.x,gc.y,c.r,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gc.x,gc.y);ctx.lineTo(pp.x,pp.y);ctx.stroke();
    ctx.beginPath();ctx.arc(pp.x,pp.y,5,0,Math.PI*2);
    ctx.fillStyle="#fde047";ctx.fill();
  }else{
    ctx.font="15px system-ui";ctx.textAlign="center";
    ctx.fillStyle="#8b90b0";
    ctx.fillText("先在下方选一枚齿轮",CX,64);
  }
}
function submit(auto){
  if(state!=="playing")return;
  state="over";
  var c=Math.round(marked/samples.length*100),win=c>=65;
  ovT.textContent=win?"花纹吻合!":"墨水用尽";
  ovP.textContent=(auto?"墨尽自动交付。":"主动交付。")+"覆盖率 "+c+"%。\n正确齿轮是「"+CFG[tgtCfg].name+"」(花瓣数 "+((R-CFG[tgtCfg].r)/gcd(R-CFG[tgtCfg].r,CFG[tgtCfg].r))+")。\n"+(win?"万花尺十级学者!":"先数花瓣,再选齿轮。");
  ovS.style.display="block";ovS.textContent="覆盖率得分 "+c;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
btnSub.addEventListener("click",function(){submit(false);});
var i;
var gbs=document.querySelectorAll(".tools button[data-g]");
for(i=0;i<gbs.length;i++){
  (function(b){
    b.addEventListener("click",function(){chooseGear(parseInt(b.getAttribute("data-g"),10));});
  })(gbs[i]);
}
btnGo.addEventListener("click",function(){
  tgtCfg=(Math.random()*3)|0;
  cfg=-1;buildTarget();
  pctx.clearRect(0,0,480,480);
  ink=INK;marked=0;theta=0;pen=null;
  elGear.textContent="未选";elMsg.textContent="";
  for(i=0;i<gbs.length;i++)gbs[i].className="";
  hud();
  state="pick";
  ovS.style.display="none";ov.classList.add("hide");
});
function loop(){
  requestAnimationFrame(loop);
  if(state==="playing"||state==="pick")draw();
}
btnGo.click();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

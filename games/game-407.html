<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寒冰滑塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:21px;margin:4px 0 2px;color:#74c0fc}
.hint{font-size:13px;color:#9aa3c0;margin-bottom:6px;text-align:center;line-height:1.5}
#cv{background:#141933;border-radius:14px;max-width:100%;touch-action:none}
.ov{position:fixed;inset:0;background:rgba(8,10,22,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1b2040;border:1px solid #2e3660;border-radius:16px;padding:24px 28px;text-align:center;max-width:86%}
.card h2{color:#74c0fc;margin-bottom:10px;font-size:22px}
.card p{font-size:14px;color:#c3cae6;margin-bottom:8px;line-height:1.7}
.card .sc{font-size:17px;color:#7ee0a3}
button{margin-top:8px;background:#74c0fc;color:#141933;border:none;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>寒冰滑塔</h1>
<p class="hint">塔顶结了冰 · 方块落地后还会带着惯性滑行,提前量投放,点击或空格</p>
<canvas id="cv" width="420" height="640"></canvas>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">寒冰滑塔</h2><p id="ovM">塔顶覆盖着一层冰!方块放下后不会立刻停住,<br>而是带着移动时的惯性继续滑行,减速停止后才算落定。<br>滑出塔顶边缘会整个掉下去,记得打好提前量!</p><p class="sc" id="ovS"></p><button id="ovB">开始游戏</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovM=document.getElementById('ovM'),ovS=document.getElementById('ovS'),ovB=document.getElementById('ovB');
var W=cv.width,H=cv.height,GROUND=560,BH=22;
var tower,cur,slide,fx,pops,flakes,score,streak,state='ready',cam=0,mode='aim';

function layerC(i){return 'hsl(205,55%,'+(50+(i%3)*6)+'%)';}
function topB(){return tower[tower.length-1];}
function reset(){
  tower=[{x:210,w:150}];score=0;streak=0;fx=[];pops=[];cam=0;slide=null;mode='aim';
  flakes=[];var i;for(i=0;i<30;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,v:18+Math.random()*30,s:1+Math.random()*1.6});
  spawn();
}
function spawn(){
  var t=topB(),left=Math.random()<0.5;
  cur={x:left?36:W-36,dir:left?1:-1,w:t.w,spd:Math.min(2.4+(tower.length-1)*0.06,5.4)};
}
function pop(txt,x,y,c){pops.push({t:txt,x:x,y:y,c:c||'#74c0fc',life:1});}
function tap(){
  if(state!=='play')return;
  if(mode==='aim'&&cur){
    slide={x:cur.x,w:cur.w,v:cur.spd*cur.dir*60};
    cur=null;mode='slide';
  }
}
function resolve(){
  var t=topB();
  var delta=slide.x-t.x,ad=Math.abs(delta),ovw=t.w-ad;
  var byY=GROUND-(tower.length+1)*BH+BH/2;
  if(ovw<=0){
    fx.push({x:slide.x,y:byY,w:slide.w,vx:slide.v*0.2+30,vy:-60,rot:0,vr:2.4,life:1.5,c:layerC(tower.length)});
    slide=null;finish();return;
  }
  if(ad<=7){
    streak++;var pts=10+streak*4;score+=pts;
    pop('完美 +'+pts,t.x,byY-14);
    tower.push({x:t.x,w:t.w});
  }else{
    streak=0;score+=10;
    var cl=slide.x-slide.w/2,cr=slide.x+slide.w/2,tl=t.x-t.w/2,tr=t.x+t.w/2;
    var ol=Math.max(cl,tl),orr=Math.min(cr,tr);
    var nx=(ol+orr)/2,nw=orr-ol,pw,px;
    if(delta>0){pw=cr-tr;px=(tr+cr)/2;}else{pw=tl-cl;px=(cl+tl)/2;}
    if(pw>1)fx.push({x:px,y:byY,w:pw,vx:delta>0?130:-130,vy:-40,rot:0,vr:delta>0?2.6:-2.6,life:1.5,c:layerC(tower.length)});
    tower.push({x:nx,w:nw});
  }
  slide=null;mode='aim';spawn();
}
function finish(){
  state='over';
  var h=tower.length-1;
  window.setTimeout(function(){
    ovT.textContent='滑进深渊了!';
    ovS.textContent='最终高度 '+h+' 层 · 得分 '+score;
    ovM.textContent='冰面无情,落点要放在滑行去路的反侧';
    ovB.textContent='再来一局';
    ov.style.display='flex';
  },700);
}
function start(){reset();state='play';ov.style.display='none';}
function step(dt){
  var i;
  if(state==='play'&&mode==='aim'&&cur){
    cur.x+=cur.spd*cur.dir*dt*60;
    var m=cur.w/2+6;
    if(cur.x<m){cur.x=m;cur.dir=1;}
    if(cur.x>W-m){cur.x=W-m;cur.dir=-1;}
  }
  if(state==='play'&&mode==='slide'&&slide){
    slide.x+=slide.v*dt;
    if(slide.v>0)slide.v=Math.max(0,slide.v-210*dt);
    else slide.v=Math.min(0,slide.v+210*dt);
    var t=topB();
    if(slide.x<t.x-t.w/2-4||slide.x>t.x+t.w/2+4){
      fx.push({x:slide.x,y:GROUND-(tower.length+1)*BH+BH/2,w:slide.w,vx:slide.x>t.x?160:-160,vy:-70,rot:slide.x>t.x?1.6:-1.6,vr:3,life:1.5,c:layerC(tower.length)});
      slide=null;mode='aim';finish();
    }else if(slide.v===0){resolve();}
  }
  for(i=0;i<flakes.length;i++){var fk=flakes[i];fk.y+=fk.v*dt;fk.x+=Math.sin(fk.y*0.02)*10*dt;if(fk.y>H){fk.y=-4;fk.x=Math.random()*W;}}
  for(i=fx.length-1;i>=0;i--){var f=fx[i];f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var p=pops[i];p.life-=dt;p.y-=34*dt;if(p.life<=0)pops.splice(i,1);}
  cam=Math.max(0,300-(GROUND-tower.length*BH));
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#132743');g.addColorStop(1,'#0f1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(i=0;i<flakes.length;i++){var fk=flakes[i];ctx.fillRect(fk.x,fk.y,fk.s,fk.s);}
  var gy=GROUND-cam;
  ctx.fillStyle='#1d2447';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2e3660';ctx.fillRect(0,gy,W,5);
  var b,y;
  for(i=0;i<tower.length;i++){
    b=tower[i];y=GROUND-(tower.length-i)*BH-cam;
    if(y<-BH||y>H)continue;
    ctx.fillStyle=layerC(i);rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(b.x-b.w/2+4,y+5,Math.max(0,b.w-8),4);
  }
  if(cur&&state==='play'&&mode==='aim'){
    y=GROUND-(tower.length+1)*BH-cam;
    ctx.fillStyle=layerC(tower.length);rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.stroke();
  }
  if(slide){
    y=GROUND-(tower.length+1)*BH-cam;
    ctx.strokeStyle='rgba(140,200,255,.5)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(slide.x-slide.v*0.12,y+BH/2);ctx.lineTo(slide.x,y+BH/2);ctx.stroke();
    ctx.fillStyle=layerC(tower.length);rr(slide.x-slide.w/2,y+2,slide.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;rr(slide.x-slide.w/2,y+2,slide.w,BH-4,5);ctx.stroke();
  }
  for(i=0;i<fx.length;i++){
    var f=fx[i];ctx.save();ctx.translate(f.x,f.y-cam);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.c;ctx.fillRect(-f.w/2,-(BH-4)/2,f.w,BH-4);ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,14,32);
  ctx.textAlign='right';ctx.fillText('高度 '+(tower.length-1)+' 层',W-14,32);
  if(streak>1){ctx.fillStyle='#ffd166';ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('连击 x'+streak,14,56);}
  for(i=0;i<pops.length;i++){var p=pops[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y-cam);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
if(window.PointerEvent){cv.addEventListener('pointerdown',function(e){e.preventDefault();tap();});}
else{cv.addEventListener('mousedown',function(){tap();});cv.addEventListener('touchstart',function(e){e.preventDefault();tap();});}
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowDown'||e.key===' '){e.preventDefault();tap();}});
ovB.addEventListener('click',start);
reset();
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,0.033);if(dt<0)dt=0;last=ts;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

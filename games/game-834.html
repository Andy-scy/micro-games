<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛笔速写</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fda4af;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fda4af;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #881337;background:#14101f;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.bar{display:flex;justify-content:center;margin-top:10px}
.bar button{background:#fda4af;color:#4c0519;border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.msg{text-align:center;color:#f87171;font-size:13px;height:18px;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(16,8,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fda4af}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#fda4af;color:#4c0519;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>毛笔速写</h1>
  <p class="hint">照着淡影描红三个大字。<b style="color:#fda4af">笔锋随速度变化</b>:移得慢笔变粗,移得快笔变细;<br>覆盖 ≥60% 即过关,出界越多扣分越重。写完点「呈上作品」。</p>
  <div class="hud"><span>字帖 <b id="lv">1/3</b></span><span>覆盖 <b id="cov">0%</b></span><span>出界 <b id="over">0%</b></span><span>得分 <b id="score">0</b></span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">毛笔速写</h2>
      <p id="ovP">笔锋在腕间:慢行则墨饱笔粗,疾行则笔锋收细。把「永、山、心」三个字描满,感受一手提按顿挫。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">研墨开局</button>
    </div>
  </div>
  <div class="bar"><button id="btnSub">呈上作品</button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo"),btnSub=$("btnSub");
var elLv=$("lv"),elCov=$("cov"),elOver=$("over"),elScore=$("score"),elMsg=$("msg");
var CHS=["永","山","心"];
var N=120,CELL=4;
var FONT="300px 'KaiTi','STKaiti','SimHei',serif";
var state="menu",lv=0,score=0,gmask=null,gcnt=0,paint=null,cntP=0,cntPT=0,cntOver=0;
var isDown=false,last=null,w=12,px=0,py=0;
var pcv=document.createElement("canvas");pcv.width=480;pcv.height=480;
var pctx=pcv.getContext("2d");
var oc=document.createElement("canvas");oc.width=480;oc.height=480;
var octx=oc.getContext("2d");
function covNow(){return gcnt?cntPT/gcnt*100:0;}
function overNow(){return cntP?cntOver/cntP*100:0;}
function loadLevel(){
  octx.clearRect(0,0,480,480);
  octx.font=FONT;octx.textAlign="center";octx.textBaseline="middle";
  octx.fillStyle="#ffffff";
  octx.fillText(CHS[lv],240,252);
  var dat=octx.getImageData(0,0,480,480).data;
  gmask=new Uint8Array(N*N);gcnt=0;
  var i,j;
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var a=dat[((j*CELL+2)*480+(i*CELL+2))*4+3];
    if(a>60){gmask[i*N+j]=1;gcnt++;}
  }
  paint=new Uint8Array(N*N);cntP=0;cntPT=0;cntOver=0;
  pctx.clearRect(0,0,480,480);
  isDown=false;last=null;w=12;
  elLv.textContent=(lv+1)+"/3";elMsg.textContent="";
  hud();draw();
}
function hud(){
  elCov.textContent=Math.floor(covNow())+"%";
  elOver.textContent=Math.floor(overNow())+"%";
  elScore.textContent=score;
}
function mark(x,y,r){
  var rr=r*0.85,gx0=Math.max(0,Math.floor((x-rr)/CELL)),gx1=Math.min(N-1,Math.floor((x+rr)/CELL));
  var gy0=Math.max(0,Math.floor((y-rr)/CELL)),gy1=Math.min(N-1,Math.floor((y+rr)/CELL));
  var i,j;
  for(i=gx0;i<=gx1;i++)for(j=gy0;j<=gy1;j++){
    var cx=i*CELL+2,cy=j*CELL+2;
    if((cx-x)*(cx-x)+(cy-y)*(cy-y)<=rr*rr){
      var id=i*N+j;
      if(!paint[id]){
        paint[id]=1;cntP++;
        if(gmask[id])cntPT++;else cntOver++;
      }
    }
  }
}
function stamp(x,y,r){
  pctx.beginPath();pctx.arc(x,y,r,0,Math.PI*2);
  pctx.fillStyle="#f0abfc";pctx.fill();
  mark(x,y,r);
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function begin(e){
  if(state!=="playing")return;
  var p=pos(e);isDown=true;last=p;w=20;
  stamp(p.x,p.y,w/2);
  hud();draw();
}
function moveP(e){
  if(!isDown||state!=="playing")return;
  var p=pos(e);
  var d=Math.hypot(p.x-last.x,p.y-last.y);
  var tw=Math.max(2.5,Math.min(24,26-d*0.10));
  w=w*0.55+tw*0.45;
  var n=Math.max(1,Math.ceil(d/2.5)),k;
  for(k=0;k<=n;k++){
    stamp(last.x+(p.x-last.x)*k/n,last.y+(p.y-last.y)*k/n,w/2);
  }
  last=p;px=p.x;py=p.y;
  hud();draw();
}
function endP(){isDown=false;last=null;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function draw(){
  ctx.fillStyle="#14101f";ctx.fillRect(0,0,480,480);
  ctx.globalAlpha=0.13;
  ctx.font=FONT;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#e8eaf6";
  ctx.fillText(CHS[lv],240,252);
  ctx.globalAlpha=1;
  ctx.drawImage(pcv,0,0);
  ctx.beginPath();ctx.arc(36,446,Math.max(1.2,w/2),0,Math.PI*2);
  ctx.fillStyle="#f0abfc";ctx.fill();
  ctx.strokeStyle="rgba(232,234,246,0.4)";ctx.lineWidth=1;ctx.stroke();
}
function finish(){
  state="over";
  ovT.textContent="墨宝装裱完成!";
  ovP.textContent="永、山、心三字全部描红交卷,提按之间颇有章法。";
  ovS.style.display="block";ovS.textContent="总分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
btnSub.addEventListener("click",function(){
  if(state!=="playing")return;
  if(cntP===0){elMsg.textContent="笔还没落下呢!";return;}
  var c=covNow(),ov2=overNow();
  if(c>=60){
    var gain=Math.max(1,Math.round(c-Math.max(0,ov2-25)*0.25));
    score+=gain;elScore.textContent=score;
    lv++;
    if(lv>=3){finish();return;}
    state="over";
    ovT.textContent="好字!覆盖 "+Math.floor(c)+"%";
    ovP.textContent="这一笔收放自如,继续下一帖。";
    ovS.style.display="block";ovS.textContent="得分 "+gain+" · 总分 "+score;
    btnGo.textContent="下一帖";
    ov.classList.remove("hide");
  }else{
    elMsg.textContent="覆盖 "+Math.floor(c)+"% 不足 60%,顺着淡影再描几笔!";
  }
});
btnGo.addEventListener("click",function(){
  if(state==="over"&&lv>=1&&lv<3){state="playing";ovS.style.display="none";ov.classList.add("hide");loadLevel();return;}
  lv=0;score=0;state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  loadLevel();
});
loadLevel();
})();
</script>
</body>
</html>

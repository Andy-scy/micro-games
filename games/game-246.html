<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大小写炼狱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:6px}
#wrap{position:relative;width:100%;max-width:760px}
canvas{display:block;width:100%;background:#151a30;border-radius:14px}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#ff9de2}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
button{background:#7c9cff;color:#10142a;border:0;border-radius:10px;padding:10px 24px;font-size:16px;font-family:inherit;cursor:pointer}
button:hover{background:#9ab1ff}
</style>
</head>
<body>
<h1>大小写炼狱</h1>
<div id="tip">单词大小写混杂：必须严格按显示的大小写输入，大写字母要按住 Shift！打对得分翻倍</div>
<div id="hud"></div>
<div id="wrap">
<canvas id="cv" width="760" height="470"></canvas>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<button id="ovBtn">开始游戏</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var BASE=["code","fire","moon","star","wind","iron","gold","rain","snow","leaf","frog","wolf","bear","hawk","king","rose","ship","sword","cloud","storm","flame","brick","ghost","ocean","pearl","pixel","tiger","maple","noble","raven","solar","spark","torch","tulip","whale","zebra","drift","ember","crane","blade","frost","light","quest","vault","wired"];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var wrap=document.getElementById('wrap'),hud=document.getElementById('hud');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),btn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var words,buffer,target,score,lives,kills,level,spawnT,elapsed,shake,running,raf,tPrev,hint;
function fit(){var w=wrap.clientWidth||640;cv.width=w;cv.height=Math.max(340,Math.min(500,Math.round(w*0.6)));}
window.addEventListener('resize',fit);
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mixCase(w){
  var s='';
  for(var i=0;i<w.length;i++){
    var up=Math.random()<0.45;
    s+=up?w.charAt(i).toUpperCase():w.charAt(i);
  }
  if(s===w)s=w.charAt(0).toUpperCase()+w.slice(1);
  return s;
}
function hudUpd(){hud.textContent='得分 '+score+'　生命 '+lives+'　击落 '+kills+'　等级 '+level;}
function reset(){words=[];buffer='';target=-1;score=0;lives=3;kills=0;level=1;spawnT=0.4;elapsed=0;shake=0;hint='';hudUpd();}
function spawn(){
  var t=mixCase(pick(BASE));
  for(var k=0;k<words.length;k++){if(words[k].text===t)return;}
  var xx=rnd(40,Math.max(60,cv.width-110)),ok=false,tries=0;
  while(!ok&&tries++<25){ok=true;xx=rnd(40,Math.max(60,cv.width-110));
    for(var i=0;i<words.length;i++){if(words[i].y<60&&Math.abs(words[i].x-xx)<100){ok=false;break;}}}
  words.push({text:t,x:xx,y:-24,vy:24+level*6+rnd(0,14)});
}
function boom(x,y,col){for(var i=0;i<14;i++)parts.push({x:x,y:y,vx:rnd(-90,90),vy:rnd(-140,30),life:rnd(.3,.7),c:col});}
var parts=[];
function killWord(i){
  var w=words[i];score+=w.text.length*20;kills++;
  if(kills%7===0)level=Math.min(9,level+1);
  boom(w.x+46,w.y+14,'#ff9de2');words.splice(i,1);
  if(target===i){target=-1;buffer='';}else if(target>i)target--;
  hudUpd();
}
function handleChar(ch){
  if(!running)return;
  if(ch==='\b')return;
  if(!/^[a-zA-Z]$/.test(ch))return;
  var cand=-1;
  if(target>=0&&words[target]&&words[target].text.charAt(buffer.length)===ch)cand=target;
  if(cand<0){
    for(var i=0;i<words.length;i++){
      if(i!==target&&words[i].text.charAt(0)===ch){cand=i;break;}
    }
    if(cand>=0)buffer='';
  }
  if(cand<0){
    buffer='';target=-1;shake=Math.max(shake,3);
    hint='按错：注意大小写！';
    return;
  }
  target=cand;buffer+=ch;hint='';
  if(buffer===words[target].text)killWord(target);
}
function update(dt){
  elapsed+=dt;shake=Math.max(0,shake-dt*12);
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(0.9,2.2-level*0.13);}
  for(var i=words.length-1;i>=0;i--){
    var w=words[i];w.y+=w.vy*dt;
    if(w.y>cv.height-40){
      boom(w.x+46,cv.height-36,'#ff6b6b');words.splice(i,1);
      if(target===i){target=-1;buffer='';}else if(target>i)target--;
      lives--;shake=6;hudUpd();
      if(lives<=0){end(false);return;}
    }
  }
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;
    if(p.life<=0)parts.splice(j,1);
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  ctx.strokeStyle='rgba(255,107,107,.55)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(0,cv.height-26);ctx.lineTo(cv.width,cv.height-26);ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='bold 21px ui-monospace, Consolas, monospace';
  for(var i=0;i<words.length;i++){
    var w=words[i],tw=ctx.measureText(w.text).width;
    ctx.fillStyle='rgba(255,157,226,.12)';rr(w.x,w.y,tw+22,30,8);ctx.fill();
    if(i===target){ctx.strokeStyle='#ffd76a';ctx.lineWidth=2;rr(w.x,w.y,tw+22,30,8);ctx.stroke();}
    var done=(i===target)?buffer:'';
    var pre=w.text.slice(0,done.length);
    ctx.fillStyle='#ffd76a';ctx.fillText(pre,w.x+11,w.y+21);
    ctx.fillStyle='#e8eaf6';ctx.fillText(w.text.slice(done.length),w.x+11+ctx.measureText(pre).width,w.y+21);
  }
  if(hint){ctx.font='14px system-ui, sans-serif';ctx.fillStyle='#ff6b6b';ctx.fillText(hint,16,24);}
  for(var j=0;j<parts.length;j++){
    var p=parts[j];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  update(dt);draw();
  raf=requestAnimationFrame(loop);
}
function end(win){
  running=false;
  ovT.textContent=win?'炼狱通关':'坠落太多';
  ovX.textContent='得分 '+score+'\n击落 '+kills+' 个混排单词　等级 '+level+'\n坚持 '+Math.round(elapsed)+' 秒';
  btn.textContent='再来一局';
  ov.classList.remove('hide');
}
function start(){
  fit();reset();ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  wrap.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
bindTyping(handleChar);
btn.addEventListener('click',start);
fit();reset();
ovT.textContent='大小写炼狱';
ovX.textContent='单词的每个字母大小写随机混合，必须严格按原样输入。\n大写字母需要按住 Shift 输入，打错任意一位即清空输入。\n每个字母计 20 分（普通模式的两倍），漏 3 个单词失败。';
btn.textContent='开始游戏';
})();
</script>
</body>
</html>

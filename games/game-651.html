<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学脑洞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
#app{width:100%;max-width:460px}
h1{font-size:24px;text-align:center;color:#9d8cff;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:12px}
.card{background:#1a1f36;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:13px}
.big{font-size:18px;font-weight:800;color:#9d8cff}
.tbarWrap{height:10px;background:#232a48;border-radius:6px;overflow:hidden;margin-bottom:10px}
#tbar{height:100%;width:100%;background:#9d8cff;border-radius:6px}
#q{font-size:17px;line-height:1.7;text-align:center;min-height:64px;margin-bottom:10px}
#in{text-align:center;font-size:30px;font-weight:800;color:#ffd166;background:#232a48;border:2px solid #2c3357;border-radius:10px;padding:8px 0;margin-bottom:10px;min-height:56px;letter-spacing:4px}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pad button{border:2px solid #2c3357;background:#232a48;color:#e8eaf6;border-radius:10px;padding:12px 0;font-size:18px;cursor:pointer;font-family:inherit}
#pad button:active{transform:scale(.96)}
#pad .fn{color:#9d8cff;font-size:15px}
#pad .go{background:#9d8cff;color:#161033;font-weight:800;border-color:#9d8cff}
#msg{text-align:center;font-size:14px;color:#cdd6f4;min-height:20px;margin-top:10px}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:26px 30px;text-align:center;max-width:88vw}
.ov h2{color:#9d8cff;margin-bottom:10px;font-size:24px}
.ov p{color:#cdd6f4;margin-bottom:16px;line-height:1.8;font-size:14px;text-align:left}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#9d8cff;color:#161033;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <h1>数学脑洞</h1>
  <p class="tips">不是选择题!数列找规律、和差倍数、年龄问题、鸡兔同笼、趣味巧算…… 用数字键盘输入答案再按「确定」。每题 30 秒,共 12 题,3 条命;10 秒内答出额外 +50。</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">进度</div><div class="big" id="pg">0/12</div></div>
    <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
  </div></div>
  <div class="card">
    <div class="tbarWrap"><div id="tbar"></div></div>
    <div id="q">……</div>
    <div id="in">?</div>
    <div id="pad"></div>
    <div id="msg"></div>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">数学脑洞</h2><p id="ovp">· 每题限时 30 秒,答案为整数<br>· 点数字键盘输入,「确定」提交<br>　(也支持键盘数字键、退格与回车)<br>· 答对 +150,10 秒内答出再 +50<br>· 答错或超时 -1 条命并公布答案<br>· 共 12 题,3 命用完结束</p><button class="btn" id="obtn">开始解题</button></div></div>
<script>
'use strict';
function $(id){return document.getElementById(id)}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function genArith(){
  var a=ri(1,9),d=ri(2,6),t=[a,a+d,a+2*d,a+3*d];
  return {q:'找规律:'+t.join(', ')+', ?',a:a+4*d};
}
function genGeo(){
  var a=ri(1,3),r=Math.random()<0.5?2:3,t=[a];
  var i;for(i=0;i<3;i++)t.push(t[i]*r);
  return {q:'找规律:'+t.join(', ')+', ?',a:t[3]*r};
}
function genIncStep(){
  var a=ri(1,5),t=[a,a+1,a+3,a+6];
  return {q:'找规律:'+t.join(', ')+', ?',a:a+10};
}
function genFib(){
  var a=ri(1,3),b=ri(1,3),t=[a,b,a+b,a+2*b];
  return {q:'找规律:'+t.join(', ')+', ?',a:a+3*b};
}
function genEq1(){
  var x=ri(2,9),k=ri(3,9);
  return {q:'一个数加上 '+k+' 恰好等于 '+(x+k)+',这个数是几?',a:x};
}
function genEq2(){
  var x=ri(2,9),k=ri(2,6);
  return {q:'一个数乘以 '+k+' 恰好等于 '+(x*k)+',这个数是几?',a:x};
}
function genEq3(){
  var x=ri(2,15),k=ri(3,9);
  return {q:(x+k)+' 减去一个数恰好等于 '+k+',这个数是几?',a:x};
}
function genAge(){
  var a=ri(6,12),n=ri(3,10);
  return {q:'小明今年 '+a+' 岁,妈妈今年 '+(a+24)+' 岁,过了 '+n+' 年后,妈妈比小明大几岁?',a:24};
}
function genChicken(){
  var h=ri(4,7),r=ri(1,h-1),legs=2*h+2*r;
  return {q:'鸡兔同笼:共有 '+h+' 个头、'+legs+' 条腿,兔子有几只?',a:r};
}
var RIDDLES=[
{q:'1+2+3+…+10 等于多少?',a:55},
{q:'一根木头锯成 4 段,一共要锯几次?',a:3},
{q:'钟面上 3 点整,时针与分针的夹角是多少度?',a:90},
{q:'珠子按"黑黑白"的顺序循环排列,前 9 颗里有几颗白的?',a:3},
{q:'树上有 5 只鸟,开枪打下 1 只,树上还剩几只鸟?',a:0},
{q:'一个数减去 6 再乘 2 等于 16,这个数是几?',a:14},
{q:'小丽有 24 颗糖,分一半给妹妹,又吃掉 3 颗,还剩几颗?',a:9},
{q:'小明和小华共有 18 支笔,两人笔数相同,每人各有几支?',a:9}
];
var N=12,QLEN=30;
var quiz=[],idx=0,score=0,lives=3,playing=false,over=false,locked=false,qLeft=QLEN,S=0,input='';
function schedule(fn,ms){var tk=S;setTimeout(function(){if(tk===S)fn();},ms);}
function buildQuiz(){
  var seqG=[genArith,genGeo,genIncStep,genFib];
  var eqG=[genEq1,genEq2,genEq3];
  var arr=[],i;
  shuffle(seqG);shuffle(eqG);shuffle(RIDDLES.slice());
  for(i=0;i<3;i++)arr.push(seqG[i]());
  for(i=0;i<2;i++)arr.push(eqG[i]());
  arr.push(genAge());
  for(i=0;i<2;i++)arr.push(genChicken());
  var rds=shuffle(RIDDLES.slice()).slice(0,4);
  for(i=0;i<rds.length;i++)arr.push(rds[i]);
  return shuffle(arr).slice(0,N);
}
function buildPad(){
  var pad=$('pad');pad.innerHTML='';
  var keys=['7','8','9','4','5','6','1','2','3','清','0','退格'];
  for(var i=0;i<keys.length;i++){
    var b=document.createElement('button');
    b.textContent=keys[i];
    if(keys[i]==='清'||keys[i]==='退格')b.className='fn';
    (function(k){b.addEventListener('click',function(){press(k)});})(keys[i]);
    pad.appendChild(b);
  }
  var go=document.createElement('button');
  go.className='go';go.textContent='确定';
  go.style.gridColumn='1 / span 3';
  go.addEventListener('click',submit);
  pad.appendChild(go);
}
function press(k){
  if(!playing||over||locked)return;
  if(k==='清'){input='';}
  else if(k==='退格'){input=input.slice(0,-1);}
  else if(input.length<4){input+=k;}
  paintIn();
}
function paintIn(){
  $('in').textContent=input===''?'?':input;
}
function startGame(){
  S++;idx=0;score=0;lives=3;over=false;playing=true;locked=false;input='';
  quiz=buildQuiz();
  buildPad();
  $('sc').textContent='0';$('hp').textContent='♥♥♥';
  $('overlay').classList.add('hide');
  showQ();
}
function showQ(){
  if(idx>=N){finish(true);return;}
  var it=quiz[idx];
  locked=false;qLeft=QLEN;input='';
  paintIn();
  $('pg').textContent=(idx+1)+'/'+N;
  $('q').textContent=it.q;
  $('msg').textContent='';
}
function submit(){
  if(!playing||over||locked)return;
  if(input==='')return;
  var it=quiz[idx];
  locked=true;
  if(parseInt(input,10)===it.a){
    var bonus=qLeft>=QLEN-10?50:0;
    score+=150+bonus;
    $('in').style.borderColor='#51d88a';
    $('msg').textContent='正确!+'+(150+bonus)+' 分';
  }else{
    lives--;$('hp').textContent=lives>0?new Array(lives+1).join('♥'):'—';
    $('in').style.borderColor='#ff5c5c';
    $('msg').textContent='不对哦,正确答案是 '+it.a;
  }
  $('sc').textContent=score;
  schedule(function(){
    if(!playing||over)return;
    if(lives<=0)finish(false);
    else{idx++;showQ();}
  },1400);
}
function finish(win){
  playing=false;over=true;
  var rank=score>=1800?'数学小天才!':(score>=1200?'思路清晰!':'脑洞已开!');
  $('ovt').textContent=win?'全部解出 · '+rank:'生命耗尽…';
  $('ovp').innerHTML='完成 '+Math.min(idx+1,N)+'/'+N+' 题<br>最终得分 <b>'+score+'</b> 分<br>'+rank+' 画图列式有帮助,再来一局!';
  $('obtn').textContent='再来一局';
  $('overlay').classList.remove('hide');
}
$('obtn').addEventListener('click',startGame);
document.addEventListener('keydown',function(e){
  if(!playing||over||locked)return;
  if(e.key>='0'&&e.key<='9'&&input.length<4){input+=e.key;paintIn();}
  else if(e.key==='Backspace'){input=input.slice(0,-1);paintIn();}
  else if(e.key==='Enter'){submit();}
});
var last=performance.now();
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  if(playing&&!over&&!locked){
    qLeft-=dt;
    if(qLeft<0)qLeft=0;
    $('tbar').style.width=(qLeft/QLEN*100)+'%';
    if(qLeft<=0){
      locked=true;
      var it=quiz[idx];
      lives--;$('hp').textContent=lives>0?new Array(lives+1).join('♥'):'—';
      $('in').style.borderColor='#ff5c5c';
      $('msg').textContent='超时!正确答案是 '+it.a;
      schedule(function(){
        if(!playing||over)return;
        if(lives<=0)finish(false);
        else{idx++;showQ();}
      },1400);
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

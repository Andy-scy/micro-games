<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>气泡浮生</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#56cfe1;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#56cfe1;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#56cfe1}
.overlay p{color:#aab0d0;font-size:13px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#56cfe1;color:#03303a;border:none;border-radius:10px;padding:10px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>气泡浮生</h1>
  <p class="hint">← → 或按住屏幕左右侧制造水流,引导气泡靠拢<br>同级气泡相碰合体上浮,合成 128 珍珠王得 500 分,别碰顶部尖刺!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>生命 <b id="life">●●●</b></span>
    <span>最高 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="340" height="430"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">气泡浮生</h2>
      <p id="ovP">气泡从水底升起,同级相遇就合体\n用水流让它们抱团,小心顶上的刺!</p>
      <div class="big" id="ovS"></div>
      <button id="btn">开 始</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var W=340,H=430,SPIKE=34;
var RAD=[0,13,18,24,31,38,46,54];
var COL=['','#9be7f7','#7fd4ff','#8fb8ff','#a78bfa','#f0abfc','#f9a8d4','#ffd166'];
var bubbles=[],score=0,best=0,life=3,state='ready';
var wind=0,windT=0,spawnT=0,tG=0,pops=[],keyL=false,keyR=false;
function randL(){var r=Math.random();return r<0.5?1:(r<0.85?2:3);}
function addScore(n){score+=n;if(score>best)best=score;$('score').textContent=score;$('best').textContent=best;}
function pop(x,y,r,c){pops.push({x:x,y:y,r:r,t:0,c:c});}
function spawn(){
  var lvl=randL(),r=RAD[lvl];
  bubbles.push({x:r+8+Math.random()*(W-2*r-16),y:H+r+6,lvl:lvl,vx:0,vy:-(38+lvl*7),ph:Math.random()*6.28});
}
function update(dt){
  var i,j;
  tG+=dt;spawnT+=dt;
  if(spawnT>=1.15){spawnT=0;spawn();}
  if(keyL)windT=-1;else if(keyR)windT=1;else windT=0;
  wind=wind+(windT-wind)*Math.min(1,dt*5);
  for(i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.vx+=(wind*60+Math.sin(tG*2+b.ph)*12)*dt;
    b.vx*=(1-0.5*dt);
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    if(b.x<b.r+4){b.x=b.r+4;b.vx=Math.abs(b.vx)*0.5;}
    if(b.x>W-b.r-4){b.x=W-b.r-4;b.vx=-Math.abs(b.vx)*0.5;}
  }
  for(i=0;i<bubbles.length;i++){
    var a=bubbles[i];
    if(a.dead)continue;
    for(j=i+1;j<bubbles.length;j++){
      var c=bubbles[j];
      if(c.dead||c.lvl!==a.lvl)continue;
      var dx=c.x-a.x,dy=c.y-a.y,rr=(a.r+c.r)*0.9;
      if(dx*dx+dy*dy<rr*rr){
        a.dead=true;c.dead=true;
        var mx=(a.x+c.x)/2,my=(a.y+c.y)/2;
        if(a.lvl>=7){addScore(500);pop(mx,my,RAD[7],'#ffd166');}
        else{
          var nl=a.lvl+1;
          bubbles.push({x:mx,y:my,lvl:nl,vx:(a.vx+c.vx)*0.4,vy:-(38+nl*7),ph:Math.random()*6.28});
          addScore(nl*8);
          pop(mx,my,RAD[nl],COL[nl]);
        }
        break;
      }
    }
  }
  var keep=[];
  for(i=0;i<bubbles.length;i++)if(!bubbles[i].dead)keep.push(bubbles[i]);
  bubbles=keep;
  for(i=bubbles.length-1;i>=0;i--){
    var s=bubbles[i];
    if(s.y-s.r<SPIKE){
      pop(s.x,s.y,s.r,'#ff5d5d');
      bubbles.splice(i,1);
      life--;$('life').textContent=life>0?'●●●'.slice(0,life*1):'—';
      if(life<=0){finish();return;}
    }
  }
  for(i=0;i<pops.length;i++)pops[i].t+=dt;
  var k=[];
  for(i=0;i<pops.length;i++)if(pops[i].t<0.45)k.push(pops[i]);
  pops=k;
}
function finish(){
  state='over';
  $('ovT').textContent='气泡全碎了';
  $('ovP').textContent='尖刺无情,海水冰凉……';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function start(){
  bubbles=[];pops=[];score=0;life=3;wind=0;spawnT=0.6;
  $('score').textContent='0';$('life').textContent='●●●';$('best').textContent=String(best);
  $('ov').classList.add('hide');state='play';
}
$('btn').addEventListener('click',start);
window.addEventListener('keydown',function(e){
  if(e.keyCode===37)keyL=true;
  if(e.keyCode===39)keyR=true;
});
window.addEventListener('keyup',function(e){
  if(e.keyCode===37)keyL=false;
  if(e.keyCode===39)keyR=false;
});
function posOf(e){
  var t=e.touches?(e.touches[0]||e.changedTouches[0]):e;
  var rc=cv.getBoundingClientRect();
  return (t.clientX-rc.left)*W/rc.width;
}
function down(e){if(state==='play'){windT=Math.max(-1,Math.min(1,(posOf(e)-W/2)/(W/2)*1.6));wind=windT;press=true;}e.preventDefault();}
var press=false;
function move(e){if(state==='play'&&press){windT=Math.max(-1,Math.min(1,(posOf(e)-W/2)/(W/2)*1.6));wind=windT;}if(e.type!=='mousemove')e.preventDefault();}
function up(){press=false;if(state==='play')windT=0;}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up,{passive:false});
function draw(){
  ctx.clearRect(0,0,W,H);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a2030');g.addColorStop(1,'#0d2f42');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<COLS_X;i++){
    var sx=i*(W/COLS_X);
    ctx.beginPath();
    ctx.moveTo(sx,SPIKE);ctx.lineTo(sx+W/COLS_X/2,6);ctx.lineTo(sx+W/COLS_X,SPIKE);
    ctx.closePath();
    ctx.fillStyle='rgba(190,205,220,.85)';ctx.fill();
  }
  for(i=0;i<pops.length;i++){
    var p=pops[i],pr=p.t/0.45;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+pr*1.5),0,7);
    ctx.strokeStyle=p.c;ctx.globalAlpha=1-pr;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;
  }
  for(i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    var bg=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.35,b.r*0.15,b.x,b.y,b.r);
    bg.addColorStop(0,'rgba(255,255,255,.9)');bg.addColorStop(0.4,COL[b.lvl]);bg.addColorStop(1,'rgba(30,60,90,.55)');
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);
    ctx.fillStyle=bg;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.font='700 '+Math.min(20,11+b.lvl*1.5)+'px system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(Math.pow(2,b.lvl)),b.x,b.y+1);
  }
  var wa=Math.abs(wind);
  if(wa>0.05){
    ctx.save();ctx.globalAlpha=Math.min(0.5,wa);
    ctx.strokeStyle='#9be7f7';ctx.lineWidth=2;
    var dir=wind>0?1:-1,n;
    for(n=0;n<3;n++){
      var yy=H-40-n*26+((tG*40)%26);
      ctx.beginPath();ctx.moveTo(W/2-20*dir,yy);ctx.lineTo(W/2+20*dir,yy);
      ctx.moveTo(W/2+12*dir,yy-5);ctx.lineTo(W/2+20*dir,yy);ctx.lineTo(W/2+12*dir,yy+5);
      ctx.stroke();
    }
    ctx.restore();
  }
}
var COLS_X=10;
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,0.05);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心算防线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#f87171;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f87171;font-size:16px}
.qbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.qbar .q{font-size:30px;font-weight:800}
.qbar .in{font-size:22px;font-weight:800;color:#f87171;background:#0b0e1a;border-radius:8px;padding:6px 14px;min-width:96px;text-align:center}
.qbar .in.badc{color:#0b0e1a;background:#f87171}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.kp button{background:#232949;color:#e8eaf6;border:none;border-radius:8px;padding:10px 0;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.kp button:active{transform:scale(.93)}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:8px;color:#8b90b0}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#f87171}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f87171;color:#3d0a0a;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>心算防线</h1>
  <p class="hint">敌舰载着数字逼近防线 · 键入当前题目的答案即可击沉对应敌舰 · 键盘或屏上键盘均可</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>击毁 <b id="kill">0</b></span>
    <span>第 <b id="wave">1</b> 波</span>
    <span>生命 <b id="lives">❤❤❤</b></span>
  </div>
  <div class="qbar"><div class="q" id="q">7 × 8 = ?</div><div class="in" id="in">&nbsp;</div></div>
  <div class="stage">
    <canvas id="cv" width="460" height="330"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">心算防线</h2>
      <p id="ovD">屏幕上方给出算式,每艘敌舰都标着一个数。键入正确答案,等于该数的敌舰会被立刻击沉;答错将触发敌舰加速!敌舰越过底部防线会扣一颗心。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">部署防线</button>
    </div>
  </div>
  <div class="kp" id="kp">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="fire">发射</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var elScore=$("score"),elKill=$("kill"),elWave=$("wave"),elLives=$("lives");
var elQ=$("q"),elIn=$("in"),elMsg=$("msg"),kp=$("kp");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo");
var W=460,H=330,LINE=H-26;
var state,score,kills,wave,lives,ships,q,ans,input,speedBoost,particles,lastT;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function updHud(){
  elScore.textContent=score;elKill.textContent=kills;elWave.textContent=wave;
  var h="",i;
  for(i=0;i<3;i++)h+=i<lives?"❤":"♡";
  elLives.textContent=h;
}
function makeQ(){
  var t=rnd(0,3),a,b,c;
  if(t===0){a=rnd(11,49);b=rnd(11,49);c=a+b;t="+";}
  else if(t===1){a=rnd(21,99);b=rnd(11,a-1);c=a-b;t="-";}
  else if(t===2){a=rnd(3,12);b=rnd(3,12);c=a*b;t="×";}
  else{b=rnd(3,9);c=rnd(3,12);a=b*c;t="÷";}
  q=a+" "+t+" "+b+" = ?";
  ans=c;
  elQ.textContent=q;
  assignVals();
}
function assignVals(){
  var n=shipCount(),vals=[ans],tries=0,i;
  while(vals.length<n&&tries<300){
    tries++;
    var v=ans+rnd(-15,15);
    if(v>=0&&v!==ans&&vals.indexOf(v)<0)vals.push(v);
  }
  while(vals.length<n)vals.push(rnd(0,120));
  for(i=vals.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,tmp=vals[i];vals[i]=vals[j];vals[j]=tmp;}
  for(i=0;i<ships.length;i++)ships[i].v=vals[i%vals.length];
}
function shipCount(){return Math.min(4+Math.floor((wave-1)/2),6);}
function laneX(i,n){return (i+0.5)*(W/n);}
function spawnShip(i){
  var n=shipCount();
  ships.push({x:laneX(i,n),y:rnd(-70,-30),vy:(16+wave*3)*0.9+Math.random()*8,v:0,ph:Math.random()*6});
}
function ensureShips(){
  var n=shipCount(),before=ships.length;
  while(ships.length<n)spawnShip(ships.length);
  if(ships.length!==before)assignVals();
}
function newWave(){
  ensureShips();
  assignVals();
}
function setIn(t){
  elIn.innerHTML=t===""?"&nbsp;":t;
  elIn.className="in";
}
function fire(){
  if(state!=="playing"||input==="")return;
  var v=parseInt(input,10),i,hit=-1;
  for(i=0;i<ships.length;i++){
    if(ships[i].v===v){hit=i;break;}
  }
  if(hit<0){
    elIn.className="in badc";
    speedBoost=2000;
    input="";
    setTimeout(function(){if(state==="playing")setIn(input="");},240);
    return;
  }
  var s=ships[hit];
  explode(s.x,s.y,s.v===ans?"#4ade80":"#fbbf24");
  ships.splice(hit,1);
  input="";
  setIn("");
  if(v===ans){
    score+=10+wave*2;
    kills++;
    setMsg("正中答案!敌舰击沉","");
    if(kills%4===0){
      wave++;
      setMsg("第 "+wave+" 波来袭,敌舰增援提速!","");
    }
    ensureShips();
    makeQ();
  }else{
    score+=2;
    setMsg("击沉诱饵舰 +2",""); 
  }
  updHud();
}
function explode(x,y,c){
  var i;
  for(i=0;i<14;i++){
    var a=Math.random()*Math.PI*2,sp=30+Math.random()*70;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:600,c:c});
  }
}
function breach(s){
  lives--;
  updHud();
  if(s.v===ans){
    setMsg("答案舰溜走了!生命 -1,换新题目","");
    makeQ();
  }else{
    setMsg("敌舰突破防线!生命 -1","");
  }
  if(lives<=0)gameOver();
}
function gameOver(){
  state="over";
  ovT.textContent="防线失守…";
  ovD.textContent="你击毁了 "+kills+" 艘敌舰,坚守到第 "+wave+" 波。";
  ovS.style.display="block";
  ovS.textContent="得分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  state="playing";score=0;kills=0;wave=1;lives=3;
  ships=[];particles=[];input="";speedBoost=0;lastT=0;
  setIn("");
  ensureShips();
  makeQ();
  updHud();
  setMsg("");
  ov.classList.add("hide");
}
function press(k){
  if(state!=="playing")return;
  if(k==="del")input=input.slice(0,-1);
  else if(k==="fire")fire();
  else if(input.length<3)input+=k;
  setIn(input);
  if(input!==""){
    var v=parseInt(input,10),i;
    for(i=0;i<ships.length;i++){
      if(ships[i].v===v){fire();return;}
    }
    if(v===ans)fire();
  }
}
kp.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute("data-k"))press(t.getAttribute("data-k"));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
    return;
  }
  if(e.key>="0"&&e.key<="9"){press(e.key);e.preventDefault();}
  else if(e.key==="Backspace"){press("del");e.preventDefault();}
  else if(e.key==="Enter"){press("fire");e.preventDefault();}
});
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="rgba(248,113,113,0.5)";
  ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="rgba(248,113,113,0.75)";
  ctx.font="11px system-ui";
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("防线",6,LINE-8);
  var i;
  for(i=0;i<ships.length;i++){
    var s=ships[i];
    var wob=Math.sin(s.ph)*2;
    ctx.fillStyle="#39406b";
    ctx.fillRect(s.x-30,s.y-8+ (s.v===ans?0:wob),60,40);
    ctx.fillStyle="#f87171";
    ctx.beginPath();
    ctx.arc(s.x,s.y-8+(s.v===ans?0:wob),14,Math.PI,0);
    ctx.fill();
    ctx.fillStyle="#e8eaf6";
    ctx.font="bold 19px system-ui";
    ctx.textAlign="center";
    ctx.fillText(s.v,s.x,s.y+16+(s.v===ans?0:wob));
  }
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/600);
    ctx.fillStyle=p.c;
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  if(state==="playing"){
    if(speedBoost>0)speedBoost-=dt;
    var mul=speedBoost>0?1.8:1;
    for(i=ships.length-1;i>=0;i--){
      var s=ships[i];
      s.ph+=dt*0.004;
      s.y+=s.vy*mul*dt/1000;
      if(s.y>LINE-14){
        ships.splice(i,1);
        explode(s.x,LINE-16,"#f87171");
        breach(s);
      }
    }
    if(state==="playing")ensureShips();
  }
  draw();
}
startGame();
state="menu";
ov.classList.remove("hide");
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

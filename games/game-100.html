<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连锁倍率</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd43b;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#ffd43b;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#ffd43b;color:#332a05;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#ffd43b;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>连锁倍率</h1>
<p class="tip">←→↑↓/WASD 或按住拖动移动,空格 / 按住屏幕开火。2.5 秒内连续击坠会叠加连锁倍率(最高 x8),击坠得分 = 基础分 x 倍率;x5 以上进入超载射速。拿到 1000 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">连锁倍率</h2>
<p id="ovX">这里比的不是击坠数,是节奏:连着杀分才涨,断了火倍率清零。像节拍器一样保持猎杀韵律吧。</p>
<button id="btn">开始连击</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>倍率<b id="hC">x1</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hC=document.getElementById("hC"),hH=document.getElementById("hH");
var GOAL=1000,WINDOW=2.5;
var state="ready",score=0,hp=3,inv=0,cool=0,t=0,spawn=0.7,heavyT=5;
var combo=0,comboT=0,kills=0;
var ship={x:W/2,y:H-80};
var bullets=[],ebullets=[],enemies=[],parts=[],texts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*24+8});}
function reset(){
  score=0;hp=3;inv=0;cool=0;t=0;spawn=0.6;heavyT=4.5;combo=0;comboT=0;kills=0;
  ship.x=W/2;ship.y=H-80;
  bullets=[];ebullets=[];enemies=[];parts=[];texts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function ftext(x,y,txt,col){
  texts.push({x:x,y:y,txt:txt,col:col,life:0.8});
}
function kill(e,idx){
  combo=Math.min(8,combo+1);
  comboT=WINDOW;
  var base=e.heavy?30:10;
  var pts=base*combo;
  score+=pts;
  kills++;
  ftext(e.x,e.y,"+"+pts+(combo>1?" x"+combo:""),combo>=5?"#ffd43b":"#ffffff");
  boom(e.x,e.y,e.heavy?18:10,"#ffd166");
  enemies.splice(idx,1);
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"倍率满贯":"连锁中断";
  ovX.textContent="最终得分:"+score+"(击坠 "+kills+" 架)"+(win?" · 你把整片星域打成了节拍器!":" · 想拿高分?击坠之间别停火超过 2.5 秒。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;spawn-=dt;heavyT-=dt;
  if(comboT>0){
    comboT-=dt;
    if(comboT<=0)combo=0;
  }
  var sp=285;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.45,Math.min(H-40,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0){
    cool=combo>=5?0.12:0.19;
    bullets.push({x:ship.x,y:ship.y-18,big:combo>=5});
  }
  if(spawn<=0){
    spawn=Math.max(0.5,1.4-score*0.0004);
    enemies.push({x:40+Math.random()*(W-80),y:-30,vy:110+Math.random()*50,hp:1,ph:Math.random()*6.283,heavy:false});
  }
  if(heavyT<=0){
    heavyT=Math.max(3.5,6.5-score*0.001);
    enemies.push({x:60+Math.random()*(W-120),y:-34,vy:55,hp:4,ph:Math.random()*6.283,heavy:true});
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    bullets[bi].y-=560*dt;
    if(bullets[bi].y<-20)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.vy*dt;
    e.x+=Math.sin(t*3+e.ph)*(e.heavy?25:60)*dt;
    if(e.y>H+30){enemies.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<(e.heavy?26:20)&&Math.abs(e.y-ship.y)<(e.heavy?26:20)){
      enemies.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,12,"#ff6b6b");
      combo=0;comboT=0;
      ftext(ship.x,ship.y-30,"连锁中断!","#e05555");
    }
  }
  if(Math.random()<dt*0.6&&enemies.length){
    var e3=enemies[Math.floor(Math.random()*enemies.length)];
    var dx=ship.x-e3.x,dy=ship.y-e3.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    ebullets.push({x:e3.x,y:e3.y+12,vx:dx/d*190,vy:dy/d*190});
  }
  for(i=ebullets.length-1;i>=0;i--){
    var b=ebullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-10||b.x>W+10||b.y>H+10){ebullets.splice(i,1);continue;}
    if(inv<=0&&Math.abs(b.x-ship.x)<11&&Math.abs(b.y-ship.y)<13){
      ebullets.splice(i,1);
      hp--;inv=1.3;
      boom(ship.x,ship.y,12,"#ff6b6b");
      combo=0;comboT=0;
      ftext(ship.x,ship.y-30,"连锁中断!","#e05555");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      var rr=e2.heavy?26:(bl.big?22:17);
      var dx2=bl.x-e2.x,dy2=bl.y-e2.y;
      if(dx2*dx2+dy2*dy2<rr*rr){
        bullets.splice(bi,1);
        e2.hp--;
        if(e2.hp<=0){
          kill(e2,j);
          if(state!=="play")return;
        }
        break;
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(i=texts.length-1;i>=0;i--){
    var tx=texts[i];
    tx.y-=42*dt;tx.life-=dt;
    if(tx.life<=0)texts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(score>=GOAL)gameOver(true);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#ffd43b";
  for(i=0;i<bullets.length;i++){
    var bl=bullets[i];
    if(bl.big)ctx.fillRect(bl.x-3.5,bl.y-13,7,18);
    else ctx.fillRect(bl.x-2,bl.y-10,4,14);
  }
  ctx.fillStyle="#ff9f43";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    if(e.heavy){
      ctx.fillStyle="#c0456c";
      ctx.fillRect(-20,-16,40,32);
      ctx.fillStyle="#ffd166";
      ctx.fillRect(-8,-6,16,12);
    }else{
      ctx.fillStyle="#ff6b6b";
      ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(-14,-10);ctx.lineTo(14,-10);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  for(i=0;i<texts.length;i++){
    var tx=texts[i];
    ctx.globalAlpha=Math.min(1,tx.life*1.5);
    ctx.fillStyle=tx.col;
    ctx.font="bold 14px system-ui";ctx.textAlign="center";
    ctx.fillText(tx.txt,tx.x,tx.y);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#ffd43b";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    if(combo>=5){
      ctx.fillStyle="#ff8787";
      ctx.fillRect(-24,-4,6,6);
      ctx.fillRect(18,-4,6,6);
    }
    ctx.restore();
  }
  if(state==="play"&&combo>0){
    ctx.textAlign="right";
    ctx.fillStyle=combo>=5?"#ffd43b":"#e8ecf8";
    ctx.font="bold 30px system-ui";
    ctx.fillText("x"+combo,W-18,56);
    ctx.fillStyle="#1d2440";ctx.fillRect(W-118,64,100,6);
    ctx.fillStyle=combo>=5?"#ffd43b":"#74c0fc";
    ctx.fillRect(W-118,64,100*comboT/WINDOW,6);
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;hC.textContent="x"+Math.max(1,combo);hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

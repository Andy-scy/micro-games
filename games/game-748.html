<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黄金弹匣</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#hAmmo{color:#ffd76a;font-size:17px;font-weight:700}
#stage{position:relative}
canvas{display:block;background:#10142a;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto;cursor:crosshair}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:14px;margin-top:8px;user-select:none;-webkit-user-select:none}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>黄金弹匣</h1>
<div id="hud"><span>弹药 <b id="hAmmo">12</b></span><span>目标 <b id="hB">0</b></span><span>回合 <b id="hC">1</b></span><span>分数 <b id="hD">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>黄金弹匣</h2>
  <p id="ovP">每一发炮弹都弥足珍贵:弹药耗尽且场上仍有靶标即失败。<br>WASD 移动,鼠标瞄准,点击开火;击毁全部移动靶标进入下一回合。<br>碾过补给箱 +3 弹药;命中率高,结算奖励越多。</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div class="pbtn" data-k="KeyW">▲</div>
  <div class="pbtn" data-k="KeyA">◀</div>
  <div class="pbtn" data-k="KeyS">▼</div>
  <div class="pbtn" data-k="KeyD">▶</div>
</div>
<script>
"use strict";
const TS=32,COLS=15,ROWS=13;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hAmmo=document.getElementById('hAmmo'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD');
let grid,score,ammo,hits,shots,round,targets,crates,bullets,parts,player,frame=0,state='start';
const keys={};
let aim={x:240,y:200};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function updateAim(e){
  const r=cv.getBoundingClientRect();
  aim.x=(e.clientX-r.left)*cv.width/r.width;
  aim.y=(e.clientY-r.top)*cv.height/r.height;
}
cv.addEventListener('mousemove',updateAim);
cv.addEventListener('mousedown',e=>{updateAim(e);shoot();});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];updateAim(t);shoot();},{passive:false});
function rectVsGrid(x,y){
  if(x<0||y<0||x+28>cv.width||y+28>cv.height)return true;
  const x0=Math.floor(x/TS),y0=Math.floor(y/TS),x1=Math.floor((x+27)/TS),y1=Math.floor((y+27)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(grid[ty][tx]!==0)return true;}
  return false;
}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20+Math.random()*14,max:34,c:c||'#ffb050'});}
function shoot(){
  if(state!=='play'||ammo<=0||player.cd>0)return;
  const dx=aim.x-(player.x+14),dy=aim.y-(player.y+14),d=Math.hypot(dx,dy)||1;
  bullets.push({x:player.x+14+dx/d*20,y:player.y+14+dy/d*20,vx:dx/d*7.5,vy:dy/d*7.5,life:130});
  ammo--;shots++;player.cd=16;
  if(ammo===0&&targets.length>0)floatTxt(player.x-10,player.y-10,'最后一件弹药!');
}
function floatTxt(x,y,txt){parts.push({x:x,y:y,vx:0,vy:-0.7,life:40,max:40,c:'#ffd76a',txt:txt});}
function spawnTarget(){
  for(let i=0;i<60;i++){
    const x=TS+Math.random()*(cv.width-2*TS),y=TS+Math.random()*(cv.height-2*TS);
    if(Math.hypot(x-player.x,y-player.y)<120)continue;
    if(!rectVsGrid(x-14,y-14)){
      const a=Math.random()*Math.PI*2,s=0.7+Math.random()*0.9+round*0.12;
      targets.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:11+Math.random()*3});
      return;
    }
  }
}
function initGame(){
  grid=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push(0);grid.push(r);}
  grid[3][4]=2;grid[9][4]=2;grid[3][10]=2;grid[9][10]=2;grid[6][7]=2;
  score=0;ammo=12;hits=0;shots=0;round=1;
  targets=[];crates=[];bullets=[];parts=[];
  player={x:7*TS+2,y:11*TS+2,cd:0,inv:0,hp:3};
  for(let i=0;i<8;i++)spawnTarget();
  spawnCrate();
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function spawnCrate(){
  for(let i=0;i<60;i++){
    const cx=1+Math.floor(Math.random()*(COLS-2)),cy=1+Math.floor(Math.random()*(ROWS-2));
    if(grid[cy][cx]===0&&!crates.some(c=>c.cx===cx&&c.cy===cy)){
      crates.push({cx:cx,cy:cy});return;
    }
  }
}
function end(win,msg){
  state=win?'win':'over';
  ov.children[0].textContent=win?'神射手!':'游戏结束';
  const acc=shots>0?Math.round(hits/shots*100):0;
  ovP.innerHTML=msg+'<br>命中率 '+acc+'% · 最终得分:'+score;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function updPlayer(){
  let dx=0,dy=0;
  if(keys.KeyW||keys.ArrowUp)dy=-1.4;
  else if(keys.KeyS||keys.ArrowDown)dy=1.4;
  if(keys.KeyA||keys.ArrowLeft)dx=-1.4;
  else if(keys.KeyD||keys.ArrowRight)dx=1.4;
  if(dx&&!rectVsGrid(player.x+dx,player.y))player.x+=dx;
  if(dy&&!rectVsGrid(player.x,player.y+dy))player.y+=dy;
  if(player.cd>0)player.cd--;
  if(keys.Space&&player.cd<=0)shoot();
  for(let i=crates.length-1;i>=0;i--){
    const c=crates[i];
    if(Math.abs(player.x+14-(c.cx*TS+16))<26&&Math.abs(player.y+14-(c.cy*TS+16))<26){
      crates.splice(i,1);ammo+=3;
      floatTxt(c.cx*TS,c.cy*TS,'弹药 +3');
      boom(c.cx*TS+16,c.cy*TS+16,8,'#ffd76a');
    }
  }
}
function updTargets(){
  for(const t of targets){
    t.x+=t.vx;t.y+=t.vy;
    if(t.x-t.r<0||t.x+t.r>cv.width)t.vx=-t.vx;
    if(t.y-t.r<0||t.y+t.r>cv.height)t.vy=-t.vy;
    const tx=Math.floor(t.x/TS),ty=Math.floor(t.y/TS);
    if(grid[ty][tx]===2){t.vx=-t.vx;t.vy=-t.vy;t.x+=t.vx*2;t.y+=t.vy*2;}
    if(player.inv<=0&&Math.hypot(t.x-player.x-14,t.y-player.y-14)<24){
      player.inv=100;player.hp--;
      boom(player.x+14,player.y+14,10,'#7fe08a');
      if(player.hp<=0){end(false,'被失控靶标撞毁!');return;}
    }
  }
  if(player.inv>0)player.inv--;
}
function updBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let dead=false;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<0||b.y<0||b.x>cv.width||b.y>cv.height)dead=true;
    if(!dead){
      const tx=Math.floor(b.x/TS),ty=Math.floor(b.y/TS);
      if(grid[ty][tx]===2){dead=true;boom(b.x,b.y,3,'#cfd6ee');}
    }
    if(!dead){
      for(const t of targets){
        if(Math.hypot(b.x-t.x,b.y-t.y)<t.r+2){
          dead=true;hits++;
          targets.splice(targets.indexOf(t),1);
          score+=100;floatTxt(t.x-8,t.y,'+100');
          boom(t.x,t.y,12,'#ffd76a');
          if(targets.length===0){
            score+=ammo*20;
            if(round>=3){end(true,'三回合靶场全部清空!');}
            else{
              round++;
              for(let k=0;k<7+round;k++)spawnTarget();
              spawnCrate();
              ammo+=4;
              banner='第 '+round+' 回合';
              setTimeout(()=>{banner=null;},1500);
            }
          }
          break;
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
let banner=null;
function updParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
}
function updHud(){
  hAmmo.textContent=ammo;hB.textContent=targets.length;
  hC.textContent=round+'/3';hD.textContent=score;
}
function draw(){
  ctx.fillStyle='#10142a';ctx.fillRect(0,0,cv.width,cv.height);
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    if(grid[ty][tx]===2){
      const X=tx*TS,Y=ty*TS;
      ctx.fillStyle='#6b7694';ctx.fillRect(X+1,Y+1,TS-2,TS-2);
      ctx.fillStyle='#9aa6c4';ctx.fillRect(X+5,Y+5,TS-10,TS-10);
    }
  }
  for(const c of crates){
    const X=c.cx*TS,Y=c.cy*TS;
    ctx.fillStyle='#7a5a2a';ctx.fillRect(X+4,Y+4,24,24);
    ctx.fillStyle='#b0854a';ctx.fillRect(X+7,Y+7,18,18);
    ctx.fillStyle='#5a3f1a';ctx.fillRect(X+7,Y+14,18,3);
  }
  for(const t of targets){
    ctx.fillStyle='#c46a6a';
    ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffb0a0';
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.45,0,Math.PI*2);ctx.fill();
  }
  if(player&&!(player.inv>0&&frame%6<3)){
    ctx.fillStyle='#171b2e';ctx.fillRect(player.x,player.y,28,28);
    ctx.fillStyle='#5fbf68';ctx.fillRect(player.x+4,player.y+4,20,20);
    const dx=aim.x-(player.x+14),dy=aim.y-(player.y+14),d=Math.hypot(dx,dy)||1;
    const ang=Math.atan2(dy,dx);
    ctx.save();
    ctx.translate(player.x+14,player.y+14);ctx.rotate(ang);
    ctx.fillStyle='#0e1122';ctx.fillRect(0,-2.5,22,5);
    ctx.restore();
    ctx.strokeStyle='rgba(255,233,160,0.25)';
    ctx.beginPath();ctx.moveTo(player.x+14,player.y+14);
    ctx.lineTo(player.x+14+dx/d*400,player.y+14+dy/d*400);ctx.stroke();
    for(let i=0;i<player.hp;i++){
      ctx.fillStyle='#7fe08a';ctx.fillRect(player.x+i*8,player.y-8,6,4);
    }
  }
  for(const b of bullets){ctx.fillStyle='#ffe9a0';ctx.fillRect(b.x-3,b.y-1.5,6,3);}
  for(const p of parts){
    if(p.txt){
      ctx.globalAlpha=Math.min(p.life/20,1);
      ctx.fillStyle=p.c;ctx.font='bold 13px system-ui';ctx.textAlign='center';
      ctx.fillText(p.txt,p.x,p.y);
    }else{
      ctx.globalAlpha=Math.max(p.life/p.max,0);
      ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
    }
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(232,236,255,0.35)';ctx.font='12px system-ui';ctx.textAlign='left';
  ctx.fillText('瞄准线提示:点击开火',8,cv.height-8);
  if(banner){
    ctx.fillStyle='#ffd76a';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText(banner,cv.width/2,cv.height/2-10);
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){
    frame++;
    updPlayer();updTargets();updBullets();updParts();updHud();
    if(ammo<=0&&targets.length>0&&crates.length===0&&state==='play'){
      end(false,'弹药耗尽,靶标仍在游荡!');
    }
  }
  draw();
}
initGame();
loop();
</script>
</body>
</html>

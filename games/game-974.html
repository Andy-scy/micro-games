<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同绳齐跳</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#10152b;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>同绳齐跳</h1>
<div id="tip">同一条大绳,比谁先被绊倒!玩家1:W 或 空格 起跳 · 玩家2:↑ 或 回车 起跳 · 绳子扫过底部红区时必须在空中,否则绊倒扣 1 生命;红区外乱跳会失足扣 1 生命 · 3 条命,最后存活者胜(同时出局比分数)</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">同绳齐跳</div><div id="ovS">大绳越转越快,看谁笑到最后<br>玩家1:W / 空格 起跳 · 玩家2:↑ / 回车 起跳<br>绳子扫过底部红区时必须在空中,踩绳扣 1 生命<br>红区外乱按也会失足!3 条命,最后存活者获胜</div><button id="ovB">开始跳绳</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var st;
function reset(){
 st={ph:"count",cd:70,rot:0,rs:2.3,time:0,lives:[3,3],score:[0,0],y:[420,420],vy:[0,0],
  inD:false,hit:[false,false],alive:[true,true],flash:[0,0],msg:"",msgT:0};
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function press(i){
 if(st.ph!=="play"||!st.alive[i])return;
 if(st.y[i]<419)return;
 if(st.inD||isWindow()){
  st.vy[i]=-9.2;
 }else{
  st.lives[i]--;st.flash[i]=22;
  if(st.lives[i]<=0)st.alive[i]=false;
 }
}
function angle(){
 var a=st.rot%360;
 if(a<0)a+=360;
 return a;
}
function isDanger(){var a=angle();return a>=78&&a<=102;}
function isWindow(){var a=angle();return a>=25&&a<=155;}
function step(dt){
 var i;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.time+=dt;
  st.rs=Math.min(4.8,2.3+st.time*0.00028);
  st.rot+=st.rs*dt;
  var danger=isDanger();
  if(danger&&!st.inD){st.inD=true;st.hit=[false,false];}
  if(!danger&&st.inD){
   st.inD=false;
   for(i=0;i<2;i++)if(st.alive[i]&&!st.hit[i])st.score[i]++;
  }
  if(danger){
   for(i=0;i<2;i++){
    if(st.alive[i]&&st.y[i]>=419&&!st.hit[i]){
     st.lives[i]--;st.hit[i]=true;st.flash[i]=22;
     if(st.lives[i]<=0)st.alive[i]=false;
    }
   }
  }
  for(i=0;i<2;i++){
   if(st.y[i]<420||st.vy[i]<0){
    st.vy[i]+=0.5*dt;
    st.y[i]+=st.vy[i]*dt;
    if(st.y[i]>420){st.y[i]=420;st.vy[i]=0;}
   }
   if(st.flash[i]>0)st.flash[i]-=dt;
  }
  if(!st.alive[0]&&!st.alive[1]){
   st.ph="rend";st.msgT=90;
   if(st.score[0]===st.score[1])st.msg="双双出局且分数相同,平局!";
   else st.msg=(st.score[0]>st.score[1]?"蓝方":"橙方")+"坚持更久且分数更高!";
  }else if(!st.alive[0]||!st.alive[1]){
   st.ph="rend";st.msgT=90;
   st.msg=(st.alive[0]?"蓝方":"橙方")+"存活到最后,获胜!";
  }
 }else if(st.ph==="rend"){
  st.msgT-=dt;
  if(st.msgT<=0){
   var one=st.alive[0]!==st.alive[1];
   var win=-1;
   if(one)win=st.alive[0]?0:1;
   else if(st.score[0]!==st.score[1])win=st.score[0]>st.score[1]?0:1;
   if(win===-1)show("平局!","双方 "+st.score[0]+" : "+st.score[1]+" 不分胜负");
   else show((win===0?"蓝方":"橙方")+"获胜!","跳绳得分 "+st.score[0]+" : "+st.score[1]);
   st.ph="over";
  }
 }
}
function jumper(x,off,col,alive){
 ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4;
 var hy=340-off,by=388-off,fy=420-off;
 if(!alive){
  ctx.font="bold 13px system-ui";ctx.textAlign="center";
  ctx.fillText("出局",x,430);
  return;
 }
 ctx.beginPath();ctx.arc(x,hy-34,11,0,6.2832);ctx.fill();
 ctx.beginPath();ctx.moveTo(x,hy-23);ctx.lineTo(x,by);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x-12,fy);ctx.moveTo(x,by);ctx.lineTo(x+12,fy);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x,hy-14);ctx.lineTo(x-14,hy+2);ctx.moveTo(x,hy-14);ctx.lineTo(x+14,hy+2);ctx.stroke();
}
function draw(){
 ctx.clearRect(0,0,720,480);
 ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(360,140);
 ctx.lineTo(360+Math.cos(1.361)*258,140+Math.sin(1.361)*258);
 ctx.stroke();
 ctx.strokeStyle="rgba(255,92,122,.35)";ctx.lineWidth=14;
 ctx.beginPath();ctx.arc(360,140,258,78*0.01745,102*0.01745);ctx.stroke();
 var rad=st.rot*0.01745;
 var tx=360+Math.cos(rad)*258,ty=140+Math.sin(rad)*258;
 var tx2=360-Math.cos(rad)*258,ty2=140-Math.sin(rad)*258;
 ctx.strokeStyle=isDanger()?"#ff5c7a":"#e9edf8";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx2,ty2);ctx.stroke();
 ctx.fillStyle=isDanger()?"#ff5c7a":"#f6c945";
 ctx.beginPath();ctx.arc(tx,ty,9,0,6.2832);ctx.fill();
 ctx.beginPath();ctx.arc(tx2,ty2,9,0,6.2832);ctx.fill();
 ctx.fillStyle="#2a3354";ctx.fillRect(60,420,600,5);
 jumper(250,420-st.y[0],"#4fd1c5",st.alive[0]);
 jumper(470,420-st.y[1],"#f6ad55",st.alive[1]);
 var i;
 for(i=0;i<2;i++){
  var lx=i===0?70:560;
  ctx.font="bold 15px system-ui";ctx.textAlign="left";ctx.textBaseline="top";
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";
  ctx.fillText((i===0?"玩家1":"玩家2")+" 得分 "+st.score[i],lx,20);
  for(var k=0;k<3;k++){
   ctx.fillStyle=k<st.lives[i]?(i===0?"#4fd1c5":"#f6ad55"):"#2a3354";
   ctx.fillRect(lx+k*20,44,14,14);
  }
  if(st.flash[i]>0){
   ctx.fillStyle="#ff5c7a";ctx.font="bold 15px system-ui";
   ctx.fillText("扣命!",lx,66);
  }
 }
 ctx.textAlign="center";ctx.fillStyle="#8b93b0";ctx.font="bold 13px system-ui";
 ctx.fillText("绳速 "+st.rs.toFixed(1)+" · 红区=危险,必须在空中",360,462);
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 40px system-ui";
  ctx.fillText("绳子转起来!",360,180);
  ctx.font="bold 26px system-ui";
  ctx.fillText(String(Math.ceil(st.cd/24)),360,236);
 }
 if(st.ph==="rend"){
  ctx.fillStyle="#f6c945";ctx.font="bold 30px system-ui";
  ctx.fillText(st.msg,360,180);
 }
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 if(e.repeat)return;
 if(k==="w"||k===" "||k==="f")press(0);
 if(k==="arrowup"||k==="enter"||k==="k")press(1);
});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双人对决</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#f9a8d4;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f9a8d4;font-size:16px}
.gbtn{background:#3d1230;color:#f9a8d4;border:1px solid #f9a8d4;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#f9a8d4;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.turn{max-width:320px;margin:0 auto 10px;padding:7px 0;border-radius:999px;text-align:center;font-size:14px;font-weight:700;letter-spacing:2px;transition:background .25s,color .25s;border:1px solid #2a3258}
.turn.p1{background:#1d4ed8;color:#eff6ff;border-color:#60a5fa}
.turn.p2{background:#be185d;color:#fdf2f8;border-color:#f9a8d4}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto;touch-action:manipulation}
.pad{aspect-ratio:1/1;border-radius:16px;cursor:pointer;transition:transform .06s,box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.94)}
.p0{background:#0d2f1a;border:2px solid #166534}.p0.lit{background:#22c55e;box-shadow:0 0 26px rgba(34,197,94,.85)}
.p1{background:#3d1114;border:2px solid #991b1b}.p1.lit{background:#ef4444;box-shadow:0 0 26px rgba(239,68,68,.85)}
.p2{background:#39300a;border:2px solid #a16207}.p2.lit{background:#eab308;box-shadow:0 0 26px rgba(234,179,8,.85)}
.p3{background:#122a52;border:2px solid #1d4ed8}.p3.lit{background:#3b82f6;box-shadow:0 0 26px rgba(59,130,246,.85)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#f9a8d4;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#f9a8d4;color:#3d1230;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>双人对决</h1>
  <p class="hint">同屏轮流对战:序列每轮加长一步,玩家一与玩家二轮流完整复述。谁点错,谁当场败北,对手获胜!热座单机即可开战,考验的是接力压力下的稳定发挥。</p>
  <div class="hud">
    <span>序列长 <b id="len">0</b></span>
    <span>一: <b id="s1">0</b> 轮</span>
    <span>二: <b id="s2">0</b> 轮</span>
    <button class="gbtn" id="btnNew">重新开战</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="turn" id="turn">—</div>
  <div class="pads" id="pads">
    <div class="pad p0"></div>
    <div class="pad p1"></div>
    <div class="pad p2"></div>
    <div class="pad p3"></div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">双人对决</h2>
    <p id="ovDesc">两人一台设备就能玩:看同一段越来越长的序列,轮流复述。每一次出手都悬着整场胜负,压力记得比谁都牢。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始对决</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg359_best",FREQ=[329.63,261.63,220,164.81],GAP=640,FLASH=390;
var seq=[],pos=0,state="menu",timers=[],audio=null,cur=0;
var score=[0,0],names=["玩家一","玩家二"],best=loadNum(KEY);
var pads=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLen=$("len"),elS1=$("s1"),elS2=$("s2"),elMsg=$("msg"),btnNew=$("btnNew"),turn=$("turn");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.26;v=v==null?0.15:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var box=$("pads"),list=box.querySelectorAll(".pad");for(var i=0;i<list.length;i++){pads.push(list[i]);list[i].dataset.i=String(i);}})();
function flash(i,ms){var el=pads[i];el.classList.add("lit");tone(FREQ[i]);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||FLASH));}
function clearLit(){for(var i=0;i<4;i++)pads[i].classList.remove("lit");}
function rnd(){var n;do{n=(Math.random()*4)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function updateHud(){elLen.textContent=seq.length;elS1.textContent=score[0];elS2.textContent=score[1];
turn.textContent="轮到 "+names[cur];
turn.className="turn "+(cur===0?"p1":"p2");}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";setMsg(names[cur]+" 看好演示…");var i=0;(function step(){
if(i>=seq.length){state="input";pos=0;setMsg(names[cur]+",复述整段序列!");return;}
flash(seq[i]);i++;timers.push(setTimeout(step,GAP));})();}
function nextRound(){seq.push(rnd());updateHud();playSeq();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;score=[0,0];cur=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,700));}
function winStep(){score[cur]++;state="wait";
if(score[cur]>best){best=score[cur];saveNum(KEY,best);}
setMsg(names[cur]+" 稳稳拿下!换人…");cur=1-cur;updateHud();
timers.push(setTimeout(nextRound,900));}
function lose(){clearTimers();clearLit();state="over";tone(92,0.55,0.2,"sawtooth");
var winner=1-cur;
ovTitle.textContent=names[winner]+" 获胜!";
ovDesc.textContent=names[cur]+" 在 "+seq.length+" 步的序列上失误。\n本场比分:一 "+score[0]+" 轮 · 二 "+score[1]+" 轮。\n历史最长个人纪录 "+best+" 轮。";
ovScore.style.display="block";ovScore.textContent=names[winner]+" 捧走胜利";
btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flash(i,200);
if(seq[pos]===i){pos++;if(pos>=seq.length)winStep();}else lose();}
function start(){initAudio();newGame();ov.classList.add("hide");}
$("pads").addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;if(k==="1")press(0);else if(k==="2")press(1);else if(k==="3")press(2);else if(k==="4")press(3);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重新开战");});
updateHud();
})();
</script>
</body>
</html>

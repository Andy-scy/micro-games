<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>争分夺秒</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;user-select:none;-webkit-user-select:none}
h1{font-size:22px;margin:10px 0 4px;color:#ffd166;letter-spacing:2px}
.hint{font-size:13px;color:#9aa3c0;text-align:center;margin-bottom:10px;line-height:1.6;padding:0 8px}
.bar{display:flex;gap:14px;font-size:14px;color:#cdd3ea;margin-bottom:12px;flex-wrap:wrap;justify-content:center;min-height:20px}
.bar b{color:#7ee0a3}
#stTime{font-size:16px}
#stTime.low{color:#ff6b81;animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.45}}
#stage{position:relative;width:100%;max-width:420px}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.card{position:relative;aspect-ratio:1/1;cursor:pointer;perspective:700px}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .3s}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(20px,7vw,32px)}
.bk{background:linear-gradient(145deg,#28325f,#1c2447);border:2px solid #46508c;color:#6a76c9;font-weight:bold}
.ft{background:linear-gradient(145deg,#34407c,#2b3568);border:2px solid #7b8cff;transform:rotateY(180deg)}
.card.done{cursor:default;animation:pop .35s}
.card.done .ft{border-color:#7ee0a3;background:linear-gradient(145deg,#1f5b41,#1a4a34)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.fly{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:22px;font-weight:bold;z-index:8;pointer-events:none;animation:flyUp .95s forwards;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes flyUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
#overlay{position:absolute;inset:0;background:rgba(7,9,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:9;text-align:center;padding:16px}
#overlay.show{opacity:1;pointer-events:auto}
#ovTitle{font-size:26px;color:#ffd166}
#ovDesc{font-size:14px;color:#cdd3ea;line-height:1.8}
button{font-family:inherit;font-size:15px;padding:10px 24px;border:none;border-radius:10px;background:#ffd166;color:#22284a;font-weight:bold;cursor:pointer}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>争分夺秒</h1>
<div class="hint">高压计时战!初始 90 秒,每配对成功 +2 秒,每翻错一次 −5 秒,时间归零立刻失败;小心出手,稳中求快!</div>
<div class="bar"><span>剩余 <b id="stTime">90.0</b> 秒</span><span>步数 <b id="stMoves">0</b></span><span>已配对 <b id="stPairs">0/8</b></span></div>
<div id="stage">
  <div id="board"></div>
  <div id="overlay"><div id="ovTitle"></div><div id="ovDesc"></div><button id="btnAgain">再来一局</button></div>
</div>
<script>
(function(){
var SYMS=['🍎','🍋','🍉','🍇','🍓','🐶','🐱','🦊'];
var TIME0=90,PLUS=2,MINUS=5,CAP=99;
var board=document.getElementById('board');
var stage=document.getElementById('stage');
var overlay=document.getElementById('overlay');
var ovTitle=document.getElementById('ovTitle');
var ovDesc=document.getElementById('ovDesc');
var elTime=document.getElementById('stTime');
var elMoves=document.getElementById('stMoves');
var elPairs=document.getElementById('stPairs');
var btnAgain=document.getElementById('btnAgain');
var lock=true,first=null,moves=0,pairs=0,timeLeft=TIME0,lastTick=0,running=false,over=false;
var timers=[];
function later(fn,ms){var id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function makeCard(sym){
  var el=document.createElement('div');el.className='card';
  var inner=document.createElement('div');inner.className='inner';
  var bk=document.createElement('div');bk.className='face bk';bk.textContent='❓';
  var ft=document.createElement('div');ft.className='face ft';ft.textContent=sym;
  inner.appendChild(bk);inner.appendChild(ft);el.appendChild(inner);el.sym=sym;
  board.appendChild(el);return el;
}
function fly(text,color){
  var s=document.createElement('span');
  s.className='fly';s.textContent=text;s.style.color=color;
  stage.appendChild(s);
  setTimeout(function(){if(s.parentNode===stage)stage.removeChild(s);},960);
}
function newGame(){
  clearTimers();board.innerHTML='';
  lock=true;first=null;moves=0;pairs=0;timeLeft=TIME0;running=false;over=false;
  elTime.textContent=TIME0.toFixed(1);elTime.classList.remove('low');
  elMoves.textContent='0';elPairs.textContent='0/8';
  overlay.classList.remove('show');
  var syms=shuffle(SYMS.concat(SYMS));
  for(var i=0;i<syms.length;i++)makeCard(syms[i]);
  later(function(){lock=false;running=true;lastTick=performance.now();},400);
}
function fail(){
  if(over)return;
  over=true;running=false;
  ovTitle.textContent='时间到!';
  ovDesc.innerHTML='已配对 '+pairs+'/8 · 步数 '+moves+'<br>翻错扣 5 秒太狠了?手再稳一点!';
  overlay.classList.add('show');
}
function finish(){
  over=true;running=false;
  var score=500+Math.round(timeLeft*10);
  var grade=timeLeft>=40?'★★★ 时间主宰':(timeLeft>=20?'★★☆ 从容不迫':'★☆☆ 压哨过关');
  ovTitle.textContent='抢先收官!';
  ovDesc.innerHTML='剩余 '+timeLeft.toFixed(1)+' 秒 · 步数 '+moves+'<br>得分 <b style="color:#ffd166">'+score+'</b><br>'+grade;
  overlay.classList.add('show');
}
function onCard(el){
  if(lock||over||!running)return;
  if(el.classList.contains('open')||el.classList.contains('done'))return;
  el.classList.add('open');
  if(!first){first=el;return;}
  moves++;elMoves.textContent=String(moves);
  var a=first,b=el;first=null;
  if(a.sym===b.sym){
    pairs++;elPairs.textContent=pairs+'/8';
    timeLeft=Math.min(CAP,timeLeft+PLUS);
    fly('+'+PLUS+' 秒','#7ee0a3');
    a.classList.remove('open');b.classList.remove('open');
    a.classList.add('done');b.classList.add('done');
    if(pairs===SYMS.length)finish();
  }else{
    timeLeft=Math.max(0,timeLeft-MINUS);
    fly('-'+MINUS+' 秒','#ff6b81');
    if(timeLeft<=0){timeLeft=0;elTime.textContent='0.0';fail();return;}
    lock=true;
    later(function(){a.classList.remove('open');b.classList.remove('open');lock=false;},650);
  }
}
board.addEventListener('click',function(e){
  var el=e.target.closest('.card');
  if(el)onCard(el);
});
btnAgain.addEventListener('click',newGame);
var tick=function(){
  var now=performance.now();
  var dt=(now-lastTick)/1000;
  lastTick=now;
  if(dt>0.25)dt=0.25;
  if(running&&!over){
    timeLeft-=dt;
    if(timeLeft<=0){
      timeLeft=0;elTime.textContent='0.0';
      elTime.classList.remove('low');
      fail();
    }else{
      elTime.textContent=timeLeft.toFixed(1);
      elTime.classList.toggle('low',timeLeft<10);
    }
  }
  requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
newGame();
})();
</script>
</body>
</html>

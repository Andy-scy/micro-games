<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加速脉冲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#fdba74;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fdba74;font-size:16px}
.gbtn{background:#3a2210;color:#fdba74;border:1px solid #fdba74;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#fdba74;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto;touch-action:manipulation}
.pad{aspect-ratio:1/1;border-radius:50%;cursor:pointer;transition:transform .07s,box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:rgba(255,255,255,.28)}
.pad:active{transform:scale(.94)}
.p0{background:#0d2f1a;border:2px solid #166534}
.p0.lit{background:#22c55e;border-color:#bbf7d0;box-shadow:0 0 30px rgba(34,197,94,.85)}
.p1{background:#3d1114;border:2px solid #991b1b}
.p1.lit{background:#ef4444;border-color:#fecaca;box-shadow:0 0 30px rgba(239,68,68,.85)}
.p2{background:#39300a;border:2px solid #a16207}
.p2.lit{background:#eab308;border-color:#fef08a;box-shadow:0 0 30px rgba(234,179,8,.85)}
.p3{background:#122a52;border:2px solid #1d4ed8}
.p3.lit{background:#3b82f6;border-color:#bfdbfe;box-shadow:0 0 30px rgba(59,130,246,.85)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#fdba74;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#fdba74;color:#3a2210;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>加速脉冲</h1>
  <p class="hint">越玩越快的记忆序列:每过一轮,闪灯节奏就加快一档,闪灯时间也随之变短。前期从容,后期眼花,专注力极限测试。支持键盘 1-4。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>当前速度 <b id="spd">1.00x</b></span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="pads" id="pads">
    <div class="pad p0">1</div>
    <div class="pad p1">2</div>
    <div class="pad p2">3</div>
    <div class="pad p3">4</div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">加速脉冲</h2>
    <p id="ovDesc">经典规则之上叠加逐轮提速:演示间隔从 0.8 秒一路压缩到 0.23 秒,闪灯一闪而过。手速与记忆的双重考验!</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg342_best",FREQ=[329.63,261.63,220,164.81];
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var padEls=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elSpd=$("spd"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.2;v=v==null?0.16:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
function gapOf(lv){return Math.max(230,Math.round(800*Math.pow(0.87,lv)));}
function flash(i,ms){var el=padEls[i];el.classList.add("lit");tone(FREQ[i],0.22);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||Math.round(gapOf(level)*0.55)));}
function clearLit(){for(var i=0;i<4;i++)padEls[i].classList.remove("lit");}
function rnd(){var n;do{n=(Math.random()*4)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function updateHud(){elLv.textContent=level;elSpd.textContent=(800/gapOf(level)).toFixed(2)+"x";elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";var g=gapOf(level);setMsg("节奏 "+(800/g).toFixed(2)+" 倍速,看好…");var i=0;(function step(){if(i>=seq.length){state="input";pos=0;setMsg("轮到你!");return;}flash(seq[i]);i++;timers.push(setTimeout(step,g));})();}
function nextRound(){seq.push(rnd());updateHud();playSeq();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;level=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,600));}
function winStep(){level++;state="wait";setMsg("通过!下一轮更快…");updateHud();timers.push(setTimeout(nextRound,700));}
function fail(){clearTimers();clearLit();state="over";tone(98,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="挑战结束";
ovDesc.textContent="你顶到了 "+(800/gapOf(level)).toFixed(2)+" 倍速的节奏,序列在第 "+seq.length+" 步断了。再快一点也难不倒你,对吗?";
ovScore.style.display="block";ovScore.textContent="成功复述 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flash(i,160);if(seq[pos]===i){pos++;if(pos>=seq.length)winStep();}else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
(function bind(){var box=$("pads"),list=box.querySelectorAll(".pad");for(var i=0;i<list.length;i++){padEls.push(list[i]);list[i].dataset.i=String(i);}box.addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});})();
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;if(k==="1"||k==="2"||k==="3"||k==="4")press(parseInt(k,10)-1);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反拍禁令</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f87171;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f87171;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f87171}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f87171;color:#2b0a0a;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>反拍禁令</h1>
  <p class="hint">白球抵达中心时敲击 · 红球抵达时绝对忍住别敲 · 空格 / 点击 / 触屏</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>生命 <b id="life">3</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">反拍禁令</h2>
      <p id="ovDesc">节拍球从四周飞向中心,在抵达的一瞬敲击。
白色球:敲击!粉色球:这是禁拍,忍住不要敲!
敲中禁拍或连漏 3 个白球都会扣生命。
克制也是一种节奏。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elLife=$("life"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,CX=240,CY=280,BPM=96,beatInt=60000/BPM;
var APPROACH=beatInt*2,R0=300,CORE=34;
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_g363");

var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function sHit(){tone("triangle",740,1180,0.12,0.25);noiseHit(0.05,0.12,5000);}
function sRest(){tone("sine",330,330,0.1,0.14);}
function sBad(){tone("sawtooth",180,80,0.3,0.25);}
function sTick(){noiseHit(0.04,0.07,7000);}

var state="menu",orbs,pops,score,combo,life,missRow,nextBeat,beatNo,flash;
function reset(){
  orbs=[];pops=[];
  score=0;combo=0;life=3;missRow=0;beatNo=0;
  nextBeat=performance.now()+1800;
  flash=0;
  upd();
}
function start(){audio();reset();state="play";ov.classList.add("hide");}
function upd(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elLife.textContent=life;
  elBest.textContent=best;
}
function addPop(x,y,txt,color){pops.push({x:x,y:y,txt:txt,color:color,t0:performance.now()});}

function schedule(now){
  if(now-nextBeat>4000)nextBeat=now+400;
  while(now>=nextBeat){
    beatNo++;
    var red=Math.random()<0.32;
    var ang=Math.random()*Math.PI*2;
    orbs.push({ang:ang,t:nextBeat+beatInt*2,red:red,done:false});
    if(red)sTick();
    nextBeat+=beatInt;
  }
}
function press(){
  if(state!=="play")return;
  var now=performance.now(),i,o,dt,bi=-1,bd=1e9;
  for(i=0;i<orbs.length;i++){
    o=orbs[i];if(o.done)continue;
    dt=now-o.t;
    if(dt<-180||dt>180)continue;
    if(Math.abs(dt)<Math.abs(bd)){bd=dt;bi=i;}
  }
  if(bi<0){addPop(CX,CY-70,"空拍","#8b90b0");return;}
  o=orbs[bi];o.done=true;
  if(o.red){
    life--;combo=0;flash=now;
    addPop(CX,CY-70,"禁拍被击中!","#f87171");sBad();
    upd();
    if(life<=0)gameOver();
  }else{
    combo++;score+=200+combo*10;
    addPop(CX,CY-70,"命中 +"+(200+combo*10),"#fbbf24");sHit();
    upd();
  }
}
function gameOver(){
  state="over";
  if(score>best){best=score;saveBest("mg_g363",best);}
  upd();
  ovTitle.textContent="节奏崩坏";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  ovDesc.textContent="记住:白球要打,红球要忍。\n深呼吸,再来一局!";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function update(now){
  var i,o;
  for(i=orbs.length-1;i>=0;i--){
    o=orbs[i];
    if(o.done){orbs.splice(i,1);continue;}
    if(now>o.t+180){
      orbs.splice(i,1);
      if(o.red){
        score+=50;addPop(CX,CY-70,"稳住了 +50","#4ade80");sRest();
      }else{
        missRow++;
        addPop(CX,CY-70,"漏拍 "+missRow+"/3","#8b90b0");
        if(missRow>=3){
          missRow=0;life--;sBad();
          addPop(CX,CY+40,"失神 -1 生命","#f87171");
          if(life<=0){upd();gameOver();return;}
        }
      }
      upd();
    }
  }
  for(i=pops.length-1;i>=0;i--){if(now-pops[i].t0>620)pops.splice(i,1);}
}
function draw(now){
  var i,o,k,x,y,pulse;
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  pulse=Math.max(0,1-(now-(nextBeat-beatInt))/240);
  ctx.strokeStyle="rgba(248,113,113,"+(0.1+pulse*0.25)+")";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(CX,CY,CORE+pulse*10,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
  for(i=0;i<orbs.length;i++){
    o=orbs[i];
    k=(o.t-now)/APPROACH;if(k<0)k=0;
    var rad=R0*k;
    x=CX+Math.cos(o.ang)*rad;
    y=CY+Math.sin(o.ang)*rad;
    if(o.red){
      ctx.strokeStyle="rgba(248,113,113,0.4)";
      ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle="#f87171";
      ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#2b0a0a";ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();ctx.lineWidth=1;
    }else{
      ctx.fillStyle="rgba(251,191,36,0.25)";
      ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#fbbf24";
      ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
    }
  }
  var g=ctx.createRadialGradient(CX,CY,4,CX,CY,CORE);
  g.addColorStop(0,"#fbbf24");g.addColorStop(1,"rgba(251,191,36,0.1)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(CX,CY,CORE,0,Math.PI*2);ctx.fill();
  for(i=0;i<pops.length;i++){
    p=pops[i];var pr=(now-p.t0)/620;
    ctx.fillStyle=p.color;ctx.globalAlpha=1-pr;
    ctx.font="bold 17px system-ui";ctx.textAlign="center";
    ctx.fillText(p.txt,p.x,p.y-pr*22);
    ctx.globalAlpha=1;
  }
  if(now-flash<300){
    ctx.fillStyle="rgba(248,113,113,"+(0.3*(1-(now-flash)/300))+")";
    ctx.fillRect(0,0,W,H);
  }
}
function toXY(cx,cy){
  var rect=cv.getBoundingClientRect();
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
function onTap(cx,cy){
  toXY(cx,cy);
  press();
}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();onTap(e.clientX,e.clientY);});
}else{
  cv.addEventListener("mousedown",function(e){onTap(e.clientX,e.clientY);});
  cv.addEventListener("touchstart",function(e){e.preventDefault();var t=e.changedTouches[0];onTap(t.clientX,t.clientY);},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state!=="play")start();
    else press();
  }
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play"){schedule(now);update(now);}
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>步步临摹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#c084fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px}
.hud{font-size:14px;color:#c7cbe8;display:flex;flex-direction:column;gap:4px}
.hud b{color:#c084fc;font-size:16px}
.refbox{text-align:center}
.refbox span{display:block;font-size:12px;color:#8b90b0;margin-bottom:2px}
#ref{background:#10141f;border:1px solid #2a3050;border-radius:8px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #581c87;background:#10141f;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.bar{display:flex;justify-content:center;margin-top:10px}
.bar button{background:#c084fc;color:#2e1065;border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.msg{text-align:center;color:#f87171;font-size:13px;height:18px;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(12,8,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#c084fc}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#c084fc;color:#2e1065;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>步步临摹</h1>
  <p class="hint">右上角小图会高亮<b style="color:#c084fc">当前步骤</b>要画的部件,画布里也有同色虚线影子;<br>涂满该部件 55% 以上就能交这一步,四步全过即完成画作!</p>
  <div class="top">
    <div class="hud"><span>画作 <b id="lv">1/2</b></span><span>步骤 <b id="st">1/4</b></span><span>得分 <b id="score">0</b></span></div>
    <div class="refbox"><span>临本</span><canvas id="ref" width="120" height="100"></canvas></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="400"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">步步临摹</h2>
      <p id="ovP">画画要一步一步来:身体→头→五官→帽子,墙→顶→门→窗。每步单独评分,画出虚线影子外面会被扣分。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">翻开临本</button>
    </div>
  </div>
  <div class="bar"><button id="btnSub">交这一步</button></div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d"),ref=$("ref"),rctx=ref.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo"),btnSub=$("btnSub");
var elLv=$("lv"),elSt=$("st"),elScore=$("score"),elMsg=$("msg");
function rectPts(x1,y1,x2,y2){return [[x1,y1],[x2,y1],[x2,y2],[x1,y2]];}
var PICS=[
 {name:"雪人",steps:[
  {nm:"圆滚滚的身体",shapes:[{t:"c",x:240,y:300,r:70}]},
  {nm:"圆脑袋",shapes:[{t:"c",x:240,y:192,r:46}]},
  {nm:"眼睛和扣子",shapes:[{t:"c",x:222,y:184,r:9},{t:"c",x:258,y:184,r:9},{t:"c",x:240,y:238,r:9},{t:"c",x:240,y:270,r:9}]},
  {nm:"小礼帽",shapes:[{t:"p",pts:rectPts(192,132,288,150)},{t:"p",pts:[[204,132],[276,132],[240,88]]}]}]},
 {name:"小屋",steps:[
  {nm:"四面墙",shapes:[{t:"p",pts:rectPts(150,240,330,340)}]},
  {nm:"屋顶",shapes:[{t:"p",pts:[[128,240],[352,240],[240,152]]}]},
  {nm:"大门",shapes:[{t:"p",pts:rectPts(222,286,258,340)}]},
  {nm:"圆窗",shapes:[{t:"c",x:300,y:282,r:20}]}]}
];
var W=480,H=400,N=96,M=80,CELL=5;
var state="menu",pic=0,step=0,score=0;
var stepM=null,stepCnt=0,unionM=null,paint=null,cntP=0;
var pcv=document.createElement("canvas");pcv.width=W;pcv.height=H;
var pctx=pcv.getContext("2d");
var isDown=false,last=null;
function inPoly(x,y,pts){
  var ins=false,i,j,n=pts.length;
  for(i=0,j=n-1;i<n;j=i++){
    if(((pts[i][1]>y)!==(pts[j][1]>y))&&(x<(pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1])+pts[i][0]))ins=!ins;
  }
  return ins;
}
function inShape(sh,x,y){
  if(sh.t==="c"){var dx=x-sh.x,dy=y-sh.y;return dx*dx+dy*dy<=sh.r*sh.r;}
  return inPoly(x,y,sh.pts);
}
function raster(shapes){
  var m=new Uint8Array(N*M),cnt=0,i,j,k;
  for(i=0;i<N;i++)for(j=0;j<M;j++){
    var x=i*CELL+2.5,y=j*CELL+2.5;
    for(k=0;k<shapes.length;k++){
      if(inShape(shapes[k],x,y)){m[i*M+j]=1;cnt++;break;}
    }
  }
  return {m:m,cnt:cnt};
}
function countIn(mask){
  var c=0,i;
  for(i=0;i<N*M;i++)if(paint[i]&&mask[i])c++;
  return c;
}
function drawRef(){
  rctx.setTransform(1,0,0,1,0,0);
  rctx.clearRect(0,0,120,100);
  rctx.scale(0.25,0.25);
  var steps=PICS[pic].steps,i,k;
  for(i=0;i<steps.length;i++){
    var cur=i===step;
    for(k=0;k<steps[i].shapes.length;k++){
      var sh=steps[i].shapes[k];
      rctx.beginPath();
      if(sh.t==="c")rctx.arc(sh.x,sh.y,sh.r,0,Math.PI*2);
      else{
        var q;
        for(q=0;q<sh.pts.length;q++){
          if(q===0)rctx.moveTo(sh.pts[q][0],sh.pts[q][1]);else rctx.lineTo(sh.pts[q][0],sh.pts[q][1]);
        }
        rctx.closePath();
      }
      if(cur){rctx.fillStyle="rgba(192,132,252,0.85)";rctx.fill();}
      else{rctx.fillStyle="rgba(139,144,176,0.30)";rctx.fill();}
    }
  }
}
function loadStep(){
  var r=raster(PICS[pic].steps[step].shapes);
  stepM=r.m;stepCnt=r.cnt;
  var acc=[],shapesAll=[],i,k;
  for(i=0;i<=step;i++){
    for(k=0;k<PICS[pic].steps[i].shapes.length;k++)shapesAll.push(PICS[pic].steps[i].shapes[k]);
  }
  unionM=raster(shapesAll).m;
  if(step===0){
    paint=new Uint8Array(N*M);cntP=0;
    pctx.clearRect(0,0,W,H);
  }
  elLv.textContent=(pic+1)+"/2";
  elSt.textContent=(step+1)+"/4";
  elMsg.textContent="";
  drawRef();draw();
}
function stats(){
  var inS=0,i;
  for(i=0;i<N*M;i++)if(paint[i]&&stepM[i])inS++;
  var out=0;
  for(i=0;i<N*M;i++)if(paint[i]&&!unionM[i])out++;
  var cov=stepCnt?inS/stepCnt*100:0;
  var over=cntP?out/cntP*100:0;
  return {cov:cov,over:over};
}
function mark(x,y){
  var rr=5,gx0=Math.max(0,Math.floor((x-rr)/CELL)),gx1=Math.min(N-1,Math.floor((x+rr)/CELL));
  var gy0=Math.max(0,Math.floor((y-rr)/CELL)),gy1=Math.min(M-1,Math.floor((y+rr)/CELL));
  var i,j;
  for(i=gx0;i<=gx1;i++)for(j=gy0;j<=gy1;j++){
    var cx=i*CELL+2.5,cy=j*CELL+2.5;
    if((cx-x)*(cx-x)+(cy-y)*(cy-y)<=rr*rr&&!paint[i*M+j]){paint[i*M+j]=1;cntP++;}
  }
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function strokeSeg(p,q){
  pctx.strokeStyle="#c084fc";pctx.lineWidth=10;pctx.lineCap="round";pctx.lineJoin="round";
  pctx.beginPath();pctx.moveTo(p.x,p.y);pctx.lineTo(q.x,q.y);pctx.stroke();
  var d=Math.hypot(q.x-p.x,q.y-p.y),n=Math.max(1,Math.ceil(d/4)),k;
  for(k=0;k<=n;k++)mark(p.x+(q.x-p.x)*k/n,p.y+(q.y-p.y)*k/n);
}
function begin(e){
  if(state!=="playing")return;
  var p=pos(e);isDown=true;last=p;
  strokeSeg(p,{x:p.x+0.01,y:p.y+0.01});
}
function moveP(e){
  if(!isDown||state!=="playing")return;
  var p=pos(e);strokeSeg(last,p);last=p;
}
function endP(){isDown=false;last=null;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function draw(){
  ctx.fillStyle="#10141f";ctx.fillRect(0,0,W,H);
  var steps=PICS[pic].steps,i,k;
  ctx.setLineDash([4,6]);
  for(i=0;i<steps.length;i++){
    var alpha=i<step?0.12:(i===step?0.55:0);
    if(alpha<=0)continue;
    ctx.strokeStyle="rgba(192,132,252,"+alpha+")";
    ctx.lineWidth=i===step?2:1.5;
    for(k=0;k<steps[i].shapes.length;k++){
      var sh=steps[i].shapes[k];
      ctx.beginPath();
      if(sh.t==="c")ctx.arc(sh.x,sh.y,sh.r,0,Math.PI*2);
      else{
        var q;
        for(q=0;q<sh.pts.length;q++){
          if(q===0)ctx.moveTo(sh.pts[q][0],sh.pts[q][1]);else ctx.lineTo(sh.pts[q][0],sh.pts[q][1]);
        }
        ctx.closePath();
      }
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.drawImage(pcv,0,0);
}
function finish(){
  state="over";
  ovT.textContent="两幅临摹作品完成!";
  ovP.textContent="一步一步慢慢画,最后照样拼出完整的画。稳步流的胜利!";
  ovS.style.display="block";ovS.textContent="总分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
btnSub.addEventListener("click",function(){
  if(state!=="playing")return;
  if(cntP===0){elMsg.textContent="这一步还没下笔呢!";return;}
  var st=stats();
  if(st.cov>=55){
    var gain=Math.max(1,Math.round(st.cov-Math.max(0,st.over-25)*0.25));
    score+=gain;elScore.textContent=score;
    step++;
    if(step>=4){
      pic++;
      if(pic>=2){finish();return;}
      step=0;
      elMsg.textContent="《"+PICS[pic-1].name+"》完成!+"+gain+"分,换下一幅";
      loadStep();
    }else{
      elMsg.textContent="";
      loadStep();
    }
  }else{
    elMsg.textContent="「"+PICS[pic].steps[step].nm+"」覆盖 "+Math.floor(st.cov)+"% 不足 55%,再补几笔!";
  }
});
btnGo.addEventListener("click",function(){
  pic=0;step=0;score=0;elScore.textContent=0;state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  loadStep();
});
loadStep();
})();
</script>
</body>
</html>

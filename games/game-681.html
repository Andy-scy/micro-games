<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泡泡限时戳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:460px}
h1{font-size:24px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:10px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:12px}
.big{font-size:17px;font-weight:800;color:#ffd166}
.bar{height:10px;background:#232a48;border-radius:6px;overflow:hidden;margin-bottom:8px}
#tbar{height:100%;width:100%;background:#4cc9f0;border-radius:6px}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>泡泡限时戳</h1>
  <p class="tips">60 秒内戳破尽量多的上升泡泡!泡泡越小分越高,快速连戳积攒连击倍率,泡泡飘出顶端要扣分。</p>
  <div class="card">
    <div class="bar"><div id="tbar"></div></div>
    <div class="row">
      <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
      <div class="stat"><div class="mut">倍率</div><div class="big" id="cb">x1</div></div>
      <div class="stat"><div class="mut">戳破</div><div class="big" id="pc">0</div></div>
      <div class="stat"><div class="mut">逃跑</div><div class="big" id="ep">0</div></div>
    </div>
  </div>
  <div class="card"><canvas id="cv" width="420" height="520"></canvas></div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">泡泡限时戳</h2><p id="ovp">玩法说明:<br>· 泡泡从底部不断升起,点击或触摸即可戳破<br>· 泡泡越小得分越高;飘出顶端每颗 -10 分<br>· 1.2 秒内连续戳破积攒连击,每 5 连升 1 级倍率,最高 x5<br>· 点空处会清空连击<br>· 倒计时 60 秒结束即结算成绩</p><button class="btn" id="obtn">开始挑战</button></div></div>
<script>
'use strict';
var W=420,H=520;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var COLORS=['#ff5c5c','#ffd166','#51d88a','#4da3ff','#b07cff'];
var bubbles=[],parts=[],floats=[];
var score=0,combo=0,bestCombo=0,comboT=0,popped=0,escaped=0;
var timeLeft=60,spawnT=0,running=false,lastT=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function $i(id){return document.getElementById(id)}
function upd(){
  var mult=Math.min(5,1+Math.floor(combo/5));
  $i('sc').textContent=score;
  $i('cb').textContent='x'+mult;
  $i('pc').textContent=popped;
  $i('ep').textContent=escaped;
}
function reset(){
  bubbles=[];parts=[];floats=[];
  score=0;combo=0;bestCombo=0;comboT=0;popped=0;escaped=0;
  timeLeft=60;spawnT=0;
  $i('tbar').style.width='100%';
  upd();
}
function spawn(){
  var r=rnd(14,27);
  bubbles.push({x:rnd(34,W-34),y:H+30,r:r,
    vy:-(rnd(46,92)+(60-timeLeft)*0.9),
    sw:rnd(0,6.28),sp:rnd(1.2,2.6),amp:rnd(10,26),
    c:COLORS[Math.floor(Math.random()*COLORS.length)]});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,life:0.9});}
function popBubble(i){
  var b=bubbles[i];bubbles.splice(i,1);
  combo++;comboT=1.2;if(combo>bestCombo)bestCombo=combo;
  var mult=Math.min(5,1+Math.floor(combo/5));
  var gain=Math.round((56-b.r*1.4)*mult);
  score+=gain;popped++;
  addFloat(b.x,b.y,'+'+gain,b.c);
  for(var k=0;k<10;k++){var a=rnd(0,6.28),s=rnd(50,170);
    parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,r:rnd(2,5),c:b.c,life:rnd(0.35,0.7)});}
  upd();
}
function update(dt){
  if(!running)return;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;running=false;endGame();return;}
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(0.28,0.7-(60-timeLeft)*0.007);}
  if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;upd();}}
  var i,b;
  for(i=bubbles.length-1;i>=0;i--){
    b=bubbles[i];
    b.y+=b.vy*dt;b.sw+=b.sp*dt;b.x+=Math.sin(b.sw)*b.amp*dt;
    if(b.x<b.r)b.x=b.r;if(b.x>W-b.r)b.x=W-b.r;
    if(b.y<-b.r-6){
      bubbles.splice(i,1);escaped++;combo=0;
      score=Math.max(0,score-10);
      addFloat(b.x+30,26,'-10','#ff5c5c');upd();
    }
  }
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.y-=40*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  $i('tbar').style.width=(timeLeft/60*100)+'%';
}
function drawBubble(x,y,r,c){
  ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=c;ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();
  ctx.beginPath();ctx.arc(x-r*0.32,y-r*0.32,r*0.28,0,6.2832);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141b3c');g.addColorStop(1,'#0d1126');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<bubbles.length;i++)drawBubble(bubbles[i].x,bubbles[i].y,bubbles[i].r,bubbles[i].c);
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fillStyle=p.c;ctx.fill();ctx.globalAlpha=1;}
  ctx.font='bold 15px system-ui';ctx.textAlign='center';
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}
}
function pt(e){
  var rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};
}
cv.addEventListener('pointerdown',function(e){
  if(!running)return;
  var p=pt(e),hit=-1;
  for(var i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i],dx=p.x-b.x,dy=p.y-b.y;
    if(dx*dx+dy*dy<=(b.r+6)*(b.r+6)){hit=i;break;}
  }
  if(hit>=0)popBubble(hit);
  else{combo=0;upd();}
});
function endGame(){
  $i('ovt').textContent='时间到!';
  $i('ovp').innerHTML='本局得分:<b>'+score+'</b><br>戳破泡泡:'+popped+' 颗<br>最高连击:'+bestCombo+' 连<br>逃跑泡泡:'+escaped+' 颗';
  $i('obtn').textContent='再来一局';
  $i('overlay').classList.remove('hide');
}
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

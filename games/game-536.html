<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果冻弹弹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#ffca3a;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#ffca3a;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#ffca3a}
.overlay p{color:#aab0d0;font-size:13px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#ffca3a;color:#3d2c05;border:none;border-radius:10px;padding:10px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>果冻弹弹</h1>
  <p class="hint">← → 移动弹板 · 点击/空格发射能量珠<br>弹珠击中果冻为其充能升级,6 级爆炸还震熟邻居!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>生命 <b id="life">●●●</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="340" height="430"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">果冻弹弹</h2>
      <p id="ovP">别让能量珠落地\n把果冻一颗颗弹到 6 级,连锁爆炸最痛快!</p>
      <div class="big" id="ovS"></div>
      <button id="btn">开 始</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var W=340,H=430,COLS=5,ROWS=3,CELL=52,JX=32,JY=64,JR=19;
var CCOL=['','#8d99ae','#5aa9e6','#4dd0c4','#7ed957','#f9d71c','#ff5d5d'];
var jelly=[],score=0,best=0,life=3,state='ready';
var pad={x:W/2,w:72,h:10,y:H-28},ball={x:W/2,y:H-44,vx:0,vy:0,stuck:true};
var keyL=false,keyR=false,flashes=[],tG=0;
function jx(c){return JX+c*CELL+CELL/2;}
function jy(r){return JY+r*CELL+CELL/2;}
function randE(){return Math.random()<0.75?1:2;}
function addScore(n){score+=n;if(score>best)best=score;$('score').textContent=score;$('best').textContent=best;}
function flash(x,y,c){flashes.push({x:x,y:y,t:0,c:c});}
function newJelly(){
  var r,c;
  jelly=[];
  for(r=0;r<ROWS;r++){jelly.push([]);for(c=0;c<COLS;c++)jelly[r].push(0);}
  var placed=0,guard=0;
  while(placed<9&&guard<200){
    guard++;
    var rr=Math.floor(Math.random()*ROWS),cc=Math.floor(Math.random()*COLS);
    if(jelly[rr][cc]===0){jelly[rr][cc]=randE();placed++;}
  }
}
function refill(){
  var count=0,r,c,guard=0;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(jelly[r][c]>0)count++;
  while(count<8&&guard<100){
    guard++;
    var rr=Math.floor(Math.random()*ROWS),cc=Math.floor(Math.random()*COLS);
    if(jelly[rr][cc]===0){jelly[rr][cc]=randE();count++;}
  }
}
function explode(r,c){
  jelly[r][c]=0;
  addScore(240);
  flash(jx(c),jy(r),'#ff5d5d');
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]],i;
  for(i=0;i<4;i++){
    var nr=r+dirs[i][0],nc=c+dirs[i][1];
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&jelly[nr][nc]===5)explode(nr,nc);
  }
  refill();
}
function normSpeed(){
  var s=Math.hypot(ball.vx,ball.vy)||1;
  ball.vx=ball.vx/s*300;ball.vy=ball.vy/s*300;
}
function launch(){
  if(state!=='play'||!ball.stuck)return;
  ball.stuck=false;
  var a=-Math.PI/2+(Math.random()-0.5)*0.6;
  ball.vx=Math.cos(a)*300;ball.vy=Math.sin(a)*300;
}
function update(dt){
  var r,c,i;
  tG+=dt;
  if(keyL)pad.x-=340*dt;
  if(keyR)pad.x+=340*dt;
  pad.x=Math.max(pad.w/2+4,Math.min(W-pad.w/2-4,pad.x));
  if(ball.stuck){ball.x=pad.x;ball.y=pad.y-pad.h/2-10;return;}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<12){ball.x=12;ball.vx=Math.abs(ball.vx);}
  if(ball.x>W-12){ball.x=W-12;ball.vx=-Math.abs(ball.vx);}
  if(ball.y<12){ball.y=12;ball.vy=Math.abs(ball.vy);}
  if(ball.vy>0&&ball.y>pad.y-pad.h/2-8&&ball.y<pad.y+pad.h&&Math.abs(ball.x-pad.x)<pad.w/2+8){
    var off=(ball.x-pad.x)/(pad.w/2);
    ball.vy=-Math.abs(ball.vy);
    ball.vx=off*200;
    normSpeed();
    ball.y=pad.y-pad.h/2-9;
  }
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    if(jelly[r][c]>0){
      var gx=jx(c),gy=jy(r);
      var dx=ball.x-gx,dy=ball.y-gy,d=Math.hypot(dx,dy),rr=JR+8;
      if(d<rr&&d>0.01){
        var nx=dx/d,ny=dy/d;
        ball.x=gx+nx*rr;ball.y=gy+ny*rr;
        var dot=ball.vx*nx+ball.vy*ny;
        ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;
        ball.vx+=(Math.random()-0.5)*30;
        normSpeed();
        var e=jelly[r][c];
        if(e>=6){explode(r,c);}
        else{
          jelly[r][c]=e+1;
          addScore((e+1)*10);
          flash(gx,gy,CCOL[Math.min(e+1,6)]);
        }
      }
    }
  }
  if(ball.y>H+20){
    life--;$('life').textContent=life>0?'●●●'.slice(0,life):'—';
    if(life<=0){finish();return;}
    ball.stuck=true;ball.vx=0;ball.vy=0;
  }
  for(i=0;i<flashes.length;i++)flashes[i].t+=dt;
  var k=[];
  for(i=0;i<flashes.length;i++)if(flashes[i].t<0.4)k.push(flashes[i]);
  flashes=k;
}
function finish(){
  state='over';
  $('ovT').textContent='能量珠漏光了';
  $('ovP').textContent='果冻们的派对暂时散场';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function start(){
  newJelly();score=0;life=3;flashes=[];
  pad.x=W/2;ball.stuck=true;ball.vx=0;ball.vy=0;
  $('score').textContent='0';$('life').textContent='●●●';$('best').textContent=String(best);
  $('ov').classList.add('hide');state='play';
}
$('btn').addEventListener('click',start);
window.addEventListener('keydown',function(e){
  if(e.keyCode===37)keyL=true;
  if(e.keyCode===39)keyR=true;
  if(e.keyCode===32){launch();e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.keyCode===37)keyL=false;
  if(e.keyCode===39)keyR=false;
});
function down(e){if(state==='play'){if(!ball.stuck)pad.x=posOf(e);else launch();}e.preventDefault();}
function move(e){if(state==='play'&&!ball.stuck)pad.x=Math.max(pad.w/2+4,Math.min(W-pad.w/2-4,posOf(e)));if(e.type!=='mousemove')e.preventDefault();}
function up(){}
function posOf(e){
  var t=e.touches?(e.touches[0]||e.changedTouches[0]):e;
  var rc=cv.getBoundingClientRect();
  return (t.clientX-rc.left)*W/rc.width;
}
cv.addEventListener('mousedown',down);
window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up,{passive:false});
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0b0e1a';ctx.fillRect(0,0,W,H);
  var r,c,i;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    ctx.strokeStyle='rgba(255,255,255,.05)';
    ctx.strokeRect(JX+c*CELL+0.5,JY+r*CELL+0.5,CELL-1,CELL-1);
    var e=jelly.length?jelly[r][c]:0;
    if(e>0){
      var gx=jx(c),gy=jy(r);
      ctx.beginPath();ctx.arc(gx,gy,JR+(e>=6?2*Math.sin(tG*10):0),0,7);
      ctx.fillStyle=CCOL[Math.min(e,6)];ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(gx-JR*0.3,gy-JR*0.35,JR*0.25,0,7);
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.92)';
      ctx.font='700 '+Math.min(17,10+e)+'px system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(Math.pow(2,e)),gx,gy+1);
    }
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=f.t/0.4;
    ctx.beginPath();ctx.arc(f.x,f.y,JR+pr*26,0,7);
    ctx.strokeStyle=f.c;ctx.globalAlpha=1-pr;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;
  }
  ctx.fillStyle='#ffca3a';
  roundRect(pad.x-pad.w/2,pad.y-pad.h/2,pad.w,pad.h,5);ctx.fill();
  ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='rgba(255,202,58,.9)';ctx.lineWidth=2;ctx.stroke();
  if(state==='play'&&ball.stuck){
    ctx.fillStyle='rgba(255,202,58,.7)';
    ctx.font='12px system-ui';ctx.textAlign='center';
    ctx.fillText('点击或按空格发射',W/2,H-58);
  }
}
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,0.05);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

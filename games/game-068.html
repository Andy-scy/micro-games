<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窄缝精英</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#e879f9;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#e879f9;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#e879f9}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#e879f9;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>窄缝精英</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀 · 缝隙极窄,越居中分越高!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>完美连击 <b id="pst">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">窄缝精英</h2>
      <p id="ovDesc">硬核挑战:缝隙窄得只容一鸟!速度放慢让你精调。穿越时离缝隙中心越近分越高:20px 内「完美 +3」,48px 内「精准 +2」,否则 +1;连续 3 次完美再奖励 +5。擦边即死,坠地即亡!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始挑战</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=66,GAP=96,SPACE=272,GRAV=1450,FLAP=-365,BX=120,BR=13,SPEED=118;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elPst=$("pst"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,popups,score,best=0,tick,pstreak;
function newPipe(x){return{x:x,gy:80+Math.random()*(GROUND-160-GAP),passed:false};}
function reset(){
  bird={y:280,vy:0,fl:0};
  pipes=[newPipe(W+160)];
  popups=[];score=0;tick=0;pstreak=0;
  elScore.textContent="0";
  elPst.textContent="0";
}
function act(){
  if(state!=="playing")return;
  bird.vy=FLAP;bird.fl=1;
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,p;
  tick+=dt;
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("失之毫厘,坠地了!");return;}
  for(i=0;i<pipes.length;i++)pipes[i].x-=SPEED*dt;
  if(pipes[pipes.length-1].x<W-SPACE)pipes.push(newPipe(W+26));
  if(pipes[0].x<-PW-12)pipes.shift();
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x+PW<BX-BR){
      p.passed=true;
      var d=Math.abs(bird.y-(p.gy+GAP/2));
      if(d<=20){
        score+=3;pstreak++;
        popups.push({x:BX+40,y:bird.y-26,txt:"完美 +3",life:1});
        if(pstreak%3===0){
          score+=5;
          popups.push({x:W/2,y:150,txt:"三连完美!奖励 +5",life:1.2});
        }
      }else if(d<=48){
        score+=2;pstreak=0;
        popups.push({x:BX+40,y:bird.y-26,txt:"精准 +2",life:0.9});
      }else{
        score+=1;pstreak=0;
        popups.push({x:BX+40,y:bird.y-26,txt:"擦过 +1",life:0.8});
      }
      elScore.textContent=String(score);
      elPst.textContent=String(pstreak);
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gy)||circleRect(BX,bird.y,BR,p.x,p.gy+GAP,PW,GROUND-p.gy-GAP)){
      die("缝隙太窄,撞管了!");return;
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  ctx.fillStyle="#a21caf";
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+GAP,PW,GROUND-p.gy-GAP);
  ctx.fillStyle="#e879f9";
  ctx.fillRect(p.x+5,0,6,p.gy);
  ctx.fillRect(p.x+5,p.gy+GAP,6,GROUND-p.gy-GAP);
  ctx.fillStyle="#701a75";
  ctx.fillRect(p.x-4,p.gy-12,PW+8,12);
  ctx.fillRect(p.x-4,p.gy+GAP,PW+8,12);
  ctx.fillStyle="rgba(232,121,249,0.35)";
  ctx.fillRect(p.x-8,p.gy+GAP/2-20,4,40);
  ctx.fillRect(p.x+PW+4,p.gy+GAP/2-20,4,40);
}
function draw(){
  var i,p;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#170f1c";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(240,200,255,0.3)";
  for(i=0;i<35;i++)ctx.fillRect((i*143)%W,(i*229)%GROUND,1.3,1.3);
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    ctx.strokeStyle="rgba(232,121,249,0.25)";ctx.lineWidth=1.5;
    ctx.setLineDash([5,6]);
    ctx.beginPath();ctx.moveTo(p.x-14,p.gy);ctx.lineTo(p.x-14,p.gy+GAP);ctx.stroke();
    ctx.setLineDash([]);
    drawPipe(p);
  }
  ctx.fillStyle="#2a1f33";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#43304f";
  var off=(tick*SPEED)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#f5d0fe";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#c026d3";
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#1a0f22";
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fb923c";
  ctx.beginPath();ctx.moveTo(BX+BR-2,bird.y);ctx.lineTo(BX+BR+8,bird.y+2);ctx.lineTo(BX+BR-2,bird.y+6);ctx.closePath();ctx.fill();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(240,171,252,"+Math.min(1,popups[i].life)+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三色循环灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#34d399;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#34d399;font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 2px;vertical-align:-1px}
.dot0{background:#232a4a}.dot1{background:#f59e0b}.dot2{background:#34d399;box-shadow:0 0 6px #34d399}
.gbtn{background:#0f3a2b;color:#34d399;border:1px solid #34d399;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#34d399;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:11px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.s1{background:linear-gradient(145deg,#fcd34d,#d97706);border-color:#fde68a;box-shadow:0 0 10px rgba(245,158,11,.45)}
.cell.s2{background:linear-gradient(145deg,#6ee7b7,#059669);border-color:#a7f3d0;box-shadow:0 0 16px rgba(52,211,153,.6)}
.cell.cur{outline:2px solid rgba(52,211,153,.75);outline-offset:2px}
.cell:active{transform:scale(.92)}
.legend{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#34d399;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#34d399;color:#0f3a2b;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>三色循环灯</h1>
  <p class="hint">这里的灯有三档:熄灭 → 琥珀 → 翠绿,再点回到熄灭。点击会让自身与上下左右各前进一档。让整块棋盘停在翠绿档,即为通关。</p>
  <div class="legend"><span class="dot dot0"></span>熄灭 <span class="dot dot1"></span>琥珀 <span class="dot dot2"></span>翠绿(目标)</div>
  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>已达翠绿 <b id="ok">0</b>/16</span>
    <span>最少步纪录 <b id="best">--</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">三色循环灯</h2>
    <p id="ovDesc">两态点灯玩腻了?这里每盏灯循环三档,按下即整体 +1。同一盏灯多点两次可以抵消一次错按,思路要按「三进制」来算。全部停在翠绿档即胜利。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始调光</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=4,CNT=16;
var gridEl=$("grid"),elMoves=$("moves"),elOk=$("ok"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],moves=0,state="menu";
var best=loadNum("mg326_best");

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2200);}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){
  var s=board[i],cl="cell";
  if(s===1)cl+=" s1";
  else if(s===2)cl+=" s2";
  if(cur===i)cl+=" cur";
  cells[i].className=cl;
}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++){
    board[list[i]]=(board[list[i]]+1)%3;
    if(!silent)paint(list[i]);
  }
  if(!silent)moves++;
}
function okCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i]===2)n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function updateHud(){
  elMoves.textContent=moves;elOk.textContent=okCount();
  elBest.textContent=best>0?best+" 步":"--";
}
function newGame(){
  board=[];for(var i=0;i<CNT;i++)board.push(2);
  moves=0;state="playing";
  var ps=pickCells(6),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(okCount()===CNT)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||moves<best){best=moves;saveNum("mg326_best",best);isNew=true;}
  ovTitle.textContent="满盘翠绿!";
  ovDesc.textContent=isNew?"新纪录!三档调光被你一步不浪费地归位。":"十六盏灯齐齐停在翠绿档,这盘三进制的账你算平了。";
  ovScore.style.display="block";
  ovScore.textContent="本局步数 "+moves;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function start(){newGame();ov.classList.add("hide");}
var cur=-1;
function setCur(i){var old=cur;cur=i;if(old>=0)paint(old);if(cur>=0)paint(cur);}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(cur<0)setCur(5);
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){
  if(state==="menu")return;
  newGame();setMsg("已重开一局");
});
build();
board=[];for(var z=0;z<CNT;z++)board.push(2);
var ps0=pickCells(6),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
})();
</script>
</body>
</html>

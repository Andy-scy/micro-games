<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百变积木</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:21px;margin:4px 0 2px;color:#74c0fc}
.hint{font-size:13px;color:#9aa3c0;margin-bottom:6px;text-align:center;line-height:1.5}
#cv{background:#141933;border-radius:14px;max-width:100%;touch-action:none}
.ov{position:fixed;inset:0;background:rgba(8,10,22,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1b2040;border:1px solid #2e3660;border-radius:16px;padding:24px 28px;text-align:center;max-width:86%}
.card h2{color:#74c0fc;margin-bottom:10px;font-size:22px}
.card p{font-size:14px;color:#c3cae6;margin-bottom:8px;line-height:1.7}
.card .sc{font-size:17px;color:#7ee0a3}
button{margin-top:8px;background:#74c0fc;color:#141933;border:none;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>百变积木</h1>
<p class="hint">宽窄随机的积木 · 支撑面不足三成会翻落,每四块合龙加固一次,点击或空格</p>
<canvas id="cv" width="420" height="640"></canvas>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">百变积木</h2><p id="ovM">积木宽窄随机,落点下的支撑不足自身宽度三成就整块翻落(共 3 次机会)。<br>每成功放上 4 块,顶层自动合龙成一整条,更加稳固。搭桥悬挑,小心失衡!</p><p class="sc" id="ovS"></p><button id="ovB">开始游戏</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovM=document.getElementById('ovM'),ovS=document.getElementById('ovS'),ovB=document.getElementById('ovB');
var W=cv.width,H=cv.height,GROUND=560,BH=22;
var settled,group,cur,fx,pops,score,state='ready',cam=0,lives,sinceP,placed;
var WS=[50,70,100,130];

function layerC(i){return 'hsl('+((i*22+195)%360)+',55%,58%)';}
function reset(){
  settled=[{x:210,w:170}];group=[];score=0;fx=[];pops=[];cam=0;lives=3;sinceP=0;placed=0;
  spawn();
}
function spawn(){
  var w=WS[Math.floor(Math.random()*WS.length)],left=Math.random()<0.5;
  cur={x:left?40:W-40,dir:left?1:-1,w:w,spd:Math.min(2.0+placed*0.04,5.0)};
}
function pop(txt,x,y,c){pops.push({t:txt,x:x,y:y,c:c||'#74c0fc',life:1});}
function spans(){return group.length>0?group:[settled[settled.length-1]];}
function supOverlap(x,w){
  var ss=spans(),s=0,i;
  for(i=0;i<ss.length;i++){
    var l=Math.max(x-w/2,ss[i].x-ss[i].w/2),r=Math.min(x+w/2,ss[i].x+ss[i].w/2);
    if(r>l)s+=r-l;
  }
  return s;
}
function place(){
  var sup=supOverlap(cur.x,cur.w);
  var rowY=GROUND-(settled.length+2)*BH+BH/2;
  if(sup<cur.w*0.3){
    fx.push({x:cur.x,y:rowY,w:cur.w,vx:(Math.random()<0.5?-1:1)*90,vy:-40,rot:0,vr:(cur.x<210?-1:1)*2.8,life:1.5,c:layerC(placed)});
    lives--;placed++;
    pop('失去支撑!',cur.x,rowY-14,'#ff6b6b');
    if(lives<=0){cur=null;finish();return;}
    spawn();return;
  }
  group.push({x:cur.x,w:cur.w});
  placed++;score+=10;
  if(sup<cur.w*0.6)pop('惊险搭桥 +20',cur.x,rowY-14,'#ffa94d'),score+=20;
  if(group.length>=4){
    var i,l=1e9,r=-1e9;
    for(i=0;i<group.length;i++){var s=group[i];if(s.x-s.w/2<l)l=s.x-s.w/2;if(s.x+s.w/2>r)r=s.x+s.w/2;}
    settled.push({x:(l+r)/2,w:r-l});
    group=[];score+=25;
    pop('合龙加固 +25',(l+r)/2,rowY-34,'#7ee0a3');
  }
  spawn();
}
function finish(){
  state='over';
  var h=settled.length-1+group.length;
  window.setTimeout(function(){
    ovT.textContent='积木翻落太多!';
    ovS.textContent='最终高度 '+h+' 层 · 得分 '+score;
    ovM.textContent='大块要骑在接缝上,小块放在正中央';
    ovB.textContent='再来一局';
    ov.style.display='flex';
  },700);
}
function start(){reset();state='play';ov.style.display='none';}
function step(dt){
  if(state==='play'&&cur){
    cur.x+=cur.spd*cur.dir*dt*60;
    var m=cur.w/2+6;
    if(cur.x<m){cur.x=m;cur.dir=1;}
    if(cur.x>W-m){cur.x=W-m;cur.dir=-1;}
  }
  var i;
  for(i=fx.length-1;i>=0;i--){var f=fx[i];f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var p=pops[i];p.life-=dt;p.y-=34*dt;if(p.life<=0)pops.splice(i,1);}
  var hgt=settled.length+(group.length>0?1:0);
  cam=Math.max(0,300-(GROUND-hgt*BH));
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14283a');g.addColorStop(1,'#0f1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var gy=GROUND-cam;
  ctx.fillStyle='#1d2447';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2e3660';ctx.fillRect(0,gy,W,5);
  var i,b,y;
  for(i=0;i<settled.length;i++){
    b=settled[i];y=GROUND-(settled.length-i)*BH-cam;
    if(y<-BH||y>H)continue;
    ctx.fillStyle=layerC(i);rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x-b.w/2+4,y+5,Math.max(0,b.w-8),4);
  }
  for(i=0;i<group.length;i++){
    b=group[i];y=GROUND-(settled.length+1)*BH-cam;
    ctx.fillStyle=layerC(settled.length+i);rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.stroke();
  }
  if(cur&&state==='play'){
    y=GROUND-(settled.length+(group.length>0?2:1))*BH-cam;
    ctx.fillStyle=layerC(placed);rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.stroke();
  }
  for(i=0;i<fx.length;i++){
    var f=fx[i];ctx.save();ctx.translate(f.x,f.y-cam);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.c;ctx.fillRect(-f.w/2,-(BH-4)/2,f.w,BH-4);ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,14,32);
  for(i=0;i<3;i++){
    ctx.beginPath();ctx.arc(W-24-i*24,26,8,0,6.283);
    if(i<lives){ctx.fillStyle='#74c0fc';ctx.fill();}
    else{ctx.strokeStyle='#3a4370';ctx.lineWidth=2;ctx.stroke();}
  }
  ctx.fillStyle='#9aa3c0';ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('本层 '+(group.length)+'/4 块',W/2,30);
  for(i=0;i<pops.length;i++){var p=pops[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y-cam);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function tap(){if(state==='play'&&cur)place();}
if(window.PointerEvent){cv.addEventListener('pointerdown',function(e){e.preventDefault();tap();});}
else{cv.addEventListener('mousedown',function(){tap();});cv.addEventListener('touchstart',function(e){e.preventDefault();tap();});}
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowDown'||e.key===' '){e.preventDefault();tap();}});
ovB.addEventListener('click',start);
reset();
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,0.033);if(dt<0)dt=0;last=ts;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保龄冲撞</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#stage{position:relative}
canvas{display:block;background:#1a2340;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:24px;margin-top:8px;user-select:none;-webkit-user-select:none;align-items:center}
#dpad{display:grid;grid-template-areas:". u ." "l d r";gap:6px}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pbtn.fire{width:84px;height:84px;border-radius:50%;font-size:14px;font-weight:700;background:#5a2a2a;border-color:#8a4444}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>保龄冲撞</h1>
<div id="hud"><span>回合 <b id="hA">1/3</b></span><span>站立的敌坦 <b id="hB">10</b></span><span>连击 <b id="hC">x1</b></span><span>分数 <b id="hD">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>保龄冲撞</h2>
  <p id="ovP">没有炮弹,全靠蛮力!按住空格蓄力,松开向前猛冲,<br>把敌方坦克撞进水坑;敌坦之间还会互相连锁碰撞。<br>方向键/WASD 驾驶,3 回合,一轮撞倒越多奖励越高。小心自己也别掉进水里!</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="pbtn" data-k="ArrowUp" style="grid-area:u">▲</div>
    <div class="pbtn" data-k="ArrowLeft" style="grid-area:l">◀</div>
    <div class="pbtn" data-k="ArrowDown" style="grid-area:d">▼</div>
    <div class="pbtn" data-k="ArrowRight" style="grid-area:r">▶</div>
  </div>
  <div class="pbtn fire" data-k="Space">蓄力冲撞</div>
</div>
<script>
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hA=document.getElementById('hA'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD');
const PITS=[[90,90,44],[390,120,40],[240,300,48],[120,330,34],[380,330,40]];
let score,round,pins,player,combo,comboT,charging,charge,dashCd,frame=0,state='start',msg,msgT;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function inPit(x,y,pad){
  for(const p of PITS){
    if(Math.hypot(x-p[0],y-p[1])<p[2]+pad)return true;
  }
  return false;
}
function mkPin(x,y){
  return {x:x,y:y,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,dir:0};
}
function buildRound(){
  pins=[];
  let tries=0;
  while(pins.length<10&&tries<900){
    tries++;
    const x=40+Math.random()*(cv.width-80),y=40+Math.random()*(cv.height-80);
    if(inPit(x,y,30))continue;
    if(Math.hypot(x-player.x,y-player.y)<90)continue;
    let ok=true;
    for(const p of pins){if(Math.hypot(x-p.x,y-p.y)<34){ok=false;break;}}
    if(ok)pins.push(mkPin(x,y));
  }
}
function initGame(){
  score=0;round=1;combo=1;comboT=0;charging=false;charge=0;dashCd=0;
  player={x:cv.width/2,y:cv.height-50,vx:0,vy:0,dir:0,sunk:0,inv:60};
  buildRound();
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function floatTxt(x,y,txt,c){pins.push({x:x,y:y,txt:txt,c:c,life:44,vx:0,vy:-0.8});}
function isTxt(p){return p.txt!==undefined;}
function updPlayer(){
  let ax=0,ay=0;
  const ACC=0.16;
  if(keys.ArrowUp||keys.KeyW)ay-=ACC;
  if(keys.ArrowDown||keys.KeyS)ay+=ACC;
  if(keys.ArrowLeft||keys.KeyA)ax-=ACC;
  if(keys.ArrowRight||keys.KeyD)ax+=ACC;
  player.vx+=ax;player.vy+=ay;
  if(charging){
    if(keys.Space&&charge<55)charge++;
    if(!keys.Space){
      const sp=Math.hypot(player.vx,player.vy);
      let dx,dy;
      if(sp>0.3){dx=player.vx/sp;dy=player.vy/sp;}
      else{dx=DIRX[player.dir][0];dy=DIRX[player.dir][1];}
      const pow=3.2+charge/55*4.3;
      player.vx=dx*pow;player.vy=dy*pow;
      charging=false;charge=0;dashCd=40;
      combo=1;comboT=0;
    }
  }else{
    if(keys.Space&&dashCd<=0){charging=true;charge=0;}
  }
  if(dashCd>0)dashCd--;
  player.vx*=0.955;player.vy*=0.955;
  const sp=Math.hypot(player.vx,player.vy);
  if(sp>7){player.vx=player.vx/sp*7;player.vy=player.vy/sp*7;}
  if(ax||ay)player.dir=ay<0?0:(ax>0?1:(ay>0?2:3));
  player.x+=player.vx;player.y+=player.vy;
  if(player.x<14){player.x=14;player.vx=-player.vx*0.6;}
  if(player.x>cv.width-14){player.x=cv.width-14;player.vx=-player.vx*0.6;}
  if(player.y<14){player.y=14;player.vy=-player.vy*0.6;}
  if(player.y>cv.height-14){player.y=cv.height-14;player.vy=-player.vy*0.6;}
  if(player.inv>0)player.inv--;
  if(player.inv<=0&&inPit(player.x,player.y,6)){
    for(let i=0;i<14;i++)spawnFx(player.x,player.y,'#7ab8e8');
    score=Math.max(0,score-100);
    floatTxt(player.x-14,player.y-10,'落水 -100','#7ab8e8');
    player.x=cv.width/2;player.y=cv.height-50;
    player.vx=0;player.vy=0;player.inv=80;
  }
  if(comboT>0){comboT--;if(comboT===0)combo=1;}
}
const DIRX=[[0,-1],[1,0],[0,1],[-1,0]];
function spawnFx(x,y,c){
  if(!updParts.list)updParts.list=[];
  updParts.list.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20,max:20,c:c});
}
function updParts(){
  const list=updParts.list||[];
  for(let i=list.length-1;i>=0;i--){
    const p=list[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)list.splice(i,1);
  }
  for(let i=pins.length-1;i>=0;i--){
    const p=pins[i];
    if(isTxt(p)){
      p.x+=p.vx;p.y+=p.vy;p.life--;
      if(p.life<=0)pins.splice(i,1);
    }
  }
}
function collide(){
  const all=pins.filter(p=>!isTxt(p));
  all.push(player);
  for(let i=0;i<all.length;i++){
    for(let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d>0.01&&d<28){
        const nx=dx/d,ny=dy/d,ov=(28-d)/2;
        a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(vn<0){
          const imp=-vn*0.92;
          a.vx-=imp*nx;a.vy-=imp*ny;
          b.vx+=imp*nx;b.vy+=imp*ny;
          if(Math.abs(vn)>1.2){
            for(let k=0;k<3;k++)spawnFx((a.x+b.x)/2,(a.y+b.y)/2,'#ffd76a');
          }
        }
      }
    }
  }
}
function sinkPins(){
  for(let i=pins.length-1;i>=0;i--){
    const p=pins[i];
    if(isTxt(p))continue;
    if(inPit(p.x,p.y,0)){
      pins.splice(i,1);
      for(let k=0;k<12;k++)spawnFx(p.x,p.y,'#7ab8e8');
      const gained=100*combo;
      score+=gained;
      floatTxt(p.x-12,p.y-8,'+'+gained+(combo>1?' x'+combo:''),'#7ab8e8');
      combo=Math.min(combo+1,5);comboT=150;
    }
  }
}
function updPins(){
  for(const p of pins){
    if(isTxt(p))continue;
    p.x+=p.vx;p.y+=p.vy;
    p.vx*=0.985;p.vy*=0.985;
    if(p.x<14){p.x=14;p.vx=Math.abs(p.vx)*0.7;}
    if(p.x>cv.width-14){p.x=cv.width-14;p.vx=-Math.abs(p.vx)*0.7;}
    if(p.y<14){p.y=14;p.vy=Math.abs(p.vy)*0.7;}
    if(p.y>cv.height-14){p.y=cv.height-14;p.vy=-Math.abs(p.vy)*0.7;}
  }
}
function checkRound(){
  const left=pins.filter(p=>!isTxt(p)).length;
  if(left>0)return;
  if(round>=3){
    end('完美拆迁!','三回合保龄全部收官!<br>最终得分:'+score);
    return;
  }
  round++;
  score+=500;
  buildRound();
}
function end(title,detail){
  state='over';
  ov.children[0].textContent=title;
  ovP.innerHTML=detail;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function updHud(){
  const left=pins.filter(p=>!isTxt(p)).length;
  hA.textContent=round+'/3';hB.textContent=left;
  hC.textContent='x'+combo;hD.textContent=score;
}
function draw(){
  ctx.fillStyle='#1a2340';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  for(let x=0;x<cv.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke();}
  for(let y=0;y<cv.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}
  for(const p of PITS){
    const g=ctx.createRadialGradient(p[0],p[1],4,p[0],p[1],p[2]);
    g.addColorStop(0,'#0d2b52');g.addColorStop(1,'#1e4a80');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(122,184,232,0.25)';
    ctx.beginPath();ctx.arc(p[0],p[1],p[2]*0.7,0,Math.PI*2);ctx.fill();
  }
  for(const p of pins){
    if(isTxt(p)){
      ctx.globalAlpha=Math.min(p.life/22,1);
      ctx.fillStyle=p.c;ctx.font='bold 14px system-ui';ctx.textAlign='center';
      ctx.fillText(p.txt,p.x,p.y);
      ctx.globalAlpha=1;
      continue;
    }
    ctx.fillStyle='#171b2e';ctx.fillRect(p.x-12,p.y-12,24,24);
    ctx.fillStyle='#c46a6a';ctx.fillRect(p.x-8,p.y-8,16,16);
    ctx.fillStyle='#12152a';ctx.fillRect(p.x-2,p.y-12,4,6);
    ctx.fillStyle='#c46a6a';ctx.fillRect(p.x-5,p.y-5,10,10);
  }
  if(!(player.inv>0&&frame%6<3)){
    ctx.fillStyle='#171b2e';ctx.fillRect(player.x-13,player.y-13,26,26);
    ctx.fillStyle='#5fbf68';ctx.fillRect(player.x-9,player.y-9,18,18);
    const v=DIRX[player.dir];
    ctx.fillStyle='#12152a';ctx.fillRect(player.x+v[0]*9-3,player.y+v[1]*9-3,6,6);
    ctx.fillStyle='#5fbf68';ctx.fillRect(player.x-5,player.y-5,10,10);
  }
  const fx=updParts.list||[];
  for(const p of fx){
    ctx.globalAlpha=Math.max(p.life/p.max,0);
    ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(charging){
    ctx.fillStyle='#ffd76a';
    ctx.font='bold 13px system-ui';ctx.textAlign='center';
    ctx.fillText('蓄力 '+Math.round(charge/55*100)+'%',player.x,player.y-22);
    ctx.fillStyle='#40300f';ctx.fillRect(player.x-20,player.y+20,40,5);
    ctx.fillStyle='#ffd76a';ctx.fillRect(player.x-20,player.y+20,40*charge/55,5);
  }else if(dashCd>0){
    ctx.fillStyle='rgba(232,236,255,0.5)';
    ctx.font='11px system-ui';ctx.textAlign='center';
    ctx.fillText('冷却中',player.x,player.y-20);
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){
    frame++;
    updPlayer();updPins();collide();sinkPins();updParts();checkRound();updHud();
  }
  draw();
}
initGame();
loop();
</script>
</body>
</html>

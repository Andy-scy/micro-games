<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>惯性滑板</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center}
h1{font-size:22px;margin:14px 0 2px;color:#ffd166}
#tip{margin:0 0 10px;font-size:13px;color:#9aa3c7;text-align:center;padding:0 12px}
#wrap{position:relative;width:min(96vw,480px)}
canvas{display:block;width:100%;background:#151a30;border-radius:14px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#ov.hide{display:none}
#ov h2{margin:0;font-size:26px;color:#ffd166}
#ov p{margin:0;font-size:14px;color:#c3c9e8;line-height:1.8;white-space:pre-line}
#ov button{margin-top:8px;padding:10px 36px;font-size:16px;border:none;border-radius:999px;background:#ffd166;color:#1a1d33;font-weight:bold;cursor:pointer;font-family:inherit}
#ov button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>惯性滑板</h1>
<p id="tip">挡板像在冰面上:有加速、有滑行、有惯性! · 键盘←→ 或按住屏幕左右半边 · 空格发球</p>
<div id="wrap">
<canvas id="cv" width="480" height="600"></canvas>
<div id="ov"><h2 id="ovT">惯性滑板</h2><p id="ovP">挡板不再听指挥,像滑冰一样漂移
提前预判、提前刹车,击碎全部砖块</p><button id="ovB">开始游戏</button></div>
</div>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const ov = document.getElementById("ov");
const ovT = document.getElementById("ovT");
const ovP = document.getElementById("ovP");
const ovB = document.getElementById("ovB");

const COLORS = ["#ffd166", "#ef476f", "#06d6a0", "#4cc9f0", "#b388ff", "#ff8fa3"];
const BW = 52, BH = 20, GAP = 4, COLS = 8, ROWS = 6;
const OX = (W - COLS * (BW + GAP) + GAP) / 2;
const SPEED = 300;
const ACC = 2100;

let state = "menu";
let score = 0, lives = 3, padVx = 0;
let bricks = [], balls = [];
const pad = { x: W / 2, y: H - 40, w: 92, h: 14 };
const keys = {};
let touchDir = 0;
let last = 0;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      bricks.push({ x: OX + c * (BW + GAP), y: 64 + r * (BH + GAP), w: BW, h: BH, hp: 1, color: COLORS[r % COLORS.length] });
    }
  }
}

function resetBall() {
  balls = [{ x: pad.x, y: pad.y - 10, vx: 0, vy: 0, r: 7, stuck: true }];
}

function launch() {
  for (const b of balls) {
    if (b.stuck) {
      b.stuck = false;
      const a = Math.random() * 0.6 - 0.3;
      b.vx = SPEED * Math.sin(a);
      b.vy = -SPEED * Math.cos(a);
    }
  }
}

function bouncePad(b) {
  const rel = clamp((b.x - pad.x) / (pad.w / 2), -1, 1);
  const ang = rel * 1.1;
  b.vx = SPEED * Math.sin(ang);
  b.vy = -SPEED * Math.cos(ang);
  b.y = pad.y - b.r;
}

function update(dt) {
  let ax = 0;
  if (keys.ArrowLeft) ax -= ACC;
  if (keys.ArrowRight) ax += ACC;
  if (touchDir !== 0) ax += touchDir * ACC;
  padVx += ax * dt;
  padVx -= padVx * 2.6 * dt;
  padVx = clamp(padVx, -640, 640);
  pad.x += padVx * dt;
  if (pad.x < pad.w / 2) { pad.x = pad.w / 2; padVx *= -0.35; }
  if (pad.x > W - pad.w / 2) { pad.x = W - pad.w / 2; padVx *= -0.35; }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.stuck) { b.x = pad.x; b.y = pad.y - b.r - 1; continue; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
    if (b.vy > 0 && b.y + b.r >= pad.y && b.y - b.r <= pad.y + pad.h && Math.abs(b.x - pad.x) <= pad.w / 2 + b.r) {
      bouncePad(b);
    }
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
        const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
        if (ox < oy) { b.vx = -b.vx; b.x += (b.x < br.x + br.w / 2) ? -ox : ox; }
        else { b.vy = -b.vy; b.y += (b.y < br.y + br.h / 2) ? -oy : oy; }
        br.hp = 0;
        score += 10;
        break;
      }
    }
    if (b.y > H + 30) balls.splice(i, 1);
  }

  if (balls.length === 0) {
    lives--;
    if (lives <= 0) { endGame(false); return; }
    resetBall();
  }
  if (bricks.every(br => br.hp <= 0)) endGame(true);
}

function endGame(win) {
  state = "over";
  ovT.textContent = win ? "漂移大师!" : "游戏结束";
  ovP.textContent = "最终得分:" + score + (win ? "\n人板合一,稳如老狗!" : "\n剩余砖块 " + bricks.filter(br => br.hp > 0).length + " 块");
  ovB.textContent = "再来一局";
  ov.classList.remove("hide");
}

function startGame() {
  score = 0; lives = 3; padVx = 0; touchDir = 0;
  pad.x = W / 2;
  buildBricks();
  resetBall();
  ov.classList.add("hide");
  state = "play";
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const br of bricks) {
    if (br.hp <= 0) continue;
    ctx.fillStyle = br.color;
    rr(br.x, br.y, br.w, br.h, 4);
  }
  ctx.fillStyle = "#ffffff";
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  if (Math.abs(padVx) > 160) {
    ctx.fillStyle = "rgba(77,163,255,.3)";
    rr(pad.x - padVx * 0.03 - pad.w / 2, pad.y, pad.w, pad.h, 7);
  }
  ctx.fillStyle = "#4da5ff";
  rr(pad.x - pad.w / 2, pad.y, pad.w, pad.h, 7);
  ctx.font = "bold 15px system-ui, sans-serif";
  ctx.fillStyle = "#e8eaf6";
  ctx.textAlign = "left";
  ctx.fillText("得分 " + score, 12, 32);
  ctx.textAlign = "right";
  ctx.fillText("生命 " + lives, W - 12, 32);
  ctx.textAlign = "center";
  ctx.fillStyle = "#9aa3c7";
  ctx.fillText("滑速", 60, H - 12);
  const k = clamp(Math.abs(padVx) / 640, 0, 1);
  ctx.fillStyle = "rgba(255,255,255,.15)";
  ctx.fillRect(90, H - 22, 120, 10);
  ctx.fillStyle = k > 0.7 ? "#ef476f" : "#4da5ff";
  ctx.fillRect(90, H - 22, 120 * k, 10);
}

function pointerX(e) {
  const rect = cv.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}

cv.addEventListener("touchstart", e => {
  e.preventDefault();
  if (state !== "play") return;
  const rect = cv.getBoundingClientRect();
  touchDir = (e.touches[0].clientX - rect.left) < rect.width / 2 ? -1 : 1;
  launch();
}, { passive: false });
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  if (state !== "play") return;
  const rect = cv.getBoundingClientRect();
  touchDir = (e.touches[0].clientX - rect.left) < rect.width / 2 ? -1 : 1;
}, { passive: false });
cv.addEventListener("touchend", e => {
  e.preventDefault();
  if (e.touches.length === 0) touchDir = 0;
}, { passive: false });

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === " ") e.preventDefault();
  keys[e.key] = true;
  if (e.key === " " && state === "play") launch();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

ovB.addEventListener("click", startGame);

buildBricks();
resetBall();

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - last) / 1000, 0.033);
  last = ts;
  if (state === "play") update(dt);
  draw();
}
requestAnimationFrame(loop);
</script>
</body>
</html>

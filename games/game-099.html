<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>核心保卫战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#74c0fc;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#74c0fc;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#74c0fc;color:#08243d;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#74c0fc;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>核心保卫战</h1>
<p class="tip">←→↑↓/WASD 或按住拖动移动,空格 / 按住屏幕开火。敌机会从四面八方扑向中央的空间站核心:撞击和炮火都会削弱核心(共 12 点)。核心存活 90 秒即获胜;核心或你的战机损毁则失败。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">核心保卫战</h2>
<p id="ovX">你不是在为自己而战:中央空间站承载着整个殖民地的希望。守好它,守住 90 秒。</p>
<button id="btn">开始守卫</button>
</div></div>
</div>
<div class="hud"><span>时间<b id="hT">0/90</b></span><span>核心<b id="hC">12</b></span><span>得分<b id="hS">0</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hT=document.getElementById("hT"),hC=document.getElementById("hC"),hS=document.getElementById("hS");
var GOAL=90,COREHP=12;
var state="ready",score=0,coreHp=COREHP,hp=3,inv=0,cool=0,t=0,timer=0,spawn=0.8;
var cx=W/2,cy=H*0.48;
var ship={x:W/2,y:H-90};
var bullets=[],ebullets=[],enemies=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*20+6});}
function reset(){
  score=0;coreHp=COREHP;hp=3;inv=0;cool=0;t=0;timer=0;spawn=0.8;
  ship.x=W/2;ship.y=H-90;
  bullets=[];ebullets=[];enemies=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function gameOver(win,reason){
  state="over";
  ovT.textContent=win?"核心无恙":reason;
  ovX.textContent="最终得分:"+score+(win?" · 90 秒过去,空间站灯火依旧。":" · 再来一次,把核心护在身后。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function spawnEnemy(){
  var side=Math.floor(Math.random()*4);
  var x,y;
  if(side===0){x=Math.random()*W;y=-24;}
  else if(side===1){x=W+24;y=Math.random()*H*0.6;}
  else if(side===2){x=Math.random()*W;y=H+24;}
  else{x=-24;y=Math.random()*H*0.6;}
  var gun=Math.random()<0.35;
  enemies.push({x:x,y:y,hp:gun?3:1,gun:gun,orb:Math.random()*6.283,ft:1.2});
}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;timer+=dt;spawn-=dt;
  var sp=290;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(18,Math.min(W-18,ship.x));
  ship.y=Math.max(18,Math.min(H-30,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0){
    cool=0.16;
    var ba=-Math.PI/2;
    if(pressed){
      var adx=px-ship.x,ady=py-ship.y;
      if(adx*adx+ady*ady>100)ba=Math.atan2(ady,adx);
    }
    bullets.push({x:ship.x+Math.cos(ba)*16,y:ship.y+Math.sin(ba)*16,vx:Math.cos(ba)*480,vy:Math.sin(ba)*480});
  }
  if(spawn<=0){
    spawn=Math.max(0.45,1.3-timer*0.008);
    spawnEnemy();
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    var b=bullets[bi];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.gun){
      var gdx=cx-e.x,gdy=cy-e.y,gd=Math.sqrt(gdx*gdx+gdy*gdy)||1;
      if(gd>170){
        e.x+=gdx/gd*110*dt;
        e.y+=gdy/gd*110*dt;
      }else{
        e.orb+=dt*0.9;
        e.x=cx+Math.cos(e.orb)*165;
        e.y=cy+Math.sin(e.orb)*165;
      }
      e.ft-=dt;
      if(e.ft<=0){
        e.ft=Math.max(1.1,2.2-timer*0.012);
        var tdx=ship.x-e.x,tdy=ship.y-e.y,td=Math.sqrt(tdx*tdx+tdy*tdy)||1;
        ebullets.push({x:e.x,y:e.y+10,vx:tdx/td*200,vy:tdy/td*200});
      }
    }else{
      var rdx=cx-e.x,rdy=cy-e.y,rd=Math.sqrt(rdx*rdx+rdy*rdy)||1;
      e.x+=rdx/rd*130*dt;
      e.y+=rdy/rd*130*dt;
      if(rd<40){
        boom(e.x,e.y,14,"#ff6b6b");
        coreHp--;
        enemies.splice(i,1);
        continue;
      }
    }
    if(inv<=0&&Math.abs(e.x-ship.x)<22&&Math.abs(e.y-ship.y)<22){
      enemies.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  for(i=ebullets.length-1;i>=0;i--){
    var eb=ebullets[i];
    eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;
    if(eb.x<-10||eb.x>W+10||eb.y<-10||eb.y>H+10){ebullets.splice(i,1);continue;}
    var cdx=eb.x-cx,cdy=eb.y-cy;
    if(cdx*cdx+cdy*cdy<841){
      ebullets.splice(i,1);
      coreHp--;
      boom(cx,cy,8,"#74c0fc");
      continue;
    }
    if(inv<=0&&Math.abs(eb.x-ship.x)<11&&Math.abs(eb.y-ship.y)<13){
      ebullets.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,12,"#ff6b6b");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      var dx2=bl.x-e2.x,dy2=bl.y-e2.y;
      if(dx2*dx2+dy2*dy2<400){
        bullets.splice(bi,1);
        e2.hp--;
        if(e2.hp<=0){
          boom(e2.x,e2.y,12,"#ffd166");
          score+=20;
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(coreHp<=0){gameOver(false,"核心失守");return;}
  if(inv<=0&&hp<=0){gameOver(false,"战机损毁");return;}
  if(timer>=GOAL){score+=500;gameOver(true,"");}
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(t*0.4);
  ctx.strokeStyle="rgba(116,192,252,0.4)";
  ctx.lineWidth=2;
  ctx.setLineDash([8,10]);
  ctx.beginPath();ctx.arc(0,0,52,0,6.283);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle="#74c0fc";
  ctx.beginPath();
  for(var k=0;k<6;k++){
    var a2=k/6*6.283+t*0.3;
    if(k===0)ctx.moveTo(Math.cos(a2)*22,Math.sin(a2)*22);
    else ctx.lineTo(Math.cos(a2)*22,Math.sin(a2)*22);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#0a0d1a";
  ctx.beginPath();ctx.arc(0,0,9+Math.sin(t*4)*1.5,0,6.283);ctx.fill();
  ctx.strokeStyle=coreHp>6?"#74c0fc":"#ff6b6b";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(0,0,34,-Math.PI/2,-Math.PI/2+6.283*Math.max(0,coreHp)/COREHP);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle="#74c0fc";
  for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-2,bullets[i].y-2,4,4);
  ctx.fillStyle="#ff9f43";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    ctx.rotate(Math.atan2(cy-e.y,cx-e.x)+Math.PI/2);
    if(e.gun){
      ctx.fillStyle="#c0456c";
      ctx.fillRect(-13,-11,26,22);
      ctx.fillStyle="#ffd166";ctx.fillRect(-4,-15,8,6);
    }else{
      ctx.fillStyle="#ff6b6b";
      ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(-11,-9);ctx.lineTo(11,-9);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#74c0fc";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  if(state==="play"){
    ctx.font="bold 26px system-ui";ctx.textAlign="center";
    ctx.fillStyle=GOAL-timer<10?"#ff6b6b":"#74c0fc";
    ctx.fillText(Math.max(0,Math.ceil(GOAL-timer))+"s",W/2,44);
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k2=0;k2<stars.length;k2++){
    var st=stars[k2];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hT.textContent=Math.floor(Math.min(timer,GOAL))+"/"+GOAL;
  hC.textContent=Math.max(0,coreHp);
  hS.textContent=score;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

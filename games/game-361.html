<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缩圈节拍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#38bdf8;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#38bdf8;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#38bdf8}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#38bdf8;color:#06222f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>缩圈节拍</h1>
  <p class="hint">光圈收缩到与目标环重合的一瞬点击 · 鼠标 / 触屏 / 空格在指针处点击</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>生命 <b id="life">5</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">缩圈节拍</h2>
      <p id="ovDesc">每两拍刷新一枚光圈,从大圈匀速收缩到目标环上。
在光圈与虚线目标环完全重合的瞬间点击它!
越准分越高,连击有加成;漏掉 5 枚光圈则演出结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elLife=$("life"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,BPM=84,beatInt=60000/BPM;
var TARGET_R=22,START_R=78,HIT_R=40,LEAD=2;
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_g361");

/* ---------- 音频 ---------- */
var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function sPerfect(){tone("triangle",880,1400,0.13,0.25);}
function sGood(){tone("triangle",620,620,0.09,0.2);}
function sMiss(){tone("sawtooth",200,100,0.22,0.18);}
function sTick(){noiseHit(0.05,0.1,6000);}

/* ---------- 状态 ---------- */
var state="menu",rings,pops,score,combo,life,hits,maxCombo,nextBeat,beatNo;
var px=W/2,py=H/2;
function reset(){
  rings=[];pops=[];
  score=0;combo=0;life=5;hits=0;maxCombo=0;beatNo=0;
  nextBeat=performance.now()+1000;
  upd();
}
function start(){
  audio();reset();state="play";
  ov.classList.add("hide");
}
function upd(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elLife.textContent=life;
  elBest.textContent=best;
}
function addPop(x,y,txt,color){pops.push({x:x,y:y,txt:txt,color:color,t0:performance.now(),ring:false});}
function addRingPop(x,y){pops.push({x:x,y:y,txt:"",color:"#38bdf8",t0:performance.now(),ring:true});}

/* ---------- 节拍与判定 ---------- */
function schedule(now){
  if(now-nextBeat>4000)nextBeat=now+400;
  while(now>=nextBeat){
    beatNo++;
    if(beatNo%2===0){
      rings.push({x:70+Math.random()*(W-140),y:90+Math.random()*(H-190),t:nextBeat+beatInt*LEAD,done:false});
    }
    sTick();
    nextBeat+=beatInt;
  }
}
function judge(now,x,y){
  var i,r,dt,d,bi=-1,bd=1e9;
  for(i=0;i<rings.length;i++){
    r=rings[i];if(r.done)continue;
    dt=now-r.t;
    if(dt<-LEAD*beatInt||dt>420)continue;
    d=Math.sqrt((x-r.x)*(x-r.x)+(y-r.y)*(y-r.y));
    if(d>HIT_R)continue;
    if(Math.abs(dt)<Math.abs(bd)){bd=dt;bi=i;}
  }
  if(bi<0)return;
  r=rings[bi];r.done=true;
  hits++;
  if(Math.abs(bd)<=70){
    combo++;if(combo>maxCombo)maxCombo=combo;
    score+=300+combo*10;addPop(r.x,r.y-42,"完美 +"+(300+combo*10),"#fbbf24");sPerfect();
  }else if(Math.abs(bd)<=150){
    combo++;if(combo>maxCombo)maxCombo=combo;
    score+=100+combo*5;addPop(r.x,r.y-42,"不错 +"+(100+combo*5),"#38bdf8");sGood();
  }else{
    combo=0;score+=10;addPop(r.x,r.y-42,"偏了 +10","#8b90b0");sMiss();
  }
  addRingPop(r.x,r.y);
  upd();
}
function gameOver(){
  state="over";
  if(score>best){best=score;saveBest("mg_g361",best);}
  upd();
  ovTitle.textContent="演出落幕";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  ovDesc.textContent="共击破 "+hits+" 枚光圈 · 最高连击 "+maxCombo+"\n准备好就再来一局!";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function update(now){
  var i,r;
  for(i=rings.length-1;i>=0;i--){
    r=rings[i];
    if(r.done){rings.splice(i,1);continue;}
    if(now>r.t+160){
      rings.splice(i,1);
      combo=0;life--;sMiss();
      addPop(r.x,r.y,"错过","#f87171");
      upd();
      if(life<=0){gameOver();return;}
    }
  }
  for(i=pops.length-1;i>=0;i--){if(now-pops[i].t0>620)pops.splice(i,1);}
}

/* ---------- 绘制 ---------- */
function draw(now){
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  var i,k,rad,r,p,pr;
  ctx.strokeStyle="rgba(120,140,200,0.07)";
  for(i=1;i<=4;i++){ctx.beginPath();ctx.arc(W/2,H/2,i*72,0,Math.PI*2);ctx.stroke();}
  for(i=0;i<rings.length;i++){
    r=rings[i];
    k=(r.t-now)/(LEAD*beatInt);
    if(k<0)k=0;if(k>1)k=1;
    rad=TARGET_R+k*(START_R-TARGET_R);
    ctx.setLineDash([5,5]);
    ctx.strokeStyle="rgba(200,220,255,0.3)";
    ctx.beginPath();ctx.arc(r.x,r.y,TARGET_R,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="rgba(56,189,248,0.14)";
    ctx.beginPath();ctx.arc(r.x,r.y,TARGET_R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#38bdf8";ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(r.x,r.y,rad,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=1;
  }
  for(i=0;i<pops.length;i++){
    p=pops[i];pr=(now-p.t0)/620;
    if(p.ring){
      ctx.strokeStyle="rgba(56,189,248,"+(1-pr)*0.8+")";ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,TARGET_R+pr*52,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
    }else{
      ctx.fillStyle=p.color;
      ctx.globalAlpha=1-pr;
      ctx.font="bold 17px system-ui";
      ctx.textAlign="center";
      ctx.fillText(p.txt,p.x,p.y-pr*24);
      ctx.globalAlpha=1;
    }
  }
  ctx.strokeStyle="rgba(200,220,255,0.25)";
  ctx.beginPath();ctx.moveTo(px-10,py);ctx.lineTo(px+10,py);ctx.moveTo(px,py-10);ctx.lineTo(px,py+10);ctx.stroke();
}

/* ---------- 输入 ---------- */
function toXY(cx,cy){
  var rect=cv.getBoundingClientRect();
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
function onTap(cx,cy){
  var p=toXY(cx,cy);px=p.x;py=p.y;
  if(state!=="play")return;
  judge(performance.now(),p.x,p.y);
}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();onTap(e.clientX,e.clientY);});
  cv.addEventListener("pointermove",function(e){var p=toXY(e.clientX,e.clientY);px=p.x;py=p.y;});
}else{
  cv.addEventListener("mousedown",function(e){onTap(e.clientX,e.clientY);});
  cv.addEventListener("mousemove",function(e){var p=toXY(e.clientX,e.clientY);px=p.x;py=p.y;});
  cv.addEventListener("touchstart",function(e){e.preventDefault();var t=e.changedTouches[0];onTap(t.clientX,t.clientY);},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state==="play")judge(performance.now(),px,py);
    else start();
  }
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play"){schedule(now);update(now);}
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

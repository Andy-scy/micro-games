<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拳台霸主</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#1a1426;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>拳台霸主</h1>
<div id="tip">拳击攻防:出拳耗体力,格挡省体力还能减伤 8 成!玩家1:A/D 移动 · W 出拳 · S 格挡 · 玩家2:←/→ 移动 · ↑ 出拳 · ↓ 格挡 · 体力不足打不出重拳,KO 或 60 秒后血多者胜</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">拳台霸主</div><div id="ovS">真拳实脚的实时攻防<br>玩家1:A / D 移动,W 出拳,S 格挡<br>玩家2:← / → 移动,↑ 出拳,↓ 格挡<br>出拳耗 20 体力,被格挡只造成 3 伤害;格挡时回复更快<br>KO 对手或 60 秒结束后血量高者获胜</div><button id="ovB">上台!</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var keys={},st;
function mkB(i){return{x:i===0?240:480,vx:0,hp:100,sta:100,stage:0,t:0,block:false,stun:0,hitDone:true,face:i===0?1:-1,punchReq:false,tired:0};}
function reset(){
 st={ph:"count",cd:70,b:[mkB(0),mkB(1)],t:3600,shake:0,flash:[0,0],msg:"",msgT:0,note:["",""]};
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function reqPunch(i){
 if(st.ph!=="play")return;
 st.b[i].punchReq=true;
}
function updBoxer(i,dt){
 var b=st.b[i],o=st.b[1-i];
 if(st.note[i])st.note[i]="";
 if(b.tired>0)b.tired-=dt;
 if(b.stun>0){
  b.stun-=dt;b.vx=0;
 }else if(b.stage===0){
  var mv=0;
  if(i===0){if(keys["a"])mv--;if(keys["d"])mv++;}
  else{if(keys["arrowleft"])mv--;if(keys["arrowright"])mv++;}
  var bk=i===0?keys["s"]:keys["arrowdown"];
  b.block=bk===true&&mv===0;
  b.vx=b.block?0:mv*3.1;
  if(b.punchReq){
   b.punchReq=false;
   if(b.sta>=18){b.stage=1;b.t=11;b.sta-=20;b.block=false;}
   else b.tired=30;
  }
 }else{
  b.t-=dt;
  if(b.stage===1&&b.t<=0){b.stage=2;b.t=9;b.hitDone=false;}
  else if(b.stage===2&&b.t<=0){b.stage=3;b.t=13;}
  else if(b.stage===3&&b.t<=0)b.stage=0;
 }
 b.sta=Math.min(100,b.sta+(b.block&&b.stage===0?0.42:0.24)*dt);
 b.x+=b.vx*dt;
 if(b.x<60){b.x=60;b.vx=0;}
 if(b.x>660){b.x=660;b.vx=0;}
 b.face=o.x>=b.x?1:-1;
 if(b.stage===2&&!b.hitDone){
  var gx=b.x+b.face*62;
  if(Math.abs(gx-o.x)<30){
   b.hitDone=true;
   if(o.block&&o.stage===0){
    o.hp=Math.max(0,o.hp-3);
    o.x=Math.max(60,Math.min(660,o.x+b.face*14));
    o.sta=Math.max(0,o.sta-8);
    st.flash[1-i]=10;st.note[1-i]="格挡!";
   }else{
    o.hp=Math.max(0,o.hp-13);
    o.stun=12;
    o.x=Math.max(60,Math.min(660,o.x+b.face*22));
    st.flash[1-i]=14;st.shake=8;st.note[1-i]="重击!";
   }
  }
 }
}
function step(dt){
 var i;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.t-=dt;
  if(st.t<=0){
   st.ph="over";
   var h0=st.b[0].hp,h1=st.b[1].hp;
   show(h0===h1?"平局!":(h0>h1?"蓝方拳王!":"橙方拳王!"),"终局血量 "+h0+" : "+h1);
   return;
  }
  for(i=0;i<2;i++)updBoxer(i,dt);
  var a=st.b[0],b2=st.b[1],dp=Math.abs(a.x-b2.x);
  if(dp<52){
   var push=(52-dp)/2,s=a.x<b2.x?-1:1;
   a.x=Math.max(60,Math.min(660,a.x+s*push));
   b2.x=Math.max(60,Math.min(660,b2.x-s*push));
  }
  if(st.shake>0)st.shake-=dt;
  for(i=0;i<2;i++)if(st.flash[i]>0)st.flash[i]-=dt;
  if(st.b[0].hp<=0||st.b[1].hp<=0){
   st.ph="over";
   var w=st.b[0].hp<=0?(st.b[1].hp<=0?-1:1):0;
   if(w===-1)show("双双倒地,平局!","同归于尽的一战");
   else show((w===0?"蓝方":"橙方")+"KO 获胜!","剩余血量 "+st.b[0].hp+" : "+st.b[1].hp);
  }
 }
}
function glove(b,i,face){
 var x,y,r=10;
 if(b.block&&b.stage===0){
  x=b.x+face*24;y=316;
 }else if(b.stage===1){
  x=b.x-face*8;y=330;
 }else if(b.stage===2){
  x=b.x+face*66;y=338;r=13;
 }else if(b.stage===3){
  x=b.x+face*44;y=342;
 }else{
  x=b.x+face*30;y=340;
 }
 ctx.beginPath();ctx.arc(x,y,r,0,6.2832);
 ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";ctx.fill();
 ctx.lineWidth=2;ctx.strokeStyle="#0f1220";ctx.stroke();
 ctx.beginPath();ctx.arc(b.x-face*16,336,9,0,6.2832);
 ctx.fillStyle=i===0?"#2f9c93":"#c98a4a";ctx.fill();
}
function drawBoxer(i){
 var b=st.b[i],face=b.face;
 var col=i===0?"#4fd1c5":"#f6ad55";
 if(st.flash[i]>0){
  ctx.fillStyle="rgba(255,92,122,.45)";
  ctx.beginPath();ctx.arc(b.x,330,52,0,6.2832);ctx.fill();
 }
 ctx.fillStyle=col;
 ctx.fillRect(b.x-17,316,34,64);
 ctx.strokeStyle="#0f1220";ctx.lineWidth=2;ctx.strokeRect(b.x-17,316,34,64);
 ctx.beginPath();ctx.arc(b.x,300,14,0,6.2832);
 ctx.fillStyle=col;ctx.fill();ctx.stroke();
 ctx.fillStyle="#0f1220";
 ctx.beginPath();ctx.arc(b.x+face*5,297,2.5,0,6.2832);ctx.fill();
 if(b.stun>0){
  var k;
  for(k=0;k<3;k++){
   var a=st.t*0.2+k*2.094;
   ctx.fillStyle="#f6c945";
   ctx.beginPath();ctx.arc(b.x+Math.cos(a)*20,272+Math.sin(a)*6,3,0,6.2832);ctx.fill();
  }
 }
 if(b.tired>0){
  ctx.fillStyle="#ff5c7a";ctx.font="bold 13px system-ui";ctx.textAlign="center";
  ctx.fillText("没劲了!",b.x,268);
 }
 if(st.note[i]){
  ctx.fillStyle="#f6c945";ctx.font="bold 15px system-ui";ctx.textAlign="center";
  ctx.fillText(st.note[i],b.x,250);
 }
 glove(b,i,face);
}
function bar(x,w,val,col){
 ctx.fillStyle="#0d1122";ctx.fillRect(x,0,w,0);
 ctx.fillStyle=col;ctx.fillRect(x,0,w*val/100,0);
}
function draw(){
 ctx.clearRect(0,0,720,480);
 ctx.fillStyle="#241c33";ctx.fillRect(0,380,720,100);
 ctx.strokeStyle="#3d3354";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(20,300);ctx.lineTo(700,300);ctx.stroke();
 ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(20,340);ctx.lineTo(700,340);ctx.moveTo(20,380);ctx.lineTo(700,380);ctx.stroke();
 ctx.fillStyle="#3d3354";
 ctx.fillRect(16,270,8,110);ctx.fillRect(696,270,8,110);
 drawBoxer(0);drawBoxer(1);
 var i;
 for(i=0;i<2;i++){
  var b=st.b[i],x=i===0?30:430;
  ctx.fillStyle="#0d1122";ctx.fillRect(x,20,260,16);
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";
  ctx.fillRect(x,20,260*b.hp/100,16);
  ctx.fillStyle="#0d1122";ctx.fillRect(x,40,260,8);
  ctx.fillStyle="#f6c945";
  ctx.fillRect(x,40,260*b.sta/100,8);
  ctx.fillStyle="#e9edf8";ctx.font="bold 13px system-ui";ctx.textAlign="left";ctx.textBaseline="top";
  ctx.fillText((i===0?"玩家1":"玩家2")+" 体力 "+Math.round(b.hp),x,52);
 }
 ctx.fillStyle="#e9edf8";ctx.font="bold 15px system-ui";ctx.textAlign="center";
 ctx.fillText(Math.max(0,Math.ceil(st.t/60))+" 秒",360,24);
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 42px system-ui";
  ctx.fillText("拳台对决!",360,150);
  ctx.font="bold 26px system-ui";
  ctx.fillText(String(Math.ceil(st.cd/24)),360,208);
 }
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 keys[k]=true;
 if(e.repeat)return;
 if(k==="w"||k==="f")reqPunch(0);
 if(k==="arrowup"||k==="k")reqPunch(1);
});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

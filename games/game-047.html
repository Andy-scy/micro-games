<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双人对拍</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;gap:10px}
h1{margin:2px 0;font-size:22px;letter-spacing:4px;color:#34d399}
#wrap{position:relative;width:min(96vw,860px)}
canvas{display:block;width:100%;height:auto;border-radius:14px;background:#141830;box-shadow:0 0 0 1px #262b4a;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,12,26,.86);border-radius:14px;text-align:center;padding:16px}
#overlay.hide{display:none}
#msg{font-size:16px;line-height:2;white-space:pre-line}
#row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{background:#10b981;color:#04281e;border:none;border-radius:10px;padding:10px 26px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>双人对拍</h1>
<div id="wrap">
<canvas id="cv" width="800" height="500"></canvas>
<div id="overlay"><div id="msg"></div><div id="row"></div></div>
</div>
<script>
'use strict';
var W=800,H=500,WIN=7,BASE=5.8;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var overlay=document.getElementById('overlay'),msg=document.getElementById('msg'),row=document.getElementById('row');
var state='menu';
var p1={x:26,y:H/2-55,w:14,h:110,tY:null};
var p2={x:W-40,y:H/2-55,w:14,h:110,tY:null};
var ball={x:W/2,y:H/2,vx:0,vy:0,r:9,speed:BASE};
var s1=0,s2=0,serveT=0,k1={},k2={};

function mkBtn(text,fn){
  var b=document.createElement('button');
  b.className='btn';b.textContent=text;
  b.addEventListener('click',fn);
  row.appendChild(b);
  return b;
}
var bStart=mkBtn('开始对局',function(){start();});
function showMenu(){
  state='menu';
  msg.textContent='同一台设备的双人对决，先得 7 分者胜。\n玩家一（左·蓝）：W / S 键，触屏请按住左半屏滑动\n玩家二（右·粉）：↑ / ↓ 键，触屏请按住右半屏滑动';
  bStart.textContent='开始对局';
  overlay.classList.remove('hide');
}
function start(){
  s1=0;s2=0;k1={};k2={};p1.tY=null;p2.tY=null;
  p1.y=H/2-p1.h/2;p2.y=H/2-p2.h/2;
  serve(Math.random()<0.5?1:-1);
  state='play';
  overlay.classList.add('hide');
}
function serve(dir){
  ball.x=W/2;ball.y=H/2+(Math.random()*160-80);
  ball.speed=BASE;
  var a=Math.random()*0.7-0.35;
  ball.vx=Math.cos(a)*ball.speed*dir;
  ball.vy=Math.sin(a)*ball.speed;
  serveT=50;
}
function endGame(winner){
  state='end';
  msg.textContent=(winner===1?'玩家一获胜！':'玩家二获胜！')+'\n最终比分 '+s1+' : '+s2;
  bStart.textContent='再来一局';
  overlay.classList.remove('hide');
}
function afterPoint(dir){
  if(s1>=WIN){endGame(1);}
  else if(s2>=WIN){endGame(2);}
  else{serve(dir);}
}
function hitPaddle(p,dir){
  if(ball.vx*dir>=0){return;}
  if(ball.x+ball.r<p.x||ball.x-ball.r>p.x+p.w||ball.y+ball.r<p.y||ball.y-ball.r>p.y+p.h){return;}
  var rel=(ball.y-(p.y+p.h/2))/(p.h/2);
  rel=Math.max(-1,Math.min(1,rel));
  var ang=rel*0.95;
  ball.speed=Math.min(11.5,ball.speed+0.25);
  ball.vx=Math.cos(ang)*ball.speed*dir;
  ball.vy=Math.sin(ang)*ball.speed;
  ball.x=dir>0?p.x+p.w+ball.r:p.x-ball.r;
}
function movePad(p,up,down,dt){
  var v=0;
  if(up){v=-1;}else if(down){v=1;}
  if(v!==0){p.tY=null;p.y+=v*6.8*dt;}
  else if(p.tY!==null){p.y+=(p.tY-(p.y+p.h/2))*Math.min(1,0.3*dt);}
  p.y=Math.max(6,Math.min(H-p.h-6,p.y));
}
function update(dt){
  movePad(p1,k1.up,k1.down,dt);
  movePad(p2,k2.up,k2.down,dt);
  if(serveT>0){serveT-=dt;return;}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}
  if(ball.y>H-ball.r){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy);}
  hitPaddle(p1,1);hitPaddle(p2,-1);
  if(ball.x<-30){s2++;afterPoint(-1);}
  else if(ball.x>W+30){s1++;afterPoint(1);}
}
function pad(p,color){ctx.fillStyle=color;ctx.fillRect(p.x,p.y,p.w,p.h);}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(232,234,246,.14)';
  ctx.lineWidth=3;ctx.setLineDash([10,14]);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign='center';
  ctx.font='bold 52px system-ui';
  ctx.fillStyle='rgba(56,189,248,.85)';
  ctx.fillText(s1,W/2-70,68);
  ctx.fillStyle='rgba(244,114,182,.85)';
  ctx.fillText(s2,W/2+70,68);
  ctx.font='14px system-ui';
  ctx.fillStyle='#38bdf8';
  ctx.fillText('玩家一 W/S',120,H-14);
  ctx.fillStyle='#f472b6';
  ctx.fillText('玩家二 ↑/↓',W-120,H-14);
  pad(p1,'#38bdf8');pad(p2,'#f472b6');
  if(serveT>0){
    if(Math.floor(serveT/12)%2===0){
      ctx.fillStyle='#facc15';
      ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    }
    ctx.font='20px system-ui';ctx.fillStyle='#facc15';
    ctx.fillText('准备…',W/2,H/2-46);
  }else{
    ctx.fillStyle='#f8fafc';
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  }
}
var last=0;
function loop(t){
  var dt=Math.min(2.5,Math.max(0.2,(t-last)/16.7));
  last=t;
  if(state==='play'){update(dt);}
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown',function(e){
  if(e.key==='w'||e.key==='W'){k1.up=true;e.preventDefault();}
  else if(e.key==='s'||e.key==='S'){k1.down=true;e.preventDefault();}
  else if(e.key==='ArrowUp'){k2.up=true;e.preventDefault();}
  else if(e.key==='ArrowDown'){k2.down=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='w'||e.key==='W'){k1.up=false;}
  else if(e.key==='s'||e.key==='S'){k1.down=false;}
  else if(e.key==='ArrowUp'){k2.up=false;}
  else if(e.key==='ArrowDown'){k2.down=false;}
});
function ptr(e){
  var r=cv.getBoundingClientRect();
  var i,tx,ty;
  for(i=0;i<e.touches.length;i++){
    tx=(e.touches[i].clientX-r.left)*(W/r.width);
    ty=(e.touches[i].clientY-r.top)*(H/r.height);
    if(tx<W/2){p1.tY=ty;}
    else{p2.tY=ty;}
  }
}
cv.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect();
  var tx=(e.clientX-r.left)*(W/r.width);
  var ty=(e.clientY-r.top)*(H/r.height);
  if(tx<W/2){p1.tY=ty;}
  else{p2.tY=ty;}
});
cv.addEventListener('touchstart',function(e){e.preventDefault();ptr(e);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();ptr(e);},{passive:false});
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角度罗盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#34d399;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#34d399;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.guess{text-align:center;font-size:17px;color:#34d399;font-weight:700;margin:10px 0 8px;min-height:24px}
.ctrl{display:flex;gap:8px}
.ctrl button{flex:1;background:#232949;color:#e8eaf6;border:none;border-radius:10px;padding:12px 0;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.ctrl button:active{transform:scale(.95)}
.ctrl .ok{background:#34d399;color:#06281c;flex:2}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:8px;color:#8b90b0}
.msg.good{color:#4ade80}
.msg.mid{color:#fbbf24}
.msg.badc{color:#f87171}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#34d399}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#34d399;color:#06281c;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>角度罗盘</h1>
  <p class="hint">拖动画面或用微调按钮,让绿针指向虚线灰针的角度 · 共 10 轮,误差越小分越高</p>
  <div class="hud">
    <span>第 <b id="no">1</b>/10 轮</span>
    <span>得分 <b id="score">0</b></span>
    <span>累计误差 <b id="err">0°</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="360" height="300"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">角度罗盘</h2>
      <p id="ovD">灰色虚线是神秘角度,拖动画布(或按微调按钮)旋转你的绿色指针去重合它,再按「锁定」。误差 1° 内拿满分!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始挑战</button>
    </div>
  </div>
  <div class="guess" id="guess">你的角度: 0°</div>
  <div class="ctrl">
    <button data-s="-5">−5°</button>
    <button data-s="-1">−1°</button>
    <button data-s="1">+1°</button>
    <button data-s="5">+5°</button>
    <button data-s="ok" class="ok">锁定</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var elNo=$("no"),elScore=$("score"),elErr=$("err"),elGuess=$("guess"),elMsg=$("msg");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo");
var W=360,H=300,CX=180,CY=150,R=126;
var state="menu",round=1,score=0,errSum=0,target=null,guess=0,drag=false;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pos(ev){
  var rect=cv.getBoundingClientRect();
  var cx=ev.clientX!==undefined?ev.clientX:(ev.touches&&ev.touches[0]?ev.touches[0].clientX:0);
  var cy=ev.clientY!==undefined?ev.clientY:(ev.touches&&ev.touches[0]?ev.touches[0].clientY:0);
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
function angAt(p){
  var a=Math.atan2(-(p.y-CY),p.x-CX)*180/Math.PI;
  return (a+360)%360;
}
function diff(a,b){
  var d=Math.abs(a-b)%360;
  return d>180?360-d:d;
}
function newRound(){
  target=rnd(15,345);
  guess=rnd(0,2)===0?0:180;
  if(diff(guess,target)<20)guess=(target+180)%360;
  setMsg("把绿针转到灰针的位置再锁定","");
  state="aim";
}
function lock(){
  if(state!=="aim")return;
  state="reveal";
  var e=Math.round(diff(guess,target));
  var pts=Math.max(0,100-Math.round(e*2));
  score+=pts;errSum+=e;
  elScore.textContent=score;
  elErr.textContent=errSum+"°";
  var cls=e<=3?"good":(e<=10?"mid":"badc");
  setMsg("实际 "+target+"° · 误差 "+e+"° · +"+pts+" 分",cls);
  round++;
  elNo.textContent=Math.min(round,10);
  if(round>10){
    setTimeout(gameOver,1200);
  }else{
    setTimeout(function(){if(state==="reveal")newRound();},1400);
  }
}
function gameOver(){
  state="over";
  var avg=(errSum/10).toFixed(1);
  ovT.textContent="挑战完成!";
  ovD.textContent="十轮平均误差 "+avg+"°,眼力与心算一样重要。";
  ovS.style.display="block";
  ovS.textContent="总分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  state="playing";round=1;score=0;errSum=0;
  ovS.style.display="none";
  elScore.textContent="0";elErr.textContent="0°";elNo.textContent="1";
  newRound();
  ov.classList.add("hide");
}
function setMsg(t,cls){
  elMsg.textContent=t;
  elMsg.className="msg"+(cls?" "+cls:"");
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var i,a,rad;
  ctx.strokeStyle="rgba(255,255,255,0.08)";
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();
  for(i=0;i<12;i++){
    a=i*30;rad=a*Math.PI/180;
    var x1=CX+Math.cos(rad)*(R-6),y1=CY-Math.sin(rad)*(R-6);
    var x2=CX+Math.cos(rad)*R,y2=CY-Math.sin(rad)*R;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  drawRay(0,"rgba(160,170,200,0.5)",false);
  if(target!==undefined&&target!==null){
    ctx.setLineDash([7,6]);
    drawRay(target,"rgba(160,170,200,0.85)",false);
    ctx.setLineDash([]);
  }
  drawRay(guess,"#34d399",true);
}
function drawRay(deg,color,head){
  var rad=deg*Math.PI/180;
  var ex=CX+Math.cos(rad)*R,ey=CY-Math.sin(rad)*R;
  ctx.strokeStyle=color;
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(CX,CY,6,0,Math.PI*2);ctx.fill();
  if(head){
    var bx=CX+Math.cos(rad)*(R-16),by=CY-Math.sin(rad)*(R-16);
    var lx=CX+Math.cos(rad+2.2)*14,ly=CY-Math.sin(rad+2.2)*14;
    var rx=CX+Math.cos(rad-2.2)*14,ry=CY-Math.sin(rad-2.2)*14;
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(lx,ly);ctx.lineTo(rx,ry);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);ctx.fill();
  }
  ctx.lineWidth=1;
}
function updGuess(){
  elGuess.textContent="你的角度: "+Math.round(guess)+"°";
}
cv.addEventListener("mousedown",function(e){if(state==="aim"){drag=true;guess=angAt(pos(e));updGuess();}});
window.addEventListener("mousemove",function(e){if(drag&&state==="aim"){guess=angAt(pos(e));updGuess();}});
window.addEventListener("mouseup",function(){drag=false;});
cv.addEventListener("touchstart",function(e){if(state==="aim"){e.preventDefault();guess=angAt(pos(e));updGuess();}},{passive:false});
cv.addEventListener("touchmove",function(e){if(drag||state==="aim"){e.preventDefault();drag=true;guess=angAt(pos(e));updGuess();}},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();drag=false;},{passive:false});
document.querySelectorAll(".ctrl button").forEach(function(b){
  b.addEventListener("click",function(){
    var s=b.getAttribute("data-s");
    if(state!=="aim")return;
    if(s==="ok")lock();
    else{guess=(guess+parseInt(s,10)+360)%360;updGuess();}
  });
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
    return;
  }
  if(e.key==="ArrowLeft"){e.preventDefault();guess=(guess-(e.shiftKey?5:1)+360)%360;updGuess();}
  else if(e.key==="ArrowRight"){e.preventDefault();guess=(guess+(e.shiftKey?5:1)+360)%360;updGuess();}
  else if(e.key==="Enter"){e.preventDefault();lock();}
});
function loop(){requestAnimationFrame(loop);draw();}
updGuess();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机关之门</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#38bdf8;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:6px;align-items:center}
.hud b{font-size:16px}
.msg{color:#38bdf8;font-size:13px;min-height:18px;text-align:center;margin-bottom:6px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#38bdf8}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#38bdf8;color:#04283d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>机关之门</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 踩上开关永久开启同色机关门</p>
  <div class="hud">
    <span style="color:#fb923c">橙门 <b id="doorO">闭</b></span>
    <span style="color:#60a5fa">蓝门 <b id="doorB">闭</b></span>
    <span>步数 <b style="color:#38bdf8" id="steps">0</b></span>
    <span>用时 <b style="color:#38bdf8" id="time">0.0s</b></span>
  </div>
  <div class="msg" id="msg"></div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">机关之门</h2>
      <p id="ovDesc">出口被一道蓝色机关门锁死,而蓝开关又被一道橙色机关门挡在死胡同里。踩上开关会永久开启同色的所有门:先找橙色开关,再找蓝色开关,层层解锁,抵达绿色出口!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">推门而入</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
function $(id){return document.getElementById(id);}
var elDoorO=$("doorO"),elDoorB=$("doorB"),elSteps=$("steps"),elTime=$("time"),elMsg=$("msg");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s271");
var state="menu";
var grid,player,exitCell,blueDoors,orangeDoor,blueSwitch,orangeSwitch,blueOpen,orangeOpen,steps,elapsed,pulse,msgT,msgText;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function reach(sx,sy,tx,ty,oOpen,bOpen){
  var vis2=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++)vis2.push(new Array(COLS));
  vis2[sy][sx]=true;
  q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    if(c[0]===tx&&c[1]===ty)return true;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||vis2[ny][nx])continue;
      if(!oOpen&&nx===orangeDoor.x&&ny===orangeDoor.y)continue;
      var bd=false,i2;
      for(i2=0;i2<blueDoors.length;i2++){
        if(blueDoors[i2].x===nx&&blueDoors[i2].y===ny){bd=true;break;}
      }
      if(!bOpen&&bd)continue;
      vis2[ny][nx]=true;
      q.push([nx,ny]);
    }
  }
  return false;
}
function randChannel(minD,dist,exclude){
  var cells=[],x,y,i,j;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]!==0||dist[y][x]<minD)continue;
    var bad=false;
    for(j=0;j<exclude.length;j++){if(exclude[j].x===x&&exclude[j].y===y){bad=true;break;}}
    if(!bad)cells.push({x:x,y:y});
  }
  if(!cells.length)return null;
  return cells[(Math.random()*cells.length)|0];
}
function buildLevel(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]],i,nx,ny;
  blueDoors=[];
  for(i=0;i<4;i++){
    nx=exitCell.x+dirs[i][0];ny=exitCell.y+dirs[i][1];
    if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&grid[ny][nx]===0)blueDoors.push({x:nx,y:ny});
  }
  var dist=bfsDist(1,1);
  blueSwitch=randChannel(8,dist,[exitCell].concat(blueDoors));
  if(!blueSwitch)blueSwitch=randChannel(4,dist,[exitCell].concat(blueDoors));
  var leaves=[],x,y;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]!==0||dist[y][x]<6)continue;
    if(x===exitCell.x&&y===exitCell.y)continue;
    var cnt=0,d2,only=null;
    for(i=0;i<4;i++){
      var ax=x+dirs[i][0],ay=y+dirs[i][1];
      if(ax<0||ay<0||ax>=COLS||ay>=ROWS)continue;
      if(grid[ay][ax]===0){cnt++;only={x:ax,y:ay};}
    }
    if(cnt===1&&only)leaves.push({x:x,y:y,door:only});
  }
  var leaf=null;
  for(i=0;i<leaves.length;i++){
    var L=leaves[i];
    if(L.x===blueSwitch.x&&L.y===blueSwitch.y)continue;
    if(L.door.x===exitCell.x&&L.door.y===exitCell.y)continue;
    var isBlue=false,j;
    for(j=0;j<blueDoors.length;j++)if(blueDoors[j].x===L.door.x&&blueDoors[j].y===L.door.y)isBlue=true;
    if(isBlue)continue;
    leaf=L;break;
  }
  if(!leaf)return false;
  orangeDoor=leaf.door;
  orangeSwitch=randChannel(2,dist,[exitCell,orangeDoor,blueSwitch,leaf].concat(blueDoors));
  if(!orangeSwitch)return false;
  if(!reach(1,1,orangeSwitch.x,orangeSwitch.y,false,false))return false;
  if(!reach(orangeSwitch.x,orangeSwitch.y,blueSwitch.x,blueSwitch.y,true,false))return false;
  if(!reach(blueSwitch.x,blueSwitch.y,exitCell.x,exitCell.y,true,true))return false;
  return true;
}
function bfsDist(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function reset(){
  var tries=0;
  while(!buildLevel()&&tries<30)tries++;
  blueOpen=false;orangeOpen=false;
  steps=0;elapsed=0;pulse=0;msgT=0;
  updateHud();
}
function setMsg(s){msgText=s;msgT=2.4;}
function updateHud(){
  elDoorO.textContent=orangeOpen?"开":"闭";
  elDoorB.textContent=blueOpen?"开":"闭";
  elSteps.textContent=steps;
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  if(!orangeOpen&&nx===orangeDoor.x&&ny===orangeDoor.y)return;
  var i,blocked=false;
  for(i=0;i<blueDoors.length;i++){
    if(!blueOpen&&blueDoors[i].x===nx&&blueDoors[i].y===ny)blocked=true;
  }
  if(blocked)return;
  player.x=nx;player.y=ny;
  steps++;
  if(nx===blueSwitch.x&&ny===blueSwitch.y&&!blueOpen){
    blueOpen=true;setMsg("咔哒!蓝色机关门全部开启!");
  }
  if(nx===orangeSwitch.x&&ny===orangeSwitch.y&&!orangeOpen){
    orangeOpen=true;setMsg("咔哒!橙色机关门开启,蓝开关可以够到了!");
  }
  if(nx===exitCell.x&&ny===exitCell.y){win();return;}
  updateHud();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||steps<best){best=steps;saveBest("mg_s271",best);isNew=true;}
  ovTitle.textContent="机关尽破!";
  ovDesc.textContent=isNew?"新纪录!两道机关门都拦不住你。":"最后一道蓝门缓缓升起,出口的光洒了进来。";
  ovScore.style.display="block";
  ovScore.textContent="用时 "+elapsed.toFixed(1)+"s · 步数 "+steps+" · 最少步纪录 "+(best>0?best:"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#232a4d";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#2c3560";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function drawDoor(d,col,open){
  var x=d.x*CELL,y=d.y*CELL;
  if(open){
    ctx.strokeStyle=col;
    ctx.setLineDash([4,3]);
    ctx.strokeRect(x+3,y+3,CELL-6,CELL-6);
    ctx.setLineDash([]);
  }else{
    ctx.fillStyle=col;
    ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
    ctx.fillStyle="rgba(11,14,26,0.55)";
    ctx.fillRect(x+CELL/2-2,y+6,4,CELL-12);
  }
}
function drawSwitch(s,col,used){
  var cx=s.x*CELL+CELL/2,cy=s.y*CELL+CELL/2;
  var r=used?5:7+Math.sin(pulse*2)*1.5;
  ctx.fillStyle=used?"rgba(148,163,184,0.4)":col;
  if(!used){ctx.shadowColor=col;ctx.shadowBlur=10;}
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=col;
  ctx.strokeRect(cx-9,cy-9,18,18);
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  for(i=0;i<blueDoors.length;i++)drawDoor(blueDoors[i],"#3b82f6",blueOpen);
  drawDoor(orangeDoor,"#fb923c",orangeOpen);
  drawSwitch(orangeSwitch,"#fb923c",orangeOpen);
  drawSwitch(blueSwitch,"#3b82f6",blueOpen);
  var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
  var pr=8+Math.sin(pulse)*2;
  ctx.fillStyle="#4ade80";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle="#e0f2fe";
  ctx.shadowColor="#38bdf8";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(msgT>0){msgT-=dt/1000;elMsg.textContent=msgText;}
  else elMsg.textContent="";
  if(state==="playing"){
    elapsed+=dt/1000;
    elTime.textContent=elapsed.toFixed(1)+"s";
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

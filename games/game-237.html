<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信号弹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#4ade80;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#4ade80;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>信号弹</h1>
  <p class="hint">绿色信号 → 立刻点击 / 空格 · 红色信号 → 忍住别动!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连对 <b id="streak">0</b></span>
    <span>机会 <b id="lives">3</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="320"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">信号弹</h2>
      <p id="ovDesc">屏幕中央会随机闪出两种信号:绿色向上箭头是「行动」指令,必须在窗口期内点击或按空格;红色禁行信号出现时要稳住不动,忍住有奖励,手滑误触扣机会!信号间隔越来越短,考验你的冲动控制力。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=320,KEY="mg_s237",CX=240,CY=150;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elScore=$("score"),elStreak=$("streak"),elLives=$("lives"),elBest=$("best");
var state="menu",score=0,streak=0,good=0,lives=3,signal=null,nextAt=0;
var flashUntil=0,lastT=0;
var best=loadBest(KEY);
function loadBest(k){try{var v=parseInt(localStorage.getItem(k)||"0",10);return v>0?v:0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function windowMs(){return Math.max(480,950-good*22);}
function updateHud(){
  elScore.textContent=score;
  elStreak.textContent=streak;
  elLives.textContent=lives;
  elBest.textContent=best;
}
function endGame(){
  state="over";
  signal=null;
  if(score>best){best=score;saveBest(KEY,best);}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent="成功响应绿色信号 "+good+" 次";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="rgba(59,69,124,0.5)";
  ctx.beginPath();ctx.arc(CX,CY,120,0,Math.PI*2);ctx.stroke();
  if(state==="playing"&&flashUntil>t){
    ctx.fillStyle="rgba(239,68,68,0.18)";
    ctx.fillRect(0,0,W,H);
  }
  if(state!=="playing"||!signal)return;
  var isGo=signal.type==="go";
  var col=isGo?"#4ade80":"#ef4444";
  ctx.fillStyle=col;
  ctx.shadowColor=col;ctx.shadowBlur=24;
  if(isGo){
    ctx.beginPath();
    ctx.moveTo(CX,CY-46);
    ctx.lineTo(CX+40,CY+6);
    ctx.lineTo(CX+16,CY+6);
    ctx.lineTo(CX+16,CY+40);
    ctx.lineTo(CX-16,CY+40);
    ctx.lineTo(CX-16,CY+6);
    ctx.lineTo(CX-40,CY+6);
    ctx.closePath();ctx.fill();
  }else{
    ctx.beginPath();ctx.arc(CX,CY,44,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
  if(isGo){
    var frac=1-(t-signal.born)/windowMs();
    if(frac<0)frac=0;
    ctx.strokeStyle=frac>0.35?"#4ade80":"#f87171";
    ctx.lineWidth=6;
    ctx.beginPath();
    ctx.arc(CX,CY,64,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);
    ctx.stroke();ctx.lineWidth=1;
  }else{
    ctx.fillStyle="#0b0e1a";
    ctx.fillRect(CX-22,CY-6,44,12);
  }
  ctx.fillStyle="#c7cbe8";
  ctx.font="bold 18px system-ui,sans-serif";
  ctx.textAlign="center";
  ctx.fillText(isGo?"点!":"别动!",CX,CY+92);
}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  lastT=t;
  if(state!=="playing")return;
  if(!signal&&t>=nextAt){
    signal={type:Math.random()<0.62?"go":"stop",born:t};
  }
  if(signal){
    if(signal.type==="go"&&t-signal.born>windowMs()){
      signal=null;
      lives--;
      streak=0;
      flashUntil=t+300;
      nextAt=t+420;
      updateHud();
      if(lives<=0){endGame();return;}
    }else if(signal.type==="stop"&&t-signal.born>1100){
      signal=null;
      score+=6;
      nextAt=t+380+Math.random()*300;
      updateHud();
    }
  }
}
function tap(){
  if(state!=="playing")return;
  var t=performance.now();
  if(!signal)return;
  if(signal.type==="go"){
    good++;
    streak++;
    score+=10+Math.min(15,streak);
    signal=null;
    nextAt=t+350+Math.random()*250;
  }else{
    lives--;
    streak=0;
    flashUntil=t+300;
    signal=null;
    nextAt=t+600;
    if(lives<=0){endGame();return;}
  }
  updateHud();
}
cv.addEventListener("mousedown",tap);
cv.addEventListener("touchstart",function(e){e.preventDefault();tap();},{passive:false});
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    if(state!=="playing")startGame();
    else tap();
  }
});
function startGame(){
  score=0;streak=0;good=0;lives=3;signal=null;
  nextAt=performance.now()+700;
  state="playing";
  ov.classList.add("hide");
  updateHud();
}
btnGo.addEventListener("click",startGame);
updateHud();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

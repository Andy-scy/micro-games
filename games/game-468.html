<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空心入网</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fb923c;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fb923c;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fb923c}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#fb923c;color:#331303;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>空心入网</h1>
  <p class="hint">↑↓ 调角度 · 空格蓄力发射 · 拖拽瞄准 · 8 球内拿 10 分,空心球 3 分</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>篮球 <b id="ammo">8</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="400"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">空心入网</h2>
      <p id="ovDesc">把炮弹当篮球投:从篮筐上方钻进网兜才算得分!
不碰筐板直接入网得 3 分,擦筐擦板入网得 2 分。
球会撞篮板、弹筐沿、砸地反弹,进球后篮筐还会挪位置。8 球拿 10 分即获胜。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=400,GY=364,G=0.21;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elAmmo=$("ammo"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var CX=42,PIV=GY-12,R=6;
var best=loadBest("mg_s468");
var state="menu",ang=45,pow=55,charging=false,cd=1;
var ball=null,trail=[],ammo=8,score=0,hoop={x:360,y:100},parts=[],txts=[],settle=0;
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a);}
function spd(p){return 1+p*0.105;}
function rad(d){return d*Math.PI/180;}
function muzzle(){var a=rad(ang);return{x:CX+Math.cos(a)*30,y:PIV-Math.sin(a)*30};}
function rimY(){return hoop.y+64;}
function rimFx(){return hoop.x-46;}
function moveHoop(){
  hoop.x=Math.round(rnd(310,410));
  hoop.y=Math.round(rnd(96,160));
}
function reset(){
  score=0;ammo=8;ball=null;trail=[];parts=[];txts=[];settle=0;
  moveHoop();ang=45;pow=55;charging=false;hud();
}
function hud(){elScore.textContent=score;elAmmo.textContent=ammo;elBest.textContent=best;}
function canFire(){return state==="playing"&&!ball&&ammo>0;}
function fire(){
  if(!canFire())return;
  ammo--;charging=false;
  var m=muzzle(),a=rad(ang),v=spd(pow);
  ball={x:m.x,y:m.y,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,t:0,py:m.y,tb:false,tr:false,rest:0};
  trail=[];hud();
}
function boom(x,y,col,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-2.2,2.2),vy:rnd(-2.8,0.5),l:rnd(16,36),c:col});
}
function floatTxt(x,y,s,col){txts.push({x:x,y:y,s:s,c:col,l:50});}
function tick(){
  var i;
  if(charging&&canFire()){pow+=cd*1.9;if(pow>=100){pow=100;cd=-1;}if(pow<=18){pow=18;cd=1;}}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.l--;if(p.l<=0)parts.splice(i,1);}
  for(i=txts.length-1;i>=0;i--){txts[i].y-=0.6;txts[i].l--;if(txts[i].l<=0)txts.splice(i,1);}
  if(ball){
    var steps=2;
    for(var s=0;s<steps;s++){
      ball.t++;ball.py=ball.y;
      ball.vy+=G;ball.x+=ball.vx;ball.y+=ball.vy;
      var ry=rimY(),fx=rimFx();
      if(ball.py<=ry-6&&ball.y>ry&&ball.vy>0&&ball.x>fx+12&&ball.x<hoop.x-12&&!ball.scored){
        var pts=(ball.tb||ball.tr)?2:3;
        score+=pts;ball.scored=true;
        floatTxt((fx+hoop.x)/2,ry-14,pts===3?"空心 +3":"入网 +2",pts===3?"#fbbf24":"#fb923c");
        boom((fx+hoop.x)/2,ry+8,"#fb923c",14);
        moveHoop();hud();
      }
      if(ball.x+R>hoop.x&&ball.y>hoop.y-2&&ball.y<hoop.y+88&&ball.vx>0){
        ball.x=hoop.x-R;ball.vx=-Math.abs(ball.vx)*0.62;ball.tb=true;
        boom(hoop.x,ball.y,"#e8eaf6",4);
      }
      var rims=[{x:fx+4,y:ry},{x:hoop.x-5,y:ry}];
      for(i=0;i<2;i++){
        var c=rims[i],dx=ball.x-c.x,dy=ball.y-c.y,d=Math.hypot(dx,dy);
        if(d<10&&d>0.001){
          var nx=dx/d,ny=dy/d,vn=ball.vx*nx+ball.vy*ny;
          ball.x=c.x+nx*10;ball.y=c.y+ny*10;
          if(vn<0){ball.vx-=1.55*vn*nx;ball.vy-=1.55*vn*ny;}
          ball.tr=true;
        }
      }
      if(ball.x<R+2){ball.x=R+2;ball.vx=Math.abs(ball.vx)*0.6;}
      if(ball.x>W-R-2){ball.x=W-R-2;ball.vx=-Math.abs(ball.vx)*0.6;}
      if(ball.y>GY-R){
        ball.y=GY-R;
        if(Math.abs(ball.vy)>1){ball.vy=-Math.abs(ball.vy)*0.55;ball.vx*=0.98;}
        else{ball.vy=0;ball.vx*=0.9;}
      }
      trail.push({x:ball.x,y:ball.y});if(trail.length>20)trail.shift();
      if(ball.y>=GY-R-0.5&&Math.abs(ball.vy)<0.2&&Math.abs(ball.vx)<0.25){
        ball.rest++;
        if(ball.rest>36){ball=null;break;}
      }else ball.rest=0;
      if(ball.t>900){ball=null;break;}
    }
  }
  if(state==="playing"&&ammo<=0&&!ball){settle++;if(settle>40)finish();}
}
function finish(){
  state="over";
  var win=score>=10;
  if(score>best){best=score;saveBest("mg_s468",best);}
  ovTitle.textContent=win?"手感火热!":"比赛结束";
  ovDesc.textContent=win?("8 球拿下 "+score+" 分,空心球才是浪漫!"):"最终 "+score+" 分,离 10 分还差一点,瞄准筐口上方再来。";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  hud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawCannon(){
  ctx.fillStyle="#39406b";ctx.fillRect(CX-16,GY-6,32,6);
  ctx.save();ctx.translate(CX,PIV);ctx.rotate(-rad(ang));
  ctx.fillStyle="#8b93c8";rr(-8,-6,34,12,5);ctx.fill();
  ctx.restore();
  ctx.fillStyle="#6a74ad";ctx.beginPath();ctx.arc(CX,PIV,11,Math.PI,0);ctx.fill();
  if(charging){
    ctx.fillStyle="#20263f";rr(CX-40,PIV-92,10,80,5);ctx.fill();
    ctx.fillStyle=pow>80?"#f87171":"#fb923c";
    var bh=80*(pow-18)/82;
    rr(CX-40,PIV-12-bh,10,bh,4);ctx.fill();
  }
}
function preview(){
  var m=muzzle(),a=rad(ang),v=spd(pow);
  var x=m.x,y=m.y,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;
  ctx.fillStyle="rgba(232,234,246,0.35)";
  for(var i=0;i<90;i++){
    vy+=G;x+=vx;y+=vy;
    if(y>GY)break;
    if(i%3===0)ctx.fillRect(x-1.5,y-1.5,3,3);
  }
}
function drawHoop(){
  var ry=rimY(),fx=rimFx();
  ctx.fillStyle="#3a4270";ctx.fillRect(hoop.x+2,hoop.y+84,6,GY-hoop.y-84);
  ctx.fillStyle="#dbe7ff";ctx.fillRect(hoop.x,hoop.y,6,86);
  ctx.strokeStyle="rgba(219,231,255,0.5)";ctx.lineWidth=1;
  for(var i=0;i<5;i++){
    var x1=fx+6+i*8;
    ctx.beginPath();ctx.moveTo(x1,ry+2);ctx.lineTo(x1+3,ry+16);ctx.stroke();
  }
  ctx.strokeStyle="#fb923c";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(fx,ry);ctx.lineTo(hoop.x,ry);ctx.stroke();
  ctx.fillStyle="#fb923c";
  ctx.beginPath();ctx.arc(fx+4,ry,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hoop.x-5,ry,4,0,Math.PI*2);ctx.fill();
}
function draw(){
  var i;
  ctx.fillStyle="#10142a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1b2138";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#2a3154";ctx.fillRect(0,GY,W,3);
  ctx.strokeStyle="rgba(251,146,60,0.12)";ctx.lineWidth=2;
  ctx.strokeRect(fx0()+14,ry0()-46,hoopSpan(),46);
  drawHoop();
  if(canFire())preview();
  drawCannon();
  for(i=0;i<trail.length;i++){ctx.fillStyle="rgba(139,147,200,"+(i/trail.length*0.5)+")";ctx.fillRect(trail[i].x-1.5,trail[i].y-1.5,3,3);}
  if(ball){
    ctx.fillStyle="#e0662f";ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#331303";ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(ball.x,ball.y,R,0.3,2.2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ball.x-R,ball.y);ctx.lineTo(ball.x+R,ball.y);ctx.stroke();
  }
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  for(i=0;i<txts.length;i++){var t=txts[i];ctx.globalAlpha=Math.min(1,t.l/30);ctx.fillStyle=t.c;ctx.font="bold 15px system-ui";ctx.textAlign="center";ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
}
function fx0(){return rimFx();}
function ry0(){return rimY();}
function hoopSpan(){return hoop.x-rimFx()+16;}
var lastT=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing"){acc+=dt;var n=0;while(acc>=16.6&&n<4){acc-=16.6;n++;tick();}if(n===4)acc=0;}
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}return;}
  if(e.key==="ArrowUp"){ang=Math.min(85,ang+2);e.preventDefault();}
  else if(e.key==="ArrowDown"){ang=Math.max(8,ang-2);e.preventDefault();}
  else if(e.key===" "){e.preventDefault();if(!charging&&canFire()){charging=true;pow=18;cd=1;}}
});
document.addEventListener("keyup",function(e){
  if(e.key===" "&&state==="playing"&&charging)fire();
});
var drag=false,dragMoved=false;
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function aimAt(p){
  var dx=p.x-CX,dy=PIV-p.y;
  if(dy<6||dx<2)return;
  ang=Math.max(8,Math.min(85,Math.atan2(dy,dx)*180/Math.PI));
  pow=Math.max(18,Math.min(100,Math.hypot(dx,dy)/2.2));
  dragMoved=true;
}
cv.addEventListener("mousedown",function(e){if(state!=="playing")return;drag=true;dragMoved=false;aimAt(pos(e));e.preventDefault();});
window.addEventListener("mousemove",function(e){if(drag)aimAt(pos(e));});
window.addEventListener("mouseup",function(e){if(drag){drag=false;if(dragMoved&&canFire())fire();}});
cv.addEventListener("touchstart",function(e){if(state!=="playing")return;drag=true;dragMoved=false;aimAt(pos(e.changedTouches[0]));e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",function(e){if(drag)aimAt(pos(e.changedTouches[0]));e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){if(drag){drag=false;if(dragMoved&&canFire())fire();}e.preventDefault();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

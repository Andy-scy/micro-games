<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涂格争霸</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#0d1122;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>涂格争霸</h1>
<div id="tip">滚过之处皆为己色!玩家1:WASD 移动 · 玩家2:方向键移动 · 身体涂过的格子归你,也可以覆盖对方颜色 · 吃到星星可瞬间涂爆周围一圈 · 45 秒后占地多者获胜</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">涂格争霸</div><div id="ovS">自由移动的涂色大战<br>玩家1:WASD 移动 · 玩家2:方向键移动<br>滚过的格子染成己方颜色,可以覆盖对方<br>星星:吃到后瞬间涂爆周围一大圈 · 45 秒后占地多者胜</div><button id="ovB">开始涂色</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var COLS=24,ROWS=16,CS=30;
var keys={},st;
function mkP(i){return{x:i===0?110:610,y:240,vx:0,vy:0};}
function reset(){
 st={ph:"count",cd:60,t:2700,cells:[],cnt:[0,0],p:[mkP(0),mkP(1)],stars:[],time:0};
 var i;
 for(i=0;i<COLS*ROWS;i++)st.cells.push(0);
 for(i=0;i<3;i++)spawnStar();
 paintAt(st.p[0].x,st.p[0].y,1);
 paintAt(st.p[1].x,st.p[1].y,2);
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function paintCell(cx,cy,who){
 if(cx<0||cx>=COLS||cy<0||cy>=ROWS)return;
 var idx=cy*COLS+cx;
 if(st.cells[idx]===who)return;
 if(st.cells[idx]!==0)st.cnt[st.cells[idx]-1]--;
 st.cells[idx]=who;
 st.cnt[who-1]++;
}
function paintAt(x,y,who){
 paintCell(Math.floor(x/CS),Math.floor(y/CS),who);
}
function burst(x,y,who){
 var cx,cy;
 for(cy=0;cy<ROWS;cy++)for(cx=0;cx<COLS;cx++){
  var px=cx*CS+CS/2,py=cy*CS+CS/2;
  if(Math.hypot(px-x,py-y)<85)paintCell(cx,cy,who);
 }
}
function spawnStar(){
 var t=0,x,y,ok;
 while(t<200){
  t++;
  x=CS+Math.random()*(720-2*CS);
  y=CS+Math.random()*(480-2*CS);
  ok=true;
  var i;
  for(i=0;i<2;i++)if(Math.hypot(st.p[i].x-x,st.p[i].y-y)<70)ok=false;
  for(i=0;i<st.stars.length;i++)if(Math.hypot(st.stars[i].x-x,st.stars[i].y-y)<70)ok=false;
  if(ok){st.stars.push({x:x,y:y,respT:0});return;}
 }
}
function moveP(i,dt){
 var p=st.p[i],ix=0,iy=0;
 if(i===0){if(keys["a"])ix--;if(keys["d"])ix++;if(keys["w"])iy--;if(keys["s"])iy++;}
 else{if(keys["arrowleft"])ix--;if(keys["arrowright"])ix++;if(keys["arrowup"])iy--;if(keys["arrowdown"])iy++;}
 p.vx+=(ix*0.5-p.vx*0.2)*dt;p.vy+=(iy*0.5-p.vy*0.2)*dt;
 var v=Math.hypot(p.vx,p.vy);if(v>3.2){p.vx*=3.2/v;p.vy*=3.2/v;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.x<14){p.x=14;p.vx=0;}
 if(p.x>706){p.x=706;p.vx=0;}
 if(p.y<14){p.y=14;p.vy=0;}
 if(p.y>466){p.y=466;p.vy=0;}
}
function step(dt){
 var i,j;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.time+=dt;
  st.t-=dt;
  if(st.t<=0){
   st.ph="over";
   var c0=st.cnt[0],c1=st.cnt[1];
   show(c0===c1?"棋逢对手,平局!":(c0>c1?"蓝方涂遍全场!":"橙方涂遍全场!"),"占地 "+c0+" 格 : "+c1+" 格");
   return;
  }
  for(i=0;i<2;i++){
   moveP(i,dt);
   paintAt(st.p[i].x,st.p[i].y,i+1);
   for(j=st.stars.length-1;j>=0;j--){
    var s=st.stars[j];
    if(s.respT>0){
     s.respT-=dt;
     if(s.respT<=0){st.stars.splice(j,1);spawnStar();}
     continue;
    }
    if(Math.hypot(st.p[i].x-s.x,st.p[i].y-s.y)<24){
     burst(s.x,s.y,i+1);
     s.respT=300;
    }
  }
  }
 }
}
function draw(){
 ctx.clearRect(0,0,720,480);
 var cx,cy;
 for(cy=0;cy<ROWS;cy++)for(cx=0;cx<COLS;cx++){
  var v=st.cells[cy*COLS+cx];
  if(v===1){ctx.fillStyle="rgba(79,209,197,.4)";ctx.fillRect(cx*CS,cy*CS,CS,CS);}
  else if(v===2){ctx.fillStyle="rgba(246,173,85,.4)";ctx.fillRect(cx*CS,cy*CS,CS,CS);}
 }
 ctx.strokeStyle="rgba(255,255,255,.04)";ctx.lineWidth=1;
 var i;
 for(i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,480);ctx.stroke();}
 for(i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(720,i*CS);ctx.stroke();}
 for(i=0;i<st.stars.length;i++){
  var s=st.stars[i];
  if(s.respT>0)continue;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(st.time*0.05);
  ctx.fillStyle="#f6c945";
  ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(9,0);ctx.lineTo(0,12);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();
  ctx.restore();
 }
 for(i=0;i<2;i++){
  var p=st.p[i];
  ctx.beginPath();ctx.arc(p.x,p.y,13,0,6.2832);
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle="#0f1220";ctx.stroke();
 }
 var tot=st.cnt[0]+st.cnt[1];
 ctx.font="bold 15px system-ui";ctx.textBaseline="top";
 ctx.textAlign="left";ctx.fillStyle="#4fd1c5";
 ctx.fillText("蓝方 "+st.cnt[0]+" 格 ("+(tot?Math.round(st.cnt[0]/tot*100):50)+"%)",14,8);
 ctx.textAlign="right";ctx.fillStyle="#f6ad55";
 ctx.fillText((tot?Math.round(st.cnt[1]/tot*100):50)+"%) "+st.cnt[1]+" 格 橙方",706,8);
 ctx.textAlign="center";ctx.fillStyle="#e9edf8";
 ctx.fillText(Math.max(0,Math.ceil(st.t/60))+" 秒",360,8);
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 42px system-ui";
  ctx.fillText("涂起来!",360,180);
  ctx.font="bold 26px system-ui";
  ctx.fillText(String(Math.ceil(st.cd/20)),360,240);
 }
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 keys[k]=true;
});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

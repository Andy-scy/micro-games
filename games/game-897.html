<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻转矿车</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:8px 0 2px;color:#ffd166;letter-spacing:1px}
p.tip{margin:4px 0 10px;font-size:13px;color:#aab0d0;line-height:1.7}
#hud{display:flex;justify-content:space-between;font-size:14px;color:#cfd3ee;margin:0 2px 8px}
#hud b{color:#ffd166}
#stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2c3154;background:#0f1220}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,26,.84);text-align:center;padding:16px}
.hidden{display:none}
.ovBig{font-size:26px;font-weight:bold;color:#ffd166}
#ovTitle{font-size:26px;font-weight:bold;color:#ff5d73}
#ovInfo{font-size:14px;color:#aab0d0}
button{background:#ffd166;color:#141628;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<h1>翻转矿车</h1>
<p class="tip">矿车沿隧道自动飞驰:点按 鼠标 / 触屏 / 任意按键 翻转重力,让矿车吸附到地板或洞顶!地板与洞顶的尖刺轮番出现,还有悬空浮石,撞上即车毁。</p>
<div id="hud"><span>距离:<b id="score">0</b> m</span><span>重力:<b id="gr">向下</b></span><span>最佳:<b id="best">0</b> m</span></div>
<div id="stage">
<canvas id="cv" width="640" height="420"></canvas>
<div id="ovStart" class="overlay"><div class="ovBig">点按翻转重力</div><div style="font-size:13px;color:#aab0d0">吸地板或吸洞顶 · 躲开两面尖刺</div><button id="btnStart">开始游戏</button></div>
<div id="ovOver" class="overlay hidden"><div id="ovTitle">矿车散架了!</div><div id="ovInfo"></div><button id="btnRe">再来一局</button></div>
</div>
</div>
<script>
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var state="ready",tG=0;
var scrollX,speed,dist,score;
var cartX,cartY,vy,gdir,spikes,rocks,nextSpikeX,nextRockX,lastSide,wheels;
var best=0;
function loadBest(k){try{var v=localStorage.getItem(k);return v?(parseInt(v,10)||0):0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
best=loadBest("mg897best");
$("best").textContent=best;

function floorY(x){return H-86+Math.sin(x*0.021)*16;}
function ceilY(x){return 86+Math.sin(x*0.017+2)*14;}
function reset(){
  scrollX=0;speed=165;dist=0;score=0;
  cartX=150;cartY=0;vy=0;gdir=1;
  spikes=[];rocks=[];nextSpikeX=560;nextRockX=900;lastSide=1;wheels=0;
  while(nextSpikeX<W+80)spawnSpike();
  cartY=floorY(cartX)-11;
  updHud();
}
function spawnSpike(){
  var ns=Math.random()<0.78?1-lastSide:lastSide;
  lastSide=ns;
  spikes.push({x:nextSpikeX,side:ns,h:42+Math.random()*24});
  nextSpikeX+=250+Math.random()*230;
}
function spawnRocks(){
  while(nextRockX<scrollX+W+80){
    var y=170+Math.random()*(H-340);
    var ok=true;
    var i;
    for(i=0;i<spikes.length;i++){
      if(Math.abs(spikes[i].x-nextRockX)<100){ok=false;break;}
    }
    if(ok)rocks.push({x:nextRockX,y:y,r:13+Math.random()*5,ph:Math.random()*6.28});
    nextRockX+=520+Math.random()*420;
  }
  for(i=rocks.length-1;i>=0;i--)if(rocks[i].x<scrollX-40)rocks.splice(i,1);
  for(i=spikes.length-1;i>=0;i--)if(spikes[i].x<scrollX-40)spikes.splice(i,1);
}
function updHud(){
  $("score").textContent=score;
  $("gr").textContent=gdir===1?"向下":"向上";
}
function update(dt){
  speed=Math.min(320,165+dist*0.012);
  scrollX+=speed*dt;
  dist+=speed*dt;
  score=Math.floor(dist/10);
  while(nextSpikeX<scrollX+W+80)spawnSpike();
  spawnRocks();
  vy+=920*gdir*dt;
  vy=Math.max(-560,Math.min(560,vy));
  cartY+=vy*dt;
  var f=floorY(cartX),ce=ceilY(cartX);
  if(cartY+11>=f){cartY=f-11;vy=0;}
  if(cartY-11<=ce){cartY=ce+11;vy=0;}
  var i;
  for(i=0;i<spikes.length;i++){
    var s=spikes[i];
    if(Math.abs(s.x-cartX)>14)continue;
    var ff=floorY(s.x),cc2=ceilY(s.x);
    if(s.side===1){
      var tip=ff-s.h;
      if(cartY+10>tip&&cartY-10<ff){die();return;}
    }else{
      var tip2=cc2+s.h;
      if(cartY-10<tip2&&cartY+10>cc2){die();return;}
    }
  }
  for(i=0;i<rocks.length;i++){
    var rk=rocks[i];
    var dx=rk.x-cartX,dy=rk.y-cartY;
    var rr=rk.r+10;
    if(dx*dx+dy*dy<rr*rr){die();return;}
  }
  wheels+=speed*dt*0.05;
  updHud();
}
function die(){
  if(state!=="play")return;
  state="over";
  if(score>best){best=score;saveBest("mg897best",best);$("best").textContent=best;}
  $("ovInfo").textContent="矿车奔驰了 "+score+" m,最佳 "+best+" m";
  $("ovOver").classList.remove("hidden");
}
function start(){reset();state="play";$("ovStart").classList.add("hidden");$("ovOver").classList.add("hidden");}
function act(){
  if(state==="ready"){start();return;}
  if(state==="over")return;
  gdir=-gdir;
}
$("btnStart").addEventListener("click",function(){start();});
$("btnRe").addEventListener("click",function(){start();});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"||e.code==="ArrowDown"||e.code==="KeyS"||e.code==="Enter"){
    e.preventDefault();
    if(!e.repeat)act();
  }
});
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.033,((t-lastT)/1000)||0);lastT=t;
  tG+=dt;
  if(state==="play")update(dt);
  draw();
}
function drawTrack(){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#181328");bg.addColorStop(1,"#0d0a16");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#2b2440";
  ctx.beginPath();ctx.moveTo(0,0);
  for(var x=scrollX-(scrollX%16);x<scrollX+W+16;x+=16){
    var sx=x-scrollX;
    ctx.lineTo(sx,ceilY(x));
  }
  ctx.lineTo(W+16,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0,H);
  for(var x2=scrollX-(scrollX%16);x2<scrollX+W+16;x2+=16){
    var sx2=x2-scrollX;
    ctx.lineTo(sx2,floorY(x2));
  }
  ctx.lineTo(W+16,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#8a7fae";ctx.lineWidth=2.5;
  ctx.beginPath();
  var firstC=true;
  for(var x3=scrollX-(scrollX%16);x3<scrollX+W+16;x3+=16){
    var sx3=x3-scrollX;
    if(firstC){ctx.moveTo(sx3,ceilY(x3));firstC=false;}
    else ctx.lineTo(sx3,ceilY(x3));
  }
  ctx.stroke();
  ctx.beginPath();
  var first=true;
  for(var x4=scrollX-(scrollX%16);x4<scrollX+W+16;x4+=16){
    var sx4=x4-scrollX;
    if(first){ctx.moveTo(sx4,floorY(x4));first=false;}
    else ctx.lineTo(sx4,floorY(x4));
  }
  ctx.stroke();
  ctx.fillStyle="#c9d2ff";
  for(var i=0;i<spikes.length;i++){
    var s=spikes[i];
    var bx=s.x-scrollX;
    if(bx<-30||bx>W+30)continue;
    if(s.side===1){
      var fy=floorY(s.x);
      ctx.beginPath();ctx.moveTo(bx-13,fy+2);ctx.lineTo(bx+13,fy+2);ctx.lineTo(bx,fy-s.h);ctx.closePath();ctx.fill();
    }else{
      var cy2=ceilY(s.x);
      ctx.beginPath();ctx.moveTo(bx-13,cy2-2);ctx.lineTo(bx+13,cy2-2);ctx.lineTo(bx,cy2+s.h);ctx.closePath();ctx.fill();
    }
  }
  ctx.fillStyle="#4a5570";
  for(var j=0;j<rocks.length;j++){
    var rk=rocks[j];
    var rx=rk.x-scrollX;
    if(rx<-30||rx>W+30)continue;
    ctx.beginPath();ctx.arc(rx,rk.y,rk.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#6a7694";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(rx-rk.r*0.5,rk.y-rk.r*0.3);ctx.lineTo(rx+rk.r*0.4,rk.y+rk.r*0.4);ctx.stroke();
  }
}
function drawCart(){
  ctx.save();ctx.translate(cartX,cartY);
  if(gdir===-1)ctx.scale(1,-1);
  ctx.fillStyle="#ffd166";
  ctx.fillRect(-12,-7,24,13);
  ctx.strokeStyle="#b3541e";ctx.lineWidth=2;
  ctx.strokeRect(-12,-7,24,13);
  ctx.fillStyle="#141628";
  ctx.fillRect(-8,-5,6,5);ctx.fillRect(2,-5,6,5);
  ctx.fillStyle="#3d466f";
  var wa=wheels%6.28;
  ctx.beginPath();ctx.arc(-7,8,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(7,8,4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#9aa8ff";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-7-3*Math.cos(wa),8-3*Math.sin(wa));ctx.lineTo(-7+3*Math.cos(wa),8+3*Math.sin(wa));ctx.stroke();
  ctx.beginPath();ctx.moveTo(7-3*Math.cos(wa+1),8-3*Math.sin(wa+1));ctx.lineTo(7+3*Math.cos(wa+1),8+3*Math.sin(wa+1));ctx.stroke();
  ctx.restore();
  ctx.fillStyle=gdir===1?"#67e8f9":"#ff8fab";
  var ay=cartY+(gdir===1?-24:24);
  ctx.beginPath();
  if(gdir===1){ctx.moveTo(cartX-6,ay);ctx.lineTo(cartX+6,ay);ctx.lineTo(cartX,ay+7);}
  else{ctx.moveTo(cartX-6,ay);ctx.lineTo(cartX+6,ay);ctx.lineTo(cartX,ay-7);}
  ctx.closePath();ctx.fill();
}
function draw(){
  drawTrack();
  drawCart();
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>

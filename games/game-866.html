<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>荷叶轻功</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px}
h1{text-align:center;font-size:21px;margin:4px 0}
.tip{text-align:center;color:#8f97c0;font-size:12.5px;line-height:1.6;margin-bottom:8px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:8px}
.hud b{color:#fbbf24}
canvas{display:block;width:100%;max-width:420px;margin:0 auto;background:#181d33;border:1px solid #262d52;border-radius:12px}
.pad{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.pbtn{width:60px;height:42px;border:none;border-radius:10px;background:#2a3157;color:#e8eaf6;font-size:18px;font-family:inherit;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pbtn:active{background:#4f6ef7}
.btnrow{display:flex;justify-content:center;gap:10px;margin-top:8px}
.btn{background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:24px 30px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:8px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>荷叶轻功</h1>
<p class="tip">按住 ↑ 蓄力,松开向前跳 1~3 行(蓄力条越长跳得越远);← → 小幅挪位,↓ 后退。<br>踩过的荷叶 1.5 秒后会沉!只能落在荷叶上,成功登上对岸即过关。</p>
<div class="hud"><span>得分 <b id="sS">0</b></span><span>生命 <b id="sL">3</b></span><span>关卡 <b id="sC">1</b></span></div>
<canvas id="cv" width="420" height="480"></canvas>
<div class="pad">
<button class="pbtn" data-k="left">←</button><button class="pbtn" data-k="up" id="pUp">↑</button><button class="pbtn" data-k="down">↓</button><button class="pbtn" data-k="right">→</button>
</div>
<div class="btnrow"><button class="btn" id="bR">重新开始</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn" id="ovB">开始游戏</button></div></div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var CELL=40,COLS=10,ROWS=12;
var sS=document.getElementById("sS"),sL=document.getElementById("sL"),sC=document.getElementById("sC");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovB=document.getElementById("ovB");
var pads,frog,score,lives,level,deadT,state,gt=0;
var moving=false,fx0=0,fy0=0,fx1=0,fy1=0,mt=0,mdur=0.14;
var charging=false,chargeT=0,curPad=null;
function rnd(a,b){return a+Math.random()*(b-a);}
function irnd(a,b){return Math.floor(rnd(a,b+1));}
function clampC(c){return Math.max(0,Math.min(COLS-1,c));}
function padAt(c,r){var i;for(i=0;i<pads.length;i++)if(pads[i].c===c&&pads[i].r===r)return pads[i];return null;}
function genPads(){
  pads=[];var pc=4,r,i,c,ok;
  for(r=10;r>=1;r--){
    pc=clampC(pc+irnd(-2,2));
    pads.push({c:pc,r:r,sink:-1,gone:false,rt:0});
    for(i=0;i<2;i++){
      c=irnd(0,9);
      if(!padAt(c,r))pads.push({c:c,r:r,sink:-1,gone:false,rt:0});
    }
  }
}
function sinkMax(){return Math.max(0.9,1.5-level*0.05);}
function updHud(){sS.textContent=score;sL.textContent=lives;sC.textContent=level;}
function resetFrog(){frog={c:4,r:11,x:4.5*CELL,y:11*CELL};moving=false;charging=false;curPad=null;}
function reset(){score=0;lives=3;level=1;deadT=0;genPads();resetFrog();updHud();}
function show(t,p,btn){ovT.textContent=t;ovP.textContent=p;ovB.textContent=btn||"再来一局";ov.classList.remove("hide");}
function start(){reset();state="play";ov.classList.add("hide");}
function die(msg){
  deadT=0.7;moving=false;charging=false;curPad=null;lives--;updHud();
  if(lives<=0){state="over";show("游戏结束",msg+" 最终得分 "+score+",到达第 "+level+" 关。");}
}
function beginHop(tc,tr){
  if(tr<0||tr>11||tc<0||tc>9)return;
  if(curPad){curPad.sink=-1;curPad=null;}
  charging=false;
  fx0=frog.x;fy0=frog.y;fx1=(tc+0.5)*CELL;fy1=tr*CELL;
  mdur=0.13+0.045*Math.abs(tr-frog.r);
  mt=0;moving=true;frog.c=tc;frog.r=tr;
}
function arrive(){
  if(frog.r===0){
    score+=200+level*30;level++;
    genPads();resetFrog();updHud();
    return;
  }
  if(frog.r<=10){
    var p=padAt(frog.c,frog.r);
    if(!p||p.gone){die("扑通!落水了。");return;}
    curPad=p;p.sink=sinkMax();
  }
}
function chargeStart(){
  if(state!=="play"||moving||deadT>0||charging)return;
  charging=true;chargeT=0;
}
function chargeFire(){
  if(!charging)return;
  charging=false;
  var power=1+Math.min(2,Math.floor(chargeT/0.4));
  var tr=Math.max(0,frog.r-power);
  if(tr===frog.r)return;
  beginHop(frog.c,tr);
}
function tapHop(d){
  if(state!=="play"||moving||deadT>0)return;
  var c=frog.c,r=frog.r;
  if(d==="left")c--;else if(d==="right")c++;else if(d==="down")r++;
  if(c===frog.c&&r===frog.r)return;
  beginHop(c,r);
}
function update(dt){
  if(state!=="play")return;
  if(deadT>0){deadT-=dt;if(deadT<=0)resetFrog();return;}
  var i;
  for(i=0;i<pads.length;i++){
    var p=pads[i];
    if(p.gone){p.rt-=dt;if(p.rt<=0)p.gone=false;}
  }
  if(charging){
    chargeT=Math.min(1.2,chargeT+dt);
    if(frog.r===0)charging=false;
  }
  if(!moving&&curPad){
    curPad.sink-=dt;
    if(curPad.sink<=0){curPad.gone=true;curPad.rt=3.5;die("荷叶沉了!");return;}
  }
  if(moving){
    mt+=dt/mdur;
    if(mt>=1){mt=1;moving=false;}
    frog.x=fx0+(fx1-fx0)*mt;frog.y=fy0+(fy1-fy0)*mt;
    if(!moving)arrive();
  }
}
function draw(){
  var r,i;
  for(r=0;r<ROWS;r++){
    ctx.fillStyle=r===0?"#1e3b26":(r===11?"#1e3b26":"#16305e");
    ctx.fillRect(0,r*CELL,420,CELL);
  }
  ctx.fillStyle="#274d31";ctx.fillRect(0,0,420,6);ctx.fillRect(0,11*CELL,420,6);
  ctx.strokeStyle="rgba(120,170,255,.14)";ctx.lineWidth=2;
  for(i=0;i<5;i++){
    var wx=((gt*24+i*100)%460)-20;
    ctx.beginPath();ctx.arc(wx,6*CELL+8,8,Math.PI,Math.PI*2);ctx.stroke();
  }
  for(i=0;i<pads.length;i++){
    var p=pads[i];
    if(p.gone)continue;
    var px=(p.c+0.5)*CELL,py=p.r*CELL+20;
    var sc=1,shake=0;
    if(p.sink>0){
      var f=1-p.sink/sinkMax();
      sc=1-f*0.35;
      shake=Math.sin(gt*40)*2.5*f;
    }
    ctx.fillStyle="#3fae5f";
    ctx.beginPath();ctx.arc(px+shake,py,14*sc,0.3,Math.PI*2+0.3);ctx.fill();
    ctx.strokeStyle="#2c8a49";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px+shake,py,14*sc,0.3,Math.PI*2+0.3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+shake,py);ctx.lineTo(px+shake+13*sc,py-6*sc);ctx.stroke();
  }
  if(deadT<=0||Math.floor(gt*12)%2===0){
    ctx.fillStyle="#5ad469";
    ctx.beginPath();ctx.ellipse(frog.x,frog.y+22,12,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#2f7d3f";
    ctx.beginPath();ctx.arc(frog.x-6,frog.y+11,5,0,Math.PI*2);ctx.arc(frog.x+6,frog.y+11,5,0,Math.PI*2);ctx.fill();
  }
  if(charging){
    var w=36*(chargeT/1.2);
    ctx.fillStyle="#0d1730";ctx.fillRect(frog.x-20,frog.y-8,40,7);
    ctx.fillStyle=chargeT>0.8?"#e05656":(chargeT>0.4?"#e8a33d":"#43d17c");
    ctx.fillRect(frog.x-18,frog.y-6.5,w,4);
    ctx.font="10px system-ui";ctx.fillStyle="#aab2dd";ctx.textAlign="center";
    ctx.fillText((1+Math.min(2,Math.floor(chargeT/0.4)))+" 格",frog.x,frog.y-12);
  }
  if(state==="ready"){
    ctx.fillStyle="rgba(7,9,22,.6)";ctx.fillRect(0,150,420,120);
    ctx.fillStyle="#e8eaf6";ctx.font="bold 21px system-ui";ctx.textAlign="center";
    ctx.fillText("点击「开始游戏」起跳",210,196);
    ctx.font="13px system-ui";ctx.fillStyle="#aab2dd";
    ctx.fillText("按住↑蓄力松开跳 1~3 行 · 荷叶会下沉",210,226);
    ctx.fillText("←→ 挪位 · ↓ 后退",210,248);
  }
}
var last=0;
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  if(!(dt>0))dt=0.016;
  gt+=dt;update(dt);draw();
  requestAnimationFrame(loop);
}
var KM={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
window.addEventListener("keydown",function(e){
  var k=KM[e.key];
  if(!k)return;
  e.preventDefault();
  if(k==="up"){if(!e.repeat)chargeStart();}
  else tapHop(k);
});
window.addEventListener("keyup",function(e){
  var k=KM[e.key];
  if(k==="up")chargeFire();
});
var pUp=document.getElementById("pUp");
pUp.addEventListener("pointerdown",function(e){e.preventDefault();chargeStart();});
pUp.addEventListener("pointerup",function(e){e.preventDefault();chargeFire();});
pUp.addEventListener("pointerleave",function(){chargeFire();});
var btns=document.querySelectorAll(".pbtn"),bi;
for(bi=0;bi<btns.length;bi++){
  (function(b){
    var k=b.getAttribute("data-k");
    if(k==="up")return;
    b.addEventListener("pointerdown",function(e){e.preventDefault();tapHop(k);});
  })(btns[bi]);
}
document.getElementById("bR").addEventListener("click",start);
ovB.addEventListener("click",start);
reset();state="ready";
show("荷叶轻功","池塘上一条由荷叶铺成的隐秘小路。按住 ↑ 蓄力,松开跳跃(最多 3 行);踩过的荷叶很快下沉,犹豫就会落水。","开始游戏");
requestAnimationFrame(loop);
</script>
</body>
</html>

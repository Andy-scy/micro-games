<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑洞边界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#b18cff;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#b18cff;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#b18cff;color:#1d1033;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#b18cff;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>黑洞边界</h1>
<p class="tip">←→↑↓/WASD 推进、空格开火。场中央的黑洞会把你的战机、炮弹和敌机一起拽偏——贴进去就会受伤。借引力弹弓作战,拿到 700 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">黑洞边界</h2>
<p id="ovX">战场中央沉睡着一个黑洞:它扭曲所有人的弹道,吞噬靠近的一切。学会借力,在引力边缘狩猎。</p>
<button id="btn">进入边界</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>吞噬<b id="hG">0</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hG=document.getElementById("hG"),hH=document.getElementById("hH");
var GOAL=700;
var state="ready",score=0,hp=3,gulp=0,inv=0,cool=0,t=0,spawn=1;
var ship={x:W/2,y:H-90,vx:0,vy:0};
var hx=W/2,hy=H*0.42;
var bullets=[],ebullets=[],enemies=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<110;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:0});}
function reset(){
  score=0;hp=3;gulp=0;inv=0;cool=0;t=0;spawn=0.8;
  ship.x=W/2;ship.y=H-90;ship.vx=0;ship.vy=0;
  hx=W/2;hy=H*0.42;
  bullets=[];ebullets=[];enemies=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function pull(x,y,scale){
  var dx=hx-x,dy=hy-y;
  var d2=dx*dx+dy*dy;
  var d=Math.sqrt(d2)||1;
  var a=Math.min(260*scale,2600000*scale/(d2+9000));
  return {ax:dx/d*a,ay:dy/d*a,d:d};
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"逃出生天":"坠入深渊";
  ovX.textContent="最终得分:"+score+(win?" · 你在黑洞边缘赚得盆满钵满。":" · 黑洞不收俘虏,下次绕着点走。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;spawn-=dt;
  hx=W/2+Math.sin(t*0.21)*120;
  hy=H*0.42+Math.cos(t*0.17)*70;
  var acc=620;
  var ax=0,ay=0;
  if(keys.ArrowLeft||keys.a)ax-=acc;
  if(keys.ArrowRight||keys.d)ax+=acc;
  if(keys.ArrowUp||keys.w)ay-=acc;
  if(keys.ArrowDown||keys.s)ay+=acc;
  if(pressed){
    var ddx=px-ship.x,ddy=py-ship.y,dd=Math.sqrt(ddx*ddx+ddy*ddy);
    if(dd>10){ax+=ddx/dd*acc;ay+=ddy/dd*acc;}
  }
  var pf=pull(ship.x,ship.y,1);
  ax+=pf.ax;ay+=pf.ay;
  ship.vx+=ax*dt;ship.vy+=ay*dt;
  var fr=Math.pow(0.32,dt);
  ship.vx*=fr;ship.vy*=fr;
  ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
  ship.x=Math.max(16,Math.min(W-16,ship.x));
  ship.y=Math.max(16,Math.min(H-30,ship.y));
  if(pf.d<24&&inv<=0){
    hp--;inv=1.6;gulp++;
    boom(ship.x,ship.y,20,"#b18cff");
    var px2=ship.x-hx,py2=ship.y-hy,pd=Math.sqrt(px2*px2+py2*py2)||1;
    ship.x=hx+px2/pd*80;ship.y=hy+py2/pd*80;
    ship.vx=px2/pd*260;ship.vy=py2/pd*260;
  }
  if((keys[" "]||keys.z||pressed)&&cool<=0){
    cool=0.18;
    var ba=-Math.PI/2;
    if(pressed){
      var adx=px-ship.x,ady=py-ship.y;
      if(adx*adx+ady*ady>100)ba=Math.atan2(ady,adx);
    }
    bullets.push({x:ship.x,y:ship.y-12,vx:Math.cos(ba)*460,vy:Math.sin(ba)*460});
  }
  if(spawn<=0){
    spawn=Math.max(0.6,1.4-score*0.0006);
    enemies.push({x:30+Math.random()*(W-60),y:-26,vy:90+Math.random()*40,vx:(Math.random()-0.5)*40,hp:1,ph:Math.random()*6.283});
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    var b=bullets[bi];
    var pb=pull(b.x,b.y,0.45);
    b.vx+=pb.ax*dt;b.vy+=pb.ay*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    var bd=pull(b.x,b.y,1);
    if(bd.d<20){parts.push({x:b.x,y:b.y,vx:0,vy:0,life:0.3,col:"#b18cff"});bullets.splice(bi,1);continue;}
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    var pe=pull(e.x,e.y,0.6);
    e.vx+=pe.ax*dt;e.vy+=pe.ay*dt;
    e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(pe.d<22){
      gulp++;
      score+=5;
      boom(e.x,e.y,8,"#b18cff");
      enemies.splice(i,1);
      continue;
    }
    if(e.y>H+30||e.x<-40||e.x>W+40){enemies.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<22&&Math.abs(e.y-ship.y)<22){
      enemies.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  for(i=ebullets.length-1;i>=0;i--){
    var eb=ebullets[i];
    eb.x+=eb.vx*dt;eb.y+=eb.vy*dt;eb.life-=dt;
    if(eb.life<=0){ebullets.splice(i,1);continue;}
    if(inv<=0&&Math.abs(eb.x-ship.x)<11&&Math.abs(eb.y-ship.y)<13){
      ebullets.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,12,"#ff6b6b");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      var dx2=bl.x-e2.x,dy2=bl.y-e2.y;
      if(dx2*dx2+dy2*dy2<400){
        bullets.splice(bi,1);
        e2.hp--;
        if(e2.hp<=0){
          boom(e2.x,e2.y,12,"#ffd166");
          score+=20;
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(score>=GOAL)gameOver(true);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    var dx=hx-s.x,dy=hy-s.y;
    var d=Math.sqrt(dx*dx+dy*dy)||1;
    var bend=Math.min(14,900/d);
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillStyle="#8fa3d9";
    ctx.fillRect(s.x+dx/d*bend,s.y+dy/d*bend,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(hx,hy);
  for(i=0;i<3;i++){
    ctx.rotate(t*(0.6+i*0.3));
    ctx.strokeStyle="rgba(177,140,255,"+(0.5-i*0.13)+")";
    ctx.lineWidth=3-i;
    ctx.beginPath();
    ctx.ellipse(0,0,46+i*14,(46+i*14)*0.42,0,0,6.283);
    ctx.stroke();
  }
  ctx.restore();
  var g=ctx.createRadialGradient(hx,hy,4,hx,hy,44);
  g.addColorStop(0,"#000000");
  g.addColorStop(0.75,"#0a0612");
  g.addColorStop(1,"rgba(177,140,255,0.35)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(hx,hy,44,0,6.283);ctx.fill();
  ctx.strokeStyle="rgba(177,140,255,0.5)";
  ctx.setLineDash([5,7]);
  ctx.beginPath();ctx.arc(hx,hy,58,0,6.283);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#b18cff";
  for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-2,bullets[i].y-2,4,4);
  ctx.fillStyle="#ff9f43";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    ctx.rotate(Math.atan2(e.vy,e.vx)+Math.PI/2);
    ctx.fillStyle="#ff6b6b";
    ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(-12,-9);ctx.lineTo(12,-9);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.rotate(Math.atan2(ship.vy,ship.vx)+Math.PI/2);
    ctx.fillStyle="#b18cff";
    ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-12,13);ctx.lineTo(0,6);ctx.lineTo(12,13);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;hG.textContent=gulp;hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

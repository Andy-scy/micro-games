<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巨箱推挤</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#171326;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>巨箱推挤</h1>
<div id="tip">合力掀翻战局:把中间的巨箱推过对手底线!玩家1:WASD 移动 + F 冲刺 · 玩家2:方向键移动 + K 冲刺 · 可以绕到箱子另一侧反推 · 先把箱子推出两边底线 2 次者夺冠</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">巨箱推挤</div><div id="ovS">场地中央有一只沉重的巨箱<br>玩家1:WASD 移动,F 冲刺,把箱子往右推过橙线<br>玩家2:方向键移动,K 冲刺,把箱子往左推过蓝线<br>可以绕到箱子另一侧反推、用身体阻挡对手 · 先胜 2 回合者夺冠</div><button id="ovB">开始推箱</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var keys={},st;
function mkP(i){return{x:i===0?140:580,y:240,vx:0,vy:0,fx:i===0?1:-1,fy:0,dash:0};}
function reset(){
 st={ph:"count",cd:75,score:[0,0],round:1,msg:"",msgT:0,p:[mkP(0),mkP(1)],cr:{x:323,y:203,s:74,vx:0,vy:0}};
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function tryDash(i){
 var p=st.p[i];
 if(st.ph!=="play"||p.dash>0)return;
 p.vx+=p.fx*7.5;p.vy+=p.fy*7.5;p.dash=100;
}
function moveP(i,dt){
 var p=st.p[i],ix=0,iy=0;
 if(i===0){if(keys["a"])ix--;if(keys["d"])ix++;if(keys["w"])iy--;if(keys["s"])iy++;}
 else{if(keys["arrowleft"])ix--;if(keys["arrowright"])ix++;if(keys["arrowup"])iy--;if(keys["arrowdown"])iy++;}
 if(ix!==0||iy!==0){var l=Math.hypot(ix,iy);p.fx=ix/l;p.fy=iy/l;}
 p.vx+=(ix*0.42-p.vx*0.2)*dt;p.vy+=(iy*0.42-p.vy*0.2)*dt;
 var v=Math.hypot(p.vx,p.vy);if(v>3.6){p.vx*=3.6/v;p.vy*=3.6/v;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.x<20){p.x=20;p.vx=0;}
 if(p.x>700){p.x=700;p.vx=0;}
 if(p.y<20){p.y=20;p.vy=0;}
 if(p.y>460){p.y=460;p.vy=0;}
 if(p.dash>0)p.dash-=dt;
}
function hitCrate(p){
 var c=st.cr;
 var cx=Math.max(c.x,Math.min(p.x,c.x+c.s)),cy=Math.max(c.y,Math.min(p.y,c.y+c.s));
 var dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
 if(d<p.r){
  var nx,ny;
  if(d<0.01){nx=0;ny=-1;}else{nx=dx/d;ny=dy/d;}
  var ov=p.r-d;
  p.x+=nx*ov;p.y+=ny*ov;
  var into=p.vx*-nx+p.vy*-ny;
  if(into>0){c.vx+=p.vx*0.85;c.vy+=p.vy*0.85;p.vx*=0.3;p.vy*=0.3;}
 }
}
function step(dt){
 var i;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  for(i=0;i<2;i++){moveP(i,dt);hitCrate(st.p[i]);}
  var a=st.p[0],b=st.p[1],dxp=b.x-a.x,dyp=b.y-a.y,dp=Math.hypot(dxp,dyp);
  if(dp<36&&dp>0.01){
   var nxp=dxp/dp,nyp=dyp/dp,ovp=(36-dp)/2;
   a.x-=nxp*ovp;a.y-=nyp*ovp;b.x+=nxp*ovp;b.y+=nyp*ovp;
  }
  var c=st.cr;
  c.vx*=Math.pow(0.965,dt);c.vy*=Math.pow(0.965,dt);
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  if(c.y<8){c.y=8;c.vy=Math.abs(c.vy)*0.5;}
  if(c.y>472-c.s){c.y=472-c.s;c.vy=-Math.abs(c.vy)*0.5;}
  if(c.x+c.s>=722){
   st.score[0]++;st.ph="rend";st.msgT=100;
   st.msg="巨箱被推出右线,蓝方得分!";
  }else if(c.x<=-2){
   st.score[1]++;st.ph="rend";st.msgT=100;
   st.msg="巨箱被推出左线,橙方得分!";
  }
 }else if(st.ph==="rend"){
  st.msgT-=dt;
  if(st.msgT<=0){
   if(st.score[0]>=2||st.score[1]>=2){
    st.ph="over";
    show(st.score[0]>=2?"蓝方力士!":"橙方力士!","最终比分 "+st.score[0]+" : "+st.score[1]);
   }else{st.round++;reset();}
  }
 }
}
function draw(){
 ctx.clearRect(0,0,720,480);
 ctx.fillStyle="rgba(246,173,85,.14)";ctx.fillRect(0,0,22,480);
 ctx.fillStyle="rgba(79,209,197,.14)";ctx.fillRect(698,0,22,480);
 ctx.fillStyle="#f6ad55";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.save();ctx.translate(11,240);ctx.rotate(-1.5708);ctx.fillText("橙方得分线",0,0);ctx.restore();
 ctx.fillStyle="#4fd1c5";
 ctx.save();ctx.translate(709,240);ctx.rotate(1.5708);ctx.fillText("蓝方得分线",0,0);ctx.restore();
 var c=st.cr;
 ctx.fillStyle="#b98a4e";
 ctx.fillRect(c.x,c.y,c.s,c.s);
 ctx.strokeStyle="#7a5a2a";ctx.lineWidth=3;ctx.strokeRect(c.x,c.y,c.s,c.s);
 ctx.strokeStyle="rgba(122,90,42,.8)";ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(c.x,c.y+c.s/3);ctx.lineTo(c.x+c.s,c.y+c.s/3);
 ctx.moveTo(c.x,c.y+c.s*2/3);ctx.lineTo(c.x+c.s,c.y+c.s*2/3);
 ctx.moveTo(c.x+c.s/3,c.y);ctx.lineTo(c.x+c.s/3,c.y+c.s);
 ctx.moveTo(c.x+c.s*2/3,c.y);ctx.lineTo(c.x+c.s*2/3,c.y+c.s);
 ctx.stroke();
 var i,p;
 for(i=0;i<2;i++){
  p=st.p[i];
  ctx.beginPath();ctx.arc(p.x,p.y,18,0,6.2832);
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle="#0f1220";ctx.stroke();
  ctx.fillStyle="#0f1220";ctx.font="bold 14px system-ui";
  ctx.fillText(i===0?"1":"2",p.x,p.y+1);
  if(p.dash>0){
   ctx.beginPath();ctx.arc(p.x,p.y,24,-1.5708,-1.5708+6.2832*(1-p.dash/100));
   ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2;ctx.stroke();
  }
 }
 ctx.font="bold 16px system-ui";ctx.textBaseline="top";
 ctx.textAlign="left";ctx.fillStyle="#4fd1c5";ctx.fillText("蓝方 "+st.score[0],26,8);
 ctx.textAlign="right";ctx.fillStyle="#f6ad55";ctx.fillText(st.score[1]+" 橙方",694,8);
 ctx.textAlign="center";ctx.fillStyle="#8b93b0";
 ctx.fillText("第 "+st.round+" 回合 · 先胜 2 回合",360,8);
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 40px system-ui";
  ctx.fillText("推动巨箱!",360,180);
  ctx.font="bold 26px system-ui";
  ctx.fillText(String(Math.ceil(st.cd/25)),360,236);
 }
 if(st.ph==="rend"){
  ctx.fillStyle="#f6c945";ctx.font="bold 30px system-ui";
  ctx.fillText(st.msg,360,200);
 }
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 keys[k]=true;
 if((k==="f"||k===" ")&&!e.repeat)tryDash(0);
 if((k==="k"||k==="enter")&&!e.repeat)tryDash(1);
});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

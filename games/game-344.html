<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向回声</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#7dd3fc;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#7dd3fc;font-size:16px}
.gbtn{background:#0c2a3d;color:#7dd3fc;border:1px solid #7dd3fc;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#7dd3fc;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.cross{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.pad{border-radius:14px;background:#12203a;border:2px solid #1e3a5f;cursor:pointer;aspect-ratio:1.15/1;display:flex;align-items:center;justify-content:center;font-size:30px;color:#3b5a80;transition:transform .07s,box-shadow .12s,background .12s,color .12s}
.pad:active{transform:scale(.93)}
.pad.u{grid-column:2;grid-row:1}
.pad.l{grid-column:1;grid-row:2}
.pad.r{grid-column:3;grid-row:2}
.pad.d{grid-column:2;grid-row:3}
.pad.lit{background:#0ea5e9;border-color:#bae6fd;color:#082f49;box-shadow:0 0 26px rgba(14,165,233,.85)}
.cc{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;font-size:13px;color:#2c4a6e;border:1px dashed #1e3a5f;border-radius:14px}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#7dd3fc;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#7dd3fc;color:#0c2a3d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>方向回声</h1>
  <p class="hint">方向版记忆序列:箭头会依次亮起,记住方向顺序后复述。可用方向键、点击箭头,或在十字盘上滑动手指输入。看看你的方向感能撑几轮。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>序列长 <b id="len">0</b></span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="cross" id="cross">
    <div class="pad u" data-i="0">↑</div>
    <div class="pad l" data-i="1">←</div>
    <div class="cc">滑动<br>区域</div>
    <div class="pad r" data-i="2">→</div>
    <div class="pad d" data-i="3">↓</div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">方向回声</h2>
    <p id="ovDesc">上、下、左、右——箭头序列一次亮一步。方向记忆比颜色更考验空间感,手机上还能直接滑动输入,像在画一条看不见的折线。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg344_best",FREQ=[523.25,349.23,440.00,311.13],GAP=620,FLASH=380;
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var pads=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elLen=$("len"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.26;v=v==null?0.15:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var box=$("cross"),list=box.querySelectorAll(".pad");for(var i=0;i<list.length;i++)pads.push(list[i]);})();
function flash(i,ms){var el=pads[i];el.classList.add("lit");tone(FREQ[i]);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||FLASH));}
function clearLit(){for(var i=0;i<4;i++)pads[i].classList.remove("lit");}
function rnd(){var n;do{n=(Math.random()*4)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function updateHud(){elLv.textContent=level;elLen.textContent=seq.length;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";setMsg("箭头依次亮起…");var i=0;(function step(){if(i>=seq.length){state="input";pos=0;setMsg("按方向键 / 点箭头 / 滑动复述!");return;}flash(seq[i]);i++;timers.push(setTimeout(step,GAP));})();}
function nextRound(){seq.push(rnd());updateHud();playSeq();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;level=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,600));}
function winStep(){level++;state="wait";setMsg("通过!序列加长…");updateHud();timers.push(setTimeout(nextRound,800));}
function fail(){clearTimers();clearLit();state="over";tone(98,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="挑战结束";
ovDesc.textContent="方向链在第 "+seq.length+" 步转错了弯。小技巧:把序列想象成一条折线路径,更好记。";
ovScore.style.display="block";ovScore.textContent="成功复述 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flash(i,200);if(seq[pos]===i){pos++;if(pos>=seq.length)winStep();}else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
var tx=0,ty=0,swipeAt=0;
$("cross").addEventListener("touchstart",function(e){if(e.touches.length){tx=e.touches[0].clientX;ty=e.touches[0].clientY;}},{passive:true});
$("cross").addEventListener("touchend",function(e){
var t=e.changedTouches[0];if(!t)return;
var dx=t.clientX-tx,dy=t.clientY-ty;
if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
swipeAt=Date.now();
if(Math.abs(dx)>Math.abs(dy))press(dx>0?2:1);else press(dy>0?3:0);});
$("cross").addEventListener("click",function(e){
if(Date.now()-swipeAt<600)return;
var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
if(e.key==="ArrowUp"){e.preventDefault();press(0);}
else if(e.key==="ArrowLeft"){e.preventDefault();press(1);}
else if(e.key==="ArrowRight"){e.preventDefault();press(2);}
else if(e.key==="ArrowDown"){e.preventDefault();press(3);}});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

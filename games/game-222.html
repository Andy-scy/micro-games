<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九宫速射</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fbbf24;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fbbf24;font-size:16px}
.stage{position:relative}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{position:relative;background:#11152a;border:1px solid #232849;border-radius:12px;aspect-ratio:1;cursor:pointer;overflow:hidden}
.cell:active{background:#171d38}
.mole{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 55%,#b45309);box-shadow:0 0 14px rgba(245,158,11,.5);opacity:0;transform:scale(.4);transition:transform .1s,opacity .1s}
.cell.up .mole{opacity:1;transform:scale(1)}
.cell.hit .mole{background:radial-gradient(circle at 35% 30%,#bbf7d0,#4ade80 55%,#15803d)}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fbbf24}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#fbbf24;color:#3a2503;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>九宫速射</h1>
  <p class="hint">30 秒内点掉九宫格里弹出的目标 · 空点扣 4 分</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>命中 <b id="hit">0</b></span>
    <span>时间 <b id="time">30.0s</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <div id="grid"></div>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">九宫速射</h2>
      <p id="ovDesc">目标会随机在九宫格中弹出并很快缩回,点击它得 10 分!命中越多,目标越多、越快。点空一格扣 4 分,30 秒冲击最高分!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var grid=$("grid"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elScore=$("score"),elHit=$("hit"),elTime=$("time"),elBest=$("best");
var DURATION=30000,KEY="mg_s222";
var state="menu",score=0,hits=0,clicks=0,endAt=0,nextSpawn=0;
var cells=[],active=[];
var best=loadBest(KEY);
function loadBest(k){try{var v=parseInt(localStorage.getItem(k)||"0",10);return v>0?v:0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function buildGrid(){
  var i;
  for(i=0;i<9;i++){
    (function(idx){
      var cell=document.createElement("div");
      cell.className="cell";
      var m=document.createElement("div");
      m.className="mole";
      cell.appendChild(m);
      cell.addEventListener("pointerdown",function(){hitCell(idx);});
      grid.appendChild(cell);
      cells.push(cell);
    })(i);
    active.push(0);
  }
}
function spawn(){
  var empty=[],i;
  for(i=0;i<9;i++){if(!active[i])empty.push(i);}
  if(!empty.length)return;
  var idx=empty[(Math.random()*empty.length)|0];
  var life=Math.max(520,950-hits*14);
  active[idx]=performance.now()+life;
  cells[idx].classList.remove("hit");
  cells[idx].classList.add("up");
}
function hitCell(i){
  if(state!=="playing")return;
  clicks++;
  if(active[i]){
    active[i]=0;
    cells[i].classList.remove("up");
    cells[i].classList.add("hit");
    hits++;
    score+=10;
  }else{
    score-=4;
    if(score<0)score=0;
  }
  updateHud();
}
function updateHud(){elScore.textContent=score;elHit.textContent=hits;elBest.textContent=best;}
function startGame(){
  var i;
  score=0;hits=0;clicks=0;nextSpawn=0;
  for(i=0;i<9;i++){active[i]=0;cells[i].classList.remove("up");cells[i].classList.remove("hit");}
  state="playing";
  endAt=performance.now()+DURATION;
  ov.classList.add("hide");
  updateHud();
}
function endGame(){
  state="over";
  if(score>best){best=score;saveBest(KEY,best);}
  var rate=clicks>0?Math.round(hits/clicks*100):0;
  ovTitle.textContent="时间到!";
  ovDesc.textContent="命中 "+hits+" 个 · 点击 "+clicks+" 次 · 命中率 "+rate+"%";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function loop(t){
  requestAnimationFrame(loop);
  if(state!=="playing")return;
  var i,left=endAt-t;
  if(left<=0){elTime.textContent="0.0s";endGame();return;}
  elTime.textContent=(left/1000).toFixed(1)+"s";
  for(i=0;i<9;i++){
    if(active[i]&&t>active[i]){
      active[i]=0;
      cells[i].classList.remove("up");
    }
  }
  var maxActive=1+Math.floor(hits/7);
  if(maxActive>3)maxActive=3;
  var cur=0;
  for(i=0;i<9;i++){if(active[i])cur++;}
  if(cur<maxActive&&t>=nextSpawn){
    spawn();
    nextSpawn=t+Math.max(300,620-hits*10)+Math.random()*260;
  }
}
buildGrid();
btnGo.addEventListener("click",startGame);
updateHud();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点灯入门</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#38bdf8;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#38bdf8;font-size:16px}
.gbtn{background:#12304a;color:#38bdf8;border:1px solid #38bdf8;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#38bdf8;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:300px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:12px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.on{background:linear-gradient(145deg,#7dd3fc,#0ea5e9);border-color:#bae6fd;box-shadow:0 0 16px rgba(56,189,248,.55)}
.cell.cur{outline:2px solid rgba(56,189,248,.75);outline-offset:2px}
.cell:active{transform:scale(.92)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#38bdf8;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#38bdf8;color:#0b2536;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>点灯入门</h1>
  <p class="hint">点击一盏灯,它与上下左右的灯会一起翻转。把 3×3 棋盘全部点亮即可过关,共 6 关,由浅入深。</p>
  <div class="hud">
    <span>关卡 <b id="lv">1</b>/6</span>
    <span>本关步数 <b id="moves">0</b></span>
    <span>用时 <b id="time">0.0s</b></span>
    <button class="gbtn" id="btnRe">重开本关</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">点灯入门</h2>
    <p id="ovDesc">点灯谜题的新手篇:每关都从「全亮棋盘」打乱而来,所以必然可解。诀窍是多想一步——按下一盏灯会影响谁?方向键移动光标,回车键点亮,也可以直接点击。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始点灯</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=3,CNT=9,DEPTHS=[1,2,2,3,4,5];
var gridEl=$("grid"),elLv=$("lv"),elMoves=$("moves"),elTime=$("time"),elMsg=$("msg"),btnRe=$("btnRe");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],level=1,moves=0,totalMoves=0,elapsed=0,state="menu";
var best=loadNum("mg321_time");

function loadNum(k){try{var v=parseFloat(localStorage.getItem(k)||"");return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;}

function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){
  if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");
}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++){board[list[i]]^=1;paint(list[i]);}
  if(!silent){moves++;totalMoves++;}
}
function allLit(){for(var i=0;i<CNT;i++)if(!board[i])return false;return true;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function newLevel(){
  board=[];for(var i=0;i<CNT;i++)board.push(1);
  moves=0;
  var ps=pickCells(DEPTHS[level-1]),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function updateHud(){
  elLv.textContent=level;elMoves.textContent=moves;
  elTime.textContent=elapsed.toFixed(1)+"s";
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(allLit()){
    if(level<6){
      state="lock";
      setMsg("第 "+level+" 关点亮!准备下一关…");
      setTimeout(function(){level++;newLevel();state="playing";setMsg("第 "+level+" 关,加油!");},900);
    }else win();
  }
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||elapsed<best){best=elapsed;saveNum("mg321_time",best);isNew=true;}
  ovTitle.textContent="六关全亮!";
  ovDesc.textContent=isNew?"新纪录!你以最快用时点亮了全部六关。":"六关棋盘都被你点亮了,已是一本活点灯谱。";
  ovScore.style.display="block";
  ovScore.textContent="总用时 "+elapsed.toFixed(1)+"s · 总步数 "+totalMoves;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){
  level=1;totalMoves=0;elapsed=0;state="playing";
  newLevel();ov.classList.add("hide");
  setMsg("第 1 关:只需一步,找到它!");
}
var cur=-1;
function setCur(i){
  if(cur>=0)cells[cur].classList.remove("cur");
  cur=i;
  if(cur>=0)cells[cur].classList.add("cur");
}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();if(state!=="lock")start();}
    return;
  }
  if(cur<0){setCur(4);}
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnRe.addEventListener("click",function(){
  if(state==="menu"||state==="lock")return;
  state="playing";newLevel();setMsg("本关已重置");
});
build();
board=[];for(var z=0;z<CNT;z++)board.push(1);
var ps0=pickCells(3),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=t-lastT;lastT=t;
  if(state==="playing"){elapsed+=dt/1000;elTime.textContent=elapsed.toFixed(1)+"s";}
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

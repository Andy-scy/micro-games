<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深水潜艇</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:8px 0 2px;color:#67e8f9;letter-spacing:1px}
p.tip{margin:4px 0 10px;font-size:13px;color:#aab0d0;line-height:1.7}
#hud{display:flex;justify-content:space-between;font-size:14px;color:#cfd3ee;margin:0 2px 8px}
#hud b{color:#67e8f9}
#stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2c3154;background:#0f1220}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,26,.84);text-align:center;padding:16px}
.hidden{display:none}
.ovBig{font-size:26px;font-weight:bold;color:#67e8f9}
#ovTitle{font-size:26px;font-weight:bold;color:#ff5d73}
#ovInfo{font-size:14px;color:#aab0d0}
button{background:#67e8f9;color:#141628;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<h1>深水潜艇</h1>
<p class="tip">潜艇可上可下:↑ / W / 空格(或按住屏幕上半边)向上推进,↓ / S(或按住下半边)向下推进。艇身沉重、惯性大,松开才会慢慢停;还可上下双向推进绕开水雷,撞壁或触雷即沉。</p>
<div id="hud"><span>航程:<b id="score">0</b> m</span><span>最佳:<b id="best">0</b> m</span></div>
<div id="stage">
<canvas id="cv" width="640" height="420"></canvas>
<div id="ovStart" class="overlay"><div class="ovBig">下潜开始</div><div style="font-size:13px;color:#aab0d0">上下双向推进 · 惯性沉重 · 小心水雷</div><button id="btnStart">开始游戏</button></div>
<div id="ovOver" class="overlay hidden"><div id="ovTitle">潜艇沉没了!</div><div id="ovInfo"></div><button id="btnRe">再来一局</button></div>
</div>
</div>
<script>
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var COL=8;
var state="ready",tG=0;
var keyU,keyD,ptrU,ptrD;
var scrollX,speed,dist,py,vy,cols,genX,bubs,score;
var mines,nextMineX;
var best=0;
function loadBest(k){try{var v=localStorage.getItem(k);return v?(parseInt(v,10)||0):0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
best=loadBest("mg888best");
$("best").textContent=best;

function reset(){
  scrollX=0;speed=130;dist=0;score=0;
  py=H/2;vy=0;cols=[];genX=-48;bubs=[];
  mines=[];nextMineX=620;
  keyU=false;keyD=false;ptrU=false;ptrD=false;
  while(genX<W+96){pushCol();}
  updHud();
}
function terrainC(x){
  return H/2+Math.sin(x*0.0042)*58+Math.sin(x*0.0117+1.3)*30+Math.sin(x*0.031+4.1)*10;
}
function gapAt(x){return 178+Math.sin(x*0.006+2.0)*18;}
function pushCol(){
  var g=gapAt(genX),c=terrainC(genX);
  var m=g/2+26;
  c=Math.max(m,Math.min(H-m,c));
  cols.push({x:genX,t:c-g/2,b:c+g/2});
  genX+=COL;
}
function colAt(x){
  if(!cols.length)return{t:0,b:H};
  var i=Math.floor((x-cols[0].x)/COL);
  if(i<0)i=0;if(i>cols.length-2)i=cols.length-2;
  return cols[i];
}
function pX(){return scrollX+150;}
function updHud(){$("score").textContent=score;}
function spawnMines(){
  while(nextMineX<scrollX+W+40){
    var c=colAt(nextMineX);
    var y=c.t+40+Math.random()*(c.b-c.t-80);
    mines.push({x:nextMineX,y:y,ph:Math.random()*6.28});
    nextMineX+=380+Math.random()*320;
  }
  var i;
  for(i=mines.length-1;i>=0;i--)if(mines[i].x<scrollX-40)mines.splice(i,1);
}
function update(dt){
  speed=Math.min(250,130+dist*0.008);
  scrollX+=speed*dt;
  dist+=speed*dt;
  score=Math.floor(dist/10);
  while(genX<scrollX+W+96)pushCol();
  while(cols.length>2&&cols[0].x+COL<scrollX-64)cols.shift();
  spawnMines();
  var up=keyU||ptrU,down=keyD||ptrD;
  vy+=((up?-235:0)+(down?235:0))*dt;
  vy*=Math.max(0,1-1.3*dt);
  vy=Math.max(-175,Math.min(175,vy));
  py+=vy*dt;
  if(py<12){py=12;vy=Math.max(vy,0);}
  if(py>H-12){py=H-12;vy=Math.min(vy,0);}
  var c=colAt(pX());
  if(py-10<c.t||py+10>c.b){die("潜艇撞上了洞壁!");return;}
  var i;
  for(i=0;i<mines.length;i++){
    var mn=mines[i];
    var dx=mn.x-pX(),dy=mn.y-py;
    if(dx*dx+dy*dy<576){die("触发了一枚深水水雷!");return;}
  }
  if(Math.random()<0.4)bubs.push({x:118+Math.random()*8,y:py+(Math.random()-0.5)*8,vy:-30-Math.random()*30,life:1.2});
  for(i=bubs.length-1;i>=0;i--){var b=bubs[i];b.life-=dt;b.x-=speed*dt;b.y+=b.vy*dt;b.x+=Math.sin(tG*6+b.y*0.1)*0.6;if(b.life<=0)bubs.splice(i,1);}
  updHud();
}
function die(msg){
  if(state!=="play")return;
  state="over";
  if(score>best){best=score;saveBest("mg888best",best);$("best").textContent=best;}
  $("ovInfo").textContent=msg+" 本次航程 "+score+" m,最佳 "+best+" m";
  $("ovOver").classList.remove("hidden");
}
function start(){reset();state="play";$("ovStart").classList.add("hidden");$("ovOver").classList.add("hidden");}
function ptrHalf(e){
  var r=cv.getBoundingClientRect();
  return (e.clientY-r.top)/r.height<0.55;
}
function press(e){
  if(state==="ready"){start();return;}
  if(state!=="play")return;
  if(ptrHalf(e))ptrU=true;else ptrD=true;
}
function release(){ptrU=false;ptrD=false;}
$("btnStart").addEventListener("click",function(){start();});
$("btnRe").addEventListener("click",function(){start();});
cv.addEventListener("mousedown",function(e){e.preventDefault();press(e);});
window.addEventListener("mouseup",release);
cv.addEventListener("touchstart",function(e){e.preventDefault();press(e.touches[0]);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();if(state==="play"){ptrU=false;ptrD=false;if(ptrHalf(e.touches[0]))ptrU=true;else ptrD=true;}},{passive:false});
window.addEventListener("touchend",release);
window.addEventListener("touchcancel",release);
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();if(state==="ready")start();keyU=true;}
  if(e.code==="ArrowDown"||e.code==="KeyS"){e.preventDefault();if(state==="ready")start();keyD=true;}
});
window.addEventListener("keyup",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")keyU=false;
  if(e.code==="ArrowDown"||e.code==="KeyS")keyD=false;
});
window.addEventListener("blur",function(){keyU=false;keyD=false;ptrU=false;ptrD=false;});
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.033,((t-lastT)/1000)||0);lastT=t;
  tG+=dt;
  if(state==="play")update(dt);
  draw();
}
function drawBg(){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#0a2233");bg.addColorStop(1,"#051019");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(103,232,249,0.10)";ctx.lineWidth=1;
  for(var yy=(tG*24)%56-56;yy<H;yy+=56){
    ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
  }
}
function drawCave(){
  if(cols.length<2)return;
  var i0=0;
  while(i0<cols.length-1&&cols[i0].x+COL<scrollX-16)i0++;
  var last=cols.length-1;
  var ex=Math.min(W+16,cols[last].x-scrollX);
  ctx.fillStyle="#14324a";
  ctx.beginPath();ctx.moveTo(cols[i0].x-scrollX,0);
  for(var i=i0;i<cols.length&&cols[i].x<scrollX+W+16;i++)ctx.lineTo(cols[i].x-scrollX,cols[i].t);
  ctx.lineTo(ex,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cols[i0].x-scrollX,H);
  for(var j=i0;j<cols.length&&cols[j].x<scrollX+W+16;j++)ctx.lineTo(cols[j].x-scrollX,cols[j].b);
  ctx.lineTo(ex,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#3f7d9e";ctx.lineWidth=3;
  ctx.beginPath();var st=false;
  for(var k=i0;k<cols.length&&cols[k].x<scrollX+W+16;k++){var sx=cols[k].x-scrollX;if(!st){ctx.moveTo(sx,cols[k].t);st=true;}else ctx.lineTo(sx,cols[k].t);}
  ctx.stroke();
  ctx.beginPath();st=false;
  for(var k2=i0;k2<cols.length&&cols[k2].x<scrollX+W+16;k2++){var sx2=cols[k2].x-scrollX;if(!st){ctx.moveTo(sx2,cols[k2].b);st=true;}else ctx.lineTo(sx2,cols[k2].b);}
  ctx.stroke();
}
function drawMines(){
  var i;
  for(i=0;i<mines.length;i++){
    var mn=mines[i];
    if(mn.x<scrollX-20||mn.x>scrollX+W+20)continue;
    var sx=mn.x-scrollX,sy=mn.y;
    ctx.strokeStyle="#4a5570";ctx.lineWidth=2.5;
    for(var a=0;a<8;a++){
      var ang=a*Math.PI/4+0.4;
      ctx.beginPath();ctx.moveTo(sx+Math.cos(ang)*11,sy+Math.sin(ang)*11);ctx.lineTo(sx+Math.cos(ang)*16,sy+Math.sin(ang)*16);ctx.stroke();
    }
    ctx.fillStyle="#2a2f4a";
    ctx.beginPath();ctx.arc(sx,sy,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=Math.sin(tG*6+mn.ph)>0?"#ff5d73":"#7a2233";
    ctx.beginPath();ctx.arc(sx,sy,3.5,0,Math.PI*2);ctx.fill();
  }
}
function drawSub(){
  ctx.save();ctx.translate(150,py);
  ctx.rotate(Math.max(-0.35,Math.min(0.35,vy*0.0022)));
  ctx.fillStyle="rgba(190,240,255,0.5)";
  for(var i=0;i<bubs.length;i++){var b=bubs[i];ctx.globalAlpha=Math.max(0,b.life*0.6);ctx.beginPath();ctx.arc(b.x-150,b.y-py,2.2,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle="#2f7f9e";
  var spin=Math.sin(tG*16)*4;
  ctx.fillRect(6-spin*0.4,-2,5+spin,4);
  var g=ctx.createLinearGradient(0,-10,0,10);
  g.addColorStop(0,"#8fe3f7");g.addColorStop(1,"#2a8ca8");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(0,0,17,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#1d5c70";
  ctx.beginPath();ctx.moveTo(-6,-8);ctx.lineTo(-1,-14);ctx.lineTo(3,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle="#0f1220";
  ctx.beginPath();ctx.arc(6,0,3.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffd166";
  ctx.beginPath();ctx.arc(6,0,1.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function draw(){
  drawBg();
  drawCave();
  drawMines();
  drawSub();
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>

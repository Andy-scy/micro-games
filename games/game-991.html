<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水墨晕染笺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#94a3b8;text-align:center;letter-spacing:2px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin:4px 0 8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fbbf24;font-size:15px}
.ctl{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.ctl button{background:#232946;color:#c7cbe8;border:1px solid #2f3a5e;border-radius:8px;padding:5px 14px;cursor:pointer;font-family:inherit;font-size:12px}
.ctl button.sel{background:#94a3b8;color:#0f172a;border-color:#94a3b8;font-weight:700}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#cbd5e1}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay button{margin-top:4px;background:#cbd5e1;color:#0f172a;border:none;border-radius:10px;padding:11px 30px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>水墨晕染笺</h1>
  <p class="hint">点笺落墨,墨团自行晕开 · 完成三张画意订单即圆满 · 过密可重笺</p>
  <div class="hud">
    <span>订单 <b id="hOrder">—</b></span>
    <span>晕染 <b id="hCov">0%</b></span>
    <span>滴数 <b id="hDrops">0</b></span>
  </div>
  <div class="ctl">
    <button id="bDark" class="sel">浓墨</button>
    <button id="bLight">淡墨</button>
    <button id="bClear">重笺</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="470" height="300"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">水墨晕染笺</h2>
      <p id="ovD"></p>
      <button id="btnGo">铺纸研墨</button>
      <button id="btnMore" style="display:none">自由挥洒</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var hOrder=$("hOrder"),hCov=$("hCov"),hDrops=$("hDrops");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),btnGo=$("btnGo"),btnMore=$("btnMore");
var W=470,H=300;
var off=document.createElement("canvas");off.width=W;off.height=H;
var octx=off.getContext("2d");
var GC=47,GR=30;
var cov=new Float32Array(GC*GR);
var drops=[],nDrops=0,oi=0,inkA=1,washT=0,state="menu",goalDone=false;
var ORDERS=[
 {n:"疏影",c:0.4,d:8},
 {n:"烟雨",c:0.62,d:18},
 {n:"泼墨山远",c:0.85,d:32}];
var noise=[];
function sr(n){var x=Math.sin(n*77.7+13.3)*3571.3453;return x-Math.floor(x);}
for(var i=0;i<420;i++)noise.push({x:sr(i*2+1)*W,y:sr(i*2+2)*H,a:sr(i*2+3)});
function orderText(){
  var o=ORDERS[oi];
  return o.n+" · 晕染"+Math.round(o.c*100)+"% · ≤"+o.d+"滴";
}
function covPct(){
  var c=0,i2;
  for(i2=0;i2<cov.length;i2++)if(cov[i2]>0.12)c++;
  return c/(GC*GR);
}
function stampDrop(d){
  var t=d.t,rad=5+(d.max-5)*(1-Math.pow(1-t,2)),k;
  for(k=0;k<10;k++){
    var a=Math.random()*6.28318,rr=rad*Math.sqrt(Math.random());
    var px=d.x+Math.cos(a)*rr,py=d.y+Math.sin(a)*rr;
    octx.fillStyle="rgba(30,42,58,"+((0.10+0.10*(1-t))*inkA).toFixed(3)+")";
    octx.beginPath();octx.arc(px,py,2+Math.random()*4,0,6.28318);octx.fill();
  }
  var c0=Math.max(0,Math.floor((d.x-rad)/10)),c1=Math.min(GC-1,Math.floor((d.x+rad)/10));
  var r0=Math.max(0,Math.floor((d.y-rad)/10)),r1=Math.min(GR-1,Math.floor((d.y+rad)/10));
  var cc,rr2;
  for(rr2=r0;rr2<=r1;rr2++)for(cc=c0;cc<=c1;cc++){
    var cx=cc*10+5-c.x,cy=rr2*10+5-d.y;
    if(cx*cx+cy*cy<rad*rad){
      var k2=rr2*GC+cc;
      cov[k2]=Math.min(1.5,cov[k2]+0.22*inkA);
    }
  }
}
function step(dt){
  var i;
  for(i=drops.length-1;i>=0;i--){var d=drops[i];
    d.t+=dt/1.7;
    stampDrop(d);
    if(d.t>=1){
      drops.splice(i,1);
      orderCheck();
    }
  }
  if(washT>0){
    washT-=dt;
    octx.fillStyle="rgba(236,227,207,.12)";
    octx.fillRect(0,0,W,H);
    if(washT<=0){
      octx.clearRect(0,0,W,H);
      for(i=0;i<cov.length;i++)cov[i]=0;
      drops=[];nDrops=0;hDrops.textContent="0";
    }
  }
  hCov.textContent=Math.round(covPct()*100)+"%";
  for(i=fxList.length-1;i>=0;i--){fxList[i].t-=0.012;
    if(fxList[i].t<=0)fxList.splice(i,1);}
}
var fxList=[];
function addFx(x,y,txt,col){fxList.push({x:x,y:y,txt:txt,col:col||"#fbbf24",t:1});}
function orderCheck(){
  if(oi>=ORDERS.length||washT>0)return;
  var o=ORDERS[oi],pc=covPct();
  if(pc>=o.c&&nDrops<=o.d){
    oi++;addFx(W/2,70,"「"+o.n+"」画成!","#94a3b8");
    if(oi>=ORDERS.length){
      if(!goalDone){
        goalDone=true;state="zen";
        ovT.textContent="墨韵圆满";
        ovD.textContent="疏影、烟雨、泼墨山远,三笺皆成。\n浓淡由心,留白由意。\n此笺已尽,可自由挥洒。";
        btnMore.style.display="inline-block";
        ov.classList.remove("hide");
      }
    }else{
      hOrder.textContent=orderText();
      washT=0.9;
    }
  }else if(nDrops>o.d){
    addFx(W/2,70,"墨已过密 · 可重笺","#f87171");
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#ece3cf";ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<noise.length;i++){var n=noise[i];
    ctx.fillStyle="rgba(120,105,80,"+(n.a*0.08).toFixed(3)+")";
    ctx.fillRect(n.x,n.y,1.5,1.5);}
  ctx.drawImage(off,0,0);
  for(i=0;i<drops.length;i++){var d=drops[i];
    var rad=5+(d.max-5)*(1-Math.pow(1-d.t,2));
    ctx.strokeStyle="rgba(30,42,58,.25)";ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(d.x,d.y,rad,0,6.28318);ctx.stroke();}
  for(i=fxList.length-1;i>=0;i--){var f=fxList[i];
    ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.col;
    ctx.font="bold 13px system-ui";ctx.textAlign="center";
    ctx.fillText(f.txt,f.x,f.y-(1-f.t)*26);ctx.globalAlpha=1;}
}
cv.addEventListener("click",function(e){
  if(state!=="play"||washT>0)return;
  var rc=cv.getBoundingClientRect();
  var x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;
  drops.push({x:x,y:y,max:40+Math.random()*18,t:0});
  nDrops++;hDrops.textContent=nDrops;
});
$("bDark").addEventListener("click",function(){inkA=1.4;$("bDark").className="sel";$("bLight").className="";});
$("bLight").addEventListener("click",function(){inkA=0.7;$("bLight").className="sel";$("bDark").className="";});
$("bClear").addEventListener("click",function(){
  if(state!=="play")return;
  octx.clearRect(0,0,W,H);
  for(var i2=0;i2<cov.length;i2++)cov[i2]=0;
  drops=[];nDrops=0;hDrops.textContent="0";
});
var lastT=0;
function loop(t){requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(state==="play")step(dt);
  draw();
}
function showMenu(){
  ovT.textContent="水墨晕染笺";
  ovD.textContent="净笺一张,点按落墨,墨团会自行晕开洇散。\n依订单作画:如「疏影 · 晕染40% · ≤8滴」,\n达成即换新笺。三张画意订单完成,墨韵圆满。\n浓淡可调,过密可重笺。";
  btnGo.textContent="铺纸研墨";btnMore.style.display="none";
  ov.classList.remove("hide");
}
btnGo.addEventListener("click",function(){
  hOrder.textContent=orderText();
  state="play";ov.classList.add("hide");
});
btnMore.addEventListener("click",function(){state="play";ov.classList.add("hide");});
showMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炮台对决</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f87171;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f87171;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f87171}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f87171;color:#3d0a0a;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>炮台对决</h1>
  <p class="hint">↑↓ 调角度 · 空格蓄力发射 · 拖拽瞄准 · 你一炮我一炮,炸到对方 0 血</p>
  <div class="hud">
    <span>我方 <b id="php">100</b></span>
    <span>敌军 <b id="ehp">100</b></span>
    <span>回合 <b id="turn">我方</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="380"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">炮台对决</h2>
      <p id="ovDesc">峡谷两侧各架一门炮,轮流开火,炮弹落地即炸出一片火海。
直接命中 30+ 伤害,近失也掉血,风况每回合都会变!
把敌炮血量轰到 0 即获胜,剩余血量换算成得分。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=380,GY=344,G=0.21;
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elPhp=$("php"),elEhp=$("ehp"),elTurn=$("turn"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var PX=42,EX=438,PIV=GY-12;
var best=loadBest("mg_s472");
var state="menu",ang=45,pow=55,charging=false,cd=1;
var php=100,ehp=100,phase="aim",ball=null,trail=[],wx=0,expls=[],enemyTimer=0,enemyAng=45,parts=[],lastOwner=null;
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a);}
function spd(p){return 1+p*0.105;}
function rad(d){return d*Math.PI/180;}
function muzzle(x,a2){var a=rad(a2);return{x:x+Math.cos(a)*30,y:PIV-Math.sin(a)*30};}
function landDist(a2,p){
  var a=rad(a2),v=spd(p),vx=Math.cos(a)*v,vy=-Math.sin(a)*v;
  var t=(vy+Math.sqrt(vy*vy+2*G*(GY-PIV)))/G;
  return vx*t;
}
function newWind(){wx=rnd(-0.012,0.012);}
function reset(){
  php=100;ehp=100;phase="aim";lastOwner=null;ball=null;trail=[];expls=[];enemyTimer=0;enemyAng=45;parts=[];
  ang=45;pow=55;charging=false;newWind();hud();
}
function hud(){
  elPhp.textContent=Math.max(0,php);
  elEhp.textContent=Math.max(0,ehp);
  elTurn.textContent=phase==="aim"?"我方":"敌军";
  elBest.textContent=best;
}
function canFire(){return state==="playing"&&phase==="aim"&&!ball&&expls.length===0&&php>0&&ehp>0;}
function fire(){
  if(!canFire())return;
  charging=false;
  var m=muzzle(PX,ang),a=rad(ang),v=spd(pow);
  ball={x:m.x,y:m.y,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,t:0,owner:"player"};
  phase="fly";trail=[];hud();
}
function boom(x,y,col,n){
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-2.6,2.6),vy:rnd(-3.6,0.5),l:rnd(18,40),c:col});
}
function explode(x,y,owner){
  expls.push({x:x,y:y,r:5,t:0,owner:owner});
  boom(x,y,"#fbbf24",18);
  var dmg,i;
  var guns=[{x:PX,mine:true},{x:EX,mine:false}];
  for(i=0;i<2;i++){
    var d=Math.hypot(x-guns[i].x,y-PIV);
    if(d<22)dmg=30+((Math.random()*12)|0);
    else if(d<48)dmg=Math.round(40*(1-d/48));
    else dmg=0;
    if(dmg>0){
      if(guns[i].mine)php=Math.max(0,php-dmg);
      else ehp=Math.max(0,ehp-dmg);
    }
  }
  hud();
}
function enemyFire(){
  var want=PX+rnd(-26,26)-wx*2200;
  var a2=rnd(40,66),bestP=60,bestE=1e9,p,d;
  for(p=15;p<=100;p+=0.5){
    d=Math.abs(EX-landDist(a2,p)-want);
    if(d<bestE){bestE=d;bestP=p;}
  }
  enemyAng=Math.round(a2);
  var m=muzzle(EX,a2),a=rad(a2),v=spd(bestP);
  ball={x:m.x,y:m.y,vx:-Math.cos(a)*v,vy:-Math.sin(a)*v,t:0,owner:"enemy"};
  phase="fly";trail=[];hud();
}
function tick(){
  var i;
  if(charging&&canFire()){pow+=cd*1.9;if(pow>=100){pow=100;cd=-1;}if(pow<=18){pow=18;cd=1;}}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.l--;if(p.l<=0)parts.splice(i,1);}
  for(i=expls.length-1;i>=0;i--){
    var ex=expls[i];
    ex.t++;ex.r=5+Math.min(1,ex.t/14)*43;
    if(ex.t>30)expls.splice(i,1);
  }
  if(ball){
    for(var s=0;s<2;s++){
      ball.t++;ball.vy+=G;ball.vx+=wx;ball.x+=ball.vx;ball.y+=ball.vy;
      var tx=ball.owner==="player"?EX:PX;
      if(Math.hypot(ball.x-tx,ball.y-PIV)<17){lastOwner=ball.owner;explode(ball.x,ball.y,ball.owner);ball=null;break;}
      if(ball.y>=GY-3){lastOwner=ball.owner;explode(ball.x,GY-6,ball.owner);ball=null;break;}
      if(ball.x>W+60||ball.x<-60||ball.t>800){lastOwner=ball.owner;ball=null;break;}
      trail.push({x:ball.x,y:ball.y});if(trail.length>20)trail.shift();
    }
  }
  if(state==="playing"&&!ball&&expls.length===0){
    if(php<=0||ehp<=0){finish();}
    else if(phase==="fly"&&lastOwner==="player"){
      newWind();phase="enemyWait";enemyTimer=55;lastOwner=null;hud();
    }else if(phase==="fly"&&lastOwner==="enemy"){
      newWind();phase="aim";lastOwner=null;hud();
    }else if(phase==="enemyWait"){
      enemyTimer--;
      if(enemyTimer<=0)enemyFire();
    }
  }
}
function finish(){
  state="over";
  var win=ehp<=0&&php>0;
  var sc=win?php*10+500:php*10;
  if(sc>best){best=sc;saveBest("mg_s472",best);}
  ovTitle.textContent=win?"敌炮沉默了!":"我方炮台被毁";
  ovDesc.textContent=win?("剩余血量 "+php+",得分 "+sc+" 分!\n下一局风更刁钻,小心应对。"):"敌军炮火太猛。注意风向修正,顶风要加力,顺风要收力。";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  hud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawGun(x,a2,col,barCol){
  ctx.fillStyle="#39406b";ctx.fillRect(x-16,GY-6,32,6);
  ctx.save();ctx.translate(x,PIV);
  if(x===EX)ctx.scale(-1,1);
  ctx.rotate(-rad(a2));
  ctx.fillStyle=barCol;rr(-8,-6,34,12,5);ctx.fill();
  ctx.restore();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,PIV,11,Math.PI,0);ctx.fill();
}
function drawWind(){
  var cx=240,cy=52,len=wx*2000;
  ctx.strokeStyle="#7dd3fc";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx-len/2,cy);ctx.lineTo(cx+len/2,cy);ctx.stroke();
  var dir=wx>=0?1:-1;
  ctx.fillStyle="#7dd3fc";
  ctx.beginPath();
  ctx.moveTo(cx+dir*(Math.abs(len)/2+8),cy);
  ctx.lineTo(cx+dir*Math.abs(len)/2,cy-5);
  ctx.lineTo(cx+dir*Math.abs(len)/2,cy+5);
  ctx.closePath();ctx.fill();
  ctx.font="12px system-ui";ctx.textAlign="center";
  ctx.fillText("风 "+Math.abs(wx).toFixed(2),cx,cy-10);
}
function drawHp(x,w,val,col){
  ctx.fillStyle="#20263f";rr(x,20,w,10,5);ctx.fill();
  ctx.fillStyle=col;
  if(val>0)rr(x,20,w*val/100,10,5);ctx.fill();
}
function draw(){
  var i;
  ctx.fillStyle="#10142a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1b2138";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#2a3154";ctx.fillRect(0,GY,W,3);
  drawHp(16,120,php,"#4ade80");
  drawHp(W-136,120,ehp,"#f87171");
  ctx.font="11px system-ui";ctx.textAlign="left";ctx.fillStyle="#8b90b0";
  ctx.fillText("我方",16,16);
  ctx.textAlign="right";ctx.fillText("敌军",W-16,16);
  drawWind();
  ctx.font="bold 13px system-ui";ctx.textAlign="center";
  if(state==="playing"&&php>0&&ehp>0){
    var mine=phase==="aim";
    ctx.fillStyle=mine?"#4ade80":"#f87171";
    ctx.fillText(mine?"你的回合 · 调整角度力度开火":"敌军正在装填……",240,36);
  }
  drawGun(PX,ang,"#6a74ad","#8b93c8");
  drawGun(EX,enemyAng,"#96525a","#d38a92");
  if(canFire()&&turn==="player"){
    var m=muzzle(PX,ang),a=rad(ang),v=spd(pow);
    var x=m.x,y=m.y,vx=Math.cos(a)*v,vy=-Math.sin(a)*v;
    ctx.fillStyle="rgba(232,234,246,0.3)";
    for(i=0;i<80;i++){
      vy+=G;vx+=wx;x+=vx;y+=vy;
      if(y>GY)break;
      if(i%3===0)ctx.fillRect(x-1.5,y-1.5,3,3);
    }
  }
  if(charging&&canFire()){
    ctx.fillStyle="#20263f";rr(PX-40,PIV-92,10,80,5);ctx.fill();
    ctx.fillStyle=pow>80?"#f87171":"#4ade80";
    var bh=80*(pow-18)/82;
    rr(PX-40,PIV-12-bh,10,bh,4);ctx.fill();
  }
  for(i=0;i<expls.length;i++){
    var ex=expls[i],al=1-ex.t/30;
    ctx.globalAlpha=Math.max(0,al)*0.8;
    ctx.fillStyle="#fb923c";ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fde68a";ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r*0.55,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  for(i=0;i<trail.length;i++){ctx.fillStyle="rgba(139,147,200,"+(i/trail.length*0.5)+")";ctx.fillRect(trail[i].x-1.5,trail[i].y-1.5,3,3);}
  if(ball){ctx.fillStyle=ball.owner==="player"?"#fbbf24":"#f87171";ctx.beginPath();ctx.arc(ball.x,ball.y,5,0,Math.PI*2);ctx.fill();}
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  ctx.globalAlpha=1;
}
var lastT=0,acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing"){acc+=dt;var n=0;while(acc>=16.6&&n<4){acc-=16.6;n++;tick();}if(n===4)acc=0;}
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}return;}
  if(e.key==="ArrowUp"){ang=Math.min(85,ang+2);e.preventDefault();}
  else if(e.key==="ArrowDown"){ang=Math.max(8,ang-2);e.preventDefault();}
  else if(e.key===" "){e.preventDefault();if(!charging&&canFire()){charging=true;pow=18;cd=1;}}
});
document.addEventListener("keyup",function(e){
  if(e.key===" "&&state==="playing"&&charging)fire();
});
var drag=false,dragMoved=false;
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function aimAt(p){
  var dx=p.x-PX,dy=PIV-p.y;
  if(dy<6||dx<2)return;
  ang=Math.max(8,Math.min(85,Math.atan2(dy,dx)*180/Math.PI));
  pow=Math.max(18,Math.min(100,Math.hypot(dx,dy)/2.2));
  dragMoved=true;
}
cv.addEventListener("mousedown",function(e){if(state!=="playing")return;drag=true;dragMoved=false;aimAt(pos(e));e.preventDefault();});
window.addEventListener("mousemove",function(e){if(drag)aimAt(pos(e));});
window.addEventListener("mouseup",function(e){if(drag){drag=false;if(dragMoved&&canFire())fire();}});
cv.addEventListener("touchstart",function(e){if(state!=="playing")return;drag=true;dragMoved=false;aimAt(pos(e.changedTouches[0]));e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",function(e){if(drag)aimAt(pos(e.changedTouches[0]));e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){if(drag){drag=false;if(dragMoved&&canFire())fire();}e.preventDefault();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

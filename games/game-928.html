<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南瓜惊魂夜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#1a1430;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#fb923c;text-align:center;letter-spacing:2px;margin-bottom:2px}
.hint{text-align:center;color:#9d94c0;font-size:12.5px;margin-bottom:8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fb923c;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#120e22;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(10,6,24,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#fb923c}
.overlay p{color:#b0a8d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:4px;background:#fb923c;color:#431407;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>南瓜惊魂夜</h1>
  <p class="hint">← → 或 A/D 控制双翼 · 空格蓄力发射 · 小心南瓜嘴!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>残球 <b id="ball">3</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="400" height="620"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">南瓜惊魂夜</h2>
      <p id="ovDesc">万圣特别台:三只南瓜会一口吞下小球,吐出方向完全随机——可能直送得分区,也可能直奔漏斗!每次被吞 +80 分,游荡的幽灵挡板会撞飞来球。三球用尽即结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var elScore=$("score"),elBall=$("ball"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var W=400,H=620,G=1000,MAXS=1250,TAU=6.2832;
var best=0;
try{best=parseInt(localStorage.getItem("mg928")||"0",10)||0;}catch(e){best=0;}
function saveBest(){try{localStorage.setItem("mg928",String(best));}catch(e){}}
var state="menu",score=0,balls=3,lastT=0,shake=0;
var b=null,segs=[],circs=[],ghost=null,flL=null,flR=null;
var charging=false,charge=0;
var pops=[];
function S(x1,y1,x2,y2,o){var s={x1:x1,y1:y1,x2:x2,y2:y2,e:0.5,pad:2,kick:0,ow:0,cd:0};if(o)for(var k in o)s[k]=o[k];segs.push(s);return s;}
function C(x,y,r,o){var c={x:x,y:y,r:r,e:0.9,kick:0,cd:0,val:0};if(o)for(var k in o)c[k]=o[k];circs.push(c);return c;}
function mkFL(px,py,mir,len){len=len||58;return{px:px,py:py,len:len,rest:mir?Math.PI-0.55:0.55,up:mir?Math.PI+0.62:-0.62,ang:mir?Math.PI-0.55:0.55,om:0,spd:15,pressed:false};}
function reset(){
  segs=[];circs=[];pops=[];
  S(10,44,326,44);
  S(326,44,390,112);
  S(350,138,390,112,{ow:1,e:0.4});
  S(10,44,10,588);
  S(390,112,390,588);
  S(358,138,358,588);
  S(358,588,390,588,{e:0});
  S(62,460,94,540);
  S(338,460,306,540);
  S(86,454,134,532,{e:1.05,kick:300,col:"#7c3aed"});
  S(314,454,266,532,{e:1.05,kick:300,col:"#7c3aed"});
  S(134,532,144,552);
  S(266,532,256,552);
  C(90,250,15,{trap:1});
  C(310,250,15,{trap:1});
  C(200,320,15,{trap:1});
  C(80,140,18,{kick:320,val:150});
  C(320,140,18,{kick:320,val:150});
  C(150,90,8,{e:0.8,val:30});
  C(250,90,8,{e:0.8,val:30});
  C(60,350,8,{e:0.8,val:30});
  C(340,350,8,{e:0.8,val:30});
  ghost=C(200,175,19,{e:0.85,kick:120,val:60});
  flL=mkFL(140,547,false);flR=mkFL(260,547,true);
}
function fseg(f){return{x1:f.px,y1:f.py,x2:f.px+f.len*Math.cos(f.ang),y2:f.py+f.len*Math.sin(f.ang),e:0.3,pad:5,om:f.om,ang:f.ang};}
function upFlip(f,h){
  var target=f.pressed?f.up:f.rest,prev=f.ang,step=f.spd*h,d=target-f.ang;
  if(Math.abs(d)<=step)f.ang=target;else f.ang+=(d>0?step:-step);
  f.om=(f.ang-prev)/h;
}
function addScore(v,x,y){
  score+=v;elScore.textContent=score;
  if(x!==undefined&&pops.length<8)pops.push({x:x,y:y,txt:"+"+v,life:900});
}
function toReady(){
  b={x:374,y:574,vx:0,vy:0,r:9};
  charging=false;charge=0;state="ready";
}
function launch(){
  b.vx=-10;b.vy=-(640+820*charge);
  charge=0;charging=false;state="playing";
}
function loseBall(){
  balls--;elBall.textContent=balls;
  if(balls<=0)gameOver("三颗弹珠全部掉落,南瓜们心满意足!");
  else toReady();
}
function gameOver(msg){
  state="over";
  if(score>best){best=score;saveBest();}
  elBest.textContent=best;
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  reset();score=0;balls=3;
  elScore.textContent=0;elBall.textContent=3;elBest.textContent=best;
  toReady();
  ov.classList.add("hide");
}
function collideSeg(s,now){
  var dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy;
  var t=L2>0?((b.x-s.x1)*dx+(b.y-s.y1)*dy)/L2:0;
  t=t<0?0:t>1?1:t;
  var px=s.x1+t*dx,py=s.y1+t*dy;
  var ex=b.x-px,ey=b.y-py,d2=ex*ex+ey*ey,R=b.r+(s.pad||0);
  if(d2>=R*R)return false;
  if(s.ow===1&&b.vy<0)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=0;}
  var nx=ex/d,ny=ey/d;
  b.x=px+nx*R;b.y=py+ny*R;
  var ox=0,oy=0;
  if(s.om){
    var segLen=Math.sqrt(L2),l=(t-(s.pv||0))*segLen;
    var sA=Math.sin(s.ang),cA=Math.cos(s.ang);
    ox=-s.om*l*sA;oy=s.om*l*cA;
  }
  var rvx=b.vx-ox,rvy=b.vy-oy,vn=rvx*nx+rvy*ny;
  if(vn<0){
    b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;
    if(s.kick&&now-s.cd>90){s.cd=now;b.vx+=s.kick*nx;b.vy+=s.kick*ny;addScore(50,px,py);}
  }
  return true;
}
function collideCirc(c,now){
  var ex=b.x-c.x,ey=b.y-c.y,R=b.r+c.r,d2=ex*ex+ey*ey;
  if(d2>=R*R)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=-0.001;}
  var nx=ex/d,ny=ey/d;
  b.x=c.x+nx*R;b.y=c.y+ny*R;
  if(c.trap){
    if(now-c.cd>1500){
      c.cd=now;
      b.held={x:c.x,y:c.y,until:now+750};
      addScore(80,c.x,c.y-24);
      pops.push({x:c.x,y:c.y-30,txt:"咕噜!",life:800});
    }
    return true;
  }
  var rvx=b.vx-(c.vx||0),rvy=b.vy-(c.vy||0),vn=rvx*nx+rvy*ny;
  if(vn<0){
    b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny;
    if(now-c.cd>120){
      c.cd=now;
      if(c.kick){b.vx+=c.kick*nx;b.vy+=c.kick*ny;}
      if(c.val)addScore(c.val,c.x,c.y-c.r-8);
    }
  }
  return true;
}
function stepBall(h,now){
  b.vy+=G*h;
  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(sp>MAXS){b.vx*=MAXS/sp;b.vy*=MAXS/sp;}
  b.x+=b.vx*h;b.y+=b.vy*h;
  var i;
  for(i=0;i<segs.length;i++)collideSeg(segs[i],now);
  collideSeg(fseg(flL),now);
  collideSeg(fseg(flR),now);
  for(i=0;i<circs.length;i++)collideCirc(circs[i],now);
  if(b.x<12){b.x=12;if(b.vx<0)b.vx=-b.vx;}
  if(b.x>388){b.x=388;if(b.vx>0)b.vx=-b.vx;}
  if(b.x>362&&b.y>545&&b.vy>=-20){toReady();return false;}
  if(b.y>H+25){loseBall();return true;}
  return false;
}
function frame(t){
  requestAnimationFrame(frame);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  ghost.x=200+125*Math.sin(t*0.0011);
  ghost.vx=137.5*Math.cos(t*0.0011);
  if(state==="playing"||state==="ready"){upFlip(flL,dt/1000);upFlip(flR,dt/1000);}
  if(state==="ready"){
    if(charging){charge+=dt*0.0013;if(charge>1)charge=1;}
  }else if(state==="playing"){
    if(b.held){
      b.x=b.held.x;b.y=b.held.y;b.vx=0;b.vy=0;
      if(t>b.held.until){
        b.held=null;
        var a=-2.8+Math.random()*3.1;
        b.vx=Math.cos(a)*480;b.vy=Math.sin(a)*480;
      }
    }else{
      var n=5,i;
      for(i=0;i<n;i++){if(stepBall(dt/1000/n,t))break;}
    }
  }
  if(shake>0.3)shake*=0.85;
  var j;
  for(j=pops.length-1;j>=0;j--){pops[j].life-=dt;pops[j].y-=dt*0.028;if(pops[j].life<=0)pops.splice(j,1);}
  draw(t);
}
function drawSegs(){
  ctx.lineCap="round";
  var i,s;
  for(i=0;i<segs.length;i++){
    s=segs[i];
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
    if(s.ow===1){ctx.setLineDash([6,5]);ctx.strokeStyle="#3b2d63";ctx.lineWidth=3;}
    else{ctx.setLineDash([]);ctx.strokeStyle=s.col||"#443765";ctx.lineWidth=5;}
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawFL(f){
  var x2=f.px+f.len*Math.cos(f.ang),y2=f.py+f.len*Math.sin(f.ang);
  ctx.strokeStyle="#fb923c";ctx.lineWidth=12;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(f.px,f.py);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle="#ffedd5";ctx.beginPath();ctx.arc(f.px,f.py,5,0,TAU);ctx.fill();
}
function drawPumpkin(c,t){
  var r=c.r;
  ctx.fillStyle="#fb923c";
  ctx.beginPath();ctx.ellipse(c.x,c.y,r+3,r,0,0,TAU);ctx.fill();
  ctx.strokeStyle="#c2410c";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#166534";
  ctx.fillRect(c.x-2,c.y-r-5,4,5);
  ctx.fillStyle="#7c2d12";
  var w=r*0.62;
  ctx.beginPath();
  ctx.moveTo(c.x-w,c.y+2);ctx.lineTo(c.x+w,c.y+2);
  ctx.lineTo(c.x+w*0.5,c.y+6);ctx.lineTo(c.x,c.y+2);
  ctx.lineTo(c.x-w*0.5,c.y+6);ctx.closePath();ctx.fill();
  ctx.fillStyle="#7c2d12";
  ctx.beginPath();ctx.moveTo(c.x-w*0.7,c.y-r*0.45);ctx.lineTo(c.x-w*0.2,c.y-r*0.2);ctx.lineTo(c.x-w*0.7,c.y-r*0.05);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(c.x+w*0.7,c.y-r*0.45);ctx.lineTo(c.x+w*0.2,c.y-r*0.2);ctx.lineTo(c.x+w*0.7,c.y-r*0.05);ctx.closePath();ctx.fill();
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle="#120e22";ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(200,300,40,200,300,420);
  g.addColorStop(0,"rgba(124,58,237,0.13)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawSegs();
  var i,c;
  for(i=0;i<circs.length;i++){
    c=circs[i];
    if(c.trap)drawPumpkin(c,t);
    else if(c===ghost){
      ctx.globalAlpha=0.75;
      ctx.fillStyle="#c7d2fe";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,Math.PI,0);
      ctx.lineTo(c.x+c.r,c.y+c.r*0.8);
      ctx.lineTo(c.x+c.r*0.5,c.y+c.r*0.5);
      ctx.lineTo(c.x,c.y+c.r*0.9);
      ctx.lineTo(c.x-c.r*0.5,c.y+c.r*0.5);
      ctx.lineTo(c.x-c.r,c.y+c.r*0.8);
      ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle="#1e1b4b";
      ctx.beginPath();ctx.arc(c.x-6,c.y-3,3,0,TAU);ctx.arc(c.x+6,c.y-3,3,0,TAU);ctx.fill();
    }else if(c.r<=9){
      ctx.fillStyle="#544a7a";ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();
    }else{
      var hot=t-c.cd<130;
      ctx.fillStyle=hot?"#fef3c7":"#241a3f";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();
      ctx.strokeStyle=hot?"#fb923c":"#6d28d9";ctx.lineWidth=3;ctx.stroke();
    }
  }
  drawFL(flL);drawFL(flR);
  ctx.fillStyle="#a855f7";ctx.fillRect(368,584+charge*10,12,5);
  if(b){
    var show=!(b.held&&((t/120)|0)%2===0);
    if(show){
      var bg2=ctx.createRadialGradient(b.x-3,b.y-4,1,b.x,b.y,10);
      bg2.addColorStop(0,"#ffffff");bg2.addColorStop(1,"#fdba74");
      ctx.fillStyle=bg2;ctx.shadowColor="#fb923c";ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.shadowBlur=0;
    }
  }
  ctx.font="bold 14px system-ui";ctx.textAlign="center";
  for(i=0;i<pops.length;i++){
    ctx.globalAlpha=Math.min(1,pops[i].life/500);
    ctx.fillStyle="#fdba74";ctx.fillText(pops[i].txt,pops[i].x,pops[i].y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){flL.pressed=true;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){flR.pressed=true;e.preventDefault();}
  else if(k===" "||k==="ArrowDown"){
    e.preventDefault();
    if(state==="ready")charging=true;
    else if(state==="menu"||state==="over")startGame();
  }else if(k==="Enter"&&(state==="menu"||state==="over"))startGame();
});
document.addEventListener("keyup",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A")flL.pressed=false;
  else if(k==="ArrowRight"||k==="d"||k==="D")flR.pressed=false;
  else if(k===" "||k==="ArrowDown"){
    if(state==="ready"&&charging)launch();
    charging=false;
  }
});
var tCharge=false;
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(state==="ready"){tCharge=true;charging=true;return;}
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=true;else flR.pressed=true;
  }
},{passive:false});
cv.addEventListener("touchend",function(e){
  e.preventDefault();
  if(state==="ready"){
    if(tCharge){tCharge=false;charge=Math.max(charge,0.55);launch();}
    return;
  }
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=false;else flR.pressed=false;
  }
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
elBest.textContent=best;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

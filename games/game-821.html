<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万花筒工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f0abfc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f0abfc;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #3b2b58;background:#14101f;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:crosshair}
.tools{display:flex;justify-content:center;gap:8px;margin-top:10px}
.tools button{background:#241b3a;color:#e8eaf6;border:1px solid #4c3a72;border-radius:9px;padding:8px 18px;font-size:14px;cursor:pointer;font-family:inherit}
.tools button.on{background:#f0abfc;color:#3b1053;border-color:#f0abfc;font-weight:700}
.overlay{position:absolute;inset:0;background:rgba(10,8,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#f0abfc}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#f0abfc;color:#3b1053;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>万花筒工坊</h1>
  <p class="hint">按住拖动,笔迹会沿 <b style="color:#f0abfc">8 轴镜像</b> 同步绽放成花;<br>30 秒内让彩灯铺满圆盘 <b style="color:#fde047">55%</b> 以上!</p>
  <div class="hud"><span>覆盖率 <b id="cov">0%</b></span><span>剩余 <b id="time">30</b> 秒</span><span>目标 <b>55%</b></span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">万花筒工坊</h2>
      <p id="ovP">一支画笔,十六道倒影。选好笔刷粗细,在圆盘里随意涂鸦,所有对称花瓣都会实时绽放,颜色还会流转。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
  <div class="tools">
    <button data-s="3" class="on">细笔</button><button data-s="8">中笔</button><button data-s="15">粗笔</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo");
var elCov=$("cov"),elTime=$("time");
var CX=240,CY=240,N=48,CELL=10;
var inC=new Uint8Array(N*N),insideCnt=0,i,j,dx,dy;
for(i=0;i<N;i++)for(j=0;j<N;j++){
  dx=(i+0.5)*CELL-CX;dy=(j+0.5)*CELL-CY;
  if(dx*dx+dy*dy<215*215){inC[i*N+j]=1;insideCnt++;}
}
var COSA=[],SINA=[];
for(i=0;i<8;i++){COSA.push(Math.cos(Math.PI*i/4));SINA.push(Math.sin(Math.PI*i/4));}
var state="menu",timeLeft=30,hue=0,size=8,cover=null,coverCnt=0,isDown=false,last=null,best=0,lastT=0;
try{best=parseInt(localStorage.getItem("mg_s821")||"0",10)||0;}catch(e){best=0;}
function drawBG(){
  ctx.fillStyle="#14101f";ctx.fillRect(0,0,480,480);
  ctx.strokeStyle="rgba(240,171,252,0.18)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(CX,CY,215,0,Math.PI*2);ctx.stroke();
}
function reset(){
  cover=new Uint8Array(N*N);coverCnt=0;timeLeft=30;hue=Math.random()*360;
  isDown=false;last=null;drawBG();hud();
}
function hud(){
  elCov.textContent=Math.round(coverCnt/insideCnt*100)+"%";
  elTime.textContent=Math.max(0,Math.ceil(timeLeft));
}
function tf(p,m,a){
  var vx=p.x-CX,vy=p.y-CY;
  if(m)vy=-vy;
  return {x:CX+vx*COSA[a]-vy*SINA[a],y:CY+vx*SINA[a]+vy*COSA[a]};
}
function mark(x,y){
  var gx=Math.floor(x/CELL),gy=Math.floor(y/CELL);
  if(gx<0||gx>=N||gy<0||gy>=N)return;
  var id=gx*N+gy;
  if(inC[id]&&!cover[id]){cover[id]=1;coverCnt++;}
}
function strokeSeg(p,q){
  var m,a,t,n,P,Q,dd;
  ctx.strokeStyle="hsl("+Math.round(hue)+",85%,64%)";
  ctx.lineWidth=size;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  for(m=0;m<2;m++)for(a=0;a<8;a++){
    P=tf(p,m,a);Q=tf(q,m,a);
    ctx.moveTo(P.x,P.y);ctx.lineTo(Q.x,Q.y);
    dd=Math.hypot(Q.x-P.x,Q.y-P.y);n=Math.max(1,Math.ceil(dd/4));
    for(t=0;t<=n;t++)mark(P.x+(Q.x-P.x)*t/n,P.y+(Q.y-P.y)*t/n);
  }
  ctx.stroke();
  hue=(hue+3)%360;
}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function begin(e){
  if(state!=="playing")return;
  var p=pos(e);isDown=true;last=p;
  strokeSeg(p,{x:p.x+0.01,y:p.y+0.01});
}
function moveP(e){
  if(!isDown||state!=="playing")return;
  var p=pos(e);strokeSeg(last,p);last=p;
}
function endP(){isDown=false;last=null;}
cv.addEventListener("mousedown",begin);
window.addEventListener("mousemove",moveP);
window.addEventListener("mouseup",endP);
cv.addEventListener("touchstart",function(e){e.preventDefault();begin(e);},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();moveP(e);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();endP();},{passive:false});
function finish(){
  state="over";
  var pct=Math.round(coverCnt/insideCnt*100),win=pct>=55;
  if(pct>best){best=pct;try{localStorage.setItem("mg_s821",String(best));}catch(e){}}
  ovT.textContent=win?"绽放成功!":"时间到";
  ovP.textContent="你的万花筒铺满了 "+pct+"% 的圆盘。\n"+(win?"对称花瓣开满夜空,美极了!":"试试粗笔刷、多走大弧线,铺得更快!");
  ovS.style.display="block";ovS.textContent="覆盖率得分 "+pct+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT);lastT=t;
  if(state!=="playing")return;
  timeLeft-=dt/1000;
  hud();
  if(timeLeft<=0){timeLeft=0;hud();finish();}
}
var btns=document.querySelectorAll(".tools button");
for(i=0;i<btns.length;i++){
  (function(b){
    b.addEventListener("click",function(){
      size=parseInt(b.getAttribute("data-s"),10);
      for(j=0;j<btns.length;j++)btns[j].className="";
      b.className="on";
    });
  })(btns[i]);
}
btnGo.addEventListener("click",function(){
  reset();state="playing";
  ovS.style.display="none";
  ov.classList.add("hide");
});
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

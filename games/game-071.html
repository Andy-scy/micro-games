<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双翼滑翔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#34d399;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#34d399;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#34d399}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#34d399;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>双翼滑翔</h1>
  <p class="hint">↑/W 上升 · ↓/S 下降 · 触屏按住上半 / 下半屏 · 松开即悬停</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">双翼滑翔</h2>
      <p id="ovDesc">这里没有重力:↑/W 或按住屏幕上半部向上飞,↓/S 或按住下半部向下飞,松开双手就能稳稳悬停!躲开伸出的能量闸墙与悬浮闸块,每过一道 +1 分,贴墙即亡。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始滑翔</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,BX=120,BR=13,SPEED=152,SPACE=218;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,walls,popups,score,best=0,tick,upHold,downHold;
function newOb(x){
  if(Math.random()<0.3){
    return{x:x,type:"bar",y:140+Math.random()*(GROUND-280),h:46,passed:false};
  }
  var side=Math.random()<0.5?"top":"bottom";
  var len=175+Math.random()*195;
  return{x:x,type:"wall",side:side,len:len,passed:false};
}
function reset(){
  bird={y:280,vy:0};
  walls=[newOb(W+150)];
  popups=[];score=0;tick=0;upHold=false;downHold=false;
  elScore.textContent="0";
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,w;
  tick+=dt;
  if(upHold&&!downHold)bird.vy=-235;
  else if(downHold&&!upHold)bird.vy=235;
  else bird.vy*=Math.exp(-9*dt);
  bird.y+=bird.vy*dt;
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=0;}
  if(bird.y>GROUND-BR-2){bird.y=GROUND-BR-2;bird.vy=0;}
  for(i=0;i<walls.length;i++)walls[i].x-=SPEED*dt;
  if(walls[walls.length-1].x<W-SPACE)walls.push(newOb(W+24));
  if(walls[0].x<-70)walls.shift();
  for(i=0;i<walls.length;i++){
    w=walls[i];
    if(!w.passed&&w.x+58<BX-BR){
      w.passed=true;score++;
      elScore.textContent=String(score);
      popups.push({x:BX+34,y:bird.y-26,txt:"+1",life:0.8});
    }
    if(w.type==="wall"){
      var ry=w.side==="top"?0:GROUND-w.len;
      if(circleRect(BX,bird.y,BR,w.x,ry,58,w.len)){die("撞上了能量闸墙!");return;}
    }else{
      if(circleRect(BX,bird.y,BR,w.x,w.y,58,w.h)){die("撞上了悬浮闸块!");return;}
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawGate(w){
  var ry;
  if(w.type==="wall"){
    ry=w.side==="top"?0:GROUND-w.len;
    ctx.fillStyle="rgba(52,211,153,0.30)";
    ctx.fillRect(w.x,ry,58,w.len);
    ctx.strokeStyle="#34d399";ctx.lineWidth=2.5;
    ctx.strokeRect(w.x,ry,58,w.len);
    ctx.fillStyle="#a7f3d0";
    ctx.fillRect(w.x,ry,58,4);
    ctx.fillRect(w.x,w.side==="top"?w.len-4:GROUND-w.len,58,4);
  }else{
    ctx.fillStyle="rgba(52,211,153,0.30)";
    ctx.fillRect(w.x,w.y,58,w.h);
    ctx.strokeStyle="#34d399";ctx.lineWidth=2.5;
    ctx.strokeRect(w.x,w.y,58,w.h);
    ctx.fillStyle="#a7f3d0";
    ctx.fillRect(w.x,w.y,58,4);
    ctx.fillRect(w.x,w.y+w.h-4,58,4);
  }
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0a1712";
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(52,211,153,0.08)";ctx.lineWidth=1;
  var off=(tick*SPEED)%48;
  for(i=0;i<W/48+2;i++){
    ctx.beginPath();ctx.moveTo(i*48-off,0);ctx.lineTo(i*48-off,GROUND);ctx.stroke();
  }
  for(i=0;i<W/48+2;i++){
    ctx.beginPath();ctx.moveTo(0,i*48);ctx.lineTo(W,i*48);ctx.stroke();
  }
  for(i=0;i<walls.length;i++)drawGate(walls[i]);
  ctx.fillStyle="#123528";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#1c5138";
  var goff=(tick*SPEED)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-goff,GROUND,12,5);
  ctx.save();
  ctx.translate(BX,bird.y);
  ctx.rotate(Math.max(-0.3,Math.min(0.3,bird.vy*0.0012)));
  ctx.fillStyle="#6ee7b7";
  ctx.beginPath();ctx.moveTo(2,-3);ctx.lineTo(-16,-13);ctx.lineTo(-6,0);ctx.lineTo(-16,13);ctx.lineTo(2,3);ctx.closePath();ctx.fill();
  ctx.fillStyle="#34d399";
  ctx.beginPath();ctx.ellipse(6,0,12,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#064e3b";
  ctx.beginPath();ctx.arc(10,-1,2.6,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(110,231,183,"+popups[i].life+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
function setHold(v,dir){
  if(state!=="playing"){upHold=false;downHold=false;return;}
  if(dir==="up"){upHold=v;if(v)downHold=false;}
  else{downHold=v;if(v)upHold=false;}
}
function pointerHold(clientY){
  var rect=cv.getBoundingClientRect();
  var my=(clientY-rect.top)*(H/rect.height);
  setHold(true,my<H/2?"up":"down");
}
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W"){e.preventDefault();setHold(true,"up");}
  else if(e.key==="ArrowDown"||e.key==="s"||e.key==="S"){e.preventDefault();setHold(true,"down");}
});
document.addEventListener("keyup",function(e){
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")setHold(false,"up");
  else if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")setHold(false,"down");
});
cv.addEventListener("mousedown",function(e){e.preventDefault();pointerHold(e.clientY);});
document.addEventListener("mouseup",function(){setHold(false,"up");downHold=false;});
cv.addEventListener("touchstart",function(e){e.preventDefault();pointerHold(e.changedTouches[0].clientY);},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();upHold=false;downHold=false;},{passive:false});
cv.addEventListener("touchcancel",function(){upHold=false;downHold=false;});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁砂显影盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#fbbf24;text-align:center;letter-spacing:2px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin:4px 0 8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fbbf24;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#fbbf24}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay button{margin-top:4px;background:#fbbf24;color:#451a03;border:none;border-radius:10px;padding:11px 30px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>磁砂显影盘</h1>
  <p class="hint">按住拖动磁石,铁砂随之列队 · 让砂纹梳出暗藏的图样 · 三图全显圆满</p>
  <div class="hud">
    <span>寻影 <b id="hShape">月牙</b></span>
    <span>显影 <b id="hPct">0%</b></span>
    <span>图鉴 <b id="hDex">0</b>/3</span>
  </div>
  <div class="stage">
    <canvas id="cv" width="470" height="300"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">磁砂显影盘</h2>
      <p id="ovD"></p>
      <button id="btnGo">开始寻影</button>
      <button id="btnMore" style="display:none">继续把玩</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var hShape=$("hShape"),hPct=$("hPct"),hDex=$("hDex");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),btnGo=$("btnGo"),btnMore=$("btnMore");
var W=470,H=300,TAU=Math.PI*2;
var COLS=27,ROWS=17;
function inMoon(x,y){
  var a1=(x-235)*(x-235)+(y-150)*(y-150)<95*95;
  var a2=(x-274)*(x-274)+(y-116)*(y-116)<70*70;
  return a1&&!a2;
}
function inStar(x,y){
  var dx=x-235,dy=y-150,r=Math.sqrt(dx*dx+dy*dy);
  if(r>98)return false;
  var th=Math.atan2(dy,dx)+Math.PI/2;
  var edge=46+52*Math.pow(Math.abs(Math.cos(2.5*th)),1.5);
  return r<edge;
}
function inHeart(x,y){
  var X=(x-235)/92,Y=-(y-170)/92;
  var a=X*X+Y*Y-1;
  return (a*a*a-X*X*Y*Y*Y)<=0;
}
var SHAPES=[{n:"月牙",f:inMoon},{n:"星辰",f:inStar},{n:"心印",f:inHeart}];
var filings=[],masks=[],counts=[],i,j;
for(i=0;i<COLS;i++)for(j=0;j<ROWS;j++){
  filings.push({x:14+i*17,y:12+j*17,ang:Math.random()*TAU,glow:0});
}
for(i=0;i<SHAPES.length;i++){
  var m=[],cnt=0,k;
  for(k=0;k<filings.length;k++){
    var v=SHAPES[i].f(filings[k].x,filings[k].y)?1:0;
    m.push(v);cnt+=v;
  }
  masks.push(m);counts.push(cnt);
}
var cur=0,pressing=false,mx=0,my=0,state="menu",goalDone=false,flashT=0;
function norm(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;}
function step(dt){
  var i2;
  if(flashT>0)flashT-=dt;
  for(i2=0;i2<filings.length;i2++){var f=filings[i2];
    var aligned=false;
    if(pressing){
      var dx=mx-f.x,dy=my-f.y,d2=dx*dx+dy*dy;
      if(d2<95*95){
        var tgt=Math.atan2(dy,dx),da=norm(tgt-f.ang);
        f.ang+=da*Math.min(1,10*dt);
        aligned=Math.abs(da)<0.13;
      }
    }
    if(aligned&&masks[cur][i2])f.glow=Math.min(1,f.glow+3*dt);
    else f.glow=Math.max(0,f.glow-0.9*dt);
  }
  var rev=0;
  for(i2=0;i2<filings.length;i2++)
    if(masks[cur][i2]&&filings[i2].glow>0.55)rev++;
  var pct=rev/counts[cur];
  hPct.textContent=Math.round(pct*100)+"%";
  if(pct>=0.72&&flashT<=0){
    flashT=1.4;
    addFxBig("「"+SHAPES[cur].n+"」显影!");
    cur++;
    hDex.textContent=Math.min(3,cur);
    if(cur>=3&&!goalDone){
      goalDone=true;state="zen";
      ovT.textContent="三影齐全";
      ovD.textContent="月牙、星辰、心印,皆从砂浪中显形。\n磁石之下,万象自成。可继续随意拨砂。";
      btnMore.style.display="inline-block";
      ov.classList.remove("hide");
    }else{
      hShape.textContent=SHAPES[cur].n;
    }
  }
}
var bigFx=null;
function addFxBig(txt){bigFx={txt:txt,t:1.6};}
function draw(){
  ctx.clearRect(0,0,W,H);
  var i2;
  for(i2=0;i2<filings.length;i2++){var f=filings[i2];
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.ang);
    if(f.glow>0.03){
      ctx.strokeStyle="rgba(255,209,102,"+(f.glow*0.95).toFixed(2)+")";
      ctx.lineWidth=2;
    }else{
      ctx.strokeStyle="rgba(148,163,184,.3)";
      ctx.lineWidth=1.4;
    }
    ctx.beginPath();ctx.moveTo(-4.5,0);ctx.lineTo(4.5,0);ctx.stroke();
    ctx.restore();}
  if(flashT>0){
    var m=masks[Math.min(2,cur===0?0:cur-1)];
    ctx.fillStyle="rgba(255,209,102,"+(flashT*0.5).toFixed(2)+")";
    for(i2=0;i2<filings.length;i2++)
      if(m[i2]&&cur>0){ctx.beginPath();ctx.arc(filings[i2].x,filings[i2].y,3,0,TAU);ctx.fill();}
  }
  if(pressing){
    var g=ctx.createRadialGradient(mx,my,2,mx,my,40);
    g.addColorStop(0,"rgba(255,255,255,.5)");
    g.addColorStop(0.5,"rgba(248,113,113,.3)");
    g.addColorStop(1,"rgba(96,165,250,0)");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(mx,my,40,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(248,113,113,.9)";
    ctx.beginPath();ctx.arc(mx-4,my,5,0,TAU);ctx.fill();
    ctx.fillStyle="rgba(96,165,250,.9)";
    ctx.beginPath();ctx.arc(mx+4,my,5,0,TAU);ctx.fill();
  }
  if(bigFx){
    bigFx.t-=1/60;
    if(bigFx.t<=0)bigFx=null;
    else{
      ctx.globalAlpha=Math.min(1,bigFx.t*2);
      ctx.fillStyle="#fbbf24";ctx.font="bold 20px system-ui";ctx.textAlign="center";
      ctx.fillText(bigFx.txt,W/2,60);
      ctx.globalAlpha=1;
    }
  }
}
function ptr(e){var t=(e.touches&&e.touches[0])?e.touches[0]:e;var rc=cv.getBoundingClientRect();return{x:(t.clientX-rc.left)*W/rc.width,y:(t.clientY-rc.top)*H/rc.height};}
function down(e){if(state!=="play")return;e.preventDefault();pressing=true;var p=ptr(e);mx=p.x;my=p.y;}
function mv(e){if(!pressing||state!=="play")return;e.preventDefault();var p=ptr(e);mx=p.x;my=p.y;}
function up(){pressing=false;}
cv.addEventListener("mousedown",down);window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
cv.addEventListener("touchstart",down,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",up);
var lastT=0;
function loop(t){requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(state==="play")step(dt);
  draw();
}
function showMenu(){
  ovT.textContent="磁砂显影盘";
  ovD.textContent="盘底铺满铁砂,暗处藏着三幅图样:月牙、星辰、心印。\n按住并缓缓拖动磁石,磁力所及,铁砂纷纷转向;\n顺着暗图的方向梳砂,砂纹发亮,显影至 72% 即显一幅。";
  btnGo.textContent="开始寻影";btnMore.style.display="none";
  ov.classList.remove("hide");
}
btnGo.addEventListener("click",function(){state="play";ov.classList.add("hide");});
btnMore.addEventListener("click",function(){state="play";ov.classList.add("hide");});
showMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

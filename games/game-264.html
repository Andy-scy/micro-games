<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极速穿越</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#22d3ee;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#22d3ee;font-size:16px}
.bar{flex:1;min-width:90px;height:10px;background:#0b0e1a;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#22d3ee;width:100%}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#22d3ee}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#22d3ee;color:#052830;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>极速穿越</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 60 秒内冲出更大的迷宫</p>
  <div class="hud">
    <span>剩余</span>
    <div class="bar"><i id="tbar"></i></div>
    <span><b id="tleft">60.0s</b></span>
    <span>步数 <b id="steps">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="450" height="450"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">极速穿越</h2>
      <p id="ovDesc">60 秒倒计时,一座 25×25 的随机迷宫,唯一的出口藏在右下角。路上散落着 3 座沙漏时钟,踩到可回收 6 秒。用最短时间逃脱,刷新你的极速纪录!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始冲刺</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=25,ROWS=25,CELL=18,W=450,H=450;
function $(id){return document.getElementById(id);}
var elBar=$("tbar"),elLeft=$("tleft"),elSteps=$("steps");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s264");
var state="menu";
var grid,player,exitCell,clocks,steps,timeLeft,elapsed,pulse;

function loadBest(k){try{return parseFloat(localStorage.getItem(k)||"0")||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function bfs(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function reset(){
  grid=genMaze(12,12);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dist=bfs(1,1),cells=[],x,y;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]===0&&dist[y][x]>=10&&!(x===exitCell.x&&y===exitCell.y))cells.push({x:x,y:y});
  }
  clocks=[];
  var guard=0;
  while(clocks.length<3&&cells.length&&guard<400){
    guard++;
    var i=(Math.random()*cells.length)|0,c=cells[i],bad=false,j;
    for(j=0;j<clocks.length;j++)if(clocks[j].x===c.x&&clocks[j].y===c.y)bad=true;
    if(!bad)clocks.push({x:c.x,y:c.y,got:false});
    cells.splice(i,1);
  }
  steps=0;timeLeft=60;elapsed=0;pulse=0;
  updateHud();
}
function updateHud(){
  elBar.style.width=Math.max(0,timeLeft/60*100)+"%";
  elLeft.textContent=Math.max(0,timeLeft).toFixed(1)+"s";
  elSteps.textContent=steps;
}
function endGame(winFlag,used){
  state="over";
  var isNew=false;
  if(winFlag){
    if(best===0||used<best){best=used;saveBest("mg_s264",best);isNew=true;}
    ovTitle.textContent="穿越成功!";
    ovTitle.style.color="#22d3ee";
    ovDesc.textContent=isNew?"新纪录!你就是迷宫里的闪电。":"在计时器归零前,你冲出了出口。";
  }else{
    ovTitle.textContent="时间耗尽";
    ovTitle.style.color="#f87171";
    ovDesc.textContent="差一点点!下次记得规划更短的路线,或者抢下路上的沙漏时钟。";
  }
  ovScore.style.display="block";
  ovScore.textContent="用时 "+used.toFixed(1)+"s · 步数 "+steps+" · 最快纪录 "+(best>0?best.toFixed(1)+"s":"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  steps++;
  var i;
  for(i=0;i<clocks.length;i++){
    if(!clocks[i].got&&clocks[i].x===nx&&clocks[i].y===ny){
      clocks[i].got=true;
      timeLeft=Math.min(60,timeLeft+6);
    }
  }
  if(nx===exitCell.x&&ny===exitCell.y){endGame(true,60-timeLeft);return;}
  updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#232a4d";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#2c3560";
  ctx.fillRect(x*CELL,y*CELL,CELL,2);
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  for(i=0;i<clocks.length;i++){
    if(clocks[i].got)continue;
    var cx=clocks[i].x*CELL+CELL/2,cy=clocks[i].y*CELL+CELL/2;
    ctx.strokeStyle="#e5e7eb";
    ctx.fillStyle="#0b0e1a";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,CELL/2-3,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-4);ctx.moveTo(cx,cy);ctx.lineTo(cx+3,cy+1);ctx.stroke();
  }
  var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
  var pr=6+Math.sin(pulse)*1.5;
  ctx.fillStyle="#4ade80";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle="#67e8f9";
  ctx.shadowColor="#22d3ee";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,CELL/2-2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.006;
  if(state==="playing"){
    timeLeft-=dt/1000;
    if(timeLeft<=0){timeLeft=0;updateHud();endGame(false,60);draw();return;}
    updateHud();
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

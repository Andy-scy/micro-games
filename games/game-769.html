<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空地协同</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none;cursor:crosshair}
.sbtn{border:0;border-radius:8px;padding:10px 6px;font-size:13px;background:#232a4a;color:#e8eaf6;cursor:pointer;flex:1;font-weight:700}
.sbtn.on{background:#4cc9f0;color:#081226}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>空地协同</h1>
  <p class="tips">地面部队走蜿蜒山路,空军却直接横穿领空!地刺塔打不到飞机,防空塔打不到步兵——两套防线,缺一即溃。</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">金币</div><div class="big" id="gd">0</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="lf">0</div></div>
    <div class="stat"><div class="mut">波次</div><div class="big" id="wv">0/12</div></div>
    <div class="stat"><div class="mut">击杀</div><div class="big" id="kl">0</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="480" height="360"></canvas></div>
  <div class="card row">
    <button class="sbtn on" id="bA">地刺塔 45金</button>
    <button class="sbtn" id="bB">防空塔 75金</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">空地协同</h2><p id="ovp">玩法说明:<br>· 步兵沿地面道路进攻;敌机沿顶部虚线航线直接横穿!<br>· 地刺塔(45金):只能打地面单位<br>· 防空塔(75金):只能打空中单位,射程更远<br>· 波次类型:地面 / 空中 / 混合轮换,漏一个飞机扣 2 生命<br>· 先点选塔型,再点击空地建造<br>· 撑过 12 波获得胜利!</p><button class="btn" id="obtn">开始布防</button></div></div>
<script>
'use strict';
var W=480,H=360,CS=40;
function $i(id){return document.getElementById(id)}
var cv=$i('cv'),ctx=cv.getContext('2d');
var PG=[[-20,250],[140,250],[140,140],[290,140],[290,300],[430,300],[430,210],[500,210]];
var PAIR=[[-20,70],[500,70]];
var segsG=[],segsA=[],PLENG=0,PLENA=0;
function mkSegs(pts){var arr=[],i;for(i=0;i<pts.length-1;i++){var ax=pts[i][0],ay=pts[i][1],bx=pts[i+1][0],by=pts[i+1][1];var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy);arr.push({ax:ax,ay:ay,dx:dx/len,dy:dy/len,len:len});}return arr;}
function pathLen(s){var L=0,i;for(i=0;i<s.length;i++)L+=s[i].len;return L;}
function posAtS(segs,d){var i=0;while(i<segs.length&&d>segs[i].len){d-=segs[i].len;i++;}if(i>=segs.length)i=segs.length-1;var s=segs[i],t=Math.min(d,s.len);return{x:s.ax+s.dx*t,y:s.ay+s.dy*t};}
function dist2(x,y,s){var px=x-s.ax,py=y-s.ay,t=px*s.dx+py*s.dy;t=Math.max(0,Math.min(s.len,t));var ex=s.ax+s.dx*t-x,ey=s.ay+s.dy*t-y;return ex*ex+ey*ey;}
function blocked(c,r){var x=c*CS+CS/2,y=r*CS+CS/2,i;for(i=0;i<segsG.length;i++){if(dist2(x,y,segsG[i])<529)return true;}for(i=0;i<segsA.length;i++){if(dist2(x,y,segsA[i])<400)return true;}return false;}
var money=0,lives=0,kills=0,wave=0,running=false,over=false;
var enemies=[],towers=[],shots=[],parts=[];
var toSpawn=[],spawnT=0,interT=0,phase='wait',banner=0,buildType='a';
function epos(e){return e.fly?posAtS(segsA,Math.min(e.d,PLENA)):posAtS(segsG,Math.min(e.d,PLENG));}
function makeWave(n){var arr=[],i;
if(n===12){arr.push({fly:false,hp:1500,mhp:1500,spd:24,rw:200,r:16,leak:4,boss:true});
for(i=0;i<6;i++)arr.push({fly:true,hp:200,mhp:200,spd:62,rw:16,r:10,leak:2,boss:false});return arr;}
var cnt=6+n,hg=26+13*n,ha=22+12*n,spd=42+1.6*n,rw=7+n,mode=n%3;
for(i=0;i<cnt;i++){var fly;if(mode===1)fly=false;else if(mode===2)fly=true;else fly=i%2===1;
arr.push({fly:fly,hp:fly?ha:hg,mhp:fly?ha:hg,spd:fly?spd+8:spd,rw:rw,r:fly?10:9,leak:fly?2:1,boss:false});}
return arr;}
function burst(x,y,c,n){var k;for(k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*110;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.5+Math.random()*2.5,c:c,life:0.35+Math.random()*0.3});}}
function reset(){money=150;lives=10;kills=0;wave=0;enemies=[];towers=[];shots=[];parts=[];toSpawn=[];spawnT=0;interT=1.5;phase='wait';banner=0;over=false;hud();}
function hud(){$i('gd').textContent=money;$i('lf').textContent=lives;$i('wv').textContent=wave+'/12';$i('kl').textContent=kills;}
function acquire(t){var best=null,bd=-1,i;for(i=0;i<enemies.length;i++){var e=enemies[i];if(e.hp<=0)continue;
var maxD=e.fly?PLENA:PLENG;if(e.d>=maxD)continue;
if(t.type==='a'&&e.fly)continue;if(t.type==='b'&&!e.fly)continue;
var p=epos(e);var dx=p.x-t.x,dy=p.y-t.y;if(dx*dx+dy*dy<=t.range*t.range&&e.d>bd){bd=e.d;best=e;}}return best;}
function gameOver(win){over=true;running=false;
if(win){$i('ovt').textContent='空地无虞!';$i('ovp').innerHTML='十二波敌军全部击退!<br>剩余生命:<b>'+lives+'</b> · 总击杀:<b>'+kills+'</b>';}
else{$i('ovt').textContent='防线崩溃…';$i('ovp').innerHTML='止步于第 '+wave+' 波<br>总击杀:<b>'+kills+'</b><br>提示:抬头看!虚线航线上需要专门的防空火力。';}
$i('obtn').textContent='再来一局';$i('overlay').classList.remove('hide');}
function update(dt){var i;
for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
if(banner>0)banner-=dt;
if(!running)return;
if(phase==='wait'){interT-=dt;if(interT<=0){wave++;toSpawn=makeWave(wave);spawnT=0.4;phase='spawn';banner=1.2;hud();}}
else{if(toSpawn.length>0){spawnT-=dt;if(spawnT<=0){var nx=toSpawn.shift();enemies.push(nx);spawnT=nx.boss?1.4:(nx.fly?0.6:0.75);}}}
for(i=enemies.length-1;i>=0;i--){var e=enemies[i];e.d+=e.spd*dt;
var maxD=e.fly?PLENA:PLENG;
if(e.d>=maxD){var lp=epos(e);lives-=e.leak;burst(lp.x,lp.y,'#ff6b6b',12);enemies.splice(i,1);hud();if(lives<=0){lives=0;hud();gameOver(false);return;}continue;}}
for(i=0;i<towers.length;i++){var t=towers[i];t.cool-=dt;
if(t.cool<=0){var tg=acquire(t);if(tg){var pp=epos(tg);t.ang=Math.atan2(pp.y-t.y,pp.x-t.x);t.cool=t.rate;shots.push({x:t.x,y:t.y,tg:tg,lx:pp.x,ly:pp.y,spd:380,dmg:t.dmg,aa:t.type==='b'});}else t.cool=0.06;}}
for(i=shots.length-1;i>=0;i--){var s=shots[i];var tx=s.lx,ty=s.ly;
if(s.tg&&s.tg.hp>0){var p2=epos(s.tg);s.lx=p2.x;s.ly=p2.y;tx=p2.x;ty=p2.y;}
var dx=tx-s.x,dy=ty-s.y,d=Math.sqrt(dx*dx+dy*dy),st=s.spd*dt;
if(d<=st+3){if(s.tg&&s.tg.hp>0)s.tg.hp-=s.dmg;shots.splice(i,1);}
else{s.x+=dx/d*st;s.y+=dy/d*st;}}
for(i=enemies.length-1;i>=0;i--){var e2=enemies[i];if(e2.hp<=0){var p3=epos(e2);kills++;money+=e2.rw;burst(p3.x,p3.y,e2.fly?'#7ad7ff':'#ffd166',9);enemies.splice(i,1);}}
if(phase==='spawn'&&toSpawn.length===0&&enemies.length===0){money+=30;hud();if(wave>=12){gameOver(true);return;}phase='wait';interT=3;}}
function drawSegs(segs,w1,c1,w2,c2){var i;ctx.lineCap='round';ctx.lineJoin='round';
ctx.strokeStyle=c1;ctx.lineWidth=w1;ctx.beginPath();ctx.moveTo(segs[0].ax,segs[0].ay);for(i=0;i<segs.length;i++){ctx.lineTo(segs[i].ax+segs[i].dx*segs[i].len,segs[i].ay+segs[i].dy*segs[i].len);}ctx.stroke();
if(w2){ctx.strokeStyle=c2;ctx.lineWidth=w2;ctx.stroke();}}
function draw(){var i;
var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e1a2e');g.addColorStop(1,'#0d1024');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(120,130,180,0.10)';
for(var c=0;c<12;c++)for(var r=0;r<9;r++){if(blocked(c,r))continue;ctx.fillRect(c*CS+CS/2-1,r*CS+CS/2-1,2,2);}
drawSegs(segsG,28,'#232a4a',20,'#2c3352');
ctx.strokeStyle='rgba(122,215,255,.4)';ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(-20,70);ctx.lineTo(500,70);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#7ad7ff';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText('空中航线',12,58);
ctx.fillStyle='#4cc9f0';ctx.beginPath();ctx.moveTo(-2,238);ctx.lineTo(14,250);ctx.lineTo(-2,262);ctx.closePath();ctx.fill();
var gp=posAtS(segsG,PLENG-26);
ctx.fillStyle='#7ee08a';ctx.fillRect(gp.x-13,gp.y-16,26,32);
ctx.fillStyle='#0f1220';ctx.fillRect(gp.x-5,gp.y-4,10,20);
for(i=0;i<towers.length;i++){var t=towers[i];
ctx.fillStyle='#2b3358';ctx.beginPath();ctx.arc(t.x,t.y,13,0,6.28);ctx.fill();
ctx.strokeStyle=t.type==='a'?'#b28dff':'#7ad7ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,13,0,6.28);ctx.stroke();
if(t.type==='a'){ctx.fillStyle='#b28dff';ctx.beginPath();ctx.moveTo(t.x-7,t.y+5);ctx.lineTo(t.x,t.y-8);ctx.lineTo(t.x+7,t.y+5);ctx.closePath();ctx.fill();}
else{ctx.strokeStyle='#7ad7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(t.x,t.y,6,-0.5,3.6);ctx.stroke();
ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.x+Math.cos(t.ang)*11,t.y+Math.sin(t.ang)*11);ctx.stroke();}}
for(i=0;i<enemies.length;i++){var e=enemies[i];var ep=epos(e);
if(e.fly){ctx.fillStyle=e.boss?'#ff6b6b':'#7ad7ff';
ctx.beginPath();ctx.moveTo(ep.x,ep.y-7);ctx.lineTo(ep.x+8,ep.y);ctx.lineTo(ep.x,ep.y+7);ctx.lineTo(ep.x-8,ep.y);ctx.closePath();ctx.fill();
ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(ep.x,ep.y+13,7,2.5,0,0,6.28);ctx.fill();}
else{ctx.fillStyle=e.boss?'#ff6b6b':'#ff9f68';ctx.beginPath();ctx.arc(ep.x,ep.y,e.r,0,6.28);ctx.fill();
ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;ctx.stroke();}
ctx.fillStyle='#402030';ctx.fillRect(ep.x-11,ep.y-e.r-9,22,4);
ctx.fillStyle='#7ee08a';ctx.fillRect(ep.x-11,ep.y-e.r-9,22*Math.max(0,e.hp/e.mhp),4);}
for(i=0;i<shots.length;i++){var s2=shots[i];ctx.fillStyle=s2.aa?'#c9f0ff':'#ffe9a8';ctx.fillRect(s2.x-2,s2.y-2,4,4);}
for(i=0;i<parts.length;i++){var p4=parts[i];ctx.globalAlpha=Math.max(0,p4.life*2.4);ctx.fillStyle=p4.c;ctx.beginPath();ctx.arc(p4.x,p4.y,p4.r,0,6.28);ctx.fill();}
ctx.globalAlpha=1;
ctx.fillStyle='#9aa3c0';ctx.font='11px system-ui';ctx.textAlign='left';
if(running&&!over){if(phase==='wait')ctx.fillText('下一波 '+Math.ceil(interT)+' 秒…',12,340);
if(banner>0){ctx.globalAlpha=Math.min(1,banner);ctx.fillStyle='#ffd166';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('第 '+wave+' 波来袭!',W/2,H/2+100);ctx.globalAlpha=1;ctx.font='11px system-ui';ctx.textAlign='left';}}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();
var rc=cv.getBoundingClientRect();var x=(e.clientX-rc.left)*W/rc.width,y=(e.clientY-rc.top)*H/rc.height;
if(!running||over)return;
var c=Math.floor(x/CS),r=Math.floor(y/CS);if(c<0||c>=12||r<0||r>=9)return;
var i;for(i=0;i<towers.length;i++){if(towers[i].c===c&&towers[i].r===r)return;}
if(blocked(c,r))return;
if(buildType==='a'){if(money<45)return;money-=45;towers.push({c:c,r:r,x:c*CS+CS/2,y:r*CS+CS/2,cool:0,type:'a',rate:0.75,range:88,dmg:14,ang:0});}
else{if(money<75)return;money-=75;towers.push({c:c,r:r,x:c*CS+CS/2,y:r*CS+CS/2,cool:0,type:'b',rate:0.85,range:125,dmg:24,ang:0});}
hud();});
function selType(ty){buildType=ty;$i('bA').classList.toggle('on',ty==='a');$i('bB').classList.toggle('on',ty==='b');}
$i('bA').addEventListener('click',function(){selType('a')});
$i('bB').addEventListener('click',function(){selType('b')});
$i('obtn').addEventListener('click',function(){$i('overlay').classList.add('hide');reset();running=true;});
segsG=mkSegs(PG);segsA=mkSegs(PAIR);PLENG=pathLen(segsG);PLENA=pathLen(segsA);reset();
var lastT=0;
function loop(t){var dt=(t-lastT)/1000;lastT=t;if(!(dt>0)||dt>0.05)dt=0.016;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>

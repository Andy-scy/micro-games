<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁板双面煎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#ff7a59;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#ff7a59;font-size:16px}
.stage{position:relative;background:#1c1420;border:2px solid #38222c;border-radius:12px;padding:14px}
.grill{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{background:#241a26;border:2px solid #3a2833;border-radius:10px;padding:10px;min-height:118px;cursor:pointer;text-align:center}
.slot .stk{width:86px;height:54px;margin:4px auto;border-radius:12px;background:#f0d9a8;box-shadow:inset 0 4px 10px rgba(0,0,0,.35)}
.sbar{height:10px;border-radius:5px;background:#111527;overflow:hidden;margin:6px 8px}
.sbar i{display:block;height:100%;width:0;background:#7ad0ff}
.stag{font-size:12px;color:#8b90b0}
.shint{font-size:13px;color:#e8b06a;font-weight:700;margin-top:2px}
.msg{height:22px;text-align:center;color:#fbbf24;font-size:15px;font-weight:700;margin-top:10px}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#ff7a59}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#ff7a59;color:#3a1108;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>铁板双面煎</h1>
  <p class="hint">铁板上会陆续出现牛排:<b style="color:#ff7a59">第一面金黄时点击翻面</b>,第二面金黄时点击起锅<br>同时照看多块牛排,煎糊一条扣一条命!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>出锅 <b id="served">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>生命 <b id="life">♥♥♥</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <div class="grill" id="grill"></div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">铁板双面煎</h2>
      <p id="ovDesc">每块牛排要翻一次面、起锅一次:进度条进入金黄段(55%~85%)时点击最划算。牛排越多越忙,出锅数越多火越猛,糊 3 条就收摊!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elScore=$("score"),elServed=$("served"),elCombo=$("combo"),elLife=$("life"),elBest=$("best");
var grill=$("grill"),msg=$("msg");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s804");
var state="menu",steaks,score,combo,lives,served,spawnT,lastT,msgT;
var slotEls=[];

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function buildGrill(){
  for(var i=0;i<4;i++){
    var d=document.createElement("div");
    d.className="slot";
    d.setAttribute("data-i",String(i));
    d.innerHTML='<div class="stk" style="display:none"></div><div class="sbar"><i></i></div><div class="stag">空位</div><div class="shint">&nbsp;</div>';
    grill.appendChild(d);
    slotEls.push({box:d,stk:d.children[0],fill:d.children[1].children[0],tag:d.children[2],hint:d.children[3]});
  }
}
function evalSide(d){
  if(d>=55&&d<=85)return 100;
  if(d>=40)return 45;
  return 10;
}
function reset(){
  steaks=[null,null,null,null];
  score=0;combo=0;lives=3;served=0;spawnT=0.6;
  msg.textContent="";msgT=0;render();updateHud();
}
function updateHud(){
  elScore.textContent=score;elServed.textContent=served;elCombo.textContent=combo;elBest.textContent=best;
  var s="";for(var i=0;i<lives;i++)s+="♥";elLife.textContent=s||"—";
}
function showMsg(t,c){msg.textContent=t;msg.style.color=c||"#fbbf24";msgT=1.3;}
function rate(){return Math.min(62,30+served*1.2);}
function maxActive(){return Math.min(4,2+Math.floor(served/4));}
function render(){
  for(var i=0;i<4;i++){
    var st=steaks[i],e=slotEls[i];
    if(!st){e.stk.style.display="none";e.fill.style.width="0";e.tag.textContent="空位";e.hint.innerHTML="&nbsp;";}
    else{
      e.stk.style.display="block";
      var l=Math.max(16,76-st.done*0.55);
      e.stk.style.background="hsl(33,62%,"+l+"%)";
      e.tag.textContent="第 "+(st.side+1)+" 面";
      e.hint.textContent=st.side===0?"点击翻面":"点击起锅";
    }
  }
}
function clearSlot(i){steaks[i]=null;}
function clickSlot(i){
  if(state!=="playing")return;
  var st=steaks[i];
  if(!st)return;
  if(st.side===0){
    st.q0=evalSide(st.done);
    if(st.q0===100)showMsg("第一面完美!");
    else showMsg("这一面差了火候…","#e8b06a");
    st.side=1;st.done=0;
  }else{
    var q1=evalSide(st.done);
    var pts=Math.round((st.q0+q1)/2);
    if(st.q0===100&&q1===100){combo++;pts+=20*combo;showMsg("双面金黄!连击 x"+combo,"#4ade80");}
    else{combo=0;showMsg("出锅 +"+pts,"#e8eaf6");}
    score+=pts;served++;clearSlot(i);updateHud();
  }
  render();
}
function burnOut(i){
  if(state!=="playing")return;
  lives--;combo=0;clearSlot(i);
  showMsg("牛排煎糊了!","#f87171");
  updateHud();
  if(lives<=0)gameOver("糊了三条牛排,后厨炸锅啦!");
}
function gameOver(reason){
  state="over";
  if(score>best){best=score;saveBest("mg_s804",best);}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=reason;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  render();updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(msgT>0){msgT-=dt/1000;if(msgT<=0){msg.textContent="";msgT=0;}}
  if(state!=="playing")return;
  var i,active=0;
  for(i=0;i<4;i++)if(steaks[i])active++;
  spawnT-=dt/1000;
  if(spawnT<=0){
    spawnT=Math.max(1.1,2.6-served*0.07);
    if(active<maxActive()){
      var empties=[];
      for(i=0;i<4;i++)if(!steaks[i])empties.push(i);
      if(empties.length)steaks[empties[(Math.random()*empties.length)|0]]={side:0,done:0,q0:0};
    }
  }
  for(i=0;i<4;i++){
    var st=steaks[i];
    if(st){
      st.done+=rate()*dt/1000;
      if(st.done>=100){st.done=100;render();burnOut(i);}
    }
  }
  render();
}
grill.addEventListener("click",function(e){
  var n=e.target;
  while(n&&n!==grill&&!n.getAttribute("data-i"))n=n.parentNode;
  if(n&&n!==grill)clickSlot(parseInt(n.getAttribute("data-i"),10));
});
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.code==="Space"){
    e.preventDefault();
    if(state!=="playing")startGame();
  }
});
btnGo.addEventListener("click",startGame);
buildGrill();
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

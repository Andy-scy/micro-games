<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二段跳之塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:460px}
h1{font-size:22px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:12px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:8px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:11px}
.big{font-size:16px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.tb{flex:1;padding:12px 0;font-size:16px;background:#232a4a;color:#e8eaf6;border:0;border-radius:10px;touch-action:none;user-select:none;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>二段跳之塔</h1>
  <p class="tips">←→ 移动,空格跳跃;空中再按一次空格触发二段跳。蹬上高塔顶端摘下星星,摔落会回到上次落脚点。</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">高度</div><div class="big" id="ht">0m</div></div>
    <div class="stat"><div class="mut">金币</div><div class="big" id="co">0</div></div>
    <div class="stat"><div class="mut">剩余跳跃</div><div class="big" id="jp">●●</div></div>
    <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
  </div></div>
  <div class="card"><canvas id="cv" width="420" height="560"></canvas></div>
  <div class="card row">
    <button class="tb" id="bL">◀</button><button class="tb" id="bR">▶</button><button class="tb" id="bJ">跳</button>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">二段跳之塔</h2><p id="ovp">玩法说明:<br>· ←→ / A D 移动,空格 / ↑ 跳跃<br>· 空中再按一次跳跃键 = 二段跳,腾空更高更远<br>· 高处的台阶间距很大,必须靠二段跳衔接<br>· 顺路收金币,每个 +20 分<br>· 摔下屏幕 -1 生命,回到上次稳定落脚点<br>· 登顶摘星 +500 分,共 3 条生命</p><button class="btn" id="obtn">开始攀登</button></div></div>
<script>
'use strict';
var W=420,H=560,WORLD=2600;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $i(id){return document.getElementById(id)}
var plats=[],coins=[],base;
var px=190,py=2494,vx=0,vy=0,pw=22,ph=26,onG=false,jumps=0,face=1;
var camY=2040,score=0,coinsGot=0,lives=3,bestH=0;
var safeX=190,safeY=2450,groundT=0;
var running=false,lastT=0,parts=[],win=false,winT=0;
var keys={L:false,R:false,J:false},jHeld=false;
var flag={x:172,y:46,w:36,h:44};
function genTower(){
  plats=[];coins=[];
  base={x:60,y:2520,w:300,h:20};
  var y=2400,i=0;
  while(y>=150){
    var w=76+((i*29)%42);
    var x=(i%2===0)?40+((i*23)%100):300-((i*31)%140)-(w-76);
    if(x<30)x=30;if(x+w>W-30)x=W-30-w;
    plats.push({x:x,y:y,w:w,h:14});
    if(i%3===1)coins.push({x:x+w/2,y:y-34,got:false});
    y-=(i%4===3)?145:95+((i*13)%25);
    i++;
  }
  plats.push({x:150,y:100,w:120,h:14});
}
function reset(){
  genTower();
  px=190;py=2494;vx=0;vy=0;jumps=0;camY=WORLD-H;
  score=0;coinsGot=0;lives=3;bestH=2520;parts=[];win=false;winT=0;
  safeX=190;safeY=2450;groundT=0;
  hud();
}
function hud(){
  $i('ht').textContent=Math.max(0,Math.round((2520-py-ph)/10))+'m';
  $i('co').textContent=coinsGot;
  $i('jp').textContent=onG?'●●':(jumps===1?'●○':'○○');
  var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';
  $i('hp').textContent=h;
}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=Math.random()*6.28,s=40+Math.random()*120;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*2.5,c:c,life:0.3+Math.random()*0.3});}
}
function hitRect(s){return px<s.x+s.w&&px+pw>s.x&&py<s.y+s.h&&py+ph>s.y}
function endGame(){
  running=false;
  if(win){$i('ovt').textContent='登顶摘星!';$i('ovp').innerHTML='爬到了塔顶!<br>最终得分:<b>'+score+'</b><br>最高高度:<b>'+Math.max(0,Math.round((2520-bestH)/10))+'m</b>';}
  else{$i('ovt').textContent='力竭坠落…';$i('ovp').innerHTML='塔还在那里,再爬一次。<br>最终得分:<b>'+score+'</b><br>最高高度:<b>'+Math.max(0,Math.round((2520-bestH)/10))+'m</b>';}
  $i('obtn').textContent='再来一局';
  $i('overlay').classList.remove('hide');
}
function physics(dt){
  var acc=1500,mx=215;
  if(keys.L){vx-=acc*dt;face=-1}
  if(keys.R){vx+=acc*dt;face=1}
  if(!keys.L&&!keys.R)vx-=vx*Math.min(1,10*dt);
  if(vx>mx)vx=mx;if(vx<-mx)vx=-mx;
  if(keys.J&&!jHeld){
    if(onG){vy=-560;jumps=1;onG=false;burst(px+pw/2,py+ph,'#7f8ab0',3)}
    else if(jumps<2){vy=-545;jumps=2;burst(px+pw/2,py+ph/2,'#ffd166',8)}
  }
  vy+=1500*dt;if(vy>920)vy=920;
  px+=vx*dt;
  var i,s;
  for(i=0;i<plats.length;i++){s=plats[i];
    if(hitRect(s)){if(vx>0)px=s.x-pw;else if(vx<0)px=s.x+s.w;vx=0;}
  }
  if(hitRect(base)){if(vx>0)px=base.x-pw;else if(vx<0)px=base.x+base.w;vx=0;}
  if(px<2)px=2;if(px+pw>W-2)px=W-2-pw;
  py+=vy*dt;onG=false;
  for(i=0;i<plats.length;i++){s=plats[i];
    if(hitRect(s)){
      if(vy>0){py=s.y-ph;vy=0;onG=true;jumps=0;}
      else if(vy<0){py=s.y+s.h;vy=0;}
    }}
  if(hitRect(base)&&vy>0&&py+ph>base.y){py=base.y-ph;vy=0;onG=true;jumps=0;}
  if(onG){groundT+=dt;if(groundT>0.25){safeX=px;safeY=py-30;groundT=0;}}
  else groundT=0;
}
function update(dt){
  var i;
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  if(!running)return;
  if(win){winT+=dt;if(winT>1.4){score+=500;hud();endGame();}return;}
  physics(dt);
  if(py<bestH)bestH=py;
  var target=py-320;
  if(target<camY)camY=target;
  if(camY<0)camY=0;
  for(i=0;i<coins.length;i++){var c=coins[i];
    if(c.got)continue;
    var dx=c.x-(px+pw/2),dy=c.y-(py+ph/2);
    if(dx*dx+dy*dy<24*24){c.got=true;coinsGot++;score+=20;burst(c.x,c.y,'#ffd166',6);hud();}
  }
  if(px+pw>flag.x&&px<flag.x+flag.w&&py+ph>flag.y&&py<flag.y+flag.h){
    win=true;burst(flag.x+flag.w/2,flag.y+flag.h/2,'#ffe9a3',20);
  }
  if(py>camY+H+40){
    lives--;hud();burst(px+pw/2,camY+H-8,'#ff5c5c',12);
    if(lives<=0){lives=0;hud();endGame();return;}
    px=safeX;py=safeY;vx=0;vy=0;jumps=2;
    camY=py-320;if(camY<0)camY=0;if(camY>WORLD-H)camY=WORLD-H;
  }
  hud();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#10162e');g.addColorStop(1,'#0a0e22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<30;i++){
    var sy=((i*127+50)-camY*0.25)%(H+60);
    if(sy<0)sy+=H+60;
    ctx.globalAlpha=0.2+0.18*Math.sin(i*1.3+Date.now()*0.0012);
    ctx.fillStyle='#9db2e8';ctx.fillRect((i*211+30)%W,sy,2,2);
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(0,-Math.round(camY));
  ctx.fillStyle='rgba(255,233,163,.9)';
  ctx.beginPath();ctx.arc(W/2,20,26,0,6.28);ctx.fill();
  ctx.fillStyle='rgba(255,233,163,.12)';
  ctx.beginPath();ctx.arc(W/2,20,52,0,6.28);ctx.fill();
  ctx.fillStyle='#39415f';
  for(i=0;i<plats.length;i++){var s=plats[i];
    var sy2=s.y;
    ctx.fillStyle='#2e3a63';ctx.fillRect(s.x,sy2,s.w,s.h);
    ctx.fillStyle='#6d7fc0';ctx.fillRect(s.x,sy2,s.w,3);
  }
  ctx.fillStyle='#2a3358';ctx.fillRect(base.x,base.y,base.w,base.h);
  ctx.fillStyle='#5d6ba8';ctx.fillRect(base.x,base.y,base.w,3);
  for(i=0;i<coins.length;i++){var c=coins[i];
    if(c.got)continue;
    var r=6+Math.abs(Math.sin(Date.now()*0.003+i))*1.5;
    ctx.beginPath();ctx.arc(c.x,c.y,r,0,6.28);
    ctx.fillStyle='#ffd166';ctx.fill();
    ctx.strokeStyle='#fff1c4';ctx.lineWidth=1.5;ctx.stroke();
  }
  ctx.fillStyle='#ffd166';
  ctx.fillRect(flag.x,flag.y,flag.w,5);
  ctx.beginPath();ctx.moveTo(flag.x+flag.w,flag.y+2);
  ctx.lineTo(flag.x+flag.w-14,flag.y+10);ctx.lineTo(flag.x+flag.w,flag.y+18);ctx.fill();
  ctx.fillRect(flag.x+flag.w/2-2,flag.y,4,flag.h);
  ctx.fillStyle='#8fd3ff';
  ctx.beginPath();
  if(px+2<W&&py>0){
    ctx.moveTo(px+pw/2,py);
    ctx.lineTo(px+pw,py+6);ctx.lineTo(px+pw,py+ph);ctx.lineTo(px,py+ph);ctx.lineTo(px,py+6);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#081226';
  ctx.fillRect(px+pw*0.28,py+8,4,5);
  ctx.fillRect(px+pw*0.62,py+8,4,5);
  for(i=0;i<parts.length;i++){var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2.4);
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.font='12px system-ui';ctx.fillStyle='#7f8ab0';ctx.textAlign='left';
  ctx.fillText(onG?'地面:二段跳可用':'空中剩余跳跃:'+(2-jumps),10,H-10);
}
function bindBtn(id,prop){
  var b=$i(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[prop]=true});
  b.addEventListener('pointerup',function(e){e.preventDefault();keys[prop]=false});
  b.addEventListener('pointercancel',function(){keys[prop]=false});
  b.addEventListener('pointerleave',function(){keys[prop]=false});
}
bindBtn('bL','L');bindBtn('bR','R');bindBtn('bJ','J');
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keys.J=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.J=false;
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  jHeld=keys.J;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

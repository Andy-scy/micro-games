<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二段跳忍者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:700px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#c084fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#c084fc;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#c084fc}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#c084fc;color:#1d1030;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>二段跳忍者</h1>
  <p class="hint">空格 / ↑ / 点按 跳跃 · 空中再按一次可二段跳 · 高塔要二段跳,裂缝别掉下去</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>剩余跳 <b id="jp">2</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="640" height="300"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">二段跳忍者</h2>
      <p id="ovDesc">月夜屋檐上的忍者拥有二段跳:矮墙一跳就过,高塔要空中再蹬一次,地面裂缝一旦掉下去就完了!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d"),W=640,H=300,GY=252;
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elScore=$("score"),elJp=$("jp"),elBest=$("best");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s423");
var state="menu",dist,score,speed,obs,px,py,vy,grounded,jumps,nextGap,coyote,phase,rings,scarf;
function rr(x,y,w,h,r){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function reset(){
  dist=0;score=0;speed=300;obs=[];px=90;py=GY-42;vy=0;grounded=true;
  jumps=2;nextGap=430;coyote=0;phase=0;rings=[];scarf=[];
  var i;for(i=0;i<5;i++)scarf.push({x:px,y:py+10});
  elBest.textContent=best;
}
function updateHud(){elScore.textContent=score;elJp.textContent=jumps;}
function doJump(){
  if(state!=="playing")return;
  if(grounded||coyote>0){vy=-520;grounded=false;coyote=0;jumps=1;}
  else if(jumps>0){vy=-500;jumps--;rings.push({x:px+13,y:py+40,life:0.3});}
}
function gameOver(msg){
  state="over";
  if(score>best){best=score;saveBest("mg_s423",best);elBest.textContent=best;}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function overPit(){
  var i,o,cx=px+13;
  for(i=0;i<obs.length;i++){
    o=obs[i];
    if(o.type==="pit"&&cx>o.x&&cx<o.x+o.w)return true;
  }
  return false;
}
function update(dt){
  var s=dt/1000,i,o;
  speed=Math.min(560,300+dist*0.018);
  dist+=speed*s;score=Math.floor(dist/10);
  phase+=s*(grounded?speed*0.05:4);
  var onPit=overPit();
  if(grounded&&onPit){grounded=false;coyote=0.09;vy=0;}
  if(!grounded){
    if(coyote>0)coyote-=s;
    vy+=2200*s;py+=vy*s;
    if(py>=GY-42&&!onPit){py=GY-42;vy=0;grounded=true;jumps=2;}
    else if(py>=GY-42&&grounded===false&&vy>0&&!onPit){py=GY-42;vy=0;grounded=true;jumps=2;}
  }
  if(py+42>GY+30&&onPit){gameOver("坠入了深不见底的裂缝!");return;}
  nextGap-=speed*s;
  if(nextGap<=0){
    var r=Math.random();
    if(r<0.3){
      var pw=70+Math.random()*55;
      obs.push({x:W+30,type:"pit",w:pw,h:0});
      nextGap=pw+240+Math.random()*160;
    }else if(r<0.58){
      obs.push({x:W+30,type:"tower",w:26,h:70+Math.random()*24,y:0});
      nextGap=240+Math.random()*220+speed*0.3;
    }else{
      obs.push({x:W+30,type:"block",w:24,h:32+Math.random()*10,y:0});
      nextGap=200+Math.random()*240+speed*0.3;
    }
  }
  var b={x:px,y:py,w:26,h:42};
  for(i=obs.length-1;i>=0;i--){
    o=obs[i];o.x-=speed*s;
    if(o.x<-160){obs.splice(i,1);continue;}
    if(o.type==="pit")continue;
    var oy=GY-o.h;
    if(b.x+b.w>o.x+3&&b.x<o.x+o.w-3&&b.y+b.h>oy+3){gameOver("撞上了障碍,忍者也会疼!");return;}
  }
  for(i=rings.length-1;i>=0;i--){
    rings[i].life-=s;rings[i].y+=40*s;
    if(rings[i].life<=0)rings.splice(i,1);
  }
  for(i=scarf.length-1;i>0;i--){
    scarf[i].x+=((scarf[i-1].x-16)-scarf[i].x)*Math.min(1,12*s);
    scarf[i].y+=((scarf[i-1].y+Math.sin(phase*0.7+i)*2)-scarf[i].y)*Math.min(1,12*s);
  }
  scarf[0].x=px-2;scarf[0].y=py+10;
  updateHud();
}
function drawObstacle(o){
  if(o.type==="pit"){
    var g=ctx.createLinearGradient(0,GY,0,H);
    g.addColorStop(0,"#05060e");g.addColorStop(1,"#1a0b2e");
    ctx.fillStyle=g;ctx.fillRect(o.x,GY,o.w,H-GY);
    ctx.strokeStyle="rgba(192,132,252,.35)";
    ctx.beginPath();ctx.moveTo(o.x,GY);ctx.lineTo(o.x,H);ctx.moveTo(o.x+o.w,GY);ctx.lineTo(o.x+o.w,H);ctx.stroke();
    ctx.fillStyle="#c084fc";
    ctx.beginPath();ctx.moveTo(o.x+8,H);ctx.lineTo(o.x+16,H-12);ctx.lineTo(o.x+24,H);ctx.fill();
    ctx.beginPath();ctx.moveTo(o.x+o.w-30,H);ctx.lineTo(o.x+o.w-22,H-14);ctx.lineTo(o.x+o.w-14,H);ctx.fill();
  }else if(o.type==="tower"){
    ctx.fillStyle="#5a3d8f";
    rr(o.x,GY-o.h,o.w,o.h,4);ctx.fill();
    ctx.fillStyle="#7c5cbf";
    ctx.fillRect(o.x+3,GY-o.h+6,o.w-6,4);
    ctx.fillRect(o.x+3,GY-o.h+o.h/2,o.w-6,4);
  }else{
    ctx.fillStyle="#6b4fa5";
    rr(o.x,GY-o.h,o.w,o.h,4);ctx.fill();
    ctx.fillStyle="#4d3580";
    ctx.fillRect(o.x+3,GY-o.h+4,o.w-6,3);
  }
}
function draw(){
  var i,g,grd;
  grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#131028");grd.addColorStop(1,"#251a40");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.5)";
  for(i=0;i<30;i++){
    ctx.globalAlpha=0.2+0.5*Math.abs(Math.sin(i*3.1+dist*0.003));
    ctx.fillRect((i*173+60)%W,(i*67)%130,2,2);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#f5edd6";ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(560,56,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#131028";ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(570,48,20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle="#241d3d";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#c084fc";ctx.globalAlpha=0.4;ctx.fillRect(0,GY,W,2);ctx.globalAlpha=1;
  var dsh=dist%90;
  ctx.fillStyle="rgba(255,255,255,.08)";
  for(i=0;i<9;i++)ctx.fillRect(i*90-dsh,GY+20,40,3);
  for(i=0;i<obs.length;i++)drawObstacle(obs[i]);
  for(i=0;i<rings.length;i++){
    g=rings[i];ctx.strokeStyle="rgba(192,132,252,"+(g.life*3)+")";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(g.x,g.y,14+(0.3-g.life)*80,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
  }
  ctx.strokeStyle="#e879b0";ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(scarf[0].x,scarf[0].y);
  for(i=1;i<scarf.length;i++)ctx.lineTo(scarf[i].x,scarf[i].y);
  ctx.stroke();ctx.lineWidth=1;ctx.lineCap="butt";
  ctx.fillStyle="#312b52";
  rr(px,py+12,26,28,6);ctx.fill();
  rr(px+8,py,20,18,5);ctx.fill();
  ctx.fillStyle="#12102a";
  ctx.fillRect(px+2,py+8,22,5);
  ctx.fillStyle="#7ef0d0";
  ctx.fillRect(px+19,py+6,4,3);
  ctx.fillStyle="#26204a";
  if(grounded){ctx.fillRect(px+4,py+38,8,5);ctx.fillRect(px+15,py+38,8,5);}
  else{ctx.fillRect(px+3,py+34,9,6);ctx.fillRect(px+14,py+38,9,4);}
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k===" "||k==="ArrowUp")e.preventDefault();
  if(state!=="playing"){if(k===" "||k==="Enter")startGame();return;}
  if(k===" "||k==="ArrowUp"||k==="w"||k==="W"){if(!e.repeat)doJump();}
});
cv.addEventListener("touchstart",function(e){e.preventDefault();doJump();},{passive:false});
cv.addEventListener("mousedown",function(){doJump();});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

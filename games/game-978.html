<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>垂钓比大</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#0f1a30;touch-action:none;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>垂钓比大</h1>
<div id="tip">下钩收线,鱼越大分越高!玩家1:按住 S 下钩,松开自动上浮 · 玩家2:按住 ↓ 下钩 · 小鱼 +1,中鱼 +3,大鱼 +6,水雷 -3 千万别碰 · 60 秒后分高者胜(触屏:按住己方半屏下钩)</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">垂钓比大</div><div id="ovS">两边鱼塘出鱼完全公平,拼的是下钩时机<br>玩家1:按住 S 放线,松开收线 · 玩家2:按住 ↓ 放线<br>小鱼 +1 · 中鱼 +3 · 大鱼 +6 · 水雷 -3<br>60 秒倒计时结束后得分高者获胜</div><button id="ovB">开始垂钓</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var keys={},st,touchD=[false,false];
var BX=[180,540];
function mkFish(side){
 var t=Math.random(),type,r,pts,spd,col;
 if(t<0.42){type=0;r=9;pts=1;spd=1.2+Math.random()*0.8;col="#4fd1c5";}
 else if(t<0.78){type=1;r=13;pts=3;spd=1.6+Math.random()*0.8;col="#f6c945";}
 else if(t<0.92){type=2;r=18;pts=6;spd=0.9+Math.random()*0.6;col="#ff9f5c";}
 else{type=3;r=11;pts=-3;spd=1.4+Math.random()*0.6;col="#5a628c";}
 var lo=side===0?10:370,hi=side===0?350:710;
 return{x:lo+Math.random()*(hi-lo),y:110+Math.random()*310,vx:(Math.random()<0.5?-1:1)*spd,type:type,r:r,pts:pts,col:col};
}
function reset(){
 st={ph:"count",cd:60,t:3600,score:[0,0],fish:[[],[]],hook:[{y:70,f:null},{y:70,f:null}],spawn:[20,26],pops:[]};
 st.fish[0].push(mkFish(0));st.fish[1].push(mkFish(1));
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function addPop(x,y,txt,col){st.pops.push({x:x,y:y,txt:txt,col:col,t:55});}
function step(dt){
 var i,j;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.t-=dt;
  if(st.t<=0){
   st.ph="over";
   var s0=st.score[0],s1=st.score[1];
   show(s0===s1?"平分秋色,平局!":(s0>s1?"玩家1 获胜!":"玩家2 获胜!"),"最终得分 "+s0+" : "+s1);
   return;
  }
  for(i=0;i<2;i++){
   st.spawn[i]-=dt;
   if(st.spawn[i]<=0&&st.fish[i].length<7){
    st.spawn[i]=34+Math.random()*22;
    st.fish[i].push(mkFish(i));
   }
   var h=st.hook[i],down=keys[i===0?"s":"arrowdown"]||touchD[i];
   if(h.f){
    h.y-=5*dt;
    if(h.y<=70){
     st.score[i]+=h.f.pts;
     addPop(BX[i],80,"+"+h.f.pts,"#f6c945");
     h.f=null;h.y=70;
    }
   }else{
    if(down)h.y+=3.2*dt;else h.y-=2.6*dt;
    if(h.y<70)h.y=70;
    if(h.y>442)h.y=442;
    for(j=st.fish[i].length-1;j>=0;j--){
     var f=st.fish[i][j];
     if(Math.hypot(f.x-BX[i],f.y-(h.y+10))<f.r+10){
      if(f.pts<0){
       st.score[i]=Math.max(0,st.score[i]+f.pts);
       addPop(f.x,f.y,f.pts+" 水雷!","#ff5c7a");
      }else{
       h.f=f;
       addPop(f.x,f.y,"咬钩!","#e9edf8");
      }
      st.fish[i].splice(j,1);
      break;
     }
    }
   }
   var lo=i===0?10:370,hi=i===0?350:710;
   for(j=0;j<st.fish[i].length;j++){
    var ff=st.fish[i][j];
    ff.x+=ff.vx*dt;
    if(ff.x<lo-30)ff.x=hi+20;
    if(ff.x>hi+30)ff.x=lo-20;
   }
  }
 }
 for(j=st.pops.length-1;j>=0;j--){
  var p=st.pops[j];
  p.y-=0.6*dt;p.t-=dt;
  if(p.t<=0)st.pops.splice(j,1);
 }
}
function drawFish(f,dir,fx,fy){
 var dx=fx===undefined?f.x:fx,dy=fy===undefined?f.y:fy;
 ctx.fillStyle=f.col;
 ctx.beginPath();ctx.ellipse(dx,dy,f.r,f.r*0.6,0,0,6.2832);ctx.fill();
 ctx.beginPath();
 ctx.moveTo(dx-dir*f.r,dy);
 ctx.lineTo(dx-dir*(f.r+9),dy-7);
 ctx.lineTo(dx-dir*(f.r+9),dy+7);
 ctx.closePath();ctx.fill();
 if(f.type===3){
  ctx.strokeStyle="#8a92c4";ctx.lineWidth=2;
  var k;
  for(k=0;k<6;k++){
   var a=k*1.047;
   ctx.beginPath();ctx.moveTo(dx+Math.cos(a)*(f.r+2),dy+Math.sin(a)*(f.r+2));
   ctx.lineTo(dx+Math.cos(a)*(f.r+6),dy+Math.sin(a)*(f.r+6));ctx.stroke();
  }
  ctx.fillStyle="#0f1220";ctx.fillRect(dx-4,dy-2,3,3);ctx.fillRect(dx+1,dy-2,3,3);
 }else{
  ctx.fillStyle="#0f1220";
  ctx.beginPath();ctx.arc(dx+dir*f.r*0.4,dy-2,2,0,6.2832);ctx.fill();
 }
}
function drawBoat(i){
 var x=BX[i];
 ctx.fillStyle="#7a5a2a";
 ctx.beginPath();ctx.moveTo(x-30,52);ctx.lineTo(x+30,52);ctx.lineTo(x+20,66);ctx.lineTo(x-20,66);ctx.closePath();ctx.fill();
 ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";
 ctx.fillRect(x-4,34,8,18);
 ctx.beginPath();ctx.arc(x,30,5,0,6.2832);ctx.fill();
}
function draw(){
 ctx.clearRect(0,0,720,480);
 var g=ctx.createLinearGradient(0,60,0,480);
 g.addColorStop(0,"#1a2c50");g.addColorStop(1,"#0d1530");
 ctx.fillStyle="#1b2138";ctx.fillRect(0,0,720,60);
 ctx.fillStyle=g;ctx.fillRect(0,60,720,420);
 ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,60);ctx.lineTo(720,60);ctx.stroke();
 ctx.setLineDash([8,8]);ctx.strokeStyle="rgba(255,255,255,.15)";
 ctx.beginPath();ctx.moveTo(360,60);ctx.lineTo(360,480);ctx.stroke();
 ctx.setLineDash([]);
 var i,j;
 for(i=0;i<2;i++){
  drawBoat(i);
  var h=st.hook[i];
  ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(BX[i],44);ctx.lineTo(BX[i],h.y);ctx.stroke();
  ctx.beginPath();ctx.arc(BX[i]-4,h.y+6,5,-0.5,3.6);ctx.stroke();
  if(h.f){
   drawFish(h.f,1);
  }
  for(j=0;j<st.fish[i].length;j++)drawFish(st.fish[i][j],st.fish[i][j].vx>0?1:-1);
 }
 for(j=0;j<st.pops.length;j++){
  var p=st.pops[j];
  ctx.globalAlpha=Math.min(1,p.t/25);
  ctx.fillStyle=p.col;ctx.font="bold 15px system-ui";ctx.textAlign="center";
  ctx.fillText(p.txt,p.x,p.y);
  ctx.globalAlpha=1;
 }
 ctx.font="bold 16px system-ui";ctx.textBaseline="top";
 ctx.textAlign="left";ctx.fillStyle="#4fd1c5";ctx.fillText("玩家1:"+st.score[0]+" 分",14,10);
 ctx.textAlign="right";ctx.fillStyle="#f6ad55";ctx.fillText(st.score[1]+" 分:玩家2",706,10);
 ctx.textAlign="center";ctx.fillStyle="#e9edf8";
 ctx.fillText(Math.max(0,Math.ceil(st.t/60))+" 秒",360,10);
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 42px system-ui";
  ctx.fillText("抛竿!",360,180);
  ctx.font="bold 26px system-ui";
  ctx.fillText(String(Math.ceil(st.cd/20)),360,240);
 }
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
function updTouch(e){
 e.preventDefault();
 touchD=[false,false];
 var r=cv.getBoundingClientRect(),i;
 for(i=0;i<e.touches.length;i++){
  var x=(e.touches[i].clientX-r.left)/r.width*720;
  var y=(e.touches[i].clientY-r.top)/r.height*480;
  if(y>100){
   if(x<360)touchD[0]=true;else touchD[1]=true;
  }
 }
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 keys[k]=true;
});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
cv.addEventListener("touchstart",updTouch,{passive:false});
cv.addEventListener("touchmove",updTouch,{passive:false});
cv.addEventListener("touchend",updTouch,{passive:false});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纵横有道</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--ink:#eef1ff;--dim:#9aa3c7;--acc:#f6ad55;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;}
.wrap{width:100%;max-width:430px;text-align:center;}
h1{font-size:22px;letter-spacing:3px;margin-bottom:6px;}
.tip{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:10px;}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;color:var(--dim);}
.bar b{color:var(--acc);font-size:15px;}
.btn{background:var(--acc);border:none;border-radius:8px;color:#2b1a06;font-family:inherit;font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;}
.btn.ghost{background:#2a3154;color:var(--ink);}
.frame{position:relative;width:100%;padding-top:100%;}
.board{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--card);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 1px #2c3560;touch-action:none;}
.board.ready .tile{transition:left .12s ease,top .12s ease;}
.board.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(145deg,#3a3148,#2d263a);color:var(--ink);font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 8px rgba(0,0,0,.28);}
.warn{color:var(--acc);font-size:13px;height:20px;margin-top:8px;font-weight:700;}
.foot{color:var(--dim);font-size:12px;line-height:1.7;margin-top:6px;}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(7,9,20,.8);display:none;align-items:center;justify-content:center;z-index:20;}
.overlay.show{display:flex;}
.panel{background:var(--card);border:1px solid #2c3560;border-radius:16px;padding:28px 32px;text-align:center;max-width:86vw;box-shadow:0 16px 50px rgba(0,0,0,.55);}
.panel h2{color:var(--acc);font-size:24px;letter-spacing:2px;margin-bottom:10px;}
.panel p{color:var(--dim);font-size:14px;line-height:1.9;margin-bottom:18px;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <h1>纵横有道</h1>
  <p class="tip">移动限制局:横向滑动和纵向滑动必须严格交替,不能连续两次同向移动。把 1–15 复原成标准顺序。</p>
  <div class="bar">
    <span>步数 <b id="stMoves">0</b></span>
    <span>本步要求 <b id="stAxis">任意</b></span>
    <span>归位 <b id="stFit">0/15</b></span>
    <button class="btn ghost" id="resetBtn">重开</button>
  </div>
  <div class="frame"><div class="board" id="board"></div></div>
  <p class="warn" id="warn"></p>
  <p class="foot">点击空格旁的方块或用方向键滑动;上一步横移,这一步就必须纵移,反之亦然。打乱同样遵循此律,局局必有解。</p>
</div>
<div class="overlay" id="overlay"><div class="panel">
  <h2 id="ovTitle"></h2>
  <p id="ovInfo"></p>
  <button class="btn" id="againBtn">再来一局</button>
</div></div>
<script>
(function(){
'use strict';
const N=4,TOTAL=N*N,K=120;
const goal=[];for(let i=0;i<TOTAL;i++)goal.push((i+1)%TOTAL);
let tiles=goal.slice(),els=[],moves=0,playing=false,startAt=0,lastAxis=null,warnTimer=0;
const boardEl=document.getElementById('board');
const movesEl=document.getElementById('stMoves'),axisEl=document.getElementById('stAxis'),fitEl=document.getElementById('stFit'),warnEl=document.getElementById('warn');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovInfo=document.getElementById('ovInfo');
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s;}
function axisOf(a,b){return ((a/N)|0)===((b/N)|0)?'h':'v';}
function buildTiles(){boardEl.innerHTML='';boardEl.classList.remove('ready');els=[];for(let v=1;v<TOTAL;v++){const el=document.createElement('div');el.className='tile';el.textContent=v;el.dataset.v=v;el.style.width=(100/N)+'%';el.style.height=(100/N)+'%';boardEl.appendChild(el);els[v]=el;}}
function setPos(v,idx){const r=(idx/N)|0,c=idx%N;els[v].style.left=(c*100/N)+'%';els[v].style.top=(r*100/N)+'%';}
function placeAll(){for(let i=0;i<TOTAL;i++)if(tiles[i])setPos(tiles[i],i);}
function blankIdx(){return tiles.indexOf(0);}
function slide(idx){const b=blankIdx(),br=(b/N)|0,bc=b%N,r=(idx/N)|0,c=idx%N;if(Math.abs(br-r)+Math.abs(bc-c)!==1)return false;tiles[b]=tiles[idx];tiles[idx]=0;setPos(tiles[b],b);return true;}
function isSolved(){for(let i=0;i<TOTAL;i++)if(tiles[i]!==goal[i])return false;return true;}
function countFit(){let k=0;for(let i=0;i<TOTAL;i++)if(tiles[i]&&tiles[i]===goal[i])k++;return k+'/15';}
function scramble(k){
  let la=null;
  do{
    for(let s=0;s<k;s++){
      const b=blankIdx(),br=(b/N)|0,bc=b%N;
      const opts=[];
      if(br>0)opts.push(b-N);if(br<N-1)opts.push(b+N);if(bc>0)opts.push(b-1);if(bc<N-1)opts.push(b+1);
      let cands=opts;
      if(la!==null)cands=opts.filter(function(x){return axisOf(b,x)!==la;});
      if(!cands.length)continue;
      const pick=cands[(Math.random()*cands.length)|0];
      tiles[b]=tiles[pick];tiles[pick]=0;
      la=axisOf(b,pick);
    }
  }while(isSolved());
}
function updateAxis(){
  axisEl.textContent=lastAxis===null?'任意':(lastAxis==='h'?'纵向 ↑↓':'横向 ←→');
}
function reject(){
  warnEl.textContent='不行,本步必须'+(lastAxis==='h'?'纵向 ↑↓':'横向 ←→')+'移动!';
  boardEl.classList.add('shake');
  clearTimeout(warnTimer);
  warnTimer=setTimeout(function(){boardEl.classList.remove('shake');warnEl.textContent='';},900);
}
function hud(){movesEl.textContent=moves;fitEl.textContent=countFit();}
function afterMove(){moves++;hud();if(isSolved())finish();}
function finish(){
  playing=false;
  const sec=(Date.now()-startAt)/1000;
  ovTitle.textContent='纵横皆成章!';
  ovInfo.textContent='用时 '+fmt(sec)+' · 步数 '+moves+'\n在交替的枷锁下跳出漂亮的舞步';
  overlay.classList.add('show');
}
function attempt(idx){
  if(!playing)return;
  const b=blankIdx(),br=(b/N)|0,bc=b%N,r=(idx/N)|0,c=idx%N;
  if(Math.abs(br-r)+Math.abs(bc-c)!==1)return;
  const ax=axisOf(b,idx);
  if(lastAxis!==null&&ax===lastAxis){reject();return;}
  if(slide(idx)){lastAxis=ax;updateAxis();afterMove();}
}
function tryDir(dx,dy){
  if(!playing)return;
  const b=blankIdx(),br=(b/N)|0,bc=b%N,tr=br-dy,tc=bc-dx;
  if(tr<0||tr>=N||tc<0||tc>=N)return;
  attempt(tr*N+tc);
}
boardEl.addEventListener('click',function(ev){const t=ev.target.closest('.tile');if(!t)return;const v=parseInt(t.dataset.v,10);attempt(tiles.indexOf(v));});
document.addEventListener('keydown',function(ev){const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};const d=map[ev.key];if(!d)return;ev.preventDefault();tryDir(d[0],d[1]);});
let tX=0,tY=0;
boardEl.addEventListener('touchstart',function(ev){const t=ev.changedTouches[0];tX=t.clientX;tY=t.clientY;},{passive:true});
boardEl.addEventListener('touchend',function(ev){
  if(!playing)return;
  const t=ev.changedTouches[0];
  const dx=t.clientX-tX,dy=t.clientY-tY;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  ev.preventDefault();
  if(Math.abs(dx)>Math.abs(dy))tryDir(dx>0?1:-1,0);else tryDir(0,dy>0?1:-1);
},{passive:false});
function fit(){const w=boardEl.clientWidth;if(w)boardEl.style.fontSize=Math.max(14,Math.min(42,w/N*0.42))+'px';}
function newGame(){
  overlay.classList.remove('show');clearTimeout(warnTimer);
  warnEl.textContent='';
  tiles=goal.slice();buildTiles();scramble(K);placeAll();
  moves=0;lastAxis=null;startAt=Date.now();playing=true;
  updateAxis();hud();
  requestAnimationFrame(function(){fit();boardEl.classList.add('ready');});
}
document.getElementById('resetBtn').addEventListener('click',newGame);
document.getElementById('againBtn').addEventListener('click',newGame);
window.addEventListener('resize',fit);
newGame();
})();
</script>
</body>
</html>

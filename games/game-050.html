<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双线受敌</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;gap:10px}
h1{margin:2px 0;font-size:22px;letter-spacing:4px;color:#f97316}
#wrap{position:relative;width:min(96vw,860px)}
canvas{display:block;width:100%;height:auto;border-radius:14px;background:#141830;box-shadow:0 0 0 1px #262b4a;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,12,26,.86);border-radius:14px;text-align:center;padding:16px}
#overlay.hide{display:none}
#msg{font-size:16px;line-height:2;white-space:pre-line}
#row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{background:#f97316;color:#2b1204;border:none;border-radius:10px;padding:10px 26px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>双线受敌</h1>
<div id="wrap">
<canvas id="cv" width="800" height="500"></canvas>
<div id="overlay"><div id="msg"></div><div id="row"></div></div>
</div>
<script>
'use strict';
var W=800,H=500;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var overlay=document.getElementById('overlay'),msg=document.getElementById('msg'),row=document.getElementById('row');
var state='menu';
var player={x:W/2-8,y:H/2-60,w:16,h:120};
var balls=[],lives=3,score=0,spawnT=50,flashT=0;
var keys={},mouseY=null,floats=[];

function mkBtn(text,fn){
  var b=document.createElement('button');
  b.className='btn';b.textContent=text;
  b.addEventListener('click',fn);
  row.appendChild(b);
  return b;
}
var bStart=mkBtn('开始挑战',function(){start();});
function showMenu(){
  state='menu';
  msg.textContent='你是中央守卫：左右两侧都会射球来袭！\n把球挡回去得分，漏一球扣 1 条命（共 3 条）。\n球越回越快，看看你能守多少球。\n操作：鼠标/触屏滑动，或 ↑↓（W/S）上下移动。';
  bStart.textContent='开始挑战';
  overlay.classList.remove('hide');
}
function start(){
  balls=[];lives=3;score=0;spawnT=50;flashT=0;floats=[];keys={};mouseY=null;
  player.y=H/2-player.h/2;
  state='play';
  overlay.classList.add('hide');
}
function endGame(){
  state='end';
  msg.textContent='防线告破！\n你成功回击了 '+score+' 球';
  bStart.textContent='再来一局';
  overlay.classList.remove('hide');
}
function flash(t){floats.push({t:t,x:W/2,y:H/2-70,life:60});}
function spawn(side){
  var spd=Math.min(8.6,4.2+score*0.09);
  balls.push({
    x:side<0?-18:W+18,
    y:60+Math.random()*(H-120),
    vx:(side<0?1:-1)*spd,
    vy:Math.random()*4.8-2.4,
    r:9,ret:false
  });
}
function update(dt){
  var pv=0;
  if(keys.up){pv=-1;}else if(keys.down){pv=1;}
  if(pv!==0){mouseY=null;player.y+=pv*7.4*dt;}
  else if(mouseY!==null){player.y+=(mouseY-(player.y+player.h/2))*Math.min(1,0.3*dt);}
  player.y=Math.max(6,Math.min(H-player.h-6,player.y));
  if(flashT>0){flashT-=dt;}
  spawnT-=dt;
  if(spawnT<=0&&balls.length===0){
    if(score>=8&&Math.random()<0.35){
      spawn(-1);spawn(1);flash('双线齐射！');
    }else{
      spawn(Math.random()<0.5?-1:1);
    }
    spawnT=0;
  }
  var i,b;
  for(i=balls.length-1;i>=0;i--){
    b=balls[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);}
    if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy);}
    if(!b.ret&&b.x+b.r>player.x&&b.x-b.r<player.x+player.w&&b.y+b.r>player.y&&b.y-b.r<player.y+player.h){
      var out=b.vx>0?-1:1;
      var spd=Math.min(10,Math.sqrt(b.vx*b.vx+b.vy*b.vy)*1.06+0.3);
      var rel=(b.y-(player.y+player.h/2))/(player.h/2);
      rel=Math.max(-1,Math.min(1,rel));
      b.vx=out*spd;
      b.vy=rel*3+b.vy*0.25;
      b.ret=true;
    }
    if(b.x<-24||b.x>W+24){
      if(b.ret){score++;flash('回击成功！');}
      else{lives--;flashT=18;flash('漏球！生命 -1');}
      balls.splice(i,1);
      if(balls.length===0){spawnT=42;}
    }
  }
  for(i=floats.length-1;i>=0;i--){
    floats[i].life-=dt;floats[i].y-=0.5*dt;
    if(floats[i].life<=0){floats.splice(i,1);}
  }
  if(lives<=0){endGame();}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(249,115,22,.25)';
  ctx.lineWidth=2;ctx.setLineDash([6,10]);
  ctx.beginPath();ctx.moveTo(W/2-110,0);ctx.lineTo(W/2-110,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+110,0);ctx.lineTo(W/2+110,H);ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign='center';
  ctx.font='bold 50px system-ui';
  ctx.fillStyle='rgba(232,234,246,.9)';
  ctx.fillText(score,W/2,64);
  ctx.font='13px system-ui';
  ctx.fillStyle='#f97316';
  ctx.fillText('成功回击',W/2,84);
  var i;
  ctx.fillStyle='#f43f5e';
  for(i=0;i<lives;i++){
    ctx.beginPath();ctx.arc(W/2-30+i*30,104,8,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#334155';
  for(i=lives;i<3;i++){
    ctx.beginPath();ctx.arc(W/2-30+i*30,104,8,0,Math.PI*2);ctx.fill();
  }
  if(flashT>0){
    ctx.fillStyle='rgba(244,63,94,'+(flashT/18*0.18)+')';
    ctx.fillRect(0,0,W/2-110,H);
    ctx.fillRect(W/2+110,0,W/2+110,H);
  }
  ctx.fillStyle='#f8fafc';
  for(i=0;i<balls.length;i++){
    ctx.beginPath();ctx.arc(balls[i].x,balls[i].y,balls[i].r,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#fb923c';
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#7f1d1d';
  ctx.fillRect(0,0,8,H);
  ctx.fillRect(W-8,0,8,H);
  ctx.font='16px system-ui';ctx.fillStyle='#fdba74';
  for(i=0;i<floats.length;i++){
    ctx.globalAlpha=Math.min(1,floats[i].life/30);
    ctx.fillText(floats[i].t,floats[i].x,floats[i].y);
  }
  ctx.globalAlpha=1;
}
var last=0;
function loop(t){
  var dt=Math.min(2.5,Math.max(0.2,(t-last)/16.7));
  last=t;
  if(state==='play'){update(dt);}
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){keys.up=true;e.preventDefault();}
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){keys.down=true;e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){keys.up=false;}
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){keys.down=false;}
});
function ptrY(e){
  var r=cv.getBoundingClientRect();
  var cy=e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY;
  mouseY=(cy-r.top)*(H/r.height);
}
cv.addEventListener('mousemove',ptrY);
cv.addEventListener('touchstart',function(e){e.preventDefault();ptrY(e);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();ptrY(e);},{passive:false});
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>

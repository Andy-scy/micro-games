<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锁猎导弹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#d2a8ff;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#d2a8ff;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#d2a8ff;color:#221038;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#d2a8ff;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>锁猎导弹</h1>
<p class="tip">←→↑↓/WASD 或按住拖动移动,空格 / 按住屏幕发射自动锁敌的追踪导弹。连续发射会让弹体过热,拿到 700 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">锁猎导弹</h2>
<p id="ovX">你的挂架只装追踪导弹:它们会自己咬住最近的敌机,但发射器有过热保护,贪火必哑火。</p>
<button id="btn">开始游戏</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>弹温<b id="hE">0</b></span><span>生命<b id="hH">3</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hE=document.getElementById("hE"),hH=document.getElementById("hH");
var GOAL=700;
var state="ready",score=0,hp=3,inv=0,cool=0,heat=0,hot=false,spawn=0.6,t=0;
var ship={x:W/2,y:H-80};
var missiles=[],ebullets=[],enemies=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*24+8});}
function reset(){
  score=0;hp=3;inv=0;cool=0;heat=0;hot=false;spawn=0.4;t=0;
  ship.x=W/2;ship.y=H-80;
  missiles=[];ebullets=[];enemies=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*140+30;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.35,col:col});
  }
}
function nearest(x,y){
  var best=null,bd=1e9;
  for(var k=0;k<enemies.length;k++){
    var e=enemies[k];
    var dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=e;}
  }
  return best;
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"猎杀完成":"战机坠毁";
  ovX.textContent="最终得分:"+score+(win?" · 导弹群的锁猎表演完美收官。":" · 躲开弹幕,让导弹替你瞄准。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;
  heat=Math.max(0,heat-26*dt);
  if(hot&&heat<35)hot=false;
  var sp=280;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.45,Math.min(H-40,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0&&!hot){
    cool=0.3;
    heat+=14;
    if(heat>=100){heat=100;hot=true;}
    missiles.push({x:ship.x,y:ship.y-10,vx:0,vy:-200,life:3.2});
  }
  if(spawn<=0){
    spawn=Math.max(0.55,1.4-score*0.0007);
    var r=Math.random();
    if(r<0.35)enemies.push({x:40+Math.random()*(W-80),y:-30,vy:200,hp:1,ph:0,kind:1});
    else if(r<0.7)enemies.push({x:40+Math.random()*(W-80),y:-30,vy:100,hp:2,ph:Math.random()*6.283,kind:0});
    else enemies.push({x:60+Math.random()*(W-120),y:-36,vy:70,hp:4,ph:Math.random()*6.283,kind:2,ft:2});
  }
  for(i=missiles.length-1;i>=0;i--){
    var m=missiles[i];
    m.life-=dt;
    var spd=Math.min(340,Math.sqrt(m.vx*m.vx+m.vy*m.vy)+260*dt);
    var tgt=nearest(m.x,m.y);
    var ang=Math.atan2(m.vy,m.vx);
    var turn=4.4*dt;
    if(tgt){
      var ta=Math.atan2(tgt.y-m.y,tgt.x-m.x);
      var da=ta-ang;
      while(da>Math.PI)da-=6.283;
      while(da<-Math.PI)da+=6.283;
      if(da>turn)da=turn;
      if(da<-turn)da=-turn;
      ang+=da;
    }else{
      var da2=(-Math.PI/2)-ang;
      while(da2>Math.PI)da2-=6.283;
      while(da2<-Math.PI)da2+=6.283;
      if(da2>turn)da2=turn;
      if(da2<-turn)da2=-turn;
      ang+=da2;
    }
    m.vx=Math.cos(ang)*spd;m.vy=Math.sin(ang)*spd;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    parts.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*20,vy:30,life:0.25,col:"#d2a8ff"});
    if(m.life<=0||m.x<-20||m.x>W+20||m.y<-30){missiles.splice(i,1);continue;}
    for(var j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      if(Math.abs(m.x-e2.x)<20&&Math.abs(m.y-e2.y)<20){
        boom(e2.x,e2.y,12,"#ffd166");
        score+=e2.kind===2?50:(e2.kind===1?15:25);
        enemies.splice(j,1);
        missiles.splice(i,1);
        break;
      }
    }
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.vy*dt;
    if(e.kind===0)e.x+=Math.sin(t*3+e.ph)*60*dt;
    if(e.kind===2){
      if(e.y<160)e.y+=60*dt;
      e.x+=Math.sin(t*1.2+e.ph)*40*dt;
      e.ft-=dt;
      if(e.ft<=0){
        e.ft=1.8;
        ebullets.push({x:e.x,y:e.y+16,vx:0,vy:200});
      }
    }
    if(e.y>H+30){enemies.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<22&&Math.abs(e.y-ship.y)<22){
      enemies.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  for(i=ebullets.length-1;i>=0;i--){
    var b=ebullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>H+10){ebullets.splice(i,1);continue;}
    if(inv<=0&&Math.abs(b.x-ship.x)<11&&Math.abs(b.y-ship.y)<13){
      ebullets.splice(i,1);hp--;inv=1.3;boom(ship.x,ship.y,12,"#ff6b6b");
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(inv<=0&&hp<=0){gameOver(false);return;}
  if(score>=GOAL)gameOver(true);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  for(i=0;i<missiles.length;i++){
    var m=missiles[i];
    ctx.save();ctx.translate(m.x,m.y);
    ctx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);
    ctx.fillStyle="#d2a8ff";
    ctx.fillRect(-2.5,-8,5,14);
    ctx.fillStyle="#ffffff";
    ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(-3,-6);ctx.lineTo(3,-6);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    if(e.kind===1){ctx.fillStyle="#ff6b6b";ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(-9,-9);ctx.lineTo(9,-9);ctx.closePath();ctx.fill();}
    else if(e.kind===2){ctx.fillStyle="#c0456c";ctx.fillRect(-20,-14,40,28);ctx.fillStyle="#ffd166";ctx.fillRect(-6,-4,12,12);}
    else{ctx.fillStyle="#ff9f9f";ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(-13,-9);ctx.lineTo(0,-3);ctx.lineTo(13,-9);ctx.closePath();ctx.fill();}
    ctx.restore();
  }
  ctx.fillStyle="#ffd166";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*3);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#1d2440";ctx.fillRect(W-110,18,90,10);
  ctx.fillStyle=hot?"#e05555":"#d2a8ff";
  ctx.fillRect(W-110,18,90*heat/100,10);
  if(hot){ctx.fillStyle="#e05555";ctx.font="bold 12px system-ui";ctx.textAlign="right";ctx.fillText("过热",W-114,28);}
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#d2a8ff";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;
  hE.textContent=hot?"过热":Math.floor(heat);
  hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

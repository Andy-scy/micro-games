<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终点之门</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#67e8f9;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#67e8f9;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#67e8f9}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#67e8f9;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>终点之门</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀 · 闯过 5 层,撞上进击的传送门!</p>
  <div class="hud">
    <span>关卡 <b id="lv">1</b></span>
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">终点之门</h2>
      <p id="ovDesc">这里不是无尽跑酷:每层有 3 对管道,尽头出现一座上下巡游的旋涡传送门,撞上它即通关该层(+10 分),共 5 层,一层比一层快、缝更窄。门溜走了会绕回来,追上去!穿越全部 5 层即胜利!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">进入第 1 层</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=70,GRAV=1480,FLAP=-380,BX=120,BR=13;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elLv=$("lv"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,portal,popups,score,best=0,tick,level,speed,gapBase,pipesLeft;
function newPipe(x){return{x:x,gy:64+Math.random()*(GROUND-128-gapBase),passed:false};}
function reset(){
  bird={y:280,vy:0,fl:0};
  pipes=[];portal=null;popups=[];
  score=0;tick=0;level=1;speed=138;gapBase=156;pipesLeft=3;
  pipes.push(newPipe(W+150));
  elScore.textContent="0";
  elLv.textContent="1";
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="最终得分 "+score+" · 到达第 "+level+" 层";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function winGame(){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="通关成功!";
  ovTitle.style.color="#67e8f9";
  ovDesc.textContent="你穿越了全部 5 层,抵达最终之门!";
  ovScore.style.display="block";
  ovScore.textContent="总得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再战一次";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function act(){
  if(state!=="playing")return;
  bird.vy=FLAP;bird.fl=1;
}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,p,py;
  tick+=dt;
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("坠落在地上,传送门与你无缘!");return;}
  for(i=0;i<pipes.length;i++)pipes[i].x-=speed*dt;
  if(!portal&&pipesLeft>0&&pipes[pipes.length-1].x<W-236){
    pipes.push(newPipe(W+24));
    pipesLeft--;
  }
  if(pipesLeft===0&&!portal&&pipes[pipes.length-1].x<W-270){
    var amp=60+level*14;
    portal={x:W+60,baseY:160+Math.random()*(GROUND-340),amp:amp,t:Math.random()*6.28};
  }
  if(pipes[0].x<-PW-12)pipes.shift();
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x+PW<BX-BR){
      p.passed=true;score++;
      elScore.textContent=String(score);
      popups.push({x:BX+34,y:bird.y-26,txt:"+1",life:0.8});
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gy)||circleRect(BX,bird.y,BR,p.x,p.gy+gapBase,PW,GROUND-p.gy-gapBase)){
      die("在第 "+level+" 层撞上了管道!");return;
    }
  }
  if(portal){
    portal.x-=speed*dt;
    py=Math.max(60,Math.min(GROUND-180,portal.baseY+Math.sin(tick*1.7+portal.t)*portal.amp));
    portal.py=py;
    if(circleRect(BX,bird.y,BR,portal.x,py,30,120)){
      score+=10;
      elScore.textContent=String(score);
      if(level===5){winGame();return;}
      level++;
      elLv.textContent=String(level);
      speed+=12;
      gapBase=Math.max(128,156-(level-1)*6);
      pipesLeft=3;portal=null;
      popups.push({x:W/2,y:150,txt:"第 "+(level-1)+" 层通过!+10",life:1.5});
      pipes.push(newPipe(W+300));
    }else if(portal.x<BX-70){
      portal.x=W+160;
      popups.push({x:W/2,y:200,txt:"传送门溜走了,追!",life:1.2});
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  ctx.fillStyle="#155e75";
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+gapBase,PW,GROUND-p.gy-gapBase);
  ctx.fillStyle="#67e8f9";
  ctx.fillRect(p.x+6,0,7,p.gy);
  ctx.fillRect(p.x+6,p.gy+gapBase,7,GROUND-p.gy-gapBase);
  ctx.fillStyle="#0c3d4d";
  ctx.fillRect(p.x-4,p.gy-13,PW+8,13);
  ctx.fillRect(p.x-4,p.gy+gapBase,PW+8,13);
}
function drawPortal(){
  var i,a;
  ctx.save();
  ctx.translate(portal.x+15,portal.py+60);
  for(i=0;i<4;i++){
    a=tick*(2+i*0.7)+i;
    ctx.strokeStyle="rgba(103,232,249,"+(0.9-i*0.2)+")";
    ctx.lineWidth=4-i*0.6;
    ctx.beginPath();
    ctx.ellipse(0,0,26-i*4,54-i*9,Math.sin(a)*0.5,a,a+4.6);
    ctx.stroke();
  }
  ctx.fillStyle="rgba(207,250,254,0.9)";
  ctx.beginPath();ctx.arc(0,0,6+Math.sin(tick*6)*2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle="rgba(34,211,238,0.12)";
  ctx.fillRect(portal.x-6,portal.py-14,42,148);
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0b1a22";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(180,240,255,0.3)";
  for(i=0;i<35;i++)ctx.fillRect((i*143)%W,(i*229)%GROUND,1.3,1.3);
  for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  if(portal)drawPortal();
  ctx.fillStyle="#132832";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#1d3d4d";
  var off=(tick*speed)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#cffafe";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#22d3ee";
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#0b1a22";
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f97316";
  ctx.beginPath();ctx.moveTo(BX+BR-2,bird.y);ctx.lineTo(BX+BR+8,bird.y+2);ctx.lineTo(BX+BR-2,bird.y+6);ctx.closePath();ctx.fill();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(165,243,252,"+Math.min(1,popups[i].life)+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
  if(portal){
    ctx.font="bold 13px system-ui";
    ctx.fillStyle="rgba(103,232,249,0.85)";
    ctx.fillText("终点门",portal.x+15,portal.py-24);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

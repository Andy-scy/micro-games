<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双炮防线</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:460px}
h1{font-size:24px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:10px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:12px}
.big{font-size:17px;font-weight:800;color:#ffd166}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>双炮防线</h1>
  <p class="tips">左炮管左半场、右炮管右半场,各自装填不同颜色的泡泡弹!点哪边就由哪边的炮开火,同色命中才能消除,漏泡会砸穿城防。</p>
  <div class="card">
    <div class="row">
      <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
      <div class="stat"><div class="mut">城防</div><div class="big" id="hp">■■■■■</div></div>
      <div class="stat"><div class="mut">连击</div><div class="big" id="cb">x1</div></div>
      <div class="stat"><div class="mut">时间</div><div class="big" id="tm">0 秒</div></div>
    </div>
  </div>
  <div class="card"><canvas id="cv" width="420" height="520"></canvas></div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">双炮防线</h2><p id="ovp">玩法说明:<br>· 彩色泡泡从天而降,左炮只管左半场、右炮只管右半场<br>· 点击左半场/右半场(或 A / L 键)指挥对应炮台开火<br>· 炮弹飞向点击处,命中「同色」泡泡即消除<br>· 打错颜色会让那颗泡泡加速坠落!<br>· 炮台每次开火后重新随机装填<br>· 泡泡落地 -1 城防(共 5 格),守住越久分越高</p><button class="btn" id="obtn">开始防守</button></div></div>
<script>
'use strict';
var W=420,H=520;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var PAL=['#ff5c5c','#ffd166','#4da3ff'];
var cannons=[
  {x:70,y:506,c:0,cd:0},
  {x:350,y:506,c:1,cd:0}
];
var bubbles=[],projs=[],parts=[],floats=[];
var score=0,hp=5,combo=0,comboT=0,elapsed=0;
var running=false,lastT=0,flashT=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function $i(id){return document.getElementById(id)}
function upd(){
  $i('sc').textContent=score;
  var h='';for(var i=0;i<5;i++)h+=i<hp?'■':'□';
  $i('hp').textContent=h;
  $i('cb').textContent='x'+Math.min(5,1+Math.floor(combo/3));
  $i('tm').textContent=Math.floor(elapsed)+' 秒';
}
function reset(){
  bubbles=[];projs=[];parts=[];floats=[];
  score=0;hp=5;combo=0;comboT=0;elapsed=0;flashT=0;
  cannons[0].c=Math.floor(Math.random()*3);cannons[0].cd=0;
  cannons[1].c=Math.floor(Math.random()*3);cannons[1].cd=0;
  upd();
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,life:0.9})}
function burst(x,y,c,n){
  for(var k=0;k<n;k++){var a=rnd(0,6.28),s=rnd(50,170);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(2,5),c:c,life:rnd(0.3,0.6)});}
}
function fire(side,tx,ty){
  if(!running)return;
  var cn=cannons[side];
  if(cn.cd>0)return;
  var dx=tx-cn.x,dy=ty-cn.y;
  if(dy>-8)dy=-8;
  var len=Math.sqrt(dx*dx+dy*dy);
  projs.push({x:cn.x,y:cn.y-22,vx:dx/len*470,vy:dy/len*470,c:cn.c});
  cn.cd=0.75;
  cn.pendingC=Math.floor(Math.random()*3);
  burst(cn.x,cn.y-22,PAL[cn.c],5);
}
function update(dt){
  if(!running)return;
  elapsed+=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  if(flashT>0)flashT-=dt;
  var i,j;
  for(i=0;i<2;i++){
    var cn=cannons[i];
    if(cn.cd>0){
      cn.cd-=dt;
      if(cn.cd<=0)cn.c=cn.pendingC;
    }
  }
  if(Math.random()<dt*(1.1+elapsed*0.02)){
    bubbles.push({x:rnd(28,W-28),y:-20,r:17,
      vy:rnd(46,72)+elapsed*0.7,
      sw:rnd(0,6.28),sp:rnd(1,2),amp:rnd(14,34),
      c:Math.floor(Math.random()*3),flash:0});
  }
  for(i=bubbles.length-1;i>=0;i--){
    var b=bubbles[i];
    b.y+=b.vy*dt;b.sw+=b.sp*dt;b.x+=Math.sin(b.sw)*b.amp*dt;
    if(b.x<b.r)b.x=b.r;if(b.x>W-b.r)b.x=W-b.r;
    if(b.flash>0)b.flash-=dt;
    if(b.y>H-16){
      bubbles.splice(i,1);
      hp--;combo=0;flashT=0.4;
      burst(b.x,H-14,'#ff5c5c',12);
      upd();
      if(hp<=0){
        running=false;
        $i('ovt').textContent='城防告破!';
        $i('ovp').innerHTML='最终得分:<b>'+score+'</b><br>坚守时间:'+Math.floor(elapsed)+' 秒';
        $i('obtn').textContent='再来一局';
        $i('overlay').classList.remove('hide');
        return;
      }
    }
  }
  for(i=projs.length-1;i>=0;i--){
    var pr=projs[i];
    pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;
    var dead=pr.y<-16||pr.x<-16||pr.x>W+16;
    if(!dead){
      for(j=bubbles.length-1;j>=0;j--){
        var bb=bubbles[j];
        var dx=pr.x-bb.x,dy=pr.y-bb.y;
        if(dx*dx+dy*dy<(bb.r+8)*(bb.r+8)){
          dead=true;
          if(bb.c===pr.c){
            bubbles.splice(j,1);
            combo++;comboT=2.2;
            var mult=Math.min(5,1+Math.floor(combo/3));
            var gain=15*mult;
            score+=gain;
            addFloat(bb.x,bb.y,'+'+gain,PAL[pr.c]);
            burst(bb.x,bb.y,PAL[pr.c],12);
          }else{
            bb.vy+=42;bb.flash=0.3;
            addFloat(bb.x,bb.y-20,'颜色不符!','#9aa3c0');
          }
          break;
        }
      }
    }
    if(dead)projs.splice(i,1);
  }
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.y-=40*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  upd();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141b3c');g.addColorStop(1,'#0d1126');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.03)';
  ctx.fillRect(W/2-1,0,2,H);
  var i;
  ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle='#5b6690';
  ctx.fillText('左炮区',W/4,20);ctx.fillText('右炮区',W*3/4,20);
  for(i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.2832);
    ctx.fillStyle=PAL[b.c];ctx.fill();
    ctx.lineWidth=2;
    ctx.strokeStyle=b.flash>0?'#fff':'rgba(255,255,255,.35)';
    ctx.stroke();
    ctx.beginPath();ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.25,0,6.2832);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
  }
  for(i=0;i<projs.length;i++){
    var pr=projs[i];
    ctx.beginPath();ctx.arc(pr.x,pr.y,8,0,6.2832);
    ctx.fillStyle=PAL[pr.c];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.stroke();
  }
  for(i=0;i<2;i++){
    var cn=cannons[i];
    ctx.strokeStyle='#565f8a';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(cn.x,cn.y);ctx.lineTo(cn.x,cn.y-26);ctx.stroke();
    ctx.beginPath();ctx.arc(cn.x,cn.y,13,0,6.2832);
    ctx.fillStyle='#232a48';ctx.fill();
    ctx.strokeStyle='#8fd3ff';ctx.lineWidth=2;ctx.stroke();
    if(cn.cd<=0){
      ctx.beginPath();ctx.arc(cn.x,cn.y-26,8,0,6.2832);
      ctx.fillStyle=PAL[cn.c];ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(cn.x,cn.y-26,8,0,6.2832);
      ctx.fillStyle='#333c60';ctx.fill();
    }
  }
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fillStyle=p.c;ctx.fill();ctx.globalAlpha=1;}
  ctx.font='bold 15px system-ui';
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}
  ctx.textAlign='left';ctx.fillStyle='#7f8ab0';ctx.font='13px system-ui';
  ctx.fillText('点击半场开火 · A / L 键',12,H-12);
  if(flashT>0){
    ctx.globalAlpha=flashT*1.6;ctx.fillStyle='#ff5c5c';
    ctx.fillRect(0,H-6,W,6);ctx.globalAlpha=1;
  }
}
function pt(e){
  var rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};
}
cv.addEventListener('pointerdown',function(e){
  if(!running)return;
  var p=pt(e);
  fire(p.x<W/2?0:1,p.x,p.y);
});
window.addEventListener('keydown',function(e){
  if(!running)return;
  if(e.code==='KeyA'){fire(0,cannons[0].x,0);}
  if(e.code==='KeyL'){fire(1,cannons[1].x,0);}
});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

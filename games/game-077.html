<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三界穿梭</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#7dd3fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#7dd3fc;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#7dd3fc}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#7dd3fc;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>三界穿梭</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀 · 每得 8 分切换世界,手感完全不同!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>世界 <b id="zone">天空</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">三界穿梭</h2>
      <p id="ovDesc">一次飞行穿越三个世界:天空(正常引力,普通管道)→ 海底(引力骤减,动作漂移,珊瑚缝隙变宽)→ 洞窟(引力暴增,缝隙收窄,需要更有力的拍翅)!每 8 分切换一次并滚动播报。撞管坠地即结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始穿越</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=68,BX=120,BR=13;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),elZone=$("zone"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,bubbles,popups,score,best=0,tick,zone,banner;
var ZP=[
  {name:"天空",grav:1450,flap:-375,drag:0,gap:150,spd:145,bg:"#101a33",ground:"#1c2947",stripe:"#2a3a5e",body:"#2f9e57",edge:"#54d98c",cap:"#1c5e35",coral:false},
  {name:"海底",grav:560,flap:-300,drag:2.4,gap:170,spd:145,bg:"#0a2e3d",ground:"#0f3d50",stripe:"#17556e",body:"#c2637d",edge:"#e08a9b",cap:"#8a3b52",coral:true},
  {name:"洞窟",grav:1850,flap:-445,drag:0,gap:128,spd:158,bg:"#241631",ground:"#361f49",stripe:"#4b2f64",body:"#57534e",edge:"#a8a29e",cap:"#2f2c29",coral:false}
];
function newPipe(x){
  var z=ZP[zone];
  return{x:x,gy:64+Math.random()*(GROUND-128-z.gap),gap:z.gap,style:zone,passed:false};
}
function reset(){
  bird={y:270,vy:0,fl:0};
  pipes=[newPipe(W+150)];
  bubbles=[];popups=[];
  score=0;tick=0;zone=0;banner=0;
  elScore.textContent="0";
  elZone.textContent="天空";
}
function act(){
  if(state!=="playing")return;
  bird.vy=ZP[zone].flap;bird.fl=1;
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,p,z=ZP[zone];
  tick+=dt;
  if(banner>0)banner-=dt;
  bird.vy+=z.grav*dt;
  bird.vy-=bird.vy*z.drag*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("在"+z.name+"坠毁了!");return;}
  if(zone===1&&Math.random()<0.35)bubbles.push({x:Math.random()*W,y:GROUND+6,r:1.5+Math.random()*3,v:30+Math.random()*40});
  for(i=bubbles.length-1;i>=0;i--){
    bubbles[i].y-=bubbles[i].v*dt;
    if(bubbles[i].y<-10)bubbles.splice(i,1);
  }
  for(i=0;i<pipes.length;i++)pipes[i].x-=z.spd*dt;
  if(pipes[pipes.length-1].x<W-244)pipes.push(newPipe(W+24));
  if(pipes[0].x<-PW-12)pipes.shift();
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x+PW<BX-BR){
      p.passed=true;score++;
      elScore.textContent=String(score);
      popups.push({x:BX+34,y:bird.y-26,txt:"+1",life:0.8});
      var nz=((score/8)|0)%3;
      if(nz!==zone){
        zone=nz;
        elZone.textContent=ZP[zone].name;
        banner=1.6;
        popups.push({x:W/2,y:160,txt:"进入 · "+ZP[zone].name+"!",life:1.6});
      }
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gy)||circleRect(BX,bird.y,BR,p.x,p.gy+p.gap,PW,GROUND-p.gy-p.gap)){
      die("撞上了"+ZP[p.style].name+"的障壁!");return;
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  var z=ZP[p.style];
  ctx.fillStyle=z.body;
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+p.gap,PW,GROUND-p.gy-p.gap);
  ctx.fillStyle=z.edge;
  ctx.fillRect(p.x+6,0,7,p.gy);
  ctx.fillRect(p.x+6,p.gy+p.gap,7,GROUND-p.gy-p.gap);
  ctx.fillStyle=z.cap;
  if(z.coral){
    ctx.beginPath();ctx.arc(p.x+PW/2,p.gy-6,10,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x+PW/2,p.gy+p.gap+6,10,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillRect(p.x-4,p.gy-13,PW+8,13);
    ctx.fillRect(p.x-4,p.gy+p.gap,PW+8,13);
  }
}
function draw(){
  var i;
  var z=ZP[zone];
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=z.bg;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,0.22)";
  for(i=0;i<35;i++)ctx.fillRect((i*139)%W,(i*227)%GROUND,1.3,1.3);
  ctx.fillStyle="rgba(125,211,252,0.15)";
  for(i=0;i<bubbles.length;i++){
    ctx.beginPath();ctx.arc(bubbles[i].x,bubbles[i].y,bubbles[i].r,0,Math.PI*2);ctx.fill();
  }
  for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  ctx.fillStyle=z.ground;
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle=z.stripe;
  var off=(tick*z.spd)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#e0f2fe";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=zone===1?"#38bdf8":(zone===2?"#a78bfa":"#38bdf8");
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=z.bg;
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(186,230,253,"+Math.min(1,popups[i].life)+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
  if(banner>0){
    ctx.font="bold 24px system-ui";
    ctx.fillStyle="rgba(125,211,252,"+Math.min(1,banner)+")";
    ctx.fillText(ZP[zone].name+"世界",W/2,220);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

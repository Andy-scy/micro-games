<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>镜像点灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#c084fc;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#c084fc;font-size:16px}
.gbtn{background:#331a4d;color:#c084fc;border:1px solid #c084fc;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#c084fc;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.mirrorBox{position:relative;max-width:360px;margin:0 auto;padding:6px 10px}
.mirrorBox:before{content:"";position:absolute;left:50%;top:2%;bottom:2%;width:2px;margin-left:-1px;background:linear-gradient(180deg,transparent,#c084fc,transparent);opacity:.65;border-radius:1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1/1;border-radius:11px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.on{background:linear-gradient(145deg,#e9d5ff,#9333ea);border-color:#f3e8ff;box-shadow:0 0 14px rgba(192,132,252,.55)}
.cell.cur{outline:2px solid rgba(192,132,252,.75);outline-offset:2px}
.cell:active{transform:scale(.92)}
.cap{text-align:center;color:#4d5578;font-size:11px;letter-spacing:4px;margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#c084fc;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#c084fc;color:#331a4d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>镜像点灯</h1>
  <p class="hint">镜面世界:点击任意一盏灯,它和它的镜像孪生(中线对称的那盏)都会各自翻转十字。两侧波纹还会互相穿越重叠、两两抵消。点亮全部 4×4。</p>
  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>已点亮 <b id="lit">0</b>/16</span>
    <span>最少步纪录 <b id="best">--</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="mirrorBox"><div class="grid" id="grid"></div></div>
  <div class="cap">镜 面 中 线</div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">镜像点灯</h2>
    <p id="ovDesc">一按双响的点灯:你的每一次点击都会在对称位置同时生效。当两个十字在镜线附近重叠时,重叠的灯会翻两次——等于没翻。镜像的奇偶,就是本关的全部秘密。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">照镜子</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=4,CNT=16;
var gridEl=$("grid"),elMoves=$("moves"),elLit=$("lit"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],moves=0,state="menu";
var best=loadNum("mg339_best");

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2200);}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var mc=N-1-c;
  var l1=crossList(r,c),l2=crossList(r,mc),i;
  for(i=0;i<l1.length;i++)board[l1[i]]^=1;
  for(i=0;i<l2.length;i++)board[l2[i]]^=1;
  if(!silent){
    for(i=0;i<l1.length;i++)paint(l1[i]);
    for(i=0;i<l2.length;i++)paint(l2[i]);
    moves++;
  }
}
function litCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i])n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function updateHud(){
  elMoves.textContent=moves;elLit.textContent=litCount();
  elBest.textContent=best>0?best+" 步":"--";
}
function newGame(){
  board=[];for(var i=0;i<CNT;i++)board.push(1);
  moves=0;state="playing";
  var ps=pickCells(5),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(litCount()===CNT)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||moves<best){best=moves;saveNum("mg339_best",best);isNew=true;}
  ovTitle.textContent="镜像归一!";
  ovDesc.textContent=isNew?"新纪录!镜中镜外的灯光一同亮起。":"镜面两侧再无分别,你与倒影一同通关。";
  ovScore.style.display="block";
  ovScore.textContent="本局步数 "+moves;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function start(){newGame();ov.classList.add("hide");}
var cur=-1;
function setCur(i){
  if(cur>=0)cells[cur].classList.remove("cur");
  cur=i;
  if(cur>=0)cells[cur].classList.add("cur");
}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(cur<0)setCur(5);
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){
  if(state==="menu")return;
  newGame();setMsg("已重开一局");
});
build();
board=[];for(var z=0;z<CNT;z++)board.push(1);
var ps0=pickCells(5),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
})();
</script>
</body>
</html>

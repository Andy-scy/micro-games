<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虫洞回廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#c084fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#c084fc;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#c084fc}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#c084fc;color:#2a0a45;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>虫洞回廊</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 踩上虫洞瞬移到同色另一端</p>
  <div class="hud">
    <span>传送次数 <b id="tps">0</b></span>
    <span>步数 <b id="steps">0</b></span>
    <span>用时 <b id="time">0.0s</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">虫洞回廊</h2>
      <p id="ovDesc">右下角的绿色出口被封印在孤岛之中,徒步永远走不到。迷宫里散布着 3 对颜色相同的虫洞,踩上任意一端,就会从同色的另一端钻出来。借虫洞跨越封印,直达出口!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">进入虫洞</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
function $(id){return document.getElementById(id);}
var elTps=$("tps"),elSteps=$("steps"),elTime=$("time");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s266");
var state="menu";
var PCOLORS=["#22d3ee","#fb923c","#c084fc"];
var grid,player,exitCell,portals,teleLock,tps,steps,elapsed,pulse,flashT,flashX,flashY,dist0;

function loadBest(k){try{return parseFloat(localStorage.getItem(k)||"0")||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function bfs(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function pickCells(count,used,minD){
  var res=[],md=minD,guard=0;
  while(res.length<count&&md>=0&&guard<1500){
    guard++;
    var cells=[],x,y;
    for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
      if(grid[y][x]===0&&dist0[y][x]>=md)cells.push({x:x,y:y});
    }
    var inner=0;
    while(res.length<count&&cells.length&&inner<600){
      inner++;
      var i=(Math.random()*cells.length)|0,c=cells[i],bad=false,j;
      for(j=0;j<res.length;j++)if(res[j].x===c.x&&res[j].y===c.y)bad=true;
      for(j=0;j<used.length;j++)if(used[j].x===c.x&&used[j].y===c.y)bad=true;
      if(!bad)res.push({x:c.x,y:c.y});
      cells.splice(i,1);
    }
    md-=2;
  }
  return res;
}
function portalAt(x,y){
  var i;
  for(i=0;i<portals.length;i++){
    if(portals[i].x===x&&portals[i].y===y)return i;
  }
  return -1;
}
function reset(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]],i,nx,ny;
  for(i=0;i<4;i++){
    nx=exitCell.x+dirs[i][0];ny=exitCell.y+dirs[i][1];
    if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&grid[ny][nx]===0)grid[ny][nx]=1;
  }
  dist0=bfs(1,1);
  var used=[exitCell,{x:1,y:1}];
  portals=[];
  var main=pickCells(1,used,10);
  if(!main.length)main=pickCells(1,used,2);
  portals.push({x:main[0].x,y:main[0].y,pair:0});
  used.push(main[0]);
  portals.push({x:exitCell.x,y:exitCell.y,pair:0});
  var extra=pickCells(4,used,6);
  var base=extra.length>=4?extra:pickCells(4,used,1);
  var pairIdx=1;
  for(i=0;i<4&&portals.length<6;i++){
    portals.push({x:base[i].x,y:base[i].y,pair:pairIdx});
    if(i%2===1)pairIdx++;
  }
  teleLock=-1;tps=0;steps=0;elapsed=0;pulse=0;flashT=0;
  updateHud();
}
function updateHud(){
  elTps.textContent=tps;
  elSteps.textContent=steps;
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  if(portalAt(player.x,player.y)<0)teleLock=-1;
  player.x=nx;player.y=ny;
  steps++;
  var pi=portalAt(nx,ny);
  if(pi>=0&&pi!==teleLock){
    var j,pair=portals[pi].pair;
    for(j=0;j<portals.length;j++){
      if(j!==pi&&portals[j].pair===pair){
        player.x=portals[j].x;player.y=portals[j].y;
        teleLock=pair;tps++;
        flashT=1;flashX=player.x;flashY=player.y;
        break;
      }
    }
  }
  if(player.x===exitCell.x&&player.y===exitCell.y){win();return;}
  updateHud();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||elapsed<best){best=elapsed;saveBest("mg_s266",best);isNew=true;}
  ovTitle.textContent="穿越成功!";
  ovDesc.textContent=isNew?"新纪录!虫洞在你脚下服服帖帖。":"一道紫光闪过,你从孤岛中央的出口钻了出来。";
  ovScore.style.display="block";
  ovScore.textContent="用时 "+elapsed.toFixed(1)+"s · 传送 "+tps+" 次 · 步数 "+steps+" · 最快 "+(best>0?best.toFixed(1)+"s":"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#232a4d";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#2c3560";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  for(i=0;i<portals.length;i++){
    var p=portals[i],col=PCOLORS[p.pair];
    var cx=p.x*CELL+CELL/2,cy=p.y*CELL+CELL/2;
    ctx.strokeStyle=col;
    ctx.lineWidth=2.5;
    ctx.shadowColor=col;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(cx,cy,7+Math.sin(pulse+i)*1.5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=1;ctx.shadowBlur=0;
  }
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  if(flashT>0){
    ctx.strokeStyle="rgba(192,132,252,"+flashT.toFixed(3)+")";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(flashX*CELL+CELL/2,flashY*CELL+CELL/2,(1-flashT)*40+8,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=1;
  }
  ctx.fillStyle="#a7f3d0";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.004;
  if(flashT>0)flashT-=dt/400;
  if(state==="playing"){
    elapsed+=dt/1000;
    elTime.textContent=elapsed.toFixed(1)+"s";
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旋转谜灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#818cf8;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#818cf8;font-size:16px}
.gbtn{background:#262652;color:#818cf8;border:1px solid #818cf8;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#818cf8;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.stage{height:min(92vw,370px);display:flex;align-items:center;justify-content:center;margin-bottom:6px;position:relative}
.spin{width:min(58vw,240px);height:min(58vw,240px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%;height:100%;touch-action:manipulation}
.cell{border-radius:12px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s}
.cell.on{background:linear-gradient(145deg,#c7d2fe,#6366f1);border-color:#e0e7ff;box-shadow:0 0 14px rgba(129,140,248,.55)}
.cell:active{transform:scale(.92)}
.hub{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#818cf8;box-shadow:0 0 12px #818cf8;opacity:.7;pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#818cf8;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#818cf8;color:#262652;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>旋转谜灯</h1>
  <p class="hint">棋盘在脚下缓缓旋转!规则不变:点击翻转十字,点亮全部 4×4。转盘不等人,点击落点要想清楚——转得越久,你的空间感越晕。</p>
  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>已点亮 <b id="lit">0</b>/16</span>
    <span>最少步纪录 <b id="best">--</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="stage">
    <div class="spin" id="spin">
      <div class="grid" id="grid"></div>
    </div>
    <div class="hub" id="hub"></div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">旋转谜灯</h2>
    <p id="ovDesc">经典十字点灯,加了一层眩晕滤镜:整个棋盘绕中心匀速旋转。点击依然精准生效,难的是在旋转中记住你要点的那一格。点亮全部灯即胜利。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">登台转盘</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=4,CNT=16;
var gridEl=$("grid"),spinEl=$("spin"),elMoves=$("moves"),elLit=$("lit"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],moves=0,state="menu",angle=0;
var best=loadNum("mg333_best");

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2200);}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++){board[list[i]]^=1;paint(list[i]);}
  if(!silent)moves++;
}
function litCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i])n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function updateHud(){
  elMoves.textContent=moves;elLit.textContent=litCount();
  elBest.textContent=best>0?best+" 步":"--";
}
function newGame(){
  board=[];for(var i=0;i<CNT;i++)board.push(1);
  moves=0;state="playing";
  var ps=pickCells(5),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(litCount()===CNT)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||moves<best){best=moves;saveNum("mg333_best",best);isNew=true;}
  ovTitle.textContent="转盘点亮!";
  ovDesc.textContent=isNew?"新纪录!旋转之中你依然稳准狠。":"天旋地转,灯火不灭。你战胜了转盘,也战胜了晕眩。";
  ovScore.style.display="block";
  ovScore.textContent="本局步数 "+moves;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function start(){newGame();ov.classList.add("hide");}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(e.key==="Enter"||e.key===" ")e.preventDefault();
});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){
  if(state==="menu")return;
  newGame();setMsg("已重开一局,转盘未停");
});
build();
board=[];for(var z=0;z<CNT;z++)board.push(1);
var ps0=pickCells(5),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(100,t-lastT);lastT=t;
  angle=(angle+dt*0.02)%360;
  spinEl.style.transform="rotate("+angle.toFixed(2)+"deg)";
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

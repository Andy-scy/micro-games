<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漂移积氮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#app{width:100%;max-width:480px}
h1{font-size:24px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:10px}
.card{background:#1a1f36;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:12px}
.big{font-size:17px;font-weight:800;color:#ffd166}
.bar{height:10px;background:#232a48;border-radius:6px;overflow:hidden;margin-top:4px}
#nbar{height:100%;width:0;background:#4cc9f0}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#10142a;touch-action:none}
.btn{border:0;border-radius:10px;padding:11px 26px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:14px;line-height:1.8;font-size:13px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>漂移积氮</h1>
  <p class="tips">90 秒漂移挑战:高速过弯让车尾甩起来,漂移越久分越高、氮气涨得越快,空格键释放氮气冲刺!</p>
  <div class="card"><div class="row">
    <div class="stat"><div class="mut">漂移积分</div><div class="big" id="sc">0</div></div>
    <div class="stat"><div class="mut">剩余时间</div><div class="big" id="tm">90 s</div></div>
    <div class="stat"><div class="mut">氮气</div><div class="big" id="nt">0%</div></div>
  </div><div class="bar"><div id="nbar"></div></div></div>
  <div class="card"><canvas id="cv" width="460" height="540"></canvas></div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">漂移积氮</h2><p id="ovp">玩法说明:<br>· ↑ 油门、↓ 刹车、← → 转向(W A S D 同样有效)<br>· 高速下打方向,车尾甩出即进入<b>漂移</b>,持续漂移不断得分并积攒氮气<br>· 空格键消耗 25% 氮气,爆发冲刺<br>· 出赛道上草地:没分、还打滑,赶紧回正<br>· 90 秒结束按总分评级</p><button class="btn" id="obtn">发车</button></div></div>
<script>
'use strict';
var W=460,H=540;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var TW=560,TH=360,TR=120,HW=48;
var pts=[];
var x,y,vx,vy,a,boostT,nitro,score,timeLeft,drifting,running,markAcc;
var marks=[],smoke=[];
var keys={};
function $i(id){return document.getElementById(id)}
function buildTrack(){
  var w=TW,h=TH,r=TR;
  var arcs=[
    [w/2-r,-h/2+r,-Math.PI/2,0],
    [w/2-r,h/2-r,0,Math.PI/2],
    [-w/2+r,h/2-r,Math.PI/2,Math.PI],
    [-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]
  ];
  var q=Math.PI*r/2,sw=w-2*r,sh=h-2*r;
  var total=2*sw+2*sh+2*Math.PI*r;
  function arcPt(i,d){
    var c=arcs[i],ang=c[2]+d/r;
    return {x:c[0]+Math.cos(ang)*r,y:c[1]+Math.sin(ang)*r};
  }
  function ptAt(d){
    if(d<sw)return {x:-w/2+r+d,y:-h/2};
    d-=sw;if(d<q)return arcPt(0,d);
    d-=q;if(d<sh)return {x:w/2,y:-h/2+r+d};
    d-=sh;if(d<q)return arcPt(1,d);
    d-=q;if(d<sw)return {x:w/2-r-d,y:h/2};
    d-=sw;if(d<q)return arcPt(2,d);
    d-=q;if(d<sh)return {x:-w/2,y:h/2-r-d};
    d-=sh;return arcPt(3,d);
  }
  var i,n=200;
  pts.length=0;
  for(i=0;i<n;i++)pts.push(ptAt(i/n*total));
}
function onTrackAt(px,py){
  var best=1e12,i,p,dx,dy,d;
  for(i=0;i<pts.length;i++){
    p=pts[i];dx=p.x-px;dy=p.y-py;d=dx*dx+dy*dy;
    if(d<best)best=d;
  }
  return Math.sqrt(best)<HW;
}
function reset(){
  x=60;y=TH/2;a=Math.PI;vx=-40;vy=0;
  boostT=0;nitro=30;score=0;timeLeft=90;drifting=false;markAcc=0;
  marks.length=0;smoke.length=0;
  upd();
}
function upd(){
  $i('sc').textContent=Math.floor(score);
  $i('tm').textContent=Math.ceil(timeLeft)+' s';
  $i('nt').textContent=Math.floor(nitro)+'%';
  $i('nbar').style.width=nitro+'%';
}
function endRun(){
  running=false;
  var grade='C';
  if(score>=6000)grade='S';
  else if(score>=4000)grade='A';
  else if(score>=2200)grade='B';
  $i('ovt').textContent='时间到!';
  $i('ovp').innerHTML='漂移积分 <b>'+Math.floor(score)+'</b><br>评级 <b>'+grade+'</b><br>长弯稳住方向,漂移不断线才是高分秘诀!';
  $i('obtn').textContent='再来一局';
  $i('overlay').classList.remove('hide');
}
function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;upd();endRun();return;}
  var onTk=onTrackAt(x,y);
  var steer=0;
  if(keys.ArrowLeft||keys.a||keys.A)steer=-1;
  if(keys.ArrowRight||keys.d||keys.D)steer=1;
  var spd=Math.hypot(vx,vy);
  a+=steer*2.9*dt*Math.min(1,spd/120);
  var thrust=0;
  if(keys.ArrowUp||keys.w||keys.W)thrust=340;
  if(keys.ArrowDown||keys.s||keys.S)thrust=-200;
  if(boostT>0){boostT-=dt;thrust+=320;}
  if(keys[' ']&&nitro>=25&&boostT<=0){nitro-=25;boostT=1.1;}
  var fx=Math.cos(a),fy=Math.sin(a);
  var grip=(steer!==0&&spd>190)?1.15:2.7;
  var k=1-Math.exp(-grip*dt);
  vx=vx*(1-k)+fx*spd*k;vy=vy*(1-k)+fy*spd*k;
  vx+=fx*thrust*dt;vy+=fy*thrust*dt;
  var m=Math.hypot(vx,vy);
  var fr=Math.pow(onTk?0.5:0.1,dt);
  if(m>0){var nf=m*fr;vx*=nf/m;vy*=nf/m;}
  m=Math.hypot(vx,vy);
  var maxs=boostT>0?540:(onTk?340:110);
  if(m>maxs){vx*=maxs/m;vy*=maxs/m;}
  x+=vx*dt;y+=vy*dt;
  spd=Math.hypot(vx,vy);
  var va=Math.atan2(vy,vx);
  var slip=va-a;
  while(slip>Math.PI)slip-=Math.PI*2;
  while(slip<-Math.PI)slip+=Math.PI*2;
  drifting=onTk&&spd>150&&Math.abs(slip)>0.3;
  if(drifting){
    score+=(12+spd*0.05)*dt;
    nitro=Math.min(100,nitro+26*dt);
    markAcc+=dt;
    while(markAcc>0.03){
      markAcc-=0.03;
      marks.push({x:x,y:y,life:2.2});
      if(marks.length>600)marks.shift();
      smoke.push({x:x-fx*20+(Math.random()-.5)*10,y:y-fy*20+(Math.random()-.5)*10,r:6+Math.random()*8,life:0.6});
    }
  }
  var i;
  for(i=smoke.length-1;i>=0;i--){smoke[i].life-=dt;if(smoke[i].life<=0)smoke.splice(i,1);}
  upd();
}
function rr(x0,y0,w,h,r){
  ctx.beginPath();ctx.moveTo(x0+r,y0);
  ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);
  ctx.arcTo(x0,y0+h,x0,y,r);ctx.arcTo(x0,y0,x0+w,y0,r);ctx.closePath();
}
function draw(){
  ctx.fillStyle='#0f1220';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2-x,300-y);
  ctx.fillStyle='#183a2e';ctx.fillRect(x-800,y-800,1600,1600);
  var i;
  ctx.fillStyle='rgba(0,0,0,.5)';
  for(i=0;i<marks.length;i++)ctx.fillRect(marks[i].x-3,marks[i].y-3,6,6);
  ctx.lineJoin='round';
  ctx.strokeStyle='#453c60';ctx.lineWidth=HW*2;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.stroke();
  ctx.strokeStyle='rgba(255,209,102,.55)';ctx.lineWidth=4;
  ctx.stroke();
  for(i=0;i<smoke.length;i++){
    ctx.fillStyle='rgba(220,220,235,'+(smoke[i].life*0.5)+')';
    ctx.beginPath();ctx.arc(smoke[i].x,smoke[i].y,smoke[i].r*(1.3-smoke[i].life),0,6.2832);ctx.fill();
  }
  ctx.save();
  ctx.translate(x,y);ctx.rotate(a);
  if(boostT>0){
    ctx.fillStyle='rgba(80,220,255,.9)';
    ctx.beginPath();ctx.moveTo(-16,-7);ctx.lineTo(-34-Math.random()*14,0);ctx.lineTo(-16,7);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#ff5c5c';rr(-16,-11,34,22,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(4,-8,10,16);
  ctx.restore();
  if(drifting){
    ctx.font='bold 14px system-ui';ctx.textAlign='center';
    ctx.fillStyle='#ffd166';
    ctx.fillText('DRIFT!',x,y-28);
  }
  ctx.restore();
}
window.addEventListener('keydown',function(e){
  keys[e.key]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>=0)e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.key]=false;});
$i('obtn').addEventListener('click',function(){
  $i('overlay').classList.add('hide');
  reset();running=true;
});
buildTrack();
reset();
var lastT=0;
function loop(t){
  var dt=(t-lastT)/1000;lastT=t;
  if(!(dt>0)||dt>0.05)dt=0.016;
  if(running)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火把暗巷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fbbf24;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#fbbf24;font-size:16px}
.bar{flex:1;min-width:80px;height:10px;background:#0b0e1a;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#fbbf24;width:80%}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#03050c;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fbbf24}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#fbbf24;color:#3a2503;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>火把暗巷</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 黑暗中借火光寻路逃生</p>
  <div class="hud">
    <span>火把油</span>
    <div class="bar"><i id="oil"></i></div>
    <span>油瓶 <b id="oilGot">0/5</b></span>
    <span>用时 <b id="time">0.0s</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">火把暗巷</h2>
      <p id="ovDesc">整座迷宫沉没在黑暗里,只有手中的火把照亮身边一小圈。火光会随时间越来越暗,拾取金色的油瓶可以让火把重燃。在黑暗中摸到绿色微光处即可逃生!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">点亮火把</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
var maskCv=document.createElement("canvas");maskCv.width=W;maskCv.height=H;
var mctx=maskCv.getContext("2d");
function $(id){return document.getElementById(id);}
var elOil=$("oil"),elOilGot=$("oilGot"),elTime=$("time");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s262");
var state="menu";
var grid,player,exitCell,oils,oilGot,torchR,elapsed,pulse;

function loadBest(k){try{return parseFloat(localStorage.getItem(k)||"0")||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function bfs(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function pickFar(dist,minD,count,avoid){
  var cells=[],x,y,res=[],guard=0;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]===0&&dist[y][x]>=minD)cells.push({x:x,y:y});
  }
  while(res.length<count&&cells.length&&guard<500){
    guard++;
    var i=(Math.random()*cells.length)|0,c=cells[i],bad=false,j;
    for(j=0;j<res.length;j++)if(res[j].x===c.x&&res[j].y===c.y)bad=true;
    for(j=0;j<avoid.length;j++)if(avoid[j].x===c.x&&avoid[j].y===c.y)bad=true;
    if(!bad)res.push({x:c.x,y:c.y,got:false});
    cells.splice(i,1);
  }
  return res;
}
function reset(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dist=bfs(1,1);
  oils=pickFar(dist,5,5,[exitCell]);
  oilGot=0;
  torchR=4.6;
  elapsed=0;pulse=0;
  updateHud();
}
function updateHud(){
  elOil.style.width=Math.max(0,Math.min(100,(torchR-2)/3.4*100))+"%";
  elOilGot.textContent=oilGot+"/"+oils.length;
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  var i;
  for(i=0;i<oils.length;i++){
    if(!oils[i].got&&oils[i].x===nx&&oils[i].y===ny){
      oils[i].got=true;oilGot++;
      torchR=Math.min(5.4,torchR+1.6);
      updateHud();
    }
  }
  if(nx===exitCell.x&&ny===exitCell.y)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||elapsed<best){best=elapsed;saveBest("mg_s262",best);isNew=true;}
  ovTitle.textContent="逃出暗巷!";
  ovDesc.textContent=isNew?"新纪录!黑暗从未拦住你的脚步。":"你举着将熄的火把,终于看见了天光。";
  ovScore.style.display="block";
  ovScore.textContent="用时 "+elapsed.toFixed(1)+"s · 油瓶 "+oilGot+"/"+oils.length+" · 最快 "+best.toFixed(1)+"s";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#232a4d";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#2c3560";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function drawMask(px,py,r){
  mctx.clearRect(0,0,W,H);
  mctx.fillStyle="rgba(3,5,12,0.965)";
  mctx.fillRect(0,0,W,H);
  mctx.globalCompositeOperation="destination-out";
  var grd=mctx.createRadialGradient(px,py,r*0.3,px,py,r);
  grd.addColorStop(0,"rgba(0,0,0,1)");
  grd.addColorStop(1,"rgba(0,0,0,0)");
  mctx.fillStyle=grd;
  mctx.fillRect(px-r,py-r,r*2,r*2);
  mctx.globalCompositeOperation="source-over";
  ctx.drawImage(maskCv,0,0);
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  for(i=0;i<oils.length;i++){
    if(oils[i].got)continue;
    var ox=oils[i].x*CELL,oy=oils[i].y*CELL;
    ctx.fillStyle="#fbbf24";
    ctx.shadowColor="#fbbf24";ctx.shadowBlur=8;
    ctx.fillRect(ox+7,oy+7,CELL-14,CELL-13);
    ctx.fillRect(ox+9,oy+4,CELL-18,4);
    ctx.shadowBlur=0;
  }
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle="#67e8f9";
  ctx.shadowColor="#22d3ee";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  var flick=torchR*CELL*(1+0.035*Math.sin(pulse*7));
  drawMask(px,py,flick);
  var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
  var g2=ctx.createRadialGradient(ex,ey,1,ex,ey,24);
  g2.addColorStop(0,"rgba(74,222,128,0.9)");
  g2.addColorStop(1,"rgba(74,222,128,0)");
  ctx.fillStyle=g2;
  ctx.beginPath();ctx.arc(ex,ey,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(251,191,36,0.9)";
  ctx.beginPath();ctx.arc(px+7,py-7,2.5+Math.sin(pulse*9)*0.8,0,Math.PI*2);ctx.fill();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.006;
  if(state==="playing"){
    elapsed+=dt/1000;
    torchR=Math.max(2.0,torchR-dt*0.000095);
    elTime.textContent=elapsed.toFixed(1)+"s";
    updateHud();
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十环靶心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#ffd54f;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px}
.hud{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:14px;color:#c7cbe8;margin-bottom:6px}
.hud b{color:#ffd54f;font-size:15px}
#msg{min-height:18px;text-align:center;color:#fbbf24;font-size:13px;margin-bottom:6px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#ffd54f}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#ffd54f;color:#332600;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>十环靶心</h1>
  <p class="hint">移动瞄准 · 点击放箭 · 十箭总分达到 60 即通关</p>
  <div class="hud">
    <span>箭 <b id="ar">0</b>/10</span>
    <span>得分 <b id="sc">0</b></span>
    <span>目标 <b>60</b></span>
  </div>
  <div id="msg"></div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">十环靶心</h2>
      <p id="ovD">最经典的射箭考验:靶分十环,越靠中心环数越高。持弓的手会微微颤动,看准晃动的准星再放手。十箭之内拿下 60 分,便是神射手。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btn">开始射击</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
const $=function(id){return document.getElementById(id);};
const cv=$("cv"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
const ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btn=$("btn");
const elAr=$("ar"),elSc=$("sc"),elMsg=$("msg");
const CX=240,CY=250,TR=110,OX=240,OY=540,FLIGHT=0.2;
const RING=["#eceff1","#eceff1","#455a64","#455a64","#1e88e5","#1e88e5","#e53935","#e53935","#ffc107","#ffc107"];
let state="menu",score=0,used=0,tp=0,endT=-1;
let mouse={x:240,y:250},flies=[],marks=[];
function evPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function swayAim(){return{x:mouse.x+Math.sin(tp*2.1)*3.5,y:mouse.y+Math.cos(tp*1.63)*3.2};}
function ringVal(dx,dy){const d=Math.hypot(dx,dy);if(d>TR)return 0;return Math.max(1,10-Math.floor(d/(TR/10)));}
function fire(){
  if(state!=="play"||used>=10||flies.length>=3)return;
  const a=swayAim();
  flies.push({x0:OX,y0:OY,x1:a.x,y1:a.y,t:0});
}
function resolve(f){
  const v=ringVal(f.x1-CX,f.y1-CY);
  used++;score+=v;
  marks.push({x:f.x1,y:f.y1,v:v});
  elMsg.textContent=v>0?(v+" 环"+(v>=9?"!":"")):"脱靶了";
  elAr.textContent=used;elSc.textContent=score;
  if(used>=10)endT=0.7;
}
function startGame(){
  score=0;used=0;flies=[];marks=[];endT=-1;tp=0;
  elMsg.textContent="";elAr.textContent="0";elSc.textContent="0";
  state="play";ov.classList.add("hide");
}
function finish(){
  state="over";
  const win=score>=60;
  ovT.textContent=win?"神射手!":"箭未尽意";
  ovD.textContent=win?"十箭收官,手稳心静,靶心已在你掌握之中。":"十箭打完,还差些火候。深呼吸,稳住手腕,再来一轮。";
  ovS.textContent="总分 "+score+" · 目标 60 分";
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
btn.addEventListener("click",function(){startGame();});
cv.addEventListener("mousemove",function(e){mouse=evPos(e);});
cv.addEventListener("mousedown",function(e){mouse=evPos(e);fire();});
cv.addEventListener("touchstart",function(e){mouse=evPos(e.touches[0]);fire();e.preventDefault();},{passive:false});
document.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&state!=="play"){e.preventDefault();startGame();}
});
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  if(state!=="menu")tp+=dt;
  if(state==="play"){
    for(let i=flies.length-1;i>=0;i--){
      const f=flies[i];f.t+=dt/FLIGHT;
      if(f.t>=1){resolve(f);flies.splice(i,1);}
    }
    if(endT>0){endT-=dt;if(endT<=0)finish();}
  }
  draw();
}
function drawTarget(){
  ctx.strokeStyle="rgba(0,0,0,0.35)";ctx.lineWidth=1;
  for(let i=10;i>=1;i--){
    ctx.fillStyle=RING[10-i];
    ctx.beginPath();ctx.arc(CX,CY,TR*i/10,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle="#ff6f00";ctx.beginPath();ctx.arc(CX,CY,3,0,Math.PI*2);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1a2036");g.addColorStop(1,"#10131f");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#173325";ctx.fillRect(0,470,W,H-470);
  ctx.fillStyle="#1d3f2d";ctx.fillRect(0,470,W,6);
  ctx.strokeStyle="#5d4a2f";ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(CX-40,CY+TR+14);ctx.lineTo(CX-70,500);ctx.moveTo(CX+40,CY+TR+14);ctx.lineTo(CX+70,500);ctx.stroke();
  drawTarget();
  for(let i=0;i<marks.length;i++){
    const m=marks[i];
    ctx.strokeStyle=m.v>=9?"#00e676":"#ffffff";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(m.x-5,m.y-5);ctx.lineTo(m.x+5,m.y+5);ctx.moveTo(m.x+5,m.y-5);ctx.lineTo(m.x-5,m.y+5);ctx.stroke();
  }
  ctx.strokeStyle="#c8a253";ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(OX,OY,26,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(OX-23,OY-12);ctx.lineTo(OX+23,OY-12);ctx.stroke();
  for(let i=0;i<flies.length;i++){
    const f=flies[i],e=Math.min(1,f.t);
    const px=f.x0+(f.x1-f.x0)*e,py=f.y0+(f.y1-f.y0)*e;
    const ang=Math.atan2(f.y1-f.y0,f.x1-f.x0);
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);
    ctx.strokeStyle="#e0c987";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(0,0);ctx.stroke();
    ctx.fillStyle="#f5f5f5";
    ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-3,-4);ctx.lineTo(-3,4);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  if(state==="play"&&used<10){
    const a=swayAim();
    ctx.strokeStyle="#00e676";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(a.x,a.y,12,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(a.x-18,a.y);ctx.lineTo(a.x-6,a.y);ctx.moveTo(a.x+6,a.y);ctx.lineTo(a.x+18,a.y);
    ctx.moveTo(a.x,a.y-18);ctx.lineTo(a.x,a.y-6);ctx.moveTo(a.x,a.y+6);ctx.lineTo(a.x,a.y+18);ctx.stroke();
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

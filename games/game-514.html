<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>龙蛋融合</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{position:relative;background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#c084fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;line-height:1.5;margin-bottom:8px}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;color:#c7cbe8;margin-bottom:6px}
.hud b{color:#ffd76a;font-size:14px}
#msg{min-height:18px;text-align:center;color:#7dd3fc;font-size:13px;margin-bottom:6px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.cell{height:58px;border:1px solid #2e3554;border-radius:10px;background:#1b2138;cursor:pointer;text-align:center;font-size:11px;color:#e8eaf6;user-select:none;display:flex;flex-direction:column;justify-content:center}
.cell .em{font-size:18px;line-height:1.3}
.cell.sel{outline:3px solid #c084fc}
.acts{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.btn{background:#2c3352;color:#e8eaf6;border:1px solid #3d4670;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.gold{background:#ffd76a;color:#4a3405;border-color:#ffe29a;font-weight:700}
.shop{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#20263f;border:1px solid #2e3554;border-radius:10px;padding:6px 10px;cursor:pointer}
.item.off{opacity:.45}
.item .nm{font-size:13px;font-weight:600}
.item .ds{font-size:11px;color:#8b90b0;margin-top:1px}
.item .pr{font-size:12.5px;color:#ffd76a;font-weight:700;white-space:nowrap}
.item .own{font-size:11px;color:#7dd3fc}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.93);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:9}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8}
.overlay .big{font-size:17px;color:#ffd76a;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>龙蛋融合</h1>
  <p class="hint">花魔力凝聚 Lv1 龙蛋 · 点击两枚同级蛋融合升级 · 链到 <b>Lv8 神龙</b> 即胜利 · 满屏时用唤龙铃清理</p>
  <div class="hud">
    <span>魔力 <b id="hMana">0</b></span>
    <span>凝聚 <b id="hGain">4</b>/次</span>
    <span>回复 <b id="hRegen">2</b>/秒</span>
    <span>最高 <b id="hMax">-</b></span>
  </div>
  <div id="msg"></div>
  <div id="grid"></div>
  <div class="acts">
    <button class="btn gold" id="btnSummon">凝聚龙蛋 (8魔力)</button>
    <button class="btn" id="btnBell">唤龙铃 (25魔力清Lv1)</button>
  </div>
  <div class="shop" id="shop"></div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">龙蛋融合</h2>
    <p id="ovDesc">先点一枚蛋再点另一枚同级蛋,两枚融合成高一阶!龙蛋链:龙蛋→裂壳蛋→小龙崽→幼龙→少年龙→成年龙→远古龙→神龙。场上每颗蛋都会缓慢回复魔力;卡住时用唤龙铃清掉低级蛋。孵出 Lv8 神龙即称霸龙谷!</p>
    <p class="big" id="ovScore"></p>
    <button id="btnGo">进入龙谷</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elMana=$("hMana"),elGain=$("hGain"),elRegen=$("hRegen"),elMax=$("hMax"),elMsg=$("msg");
var gridEl=$("grid"),btnSummon=$("btnSummon"),btnBell=$("btnBell"),shopEl=$("shop");
var ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
var names=["","龙蛋","裂壳蛋","小龙崽","幼龙","少年龙","成年龙","远古龙","神龙"];
var ems=["","🥚","🐣","🐲","🦎","🐉","🐲","🌟","🔥"];
var cols=["","#3f4a6b","#3f6b52","#6b5a2f","#6b3f4f","#4f3f6b","#2f5a6b","#8a6b1f","#b91c1c"];
var ups=[
 {nm:"魔力泉",ds:"魔力回复 +0.6/秒",base:80,mult:2,max:10},
 {nm:"凝聚术",ds:"每次凝聚 +2 魔力",base:70,mult:2,max:10},
 {nm:"双生咒",ds:"凝聚时有概率直接出高一级",base:200,mult:2.4,max:3}
];
var N=20;
var mana,cells,sel,upLv,state,msgT,cellEls=[],rows=[];
function fmt(n){n=Math.floor(n);if(n>=10000)return (n/10000).toFixed(2)+"万";return String(n);}
function gain(){return 4+2*upLv[1];}
function baseRegen(){return 2+0.6*upLv[0];}
function upCost(i){return Math.floor(ups[i].base*Math.pow(ups[i].mult,upLv[i]));}
function regen(){var s=0,i;for(i=0;i<N;i++)s+=cells[i];return baseRegen()+0.15*s;}
function say(t){elMsg.textContent=t;msgT=2.4;}
function buildUI(){
  gridEl.innerHTML="";cellEls=[];
  var i;
  for(i=0;i<N;i++){
    var c=document.createElement("div");
    c.className="cell";
    (function(idx){c.addEventListener("click",function(){tapCell(idx);});})(i);
    gridEl.appendChild(c);cellEls.push(c);
  }
  shopEl.innerHTML="";rows=[];
  for(i=0;i<ups.length;i++){
    var d=document.createElement("div");
    d.className="item";
    d.innerHTML='<div><div class="nm">'+ups[i].nm+' <span class="own"></span></div><div class="ds">'+ups[i].ds+'</div></div><div class="pr"></div>';
    (function(idx){d.addEventListener("click",function(){buyUp(idx);});})(i);
    shopEl.appendChild(d);
    rows.push({el:d,own:d.querySelector(".own"),pr:d.querySelector(".pr")});
  }
}
function tapCell(i){
  if(state!=="play")return;
  if(cells[i]===0)return;
  if(sel===-1){sel=i;}
  else if(sel===i){sel=-1;}
  else if(cells[sel]===cells[i]){
    cells[i]=cells[i]+1;cells[sel]=0;sel=-1;
    var v=cells[i];
    say("融合成功:"+names[v]+"!");
    if(v>=8){
      state="over";
      showOv("神龙降世!","Lv8 神龙破壳长啸,龙谷众兽俯首称臣!","召唤与融合的奇迹达成!");
      return;
    }
  }else{sel=i;}
  render();
}
function summon(){
  if(state!=="play")return;
  if(mana<8){say("魔力不足,先点几下凝聚!");return;}
  var empties=[],i;
  for(i=0;i<N;i++)if(cells[i]===0)empties.push(i);
  if(empties.length===0){say("场地满了!先融合,或用唤龙铃清理!");return;}
  mana-=8;
  var pos=empties[Math.floor(Math.random()*empties.length)];
  var lv=1;
  if(Math.random()<0.12*upLv[2])lv=2;
  cells[pos]=lv;
}
btnSummon.addEventListener("click",summon);
btnBell.addEventListener("click",function(){
  if(state!=="play")return;
  if(mana<25){say("魔力不足 25,摇不动铃铛!");return;}
  var n=0,i;
  for(i=0;i<N;i++)if(cells[i]===1){cells[i]=0;n++;}
  if(n===0){say("场上没有 Lv1 龙蛋可清!");return;}
  mana-=25;sel=-1;
  say("铃声回荡,"+n+" 枚龙蛋化为了魔力!");
});
function buyUp(i){
  if(state!=="play")return;
  if(upLv[i]>=ups[i].max){say("该项已升满!");return;}
  var c=upCost(i);
  if(mana<c){say("魔力不够,稍等回复!");return;}
  mana-=c;upLv[i]++;say(ups[i].nm+" 升到 Lv"+upLv[i]+"!");
}
function startGame(){
  mana=0;sel=-1;upLv=[0,0,0];msgT=0;
  cells=[];
  var i;
  for(i=0;i<N;i++)cells.push(0);
  elMsg.textContent="";ov.classList.add("hide");
  state="play";render();
}
btn.addEventListener("click",startGame);
document.addEventListener("keydown",function(e){
  if((e.key===" "||e.key==="Enter")&&state!=="play"){e.preventDefault();startGame();}
});
function render(){
  var i,mx=0;
  for(i=0;i<N;i++)if(cells[i]>mx)mx=cells[i];
  elMana.textContent=fmt(mana);elGain.textContent=gain();
  elRegen.textContent=regen().toFixed(1);
  elMax.textContent=mx>0?("Lv"+mx):"-";
  for(i=0;i<N;i++){
    var el=cellEls[i];
    el.classList.toggle("sel",sel===i);
    if(cells[i]===0){el.textContent="";}
    else{
      el.style.background=cols[cells[i]];
      el.innerHTML='<span class="em">'+ems[cells[i]]+'</span>Lv'+cells[i]+" "+names[cells[i]];
    }
    if(cells[i]===0)el.style.background="#1b2138";
  }
  for(i=0;i<ups.length;i++){
    var full=upLv[i]>=ups[i].max,c=upCost(i);
    rows[i].pr.textContent=full?"已满":fmt(c)+"魔";
    rows[i].own.textContent="Lv"+upLv[i]+"/"+ups[i].max;
    rows[i].el.classList.toggle("off",full||mana<c);
  }
}
function showOv(t2,d,s){
  ovT.textContent=t2;ovD.textContent=d;ovS.textContent=s;ovS.style.display="block";
  btn.textContent="再来一局";ov.classList.remove("hide");
}
var last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  var dt=Math.min(50,t-last);last=t;
  if(state!=="play")return;
  var ds=dt/1000;
  mana+=regen()*ds;
  if(msgT>0){msgT-=ds;if(msgT<=0)elMsg.textContent="";}
  render();
}
mana=0;sel=-1;upLv=[0,0,0];state="menu";msgT=0;
cells=[];
var _i;
for(_i=0;_i<N;_i++)cells.push(0);
buildUI();render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

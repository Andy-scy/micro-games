<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无尽压境</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center}
h1{font-size:22px;margin:14px 0 2px;color:#ffd166}
#tip{margin:0 0 10px;font-size:13px;color:#9aa3c7;text-align:center;padding:0 12px}
#wrap{position:relative;width:min(96vw,480px)}
canvas{display:block;width:100%;background:#151a30;border-radius:14px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#ov.hide{display:none}
#ov h2{margin:0;font-size:26px;color:#ffd166}
#ov p{margin:0;font-size:14px;color:#c3c9e8;line-height:1.8;white-space:pre-line}
#ov button{margin-top:8px;padding:10px 36px;font-size:16px;border:none;border-radius:999px;background:#ffd166;color:#1a1d33;font-weight:bold;cursor:pointer;font-family:inherit}
#ov button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>无尽压境</h1>
<p id="tip">新一波砖块不断从天而降,把旧阵往下压! · 砖块压到红色警戒线立即失败 · 空格发球</p>
<div id="wrap">
<canvas id="cv" width="480" height="600"></canvas>
<div id="ov"><h2 id="ovT">无尽压境</h2><p id="ovP">无尽模式:每清空一波,新的一排立即压下
整阵步步逼近红色警戒线,看你能守住多少波</p><button id="ovB">开始游戏</button></div>
</div>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const ov = document.getElementById("ov");
const ovT = document.getElementById("ovT");
const ovP = document.getElementById("ovP");
const ovB = document.getElementById("ovB");

const COLORS = ["#ffd166", "#ef476f", "#06d6a0", "#4cc9f0", "#b388ff", "#ff8fa3"];
const BW = 52, BH = 20, GAP = 4, COLS = 8;
const OX = (W - COLS * (BW + GAP) + GAP) / 2;
const ROWH = BH + GAP;
const DANGER = H - 66;

let state = "menu";
let score = 0, lives = 3, wave = 0;
let bricks = [], balls = [];
let waveT = 10;
const pad = { x: W / 2, y: H - 40, w: 92, h: 14 };
const keys = {};
let last = 0;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function ballSpeed() { return Math.min(430, 300 + wave * 10); }

function spawnRow() {
  const count = Math.min(COLS, 4 + Math.ceil(wave / 2));
  const cols = [];
  while (cols.length < count) {
    const c = Math.floor(Math.random() * COLS);
    if (cols.indexOf(c) < 0) cols.push(c);
  }
  for (const c of cols) {
    bricks.push({
      x: OX + c * (BW + GAP), y: 58, w: BW, h: BH, hp: wave >= 5 && Math.random() < 0.3 ? 2 : 1,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  }
  wave++;
}

function resetBall() {
  balls = [{ x: pad.x, y: pad.y - 10, vx: 0, vy: 0, r: 7, stuck: true }];
}

function launch() {
  for (const b of balls) {
    if (b.stuck) {
      b.stuck = false;
      const a = Math.random() * 0.6 - 0.3;
      b.vx = ballSpeed() * Math.sin(a);
      b.vy = -ballSpeed() * Math.cos(a);
    }
  }
}

function bouncePad(b) {
  const rel = clamp((b.x - pad.x) / (pad.w / 2), -1, 1);
  const ang = rel * 1.1;
  const sp = ballSpeed();
  b.vx = sp * Math.sin(ang);
  b.vy = -sp * Math.cos(ang);
  b.y = pad.y - b.r;
}

function update(dt) {
  if (keys.ArrowLeft) pad.x -= 430 * dt;
  if (keys.ArrowRight) pad.x += 430 * dt;
  pad.x = clamp(pad.x, pad.w / 2, W - pad.w / 2);

  waveT -= dt;
  if (waveT <= 0) {
    for (const br of bricks) br.y += ROWH;
    spawnRow();
    waveT = Math.max(5, 10 - wave * 0.3);
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.stuck) { b.x = pad.x; b.y = pad.y - b.r - 1; continue; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
    if (b.vy > 0 && b.y + b.r >= pad.y && b.y - b.r <= pad.y + pad.h && Math.abs(b.x - pad.x) <= pad.w / 2 + b.r) {
      bouncePad(b);
    }
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
        const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
        if (ox < oy) { b.vx = -b.vx; b.x += (b.x < br.x + br.w / 2) ? -ox : ox; }
        else { b.vy = -b.vy; b.y += (b.y < br.y + br.h / 2) ? -oy : oy; }
        br.hp--;
        score += 10 + wave * 2;
        break;
      }
    }
    if (b.y > H + 30) balls.splice(i, 1);
  }

  if (balls.length === 0) {
    lives--;
    if (lives <= 0) { endGame(); return; }
    resetBall();
  }
  for (const br of bricks) {
    if (br.hp > 0 && br.y + BH >= DANGER) { endGame(); return; }
  }
  if (bricks.length > 0 && bricks.every(br => br.hp <= 0)) {
    bricks = [];
    score += 50;
    spawnRow();
    waveT = Math.max(5, 10 - wave * 0.3);
  }
}

function endGame() {
  state = "over";
  ovT.textContent = "防线失守";
  ovP.textContent = "坚守 " + wave + " 波,得分 " + score + "\n砖块压境,大势已去,再来!";
  ovB.textContent = "再来一局";
  ov.classList.remove("hide");
}

function startGame() {
  score = 0; lives = 3; wave = 0; waveT = 10;
  bricks = [];
  pad.x = W / 2;
  spawnRow();
  for (const br of bricks) br.y += ROWH;
  spawnRow();
  resetBall();
  ov.classList.add("hide");
  state = "play";
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(239,71,111,.6)";
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(0, DANGER);
  ctx.lineTo(W, DANGER);
  ctx.stroke();
  ctx.setLineDash([]);
  let low = 0;
  for (const br of bricks) {
    if (br.hp <= 0) continue;
    ctx.fillStyle = br.hp >= 2 ? "#b388ff" : br.color;
    rr(br.x, br.y, br.w, br.h, 4);
    if (br.y + BH > low) low = br.y + BH;
  }
  ctx.fillStyle = "#ffffff";
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#ffd166";
  rr(pad.x - pad.w / 2, pad.y, pad.w, pad.h, 7);
  ctx.font = "bold 15px system-ui, sans-serif";
  ctx.fillStyle = "#e8eaf6";
  ctx.textAlign = "left";
  ctx.fillText("得分 " + score, 12, 32);
  ctx.textAlign = "right";
  ctx.fillText("生命 " + lives, W - 12, 32);
  ctx.textAlign = "center";
  ctx.fillStyle = low >= DANGER - 70 ? "#ef476f" : "#9aa3c7";
  ctx.fillText("第 " + wave + " 波 · 下一波 " + Math.max(0, waveT).toFixed(0) + " 秒", W / 2, 32);
}

function pointerX(e) {
  const rect = cv.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}

cv.addEventListener("mousemove", e => { pad.x = clamp(pointerX(e), pad.w / 2, W - pad.w / 2); });
cv.addEventListener("mousedown", () => { if (state === "play") launch(); });
cv.addEventListener("touchstart", e => {
  e.preventDefault();
  pad.x = clamp(pointerX(e.touches[0]), pad.w / 2, W - pad.w / 2);
  if (state === "play") launch();
}, { passive: false });
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  pad.x = clamp(pointerX(e.touches[0]), pad.w / 2, W - pad.w / 2);
}, { passive: false });

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === " ") e.preventDefault();
  keys[e.key] = true;
  if (e.key === " " && state === "play") launch();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

ovB.addEventListener("click", startGame);

resetBall();

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - last) / 1000, 0.033);
  last = ts;
  if (state === "play") update(dt);
  draw();
}
requestAnimationFrame(loop);
</script>
</body>
</html>

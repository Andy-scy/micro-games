<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印刷急单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{position:relative;background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#a78bfa;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;line-height:1.5;margin-bottom:8px}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;color:#c7cbe8;margin-bottom:6px}
.hud b{color:#ffd76a;font-size:14px}
#msg{min-height:18px;text-align:center;color:#fbbf24;font-size:13px;margin-bottom:6px}
#order{background:#131728;border:1px solid #2e3554;border-radius:12px;padding:12px;margin-bottom:8px;text-align:center}
#ordNo{font-size:14px;font-weight:700;color:#a78bfa}
#ordPages{font-size:13px;color:#c7cbe8;margin:4px 0}
.bar{height:14px;background:#0b0e1a;border-radius:7px;overflow:hidden;margin-top:4px}
#pageFill{height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#c4b5fd)}
#timeFill{height:100%;width:0;background:linear-gradient(90deg,#16a34a,#4ade80)}
#timeFill.late{background:linear-gradient(90deg,#dc2626,#f87171)}
.barlb{font-size:11px;color:#8b90b0;text-align:left;margin-top:6px}
.acts{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.btn{background:#2c3352;color:#e8eaf6;border:1px solid #3d4670;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn.gold{background:#ffd76a;color:#4a3405;border-color:#ffe29a;font-weight:700}
.shop{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#20263f;border:1px solid #2e3554;border-radius:10px;padding:6px 10px;cursor:pointer}
.item.off{opacity:.45}
.item .nm{font-size:13px;font-weight:600}
.item .ds{font-size:11px;color:#8b90b0;margin-top:1px}
.item .pr{font-size:12.5px;color:#ffd76a;font-weight:700;white-space:nowrap}
.item .own{font-size:11px;color:#7dd3fc}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.93);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:9}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8}
.overlay .big{font-size:17px;color:#ffd76a;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>印刷急单</h1>
  <p class="hint">接单狂点「印刷」(或空格键)赶在时限内交货 · 准时有奖励,拖期砸口碑 · 完成 <b>12</b> 张订单获胜</p>
  <div class="hud">
    <span>资金 <b id="hMoney">0</b></span>
    <span>完成 <b id="hDone">0</b>/12</span>
    <span>声誉 <b id="hRep">8</b></span>
    <span>印刷 <b id="hPress">1</b> 页/次</span>
  </div>
  <div id="msg"></div>
  <div id="order">
    <div id="ordNo">订单 #1</div>
    <div id="ordPages">0 / 11 页</div>
    <div class="bar"><div id="pageFill"></div></div>
    <div class="barlb">剩余时限</div>
    <div class="bar"><div id="timeFill"></div></div>
  </div>
  <div class="acts">
    <button class="btn gold" id="btnPrint">印 刷</button>
  </div>
  <div class="shop" id="shop"></div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">印刷急单</h2>
    <p id="ovDesc">出版社的急单一张接一张:页数越来越多、给的时间越来越抠。狂点印刷键(空格也行)赶工,交货越快小费越多,超时则订单作废、声誉受损。升级印机、自动供纸与客服部,完成 12 张订单成为印厂传奇!</p>
    <p class="big" id="ovScore"></p>
    <button id="btnGo">接单开工</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elMoney=$("hMoney"),elDone=$("hDone"),elRep=$("hRep"),elPress=$("hPress"),elMsg=$("msg");
var ordNo=$("ordNo"),ordPages=$("ordPages"),pageFill=$("pageFill"),timeFill=$("timeFill");
var btnPrint=$("btnPrint"),shopEl=$("shop"),ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
var WIN=12;
var ups=[
 {nm:"高速印机",ds:"每次印刷 +1 页",base:60,mult:2,max:10},
 {nm:"自动供纸",ds:"每秒自动印 +0.8 页",base:120,mult:2,max:8},
 {nm:"客服部",ds:"每单时限 +25%",base:150,mult:2.2,max:4}
];
var money,done,rep,orderNo,pages,pagesDone,timeLeft,timeMax,gapT,active,upLv,state,msgT,rows=[];
function fmt(n){n=Math.floor(n);if(n>=10000)return (n/10000).toFixed(2)+"万";return String(n);}
function press(){return 1+upLv[0];}
function autoRate(){return 0.8*upLv[1];}
function upCost(i){return Math.floor(ups[i].base*Math.pow(ups[i].mult,upLv[i]));}
function say(t){elMsg.textContent=t;msgT=2.6;}
function newOrder(){
  pages=8+orderNo*3;
  var perPage=1.6*Math.pow(0.94,orderNo);
  timeMax=(5+pages*perPage)*(1+0.25*upLv[2]);
  timeLeft=timeMax;pagesDone=0;active=true;
}
function buildShop(){
  shopEl.innerHTML="";rows=[];
  var i;
  for(i=0;i<ups.length;i++){
    var d=document.createElement("div");
    d.className="item";
    d.innerHTML='<div><div class="nm">'+ups[i].nm+' <span class="own"></span></div><div class="ds">'+ups[i].ds+'</div></div><div class="pr"></div>';
    (function(idx){d.addEventListener("click",function(){buyUp(idx);});})(i);
    shopEl.appendChild(d);
    rows.push({el:d,own:d.querySelector(".own"),pr:d.querySelector(".pr")});
  }
}
function buyUp(i){
  if(state!=="play")return;
  if(upLv[i]>=ups[i].max){say("该项已升满!");return;}
  var c=upCost(i);
  if(money<c){say("资金不够!");return;}
  money-=c;upLv[i]++;
  if(i===2&&active)timeLeft+=timeMax*0.25;
  say(ups[i].nm+" 升到 Lv"+upLv[i]+"!");
}
function doPrint(){
  if(state!=="play"||!active)return;
  pagesDone+=press();
}
btnPrint.addEventListener("click",doPrint);
document.addEventListener("keydown",function(e){
  if(state==="play"&&e.key===" "){e.preventDefault();doPrint();}
  if((e.key===" "||e.key==="Enter")&&state!=="play"){e.preventDefault();startGame();}
});
function startGame(){
  money=0;done=0;rep=8;orderNo=1;upLv=[0,0,0];gapT=0;msgT=0;
  newOrder();
  elMsg.textContent="";ov.classList.add("hide");
  state="play";render();
}
btn.addEventListener("click",startGame);
function render(){
  var i;
  elMoney.textContent=fmt(money);elDone.textContent=done;elRep.textContent=rep;elPress.textContent=press();
  if(!active){ordNo.textContent="印刷机预热中…";ordPages.textContent="下一单马上就来";
    pageFill.style.width="0";timeFill.style.width="0";timeFill.classList.remove("late");}
  else{
    ordNo.textContent="订单 #"+orderNo;
    ordPages.textContent=Math.floor(pagesDone)+" / "+pages+" 页";
    pageFill.style.width=Math.min(100,pagesDone/pages*100)+"%";
    var tp=timeLeft/timeMax*100;
    timeFill.style.width=Math.max(0,tp)+"%";
    timeFill.classList.toggle("late",tp<33);
  }
  for(i=0;i<ups.length;i++){
    var full=upLv[i]>=ups[i].max,c=upCost(i);
    rows[i].pr.textContent=full?"已满":fmt(c);
    rows[i].own.textContent="Lv"+upLv[i]+"/"+ups[i].max;
    rows[i].el.classList.toggle("off",full||money<c);
  }
}
var last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  var dt=Math.min(50,t-last);last=t;
  if(state!=="play")return;
  var ds=dt/1000;
  if(!active){
    gapT-=ds;
    if(gapT<=0){orderNo++;newOrder();}
  }else{
    pagesDone+=autoRate()*ds;
    timeLeft-=ds;
    if(pagesDone>=pages){
      var pay=Math.floor(pages*(2+rep*0.08)+timeLeft*2);
      money+=pay;done++;rep=Math.min(15,rep+1);
      active=false;gapT=0.9;
      say("准时交货!进账 "+fmt(pay)+" 金"+(timeLeft>timeMax*0.5?",手速惊人!":"!"));
    }else if(timeLeft<=0){
      rep=Math.max(0,rep-2);
      active=false;gapT=0.9;
      say("订单超时作废!出版社很生气,声誉 -2");
    }
  }
  if(msgT>0){msgT-=ds;if(msgT<=0)elMsg.textContent="";}
  render();
  if(done>=WIN){
    state="over";
    showOv("印厂传奇!","十二张急单全部按时交付,出版社会把你的名字印在扉页上!","完成订单 "+done+" 张 · 资金 "+fmt(money)+" · 声誉 "+rep);
  }
}
function showOv(t2,d,s){
  ovT.textContent=t2;ovD.textContent=d;ovS.textContent=s;ovS.style.display="block";
  btn.textContent="再来一局";ov.classList.remove("hide");
}
money=0;done=0;rep=8;orderNo=1;upLv=[0,0,0];gapT=0;state="menu";msgT=0;
pages=0;pagesDone=0;timeLeft=0;timeMax=1;active=false;
buildShop();render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

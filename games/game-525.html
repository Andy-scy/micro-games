<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合成食堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#f6bd60;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px;line-height:1.7}
.order{display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;color:#f6bd60;background:#20264a;border-radius:10px;padding:7px 0;margin-bottom:8px}
.order b{color:#fff}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f6bd60;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#f6bd60}
.overlay p{color:#aab0d0;font-size:13px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#f6bd60;color:#3d2a06;border:none;border-radius:10px;padding:10px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>合成食堂</h1>
  <p class="hint">点击食材吸收相邻同级食材升级,按订单出菜<br>食材会定时上架,完成 5 张订单即可开业大吉</p>
  <div class="order">订单:<b id="odName">—</b> ×<b id="odNeed">0</b>(<b id="odGot">0</b>) · 已完成 <b id="odDone">0</b>/5</div>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>步数 <b id="steps">12</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="320" height="300"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">合成食堂</h2>
      <p id="ovP">看准订单,把相邻的同级食材点合成高级菜\n每张订单奖励步数,步数用完即打烊</p>
      <div class="big" id="ovS"></div>
      <button id="btn">开 始</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var COLS=7,ROWS=6,CELL=42,BX=13,BY=24;
var NAME=['','白饭','饭团','寿司','玉子','天妇罗','鳗鱼饭','蛋糕','盛宴'];
var CCOL=['','#8d99ae','#a8b8d0','#f4a261','#f9d71c','#e76f51','#e56399','#a06cd5','#ffd166'];
var grid=[],score=0,steps=12,order=null,done=0,state='ready';
var supplyT=0,flashes=[],noT=0;
function addScore(n){score+=n;$('score').textContent=score;}
function newBoard(){
  var r,c;
  grid=[];
  for(r=0;r<ROWS;r++){
    grid.push([]);
    for(c=0;c<COLS;c++)grid[r].push(Math.random()<0.62?(1+Math.floor(Math.random()*2)):0);
  }
}
function maxOnBoard(){
  var m=0,r,c;
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(grid[r][c]>m)m=grid[r][c];
  return m;
}
function newOrder(){
  var base=maxOnBoard();
  var lvl=Math.min(8,Math.max(2,base+1+Math.floor(Math.random()*2)));
  var need=lvl>=6?1:(lvl>=4?1+Math.floor(Math.random()*2):2);
  order={lvl:lvl,need:need,got:0};
  $('odName').textContent=NAME[lvl];$('odNeed').textContent=String(need);$('odGot').textContent='0';
}
function clickAt(x,y){
  if(state!=='play')return;
  var c=Math.floor((x-BX)/CELL),r=Math.floor((y-BY)/CELL);
  if(r<0||r>=ROWS||c<0||c>=COLS||grid[r][c]===0)return;
  var lvl=grid[r][c],dirs=[[1,0],[-1,0],[0,1],[0,-1]],i,hit=[];
  for(i=0;i<4;i++){
    var rr=r+dirs[i][0],cc=c+dirs[i][1];
    if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&grid[rr][cc]===lvl)hit.push([rr,cc]);
  }
  if(hit.length===0){noT=0.3;return;}
  for(i=0;i<hit.length;i++)grid[hit[i][0]][hit[i][1]]=0;
  var nl=(lvl<8)?lvl+1:8;
  grid[r][c]=nl;
  flashes.push({r:r,c:c,t:0});
  addScore(nl*12);
  steps--;$('steps').textContent=steps;
  if(order&&nl===order.lvl){
    order.got++;$('odGot').textContent=String(order.got);
    if(order.got>=order.need){
      done++;$('odDone').textContent=String(done);
      addScore(180);steps+=2;$('steps').textContent=steps;
      if(done>=5){win();return;}
      newOrder();
    }
  }
  if(steps<=0){finish();return;}
}
function win(){
  state='over';
  $('ovT').textContent='开业大吉!';
  $('ovP').textContent='5 张订单全部完成,食客盈门!';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function finish(){
  state='over';
  $('ovT').textContent='打烊了';
  $('ovP').textContent='步数用完,订单没能完成';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function start(){
  score=0;steps=12;done=0;flashes=[];supplyT=0;noT=0;
  newBoard();newOrder();
  $('score').textContent='0';$('steps').textContent='12';$('odDone').textContent='0';
  $('ov').classList.add('hide');state='play';
}
$('btn').addEventListener('click',start);
function update(dt){
  var i;
  for(i=0;i<flashes.length;i++)flashes[i].t+=dt;
  var k=[];
  for(i=0;i<flashes.length;i++)if(flashes[i].t<0.35)k.push(flashes[i]);
  flashes=k;
  if(noT>0)noT-=dt;
  supplyT+=dt;
  if(supplyT>=3.2){
    supplyT=0;
    var empties=[],r,c;
    for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(grid[r][c]===0)empties.push([r,c]);
    if(empties.length>0){
      var pick=empties[Math.floor(Math.random()*empties.length)];
      grid[pick[0]][pick[1]]=Math.random()<0.8?1:2;
      flashes.push({r:pick[0],c:pick[1],t:0});
    }
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,320,300);
  ctx.fillStyle='#0b0e1a';ctx.fillRect(0,0,320,300);
  var r,c,i;
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(BX+i*CELL,BY);ctx.lineTo(BX+i*CELL,BY+ROWS*CELL);ctx.stroke();}
  for(i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(BX,BY+i*CELL);ctx.lineTo(BX+COLS*CELL,BY+i*CELL);ctx.stroke();}
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    var e=grid.length?grid[r][c]:0;
    if(e>0){
      ctx.fillStyle=CCOL[e];
      roundRect(BX+c*CELL+2,BY+r*CELL+2,CELL-4,CELL-4,8);ctx.fill();
      ctx.fillStyle='rgba(20,16,4,.85)';
      ctx.font='700 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(NAME[e],BX+c*CELL+CELL/2,BY+r*CELL+CELL/2+1);
    }else if(state==='play'){
      ctx.strokeStyle='rgba(255,255,255,.07)';
      roundRect(BX+c*CELL+6,BY+r*CELL+6,CELL-12,CELL-12,6);ctx.stroke();
    }
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=f.t/0.35;
    ctx.save();ctx.globalAlpha=1-pr;
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    roundRect(BX+f.c*CELL+2-pr*5,BY+f.r*CELL+2-pr*5,CELL-4+pr*10,CELL-4+pr*10,8);ctx.stroke();
    ctx.restore();
  }
  if(noT>0){
    ctx.fillStyle='rgba(255,90,90,'+(noT*2)+')';
    ctx.font='12px system-ui';ctx.textAlign='center';
    ctx.fillText('需要相邻有同级食材才能合成',160,16);
  }
  if(state==='play'){
    ctx.fillStyle='rgba(246,189,96,.75)';
    ctx.font='12px system-ui';ctx.textAlign='left';
    ctx.fillText('点击食材:吸收相邻同级并升级',BX,BY-8);
  }
}
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,0.05);last=t;
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.addEventListener('mousedown',function(e){
  var rc=cv.getBoundingClientRect();
  clickAt((e.clientX-rc.left)*320/rc.width,(e.clientY-rc.top)*300/rc.height);
});
cv.addEventListener('touchstart',function(e){
  var t=e.touches[0],rc=cv.getBoundingClientRect();
  clickAt((t.clientX-rc.left)*320/rc.width,(t.clientY-rc.top)*300/rc.height);
  e.preventDefault();
},{passive:false});
})();
</script>
</body>
</html>

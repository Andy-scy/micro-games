<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禅意扫雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101614;color:#e6f0ea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#182420;border-radius:16px;padding:14px 14px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#86efac;text-align:center;letter-spacing:6px;margin-bottom:4px}
.hint{text-align:center;color:#8ba394;font-size:12.5px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:#c3d4c9;margin-bottom:8px}
.hud b{color:#86efac;font-size:15px}
.tools{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.tools button{background:#20302a;color:#c3d4c9;border:1px solid #2f443a;border-radius:9px;padding:8px 22px;font-size:14px;cursor:pointer;font-family:inherit}
.tools button:disabled{opacity:.45;cursor:default}
.stage{position:relative}
.grid{display:grid;gap:2px;background:#0c1410;padding:7px;border-radius:10px;width:max-content;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:4px;background:#25352d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cs)*.5);cursor:pointer;transition:box-shadow .3s}
.cell.op{background:#121b16;cursor:default}
.cell.fl{background:#2c3b2a;color:#a7f3d0}
.cell.glow{box-shadow:0 0 0 2px #86efac inset}
.cell.bo{background:#4a2c2c;color:#fca5a5}
.n1{color:#7dd3fc}.n2{color:#4ade80}.n3{color:#fca5a5}.n4{color:#c084fc}.n5{color:#fbbf24}.n6{color:#2dd4bf}.n7{color:#f472b6}.n8{color:#e6f0ea}
.overlay{position:absolute;inset:0;background:rgba(9,16,12,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#86efac}
.overlay p{color:#a5bcab;font-size:13.5px;line-height:1.9;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#86efac;color:#0a2317;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(18,30,24,.95);border:1px solid #2f443a;color:#86efac;font-size:13px;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <h1>禅意扫雷</h1>
  <p class="hint">无失败模式:点到雷只会被温和标记,绝不爆炸<br>卡住时点「提示」,高亮一格绝对安全 · 翻开全部安全格即功德圆满</p>
  <div class="hud">
    <span>已标记雷 <b id="mleft">0/10</b></span>
    <span>已翻开 <b id="prog">0/71</b></span>
    <span>用时 <b id="time">0</b> 秒</span>
  </div>
  <div class="tools"><button id="btnHint">提示</button></div>
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">禅意扫雷</h2>
      <p id="ovP">放下胜负心:
这里没有爆炸,没有失败,
雷会被温柔标记,提示随叫随到。
慢慢来,感受推理的呼吸。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">入局</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=9,H=9,MINES=10,N=W*H;
var grid=document.getElementById("grid");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovS=document.getElementById("ovS"),btnGo=document.getElementById("btnGo");
var elM=document.getElementById("mleft"),elP=document.getElementById("prog"),elT=document.getElementById("time"),btnHint=document.getElementById("btnHint"),toastEl=document.getElementById("toast");
var NB=[],cells=[],mines=[],num=[],st=[],opened=0,flags=0,placed=false,over=false;
var t0=0,lastHint=-99999,toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show");},1500);}
(function(){var i,x,y,dx,dy,nx,ny;for(i=0;i<N;i++){x=i%W;y=(i/W)|0;var r=[];for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;nx=x+dx;ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H)r.push(ny*W+nx);}NB.push(r);}})();
function calcNums(){var i,k;num=new Array(N);for(i=0;i<N;i++)num[i]=0;for(i=0;i<N;i++){if(mines[i])continue;var c=0;for(k=0;k<NB[i].length;k++)if(mines[NB[i][k]])c++;num[i]=c;}}
function placeMines(safe){var i,cnt=0;mines=new Array(N);for(i=0;i<N;i++)mines[i]=false;while(cnt<MINES){var j=(Math.random()*N)|0;if(!mines[j]&&!safe[j]){mines[j]=true;cnt++;}}calcNums();}
function buildGrid(){
  grid.innerHTML="";grid.style.gridTemplateColumns="repeat("+W+", var(--cs))";
  var cs=Math.max(20,Math.min(38,Math.floor((Math.min(window.innerWidth,520)-44)/W)));
  grid.style.setProperty("--cs",cs+"px");
  cells=new Array(N);
  for(var i=0;i<N;i++){var d=document.createElement("div");d.className="cell";d.dataset.i=i;grid.appendChild(d);cells[i]=d;}
}
function render(i){
  var el=cells[i],s=st[i];el.className="cell";el.textContent="";
  if(s===1){el.classList.add("op");if(num[i]>0){el.textContent=String(num[i]);el.classList.add("n"+num[i]);}}
  else if(s===2){el.classList.add("fl");el.textContent="⚑";}
}
function openCell(i){
  if(st[i]!==0||mines[i])return;
  var stk=[i];
  while(stk.length){
    var j=stk.pop();
    if(st[j]!==0||mines[j])continue;
    st[j]=1;opened++;render(j);
    if(num[j]===0){for(var k=0;k<NB[j].length;k++){if(st[NB[j][k]]===0&&!mines[NB[j][k]])stk.push(NB[j][k]);}}
  }
}
function chord(i){
  if(num[i]===0)return;
  var f=0,hid=[],k;
  for(k=0;k<NB[i].length;k++){var j=NB[i][k];if(st[j]===2)f++;else if(st[j]===0)hid.push(j);}
  if(f!==num[i]||!hid.length)return;
  for(k=0;k<hid.length;k++)openCell(hid[k]);
  afterAction();
}
function findSafeCell(){
  var i,k;
  for(i=0;i<N;i++){
    if(st[i]!==1||num[i]===0)continue;
    var f=0,hidden=-1;
    for(k=0;k<NB[i].length;k++){
      var j=NB[i][k];
      if(st[j]===2)f++;
      else if(st[j]===0)hidden=j;
    }
    if(f===num[i]&&hidden>=0)return hidden;
  }
  var pool=[];
  for(i=0;i<N;i++)if(st[i]===0&&!mines[i])pool.push(i);
  if(!pool.length)return -1;
  return pool[(Math.random()*pool.length)|0];
}
function doHint(){
  var now=Date.now();
  if(!placed){toast("先翻开第一格,再来问心");return;}
  if(now-lastHint<6000){toast("心浮气躁,稍作等待…");return;}
  lastHint=now;
  var s=findSafeCell();
  if(s<0)return;
  var el=cells[s];
  el.classList.add("glow");
  setTimeout(function(){el.classList.remove("glow");},2200);
}
function updateHud(){elM.textContent=flags+"/"+MINES;elP.textContent=opened+"/"+(N-MINES);}
function afterAction(){
  updateHud();
  if(opened===N-MINES){
    over=true;
    var sec=Math.floor((Date.now()-t0)/1000);
    ovT.textContent="功德圆满";ovT.style.color="#86efac";
    ovP.textContent="用时 "+sec+" 秒,标记 "+flags+" 颗雷。\n心中无雷,处处安全。";
    btnGo.textContent="再修一局";ov.classList.remove("hide");
  }
}
function onOpen(i){
  if(over)return;
  if(!placed){var safe={};safe[i]=true;placeMines(safe);placed=true;t0=Date.now();}
  if(st[i]===2)return;
  if(st[i]===1){chord(i);return;}
  if(mines[i]){
    st[i]=2;flags++;render(i);updateHud();
    toast("此处理雷,已温和标记,继续前进");
    return;
  }
  openCell(i);afterAction();
}
function onFlag(i){
  if(over||st[i]===1)return;
  if(st[i]===2){st[i]=0;flags--;}else{st[i]=2;flags++;}
  render(i);updateHud();
}
function cellIndex(e){var t=e.target;while(t&&t!==grid&&!t.classList.contains("cell"))t=t.parentNode;if(t&&t!==grid)return +t.dataset.i;return -1;}
var pressTimer=null,pressIdx=-1,longFired=false;
grid.addEventListener("contextmenu",function(e){e.preventDefault();});
grid.addEventListener("pointerdown",function(e){
  var i=cellIndex(e);if(i<0||over)return;
  if(e.pointerType==="touch"){pressIdx=i;longFired=false;pressTimer=setTimeout(function(){pressTimer=null;longFired=true;onFlag(pressIdx);},350);}
  else if(e.button===2){e.preventDefault();onFlag(i);}
  else if(e.button===0){onOpen(i);}
});
grid.addEventListener("pointerup",function(e){
  if(e.pointerType!=="touch")return;
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  if(!longFired&&pressIdx>=0&&!over)onOpen(pressIdx);
});
grid.addEventListener("pointercancel",function(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
btnHint.addEventListener("click",doHint);
function reset(){
  over=false;placed=false;opened=0;flags=0;lastHint=-99999;
  st=new Array(N);for(var i=0;i<N;i++)st[i]=0;
  mines=new Array(N);num=new Array(N);
  buildGrid();updateHud();
}
function frame(){
  if(placed&&!over){elT.textContent=Math.floor((Date.now()-t0)/1000);}
  requestAnimationFrame(frame);
}
btnGo.addEventListener("click",function(){reset();ov.classList.add("hide");});
reset();updateHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>

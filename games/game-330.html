<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#facc15;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#facc15;font-size:16px}
.gbtn{background:#3a3003;color:#facc15;border:1px solid #facc15;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#facc15;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:11px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.on{background:linear-gradient(145deg,#fef08a,#eab308);border-color:#fef9c3;box-shadow:0 0 14px rgba(250,204,21,.55)}
.cell.cur{outline:2px solid rgba(250,204,21,.75);outline-offset:2px}
.cell:active{transform:scale(.92)}
.day{background:#111527;border:1px solid #2a3258;border-radius:10px;padding:8px 12px;text-align:center;color:#c7cbe8;font-size:13px;margin-bottom:10px}
.day b{color:#facc15}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#facc15;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#facc15;color:#3a3003;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>每日一灯</h1>
  <p class="hint">今日谜题,全球同款:由今天的日期生成的唯一一道 4×4 点灯谜题,所有人都拿到同一盘。点亮全部灯,和朋友们比比谁的步数少。</p>
  <div class="day">今日谜题:<b id="date">--</b>(明天会自动换新题)</div>
  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>已点亮 <b id="lit">0</b>/16</span>
    <span>今日最佳 <b id="best">--</b></span>
    <button class="gbtn" id="btnNew">重新开始</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">每日一灯</h2>
    <p id="ovDesc">一天只有一道题:谜面由日期种子打乱而来,今天无论重开多少次,都是同一盘。点亮全部灯即完成今日挑战,步数纪录按日期保存。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始今日挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=4,CNT=16;
var gridEl=$("grid"),elDate=$("date"),elMoves=$("moves"),elLit=$("lit"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],moves=0,state="menu";
var now=new Date();
var dayKey=now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate();
var seed=0;
var bestKey="mg330_"+now.getFullYear()+"_"+(now.getMonth()+1)+"_"+now.getDate();
var best=loadNum(bestKey);
function resetSeed(){seed=(now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate())>>>0;}

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2200);}
function rnd(){
  seed=(Math.imul(seed,1664525)+1013904223)>>>0;
  return seed/4294967296;
}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++){board[list[i]]^=1;paint(list[i]);}
  if(!silent)moves++;
}
function litCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i])n++;return n;}
function dailyPicks(k){
  var arr=[],i,picked=[];
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=CNT-1;i>0;i--){
    var j=(rnd()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  for(i=0;i<k;i++)picked.push(arr[i]);
  return picked;
}
function updateHud(){
  elMoves.textContent=moves;elLit.textContent=litCount();
  elBest.textContent=best>0?best+" 步":"--";
}
function newGame(){
  resetSeed();
  board=[];for(var i=0;i<CNT;i++)board.push(1);
  moves=0;state="playing";
  var ps=dailyPicks(6),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(litCount()===CNT)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||moves<best){best=moves;saveNum(bestKey,best);isNew=true;}
  ovTitle.textContent="今日题破!";
  ovDesc.textContent=(isNew?"今日新纪录!":"今日最佳 "+best+" 步,仍待你自己超越。")+"\n这道题明天就会更换,把成绩分享给朋友吧。";
  ovScore.style.display="block";
  ovScore.textContent=dayKey+" · "+moves+" 步点亮";
  btnGo.textContent="再挑战一次";
  ov.classList.remove("hide");
  updateHud();
}
function start(){newGame();ov.classList.add("hide");}
var cur=-1;
function setCur(i){
  if(cur>=0)cells[cur].classList.remove("cur");
  cur=i;
  if(cur>=0)cells[cur].classList.add("cur");
}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(cur<0)setCur(5);
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){
  if(state==="menu")return;
  newGame();setMsg("今日谜题不变,从头再来");
});
build();
elDate.textContent=dayKey;
resetSeed();
board=[];for(var z=0;z<CNT;z++)board.push(1);
var ps0=dailyPicks(6),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圆环相扑</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#10152b;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>圆环相扑</h1>
<div id="tip">把对手挤出圆环!玩家1:WASD 移动 + F 冲撞 · 玩家2:方向键移动 + K 冲撞 · 圆环会不断缩小 · 先胜 3 回合者夺冠</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">圆环相扑</div><div id="ovS">蓝方:WASD 移动,F 冲撞<br>橙方:方向键移动,K 冲撞<br>身体相撞会互相挤压,冲撞是把对手顶出圆环的关键<br>圆环随时间缩小,先胜 3 回合者获胜</div><button id="ovB">开始对战</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var CX=360,CY=250,R0=185,RMIN=115,PR=24;
var keys={},st;
function mkP(i){var x=i===0?CX-110:CX+110;return{x:x,y:CY,vx:0,vy:0,fx:i===0?1:-1,fy:0,dash:0};}
function reset(){st={ph:"count",cd:75,score:[0,0],round:1,ring:R0,msg:"",msgT:0,p:[mkP(0),mkP(1)],winner:0};}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function tryDash(i){var p=st.p[i];if(st.ph!=="play"||p.dash>0)return;p.vx+=p.fx*7.6;p.vy+=p.fy*7.6;p.dash=95;}
function moveP(i,dt){
 var p=st.p[i],ix=0,iy=0;
 if(i===0){if(keys["a"])ix--;if(keys["d"])ix++;if(keys["w"])iy--;if(keys["s"])iy++;}
 else{if(keys["arrowleft"])ix--;if(keys["arrowright"])ix++;if(keys["arrowup"])iy--;if(keys["arrowdown"])iy++;}
 if(ix!==0||iy!==0){var l=Math.hypot(ix,iy);p.fx=ix/l;p.fy=iy/l;p.vx+=ix/l*0.4*dt;p.vy+=iy/l*0.4*dt;}
 var fr=Math.pow(0.905,dt);p.vx*=fr;p.vy*=fr;
 var v=Math.hypot(p.vx,p.vy);if(v>4.8){p.vx*=4.8/v;p.vy*=4.8/v;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(p.dash>0)p.dash-=dt;
}
function collide(){
 var a=st.p[0],b=st.p[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
 if(d<PR*2&&d>0.01){var nx=dx/d,ny=dy/d,ov2=PR*2-d;
  a.x-=nx*ov2/2;a.y-=ny*ov2/2;b.x+=nx*ov2/2;b.y+=ny*ov2/2;
  var rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rv<0){a.vx+=nx*rv*0.9;a.vy+=ny*rv*0.9;b.vx-=nx*rv*0.9;b.vy-=ny*rv*0.9;}
 }
}
function step(dt){
 var i,p;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.ring=Math.max(RMIN,st.ring-0.05*dt);
  moveP(0,dt);moveP(1,dt);collide();
  for(i=0;i<2;i++){p=st.p[i];
   if(Math.hypot(p.x-CX,p.y-CY)>st.ring-4){
    st.winner=1-i;st.score[1-i]++;st.ph="rend";st.msgT=120;
    st.msg=(st.winner===0?"橙方":"蓝方")+"被挤出圆环!";
   }
  }
 }else if(st.ph==="rend"){
  st.msgT-=dt;
  if(st.msgT<=0){
   if(st.score[0]>=3||st.score[1]>=3){
    st.ph="over";
    show(st.score[0]>=3?"蓝方夺冠!":"橙方夺冠!","最终比分 "+st.score[0]+" : "+st.score[1]);
   }else{
    st.round++;st.p=[mkP(0),mkP(1)];st.ring=R0;st.ph="count";st.cd=75;
   }
  }
 }
}
function draw(){
 ctx.clearRect(0,0,720,480);
 ctx.save();ctx.translate(CX,CY);
 ctx.beginPath();ctx.arc(0,0,st.ring,0,6.2832);
 ctx.fillStyle="#1b2444";ctx.fill();
 ctx.lineWidth=5;ctx.strokeStyle="#4a5a8f";ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,st.ring*0.55,0,6.2832);
 ctx.strokeStyle="rgba(90,110,170,.25)";ctx.lineWidth=2;ctx.stroke();
 ctx.restore();
 var i,p;
 for(i=0;i<2;i++){p=st.p[i];
  ctx.beginPath();ctx.arc(p.x,p.y,PR,0,6.2832);
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle="#0f1220";ctx.stroke();
  ctx.fillStyle="#0f1220";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(i===0?"1":"2",p.x,p.y+1);
  if(p.dash>0){
   ctx.beginPath();ctx.arc(p.x,p.y,PR+6,-1.5708,-1.5708+6.2832*(1-p.dash/95));
   ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=3;ctx.stroke();
  }
 }
 ctx.font="bold 16px system-ui";ctx.textBaseline="top";
 ctx.textAlign="left";ctx.fillStyle="#4fd1c5";ctx.fillText("蓝方 "+st.score[0],14,10);
 ctx.textAlign="right";ctx.fillStyle="#f6ad55";ctx.fillText(st.score[1]+" 橙方",706,10);
 ctx.textAlign="center";ctx.fillStyle="#8b93b0";ctx.fillText("第 "+st.round+" 回合 · 先胜 3 回合",360,10);
 if(st.ph==="count"){
  ctx.fillStyle="#e9edf8";ctx.font="bold 44px system-ui";ctx.fillText("第 "+st.round+" 回合",360,190);
  ctx.font="bold 30px system-ui";ctx.fillText(String(Math.ceil(st.cd/25)),360,248);
 }
 if(st.ph==="rend"){ctx.fillStyle="#ff5c7a";ctx.font="bold 34px system-ui";ctx.fillText(st.msg,360,215);}
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(!ov.classList.contains("hide")&&st.ph!=="over"){draw();requestAnimationFrame(loop);return;}
 step(dt);draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 keys[k]=true;
 if((k==="f"||k===" ")&&!e.repeat)tryDash(0);
 if((k==="k"||k==="enter")&&!e.repeat)tryDash(1);
});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

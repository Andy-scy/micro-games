<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双井奇谭</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#ffb4a2;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#ffb4a2;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#ffb4a2}
.overlay p{color:#aab0d0;font-size:13px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#ffb4a2;color:#47120a;border:none;border-radius:10px;padding:10px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
.pads{display:flex;gap:7px;margin-top:10px}
.pads button{flex:1;background:#232849;color:#c7cbe8;border:1px solid #343b6e;border-radius:10px;padding:13px 0;font-size:15px;cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none}
.pads button:active{background:#343b6e}
</style>
</head>
<body>
<div class="card">
  <h1>双井奇谭</h1>
  <p class="hint">Q 切换水井 · ◀ ▶ 移动 · 投放数字块,落点吸收四邻同数<br>两井得分越接近,平衡倍率越高,一井堆满即败!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>倍率 <b id="mult">×1.50</b></span>
    <span>活动井 <b id="well">左</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="340" height="400"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">双井奇谭</h2>
      <p id="ovP">左手一井右手一井,雨露均沾倍率才高\n偏心太多,另一口井会先爆给你看</p>
      <div class="big" id="ovS"></div>
      <button id="btn">开 始</button>
    </div>
  </div>
  <div class="pads">
    <button id="pW">切井</button>
    <button id="pL">◀</button>
    <button id="pD">投 放</button>
    <button id="pR">▶</button>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var COLS=4,ROWS=8,CELL=38,BY=42;
var BXS=[20,168];
var CCOL=['','#6b7bb8','#5aa9e6','#4dd0c4','#7ed957','#f9d71c','#ff8c42','#ff5d5d','#ffd166'];
var wells=[],active=0,score=0,state='ready',flashes=[];
function val(e){return Math.pow(2,e);}
function randE(){return Math.random()<0.72?1:2;}
function newWell(){
  var g=[],r,c;
  for(r=0;r<ROWS;r++){g.push([]);for(c=0;c<COLS;c++)g[r].push(0);}
  return {grid:g,col:1,cur:randE(),pts:0};
}
function addScore(w,n){
  wells[w].pts+=n;score+=n;
  $('score').textContent=score;
  var a=wells[0].pts,b=wells[1].pts;
  var m=1+(1-Math.abs(a-b)/(a+b+1))*0.5;
  $('mult').textContent='×'+m.toFixed(2);
}
function lowest(w,c){
  var g=wells[w].grid,r;
  for(r=ROWS-1;r>=0;r--)if(g[r][c]===0)return r;
  return -1;
}
function flash(w,r,c,e){flashes.push({w:w,r:r,c:c,t:0,e:e});}
function resolve(w,r,c){
  var g=wells[w].grid,guard=0,changed=true;
  while(changed&&guard<30){
    guard++;changed=false;
    var e=g[r][c],dirs=[[1,0],[-1,0],[0,1],[0,-1]],mates=[],i;
    for(i=0;i<4;i++){
      var rr=r+dirs[i][0],cc=c+dirs[i][1];
      if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&g[rr][cc]===e&&e>0)mates.push([rr,cc]);
    }
    if(mates.length>0){
      for(i=0;i<mates.length;i++){g[mates[i][0]][mates[i][1]]=0;flash(w,mates[i][0],mates[i][1],e);}
      g[r][c]=e+1;flash(w,r,c,e+1);
      addScore(w,val(e+1)*10);
      changed=true;
    }
  }
}
function drop(){
  if(state!=='play')return;
  var w=active,r=lowest(w,wells[w].col);
  if(r<0){finish();return;}
  wells[w].grid[r][wells[w].col]=wells[w].cur;
  flash(w,r,wells[w].col,wells[w].cur);
  wells[w].cur=randE();
  resolve(w,r,wells[w].col);
}
function finish(){
  state='over';
  $('ovT').textContent=(active===0?'左井':'右井')+'爆了!';
  $('ovP').textContent='偏科有风险,灌溉需均衡';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function start(){
  wells=[newWell(),newWell()];active=0;score=0;flashes=[];
  $('score').textContent='0';$('mult').textContent='×1.50';$('well').textContent='左';
  $('ov').classList.add('hide');state='play';
}
$('btn').addEventListener('click',start);
function switchW(){if(state==='play'){active=1-active;$('well').textContent=active===0?'左':'右';}}
function moveC(d){
  if(state!=='play')return;
  wells[active].col=(wells[active].col+d+COLS)%COLS;
}
$('pW').addEventListener('click',switchW);
$('pL').addEventListener('click',function(){moveC(-1);});
$('pR').addEventListener('click',function(){moveC(1);});
$('pD').addEventListener('click',drop);
window.addEventListener('keydown',function(e){
  if(state!=='play')return;
  if(e.keyCode===81||e.keyCode===9){switchW();e.preventDefault();}
  else if(e.keyCode===37){moveC(-1);e.preventDefault();}
  else if(e.keyCode===39){moveC(1);e.preventDefault();}
  else if(e.keyCode===32||e.keyCode===40){drop();e.preventDefault();}
});
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,340,400);
  ctx.fillStyle='#0b0e1a';ctx.fillRect(0,0,340,400);
  var w,r,c,i;
  for(w=0;w<2;w++){
    var bx=BXS[w],g=wells.length?wells[w].grid:null;
    ctx.save();
    ctx.strokeStyle=w===active&&state==='play'?'#ffb4a2':'rgba(255,255,255,.15)';
    ctx.lineWidth=w===active?3:1.5;
    roundRect(bx-4,BY-4,COLS*CELL+8,ROWS*CELL+8,10);ctx.stroke();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.05)';
    for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
      if((r+c)%2===0)ctx.fillRect(bx+c*CELL,BY+r*CELL,CELL,CELL);
    }
    if(g){
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
        if(g[r][c]>0){
          ctx.fillStyle=CCOL[Math.min(g[r][c],8)];
          roundRect(bx+c*CELL+3,BY+r*CELL+3,CELL-6,CELL-6,8);ctx.fill();
          ctx.fillStyle='rgba(255,255,255,.9)';
          ctx.font='700 '+Math.min(18,10+g[r][c]*2)+'px system-ui';
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(String(val(g[r][c])),bx+c*CELL+CELL/2,BY+r*CELL+CELL/2+1);
        }
      }
    }
    if(state==='play'){
      ctx.fillStyle='rgba(255,180,162,.18)';
      ctx.fillRect(bx+wells[w].col*CELL+2,BY,CELL-4,ROWS*CELL);
      var lr=lowest(w,wells[w].col);
      var gy=(lr<0)?0:lr*CELL;
      ctx.save();ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,.18)';
      ctx.beginPath();ctx.moveTo(bx+wells[w].col*CELL+CELL/2,BY+10);ctx.lineTo(bx+wells[w].col*CELL+CELL/2,BY+gy);ctx.stroke();ctx.restore();
      ctx.fillStyle=CCOL[Math.min(wells[w].cur,8)];
      roundRect(bx+wells[w].col*CELL+3,BY+gy-CELL+3,CELL-6,CELL-6,8);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.font='700 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(val(wells[w].cur)),bx+wells[w].col*CELL+CELL/2,BY+gy-CELL/2+1);
    }
    ctx.fillStyle='rgba(199,203,232,.8)';
    ctx.font='12px system-ui';ctx.textAlign='center';
    ctx.fillText((w===0?'左井 ':'右井 ')+wells[w].pts+' 分',bx+COLS*CELL/2,BY-12);
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=f.t/0.35;
    ctx.save();ctx.globalAlpha=1-pr;
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    roundRect(BXS[f.w]+f.c*CELL+2-pr*5,BY+f.r*CELL+2-pr*5,CELL-4+pr*10,CELL-4+pr*10,8);ctx.stroke();
    ctx.restore();
  }
}
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,0.05);last=t;
  var i,k=[];
  for(i=0;i<flashes.length;i++)flashes[i].t+=dt;
  for(i=0;i<flashes.length;i++)if(flashes[i].t<0.35)k.push(flashes[i]);
  flashes=k;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

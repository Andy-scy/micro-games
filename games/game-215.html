<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>石块拦截</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fca5a5;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fca5a5;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#151a22;border-radius:10px;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fca5a5}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#fca5a5;color:#31110f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>石块拦截</h1>
  <p class="hint">地鼠会朝石墙扔石头 · 点击半空的石头把它击碎</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>拦截 <b id="cut">0</b></span>
    <span>墙耐久 <b id="wall">♥♥♥</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">石块拦截</h2>
      <p id="ovDesc">地鼠不只会冒头,还会朝你的石墙扔石头!敲中冒头地鼠 +10;点击飞行途中的石头可把它凌空击碎 +15;石头落墙则墙耐久 -1。墙塌了就输,守住 60 秒即胜利。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=480,WALL_Y=440;
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCut=$("cut"),elWall=$("wall"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var GAME_LEN=60;
var best=loadBest("mg_s215");
var state="menu",score=0,kills=0,cut=0,timeLeft=GAME_LEN,spawnT=350,wallHP=3;
var holes=[],moles=[],rocks=[],floats=[],rings=[],shakeT=0;
var lastT=0;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function hearts(){
  var s="",i;
  for(i=0;i<wallHP;i++)s+="♥";
  return s;
}
function initHoles(){
  holes=[];
  var ys=[140,240,340],r,c;
  for(r=0;r<3;r++)for(c=0;c<3;c++)holes.push({x:90+c*150,y:ys[r]});
}
initHoles();

function freeHole(){
  var used={},i,cand=[];
  for(i=0;i<moles.length;i++)used[moles[i].hole]=1;
  for(i=0;i<holes.length;i++)if(!used[i])cand.push(i);
  if(!cand.length)return -1;
  return cand[(Math.random()*cand.length)|0];
}
function spawnMole(){
  var h=freeHole();
  if(h<0)return;
  var will=Math.random()<0.6;
  moles.push({hole:h,state:"rise",frac:0,t:0,upMs:1050,will:will,threw:false,throwAt:300+Math.random()*450});
}
function throwRock(m){
  var h=holes[m.hole];
  rocks.push({x0:h.x,y0:h.y-70,tx:30+Math.random()*(W-60),t:0,T:1000+Math.random()*250});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,t:0});}
function addRing(x,y,r,c){rings.push({x:x,y:y,r:r,c:c,t:0});}

function reset(){
  moles=[];rocks=[];floats=[];rings=[];
  score=0;kills=0;cut=0;timeLeft=GAME_LEN;spawnT=350;wallHP=3;shakeT=0;
  updateHud();
}
function startGame(){
  reset();
  state="playing";
  ov.classList.add("hide");
}
function endGame(win){
  state="over";
  if(score>best){best=score;saveBest("mg_s215",best);}
  if(win){
    ovTitle.textContent="石墙保住了!";
    ovDesc.textContent="拦截飞石 "+cut+" 块 · 敲倒地鼠 "+kills+" 只";
  }else{
    ovTitle.textContent="石墙塌了…";
    ovDesc.textContent="坚持了 "+Math.ceil(GAME_LEN-timeLeft)+" 秒,共拦截 "+cut+" 块";
  }
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function updateHud(){
  elScore.textContent=score;
  elCut.textContent=cut;
  elWall.textContent=hearts();
  elWall.style.color=wallHP>1?"#fca5a5":"#f87171";
  elBest.textContent=best;
}

function update(dt){
  timeLeft-=dt/1000;
  if(timeLeft<=0){timeLeft=0;endGame(true);return;}
  if(shakeT>0)shakeT-=dt;
  spawnT-=dt;
  var prog=1-timeLeft/GAME_LEN;
  if(spawnT<=0){
    var gap=Math.max(400,660-prog*260);
    spawnT=gap*(0.8+Math.random()*0.4);
    spawnMole();
    if(prog>0.5&&Math.random()<0.4)spawnMole();
  }
  var i,m;
  for(i=moles.length-1;i>=0;i--){
    m=moles[i];m.t+=dt;
    if(m.state==="rise"){
      m.frac=Math.min(1,m.t/130);
      if(m.frac>=1){m.state="up";m.t=0;}
    }else if(m.state==="up"){
      if(m.will&&!m.threw&&m.t>=m.throwAt){
        m.threw=true;
        throwRock(m);
      }
      if(m.t>=m.upMs){m.state="down";m.t=0;}
    }else if(m.state==="down"){
      m.frac=1-Math.min(1,m.t/150);
      if(m.frac<=0)moles.splice(i,1);
    }
  }
  for(i=rocks.length-1;i>=0;i--){
    var rk=rocks[i];
    rk.t+=dt;
    if(rk.t>=rk.T){
      rocks.splice(i,1);
      wallHP--;
      shakeT=380;
      addFloat(rk.tx,WALL_Y-26,"墙 -1","#f87171");
      addRing(rk.tx,WALL_Y-14,42,"rgba(248,113,113,0.9)");
      updateHud();
      if(wallHP<=0){endGame(false);return;}
    }
  }
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>800)floats.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>300)rings.splice(i,1);}
}

function rockPos(rk){
  var k=Math.min(1,rk.t/rk.T);
  return {
    x:rk.x0+(rk.tx-rk.x0)*k,
    y:rk.y0+(WALL_Y-rk.y0)*k-Math.sin(k*Math.PI)*92
  };
}

function whack(p){
  if(state!=="playing")return;
  var i;
  for(i=0;i<rocks.length;i++){
    var pos=rockPos(rocks[i]);
    var dx=p.x-pos.x,dy=p.y-pos.y;
    if(dx*dx+dy*dy<30*30){
      rocks.splice(i,1);
      score+=15;cut++;
      addFloat(pos.x,pos.y-20,"击碎 +15","#fbbf24");
      addRing(pos.x,pos.y,36,"rgba(251,191,36,0.9)");
      updateHud();
      return;
    }
  }
  for(i=0;i<moles.length;i++){
    var m=moles[i];
    if(m.state!=="down"&&m.frac>0.3){
      var hx=holes[m.hole].x,hy=holes[m.hole].y-34*m.frac;
      var dx2=p.x-hx,dy2=p.y-hy;
      if(dx2*dx2+dy2*dy2<56*56){
        moles.splice(i,1);
        score+=10;kills++;
        addFloat(hx,hy-46,"+10","#4ade80");
        addRing(hx,hy,50,"rgba(74,222,128,0.8)");
        updateHud();
        return;
      }
    }
  }
}

function drawMoleAt(h,frac){
  var bh=70,base=h.y+8,cy=base-bh*frac;
  ctx.save();
  ctx.beginPath();ctx.rect(h.x-64,h.y-160,128,170);ctx.clip();
  ctx.fillStyle="#8f5a26";
  ctx.beginPath();ctx.ellipse(h.x,cy,30,bh/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#14100a";
  ctx.beginPath();ctx.arc(h.x-10,cy-6,3.2,0,Math.PI*2);ctx.arc(h.x+10,cy-6,3.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f472b6";
  ctx.beginPath();ctx.ellipse(h.x,cy+4,5,3.6,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHoleBack(h){
  ctx.fillStyle="#0a0d13";
  ctx.beginPath();ctx.ellipse(h.x,h.y,44,16,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#38424f";ctx.lineWidth=4;ctx.stroke();
}
function drawHoleFront(h){
  ctx.fillStyle="#0a0d13";
  ctx.beginPath();ctx.ellipse(h.x,h.y,44,16,0,0,Math.PI);ctx.fill();
}
function drawWall(){
  ctx.fillStyle="#4a3524";
  ctx.fillRect(0,WALL_Y,W,H-WALL_Y);
  ctx.strokeStyle="#33241a";
  ctx.lineWidth=2;
  var row;
  for(row=0;row<2;row++){
    var y=WALL_Y+row*20;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    var off=row%2===0?0:30;
    var bx;
    for(bx=off;bx<W;bx+=60){
      ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx,y+20);ctx.stroke();
    }
  }
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.fillRect(0,WALL_Y,W,5);
  if(wallHP<=2){
    ctx.strokeStyle="#1c130c";ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(120,WALL_Y);ctx.lineTo(140,WALL_Y+18);ctx.lineTo(128,H-4);
    ctx.stroke();
  }
  if(wallHP<=1){
    ctx.beginPath();
    ctx.moveTo(330,WALL_Y);ctx.lineTo(350,WALL_Y+22);ctx.lineTo(336,H-4);
    ctx.moveTo(220,H-6);ctx.lineTo(238,WALL_Y+14);
    ctx.stroke();
  }
}

function draw(){
  ctx.save();
  if(shakeT>0){
    var s=shakeT/380*6;
    ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);
  }
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#1a2029");g.addColorStop(1,"#10151c");
  ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  var i;
  for(i=0;i<holes.length;i++)drawHoleBack(holes[i]);
  for(i=0;i<moles.length;i++){
    var m=moles[i];
    if(m.frac>0.02)drawMoleAt(holes[m.hole],m.frac);
  }
  for(i=0;i<holes.length;i++)drawHoleFront(holes[i]);
  for(i=0;i<rocks.length;i++){
    var rk=rocks[i],pos=rockPos(rk);
    var ang=rk.t*0.012;
    ctx.save();
    ctx.translate(pos.x,pos.y);
    ctx.rotate(ang);
    ctx.fillStyle="#7d8590";
    ctx.beginPath();
    ctx.moveTo(-11,-6);ctx.lineTo(-2,-13);ctx.lineTo(10,-7);ctx.lineTo(13,4);ctx.lineTo(3,12);ctx.lineTo(-9,7);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle="#565e68";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-4,-8);ctx.lineTo(2,2);ctx.lineTo(-3,8);ctx.stroke();
    ctx.restore();
  }
  drawWall();
  for(i=0;i<rings.length;i++){
    var r=rings[i],k=r.t/300;
    ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r*(0.4+k),0,Math.PI*2);ctx.stroke();
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<floats.length;i++){
    var f=floats[i],fk=f.t/800;
    ctx.globalAlpha=1-fk;
    ctx.font="bold 19px sans-serif";
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y-34*fk);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,W,26);
  ctx.fillStyle="#fca5a5";ctx.fillRect(0,0,W*timeLeft/GAME_LEN,26);
  ctx.font="bold 14px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillStyle="#0f1220";
  ctx.fillText("剩余 "+Math.ceil(timeLeft)+" 秒 · 拦截飞石 +15",10,14);
}

function ptFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var cx,cy;
  if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
cv.addEventListener("mousedown",function(e){e.preventDefault();whack(ptFromEvent(e));});
cv.addEventListener("touchstart",function(e){e.preventDefault();whack(ptFromEvent(e));},{passive:false});
btnGo.addEventListener("click",startGame);
document.addEventListener("keydown",function(e){
  if(state!=="playing"&&(e.key===" "||e.key==="Enter")){e.preventDefault();startGame();}
});

function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

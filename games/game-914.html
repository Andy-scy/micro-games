<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打水漂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:20px;color:#4db6ac;margin:4px 0}
.tip{font-size:13px;color:#9fa8da;text-align:center;margin-bottom:8px}
#stage{position:relative;line-height:0}
canvas{background:#161b30;border-radius:14px;max-width:96vw;height:auto;touch-action:none;display:block}
#overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;border-radius:14px}
#overlay.hidden{display:none}
.card{background:#232946;border:1px solid #4a5290;border-radius:14px;padding:20px 30px;text-align:center;max-width:80%;line-height:1.6}
.card h2{color:#4db6ac;margin-bottom:8px;font-size:22px}
.card p{font-size:15px;color:#c5cae9}
.card button{margin-top:14px;padding:9px 30px;font-size:16px;font-weight:700;border:none;border-radius:9px;background:#4db6ac;color:#00352f;cursor:pointer}
.card button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>打水漂</h1>
<p class="tip">按住拖动选低角度并蓄力，松手甩出石片 · 入水角越平弹得越远，弹力耗尽沉没 · 5 片石头，任意一片弹跳 8 次获胜</p>
<div id="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="overlay" class="hidden"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="btnRe">再来一局</button></div></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),ovB=document.getElementById('btnRe');
var W=480,H=640,WAT=440,G=760,PX=52,PY=400;
var stoneNo,bestSkips,totalPt,stone,skips,phase,ang,power,pt,hold,cam,splash,ripple,resT,keys,msg,msgT;
function rnd(a,b){return a+Math.random()*(b-a);}
function reset(){
  stoneNo=0;bestSkips=0;totalPt=0;stone=null;skips=0;phase='ready';ang=14;power=0;pt=0;hold=false;cam=0;
  splash=[];ripple=[];resT=0;keys={};msg='';msgT=0;
}
function throwStone(){
  var sp=430+power*360;
  var a=ang*Math.PI/180;
  stone={x:PX+16,y:PY-20,vx:sp*Math.cos(a),vy:-sp*Math.sin(a),rot:0};
  skips=0;phase='fly';
}
function endStone(sank){
  totalPt+=skips*100;
  if(skips>bestSkips)bestSkips=skips;
  msg=skips>0?('弹跳 '+skips+' 次 +'+skips*100):'直接沉没…';
  msgT=1.2;stoneNo++;phase='res';resT=0;
  if(sank&&stone){ripple.push({x:stone.x,y:WAT,r:6,t:0.8});splash.push({x:stone.x,y:WAT,vx:0,vy:-140,t:0.5});}
  stone=null;
}
function update(dt){
  var i;
  msgT-=dt;
  for(i=splash.length-1;i>=0;i--){var p=splash[i];p.t-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t<=0)splash.splice(i,1);}
  for(i=ripple.length-1;i>=0;i--){var r2=ripple[i];r2.t-=dt;r2.r+=60*dt;if(r2.t<=0)ripple.splice(i,1);}
  if(phase==='ready'){
    if(keys.ArrowUp)ang=Math.min(40,ang+40*dt);
    if(keys.ArrowDown)ang=Math.max(3,ang-40*dt);
    if(hold){pt+=dt;power=0.5-0.5*Math.cos(pt*5);}
  }
  if(phase==='fly'&&stone){
    var steps=Math.max(1,Math.ceil(dt/0.004)),sd=dt/steps,done=false;
    for(var s=0;s<steps&&!done;s++){
      stone.vy+=G*sd;stone.x+=stone.vx*sd;stone.y+=stone.vy*sd;stone.rot+=sd*26;
      if(stone.y>=WAT&&stone.vy>0){
        var spd=Math.hypot(stone.vx,stone.vy);
        var inA=Math.atan2(stone.vy,stone.vx);
        if(inA<0.45&&spd>250){
          skips++;
          for(var w=0;w<9;w++)splash.push({x:stone.x+rnd(-8,8),y:WAT,vx:rnd(-130,130),vy:rnd(-320,-80),t:rnd(0.35,0.6)});
          ripple.push({x:stone.x,y:WAT,r:4,t:0.5});
          stone.y=WAT-1;stone.vy=-stone.vy*0.62;stone.vx*=0.87;
        }else{
          for(var w2=0;w2<14;w2++)splash.push({x:stone.x+rnd(-10,10),y:WAT,vx:rnd(-160,160),vy:rnd(-360,-90),t:rnd(0.4,0.7)});
          endStone(true);done=true;
        }
      }
      if(!done&&stone.x-cam>W+80){endStone(false);done=true;}
    }
    if(stone&&stone.x-cam>W*0.62)cam=stone.x-W*0.62;
  }
  if(phase==='res'){
    resT+=dt;
    if(resT>1.0){
      if(stoneNo>=5){
        phase='over';
        ovT.textContent=bestSkips>=8?'水漂宗师！':'比赛结束';
        ovX.textContent='最佳弹跳 '+bestSkips+' 次，总分 '+totalPt+(bestSkips>=8?'，石片在水面上跳舞！':'（目标：单次弹跳 8 次）。角度压得越低、蓄力越满，弹跳越多。');
        ov.classList.remove('hidden');
      }else{phase='ready';pt=0;power=0;cam=0;stone=null;}
    }
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var sky=ctx.createLinearGradient(0,0,0,WAT);
  sky.addColorStop(0,'#1c2340');sky.addColorStop(1,'#2a3a5e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,WAT);
  ctx.fillStyle='#22304f';
  ctx.beginPath();ctx.moveTo(0-cam*0.2,180);ctx.lineTo(80-cam*0.2,110);ctx.lineTo(170-cam*0.2,190);ctx.lineTo(260-cam*0.2,120);ctx.lineTo(360-cam*0.2,200);ctx.lineTo(W,150);ctx.lineTo(W,WAT);ctx.lineTo(0,WAT);ctx.fill();
  var wat=ctx.createLinearGradient(0,WAT,0,H);
  wat.addColorStop(0,'#155e6b');wat.addColorStop(1,'#0c3a4e');
  ctx.fillStyle=wat;ctx.fillRect(0,WAT,W,H-WAT);
  ctx.fillStyle='#3e2f23';ctx.fillRect(0,PY-40,54,H-PY+40);
  ctx.fillStyle='#4e3b2c';ctx.fillRect(0,PY-40,54,8);
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1.5;
  for(var wv=0;wv<5;wv++){
    ctx.beginPath();
    for(var xx=0;xx<=W;xx+=24)ctx.lineTo(xx,470+wv*34+Math.sin(xx*0.04+wv*2+performance.now()*0.001)*3);
    ctx.stroke();
  }
  ctx.fillStyle='#4db6ac';ctx.beginPath();ctx.arc(PX,PY-58,9,0,7);ctx.fill();
  ctx.fillRect(PX-8,PY-50,16,26);
  ctx.strokeStyle='#4db6ac';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(PX+8,PY-46);ctx.lineTo(PX+26,PY-58-Math.sin(ang*Math.PI/180)*22);ctx.stroke();
  if(phase==='ready'){
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.setLineDash([3,7]);
    ctx.beginPath();ctx.moveTo(PX+16,PY-20);
    ctx.lineTo(PX+16+Math.cos(ang*Math.PI/180)*150,PY-20-Math.sin(ang*Math.PI/180)*150);
    ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#9fa8da';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('角度 '+ang.toFixed(0)+'°',PX+50,PY-90);
  }
  for(var rp=0;rp<ripple.length;rp++){
    ctx.strokeStyle='rgba(255,255,255,'+ripple[rp].t+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(ripple[rp].x-cam,WAT+6,ripple[rp].r,ripple[rp].r*0.3,0,0,7);ctx.stroke();
  }
  for(var sp=0;sp<splash.length;sp++){
    ctx.fillStyle='rgba(190,240,255,'+splash[sp].t+')';
    ctx.beginPath();ctx.arc(splash[sp].x-cam,splash[sp].y,2.6,0,7);ctx.fill();
  }
  if(stone){
    ctx.save();ctx.translate(stone.x-cam,stone.y);ctx.rotate(stone.rot);
    ctx.fillStyle='#90a4ae';ctx.beginPath();ctx.ellipse(0,0,9,4.5,0,0,7);ctx.fill();
    ctx.fillStyle='#607d8b';ctx.beginPath();ctx.ellipse(0,0,5,2.4,0,0,7);ctx.fill();
    ctx.restore();
  }
  if(phase==='fly'){ctx.fillStyle='#4db6ac';ctx.font='22px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('×'+skips,60,80);}
  if(hold&&phase==='ready'){
    var bx=150,bw=180;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx,608,bw,13);
    ctx.fillStyle='#4db6ac';ctx.fillRect(bx,608,bw*power,13);
    ctx.strokeStyle='#9fa8da';ctx.strokeRect(bx,608,bw,13);
  }
  ctx.fillStyle='#e8eaf6';ctx.font='16px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('第 '+Math.min(5,stoneNo+1)+' / 5 石',14,28);
  ctx.fillStyle='#9fa8da';ctx.font='13px system-ui,sans-serif';
  ctx.fillText('最佳弹跳 '+bestSkips+' · 总分 '+totalPt,14,50);
  if(msgT>0){ctx.fillStyle='#ffd54f';ctx.font='20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(msg,W/2,120);}
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(phase!=='ready')return;
  hold=true;pt=0;power=0;
  aimByPointer(e);
});
cv.addEventListener('pointermove',function(e){if(hold&&phase==='ready')aimByPointer(e);});
function aimByPointer(e){
  var r=cv.getBoundingClientRect();
  var px=(e.clientX-r.left)*(W/r.width),py=(e.clientY-r.top)*(H/r.height);
  var a=Math.atan2(PY-20-py,px-PX)*180/Math.PI;
  if(a>2&&a<60)ang=Math.max(3,Math.min(40,a));
}
window.addEventListener('pointerup',function(){
  if(hold&&phase==='ready')throwStone();
  hold=false;
});
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowUp'||e.code==='ArrowDown'){keys[e.code]=true;e.preventDefault();}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat&&phase==='ready'){hold=true;pt=0;power=0;}}
});
window.addEventListener('keyup',function(e){
  keys[e.code]=false;
  if(e.code==='Space'&&hold){if(phase==='ready')throwStone();hold=false;}
});
ovB.addEventListener('click',function(){ov.classList.add('hidden');reset();});
var last=performance.now();
function loop(t){var dt=Math.min(0.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

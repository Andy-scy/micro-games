<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轨道炮台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#f6c177;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#f6c177;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#f6c177;color:#3a2508;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#f6c177;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>轨道炮台</h1>
<p class="tip">你是一座固定轨道炮台:移动鼠标瞄准(或 ←→/AD 转动炮管),空格 / 按住屏幕开火。敌机与陨石一旦砸到地面,基地耐久就会受损。拿到 600 分获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">轨道炮台</h2>
<p id="ovX">炮台不能移动,唯有精准的炮口。守住地面阵地,别让任何东西砸下来。</p>
<button id="btn">开始驻守</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>基地耐久<b id="hB">10</b></span><span>状态<b id="hZ">驻守中</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hB=document.getElementById("hB"),hZ=document.getElementById("hZ");
var GOAL=600,GY=H-56;
var state="ready",score=0,base=10,ang=-Math.PI/2,cool=0,spawn=1,t=0;
var cx=W/2,cy=GY-14;
var bullets=[],enemies=[],parts=[],stars=[];
var keys={},mx=cx,my=0,firing=false,mouseAim=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*20+6});}
function reset(){
  score=0;base=10;ang=-Math.PI/2;cool=0;spawn=1;t=0;
  bullets=[];enemies=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*150+40;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.4,col:col});
  }
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"阵地守住":"基地陷落";
  ovX.textContent="最终得分:"+score+(win?" · 轨道炮台的传说就此传开。":" · 基地被砸穿了,留意贴地坠落的敌机。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function update(dt){
  t+=dt;cool-=dt;spawn-=dt;
  if(keys.ArrowLeft||keys.a)ang-=2.6*dt;
  if(keys.ArrowRight||keys.d)ang+=2.6*dt;
  if(keys.ArrowUp||keys.w)ang-=2.6*dt;
  if(keys.ArrowDown||keys.s)ang+=2.6*dt;
  if(mouseAim){
    var ta=Math.atan2(my-cy,mx-cx);
    if(ta>-0.12)ta=mx<cx?-Math.PI+0.12:-0.12;
    if(ta<-Math.PI+0.12)ta=-Math.PI+0.12;
    ang=ta;
  }
  while(ang>0)ang-=6.283;
  while(ang<-Math.PI)ang+=6.283;
  if(ang>-0.1)ang=-0.1;
  if((keys[" "]||keys.z||firing)&&cool<=0){
    cool=0.16;
    bullets.push({x:cx+Math.cos(ang)*34,y:cy+Math.sin(ang)*34,vx:Math.cos(ang)*560,vy:Math.sin(ang)*560});
  }
  if(spawn<=0){
    spawn=Math.max(0.55,1.5-score*0.0008);
    var r=Math.random();
    if(r<0.4)enemies.push({x:30+Math.random()*(W-60),y:-30,vy:80+score*0.03,vx:(Math.random()-0.5)*40,hp:2,kind:0});
    else if(r<0.75)enemies.push({x:30+Math.random()*(W-60),y:-40,vy:110+score*0.03,vx:(Math.random()-0.5)*30,hp:3,kind:1});
    else enemies.push({x:30+Math.random()*(W-60),y:-26,vy:190+score*0.04,vx:0,hp:1,kind:2});
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    var b=bullets[bi];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20||b.y>H)bullets.splice(bi,1);
  }
  for(i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.y+=e.vy*dt;
    if(e.kind!==2)e.x+=e.vx*dt;
    if(e.x<16){e.x=16;e.vx=Math.abs(e.vx);}
    if(e.x>W-16){e.x=W-16;e.vx=-Math.abs(e.vx);}
    if(e.y>=GY-10){
      boom(e.x,GY-8,16,"#ff6b6b");
      enemies.splice(i,1);
      base--;
      continue;
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    for(j=enemies.length-1;j>=0;j--){
      var e2=enemies[j];
      var rr=e2.kind===1?18:14;
      var dx=bl.x-e2.x,dy=bl.y-e2.y;
      if(dx*dx+dy*dy<rr*rr){
        bullets.splice(bi,1);
        e2.hp--;
        if(e2.hp<=0){
          boom(e2.x,e2.y,12,"#ffd166");
          score+=e2.kind===1?25:(e2.kind===0?15:10);
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(base<=0){gameOver(false);return;}
  if(score>=GOAL){score=GOAL+base*10;gameOver(true);}
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#2a3050";
  ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#f6c177";
  ctx.fillRect(0,GY,W,3);
  ctx.fillStyle="#1d2440";
  ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<8;i++)ctx.fillRect(20+i*60,GY+14,26,5);
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    ctx.save();ctx.translate(e.x,e.y);
    if(e.kind===0){
      ctx.fillStyle="#ff6b6b";
      ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(-13,-9);ctx.lineTo(0,-3);ctx.lineTo(13,-9);
      ctx.closePath();ctx.fill();
    }else if(e.kind===1){
      ctx.rotate(t*2);
      ctx.fillStyle="#7d6b58";
      ctx.beginPath();
      for(var k=0;k<8;k++){
        var a2=k/8*6.283;
        if(k===0)ctx.moveTo(Math.cos(a2)*18,Math.sin(a2)*18);
        else ctx.lineTo(Math.cos(a2)*18,Math.sin(a2)*18);
      }
      ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle="#ff4d4d";
      ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(-8,-10);ctx.lineTo(8,-10);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  ctx.fillStyle="#f6c177";
  for(i=0;i<bullets.length;i++){
    ctx.beginPath();ctx.arc(bullets[i].x,bullets[i].y,3,0,6.283);ctx.fill();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle="#f6c177";ctx.lineWidth=8;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*34,Math.sin(ang)*34);ctx.stroke();
  ctx.fillStyle="#f6c177";
  ctx.beginPath();ctx.arc(0,0,16,Math.PI,0);ctx.fill();
  ctx.fillStyle="#0a0d1a";
  ctx.beginPath();ctx.arc(0,0,7,Math.PI,0);ctx.fill();
  ctx.restore();
  if(state==="play"&&base<=3){
    ctx.fillStyle="#ff6b6b";ctx.font="bold 14px system-ui";ctx.textAlign="center";
    ctx.fillText("基地受损严重!",W/2,H-8);
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;
  hB.textContent=base;
  hZ.textContent=base>6?"驻守中":(base>3?"告警":"危急");
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  mx=(e.clientX-r.left)*W/r.width;
  my=(e.clientY-r.top)*H/r.height;
  mouseAim=true;
}
cv.addEventListener("mousemove",ptr);
cv.addEventListener("mousedown",function(e){ptr(e);firing=true;});
window.addEventListener("mouseup",function(){firing=false;});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);firing=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){firing=false;mouseAim=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0){e.preventDefault();mouseAim=false;}
  if(e.key==="a"||e.key==="A"||e.key==="d"||e.key==="D"||e.key==="w"||e.key==="W"||e.key==="s"||e.key==="S")mouseAim=false;
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

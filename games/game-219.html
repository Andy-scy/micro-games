<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜市小摊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fcd34d;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fcd34d;font-size:16px}
.shop{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.shop button{border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:#fcd34d;color:#332605}
.shop button:disabled{background:#2a2f4a;color:#5b6180;cursor:not-allowed}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#26170e;border-radius:10px;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fcd34d}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#fcd34d;color:#332605;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>夜市小摊</h1>
  <p class="hint">敲地鼠赚金币 · 用金币买加时或双倍营业</p>
  <div class="hud">
    <span>金币 <b id="coins">0</b></span>
    <span>营业 <b id="mult">x1</b></span>
    <span>时间 <b id="time">45</b> 秒</span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="shop">
    <button id="buyT">加时 +20秒(40金币)</button>
    <button id="buyX">双倍营业(80金币)</button>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">夜市小摊</h2>
      <p id="ovDesc">你在夜市支了个打地鼠摊位:敲中普通地鼠 +2 金币,拎钱袋的胖地鼠 +8 金币!攒够金币可以随时点上方按钮「加时 +20 秒」或开启「双倍营业」。倒计时归零就收摊,比比谁的营业额高!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=480;
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elCoins=$("coins"),elMult=$("mult"),elTime=$("time"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var buyT=$("buyT"),buyX=$("buyX");
var GAME_LEN=45;
var best=loadBest("mg_s219");
var state="menu",coins=0,timeLeft=GAME_LEN,spawnT=350;
var dbl=false,timeBuys=0,boughtX=false;
var holes=[],moles=[],floats=[],rings=[];
var lastT=0;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function addCoins(n){
  coins+=dbl?n*2:n;
}
function costT(){return 40+timeBuys*20;}
function updateShop(){
  buyT.textContent="加时 +20秒("+costT()+"金币)";
  buyT.disabled=!(state==="playing"&&coins>=costT());
  if(boughtX){
    buyX.textContent="双倍营业已开启";
    buyX.disabled=true;
  }else{
    buyX.textContent="双倍营业(80金币)";
    buyX.disabled=!(state==="playing"&&coins>=80);
  }
}
function initHoles(){
  holes=[];
  for(var r=0;r<3;r++)for(var c=0;c<3;c++)holes.push({x:90+c*150,y:160+r*132});
}
initHoles();

function freeHole(){
  var used={},i,cand=[];
  for(i=0;i<moles.length;i++)used[moles[i].hole]=1;
  for(i=0;i<holes.length;i++)if(!used[i])cand.push(i);
  if(!cand.length)return -1;
  return cand[(Math.random()*cand.length)|0];
}
function spawnMole(){
  var h=freeHole();
  if(h<0)return;
  var bag=Math.random()<0.12;
  moles.push({hole:h,state:"rise",frac:0,t:0,upMs:bag?720:920,bag:bag});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,t:0});}
function addRing(x,y,r,c){rings.push({x:x,y:y,r:r,c:c,t:0});}

function reset(){
  moles=[];floats=[];rings=[];
  coins=0;timeLeft=GAME_LEN;spawnT=350;
  dbl=false;timeBuys=0;boughtX=false;
  updateHud();
  updateShop();
}
function startGame(){
  reset();
  state="playing";
  ov.classList.add("hide");
}
function endGame(){
  state="over";
  if(coins>best){best=coins;saveBest("mg_s219",best);}
  ovTitle.textContent="收摊啦!";
  ovDesc.textContent="今晚营业额 "+coins+" 金币"+(dbl?"(双倍营业已开启)":"");
  ovScore.style.display="block";
  ovScore.textContent="营业额 "+coins+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateShop();
  updateHud();
}
function updateHud(){
  elCoins.textContent=coins;
  elMult.textContent=dbl?"x2":"x1";
  elTime.textContent=Math.ceil(timeLeft);
  elBest.textContent=best;
  updateShop();
}

function update(dt){
  timeLeft-=dt/1000;
  if(timeLeft<=0){timeLeft=0;endGame();return;}
  spawnT-=dt;
  var prog=Math.min(1,1-timeLeft/GAME_LEN);
  if(spawnT<=0){
    var gap=Math.max(400,680-prog*260);
    spawnT=gap*(0.8+Math.random()*0.4);
    spawnMole();
    if(prog>0.5&&Math.random()<0.4)spawnMole();
  }
  var i,m;
  for(i=moles.length-1;i>=0;i--){
    m=moles[i];m.t+=dt;
    if(m.state==="rise"){
      m.frac=Math.min(1,m.t/130);
      if(m.frac>=1){m.state="up";m.t=0;}
    }else if(m.state==="up"){
      if(m.t>=m.upMs){m.state="down";m.t=0;}
    }else if(m.state==="down"){
      m.frac=1-Math.min(1,m.t/150);
      if(m.frac<=0)moles.splice(i,1);
    }
  }
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>900)floats.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>300)rings.splice(i,1);}
}

function whack(p){
  if(state!=="playing")return;
  var i,m;
  for(i=0;i<moles.length;i++){
    m=moles[i];
    if(m.state!=="down"&&m.frac>0.3){
      var hx=holes[m.hole].x,hy=holes[m.hole].y-34*m.frac;
      var dx=p.x-hx,dy=p.y-hy;
      if(dx*dx+dy*dy<58*58){
        moles.splice(i,1);
        if(m.bag){
          addCoins(8);
          addFloat(hx,hy-46,"钱袋 +8","#fcd34d");
          addRing(hx,hy,60,"rgba(252,211,77,0.9)");
        }else{
          addCoins(2);
          addFloat(hx,hy-46,"+2","#4ade80");
          addRing(hx,hy,50,"rgba(74,222,128,0.8)");
        }
        updateHud();
        return;
      }
    }
  }
  addRing(p.x,p.y,22,"rgba(248,113,113,0.4)");
}

function drawBagMole(h,frac){
  var bh=74,base=h.y+10,cy=base-bh*frac;
  ctx.save();
  ctx.beginPath();ctx.rect(h.x-72,h.y-172,144,184);ctx.clip();
  ctx.fillStyle="#c9a24b";
  ctx.beginPath();ctx.ellipse(h.x,cy+14,26,28,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#a5682a";
  ctx.beginPath();ctx.ellipse(h.x,cy-24,24,20,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#14100a";
  ctx.beginPath();ctx.arc(h.x-9,cy-28,3.2,0,Math.PI*2);ctx.arc(h.x+9,cy-28,3.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f472b6";
  ctx.beginPath();ctx.ellipse(h.x,cy-20,5,3.6,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#8a6a2a";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(h.x-8,cy-10);ctx.lineTo(h.x+8,cy-10);ctx.stroke();
  ctx.fillStyle="#332605";
  ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("¥",h.x,cy+16);
  ctx.restore();
}
function drawMoleAt(h,frac){
  var bh=78,base=h.y+10,cy=base-bh*frac;
  ctx.save();
  ctx.beginPath();ctx.rect(h.x-72,h.y-172,144,184);ctx.clip();
  ctx.fillStyle="#a5682a";
  ctx.beginPath();ctx.ellipse(h.x,cy,34,bh/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#14100a";
  ctx.beginPath();ctx.arc(h.x-11,cy-8,3.6,0,Math.PI*2);ctx.arc(h.x+11,cy-8,3.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f472b6";
  ctx.beginPath();ctx.ellipse(h.x,cy+4,5.5,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHoleBack(h){
  ctx.fillStyle="#170d05";
  ctx.beginPath();ctx.ellipse(h.x,h.y,48,18,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#5c4220";ctx.lineWidth=4;ctx.stroke();
}
function drawHoleFront(h){
  ctx.fillStyle="#170d05";
  ctx.beginPath();ctx.ellipse(h.x,h.y,48,18,0,0,Math.PI);ctx.fill();
}

function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#2c1c0e");g.addColorStop(1,"#1a1008");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(252,211,77,0.04)";
  var i;
  for(i=0;i<3;i++)ctx.fillRect(0,60+i*140,W,3);
  for(i=0;i<holes.length;i++)drawHoleBack(holes[i]);
  for(i=0;i<moles.length;i++){
    var m=moles[i];
    if(m.frac<=0.02)continue;
    if(m.bag)drawBagMole(holes[m.hole],m.frac);
    else drawMoleAt(holes[m.hole],m.frac);
  }
  for(i=0;i<holes.length;i++)drawHoleFront(holes[i]);
  for(i=0;i<rings.length;i++){
    var r=rings[i],k=r.t/300;
    ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r*(0.4+k),0,Math.PI*2);ctx.stroke();
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<floats.length;i++){
    var f=floats[i],fk=f.t/900;
    ctx.globalAlpha=1-fk;
    ctx.font="bold 19px sans-serif";
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y-36*fk);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,W,26);
  ctx.fillStyle="#fcd34d";
  ctx.fillRect(0,0,W*Math.min(1,timeLeft/GAME_LEN),26);
  ctx.font="bold 14px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillStyle="#0f1220";
  ctx.fillText("剩余 "+Math.ceil(timeLeft)+" 秒 · 钱袋鼠 +8 金币",10,14);
  if(dbl){
    ctx.textAlign="right";
    ctx.fillStyle="#fcd34d";
    ctx.fillText("双倍营业中!",W-10,14);
  }
}

function ptFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var cx,cy;
  if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
cv.addEventListener("mousedown",function(e){e.preventDefault();whack(ptFromEvent(e));});
cv.addEventListener("touchstart",function(e){e.preventDefault();whack(ptFromEvent(e));},{passive:false});
btnGo.addEventListener("click",startGame);
buyT.addEventListener("click",function(){
  if(state!=="playing"||coins<costT())return;
  coins-=costT();
  timeBuys++;
  timeLeft+=20;
  addFloat(W/2,120,"加时 +20 秒!","#fcd34d");
  updateHud();
});
buyX.addEventListener("click",function(){
  if(state!=="playing"||boughtX||coins<80)return;
  coins-=80;
  boughtX=true;
  dbl=true;
  addFloat(W/2,120,"双倍营业开启!","#fcd34d");
  updateHud();
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"&&(e.key===" "||e.key==="Enter")){e.preventDefault();startGame();}
});

function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

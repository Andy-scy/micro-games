<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光单车竞技场</title>
<style>
:root{--bg:#0f1220;--p1:#4fd1c5;--p2:#f6ad55;--txt:#e9edf8;--dim:#8b93b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#box{width:100%;max-width:760px;}
h1{text-align:center;font-size:22px;margin-bottom:6px;}
#tip{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.7;}
.cvwrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;height:auto;background:#0c1024;}
#ov{position:absolute;inset:0;background:rgba(10,12,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;}
#ov.hide{display:none;}
#ovT{font-size:26px;font-weight:700;}
#ovS{color:var(--dim);font-size:14px;line-height:1.9;}
#ovB{background:var(--p1);border:none;color:#06222b;font-size:16px;font-weight:700;padding:10px 34px;border-radius:999px;cursor:pointer;}
</style>
</head>
<body>
<div id="box">
<h1>光单车竞技场</h1>
<div id="tip">光单车留下光墙,别撞上任何光墙!玩家1:WASD 转向 · 玩家2:方向键转向 · 逼对手撞墙即可获胜 · 先胜 3 回合者夺冠,回合越快车越快</div>
<div class="cvwrap">
<canvas id="cv" width="720" height="480"></canvas>
<div id="ov"><div id="ovT">光单车竞技场</div><div id="ovS">两辆光单车在场地里留下致命光墙<br>玩家1:WASD 转向 · 玩家2:方向键转向<br>撞到墙壁或任何光墙即坠毁,撑到最后的获胜<br>先胜 3 回合者夺冠,每回合车速都会加快</div><button id="ovB">开始竞速</button></div>
</div>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovS=document.getElementById("ovS"),ovB=document.getElementById("ovB");
var CELL=24,COLS=30,ROWS=20;
var DX=[0,1,0,-1],DY=[-1,0,1,0];
var keys={},st;
function mkB(i){
 return{x:i===0?5:24,y:10,dir:i===0?1:3,q:[]};
}
function reset(){
 st={ph:"count",cd:80,score:[0,0],round:1,acc:0,spd:105,grid:[],b:[mkB(0),mkB(1)],msg:"",msgT:0,winner:-1};
 var j,i;
 for(j=0;j<ROWS;j++){st.grid.push([]);for(i=0;i<COLS;i++)st.grid[j].push(0);}
 st.grid[10][5]=1;st.grid[10][24]=2;
}
function start(){reset();ov.classList.add("hide");}
function show(t,s){ovT.textContent=t;ovS.innerHTML=s;ovB.textContent="再来一局";ov.classList.remove("hide");}
function turn(i,d){
 var b=st.b[i];
 if(st.ph!=="play")return;
 if(b.q.length<2)b.q.push(d);
}
function tick(){
 var i,b,nx=[],ny=[],dead=[false,false];
 for(i=0;i<2;i++){
  b=st.b[i];
  while(b.q.length){var d=b.q.shift();if((d+2)%4!==b.dir){b.dir=d;break;}}
  nx[i]=b.x+DX[b.dir];ny[i]=b.y+DY[b.dir];
 }
 if(nx[0]===nx[1]&&ny[0]===ny[1]){dead[0]=true;dead[1]=true;}
 for(i=0;i<2;i++){
  if(nx[i]<0||nx[i]>=COLS||ny[i]<0||ny[i]>=ROWS)dead[i]=true;
  else if(st.grid[ny[i]][nx[i]]!==0)dead[i]=true;
 }
 if(dead[0]||dead[1]){
  if(dead[0]&&dead[1]){st.winner=-1;st.msg="同归于尽!本回合重赛";st.msgT=110;}
  else{st.winner=dead[0]?1:0;st.score[st.winner]++;st.msg=(st.winner===0?"橙方":"蓝方")+"撞毁!";st.msgT=110;}
  st.ph="rend";return;
 }
 for(i=0;i<2;i++){
  b=st.b[i];b.x=nx[i];b.y=ny[i];
  st.grid[b.y][b.x]=i+1;
 }
}
function step(dt){
 var i;
 if(st.ph==="count"){st.cd-=dt;if(st.cd<=0)st.ph="play";}
 else if(st.ph==="play"){
  st.acc+=dt*16.67;
  while(st.acc>=st.spd){st.acc-=st.spd;tick();if(st.ph!=="play")break;}
 }else if(st.ph==="rend"){
  st.msgT-=dt;
  if(st.msgT<=0){
   if(st.score[0]>=3||st.score[1]>=3){
    st.ph="over";
    show(st.score[0]>=3?"蓝方获胜!":"橙方获胜!","最终比分 "+st.score[0]+" : "+st.score[1]);
   }else{
    var s0=st.score[0],s1=st.score[1],r=st.round+1;
    reset();st.score=[s0,s1];st.round=r;
    st.spd=Math.max(72,108-(st.round-1)*9);
   }
  }
 }
}
function draw(){
 ctx.clearRect(0,0,720,480);
 var i,j,x,y,b;
 ctx.strokeStyle="rgba(120,140,220,.07)";ctx.lineWidth=1;
 for(i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,480);ctx.stroke();}
 for(j=1;j<ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(720,j*CELL);ctx.stroke();}
 for(j=0;j<ROWS;j++)for(i=0;i<COLS;i++){
  var v=st.grid[j][i];
  if(v===1){ctx.fillStyle="rgba(79,209,197,.4)";ctx.fillRect(i*CELL+3,j*CELL+3,CELL-6,CELL-6);}
  else if(v===2){ctx.fillStyle="rgba(246,173,85,.4)";ctx.fillRect(i*CELL+3,j*CELL+3,CELL-6,CELL-6);}
 }
 for(i=0;i<2;i++){
  b=st.b[i];
  x=b.x*CELL+CELL/2;y=b.y*CELL+CELL/2;
  ctx.fillStyle=i===0?"#4fd1c5":"#f6ad55";
  ctx.fillRect(b.x*CELL+2,b.y*CELL+2,CELL-4,CELL-4);
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(x+DX[b.dir]*7,y+DY[b.dir]*7,4,0,6.2832);ctx.fill();
 }
 ctx.textAlign="center";ctx.textBaseline="top";
 ctx.font="bold 15px system-ui";ctx.fillStyle="#8b93b0";
 ctx.fillText("第 "+st.round+" 回合 · 先胜 3 回合 · 车速 "+(111-st.spd),360,8);
 ctx.font="bold 16px system-ui";
 ctx.textAlign="left";ctx.fillStyle="#4fd1c5";ctx.fillText("蓝方 "+st.score[0],14,8);
 ctx.textAlign="right";ctx.fillStyle="#f6ad55";ctx.fillText(st.score[1]+" 橙方",706,8);
 if(st.ph==="count"){
  ctx.textAlign="center";ctx.fillStyle="#e9edf8";ctx.font="bold 44px system-ui";
  ctx.fillText("第 "+st.round+" 回合",360,180);
  ctx.font="bold 28px system-ui";ctx.fillText(String(Math.ceil(st.cd/27)),360,236);
 }
 if(st.ph==="rend"){ctx.textAlign="center";ctx.fillStyle="#ff5c7a";ctx.font="bold 32px system-ui";ctx.fillText(st.msg,360,200);}
}
var last=0;
function loop(t){
 var dt=Math.min(2.5,(t-last)/16.67||1);last=t;
 if(st.ph!=="over")step(dt);
 draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase();
 if(k==="arrowup"||k==="arrowdown"||k==="arrowleft"||k==="arrowright"||k===" ")e.preventDefault();
 if(k==="w")turn(0,0);
 if(k==="d")turn(0,1);
 if(k==="s")turn(0,2);
 if(k==="a")turn(0,3);
 if(k==="arrowup")turn(1,0);
 if(k==="arrowright")turn(1,1);
 if(k==="arrowdown")turn(1,2);
 if(k==="arrowleft")turn(1,3);
});
ovB.addEventListener("click",function(){start();ovB.blur();});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>

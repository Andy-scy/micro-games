<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>燃料巡航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#a3e635;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#a3e635;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#a3e635}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#a3e635;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>燃料巡航</h1>
  <p class="hint">空格 / 点击 / 触屏 = 拍翅膀(每次耗油)· 吃油桶补燃料!</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">燃料巡航</h2>
      <p id="ovDesc">老式燃油小飞机:燃料持续消耗,每拍一次翅膀额外耗油;油尽后翅膀拍不动,只能滑翔等死!航线上散布着油桶(+32 燃料 & +1 分),绕点路也必须吃到。穿管 +1 分,油尽坠地或撞管即结束。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">加满油起飞</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=70,GAP=152,SPACE=244,GRAV=1450,FLAP=-378,BX=120,BR=13,SPEED=145;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,cans,popups,score,best=0,tick,fuel,denyT;
function newPipe(x){
  var p={x:x,gy:64+Math.random()*(GROUND-128-GAP),passed:false};
  if(Math.random()<0.68)cans.push({x:x+PW+120,y:90+Math.random()*(GROUND-190),got:false,ph:Math.random()*6.28});
  return p;
}
function reset(){
  bird={y:280,vy:0,fl:0};
  pipes=[];cans=[];popups=[];
  score=0;tick=0;fuel=100;denyT=0;
  pipes.push(newPipe(W+150));
  elScore.textContent="0";
}
function act(){
  if(state!=="playing")return;
  if(fuel>=6){
    fuel-=6;
    bird.vy=FLAP;bird.fl=1;
  }else if(denyT<=0){
    denyT=0.55;
    popups.push({x:BX+46,y:bird.y-30,txt:"没油了!",life:0.6});
  }
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,p,c;
  tick+=dt;
  denyT=Math.max(0,denyT-dt);
  fuel=Math.max(0,fuel-8.5*dt);
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  bird.fl=Math.max(0,bird.fl-dt*5);
  if(bird.y<BR+2){bird.y=BR+2;bird.vy=Math.max(bird.vy,0);}
  if(bird.y+BR>GROUND){die("燃料耗尽,滑翔坠地……");return;}
  for(i=0;i<pipes.length;i++)pipes[i].x-=SPEED*dt;
  if(pipes[pipes.length-1].x<W-SPACE)pipes.push(newPipe(W+24));
  if(pipes[0].x<-PW-12)pipes.shift();
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x+PW<BX-BR){
      p.passed=true;score++;
      elScore.textContent=String(score);
      popups.push({x:BX+34,y:bird.y-26,txt:"+1",life:0.8});
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gy)||circleRect(BX,bird.y,BR,p.x,p.gy+GAP,PW,GROUND-p.gy-GAP)){
      die("撞上了管道!");return;
    }
  }
  for(i=cans.length-1;i>=0;i--){
    c=cans[i];
    c.x-=SPEED*dt;
    if(c.x<-30){cans.splice(i,1);continue;}
    var dx=BX-c.x,dy=bird.y-(c.y+Math.sin(tick*2.4+c.ph)*8),rr=BR+12;
    if(dx*dx+dy*dy<rr*rr){
      cans.splice(i,1);
      fuel=Math.min(100,fuel+32);
      score++;
      elScore.textContent=String(score);
      popups.push({x:c.x,y:c.y-20,txt:"燃料 +32",life:0.9});
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  ctx.fillStyle="#4d6b1a";
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+GAP,PW,GROUND-p.gy-GAP);
  ctx.fillStyle="#a3e635";
  ctx.fillRect(p.x+6,0,7,p.gy);
  ctx.fillRect(p.x+6,p.gy+GAP,7,GROUND-p.gy-GAP);
  ctx.fillStyle="#2e420e";
  ctx.fillRect(p.x-4,p.gy-13,PW+8,13);
  ctx.fillRect(p.x-4,p.gy+GAP,PW+8,13);
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#111a0e";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(220,255,190,0.3)";
  for(i=0;i<35;i++)ctx.fillRect((i*137)%W,(i*223)%GROUND,1.3,1.3);
  for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  for(i=0;i<cans.length;i++){
    var c=cans[i],cy=c.y+Math.sin(tick*2.4+c.ph)*8;
    ctx.fillStyle="#65a30d";
    ctx.fillRect(c.x-8,cy-11,16,22);
    ctx.fillStyle="#d9f99d";
    ctx.fillRect(c.x-8,cy-11,16,5);
    ctx.fillStyle="#365314";
    ctx.fillRect(c.x-3,cy-14,6,4);
    ctx.fillStyle="#ecfccb";
    ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("油",c.x,cy+3);
  }
  ctx.fillStyle="#1c2617";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle="#2c3a22";
  var off=(tick*SPEED)%24;
  for(i=-1;i<W/24+1;i++)ctx.fillRect(i*24-off,GROUND,12,6);
  ctx.fillStyle="#d9f99d";
  ctx.beginPath();ctx.arc(BX,bird.y,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#84cc16";
  ctx.beginPath();ctx.arc(BX-4,bird.y+4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111a0e";
  ctx.beginPath();ctx.arc(BX+5,bird.y-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#a3e635";ctx.lineWidth=3;
  var pr=8+Math.sin(tick*40)*4;
  ctx.beginPath();ctx.moveTo(BX+BR+2,bird.y-6);ctx.lineTo(BX+BR+2,bird.y+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(BX+BR+2-pr,bird.y);ctx.lineTo(BX+BR+2+pr,bird.y);ctx.stroke();
  ctx.fillStyle="rgba(8,10,22,0.7)";
  ctx.fillRect(14,14,154,18);
  ctx.strokeStyle="#65a30d";ctx.lineWidth=1.5;
  ctx.strokeRect(14,14,154,18);
  ctx.fillStyle=fuel>50?"#a3e635":(fuel>25?"#fbbf24":"#f87171");
  ctx.fillRect(17,17,148*(fuel/100),12);
  ctx.fillStyle="#e8eaf6";
  ctx.font="bold 11px system-ui";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("燃料",20,41);
  if(fuel<20&&Math.sin(tick*8)>0){
    ctx.fillStyle="#f87171";
    ctx.font="bold 14px system-ui";ctx.textAlign="center";
    ctx.fillText("低油量!",W/2,70);
  }
  ctx.font="bold 16px system-ui";ctx.textAlign="center";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(217,249,157,"+popups[i].life+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

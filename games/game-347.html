<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一心二用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#5eead4;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#5eead4;font-size:16px}
.gbtn{background:#0f3d38;color:#5eead4;border:1px solid #5eead4;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#5eead4;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:380px;margin:0 auto;touch-action:manipulation}
.zone{border-radius:14px;padding:10px;border:2px solid #253055;transition:border-color .2s,box-shadow .2s;background:#141a30}
.zone.active{border-color:#5eead4;box-shadow:0 0 16px rgba(94,234,212,.35)}
.zone h3{text-align:center;font-size:14px;color:#8b90b0;margin-bottom:8px;letter-spacing:2px}
.zone.active h3{color:#5eead4}
.zp{display:flex;flex-direction:column;gap:8px}
.pad{height:52px;border-radius:10px;cursor:pointer;transition:transform .06s,box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.96)}
.lp0{background:#0b2e33;border:2px solid #0e7490}.lp0.lit{background:#14b8a6;border-color:#99f6e4;box-shadow:0 0 20px rgba(20,184,166,.85)}
.lp1{background:#0c2447;border:2px solid #1d4ed8}.lp1.lit{background:#3b82f6;border-color:#bfdbfe;box-shadow:0 0 20px rgba(59,130,246,.85)}
.lp2{background:#1e1b4b;border:2px solid #6d28d9}.lp2.lit{background:#8b5cf6;border-color:#ddd6fe;box-shadow:0 0 20px rgba(139,92,246,.85)}
.rp0{background:#3d1114;border:2px solid #991b1b}.rp0.lit{background:#ef4444;border-color:#fecaca;box-shadow:0 0 20px rgba(239,68,68,.85)}
.rp1{background:#39300a;border:2px solid #a16207}.rp1.lit{background:#eab308;border-color:#fef08a;box-shadow:0 0 20px rgba(234,179,8,.85)}
.rp2{background:#3a1d08;border:2px solid #c2410c}.rp2.lit{background:#f97316;border-color:#fed7aa;box-shadow:0 0 20px rgba(249,115,22,.85)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#5eead4;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#5eead4;color:#0f3d38;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>一心二用</h1>
  <p class="hint">双区多任务记忆:左区和右区各有一条独立序列,每轮两边各加一步。演示先播左区、再播右区;复述时也必须先完整点完左区,再点右区。键盘:左区 1/2/3,右区 7/8/9。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>两边各 <b id="len">0</b> 步</span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="zones">
    <div class="zone" id="zoneL">
      <h3>左区</h3>
      <div class="zp">
        <div class="pad lp0" data-i="0">1</div>
        <div class="pad lp1" data-i="1">2</div>
        <div class="pad lp2" data-i="2">3</div>
      </div>
    </div>
    <div class="zone" id="zoneR">
      <h3>右区</h3>
      <div class="zp">
        <div class="pad rp0" data-i="3">7</div>
        <div class="pad rp1" data-i="4">8</div>
        <div class="pad rp2" data-i="5">9</div>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">一心二用</h2>
    <p id="ovDesc">两条序列同时增长,大脑得开两个线程:左脑一条、右脑一条。复述顺序固定「先左后右」,串区即失败。真正的多任务压力测试。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg347_best",FREQ=[392.00,329.63,261.63,220.00,174.61,146.83],GAP=560,FLASH=360;
var seqL=[],seqR=[],zone="L",posL=0,posR=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var padEls=[],zones=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elLen=$("len"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.24;v=v==null?0.14:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var all=document.querySelectorAll(".pad");for(var i=0;i<all.length;i++)padEls.push(all[i]);zones=[$("zoneL"),$("zoneR")];})();
function padOf(z,i){return padEls[(z==="L"?0:3)+i];}
function flash(z,i,ms){var el=padOf(z,i);el.classList.add("lit");tone(FREQ[(z==="L"?0:3)+i]);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||FLASH));}
function clearLit(){for(var i=0;i<6;i++)padEls[i].classList.remove("lit");}
function setZoneActive(z){zones[0].classList.toggle("active",z==="L");zones[1].classList.toggle("active",z==="R");}
function rnd(arr){var n;do{n=(Math.random()*3)|0;}while(arr.length&&n===arr[arr.length-1]);return n;}
function updateHud(){elLv.textContent=level;elLen.textContent=seqL.length;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";setZoneActive("L");setMsg("先看左区…");
var i=0;(function stepL(){if(i>=seqL.length){setZoneActive("R");setMsg("换右区…");timers.push(setTimeout(playR,520));return;}flash("L",seqL[i]);i++;timers.push(setTimeout(stepL,GAP));})();
function playR(){var j=0;(function stepR(){if(j>=seqR.length){setZoneActive("L");state="input";zone="L";posL=0;posR=0;setMsg("先复述左区,再复述右区!");return;}flash("R",seqR[j]);j++;timers.push(setTimeout(stepR,GAP));})();}}
function nextRound(){seqL.push(rnd(seqL));seqR.push(rnd(seqR));updateHud();playSeq();}
function newGame(){clearTimers();clearLit();setZoneActive("");seqL=[];seqR=[];posL=0;posR=0;zone="L";level=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,600));}
function winStep(){level++;state="wait";setZoneActive("");setMsg("双区全对!各加一步…");updateHud();timers.push(setTimeout(nextRound,850));}
function fail(txt){clearTimers();clearLit();state="over";tone(92,0.55,0.2,"sawtooth");setZoneActive("");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="一心崩了";
ovDesc.textContent=txt||("两条序列各长 "+seqL.length+" 步时被难住。诀窍:左区用眼睛记、右区用嘴念,分通道存储更稳。");
ovScore.style.display="block";ovScore.textContent="成功完成 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(z,i){if(state!=="input")return;
if(z!==zone){fail(z==="L"?"右区抢先了!当前要先复述左区。":"左区还没完!先把左区点完再碰右区。");return;}
if(zone==="L"){flash("L",i,200);if(seqL[posL]===i){posL++;if(posL>=seqL.length){zone="R";setZoneActive("R");setMsg("左区完成!换右区!");}}else fail();}
else{flash("R",i,200);if(seqR[posR]===i){posR++;if(posR>=seqR.length)winStep();}else fail();}}
function start(){initAudio();newGame();ov.classList.add("hide");}
(function bind(){for(var i=0;i<padEls.length;i++){(function(el,idx){el.addEventListener("click",function(){press(idx<3?"L":"R",idx%3);});})(padEls[i],i);}})();
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;
if(k==="1")press("L",0);else if(k==="2")press("L",1);else if(k==="3")press("L",2);
else if(k==="7")press("R",0);else if(k==="8")press("R",1);else if(k==="9")press("R",2);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

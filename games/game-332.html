<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极速点灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f43f5e;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f43f5e;font-size:16px}
.gbtn{background:#43121f;color:#f43f5e;border:1px solid #f43f5e;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#f43f5e;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.bar{height:10px;background:#111527;border-radius:5px;margin:0 auto 12px;max-width:360px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#fb7185,#f43f5e);border-radius:5px}
.bar.low i{background:linear-gradient(90deg,#fbbf24,#ef4444)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:11px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .15s,box-shadow .15s,transform .08s}
.cell.on{background:linear-gradient(145deg,#fda4af,#e11d48);border-color:#ffe4e6;box-shadow:0 0 14px rgba(244,63,94,.55)}
.cell:active{transform:scale(.92)}
.cell.flash{animation:ff .5s ease}
@keyframes ff{0%{transform:scale(1)}50%{transform:scale(.85)}100%{transform:scale(1)}}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#f43f5e;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#f43f5e;color:#43121f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>极速点灯</h1>
  <p class="hint">45 秒极速挑战!每点亮一块 4×4 棋盘立即换下一盘,并奖励 4 秒。时间归零即结束,看看你能连续点亮多少盘。</p>
  <div class="hud">
    <span>已点亮 <b id="boards">0</b> 盘</span>
    <span>本盘步数 <b id="moves">0</b></span>
    <span>最多纪录 <b id="best">--</b> 盘</span>
    <button class="gbtn" id="btnNew">放弃重开</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="bar" id="barWrap"><i id="bar"></i></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">极速点灯</h2>
    <p id="ovDesc">倒计时 45 秒,每点亮一盘 +4 秒并立刻换新盘。手速与棋感缺一不可:先扫一眼最容易消灭的行,别在一格上纠缠超过三秒!</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始冲刺</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=4,CNT=16;
var gridEl=$("grid"),elBoards=$("boards"),elMoves=$("moves"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew"),elBar=$("bar"),barWrap=$("barWrap");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],moves=0,boards=0,state="menu",timeLeft=0;
var best=loadNum("mg332_best");

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c,silent){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++){board[list[i]]^=1;paint(list[i]);}
  if(!silent)moves++;
}
function litCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i])n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function updateHud(){
  elBoards.textContent=boards;elMoves.textContent=moves;
  elBest.textContent=best>0?best:"--";
}
function nextBoard(){
  board=[];for(var i=0;i<CNT;i++)board.push(1);
  moves=0;
  var ps=pickCells(4+((Math.random()*2)|0)),j;
  for(j=0;j<ps.length;j++)press((ps[j]/N)|0,ps[j]%N,true);
  paintAll();updateHud();
}
function newGame(){
  boards=0;timeLeft=45;state="playing";
  nextBoard();
  setMsg("开始!点亮整盘就 +4 秒");
}
function doPress(i){
  if(state!=="playing")return;
  press((i/N)|0,i%N,false);
  updateHud();
  if(litCount()===CNT){
    boards++;
    timeLeft=Math.min(60,timeLeft+4);
    cells[i].classList.add("flash");
    setMsg("第 "+boards+" 盘点亮!+4 秒");
    nextBoard();
  }
}
function timeUp(){
  state="over";
  var isNew=false;
  if(boards>best){best=boards;saveNum("mg332_best",best);isNew=true;}
  ovTitle.textContent="时间到!";
  ovDesc.textContent=isNew?"新纪录!手速与思路的双重胜利。":"沙漏流尽,灯海落幕。再来一次,说不定能多亮几盘。";
  ovScore.style.display="block";
  ovScore.textContent="连续点亮 "+boards+" 盘";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function start(){newGame();ov.classList.add("hide");}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(e.key==="Enter"||e.key===" ")e.preventDefault();
});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){
  if(state==="menu")return;
  timeUp();
});
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=t-lastT;lastT=t;
  if(state==="playing"){
    timeLeft-=dt/1000;
    if(timeLeft<=0){timeLeft=0;timeUp();}
    var pct=timeLeft*100/60;
    elBar.style.width=Math.max(0,pct)+"%";
    if(timeLeft<10)barWrap.classList.add("low");
    else barWrap.classList.remove("low");
  }
}
build();
board=[];for(var z=0;z<CNT;z++)board.push(1);
var ps0=pickCells(5),z2;
for(z2=0;z2<ps0.length;z2++)press((ps0[z2]/N)|0,ps0[z2]%N,true);
paintAll();updateHud();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

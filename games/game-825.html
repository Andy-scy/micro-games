<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连点成画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#a78bfa;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:8px;line-height:1.6}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#a78bfa;font-size:16px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid #3b2f63;background:#10141f;line-height:0}
canvas{width:100%;height:auto;touch-action:none;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(12,8,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;line-height:1.7}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#a78bfa}
.overlay p{color:#aab0d0;font-size:14px;white-space:pre-line}
.overlay .big{font-size:19px;color:#fde047;font-weight:700}
.overlay button{margin-top:6px;background:#a78bfa;color:#291b4d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>连点成画</h1>
  <p class="hint">按 <b style="color:#a78bfa">1 → 2 → 3 …</b> 的顺序依次点亮数字点,线条自动相连;<br>全部连完,隐藏的剪影就会上色成形。点错了会记失误哦!</p>
  <div class="hud"><span>图案 <b id="lv">1/3</b></span><span>失误 <b id="miss">0</b></span><span>得分 <b id="score">0</b></span></div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">连点成画</h2>
      <p id="ovP">三幅剪影画藏在数字点里:五角星、小房子、小鱼。跟着编号连,连错不改分但会扣失误,失误越少得分越高。</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始连点</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var ov=$("ov"),ovT=$("ovT"),ovP=$("ovP"),ovS=$("ovS"),btnGo=$("btnGo");
var elLv=$("lv"),elMiss=$("miss"),elScore=$("score");
function starPts(cx,cy,R,r,n){
  var pts=[],i;
  for(i=0;i<n*2;i++){
    var rad=(i%2===0)?R:r,a=-Math.PI/2+Math.PI*i/n;
    pts.push([cx+rad*Math.cos(a),cy+rad*Math.sin(a)]);
  }
  return pts;
}
var PICS=[
 {name:"五角星",pts:starPts(240,250,165,68,5),col:"#fbbf24"},
 {name:"小房子",pts:[[140,400],[340,400],[340,250],[240,160],[140,250]],col:"#4ade80"},
 {name:"小鱼",pts:[[110,240],[190,180],[310,185],[360,150],[405,240],[360,330],[310,295],[190,300]],col:"#38bdf8"}
];
var state="menu",pic=0,next=1,seq=[],miss=0,score=0,waitT=0,flashT=0,flashIdx=-1,parts=[],tt=0;
function loadPic(){
  next=1;seq=[];flashIdx=-1;
  elLv.textContent=(pic+1)+"/3";
}
function hud(){elMiss.textContent=miss;elScore.textContent=score;}
function pos(e){
  var r=cv.getBoundingClientRect(),t=e;
  if(e.touches&&e.touches.length)t=e.touches[0];
  else if(e.changedTouches&&e.changedTouches.length)t=e.changedTouches[0];
  return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height};
}
function burst(x,y,col){
  var i;
  for(i=0;i<36;i++){
    var a=Math.random()*Math.PI*2,sp=60+Math.random()*160;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:1+Math.random()*0.5,col:col});
  }
}
function pick(e){
  if(state!=="playing"||waitT>0)return;
  var p=pos(e),pts=PICS[pic].pts,i,bi=-1,bd=26*26;
  for(i=0;i<pts.length;i++){
    var dx=pts[i][0]-p.x,dy=pts[i][1]-p.y,d=dx*dx+dy*dy;
    if(d<bd){bd=d;bi=i;}
  }
  if(bi<0)return;
  if(bi===next-1){
    seq.push(bi);next++;
    if(next>pts.length){
      var gain=Math.max(0,100-miss*15);
      score+=gain;hud();
      burst(pts[bi][0],pts[bi][1],PICS[pic].col);
      waitT=1.5;
    }
  }else{
    miss++;hud();flashIdx=bi;flashT=0.5;
  }
}
cv.addEventListener("mousedown",pick);
cv.addEventListener("touchstart",function(e){e.preventDefault();pick(e);},{passive:false});
function draw(){
  tt+=0.016;
  var pts=PICS[pic].pts,i;
  ctx.fillStyle="#10141f";ctx.fillRect(0,0,480,480);
  if(seq.length>1){
    ctx.strokeStyle="rgba(167,139,250,0.9)";ctx.lineWidth=3;ctx.lineJoin="round";
    ctx.beginPath();
    for(i=0;i<seq.length;i++){
      var q=pts[seq[i]];
      if(i===0)ctx.moveTo(q[0],q[1]);else ctx.lineTo(q[0],q[1]);
    }
    ctx.stroke();
  }
  if(seq.length>=pts.length){
    ctx.beginPath();
    for(i=0;i<pts.length;i++){
      if(i===0)ctx.moveTo(pts[i][0],pts[i][1]);else ctx.lineTo(pts[i][0],pts[i][1]);
    }
    ctx.closePath();
    ctx.globalAlpha=0.3;ctx.fillStyle=PICS[pic].col;ctx.fill();ctx.globalAlpha=1;
    ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillStyle=PICS[pic].col;
    ctx.fillText(PICS[pic].name+" 完成!",240,60);
  }
  for(i=0;i<pts.length;i++){
    var done=seq.indexOf(i)>=0;
    var isNext=(i===next-1)&&waitT<=0;
    var r=done?9:(isNext?12+Math.sin(tt*6)*2.5:11);
    ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],r,0,Math.PI*2);
    ctx.fillStyle=done?"#a78bfa":"#1b2340";ctx.fill();
    ctx.strokeStyle=isNext?"#fde047":"#6d5fb8";ctx.lineWidth=2;ctx.stroke();
    if(!done){
      ctx.font="bold 13px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle=isNext?"#fde047":"#c7cbe8";
      ctx.fillText(String(i+1),pts[i][0],pts[i][1]);
    }
    if(i===flashIdx&&flashT>0){
      ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],17,0,Math.PI*2);
      ctx.strokeStyle="rgba(248,113,113,0.9)";ctx.lineWidth=3;ctx.stroke();
    }
  }
  var k;
  for(k=parts.length-1;k>=0;k--){
    var pt=parts[k];
    pt.life-=0.016;pt.x+=pt.vx*0.016;pt.y+=pt.vy*0.016;pt.vy+=200*0.016;
    if(pt.life<=0){parts.splice(k,1);continue;}
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-2,pt.y-2,4,4);
    ctx.globalAlpha=1;
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state!=="playing")return;
  if(flashT>0)flashT-=0.016;
  if(waitT>0){
    waitT-=0.016;
    if(waitT<=0){
      pic++;
      if(pic>=3){finish();return;}
      loadPic();
    }
  }
  draw();
}
function finish(){
  state="over";
  ovT.textContent="剪影画廊开幕!";
  ovP.textContent="三幅剪影全部连点成形,共失误 "+miss+" 次。\n"+(miss<=2?"手准心细,画师认证!":"多练几次就能零失误啦。");
  ovS.style.display="block";ovS.textContent="总分 "+score+" / 300";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
btnGo.addEventListener("click",function(){
  pic=0;miss=0;score=0;parts=[];state="playing";
  ovS.style.display="none";ov.classList.add("hide");
  hud();loadPic();
});
loadPic();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

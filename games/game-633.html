<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>变色冲刺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
#app{width:100%;max-width:400px}
h1{font-size:25px;text-align:center;color:#ffd166;margin-bottom:6px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:12px}
.card{background:#1a1f36;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:13px}
.big{font-size:20px;font-weight:800;color:#ffd166}
canvas{display:block;margin:0 auto;width:100%;max-width:360px;border-radius:10px}
#ctrl{display:flex;gap:10px;justify-content:center;margin-top:10px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
.btn.sec{background:#2a3154;color:#cdd6f4}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:26px 30px;text-align:center;max-width:88vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:24px}
.ov p{color:#cdd6f4;margin-bottom:16px;line-height:1.8;font-size:14px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>变色冲刺</h1>
  <p class="tips">三车道上有彩色闸门不断逼近,你的圆点也有一种颜色——只有「车色 = 闸门色」才能安全穿过!左右键(或 A/D)换道,空格(或按钮)循环切换自身颜色。撞错色 -1 生命,共 3 条,穿过 40 道闸门通关。</p>
  <div class="card">
    <div class="row">
      <div class="stat"><div class="mut">穿过</div><div class="big" id="sc">0/40</div></div>
      <div class="stat"><div class="mut">生命</div><div class="big" id="hp">♥♥♥</div></div>
    </div>
  </div>
  <div class="card">
    <canvas id="cv" width="360" height="470"></canvas>
    <div id="ctrl">
      <button class="btn sec" id="bl">左移</button>
      <button class="btn" id="bc">变色</button>
      <button class="btn sec" id="br">右移</button>
    </div>
  </div>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">变色冲刺</h2><p id="ovp">玩法:色彩反应跑酷。<br>· 圆点自动停在底部,闸门每排三块、颜色随机<br>· 圆点只能穿过与自己颜色相同的闸门<br>· 左移/右移(←→ 或 A/D)换道;变色(空格)在三种颜色间循环<br>· 撞上异色闸门 -1 生命并短暂无敌闪白<br>· 每穿过一道闸门 +1 分,穿过 40 道通关!</p><button class="btn" id="obtn">开始挑战</button></div></div>
<script>
'use strict';
var COLS=[['青','#4cc9f0'],['粉','#ff6b9d'],['黄','#ffd166']];
var PX=[70,180,290],PY=400;
var rows=[],lane=1,ci=0,score=0,lives=3,invT=0,spawnAcc=0,hurtT=0;
var playing=false,over=false,last=0;
function $(id){return document.getElementById(id)}
function spawnRow(){
  var cols=[];
  for(var i=0;i<3;i++)cols.push(Math.floor(Math.random()*3));
  rows.push({y:-24,cols:cols,passed:false,hit:false});
}
function rrect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);
  c.lineTo(x+r,y+h);c.arc(x+r,y+r,r,Math.PI/2,Math.PI*1.5);
  c.closePath();
}
function draw(){
  var c=$('cv').getContext('2d');
  c.fillStyle='#131832';c.fillRect(0,0,360,470);
  c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=2;
  for(var i=0;i<4;i++){c.beginPath();c.moveTo(i*120,0);c.lineTo(i*120,470);c.stroke();}
  for(i=0;i<rows.length;i++){
    var r=rows[i];
    for(var j=0;j<3;j++){
      rrect(c,PX[j]-46,r.y-8,92,16,7);
      c.fillStyle=COLS[r.cols[j]][1];c.fill();
      c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1;c.stroke();
    }
  }
  var blink=invT>0&&Math.floor(invT*10)%2===0;
  if(!blink){
    c.beginPath();c.arc(PX[lane],PY,16,0,Math.PI*2);
    c.fillStyle=COLS[ci][1];c.fill();
    c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
  }
  if(hurtT>0){
    c.fillStyle='rgba(229,72,77,'+(hurtT*0.9)+')';
    c.fillRect(0,0,360,470);
  }
}
function drawTop(){
  $('sc').textContent=score+'/40';
  $('hp').textContent=lives>0?new Array(lives+1).join('♥'):'—';
}
function finish(win){
  playing=false;over=true;
  drawTop();
  $('ovt').textContent=win?'40 道闸门,全部穿越!':'撞了三次墙…';
  $('ovp').innerHTML=(win?'变色冲刺满分成名!':'最终穿过 ')+'<b>'+score+'</b> 道闸门<br>提前两排预判颜色,再来一局!';
  $('obtn').textContent='再来一局';
  $('overlay').classList.remove('hide');
}
function shift(d){
  if(!playing||over)return;
  lane=Math.max(0,Math.min(2,lane+d));
}
function recolor(){
  if(!playing||over)return;
  ci=(ci+1)%3;
}
$('bl').addEventListener('click',function(){shift(-1)});
$('br').addEventListener('click',function(){shift(1)});
$('bc').addEventListener('click',recolor);
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();shift(-1);}
  else if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();shift(1);}
  else if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();if(!e.repeat)recolor();}
});
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  if(playing&&!over){
    var sp=Math.min(430,170+score*7);
    spawnAcc+=sp*dt;
    var gap=Math.max(200,330-score*3);
    if(spawnAcc>=gap){spawnAcc=0;spawnRow();}
    for(var i=rows.length-1;i>=0;i--){
      var r=rows[i];
      r.y+=sp*dt;
      if(!r.hit&&invT<=0&&r.y>PY-22&&r.y<PY+22&&r.cols[lane]!==ci){
        r.hit=true;lives--;invT=1;hurtT=0.35;
      }
      if(!r.passed&&r.y>PY+30){
        r.passed=true;
        if(!r.hit)score++;
      }
      if(r.y>500)rows.splice(i,1);
    }
    invT=Math.max(0,invT-dt);
    hurtT=Math.max(0,hurtT-dt);
    if(score>=40){drawTop();draw();finish(true);requestAnimationFrame(loop);return;}
    if(lives<=0){drawTop();draw();finish(false);requestAnimationFrame(loop);return;}
    drawTop();
  }
  draw();
  requestAnimationFrame(loop);
}
function startGame(){
  rows=[];lane=1;ci=0;score=0;lives=3;invT=0;spawnAcc=0;hurtT=0;
  playing=true;over=false;
  drawTop();
  $('overlay').classList.add('hide');
}
$('obtn').addEventListener('click',startGame);
drawTop();draw();
requestAnimationFrame(loop);
</script>
</body>
</html>

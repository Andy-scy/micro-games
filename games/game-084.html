<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>母舰歼灭战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8ecf8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:14px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;text-align:center;color:#ff7b72;margin-bottom:6px}
.tip{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.6;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#0a0d1a;border:1px solid #262c48}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;text-align:center}
.overlay.hide{display:none}
.panel{padding:22px}
.panel h2{color:#ff7b72;font-size:24px;margin-bottom:10px}
.panel p{font-size:14px;color:#c6cdea;line-height:1.7;margin-bottom:16px}
button{background:#ff7b72;color:#2d0b09;border:0;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer}
button:active{transform:scale(.95)}
.hud{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:#c6cdea}
.hud b{color:#ff7b72;font-size:16px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>母舰歼灭战</h1>
<p class="tip">←→↑↓/WASD 或按住拖动移动,空格 / 按住屏幕开火。先清掉 8 架护航机,再击溃火力凶猛的敌方母舰即可获胜。</p>
<div class="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="ov" class="overlay"><div class="panel">
<h2 id="ovT">母舰歼灭战</h2>
<p id="ovX">一场定胜负的关底决战:突破护航编队,直面敌方母舰的弹幕,把它送进星海。</p>
<button id="btn">开始游戏</button>
</div></div>
</div>
<div class="hud"><span>得分<b id="hS">0</b></span><span>阶段<b id="hP">护航机</b></span><span>生命<b id="hH">4</b></span></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovX=document.getElementById("ovX"),btn=document.getElementById("btn");
var hS=document.getElementById("hS"),hP=document.getElementById("hP"),hH=document.getElementById("hH");
var MINIONS=8,BOSSHP=60;
var state="ready",score=0,hp=4,inv=0,cool=0,t=0;
var phase="minion",spawned=0,spawn=0.5,warn=0;
var boss=null;
var ship={x:W/2,y:H-80};
var bullets=[],ebullets=[],minions=[],parts=[],stars=[];
var keys={},px=0,py=0,pressed=false;
var i;
for(i=0;i<90;i++){stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.4,v:Math.random()*24+8});}
function reset(){
  score=0;hp=4;inv=0;cool=0;t=0;phase="minion";spawned=0;spawn=0.4;warn=0;boss=null;
  ship.x=W/2;ship.y=H-80;
  bullets=[];ebullets=[];minions=[];parts=[];
}
function boom(x,y,n,col){
  for(var k=0;k<n;k++){
    var a=Math.random()*6.283,s=Math.random()*160+40;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.4,col:col});
  }
}
function gameOver(win){
  state="over";
  ovT.textContent=win?"母舰歼灭":"战机坠毁";
  ovX.textContent="最终得分:"+score+(win?" · 敌方母舰化作漫天火光!":" · 母舰的弹幕太密集了,再试一次。");
  btn.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){reset();state="play";ov.classList.add("hide");}
function shot(x,y,vx,vy){ebullets.push({x:x,y:y,vx:vx,vy:vy});}
function update(dt){
  t+=dt;inv-=dt;cool-=dt;
  var sp=280;
  if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
  if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
  if(keys.ArrowUp||keys.w)ship.y-=sp*dt;
  if(keys.ArrowDown||keys.s)ship.y+=sp*dt;
  if(pressed){
    ship.x+=(px-ship.x)*Math.min(1,dt*10);
    ship.y+=(py-ship.y)*Math.min(1,dt*10);
  }
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.y=Math.max(H*0.45,Math.min(H-40,ship.y));
  if((keys[" "]||keys.z||pressed)&&cool<=0){
    cool=0.16;
    bullets.push({x:ship.x,y:ship.y-18});
  }
  if(phase==="minion"){
    spawn-=dt;
    if(spawn<=0&&spawned<MINIONS){
      spawn=1.1;
      spawned++;
      minions.push({x:60+Math.random()*(W-120),y:-30,vy:120,ph:Math.random()*6.283,hp:2});
    }
    if(spawned>=MINIONS&&!minions.length){
      phase="warn";warn=1.6;
    }
  }else if(phase==="warn"){
    warn-=dt;
    if(warn<=0){
      phase="boss";
      boss={x:W/2,y:120,hp:BOSSHP,t1:1.2,t2:3,mt:4};
    }
  }else{
    boss.x=W/2+Math.sin(t*0.7)*150;
    boss.y=110+Math.sin(t*1.3)*18;
    var p2=boss.hp<=BOSSHP/2;
    boss.t1-=dt;boss.t2-=dt;
    if(boss.t1<=0){
      boss.t1=p2?1.0:1.5;
      var n=p2?5:3;
      var dx=ship.x-boss.x,dy=ship.y-boss.y,base=Math.atan2(dy,dx);
      for(var k=0;k<n;k++){
        var a=base+(k-(n-1)/2)*0.22;
        shot(boss.x,boss.y+26,Math.cos(a)*230,Math.sin(a)*230);
      }
    }
    if(boss.t2<=0){
      boss.t2=p2?3.4:4.6;
      var m=p2?18:12;
      for(var k2=0;k2<m;k2++){
        var a2=k2/m*6.283+t;
        shot(boss.x,boss.y,Math.cos(a2)*170,Math.sin(a2)*170);
      }
    }
    if(p2){
      boss.mt-=dt;
      if(boss.mt<=0&&minions.length<2){
        boss.mt=7;
        minions.push({x:boss.x,y:boss.y+20,vy:130,ph:Math.random()*6.283,hp:2});
      }
    }
    if(boss.hp<=0){
      score+=500;
      boom(boss.x,boss.y,40,"#ffd166");
      gameOver(true);return;
    }
  }
  var bi,j;
  for(bi=bullets.length-1;bi>=0;bi--){
    bullets[bi].y-=540*dt;
    if(bullets[bi].y<-20)bullets.splice(bi,1);
  }
  for(i=minions.length-1;i>=0;i--){
    var e=minions[i];
    e.y+=e.vy*dt;
    e.x+=Math.sin(t*2.4+e.ph)*60*dt;
    if(e.y>H+30){minions.splice(i,1);continue;}
    if(inv<=0&&Math.abs(e.x-ship.x)<24&&Math.abs(e.y-ship.y)<24){
      minions.splice(i,1);hp--;inv=1.2;boom(e.x,e.y,12,"#ff6b6b");
    }
  }
  if(Math.random()<dt*0.8&&minions.length){
    var e3=minions[Math.floor(Math.random()*minions.length)];
    var dx3=ship.x-e3.x,dy3=ship.y-e3.y,d3=Math.sqrt(dx3*dx3+dy3*dy3)||1;
    shot(e3.x,e3.y+12,dx3/d3*180,dy3/d3*180);
  }
  for(i=ebullets.length-1;i>=0;i--){
    var b=ebullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-12||b.x>W+12||b.y<-12||b.y>H+12)ebullets.splice(i,1);
    else if(inv<=0&&Math.abs(b.x-ship.x)<11&&Math.abs(b.y-ship.y)<13){
      ebullets.splice(i,1);hp--;inv=1.2;boom(ship.x,ship.y,14,"#ff6b6b");
    }
  }
  for(bi=bullets.length-1;bi>=0;bi--){
    var bl=bullets[bi];
    var used=false;
    for(j=minions.length-1;j>=0;j--){
      var e2=minions[j];
      if(Math.abs(bl.x-e2.x)<20&&Math.abs(bl.y-e2.y)<20){
        bullets.splice(bi,1);used=true;
        e2.hp--;
        if(e2.hp<=0){score+=20;boom(e2.x,e2.y,12,"#ffd166");minions.splice(j,1);}
        break;
      }
    }
    if(!used&&phase==="boss"&&Math.abs(bl.x-boss.x)<54&&Math.abs(bl.y-boss.y)<24){
      bullets.splice(bi,1);
      boss.hp--;boss.flash=0.08;
      if(Math.random()<0.3)boom(bl.x,bl.y,4,"#ffd166");
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }
  if(inv<=0&&hp<=0)gameOver(false);
}
function draw(){
  ctx.fillStyle="#0a0d1a";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#8fa3d9";
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=0.3+s.s*0.3;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;
  if(phase==="boss"){
    ctx.fillStyle="#3a2430";
    ctx.fillRect(30,18,W-60,12);
    ctx.fillStyle="#ff7b72";
    ctx.fillRect(32,20,(W-64)*Math.max(0,boss?boss.hp:0)/BOSSHP,8);
    ctx.font="12px system-ui";ctx.textAlign="left";
    ctx.fillText("母舰装甲",34,44);
  }
  if(phase==="boss"&&boss){
    ctx.save();ctx.translate(boss.x,boss.y);
    ctx.fillStyle=boss.flash>0?"#ffffff":"#b0526b";
    ctx.fillRect(-54,-16,108,34);
    ctx.beginPath();ctx.moveTo(-54,18);ctx.lineTo(-30,34);ctx.lineTo(30,34);ctx.lineTo(54,18);
    ctx.closePath();ctx.fill();
    ctx.fillStyle="#ff7b72";ctx.fillRect(-16,22,32,14);
    ctx.fillStyle="#ffd166";
    ctx.beginPath();ctx.arc(0,0,9+Math.sin(t*6)*2,0,6.283);ctx.fill();
    ctx.restore();
    if(boss.flash>0)boss.flash-=0.016;
  }
  if(phase==="warn"){
    ctx.globalAlpha=Math.min(1,warn);
    ctx.fillStyle="#ff7b72";ctx.font="bold 28px system-ui";ctx.textAlign="center";
    ctx.fillText("警告:母舰接近",W/2,H/2-60);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle="#ff7b72";
  for(i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-2,bullets[i].y-10,4,14);
  ctx.fillStyle="#ffd166";
  for(i=0;i<ebullets.length;i++){
    ctx.beginPath();ctx.arc(ebullets[i].x,ebullets[i].y,4,0,6.283);ctx.fill();
  }
  for(i=0;i<minions.length;i++){
    var e=minions[i];
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle="#ff6b6b";
    ctx.beginPath();ctx.moveTo(0,14);ctx.lineTo(-14,-10);ctx.lineTo(14,-10);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(state!=="over"&&!(inv>0&&Math.floor(inv*12)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    ctx.fillStyle="#ff7b72";
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-14,14);ctx.lineTo(0,6);ctx.lineTo(14,14);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,0.05);
  last=now;
  for(var k=0;k<stars.length;k++){
    var st=stars[k];
    st.y+=st.v*dt;
    if(st.y>H){st.y=-2;st.x=Math.random()*W;}
  }
  if(state==="play")update(dt);
  draw();
  hS.textContent=score;
  hP.textContent=phase==="minion"?"护航机":(phase==="warn"?"警告":"母舰");
  hH.textContent=hp;
  requestAnimationFrame(loop);
}
function ptr(e){
  var r=cv.getBoundingClientRect();
  px=(e.clientX-r.left)*W/r.width;
  py=(e.clientY-r.top)*H/r.height;
}
cv.addEventListener("mousedown",function(e){ptr(e);pressed=true;});
window.addEventListener("mouseup",function(){pressed=false;});
cv.addEventListener("mousemove",function(e){if(pressed)ptr(e);});
cv.addEventListener("touchstart",function(e){e.preventDefault();ptr(e.touches[0]);pressed=true;},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();ptr(e.touches[0]);},{passive:false});
window.addEventListener("touchend",function(){pressed=false;});
window.addEventListener("keydown",function(e){
  if(e.key===" "||e.key.indexOf("Arrow")===0)e.preventDefault();
  if(e.key==="a"||e.key==="A")keys.a=true;else keys[e.key]=true;
  if(e.key==="Enter"&&state!=="play")start();
});
window.addEventListener("keyup",function(e){
  if(e.key==="a"||e.key==="A")keys.a=false;else keys[e.key]=false;
});
btn.addEventListener("click",start);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风轮险径</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:8px 0 2px;color:#c9d2ff;letter-spacing:1px}
p.tip{margin:4px 0 10px;font-size:13px;color:#aab0d0;line-height:1.7}
#hud{display:flex;justify-content:space-between;font-size:14px;color:#cfd3ee;margin:0 2px 8px}
#hud b{color:#c9d2ff}
#stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2c3154;background:#0f1220}
canvas{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,26,.84);text-align:center;padding:16px}
.hidden{display:none}
.ovBig{font-size:26px;font-weight:bold;color:#c9d2ff}
#ovTitle{font-size:26px;font-weight:bold;color:#ff5d73}
#ovInfo{font-size:14px;color:#aab0d0}
button{background:#c9d2ff;color:#141628;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<h1>风轮险径</h1>
<p class="tip">按住 鼠标 / 触屏 / 空格 上升,松开下坠。洞窟里架着一台台旋转的排风轮,叶片正呼呼地转——看准叶片间的空隙钻过去!每穿过一台风轮 +1 分,碰到叶片或岩壁即坠毁。</p>
<div id="hud"><span>穿过风轮:<b id="score">0</b> 台</span><span>最佳:<b id="best">0</b> 台</span></div>
<div id="stage">
<canvas id="cv" width="640" height="420"></canvas>
<div id="ovStart" class="overlay"><div class="ovBig">风轮呼啸</div><div style="font-size:13px;color:#aab0d0">盯准叶片空隙 · 时机就是一切</div><button id="btnStart">开始游戏</button></div>
<div id="ovOver" class="overlay hidden"><div id="ovTitle">被叶片击中了!</div><div id="ovInfo"></div><button id="btnRe">再来一局</button></div>
</div>
</div>
<script>
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d");
var W=cv.width,H=cv.height;
var COL=8;
var state="ready",holding=false,tG=0;
var scrollX,speed,dist,py,vy,cols,genX,parts,score;
var mills,nextMillX;
var best=0;
function loadBest(k){try{var v=localStorage.getItem(k);return v?(parseInt(v,10)||0):0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
best=loadBest("mg895best");
$("best").textContent=best;

function reset(){
  scrollX=0;speed=150;dist=0;score=0;
  py=H/2;vy=0;cols=[];genX=-48;parts=[];
  mills=[];nextMillX=560;
  while(genX<W+96){pushCol();}
  updHud();
}
function terrainC(x){
  return H/2+Math.sin(x*0.0042)*44+Math.sin(x*0.0117+1.3)*22+Math.sin(x*0.031+4.1)*8;
}
function gapAt(x){return 215+Math.sin(x*0.005+2.0)*14;}
function pushCol(){
  var g=gapAt(genX),c=terrainC(genX);
  var m=g/2+26;
  c=Math.max(m,Math.min(H-m,c));
  cols.push({x:genX,t:c-g/2,b:c+g/2});
  genX+=COL;
}
function colAt(x){
  if(!cols.length)return{t:0,b:H};
  var i=Math.floor((x-cols[0].x)/COL);
  if(i<0)i=0;if(i>cols.length-2)i=cols.length-2;
  return cols[i];
}
function pX(){return scrollX+150;}
function updHud(){$("score").textContent=score;}
function spawnMills(){
  while(nextMillX<scrollX+W+80){
    var c=colAt(nextMillX);
    var r=52+Math.random()*24;
    var cy=(c.t+c.b)/2+(Math.random()-0.5)*Math.max(0,(c.b-c.t)-2*r-40);
    mills.push({x:nextMillX,cy:cy,r:r,arms:Math.random()<0.5?2:3,spd:(Math.random()<0.5?-1:1)*(1.4+Math.random()*1.4),ph:Math.random()*6.28,passed:false});
    nextMillX+=300+Math.random()*180;
  }
  var i;
  for(i=mills.length-1;i>=0;i--)if(mills[i].x<scrollX-100)mills.splice(i,1);
}
function segDist(x0,y0,x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1;
  var l2=dx*dx+dy*dy;
  var t=0;
  if(l2>0)t=Math.max(0,Math.min(1,((x0-x1)*dx+(y0-y1)*dy)/l2));
  var cx=x1+t*dx,cy=y1+t*dy;
  return Math.sqrt((x0-cx)*(x0-cx)+(y0-cy)*(y0-cy));
}
function update(dt){
  speed=Math.min(280,150+dist*0.009);
  scrollX+=speed*dt;
  dist+=speed*dt;
  while(genX<scrollX+W+96)pushCol();
  while(cols.length>2&&cols[0].x+COL<scrollX-64)cols.shift();
  spawnMills();
  vy+=(holding?-600:540)*dt;
  vy=Math.max(-280,Math.min(320,vy));
  py+=vy*dt;
  if(py<8){py=8;vy=Math.max(vy,0);}
  if(py>H-8){py=H-8;vy=Math.min(vy,0);}
  var c=colAt(pX());
  if(py-11<c.t||py+11>c.b){die();return;}
  var i;
  for(i=0;i<mills.length;i++){
    var m=mills[i];
    var sx=m.x-scrollX;
    if(sx<-m.r-30||sx>W+m.r+30)continue;
    for(var a=0;a<m.arms;a++){
      var ang=m.ph+tG*m.spd+a*Math.PI*2/m.arms;
      var tx=sx+Math.cos(ang)*m.r;
      var ty=m.cy+Math.sin(ang)*m.r;
      if(segDist(150,py,sx,m.cy,tx,ty)<17){die();return;}
    }
    if(!m.passed&&m.x<pX()-m.r-14){m.passed=true;score++;}
  }
  if(holding&&Math.random()<0.5)parts.push({x:132,y:py+5,life:0.45});
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x-=(speed+120)*dt;if(p.life<=0)parts.splice(i,1);}
  updHud();
}
function die(){
  if(state!=="play")return;
  state="over";
  if(score>best){best=score;saveBest("mg895best",best);$("best").textContent=best;}
  $("ovInfo").textContent="共穿过 "+score+" 台风轮,最佳 "+best+" 台";
  $("ovOver").classList.remove("hidden");
}
function start(){reset();state="play";$("ovStart").classList.add("hidden");$("ovOver").classList.add("hidden");holding=false;}
function onHold(b){
  if(state==="ready"&&b){start();}
  if(state==="over")return;
  holding=b;
}
function drawBg(){
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#141428");bg.addColorStop(1,"#0c0c1a");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
}
function drawCave(){
  if(cols.length<2)return;
  var i0=0;
  while(i0<cols.length-1&&cols[i0].x+COL<scrollX-16)i0++;
  var last=cols.length-1;
  var ex=Math.min(W+16,cols[last].x-scrollX);
  ctx.fillStyle="#252a48";
  ctx.beginPath();ctx.moveTo(cols[i0].x-scrollX,0);
  for(var i=i0;i<cols.length&&cols[i].x<scrollX+W+16;i++)ctx.lineTo(cols[i].x-scrollX,cols[i].t);
  ctx.lineTo(ex,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cols[i0].x-scrollX,H);
  for(var j=i0;j<cols.length&&cols[j].x<scrollX+W+16;j++)ctx.lineTo(cols[j].x-scrollX,cols[j].b);
  ctx.lineTo(ex,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#6f7ec9";ctx.lineWidth=3;
  ctx.beginPath();var st=false;
  for(var k=i0;k<cols.length&&cols[k].x<scrollX+W+16;k++){var sx=cols[k].x-scrollX;if(!st){ctx.moveTo(sx,cols[k].t);st=true;}else ctx.lineTo(sx,cols[k].t);}
  ctx.stroke();
  ctx.beginPath();st=false;
  for(var k2=i0;k2<cols.length&&cols[k2].x<scrollX+W+16;k2++){var sx2=cols[k2].x-scrollX;if(!st){ctx.moveTo(sx2,cols[k2].b);st=true;}else ctx.lineTo(sx2,cols[k2].b);}
  ctx.stroke();
}
function drawMills(){
  var i;
  for(i=0;i<mills.length;i++){
    var m=mills[i];
    var sx=m.x-scrollX;
    if(sx<-m.r-30||sx>W+m.r+30)continue;
    ctx.strokeStyle="rgba(201,210,255,0.15)";
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(sx,m.cy,m.r,0,Math.PI*2);ctx.stroke();
    for(var a=0;a<m.arms;a++){
      var ang=m.ph+tG*m.spd+a*Math.PI*2/m.arms;
      var tx=sx+Math.cos(ang)*m.r;
      var ty=m.cy+Math.sin(ang)*m.r;
      var mx=(sx+tx)/2,my=(m.cy+ty)/2;
      var nx=-(ty-m.cy),ny=tx-sx;
      var nl=Math.sqrt(nx*nx+ny*ny)||1;
      nx/=nl;ny/=nl;
      ctx.fillStyle="#8f9bd6";
      ctx.beginPath();
      ctx.moveTo(sx+nx*4,m.cy+ny*4);
      ctx.lineTo(tx+nx*1.2,ty+ny*1.2);
      ctx.lineTo(tx-nx*1.2,ty-ny*1.2);
      ctx.lineTo(sx-nx*4,m.cy-ny*4);
      ctx.closePath();ctx.fill();
      ctx.fillStyle="#c9d2ff";
      ctx.beginPath();ctx.arc(tx,ty,3,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle="#ffd166";
    ctx.beginPath();ctx.arc(sx,m.cy,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#141628";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,m.cy,6,0,Math.PI*2);ctx.stroke();
  }
}
function drawShip(){
  ctx.save();ctx.translate(150,py);
  ctx.rotate(Math.max(-0.5,Math.min(0.5,vy*0.0016)));
  ctx.fillStyle="rgba(255,209,102,0.7)";
  for(var i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillRect(p.x-150+16,p.y-py,3,3);}
  ctx.globalAlpha=1;
  ctx.fillStyle="#ffd166";
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-9);ctx.lineTo(-6,0);ctx.lineTo(-10,9);ctx.closePath();ctx.fill();
  ctx.fillStyle="#ff9f43";ctx.beginPath();ctx.arc(-2,0,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function draw(){
  drawBg();
  drawCave();
  drawMills();
  drawShip();
}
$("btnStart").addEventListener("click",function(){start();});
$("btnRe").addEventListener("click",function(){start();});
cv.addEventListener("mousedown",function(e){e.preventDefault();onHold(true);});
window.addEventListener("mouseup",function(){onHold(false);});
cv.addEventListener("touchstart",function(e){e.preventDefault();onHold(true);},{passive:false});
window.addEventListener("touchend",function(){onHold(false);});
window.addEventListener("touchcancel",function(){onHold(false);});
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();if(!e.repeat)onHold(true);}
});
window.addEventListener("keyup",function(e){
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")onHold(false);
});
window.addEventListener("blur",function(){holding=false;});
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.033,((t-lastT)/1000)||0);lastT=t;
  tG+=dt;
  if(state==="play")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>

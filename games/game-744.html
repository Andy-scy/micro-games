<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跳弹大师</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#stage{position:relative}
canvas{display:block;background:#10142a;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:24px;margin-top:8px;user-select:none;-webkit-user-select:none;align-items:center}
#dpad{display:grid;grid-template-areas:". u ." "l d r";gap:6px}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pbtn.fire{width:84px;height:84px;border-radius:50%;font-size:16px;font-weight:700;background:#5a2a2a;border-color:#8a4444}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>跳弹大师</h1>
<div id="hud"><span>生命 <b id="hA">3</b></span><span>波次 <b id="hB">1/4</b></span><span>残敌 <b id="hC">0</b></span><span>分数 <b id="hD">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>跳弹大师</h2>
  <p id="ovP">全场钢墙,炮弹触墙会反弹一次!<br>反弹后的跳弹变红,能击中任何人——包括你自己。<br>利用折射狙击墙后的敌人,方向键/WASD 移动,空格开火。</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="pbtn" data-k="ArrowUp" style="grid-area:u">▲</div>
    <div class="pbtn" data-k="ArrowLeft" style="grid-area:l">◀</div>
    <div class="pbtn" data-k="ArrowDown" style="grid-area:d">▼</div>
    <div class="pbtn" data-k="ArrowRight" style="grid-area:r">▶</div>
  </div>
  <div class="pbtn fire" data-k="Space">开火</div>
</div>
<script>
"use strict";
const TS=32,COLS=15,ROWS=13;
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hA=document.getElementById('hA'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD');
function buildGrid(){
  const g=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push(0);g.push(r);}
  for(let y=1;y<ROWS-1;y+=2){
    for(let x=1;x<COLS-1;x+=2){
      if((x+y)%4===2)g[y][x]=2;
    }
  }
  return g;
}
let grid,score,lives,wave,queue,enemies,bullets,parts,player,spawnT,frame=0,state='start',banner,bannerT;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function rectVsGrid(x,y){
  if(x<0||y<0||x+28>cv.width||y+28>cv.height)return true;
  const x0=Math.floor(x/TS),y0=Math.floor(y/TS),x1=Math.floor((x+27)/TS),y1=Math.floor((y+27)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(grid[ty][tx]===2)return true;}
  return false;
}
function steelAt(px,py){
  if(px<0||py<0||px>=cv.width||py>=cv.height)return true;
  return grid[Math.floor(py/TS)][Math.floor(px/TS)]===2;
}
function tankOverlap(x,y,self){
  if(player&&player!==self&&Math.abs(player.x-x)<27&&Math.abs(player.y-y)<27)return true;
  for(const t of enemies){if(t===self)continue;if(Math.abs(t.x-x)<27&&Math.abs(t.y-y)<27)return true;}
  return false;
}
function moveTank(t,d){
  if(t.dir!==d){
    if(t.dir%2!==d%2){
      if(d%2===0)t.x=Math.round((t.x-2)/TS)*TS+2;else t.y=Math.round((t.y-2)/TS)*TS+2;
    }
    t.dir=d;
  }
  const v=DIRS[d],nx=t.x+v[0]*t.spd,ny=t.y+v[1]*t.spd;
  if(!rectVsGrid(nx,ny)&&!tankOverlap(nx,ny,t)){t.x=nx;t.y=ny;return true;}
  return false;
}
function fire(t,from){
  const v=DIRS[t.dir];
  bullets.push({x:t.x+14+v[0]*18-3,y:t.y+14+v[1]*18-3,vx:v[0]*4.6,vy:v[1]*4.6,from:from,owner:t,bounces:0,life:260});
}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:18+Math.random()*14,max:32,c:c||'#ffb050'});}
function mkEnemy(x,y){
  return {x:x,y:y,dir:2,spd:1.25,cd:60+Math.random()*60,think:20};
}
function initGame(){
  grid=buildGrid();score=0;lives=3;wave=0;enemies=[];bullets=[];parts=[];
  banner='第 1 波';bannerT=90;spawnT=40;queue=4;
  player={x:7*TS+2,y:11*TS+2,dir:0,spd:1.6,cd:0,inv:90};
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function updPlayer(){
  let d=-1;
  if(keys.ArrowUp||keys.KeyW)d=0;else if(keys.ArrowRight||keys.KeyD)d=1;
  else if(keys.ArrowDown||keys.KeyS)d=2;else if(keys.ArrowLeft||keys.KeyA)d=3;
  if(d>=0)moveTank(player,d);
  if(player.inv>0)player.inv--;
  player.cd--;
  if((keys.Space||keys.KeyJ)&&player.cd<=0){
    let n=0;for(const b of bullets)if(b.from==='p')n++;
    if(n<2){fire(player,'p');player.cd=20;}
  }
}
function updEnemies(){
  for(const e of enemies){
    e.think--;e.cd--;
    const moved=moveTank(e,e.dir);
    if(!moved||e.think<=0){
      let d=Math.floor(Math.random()*4);
      if(player&&Math.random()<0.5){
        d=Math.abs(player.x-e.x)>Math.abs(player.y-e.y)?(player.x>e.x?1:3):(player.y>e.y?2:0);
      }
      e.dir=d;e.think=25+Math.random()*45;
    }
    if(e.cd<=0){
      if(player&&Math.random()<0.6){
        e.dir=Math.abs(player.x-e.x)>Math.abs(player.y-e.y)?(player.x>e.x?1:3):(player.y>e.y?2:0);
      }else e.dir=Math.floor(Math.random()*4);
      fire(e,'e');e.cd=70+Math.random()*70;
    }
  }
}
function updSpawns(){
  if(queue<=0)return;
  spawnT--;
  if(spawnT>0||enemies.length>=3)return;
  spawnT=120;
  const pts=[[0,0],[7,0],[14,0],[0,6]];
  for(const p of pts){
    const px=p[0]*TS+2,py=p[1]*TS+2;
    if(!rectVsGrid(px,py)&&!tankOverlap(px,py,null)){
      enemies.push(mkEnemy(px,py));queue--;return;
    }
  }
}
function killPlayer(){
  boom(player.x+14,player.y+14,16,'#7fe08a');
  lives--;
  if(lives<=0){end(false,'你的坦克被跳弹海吞没了!');return;}
  player.inv=130;player.cd=40;
}
function end(win,msg){
  state=win?'win':'over';
  ov.children[0].textContent=win?'跳弹之王!':'游戏结束';
  ovP.innerHTML=msg+'<br>最终得分:'+score;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function hitTankAt(b,t){
  return Math.abs(b.x+3-(t.x+14))<16&&Math.abs(b.y+3-(t.y+14))<16;
}
function updBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let dead=false;
    b.life--;
    const nx=b.x+b.vx;
    if(nx<0||nx+6>cv.width||steelAt(nx+(b.vx>0?6:0),b.y+3)){b.vx=-b.vx;b.bounces++;boom(nx,b.y+3,2,'#cfd6ee');}
    else b.x=nx;
    const ny=b.y+b.vy;
    if(ny<0||ny+6>cv.height||steelAt(b.x+3,ny+(b.vy>0?6:0))){b.vy=-b.vy;b.bounces++;boom(b.x+3,ny,2,'#cfd6ee');}
    else b.y=ny;
    if(b.bounces>1||b.life<=0)dead=true;
    if(!dead){
      if(b.from==='e'){
        if(player&&hitTankAt(b,player)){
          if(b.bounces>0||player.inv<=0){dead=true;killPlayer();}
        }
        for(const e of enemies){
          if(e!==b.owner&&b.bounces>0&&hitTankAt(b,e)){
            dead=true;enemies.splice(enemies.indexOf(e),1);
            score+=150;boom(e.x+14,e.y+14,12,'#ffb050');break;
          }
        }
      }else{
        if(b.bounces>0&&hitTankAt(b,player)){dead=true;killPlayer();}
        if(!dead){
          for(const e of enemies){
            if(hitTankAt(b,e)){
              dead=true;enemies.splice(enemies.indexOf(e),1);
              score+=150;boom(e.x+14,e.y+14,12,'#ffb050');break;
            }
          }
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
function checkWave(){
  if(queue>0||enemies.length>0)return;
  if(wave>=3){end(true,'四波敌军全部弹落!');return;}
  wave++;score+=300;
  queue=4+wave;spawnT=80;
  banner='第 '+(wave+1)+' 波';bannerT=100;
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)parts.splice(i,1);}
  if(bannerT>0)bannerT--;
}
function updHud(){
  hA.textContent=lives;hB.textContent=(wave+1)+'/4';
  hC.textContent=enemies.length+queue;hD.textContent=score;
}
function draw(){
  ctx.fillStyle='#10142a';ctx.fillRect(0,0,cv.width,cv.height);
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    if(grid[ty][tx]!==2)continue;
    const X=tx*TS,Y=ty*TS;
    ctx.fillStyle='#6b7694';ctx.fillRect(X+1,Y+1,TS-2,TS-2);
    ctx.fillStyle='#9aa6c4';ctx.fillRect(X+5,Y+5,TS-10,TS-10);
    ctx.fillStyle='#c8d2ea';ctx.fillRect(X+8,Y+8,8,8);
  }
  const drawT=(t,c)=>{
    ctx.fillStyle='#171b2e';ctx.fillRect(t.x,t.y,28,28);
    ctx.fillStyle=c;ctx.fillRect(t.x+4,t.y+4,20,20);
    const cc=t.x+14;
    ctx.fillStyle='#12152a';
    if(t.dir===0)ctx.fillRect(cc-2,t.y,4,14);
    else if(t.dir===1)ctx.fillRect(cc,t.y+12,14,4);
    else if(t.dir===2)ctx.fillRect(cc-2,t.y+14,4,14);
    else ctx.fillRect(t.x,t.y+12,14,4);
    ctx.fillStyle=c;ctx.fillRect(t.x+9,t.y+9,10,10);
  };
  for(const e of enemies)drawT(e,'#c46a6a');
  if(player&&!(player.inv>0&&frame%6<3))drawT(player,'#5fbf68');
  for(const b of bullets){
    ctx.fillStyle=b.bounces>0?'#ff5a4a':'#ffe9a0';
    ctx.fillRect(b.x,b.y,6,6);
    if(b.bounces>0){ctx.strokeStyle='rgba(255,90,74,0.4)';ctx.strokeRect(b.x-1.5,b.y-1.5,9,9);}
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(p.life/p.max,0);
    ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(bannerT>0&&banner){
    ctx.globalAlpha=Math.min(bannerT/40,1);
    ctx.fillStyle='#ffd76a';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText(banner,cv.width/2,cv.height/2-10);
    ctx.globalAlpha=1;
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){
    frame++;
    updPlayer();updEnemies();updBullets();updSpawns();checkWave();updParts();updHud();
  }
  draw();
}
initGame();
loop();
</script>
</body>
</html>

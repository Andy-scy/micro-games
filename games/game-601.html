<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速算冲刺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#4ade80;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#4ade80;font-size:16px}
.timebar{height:8px;background:#0b0e1a;border-radius:6px;overflow:hidden;margin-bottom:12px}
.timebar i{display:block;height:100%;background:#4ade80;width:100%;transition:width .15s linear}
.q{text-align:center;font-size:42px;font-weight:800;letter-spacing:2px;min-height:56px;margin-bottom:6px;color:#e8eaf6}
.ans{text-align:center;font-size:26px;font-weight:700;color:#4ade80;background:#0b0e1a;border-radius:10px;padding:8px 0;min-height:46px;margin-bottom:12px;letter-spacing:4px}
.ans.bad{color:#f87171}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{background:#232949;color:#e8eaf6;border:none;border-radius:10px;padding:13px 0;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.kp button:active{transform:scale(.95)}
.kp .ok{background:#4ade80;color:#05230f}
.stage{position:relative}
.overlay{position:absolute;inset:-6px;background:rgba(8,10,22,.92);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>速算冲刺</h1>
  <p class="hint">60 秒内连续答题 · 键盘数字/回车或点按键盘 · 答错扣 3 秒并重置连对</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>时间 <b id="time">60</b>s</span>
    <span>连对 <b id="combo">0</b></span>
    <span>倍率 <b id="mult">x1</b></span>
  </div>
  <div class="timebar"><i id="tbar"></i></div>
  <div class="stage">
    <div class="q" id="q">7 + 5 = ?</div>
    <div class="ans" id="ans">&nbsp;</div>
    <div class="kp" id="kp">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">确认</button>
    </div>
    <div class="overlay" id="ov">
      <h2 id="ovT">速算冲刺</h2>
      <p id="ovD">口算加减速决战!连对越多倍率越高(每 5 连 +1,最高 x4),乘除法会在连对 3、6 次后解锁。答错扣 3 秒!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elScore=$("score"),elTime=$("time"),elCombo=$("combo"),elMult=$("mult");
var elQ=$("q"),elAns=$("ans"),elTbar=$("tbar");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo"),kp=$("kp");
var best=0;
try{best=parseInt(localStorage.getItem("mg601best")||"0",10)||0;}catch(e){best=0;}
var state="menu",score,combo,bestCombo,right,timeLeft,input,cur,lastT;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function gen(){
  var ops=["+","-"];
  if(combo>=3)ops.push("×");
  if(combo>=6)ops.push("÷");
  var op=ops[rnd(0,ops.length-1)];
  var hi=Math.min(9+combo,30),a,b,c;
  if(op==="+"){a=rnd(2,hi);b=rnd(2,hi);c=a+b;}
  else if(op==="-"){a=rnd(2,hi+5);b=rnd(2,a);c=a-b;}
  else if(op==="×"){a=rnd(2,Math.min(4+combo,12));b=rnd(2,Math.min(4+combo,12));c=a*b;}
  else{b=rnd(2,9);c=rnd(2,9);a=b*c;}
  cur={t:a+" "+op+" "+b+" = ?",a:c};
  elQ.textContent=cur.t;
}
function multOf(c){return Math.min(4,1+Math.floor(c/5));}
function updHud(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elMult.textContent="x"+multOf(combo);
}
function submit(){
  if(state!=="playing"||input==="")return;
  var v=parseInt(input,10);
  if(v===cur.a){
    combo++;bestCombo=Math.max(bestCombo,combo);right++;
    score+=10*multOf(combo);
    input="";elAns.innerHTML="&nbsp;";elAns.classList.remove("bad");
    gen();updHud();
  }else{
    combo=0;timeLeft=Math.max(0.1,timeLeft-3);
    elAns.classList.add("bad");
    input="";elAns.innerHTML="&nbsp;";
    updHud();
  }
}
function press(k){
  if(state!=="playing")return;
  if(k==="del")input=input.slice(0,-1);
  else if(k==="ok")submit();
  else if(input.length<4)input+=k;
  if(input==="")elAns.innerHTML="&nbsp;";else elAns.textContent=input;
  var m;
  if(input!==""){
    m=parseInt(input,10);
    if(m===cur.a)submit();
  }
}
function gameOver(){
  state="over";
  if(score>best){best=score;try{localStorage.setItem("mg601best",String(best));}catch(e){}}
  ovT.textContent="时间到!";
  ovD.textContent="答对 "+right+" 题 · 最高连对 "+bestCombo;
  ovS.style.display="block";
  ovS.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  score=0;combo=0;bestCombo=0;right=0;timeLeft=60;input="";lastT=0;
  elAns.innerHTML="&nbsp;";elAns.classList.remove("bad");
  gen();updHud();
  state="playing";
  ov.classList.add("hide");
}
kp.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute("data-k"))press(t.getAttribute("data-k"));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
    return;
  }
  if(e.key>="0"&&e.key<="9"){press(e.key);e.preventDefault();}
  else if(e.key==="Backspace"){press("del");e.preventDefault();}
  else if(e.key==="Enter"){press("ok");e.preventDefault();}
});
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(100,t-lastT);lastT=t;
  if(state==="playing"){
    timeLeft-=dt/1000;
    if(timeLeft<=0){timeLeft=0;gameOver();}
    elTime.textContent=Math.ceil(timeLeft);
    elTbar.style.width=(timeLeft/60*100)+"%";
    elTbar.style.background=timeLeft<10?"#f87171":"#4ade80";
  }
}
elTbar.style.width="100%";
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰原漂移</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1220;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;gap:8px}
h1{font-size:20px;letter-spacing:2px;color:#ffd76a}
#hud{display:flex;gap:14px;font-size:14px;background:#181d33;border:1px solid #2a3155;border-radius:10px;padding:6px 14px;flex-wrap:wrap;justify-content:center}
#hud b{color:#7fe08a}
#stage{position:relative}
canvas{display:block;background:#16204a;border:1px solid #2a3155;border-radius:12px;max-width:96vw;height:auto}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:12px;padding:14px}
#ov h2{font-size:24px;color:#ffd76a}
#ov p{font-size:13px;color:#aab3d8;line-height:1.8;max-width:430px}
.btn{background:#ffd76a;color:#1a1c2e;border:none;border-radius:10px;padding:10px 28px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
#pad{display:none;gap:24px;margin-top:8px;user-select:none;-webkit-user-select:none;align-items:center}
#dpad{display:grid;grid-template-areas:". u ." "l d r";gap:6px}
.pbtn{width:54px;height:54px;border-radius:14px;background:#232a4d;border:1px solid #3a4373;color:#e8ecff;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none}
.pbtn.fire{width:84px;height:84px;border-radius:50%;font-size:16px;font-weight:700;background:#5a2a2a;border-color:#8a4444}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<h1>冰原漂移</h1>
<div id="hud"><span>生命 <b id="hA">3</b></span><span>波次 <b id="hB">1/3</b></span><span>残敌 <b id="hC">0</b></span><span>分数 <b id="hD">0</b></span></div>
<div id="stage">
<canvas id="cv" width="480" height="416"></canvas>
<div id="ov">
  <h2>冰原漂移</h2>
  <p id="ovP">整片冰面极度湿滑:A/D 转向,W 加速,S 刹车,空格开火。<br>惯性会带你漂移,撞墙会弹开,小心失控!<br>击毁每波所有敌坦,共 3 波;相撞双方都会掉头。</p>
  <button class="btn" id="ovB">开始游戏</button>
</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="pbtn" data-k="KeyA" style="grid-area:l">↺</div>
    <div class="pbtn" data-k="KeyW" style="grid-area:u">↑</div>
    <div class="pbtn" data-k="KeyS" style="grid-area:d">↓</div>
    <div class="pbtn" data-k="KeyD" style="grid-area:r">↻</div>
  </div>
  <div class="pbtn fire" data-k="Space">开火</div>
</div>
<script>
"use strict";
const TS=32,COLS=15,ROWS=13;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),ovP=document.getElementById('ovP'),ovB=document.getElementById('ovB');
const hA=document.getElementById('hA'),hB=document.getElementById('hB'),hC=document.getElementById('hC'),hD=document.getElementById('hD');
let grid,score,hp,wave,queue,enemies,bullets,parts,player,spawnT,frame=0,state='start',banner,bannerT;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.pbtn').forEach(b=>{
  const k=b.getAttribute('data-k');
  const dn=e=>{e.preventDefault();keys[k]=true;};
  const up=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
function buildGrid(){
  const g=[];
  for(let y=0;y<ROWS;y++){const r=[];for(let x=0;x<COLS;x++)r.push(0);g.push(r);}
  g[2][2]=2;g[2][12]=2;g[10][2]=2;g[10][12]=2;
  g[6][7]=2;
  g[4][5]=2;g[8][9]=2;g[4][9]=2;g[8][5]=2;
  return g;
}
function mkTank(x,y,ang,kind){
  return {x:x,y:y,vx:0,vy:0,ang:ang,kind:kind,cd:60,hp:2};
}
function circleHit(x,y,r){
  if(x-r<0||y-r<0||x+r>cv.width||y+r>cv.height)return true;
  const x0=Math.floor((x-r)/TS),y0=Math.floor((y-r)/TS),x1=Math.floor((x+r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return true;
    if(grid[ty][tx]===2)return true;
  }
  return false;
}
function physStep(t,accel){
  t.vx+=accel[0];t.vy+=accel[1];
  t.vx*=0.985;t.vy*=0.985;
  const sp=Math.hypot(t.vx,t.vy);
  if(sp>4.2){t.vx=t.vx/sp*4.2;t.vy=t.vy/sp*4.2;}
  const nx=t.x+t.vx,ny=t.y+t.vy;
  if(!circleHit(nx,t.y,13))t.x=nx;else{t.vx=-t.vx*0.55;}
  if(!circleHit(t.x,ny,13))t.y=ny;else{t.vy=-t.vy*0.55;}
}
function fire(t,from){
  bullets.push({x:t.x+Math.cos(t.ang)*19,y:t.y+Math.sin(t.ang)*19,vx:Math.cos(t.ang)*5.5,vy:Math.sin(t.ang)*5.5,from:from,life:130});
}
function boom(x,y,n,c){for(let i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20+Math.random()*14,max:34,c:c||'#ffb050'});}
function floatTxt(x,y,txt){parts.push({x:x,y:y,vx:0,vy:-0.7,life:36,max:36,c:'#ffd76a',txt:txt});}
function initGame(){
  grid=buildGrid();score=0;hp=3;wave=0;enemies=[];bullets=[];parts=[];
  banner='第 1 波';bannerT=90;spawnT=30;queue=3;
  player=mkTank(7*TS,11*TS,-Math.PI/2,'p');
}
function startGame(){initGame();state='play';ov.style.display='none';}
ovB.addEventListener('click',startGame);
function updPlayer(){
  let acc=[0,0];
  if(keys.KeyA||keys.ArrowLeft)player.ang-=0.06;
  if(keys.KeyD||keys.ArrowRight)player.ang+=0.06;
  if(keys.KeyW||keys.ArrowUp){acc[0]+=Math.cos(player.ang)*0.13;acc[1]+=Math.sin(player.ang)*0.13;}
  if(keys.KeyS||keys.ArrowDown){player.vx*=0.9;player.vy*=0.9;}
  physStep(player,acc);
  if(player.inv>0)player.inv--;
  player.cd--;
  if((keys.Space||keys.KeyJ)&&player.cd<=0){
    let n=0;for(const b of bullets)if(b.from==='p')n++;
    if(n<2){fire(player,'p');player.cd=20;}
  }
}
function updEnemies(){
  for(const e of enemies){
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    const ta=Math.atan2(dy,dx);
    let da=ta-e.ang;
    while(da>Math.PI)da-=Math.PI*2;
    while(da<-Math.PI)da+=Math.PI*2;
    e.ang+=Math.max(-0.05,Math.min(0.05,da));
    const acc=d>140?[Math.cos(e.ang)*0.1,Math.sin(e.ang)*0.1]:[-Math.cos(e.ang)*0.06,-Math.sin(e.ang)*0.06];
    physStep(e,acc);
    e.cd--;
    if(e.cd<=0&&d<300){
      fire(e,'e');e.cd=90+Math.random()*70;
    }
  }
}
function collideTanks(){
  const all=enemies.slice();
  if(player)all.push(player);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>0.01&&d<26){
      const nx=dx/d,ny=dy/d,ov=(26-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){
        a.vx+=vn*nx*0.5;a.vy+=vn*ny*0.5;
        b.vx-=vn*nx*0.5;b.vy-=vn*ny*0.5;
      }
      if(a.kind==='p'&&a.inv<=0&&Math.hypot(a.vx-b.vx,a.vy-b.vy)>1.4)hurtPlayer();
      if(b.kind==='p'&&b.inv<=0&&Math.hypot(a.vx-b.vx,a.vy-b.vy)>1.4)hurtPlayer();
    }
  }
}
function hurtPlayer(){
  boom(player.x,player.y,12,'#7fe08a');
  hp--;
  if(hp<=0){end(false,'座车在冰原上失控损毁!');return;}
  player.inv=140;
}
function updBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];let dead=false;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<0||b.y<0||b.x>cv.width||b.y>cv.height)dead=true;
    if(!dead){
      const tx=Math.floor(b.x/TS),ty=Math.floor(b.y/TS);
      if(grid[ty][tx]===2){dead=true;boom(b.x,b.y,3,'#cfd6ee');}
    }
    if(!dead){
      if(b.from==='e'){
        if(player.inv<=0&&Math.hypot(b.x-player.x,b.y-player.y)<15){dead=true;hurtPlayer();}
      }else{
        for(const e of enemies){
          if(Math.hypot(b.x-e.x,b.y-e.y)<15){
            dead=true;e.hp--;
            if(e.hp<=0){
              enemies.splice(enemies.indexOf(e),1);
              score+=150;floatTxt(e.x,e.y,'+150');
              boom(e.x,e.y,14,'#ffb050');
            }else boom(b.x,b.y,4,'#ffb050');
            break;
          }
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
function updSpawns(){
  if(queue<=0)return;
  spawnT--;
  if(spawnT>0)return;
  spawnT=100;
  const px=1.5*TS+Math.random()*(cv.width-3*TS),py=1.5*TS+Math.random()*3*TS;
  if(Math.hypot(px-player.x,py-player.y)>180){
    enemies.push(mkTank(px,py,Math.PI/2,'e'));queue--;
  }
}
function checkWave(){
  if(queue>0||enemies.length>0)return;
  if(wave>=2){end(true,'冰原反攻大获全胜!');return;}
  wave++;score+=300;queue=4+wave;spawnT=70;
  banner='第 '+(wave+1)+' 波';bannerT=100;
}
function end(win,msg){
  state=win?'win':'over';
  ov.children[0].textContent=win?'凯旋!':'游戏结束';
  ovP.innerHTML=msg+'<br>最终得分:'+score;
  ovB.textContent='再来一局';
  ov.style.display='flex';
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)parts.splice(i,1);
  }
  if(bannerT>0)bannerT--;
}
function updHud(){
  hA.textContent=hp;hB.textContent=(wave+1)+'/3';
  hC.textContent=enemies.length+queue;hD.textContent=score;
}
function drawTile(t,X,Y){
  if(t===2){
    ctx.fillStyle='#5d688c';ctx.fillRect(X+1,Y+1,TS-2,TS-2);
    ctx.fillStyle='#8894bb';ctx.fillRect(X+5,Y+5,TS-10,TS-10);
  }
}
function drawTank(t,c){
  if(t.kind==='p'&&t.inv>0&&frame%6<3)return;
  ctx.save();
  ctx.translate(t.x,t.y);
  ctx.rotate(t.ang);
  ctx.fillStyle='rgba(20,24,48,0.85)';ctx.fillRect(-13,-13,26,26);
  ctx.fillStyle=c;ctx.fillRect(-9,-9,18,18);
  ctx.fillStyle='#0e1122';ctx.fillRect(4,-2,15,4);
  ctx.fillStyle=c;ctx.fillRect(-4,-4,8,8);
  ctx.restore();
  if(t.hp<2&&t.kind==='e'){
    ctx.fillStyle='#e05555';ctx.fillRect(t.x-10,t.y-18,20*t.hp/2,3);
  }
}
function draw(){
  ctx.fillStyle='#16204a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(190,220,255,0.08)';
  ctx.lineWidth=1;
  for(let x=0;x<cv.width;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke();}
  for(let y=0;y<cv.height;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++)drawTile(grid[ty][tx],tx*TS,ty*TS);
  for(const e of enemies)drawTank(e,'#c46a6a');
  if(player)drawTank(player,'#5fbf68');
  for(const b of bullets){ctx.fillStyle=b.from==='p'?'#ffe9a0':'#ff9d6a';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();}
  for(const p of parts){
    if(p.txt){
      ctx.globalAlpha=Math.min(p.life/20,1);
      ctx.fillStyle=p.c;ctx.font='bold 13px system-ui';ctx.textAlign='center';
      ctx.fillText(p.txt,p.x,p.y);
    }else{
      ctx.globalAlpha=Math.max(p.life/p.max,0);
      ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);
    }
  }
  ctx.globalAlpha=1;
  if(bannerT>0&&banner){
    ctx.globalAlpha=Math.min(bannerT/40,1);
    ctx.fillStyle='#ffd76a';ctx.font='bold 26px system-ui';ctx.textAlign='center';
    ctx.fillText(banner,cv.width/2,cv.height/2-10);
    ctx.globalAlpha=1;
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(state==='play'){
    frame++;
    updPlayer();updEnemies();collideTanks();updBullets();updSpawns();checkWave();updParts();updHud();
  }
  draw();
}
initGame();
loop();
</script>
</body>
</html>

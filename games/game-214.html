<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双人对擂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#7dd3fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#101826;border-radius:10px;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#7dd3fc}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#7dd3fc;color:#082136;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>双人对擂</h1>
  <p class="hint">蓝方 Q W A S · 粉方 U I J K · 也可直接点各自半场</p>
  <div class="hud">
    <span style="color:#7dd3fc">蓝方 <b id="p1" style="color:#7dd3fc">0</b></span>
    <span>时间 <b id="time" style="color:#7dd3fc">60</b> 秒</span>
    <span style="color:#f9a8d4">粉方 <b id="p2" style="color:#f9a8d4">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">双人对擂</h2>
      <p id="ovDesc">同屏双人对抗!蓝方用 Q W A S 敲左半场四个洞,粉方用 U I J K 敲右半场,手机党也可以直接点自己的半场。敲中自家地鼠 +10,越界偷打对方地鼠 -5。60 秒后分高者胜!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=480;
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elP1=$("p1"),elP2=$("p2"),elTime=$("time");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var GAME_LEN=60;
var state="menu",p1=0,p2=0,timeLeft=GAME_LEN,spawnT=300;
var holes=[],moles=[],floats=[],rings=[];
var lastT=0;
var KEYMAP={q:0,w:1,a:2,s:3,u:4,i:5,j:6,k:7};

function initHoles(){
  holes=[
    {x:85,y:205,zone:0},{x:185,y:205,zone:0},
    {x:85,y:330,zone:0},{x:185,y:330,zone:0},
    {x:295,y:205,zone:1},{x:395,y:205,zone:1},
    {x:295,y:330,zone:1},{x:395,y:330,zone:1}
  ];
}
initHoles();

function freeHole(zone){
  var used={},i,cand=[];
  for(i=0;i<moles.length;i++)used[moles[i].hole]=1;
  for(i=0;i<holes.length;i++)if(holes[i].zone===zone&&!used[i])cand.push(i);
  if(!cand.length)return -1;
  return cand[(Math.random()*cand.length)|0];
}
function spawnMole(){
  var zone=Math.random()<0.5?0:1;
  var h=freeHole(zone);
  if(h<0)return;
  moles.push({hole:h,state:"rise",frac:0,t:0,upMs:900+Math.random()*300,zone:zone});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,t:0});}
function addRing(x,y,r,c){rings.push({x:x,y:y,r:r,c:c,t:0});}

function reset(){
  moles=[];floats=[];rings=[];
  p1=0;p2=0;timeLeft=GAME_LEN;spawnT=300;
  updateHud();
}
function startGame(){
  reset();
  state="playing";
  ov.classList.add("hide");
}
function endGame(){
  state="over";
  var msg;
  if(p1>p2)msg="本局蓝方获胜!";
  else if(p2>p1)msg="本局粉方获胜!";
  else msg="势均力敌,平局!";
  ovTitle.textContent=msg;
  ovDesc.textContent="蓝方 "+p1+" 分 · 粉方 "+p2+" 分";
  ovScore.style.display="none";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function updateHud(){
  elP1.textContent=p1;
  elP2.textContent=p2;
  elTime.textContent=Math.ceil(timeLeft);
}

function update(dt){
  timeLeft-=dt/1000;
  if(timeLeft<=0){timeLeft=0;endGame();return;}
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=260+Math.random()*260;
    spawnMole();
    if(Math.random()<0.4)spawnMole();
  }
  var i,m;
  for(i=moles.length-1;i>=0;i--){
    m=moles[i];m.t+=dt;
    if(m.state==="rise"){
      m.frac=Math.min(1,m.t/120);
      if(m.frac>=1){m.state="up";m.t=0;}
    }else if(m.state==="up"){
      if(m.t>=m.upMs){m.state="down";m.t=0;}
    }else if(m.state==="down"){
      m.frac=1-Math.min(1,m.t/140);
      if(m.frac<=0)moles.splice(i,1);
    }
  }
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>800)floats.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>300)rings.splice(i,1);}
}

function hitHole(idx,byZone){
  if(state!=="playing")return;
  var i,m;
  for(i=0;i<moles.length;i++){
    m=moles[i];
    if(m.hole===idx&&m.state!=="down"&&m.frac>0.3){
      var h=holes[idx];
      var hx=h.x,hy=h.y-34*m.frac;
      if(m.zone===byZone){
        moles.splice(i,1);
        if(byZone===0){p1+=10;addFloat(hx,hy-46,"+10","#7dd3fc");}
        else{p2+=10;addFloat(hx,hy-46,"+10","#f9a8d4");}
        addRing(hx,hy,48,byZone===0?"rgba(125,211,252,0.85)":"rgba(249,168,212,0.85)");
      }else{
        moles.splice(i,1);
        if(byZone===0){p1=Math.max(0,p1-5);addFloat(hx,hy-46,"越界 -5","#f87171");}
        else{p2=Math.max(0,p2-5);addFloat(hx,hy-46,"越界 -5","#f87171");}
        addRing(hx,hy,42,"rgba(248,113,113,0.8)");
      }
      updateHud();
      return;
    }
  }
}

function whack(p){
  if(state!=="playing")return;
  var i;
  for(i=0;i<holes.length;i++){
    var h=holes[i];
    var dx=p.x-h.x,dy=p.y-(h.y-30);
    if(dx*dx+dy*dy<56*56){hitHole(i,h.zone);return;}
  }
}

function drawMoleAt(h,frac,zone){
  var bh=72,base=h.y+9,cy=base-bh*frac;
  ctx.save();
  ctx.beginPath();ctx.rect(h.x-62,h.y-160,124,170);ctx.clip();
  ctx.fillStyle=zone===0?"#3b6ea5":"#a53b6e";
  ctx.beginPath();ctx.ellipse(h.x,cy,30,bh/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#14100a";
  ctx.beginPath();ctx.arc(h.x-10,cy-7,3.2,0,Math.PI*2);ctx.arc(h.x+10,cy-7,3.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f472b6";
  ctx.beginPath();ctx.ellipse(h.x,cy+4,5,3.6,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHoleBack(h){
  ctx.fillStyle="#08101c";
  ctx.beginPath();ctx.ellipse(h.x,h.y,44,16,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=h.zone===0?"#2a4a6e":"#6e2a4a";
  ctx.lineWidth=4;ctx.stroke();
}
function drawHoleFront(h){
  ctx.fillStyle="#08101c";
  ctx.beginPath();ctx.ellipse(h.x,h.y,44,16,0,0,Math.PI);ctx.fill();
}

function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#13203a");g.addColorStop(1,"#0b1220");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(125,211,252,0.05)";ctx.fillRect(0,30,W/2,H-30);
  ctx.fillStyle="rgba(249,168,212,0.05)";ctx.fillRect(W/2,30,W/2,H-30);
  ctx.strokeStyle="rgba(232,234,246,0.25)";
  ctx.lineWidth=2;
  ctx.setLineDash([8,8]);
  ctx.beginPath();ctx.moveTo(W/2,34);ctx.lineTo(W/2,H-8);ctx.stroke();
  ctx.setLineDash([]);
  var i;
  for(i=0;i<holes.length;i++)drawHoleBack(holes[i]);
  for(i=0;i<moles.length;i++){
    var m=moles[i];
    if(m.frac>0.02)drawMoleAt(holes[m.hole],m.frac,m.zone);
  }
  for(i=0;i<holes.length;i++)drawHoleFront(holes[i]);
  for(i=0;i<rings.length;i++){
    var r=rings[i],k=r.t/300;
    ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r*(0.4+k),0,Math.PI*2);ctx.stroke();
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<floats.length;i++){
    var f=floats[i],fk=f.t/800;
    ctx.globalAlpha=1-fk;
    ctx.font="bold 18px sans-serif";
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y-32*fk);
    ctx.globalAlpha=1;
  }
  ctx.font="bold 16px sans-serif";
  ctx.fillStyle="#7dd3fc";
  ctx.fillText("Q W / A S",135,80);
  ctx.fillStyle="#f9a8d4";
  ctx.fillText("U I / J K",345,80);
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,W,26);
  ctx.fillStyle="#7dd3fc";ctx.fillRect(0,0,W*timeLeft/GAME_LEN,26);
  ctx.font="bold 14px sans-serif";ctx.textAlign="center";
  ctx.fillStyle="#0f1220";
  ctx.fillText("双人对擂 · 剩余 "+Math.ceil(timeLeft)+" 秒",W/2,14);
}

function ptFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var cx,cy;
  if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
cv.addEventListener("mousedown",function(e){e.preventDefault();whack(ptFromEvent(e));});
cv.addEventListener("touchstart",function(e){e.preventDefault();whack(ptFromEvent(e));},{passive:false});
btnGo.addEventListener("click",startGame);
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key.toLowerCase();
  if(Object.prototype.hasOwnProperty.call(KEYMAP,k)){
    e.preventDefault();
    var idx=KEYMAP[k];
    hitHole(idx,holes[idx].zone);
  }
});

function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

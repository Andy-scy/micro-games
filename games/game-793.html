<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观潮而钓</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1220;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;user-select:none}
h1{font-size:21px;color:#7fd4ff;margin:2px 0}
.tip{font-size:13px;color:#9aa3b5;text-align:center;max-width:520px;line-height:1.6;margin-bottom:6px}
#hud{display:flex;gap:16px;font-size:15px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#hud b{color:#ffd75e}
canvas{border-radius:14px;max-width:96vw;touch-action:none;display:block}
#ov{position:fixed;inset:0;background:rgba(6,8,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:9}
#ov h2{font-size:26px;color:#ffd75e}
#ov p{color:#c8cfdd;font-size:15px;max-width:380px;line-height:1.8}
#ov button{background:linear-gradient(180deg,#5db8ff,#2f8fe0);color:#04101f;border:0;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<h1>观潮而钓</h1>
<p class="tip">潮水每 24 秒涨落一轮,表层鱼层跟着水面起伏!上下移动鱼钩(方向键/W S 或拖动),贴住鱼层鱼才咬钩;钩落湖底泥里会挂底。75 秒 400 分!</p>
<div id="hud"><span>得分 <b id="s1">0</b></span><span>时间 <b id="s2">75</b> 秒</span><span>目标 <b>400</b> 分</span></div>
<canvas id="cv" width="480" height="560"></canvas>
<div id="ov"><h2 id="ot">观潮而钓</h2><p id="op">潮涨鱼上浮,潮落鱼下沉。<br>表层 40 分 / 中层 80 分 / 底层 130 分,<br>把钩稳稳贴在鱼层里,坐等连竿!</p><button id="ob">临潮下竿</button></div>
<script>
(function(){
var cv=document.getElementById('cv'),X=cv.getContext('2d');
var ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),ob=document.getElementById('ob');
var eS=document.getElementById('s1'),eT=document.getElementById('s2');
var W=cv.width,H=cv.height,BED=500;
var state='ready',tl=75,score=0,msg='';
var simT=0,hy=300,ty=300,stuck=false,biteT=0,needT=1.4,pops=[],vals=[40,80,130],names=['表层','中层','底层'];
var fish=[],keys={};
function rnd(a,b){return a+Math.random()*(b-a)}
function waterY(){return 150+62*Math.sin(simT*Math.PI*2/24)}
function bandY(i){return i===0?waterY()+45:(i===1?310:452)}
function resetFish(){
  fish=[];
  var i;
  for(i=0;i<3;i++)fish.push({x:rnd(60,W-60),vx:(Math.random()<0.5?-1:1)*rnd(55,105),band:i});
}
function finish(win){
  state='over';ob.textContent='再钓一场潮';
  ot.textContent=win?'潮汐在握!':'空军一场…';
  op.innerHTML='本次得分 <b style="color:#ffd75e">'+score+'</b> / 目标 400 分<br>'+(win?'潮起潮落,尽在竿下!':'鱼层随潮而动,钩也要随潮而走。');
  ov.classList.remove('hide');
}
function start(){
  tl=75;score=0;msg='';simT=0;hy=300;ty=300;stuck=false;biteT=0;needT=1.4;pops=[];keys={};
  resetFish();
  state='play';ov.classList.add('hide');
}
function update(dt){
  var i;
  for(i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>0.8)pops.splice(i,1)}
  if(state!=='play')return;
  simT+=dt;
  tl-=dt;if(tl<=0){tl=0;finish(score>=400);return}
  var mv=0;
  if(keys.up)mv-=1;if(keys.down)mv+=1;
  if(mv!==0)ty=Math.max(130,Math.min(490,ty+mv*185*dt));
  hy+=(ty-hy)*Math.min(1,dt*8);
  if(hy>470)stuck=true;
  if(stuck&&hy<455)stuck=false;
  for(i=0;i<3;i++){
    var f=fish[i];
    f.x+=f.vx*dt;
    if(f.x<24||f.x>W-24)f.vx*=-1;
    f.x=Math.max(24,Math.min(W-24,f.x));
  }
  if(stuck){msg='挂底了!快往上移!';biteT=Math.max(0,biteT-dt);return}
  var bi=-1,bd=26;
  for(i=0;i<3;i++){
    var d=Math.abs(hy-bandY(i));
    if(d<bd){bd=d;bi=i}
  }
  if(bi>=0){
    biteT+=dt;
    msg='鱼在咬'+names[bi]+'的钩…稳住!';
    if(biteT>=needT){
      var v=vals[bi];
      score+=v;
      pops.push({x:fish[bi].x,y:bandY(bi),txt:'+'+v,t:0});
      fish[bi].x=fish[bi].vx>0?-30:W+30;
      biteT=0;needT=rnd(1.1,1.8);
      msg='上鱼!+'+v+' 分';
    }
  }else{
    biteT=Math.max(0,biteT-2*dt);
    msg=hy<waterY()?'钩在水面上,往下沉…':'移动鱼钩贴住鱼层';
  }
}
function draw(){
  var wy=waterY();
  var g=X.createLinearGradient(0,0,0,wy);g.addColorStop(0,'#151c36');g.addColorStop(1,'#2b3157');
  X.fillStyle=g;X.fillRect(0,0,W,wy);
  var g2=X.createLinearGradient(0,wy,0,BED);g2.addColorStop(0,'#1a4472');g2.addColorStop(1,'#0a1c34');
  X.fillStyle=g2;X.fillRect(0,wy,W,BED-wy);
  X.fillStyle='#2a2317';X.fillRect(0,BED,W,H-BED);
  X.fillStyle='rgba(200,180,120,.25)';
  X.fillRect(0,BED,W,6);
  var t=Date.now()*0.001,i,xx,yy;
  X.strokeStyle='rgba(127,212,255,.20)';X.lineWidth=2;
  X.beginPath();for(xx=0;xx<=W;xx+=16){yy=wy+Math.sin(xx*0.06+t*2.5)*4;if(xx===0)X.moveTo(xx,yy);else X.lineTo(xx,yy)}X.stroke();
  var rise=Math.cos(simT*Math.PI*2/24)>0;
  for(i=0;i<3;i++){
    var f=fish[i],by2=bandY(i);
    X.fillStyle=i===0?'rgba(160,220,255,.75)':(i===1?'rgba(140,190,240,.7)':'rgba(120,160,215,.65)');
    X.beginPath();X.ellipse(f.x,by2,16,7,0,0,7);X.fill();
    X.beginPath();X.moveTo(f.x+(f.vx>0?13:-13),by2);X.lineTo(f.x+(f.vx>0?23:-23),by2-6);X.lineTo(f.x+(f.vx>0?23:-23),by2+6);X.closePath();X.fill();
    X.fillStyle='rgba(200,215,235,.6)';X.font='11px system-ui';X.textAlign='center';
    X.fillText(names[i]+vals[i],f.x,by2-12);
  }
  X.strokeStyle='rgba(230,238,246,.75)';X.lineWidth=1.6;
  X.beginPath();X.moveTo(60,wy-6);X.lineTo(60,hy);X.stroke();
  X.fillStyle='#ff5f5f';X.beginPath();X.arc(60,wy-6,6,0,7);X.fill();
  X.beginPath();X.arc(60,hy+8,6,Math.PI*1.1,Math.PI*1.9);X.stroke();
  if(stuck){X.fillStyle='#e05555';X.beginPath();X.arc(60,hy+10,9,0,7);X.stroke()}
  for(i=0;i<pops.length;i++){
    var p=pops[i];
    X.globalAlpha=1-p.t/0.8;
    X.fillStyle='#ffd75e';X.font='bold 16px system-ui';X.textAlign='center';
    X.fillText(p.txt,p.x,p.y-20-p.t*30);
    X.globalAlpha=1;
  }
  X.strokeStyle='rgba(127,212,255,.5)';X.lineWidth=2;
  X.beginPath();X.moveTo(446,88);X.lineTo(446,212);X.stroke();
  X.fillStyle='#ffd75e';
  X.beginPath();X.arc(446,wy,5,0,7);X.fill();
  X.fillStyle='rgba(200,215,235,.8)';X.font='11px system-ui';X.textAlign='center';
  X.fillText('高潮',446,80);
  X.fillText('低潮',446,228);
  X.fillStyle=rise?'#7fe0a0':'#7fb2d9';X.font='bold 14px system-ui';
  X.fillText(rise?'涨潮 ↑':'退潮 ↓',446,252);
  X.fillStyle='#ffe9a3';X.font='bold 15px system-ui';X.textAlign='center';X.fillText(msg,W/2,H-40);
  X.fillStyle='rgba(154,163,181,.85)';X.font='12px system-ui';
  X.fillText('↑↓ / W S / 拖动 调整钩深',W/2,H-14);
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'||e.key==='w'){keys.up=true;e.preventDefault()}
  if(e.key==='ArrowDown'||e.key==='s'){keys.down=true;e.preventDefault()}
  if((e.key===' '||e.key==='Enter')&&state!=='play'){e.preventDefault();start()}
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowUp'||e.key==='w')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
});
function setTy(e){
  var r=cv.getBoundingClientRect();
  var my=(e.clientY-r.top)*(H/r.height);
  ty=Math.max(130,Math.min(490,my));
}
cv.addEventListener('pointerdown',function(e){if(state==='play')setTy(e)});
cv.addEventListener('pointermove',function(e){if(state==='play'&&e.buttons)setTy(e)});
ob.addEventListener('click',start);
var last=0;
function loop(ts){
  var dt=(ts-last)/1000;last=ts;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  eS.textContent=score;eT.textContent=Math.ceil(tl);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

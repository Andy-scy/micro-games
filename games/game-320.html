<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星夜拼图</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--ink:#eef1ff;--dim:#9aa3c7;--acc:#63b3ed;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;}
.wrap{width:100%;max-width:430px;text-align:center;}
h1{font-size:22px;letter-spacing:3px;margin-bottom:6px;}
.tip{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:10px;}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;color:var(--dim);}
.bar b{color:var(--acc);font-size:15px;}
.btn{background:var(--acc);border:none;border-radius:8px;color:#082032;font-family:inherit;font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;}
.btn.ghost{background:#2a3154;color:var(--ink);}
.frame{position:relative;width:100%;padding-top:100%;}
.board{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--card);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 1px #2c3560;touch-action:none;}
.board.ready .tile{transition:left .13s ease,top .13s ease;}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:0 3px 8px rgba(0,0,0,.35);}
.tile.pic canvas{width:100%;height:100%;display:block;border-radius:8px;}
.badge{position:absolute;top:4%;right:6%;font-size:0.4em;line-height:1.4;background:rgba(9,12,26,.78);color:#cfe3ff;border-radius:6px;padding:1px 7px;display:none;font-weight:700;}
.board.num .badge{display:block;}
.foot{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px;}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(7,9,20,.8);display:none;align-items:center;justify-content:center;z-index:20;}
.overlay.show{display:flex;}
.panel{background:var(--card);border:1px solid #2c3560;border-radius:16px;padding:28px 32px;text-align:center;max-width:86vw;box-shadow:0 16px 50px rgba(0,0,0,.55);}
.panel h2{color:var(--acc);font-size:24px;letter-spacing:2px;margin-bottom:10px;}
.panel p{color:var(--dim);font-size:14px;line-height:1.9;margin-bottom:18px;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <h1>星夜拼图</h1>
  <p class="tip">图画版滑块:一幅随机生成的星夜图被切成十六块,把碎片滑回原位,让星空重圆;拿不准就打开编号提示。</p>
  <div class="bar">
    <span>步数 <b id="stMoves">0</b></span>
    <span>用时 <b id="stTime">0:00</b></span>
    <span>归位 <b id="stFit">0/15</b></span>
    <button class="btn ghost" id="numBtn">编号:开</button>
    <button class="btn ghost" id="resetBtn">重开</button>
  </div>
  <div class="frame"><div class="board num" id="board"></div></div>
  <p class="foot">点击空格旁的碎片滑入空位,方向键或触屏滑动同样有效;每局的星空都是独一无二的。</p>
</div>
<div class="overlay" id="overlay"><div class="panel">
  <h2 id="ovTitle"></h2>
  <p id="ovInfo"></p>
  <button class="btn" id="againBtn">再来一局</button>
</div></div>
<script>
(function(){
'use strict';
const N=4,TOTAL=N*N,K=120;
const goal=[];for(let i=0;i<TOTAL;i++)goal.push((i+1)%TOTAL);
const scene=document.createElement('canvas');scene.width=480;scene.height=480;
let tiles=goal.slice(),els=[],moves=0,playing=false,startAt=0;
const boardEl=document.getElementById('board');
const movesEl=document.getElementById('stMoves'),timeEl=document.getElementById('stTime'),fitEl=document.getElementById('stFit'),numBtn=document.getElementById('numBtn');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovInfo=document.getElementById('ovInfo');
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s;}
function mountain(g,base,amp,color){
  g.fillStyle=color;g.beginPath();g.moveTo(0,480);g.lineTo(0,base);
  for(let x=48;x<=480;x+=48)g.lineTo(x,base-Math.random()*amp);
  g.lineTo(480,480);g.closePath();g.fill();
}
function drawScene(){
  const g=scene.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,480);
  sky.addColorStop(0,'#0b1026');sky.addColorStop(0.55,'#1b2a52');sky.addColorStop(1,'#33427a');
  g.fillStyle=sky;g.fillRect(0,0,480,480);
  for(let i=0;i<110;i++){
    g.globalAlpha=0.2+Math.random()*0.8;
    g.fillStyle='#ffffff';
    g.beginPath();g.arc(Math.random()*480,Math.random()*320,0.4+Math.random()*1.5,0,Math.PI*2);g.fill();
  }
  g.globalAlpha=1;
  const glow=g.createRadialGradient(352,104,12,352,104,110);
  glow.addColorStop(0,'rgba(255,241,200,0.85)');glow.addColorStop(1,'rgba(255,241,200,0)');
  g.fillStyle=glow;g.fillRect(232,0,240,224);
  g.fillStyle='#fdf3ce';g.beginPath();g.arc(352,104,36,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(196,186,150,0.5)';
  g.beginPath();g.arc(340,94,7,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(364,116,10,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(358,88,4,0,Math.PI*2);g.fill();
  mountain(g,372,120,'#1b2450');
  mountain(g,414,86,'#101533');
}
function buildTiles(){
  boardEl.innerHTML='';boardEl.classList.remove('ready');els=[];
  const s=480/N;
  for(let v=1;v<TOTAL;v++){
    const wrap=document.createElement('div');wrap.className='tile pic';wrap.dataset.v=v;
    wrap.style.width=(100/N)+'%';wrap.style.height=(100/N)+'%';
    const cv=document.createElement('canvas');cv.width=120;cv.height=120;
    const cx=cv.getContext('2d');
    const hr=(((v-1)/N)|0),hc=(v-1)%N;
    cx.drawImage(scene,hc*s,hr*s,s,s,0,0,120,120);
    const bd=document.createElement('span');bd.className='badge';bd.textContent=v;
    wrap.appendChild(cv);wrap.appendChild(bd);
    boardEl.appendChild(wrap);els[v]=wrap;
  }
}
function setPos(v,idx){const r=(idx/N)|0,c=idx%N;els[v].style.left=(c*100/N)+'%';els[v].style.top=(r*100/N)+'%';}
function placeAll(){for(let i=0;i<TOTAL;i++)if(tiles[i])setPos(tiles[i],i);}
function blankIdx(){return tiles.indexOf(0);}
function slide(idx){const b=blankIdx(),br=(b/N)|0,bc=b%N,r=(idx/N)|0,c=idx%N;if(Math.abs(br-r)+Math.abs(bc-c)!==1)return false;tiles[b]=tiles[idx];tiles[idx]=0;setPos(tiles[b],b);return true;}
function moveDir(dx,dy){const b=blankIdx(),br=(b/N)|0,bc=b%N,tr=br-dy,tc=bc-dx;if(tr<0||tr>=N||tc<0||tc>=N)return false;return slide(tr*N+tc);}
function isSolved(){for(let i=0;i<TOTAL;i++)if(tiles[i]!==goal[i])return false;return true;}
function countFit(){let k=0;for(let i=0;i<TOTAL;i++)if(tiles[i]&&tiles[i]===goal[i])k++;return k+'/15';}
function scramble(k){do{let last=-1;for(let s=0;s<k;s++){const b=blankIdx(),br=(b/N)|0,bc=b%N;const opts=[];if(br>0)opts.push(b-N);if(br<N-1)opts.push(b+N);if(bc>0)opts.push(b-1);if(bc<N-1)opts.push(b+1);const cands=opts.filter(function(x){return x!==last;});const pick=cands[(Math.random()*cands.length)|0];tiles[b]=tiles[pick];tiles[pick]=0;last=pick;}}while(isSolved());}
function hud(){movesEl.textContent=moves;fitEl.textContent=countFit();}
function afterMove(){moves++;timeEl.textContent=fmt((Date.now()-startAt)/1000);hud();if(isSolved())finish();}
function finish(){
  playing=false;
  const sec=(Date.now()-startAt)/1000;
  ovTitle.textContent='星夜重圆!';
  ovInfo.textContent='用时 '+fmt(sec)+' · 步数 '+moves+'\n月亮归位,群星归位,今晚好梦';
  overlay.classList.add('show');
}
function playerMove(idx){if(!playing)return;if(slide(idx))afterMove();}
boardEl.addEventListener('click',function(ev){const t=ev.target.closest('.tile');if(!t)return;const v=parseInt(t.dataset.v,10);playerMove(tiles.indexOf(v));});
document.addEventListener('keydown',function(ev){const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};const d=map[ev.key];if(!d)return;ev.preventDefault();if(!playing)return;if(moveDir(d[0],d[1]))afterMove();});
let tX=0,tY=0;
boardEl.addEventListener('touchstart',function(ev){const t=ev.changedTouches[0];tX=t.clientX;tY=t.clientY;},{passive:true});
boardEl.addEventListener('touchend',function(ev){if(!playing)return;const t=ev.changedTouches[0];const dx=t.clientX-tX,dy=t.clientY-tY;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;ev.preventDefault();if(Math.abs(dx)>Math.abs(dy)){if(moveDir(dx>0?1:-1,0))afterMove();}else{if(moveDir(0,dy>0?1:-1))afterMove();}},{passive:false});
numBtn.addEventListener('click',function(){
  const on=boardEl.classList.toggle('num');
  numBtn.textContent=on?'编号:开':'编号:关';
});
function fit(){const w=boardEl.clientWidth;if(w)boardEl.style.fontSize=Math.max(12,Math.min(34,w/N*0.4))+'px';}
function newGame(){
  overlay.classList.remove('show');
  tiles=goal.slice();
  drawScene();buildTiles();scramble(K);placeAll();
  moves=0;startAt=Date.now();playing=true;timeEl.textContent='0:00';hud();
  requestAnimationFrame(function(){fit();boardEl.classList.add('ready');});
}
document.getElementById('resetBtn').addEventListener('click',newGame);
document.getElementById('againBtn').addEventListener('click',newGame);
window.addEventListener('resize',fit);
newGame();
})();
</script>
</body>
</html>

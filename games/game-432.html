<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>踩顶狂奔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:700px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f472b6;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f472b6;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f472b6}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#f472b6;color:#3d0c24;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>踩顶狂奔</h1>
  <p class="hint">空格/↑/点按 跳跃 · 踩到史莱姆头顶可借力弹起并连击加分 · 侧面碰到它或摸到尖刺都完蛋</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="cmb">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="640" height="300"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">踩顶狂奔</h2>
      <p id="ovDesc">史莱姆成群挡路?别怕——从头顶踩下去就能借力弹更高,连续踩还能翻倍得分!但侧面一碰就输,红色尖刺踩不得。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var cv=$("cv"),ctx=cv.getContext("2d"),W=640,H=300,GY=252;
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elScore=$("score"),elCmb=$("cmb"),elBest=$("best");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_s432");
var state="menu",dist,score,stompScore,speed,foes,px,py,vy,grounded,nextGap,combo,phase,parts;
function rr(x,y,w,h,r){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function reset(){
  dist=0;score=0;stompScore=0;speed=300;foes=[];px=90;py=GY-42;vy=0;grounded=true;
  nextGap=430;combo=0;phase=0;parts=[];
  elBest.textContent=best;
}
function updateHud(){
  elScore.textContent=score;
  elCmb.textContent=combo>0?combo+"x":"0";
}
function doJump(){
  if(state!=="playing")return;
  if(grounded){vy=-530;grounded=false;}
}
function gameOver(msg){
  state="over";
  if(score>best){best=score;saveBest("mg_s432",best);elBest.textContent=best;}
  ovTitle.textContent="游戏结束";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function burst(x,y,col){
  var i;
  for(i=0;i<8;i++)parts.push({x:x,y:y,vx:(Math.random()-0.3)*260,vy:-Math.random()*240-30,life:0.5,col:col});
}
function update(dt){
  var s=dt/1000,i,f;
  speed=Math.min(560,300+dist*0.018);
  dist+=speed*s;
  phase+=s*(grounded?speed*0.05:4);
  if(!grounded){
    vy+=2100*s;py+=vy*s;
    if(py>=GY-42){py=GY-42;vy=0;grounded=true;combo=0;}
  }
  nextGap-=speed*s;
  if(nextGap<=0){
    var r=Math.random();
    if(r<0.42){
      var hop=Math.random()<0.35;
      foes.push({x:W+30,w:32,h:26,type:"slime",hop:hop,hopT:1+Math.random(),hvy:0,dead:0});
      nextGap=210+Math.random()*230+speed*0.3;
    }else if(r<0.68){
      foes.push({x:W+30,w:64,type:"spikes"});
      nextGap=260+Math.random()*260+speed*0.32;
    }else{
      foes.push({x:W+30,w:32,h:26,type:"slime",hop:false,hopT:1,hvy:0,dead:0});
      foes.push({x:W+170,w:32,h:26,type:"slime",hop:false,hopT:1,hvy:0,dead:0});
      nextGap=340+Math.random()*240;
    }
  }
  var b={x:px+4,y:py+4,w:18,h:36};
  for(i=foes.length-1;i>=0;i--){
    f=foes[i];
    if(f.type==="slime"){
      f.x-=(speed+(f.dead?0:55))*s;
      if(f.y===undefined)f.y=GY-f.h;
      if(f.hop&&!f.dead){
        f.hopT-=s;
        if(f.hopT<=0&&f.hvy===0){f.hvy=-300;f.hopT=1.3+Math.random();}
      }
      if(f.hvy!==0){
        f.hvy+=1100*s;f.y+=f.hvy*s;
        if(f.y>=GY-f.h){f.y=GY-f.h;f.hvy=0;}
      }
      if(f.dead>0){f.dead-=s;if(f.dead<=0){foes.splice(i,1);continue;}}
    }else{
      f.x-=speed*s;
    }
    if(f.x<-110){foes.splice(i,1);continue;}
    if(f.type==="spikes"){
      if(b.x+b.w>f.x+4&&b.x<f.x+f.w-4&&b.y+b.h>GY-22){gameOver("踩到了红色尖刺——那可踩不得!");return;}
    }else if(!f.dead){
      var fy=f.y!==undefined?f.y:GY-f.h;
      if(b.x+b.w>f.x+3&&b.x<f.x+f.w-3&&b.y+b.h>fy+2&&b.y<fy+f.h&&f.hvy===0){
        if(vy>60&&b.y+b.h<fy+16){
          f.dead=0.35;
          vy=-490;combo++;stompScore+=10*combo;
          burst(f.x+f.w/2,fy,"#86efac");
        }else{
          gameOver("被史莱姆迎面扑倒——要从头顶踩它!");
          return;
        }
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.life-=s;p.x+=p.vx*s-speed*s*0.4;p.y+=p.vy*s;p.vy+=700*s;
    if(p.life<=0)parts.splice(i,1);
  }
  score=Math.floor(dist/10)+stompScore;
  updateHud();
}
function draw(){
  var i,f,grd,p;
  grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"#231426");grd.addColorStop(1,"#301429");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(244,114,182,.06)";
  for(i=0;i<9;i++)ctx.fillRect((i*149+dist*0.08%W+W)%W,30+(i*67)%120,34,34);
  ctx.fillStyle="#2e1c33";ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle="#f472b6";ctx.globalAlpha=0.4;ctx.fillRect(0,GY,W,2);ctx.globalAlpha=1;
  var dsh=dist%70;
  ctx.fillStyle="rgba(255,255,255,.08)";
  for(i=0;i<11;i++)ctx.fillRect(i*70-dsh,GY+14,32,3);
  for(i=0;i<foes.length;i++){
    f=foes[i];
    if(f.type==="spikes"){
      var n=Math.round(f.w/16),sw=f.w/n;
      ctx.fillStyle="#ef4444";
      for(var j=0;j<n;j++){
        ctx.beginPath();
        ctx.moveTo(f.x+j*sw,GY);ctx.lineTo(f.x+j*sw+sw/2,GY-22);ctx.lineTo(f.x+(j+1)*sw,GY);
        ctx.fill();
      }
    }else{
      var fy=f.y!==undefined?f.y:GY-f.h;
      if(f.dead>0){
        ctx.fillStyle="rgba(134,239,172,.75)";
        rr(f.x-3,fy+f.h-7,f.w+6,7,3);ctx.fill();
      }else{
        var sq=f.hvy<0?0.85:1;
        ctx.fillStyle="#4ade80";
        rr(f.x,fy+(1-sq)*f.h,f.w,f.h*sq,9);ctx.fill();
        ctx.fillStyle="#166534";
        ctx.beginPath();ctx.arc(f.x+10,fy+9,2.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(f.x+22,fy+9,2.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.25)";
        rr(f.x+5,fy+3,10,4,2);ctx.fill();
      }
    }
  }
  for(i=0;i<parts.length;i++){
    p=parts[i];
    ctx.fillStyle=p.col;
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  if(combo>=2){
    ctx.fillStyle="#fbbf24";
    ctx.font="bold 15px system-ui";ctx.textAlign="center";
    ctx.fillText(combo+"x 连踩!",px+13,py-14);
    ctx.textAlign="left";ctx.font="14px system-ui";
  }
  var l=grounded?Math.sin(phase)*4:0;
  ctx.fillStyle="#f472b6";
  rr(px,py+10,26,30,7);ctx.fill();
  rr(px+7,py,19,16,5);ctx.fill();
  ctx.fillStyle="#3d0c24";
  ctx.fillRect(px+17,py+4,3,4);
  ctx.fillStyle="#d14a8a";
  if(grounded){ctx.fillRect(px+4,py+38+Math.max(0,-l),7,5);ctx.fillRect(px+15,py+38+Math.max(0,l),7,5);}
  else{ctx.fillRect(px+3,py+36,8,5);ctx.fillRect(px+15,py+34,8,5);}
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(50,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k===" "||k==="ArrowUp")e.preventDefault();
  if(state!=="playing"){if(k===" "||k==="Enter")startGame();return;}
  if((k===" "||k==="ArrowUp"||k==="w"||k==="W")&&!e.repeat)doJump();
});
cv.addEventListener("touchstart",function(e){e.preventDefault();doJump();},{passive:false});
cv.addEventListener("mousedown",function(){doJump();});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

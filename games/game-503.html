<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深坑矿场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{position:relative;background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:580px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#fbbf24;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;line-height:1.5;margin-bottom:8px}
.hud{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;color:#c7cbe8;margin-bottom:6px}
.hud b{color:#ffd76a;font-size:14px}
#msg{min-height:18px;text-align:center;color:#7dd3fc;font-size:13px;margin-bottom:6px}
.cols{display:flex;gap:10px;flex-wrap:wrap}
#mineArea{flex:1.1;min-width:230px;background:#131728;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#rock{width:170px;height:150px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;color:#120c04;transition:transform .06s;background:radial-gradient(circle at 35% 30%,#9c8358,#6b5433 60%,#463419);box-shadow:0 8px 20px rgba(0,0,0,.5)}
#rock:active{transform:scale(.93)}
#meterBar{width:100%;height:14px;background:#0b0e1a;border-radius:7px;overflow:hidden}
#meterFill{height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#f59e0b)}
#depthBar{width:100%;height:20px;background:#0b0e1a;border-radius:10px;overflow:hidden;border:1px solid #2e3554}
#depthFill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
#depthTxt{font-size:12px;color:#8b90b0}
.shop{flex:1;min-width:230px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#20263f;border:1px solid #2e3554;border-radius:10px;padding:7px 10px;cursor:pointer}
.item.off{opacity:.45}
.item .nm{font-size:13px;font-weight:600}
.item .ds{font-size:11px;color:#8b90b0;margin-top:1px}
.item .pr{font-size:12.5px;color:#ffd76a;font-weight:700;white-space:nowrap}
.item .own{font-size:11px;color:#7dd3fc}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.93);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:9}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#4ade80}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8}
.overlay .big{font-size:17px;color:#ffd76a;font-weight:700}
.overlay button{margin-top:6px;background:#4ade80;color:#05230f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>深坑矿场</h1>
  <p class="hint">疯狂敲击矿岩向下掘进 · 越深岩层越硬但矿石越值钱 · 买镐与风钻提速 · 挖到 <b>500 米</b> 获胜</p>
  <div class="hud">
    <span>金币 <b id="hMoney">0</b></span>
    <span>深度 <b id="hDepth">0</b>/500m</span>
    <span>每秒进尺 <b id="hDps">0</b></span>
    <span>镐力 <b id="hPick">1</b></span>
  </div>
  <div id="msg"></div>
  <div class="cols">
    <div id="mineArea">
      <button id="rock">表土层</button>
      <div id="meterBar"><div id="meterFill"></div></div>
      <div id="depthBar"><div id="depthFill"></div></div>
      <div id="depthTxt">当前 0 米 · 敲 4 下挖穿 1 米</div>
    </div>
    <div class="shop" id="shop"></div>
  </div>
  <div class="overlay hide" id="ov">
    <h2 id="ovTitle"></h2>
    <p id="ovDesc"></p>
    <p class="big" id="ovScore"></p>
    <button id="btnGo">再来一局</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elMoney=$("hMoney"),elDepth=$("hDepth"),elDps=$("hDps"),elPick=$("hPick"),elMsg=$("msg");
var rock=$("rock"),meterFill=$("meterFill"),depthFill=$("depthFill"),depthTxt=$("depthTxt");
var shopEl=$("shop"),ov=$("ov"),ovT=$("ovTitle"),ovD=$("ovDesc"),ovS=$("ovScore"),btn=$("btnGo");
var WIN=500;
var layers=[
 {nm:"表土层",col:"#9c8358"},{nm:"碎石层",col:"#8a90a4"},{nm:"铁矿层",col:"#b08968"},
 {nm:"银矿层",col:"#cfd8e6"},{nm:"金矿层",col:"#e0b23c"},{nm:"钻石层",col:"#7de3f0"}
];
var ups=[
 {nm:"精钢镐头",ds:"每次敲击进尺 +1",base:40,mult:1.8,max:12},
 {nm:"蒸汽风钻",ds:"每秒自动进尺 +1.2",base:130,mult:2,max:10},
 {nm:"传送矿车",ds:"矿石卖价 +50%",base:220,mult:2.4,max:4}
];
var money,depth,prog,upLv,layerShown,state,msgT,rows=[];
function fmt(n){n=Math.floor(n);if(n>=10000)return (n/10000).toFixed(2)+"万";return String(n);}
function layerIdx(m){var i=Math.floor(m/80);return i>5?5:i;}
function need(m){return 4+layerIdx(m)*3;}
function val(m){return 3+layerIdx(m)*6;}
function pick(){return 1+upLv[0];}
function dps(){return upLv[1]*1.2;}
function upCost(i){return Math.floor(ups[i].base*Math.pow(ups[i].mult,upLv[i]));}
function say(t){elMsg.textContent=t;msgT=2.6;}
function buildShop(){
  var i;
  for(i=0;i<ups.length;i++){
    var d=document.createElement("div");
    d.className="item";
    d.innerHTML='<div><div class="nm">'+ups[i].nm+' <span class="own"></span></div><div class="ds">'+ups[i].ds+'</div></div><div class="pr"></div>';
    (function(idx){d.addEventListener("click",function(){buyUp(idx);});})(i);
    shopEl.appendChild(d);
    rows.push({el:d,own:d.querySelector(".own"),pr:d.querySelector(".pr")});
  }
}
function buyUp(i){
  if(state!=="play")return;
  if(upLv[i]>=ups[i].max){say("该项已升满!");return;}
  var c=upCost(i);
  if(money<c){say("金币不够!");return;}
  money-=c;upLv[i]++;
  say(ups[i].nm+" 升到 Lv"+upLv[i]+"!");
}
function tapRock(){
  if(state!=="play")return;
  prog+=pick();
  while(prog>=need(depth)&&depth<WIN){
    prog-=need(depth);depth++;
    money+=val(depth-1)*(1+0.5*upLv[2]);
    var li=layerIdx(depth);
    if(li!==layerShown){
      layerShown=li;
      say("进入 "+layers[li].nm+"!岩层更硬,矿石更值钱!");
    }
  }
}
rock.addEventListener("click",tapRock);
document.addEventListener("keydown",function(e){
  if(e.key===" "&&state==="play"){e.preventDefault();tapRock();}
  if((e.key===" "||e.key==="Enter")&&state==="over"){e.preventDefault();startGame();}
});
function showOv(t,d,s){
  ovT.textContent=t;ovD.textContent=d;ovS.textContent=s;ovS.style.display="block";
  btn.textContent="再来一局";ov.classList.remove("hide");
}
function startGame(){
  money=0;depth=0;prog=0;upLv=[0,0,0];layerShown=0;msgT=0;
  elMsg.textContent="";ov.classList.add("hide");
  state="play";render();
}
btn.addEventListener("click",startGame);
function render(){
  var li=layerIdx(Math.min(depth,499));
  elMoney.textContent=fmt(money);elDepth.textContent=depth;elDps.textContent=dps().toFixed(1);elPick.textContent=pick();
  rock.textContent=layers[li].nm;
  rock.style.background="radial-gradient(circle at 35% 30%,"+layers[li].col+",#3a2f1a 130%)";
  meterFill.style.width=Math.min(100,prog/need(depth)*100)+"%";
  depthFill.style.width=(depth/WIN*100)+"%";
  depthTxt.textContent="当前 "+depth+" 米 · 再敲 "+Math.ceil(need(depth)-prog)+" 下挖穿 1 米";
  var i;
  for(i=0;i<ups.length;i++){
    var full=upLv[i]>=ups[i].max,c=upCost(i);
    rows[i].pr.textContent=full?"已满":fmt(c);
    rows[i].own.textContent="Lv"+upLv[i]+"/"+ups[i].max;
    rows[i].el.classList.toggle("off",full||money<c);
  }
}
var last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last)last=t;
  var dt=Math.min(50,t-last);last=t;
  if(state!=="play")return;
  var ds=dt/1000;
  prog+=dps()*ds;
  while(prog>=need(depth)&&depth<WIN){
    prog-=need(depth);depth++;
    money+=val(depth-1)*(1+0.5*upLv[2]);
    var li=layerIdx(depth);
    if(li!==layerShown){layerShown=li;say("进入 "+layers[li].nm+"!矿脉更值钱了!");}
  }
  if(msgT>0){msgT-=ds;if(msgT<=0)elMsg.textContent="";}
  render();
  if(depth>=WIN){
    state="over";
    showOv("抵达坑底!","500 米深的矿脉被你挖穿,满载而归!","总进尺 500 米 · 金币 "+fmt(money));
  }
}
money=0;depth=0;prog=0;upLv=[0,0,0];layerShown=0;state="menu";msgT=0;
buildShop();render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

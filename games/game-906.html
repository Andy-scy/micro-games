<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标枪掷远</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:20px;color:#aed581;margin:4px 0}
.tip{font-size:13px;color:#9fa8da;text-align:center;margin-bottom:8px}
#stage{position:relative;line-height:0}
canvas{background:#161b30;border-radius:14px;max-width:96vw;height:auto;touch-action:none;display:block}
#overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;border-radius:14px}
#overlay.hidden{display:none}
.card{background:#232946;border:1px solid #4a5290;border-radius:14px;padding:20px 30px;text-align:center;max-width:80%;line-height:1.6}
.card h2{color:#aed581;margin-bottom:8px;font-size:22px}
.card p{font-size:15px;color:#c5cae9}
.card button{margin-top:14px;padding:9px 30px;font-size:16px;font-weight:700;border:none;border-radius:9px;background:#aed581;color:#1b3a12;cursor:pointer}
.card button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>标枪掷远</h1>
<p class="tip">第一次按键锁定摆动的出手角度，第二次按键锁定蓄力掷出 · 注意侧风 · 3 掷取最远，75 米以上获胜</p>
<div id="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="overlay" class="hidden"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="btnRe">再来一局</button></div></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),ovB=document.getElementById('btnRe');
var W=480,H=640,GY=540,LX=120,PPM=8;
var phase,jav,angT,lockA,meter,pt,wind,throws,best,msg,resT,camX,marks;
function rnd(a,b){return a+Math.random()*(b-a);}
function reset(){
  phase='angle';jav=null;angT=0;lockA=0.5;meter=0;pt=0;wind=rnd(-45,45);throws=0;best=0;msg='';resT=0;camX=0;marks=[];
}
function throwJav(){
  var v=300+meter*290;
  jav={x:LX,y:GY-38,vx:v*Math.cos(lockA),vy:-v*Math.sin(lockA),rot:0};
  jav.trail=[];
  phase='fly';
}
function update(dt){
  if(phase==='angle'){angT+=dt;lockA=0.35+0.65*(0.5+0.5*Math.sin(angT*3.0));}
  if(phase==='power'){pt+=dt;meter=0.5-0.5*Math.cos(pt*5.5);}
  if(phase==='fly'&&jav){
    var steps=Math.max(1,Math.ceil(dt/0.006)),sd=dt/steps;
    for(var i=0;i<steps;i++){
      jav.vy+=400*sd;
      jav.vx+=wind*sd*0.5;
      jav.vx*=(1-0.05*sd);jav.vy*=(1-0.05*sd);
      jav.x+=jav.vx*sd;jav.y+=jav.vy*sd;
      if(jav.y>=GY-6){jav.y=GY-6;phase='land';resT=0;
        var m=(jav.x-LX)/PPM;
        if(m<0)m=0;
        throws++;
        if(m>best){best=m;msg='最远纪录 '+m.toFixed(1)+' 米！';}
        else{msg='本次 '+m.toFixed(1)+' 米';}
        marks.push(jav.x);
        break;
      }
    }
    if(jav){jav.trail.push({x:jav.x,y:jav.y});if(jav.trail.length>24)jav.trail.shift();}
    var tx=jav.x-140;
    if(tx>camX)camX+=(tx-camX)*Math.min(1,dt*4);
    if(camX<0)camX=0;
    if(camX>620)camX=620;
  }
  if(phase==='land'){
    resT+=dt;
    if(resT>1.4){
      if(throws>=3){end(best>=75);return;}
      jav=null;phase='angle';angT=0;wind=rnd(-45,45);
    }
  }
}
function end(win){
  phase='over';
  ovT.textContent=win?'掷标健将！':'三掷结束';
  ovX.textContent='最远成绩 '+best.toFixed(1)+' 米（获胜需 75 米）。'+(win?'出手角度与力度俱佳！':'45° 左右出手最远，逆风要加大力度。');
  ov.classList.remove('hidden');
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var sky=ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,'#141c33');sky.addColorStop(1,'#1c2b1e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-camX,0);
  ctx.fillStyle='#2c4531';ctx.fillRect(camX,GY-4,W+640,4);
  ctx.fillStyle='#243a28';ctx.fillRect(camX,GY,W+640,H-GY);
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(LX,GY-4);ctx.lineTo(LX,GY-46);ctx.stroke();
  ctx.fillStyle='#ef9a9a';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('起掷线',LX,GY-52);
  for(var m2=1;m2<=13;m2++){
    var mx=LX+m2*10*PPM;
    ctx.strokeStyle='rgba(255,255,255,.14)';
    ctx.beginPath();ctx.moveTo(mx,GY-4);ctx.lineTo(mx,GY-22);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='12px system-ui,sans-serif';
    ctx.fillText((m2*10)+'m',mx,GY-30);
  }
  ctx.strokeStyle='#aed581';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(LX+60*PPM,GY-8);ctx.lineTo(LX+60*PPM,GY-34);ctx.stroke();
  ctx.strokeStyle='#ffd54f';
  ctx.beginPath();ctx.moveTo(LX+75*PPM,GY-8);ctx.lineTo(LX+75*PPM,GY-40);ctx.stroke();
  for(var f=0;f<marks.length;f++){
    ctx.fillStyle='rgba(174,213,129,.7)';
    ctx.beginPath();ctx.arc(marks[f],GY-8,4,0,7);ctx.fill();
  }
  if(jav){
    for(var t2=0;t2<jav.trail.length;t2++){
      ctx.fillStyle='rgba(174,213,129,'+(t2/jav.trail.length*0.3)+')';
      ctx.beginPath();ctx.arc(jav.trail[t2].x,jav.trail[t2].y,3,0,7);ctx.fill();
    }
    var a2=Math.atan2(jav.vy,jav.vx);
    ctx.save();ctx.translate(jav.x,jav.y);ctx.rotate(a2);
    ctx.strokeStyle='#e0e0e0';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(16,0);ctx.stroke();
    ctx.strokeStyle='#aed581';
    ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(22,0);ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle='#e8eaf6';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(LX,GY-4);ctx.lineTo(LX-8,GY);ctx.stroke();
  ctx.beginPath();ctx.arc(LX,GY-24,6,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(LX,GY-18);ctx.lineTo(LX,GY-34);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(232,234,246,.85)';ctx.font='15px system-ui,sans-serif';ctx.textAlign='center';
  if(phase==='angle'){
    var nx=LX+90*Math.cos(lockA),ny=GY-38-90*Math.sin(lockA);
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(LX,GY-38);ctx.lineTo(nx,ny);ctx.stroke();
    ctx.fillStyle='#ffd54f';ctx.font='16px system-ui,sans-serif';
    ctx.fillText('角度 '+Math.round(lockA*180/Math.PI)+'°  按住锁定',W/2,70);
  }
  if(phase==='power'){
    var bx=140,bw=200;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx,590,bw,16);
    ctx.fillStyle='#aed581';ctx.fillRect(bx,590,bw*meter,16);
    ctx.strokeStyle='#9fa8da';ctx.strokeRect(bx,590,bw,16);
    ctx.fillStyle='#aed581';ctx.font='16px system-ui,sans-serif';
    ctx.fillText('松手掷出！',W/2,575);
  }
  ctx.fillStyle='#e8eaf6';ctx.font='16px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('第 '+Math.min(throws+1,3)+' / 3 掷',14,28);
  ctx.fillText('最远 '+best.toFixed(1)+' 米',14,52);
  ctx.textAlign='right';
  ctx.fillStyle='#4fc3f7';
  ctx.fillText('风 '+(wind>0?'顺':'逆')+' '+Math.abs(Math.round(wind/9)),W-14,28);
  if(msg&&phase==='land'){
    ctx.fillStyle='#aed581';ctx.font='22px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(msg,W/2,110);
  }
}
function press(){
  if(phase==='angle'){phase='power';pt=0;meter=0;}
  else if(phase==='power')throwJav();
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();press();});
window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();if(!e.repeat)press();}});
ovB.addEventListener('click',function(){ov.classList.add('hidden');reset();});
var last=performance.now();
function loop(t){var dt=Math.min(0.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

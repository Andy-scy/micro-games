<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禅意弹珠</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#5eead4;text-align:center;letter-spacing:2px;margin-bottom:2px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin-bottom:8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#5eead4;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#5eead4}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#5eead4;color:#042f2e;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>禅意弹珠</h1>
  <p class="hint">← → 或 A/D 控制双翼 · 无失败 · 达到 3000 分即圆满</p>
  <div class="hud">
    <span>心境 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="400" height="620"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">禅意弹珠</h2>
      <p id="ovDesc">没有失败,只有流动。低重力、高弹性的温柔台面上,小球掉落后会化作一缕光,从发射口重新开始。持续撞击可累积连击,每一击都随连击增值。心境达到 3000,即为圆满。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始修行</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var elScore=$("score"),elCombo=$("combo"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var W=400,H=620,G=560,MAXS=1000,TAU=6.2832;
var best=0;
try{best=parseInt(localStorage.getItem("mg940")||"0",10)||0;}catch(e){best=0;}
function saveBest(){try{localStorage.setItem("mg940",String(best));}catch(e){}}
var state="menu",score=0,lastT=0;
var b=null,segs=[],circs=[],flL=null,flR=null;
var charging=false,charge=0;
var combo=0,comboT=0,respawnAt=0,won=false;
var pops=[],ripples=[];
function S(x1,y1,x2,y2,o){var s={x1:x1,y1:y1,x2:x2,y2:y2,e:0.5,pad:2,kick:0,ow:0,cd:0};if(o)for(var k in o)s[k]=o[k];segs.push(s);return s;}
function C(x,y,r,o){var c={x:x,y:y,r:r,e:0.9,kick:0,cd:0,val:0};if(o)for(var k in o)c[k]=o[k];circs.push(c);return c;}
function mkFL(px,py,mir,len){len=len||58;return{px:px,py:py,len:len,rest:mir?Math.PI-0.55:0.55,up:mir?Math.PI+0.62:-0.62,ang:mir?Math.PI-0.55:0.55,om:0,spd:13,pressed:false};}
function reset(){
  segs=[];circs=[];pops=[];ripples=[];
  S(10,44,326,44);
  S(326,44,390,112);
  S(350,138,390,112,{ow:1,e:0.4});
  S(10,44,10,588);
  S(390,112,390,588);
  S(358,138,358,588);
  S(358,588,390,588,{e:0});
  S(62,460,94,540);
  S(338,460,306,540);
  S(86,454,134,532,{e:1.1,kick:200,col:"#5eead4"});
  S(314,454,266,532,{e:1.1,kick:200,col:"#5eead4"});
  S(134,532,144,552);
  S(266,532,256,552);
  C(110,170,20,{kick:240,val:60,e:0.75});
  C(290,170,20,{kick:240,val:60,e:0.75});
  C(200,100,18,{kick:240,val:60,e:0.75});
  C(60,280,9,{e:0.85,val:20});
  C(340,280,9,{e:0.85,val:20});
  C(130,350,9,{e:0.85,val:20});
  C(270,350,9,{e:0.85,val:20});
  C(200,300,9,{e:0.85,val:20});
  flL=mkFL(140,547,false);flR=mkFL(260,547,true);
}
function fseg(f){return{x1:f.px,y1:f.py,x2:f.px+f.len*Math.cos(f.ang),y2:f.py+f.len*Math.sin(f.ang),e:0.35,pad:5,om:f.om,ang:f.ang};}
function upFlip(f,h){
  var target=f.pressed?f.up:f.rest,prev=f.ang,step=f.spd*h,d=target-f.ang;
  if(Math.abs(d)<=step)f.ang=target;else f.ang+=(d>0?step:-step);
  f.om=(f.ang-prev)/h;
}
function addScore(v,x,y){
  combo++;comboT=performance.now();
  var gain=Math.round(v*(1+combo*0.2));
  score+=gain;
  elScore.textContent=score;
  elCombo.textContent=combo;
  if(x!==undefined&&pops.length<8)pops.push({x:x,y:y,txt:"+"+gain,life:900});
  ripples.push({x:x||200,y:y||300,life:600});
  if(score>=3000&&!won){
    won=true;
    if(score>best){best=score;saveBest();}
    elBest.textContent=best;
    ovTitle.textContent="身心圆满";
    ovDesc.textContent="心境已至 3000,涟漪归于平静。";
    ovScore.style.display="block";
    ovScore.textContent="心境 "+score+" · 最佳 "+best;
    btnGo.textContent="再来一局";
    ov.classList.remove("hide");
    state="over";
  }
}
function toReady(){
  b={x:374,y:574,vx:0,vy:0,r:9};
  charging=false;charge=0;state="ready";
  combo=0;elCombo.textContent=0;
}
function launch(){
  b.vx=-10;b.vy=-(560+680*charge);
  charge=0;charging=false;state="playing";
}
function softRespawn(t){
  ripples.push({x:b.x,y:Math.min(b.y,H-40),life:900});
  b={x:374,y:574,vx:0,vy:0,r:9};
  combo=0;elCombo.textContent=0;
  respawnAt=t+800;
}
function startGame(){
  reset();score=0;won=false;
  elScore.textContent=0;elCombo.textContent=0;elBest.textContent=best;
  toReady();
  ov.classList.add("hide");
}
function collideSeg(s,now){
  var dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy;
  var t=L2>0?((b.x-s.x1)*dx+(b.y-s.y1)*dy)/L2:0;
  t=t<0?0:t>1?1:t;
  var px=s.x1+t*dx,py=s.y1+t*dy;
  var ex=b.x-px,ey=b.y-py,d2=ex*ex+ey*ey,R=b.r+(s.pad||0);
  if(d2>=R*R)return false;
  if(s.ow===1&&b.vy<0)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=0;}
  var nx=ex/d,ny=ey/d;
  b.x=px+nx*R;b.y=py+ny*R;
  var ox=0,oy=0;
  if(s.om){
    var segLen=Math.sqrt(L2),l=(t-(s.pv||0))*segLen;
    var sA=Math.sin(s.ang),cA=Math.cos(s.ang);
    ox=-s.om*l*sA;oy=s.om*l*cA;
  }
  var rvx=b.vx-ox,rvy=b.vy-oy,vn=rvx*nx+rvy*ny;
  if(vn<0){
    b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;
    if(s.kick&&now-s.cd>90){s.cd=now;b.vx+=s.kick*nx;b.vy+=s.kick*ny;addScore(40,px,py);}
  }
  return true;
}
function collideCirc(c,now){
  var ex=b.x-c.x,ey=b.y-c.y,R=b.r+c.r,d2=ex*ex+ey*ey;
  if(d2>=R*R)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=-0.001;}
  var nx=ex/d,ny=ey/d;
  b.x=c.x+nx*R;b.y=c.y+ny*R;
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny;
    if(now-c.cd>120){
      c.cd=now;
      if(c.kick){b.vx+=c.kick*nx;b.vy+=c.kick*ny;}
      if(c.val)addScore(c.val,c.x,c.y-c.r-8);
    }
  }
  return true;
}
function stepBall(h,now){
  b.vy+=G*h;
  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(sp>MAXS){b.vx*=MAXS/sp;b.vy*=MAXS/sp;}
  b.x+=b.vx*h;b.y+=b.vy*h;
  var i;
  for(i=0;i<segs.length;i++)collideSeg(segs[i],now);
  collideSeg(fseg(flL),now);
  collideSeg(fseg(flR),now);
  for(i=0;i<circs.length;i++)collideCirc(circs[i],now);
  if(b.x<12){b.x=12;if(b.vx<0)b.vx=-b.vx;}
  if(b.x>388){b.x=388;if(b.vx>0)b.vx=-b.vx;}
  if(b.x>362&&b.y>545&&b.vy>=-20){toReady();return false;}
  if(b.y>H+25){softRespawn(now);return true;}
  return false;
}
function frame(t){
  requestAnimationFrame(frame);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  if(state==="playing"||state==="ready"){upFlip(flL,dt/1000);upFlip(flR,dt/1000);}
  if(state==="ready"){
    if(charging){charge+=dt*0.0013;if(charge>1)charge=1;}
  }else if(state==="playing"){
    if(respawnAt>0){
      if(t>respawnAt){
        respawnAt=0;
        b.vx=-8;b.vy=-560;
      }
    }else{
      if(combo>0&&t-comboT>2600){combo=0;elCombo.textContent=0;}
      var n=5,i;
      for(i=0;i<n;i++){if(stepBall(dt/1000/n,t))break;}
    }
  }
  var j;
  for(j=pops.length-1;j>=0;j--){pops[j].life-=dt;pops[j].y-=dt*0.028;if(pops[j].life<=0)pops.splice(j,1);}
  for(j=ripples.length-1;j>=0;j--){ripples[j].life-=dt;if(ripples[j].life<=0)ripples.splice(j,1);}
  draw(t);
}
function drawSegs(){
  ctx.lineCap="round";
  var i,s;
  for(i=0;i<segs.length;i++){
    s=segs[i];
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
    if(s.ow===1){ctx.setLineDash([6,5]);ctx.strokeStyle="#1f3b47";ctx.lineWidth=3;}
    else{ctx.setLineDash([]);ctx.strokeStyle=s.col||"#274054";ctx.lineWidth=5;}
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawFL(f){
  var x2=f.px+f.len*Math.cos(f.ang),y2=f.py+f.len*Math.sin(f.ang);
  ctx.strokeStyle="#5eead4";ctx.lineWidth=12;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(f.px,f.py);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle="#ccfbf1";ctx.beginPath();ctx.arc(f.px,f.py,5,0,TAU);ctx.fill();
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(200,280,40,200,280,430);
  g.addColorStop(0,"rgba(94,234,212,0.10)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<ripples.length;i++){
    var rp=ripples[i];
    ctx.globalAlpha=Math.max(0,rp.life/900)*0.5;
    ctx.strokeStyle="#5eead4";
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(rp.x,rp.y,(1-rp.life/900)*70+8,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
  drawSegs();
  var c,hot;
  for(i=0;i<circs.length;i++){
    c=circs[i];
    hot=t-c.cd<130;
    if(c.r<=9){
      ctx.fillStyle=hot?"#99f6e4":"#22404a";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();
    }else{
      ctx.fillStyle=hot?"#f0fdfa":"#0e2229";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();
      ctx.strokeStyle=hot?"#5eead4":"#2d6a64";ctx.lineWidth=3;ctx.stroke();
    }
  }
  drawFL(flL);drawFL(flR);
  ctx.fillStyle="#2dd4bf";ctx.fillRect(368,584+charge*10,12,5);
  if(b){
    var bg2=ctx.createRadialGradient(b.x-3,b.y-4,1,b.x,b.y,10);
    bg2.addColorStop(0,"#ffffff");bg2.addColorStop(1,"#99f6e4");
    ctx.fillStyle=bg2;ctx.shadowColor="#5eead4";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.shadowBlur=0;
  }
  ctx.font="bold 14px system-ui";ctx.textAlign="center";
  for(i=0;i<pops.length;i++){
    ctx.globalAlpha=Math.min(1,pops[i].life/500);
    ctx.fillStyle="#ccfbf1";ctx.fillText(pops[i].txt,pops[i].x,pops[i].y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){flL.pressed=true;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){flR.pressed=true;e.preventDefault();}
  else if(k===" "||k==="ArrowDown"){
    e.preventDefault();
    if(state==="ready")charging=true;
    else if(state==="menu"||state==="over")startGame();
  }else if(k==="Enter"&&(state==="menu"||state==="over"))startGame();
});
document.addEventListener("keyup",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A")flL.pressed=false;
  else if(k==="ArrowRight"||k==="d"||k==="D")flR.pressed=false;
  else if(k===" "||k==="ArrowDown"){
    if(state==="ready"&&charging)launch();
    charging=false;
  }
});
var tCharge=false;
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(state==="ready"){tCharge=true;charging=true;return;}
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=true;else flR.pressed=true;
  }
},{passive:false});
cv.addEventListener("touchend",function(e){
  e.preventDefault();
  if(state==="ready"){
    if(tCharge){tCharge=false;charge=Math.max(charge,0.55);launch();}
    return;
  }
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=false;else flR.pressed=false;
  }
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
elBest.textContent=best;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炸弹警报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#f87171;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#f87171;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#1a1a22;border-radius:10px;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#f87171}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#f87171;color:#2b0808;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>炸弹警报</h1>
  <p class="hint">只敲地鼠 · 千万别碰炸弹 · 触屏同样可玩</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>时间 <b id="time">60</b> 秒</span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">炸弹警报</h2>
      <p id="ovDesc">洞里除了地鼠,还会冒出点燃引线的炸弹!敲中地鼠 +10 分,敲中炸弹 -30 分并且被震晕 0.8 秒无法出手。稳住手,只打地鼠!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=480;
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elTime=$("time"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var GAME_LEN=60;
var best=loadBest("mg_s202");
var state="menu",score=0,hits=0,boomHits=0,timeLeft=GAME_LEN,spawnT=400;
var holes=[],items=[],floats=[],rings=[],shakeT=0,stunT=0;
var lastT=0;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function initHoles(){
  holes=[];
  for(var r=0;r<3;r++)for(var c=0;c<3;c++)holes.push({x:90+c*150,y:160+r*132});
}
initHoles();

function freeHole(){
  var used={},i,cand=[];
  for(i=0;i<items.length;i++)used[items[i].hole]=1;
  for(i=0;i<holes.length;i++)if(!used[i])cand.push(i);
  if(!cand.length)return -1;
  return cand[(Math.random()*cand.length)|0];
}
function spawnItem(){
  var h=freeHole();
  if(h<0)return;
  var bomb=Math.random()<0.28;
  items.push({hole:h,state:"rise",frac:0,t:0,upMs:bomb?1150:900,bomb:bomb});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,t:0});}
function addRing(x,y,r,c){rings.push({x:x,y:y,r:r,c:c,t:0});}

function reset(){
  items=[];floats=[];rings=[];
  score=0;hits=0;boomHits=0;timeLeft=GAME_LEN;spawnT=350;
  shakeT=0;stunT=0;
  updateHud();
}
function startGame(){
  reset();
  state="playing";
  ov.classList.add("hide");
}
function endGame(){
  state="over";
  if(score>best){best=score;saveBest("mg_s202",best);}
  ovTitle.textContent="时间到!";
  ovDesc.textContent="敲中地鼠 "+hits+" 只 · 误点炸弹 "+boomHits+" 次";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function updateHud(){
  elScore.textContent=score;
  elTime.textContent=Math.ceil(timeLeft);
  elBest.textContent=best;
}

function update(dt){
  timeLeft-=dt/1000;
  if(timeLeft<=0){timeLeft=0;endGame();return;}
  if(shakeT>0)shakeT-=dt;
  if(stunT>0)stunT-=dt;
  spawnT-=dt;
  var prog=1-timeLeft/GAME_LEN;
  if(spawnT<=0){
    var gap=Math.max(380,680-prog*300);
    spawnT=gap*(0.8+Math.random()*0.4);
    spawnItem();
    if(prog>0.5&&Math.random()<0.35)spawnItem();
  }
  var i,it;
  for(i=items.length-1;i>=0;i--){
    it=items[i];it.t+=dt;
    if(it.state==="rise"){
      it.frac=Math.min(1,it.t/130);
      if(it.frac>=1){it.state="up";it.t=0;}
    }else if(it.state==="up"){
      if(it.t>=it.upMs){it.state="down";it.t=0;}
    }else if(it.state==="down"){
      it.frac=1-Math.min(1,it.t/150);
      if(it.frac<=0)items.splice(i,1);
    }
  }
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>800)floats.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>320)rings.splice(i,1);}
}

function whack(p){
  if(state!=="playing")return;
  if(stunT>0)return;
  var i,it;
  for(i=0;i<items.length;i++){
    it=items[i];
    if(it.state!=="down"&&it.frac>0.3){
      var hx=holes[it.hole].x,hy=holes[it.hole].y-34*it.frac;
      var dx=p.x-hx,dy=p.y-hy;
      if(dx*dx+dy*dy<58*58){
        items.splice(i,1);
        if(it.bomb){
          score=Math.max(0,score-30);
          boomHits++;stunT=800;shakeT=420;
          addFloat(hx,hy-46,"轰! -30","#f87171");
          addRing(hx,hy,80,"rgba(248,113,113,0.9)");
          addRing(hx,hy,52,"rgba(251,191,36,0.9)");
        }else{
          score+=10;hits++;
          addFloat(hx,hy-46,"+10","#4ade80");
          addRing(hx,hy,50,"rgba(74,222,128,0.8)");
        }
        updateHud();
        return;
      }
    }
  }
}

function drawBombAt(h,frac,now){
  var cy=h.y+8-76*frac;
  ctx.save();
  ctx.beginPath();ctx.rect(h.x-72,h.y-172,144,184);ctx.clip();
  ctx.fillStyle="#23262f";
  ctx.beginPath();ctx.ellipse(h.x,cy+10,31,34,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#3a3f4d";
  ctx.beginPath();ctx.ellipse(h.x-9,cy,9,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4a5164";
  ctx.fillRect(h.x-9,cy-38,18,11);
  ctx.strokeStyle="#c69a6d";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(h.x,cy-38);ctx.quadraticCurveTo(h.x+12,cy-50,h.x+19,cy-44);ctx.stroke();
  var sp=4+Math.sin(now*0.02)*2;
  ctx.fillStyle="#fbbf24";
  ctx.beginPath();ctx.arc(h.x+19,cy-44,sp,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#f87171";ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(h.x-12,cy+6);ctx.lineTo(h.x-4,cy+14);
  ctx.moveTo(h.x-4,cy+6);ctx.lineTo(h.x-12,cy+14);
  ctx.moveTo(h.x+4,cy+6);ctx.lineTo(h.x+12,cy+14);
  ctx.moveTo(h.x+12,cy+6);ctx.lineTo(h.x+4,cy+14);
  ctx.stroke();
  ctx.restore();
}
function drawMoleAt(h,frac){
  var bh=78,base=h.y+10,cy=base-bh*frac;
  ctx.save();
  ctx.beginPath();ctx.rect(h.x-72,h.y-172,144,184);ctx.clip();
  ctx.fillStyle="#a5682a";
  ctx.beginPath();ctx.ellipse(h.x,cy,34,bh/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#1a1408";
  ctx.beginPath();ctx.arc(h.x-11,cy-8,3.6,0,Math.PI*2);ctx.arc(h.x+11,cy-8,3.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f472b6";
  ctx.beginPath();ctx.ellipse(h.x,cy+4,5.5,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHoleBack(h){
  ctx.fillStyle="#0a0d12";
  ctx.beginPath();ctx.ellipse(h.x,h.y,48,18,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#3a3f4d";ctx.lineWidth=4;ctx.stroke();
}
function drawHoleFront(h){
  ctx.fillStyle="#0a0d12";
  ctx.beginPath();ctx.ellipse(h.x,h.y,48,18,0,0,Math.PI);ctx.fill();
}

function draw(now){
  ctx.save();
  if(shakeT>0){
    var s=shakeT/420*7;
    ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);
  }
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#20222e");g.addColorStop(1,"#121420");
  ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  var i;
  for(i=0;i<holes.length;i++)drawHoleBack(holes[i]);
  for(i=0;i<items.length;i++){
    var it=items[i];
    if(it.frac>0.02){
      if(it.bomb)drawBombAt(holes[it.hole],it.frac,now);
      else drawMoleAt(holes[it.hole],it.frac);
    }
  }
  for(i=0;i<holes.length;i++)drawHoleFront(holes[i]);
  for(i=0;i<rings.length;i++){
    var r=rings[i],k=r.t/320;
    ctx.strokeStyle=r.c;ctx.lineWidth=4*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r*(0.3+k),0,Math.PI*2);ctx.stroke();
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<floats.length;i++){
    var f=floats[i],fk=f.t/800;
    ctx.globalAlpha=1-fk;
    ctx.font="bold 19px sans-serif";
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y-34*fk);
    ctx.globalAlpha=1;
  }
  if(stunT>0){
    ctx.fillStyle="rgba(251,191,36,0.18)";
    ctx.fillRect(-10,-10,W+20,H+20);
    ctx.font="bold 22px sans-serif";
    ctx.fillStyle="#fbbf24";
    ctx.fillText("被震晕了…",W/2,60);
  }
  ctx.restore();
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,W,26);
  ctx.fillStyle="#f87171";ctx.fillRect(0,0,W*timeLeft/GAME_LEN,26);
  ctx.font="bold 14px sans-serif";ctx.textAlign="left";
  ctx.fillStyle="#0f1220";
  ctx.fillText("剩余 "+Math.ceil(timeLeft)+" 秒 · 小心炸弹!",10,14);
}

function ptFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var cx,cy;
  if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
cv.addEventListener("mousedown",function(e){e.preventDefault();whack(ptFromEvent(e));});
cv.addEventListener("touchstart",function(e){e.preventDefault();whack(ptFromEvent(e));},{passive:false});
btnGo.addEventListener("click",startGame);
document.addEventListener("keydown",function(e){
  if(state!=="playing"&&(e.key===" "||e.key==="Enter")){e.preventDefault();startGame();}
});

function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw(t);
}
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图案点灯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:500px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#a78bfa;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#a78bfa;font-size:16px}
.hudR{display:flex;align-items:center;gap:8px}
.mini{display:grid;grid-template-columns:repeat(5,12px);grid-auto-rows:12px;gap:2px;padding:5px;background:#111527;border:1px solid #2a3258;border-radius:8px}
.mini i{border-radius:2px;background:#232a4a}
.mini i.t{background:#c4b5fd;box-shadow:0 0 4px rgba(167,139,250,.8)}
.gbtn{background:#2a1f4d;color:#a78bfa;border:1px solid #a78bfa;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#a78bfa;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:400px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:9px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.on{background:linear-gradient(145deg,#ddd6fe,#8b5cf6);border-color:#ede9fe;box-shadow:0 0 13px rgba(167,139,250,.55)}
.cell.cur{outline:2px solid rgba(167,139,250,.75);outline-offset:2px}
.cell:active{transform:scale(.92)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#a78bfa;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#a78bfa;color:#2a1f4d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>图案点灯</h1>
  <p class="hint">目标不再是全亮或全灭:右上角的小图就是今晚的「目标图案」。点击翻转十字,让 5×5 大棋盘摆出一模一样的图案。</p>
  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>已匹配 <b id="match">0</b>/25</span>
    <span class="hudR">目标图案 <span class="mini" id="mini"></span></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">图案点灯</h2>
    <p id="ovDesc">点灯进阶:棋盘初始全暗,而目标图案由同一套十字翻转生成——所以它一定摆得出来。对照右上角小图,一步一步逼近它。步数越少,评级越高。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始复原</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=5,CNT=25;
var gridEl=$("grid"),elMoves=$("moves"),elMatch=$("match"),elMini=$("mini"),elMsg=$("msg"),btnNew=$("btnNew");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],target=[],moves=0,state="menu";
var best=loadNum("mg323_best");

function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2200);}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
  elMini.innerHTML="";
  for(var j=0;j<CNT;j++){var m=document.createElement("i");elMini.appendChild(m);}
}
function paint(i){
  if(board[i])cells[i].classList.add("on");else cells[i].classList.remove("on");
}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function paintMini(){
  var ms=elMini.children,i;
  for(i=0;i<CNT;i++){
    if(target[i])ms[i].classList.add("t");else ms[i].classList.remove("t");
  }
}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function applyTo(arr,r,c){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++)arr[list[i]]^=1;
}
function matchCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i]===target[i])n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function updateHud(){
  elMoves.textContent=moves;elMatch.textContent=matchCount();
}
function newGame(){
  var i,ps=pickCells(7+((Math.random()*2)|0)),j;
  target=[];board=[];
  for(i=0;i<CNT;i++){target.push(0);board.push(0);}
  for(j=0;j<ps.length;j++)applyTo(target,(ps[j]/N)|0,ps[j]%N);
  moves=0;state="playing";
  paintAll();paintMini();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  applyTo(board,(i/N)|0,i%N);
  paint(i);
  var list=crossList((i/N)|0,i%N),k;
  for(k=0;k<list.length;k++)paint(list[k]);
  moves++;updateHud();
  if(matchCount()===CNT)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||moves<best){best=moves;saveNum("mg323_best",best);isNew=true;}
  ovTitle.textContent="图案复原!";
  ovDesc.textContent=isNew?"新纪录!你用最少的步数复现了目标图案。":"大棋盘与小图分毫不差,今晚的图案属于你。";
  ovScore.style.display="block";
  ovScore.textContent="本局步数 "+moves+" · 历史最少 "+(best>0?best+" 步":"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function start(){newGame();ov.classList.add("hide");setMsg("对照右上角小图开始复原");}
var cur=-1;
function setCur(i){
  if(cur>=0)cells[cur].classList.remove("cur");
  cur=i;
  if(cur>=0)cells[cur].classList.add("cur");
}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(cur<0)setCur(12);
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){
  if(state==="menu")return;
  newGame();setMsg("图案已更换,重新复原");
});
build();
target=[];board=[];
for(var z=0;z<CNT;z++){target.push(0);board.push(0);}
var ps0=pickCells(8),z2;
for(z2=0;z2<ps0.length;z2++)applyTo(target,(ps0[z2]/N)|0,ps0[z2]%N);
paintAll();paintMini();updateHud();
})();
</script>
</body>
</html>

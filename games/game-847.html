<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水管工</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:14px}
.wrap{width:100%;max-width:430px}
h1{text-align:center;font-size:22px;margin:6px 0}
.tip{text-align:center;color:#8f97c0;font-size:13px;line-height:1.5;margin-bottom:10px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:10px}
.panel{background:#181d33;border:1px solid #262d52;border-radius:14px;padding:10px;margin-bottom:12px;display:flex;justify-content:center}
#board{display:grid;grid-template-columns:repeat(5,64px);grid-auto-rows:64px;gap:3px;background:#0f1220;border-radius:8px}
.pc{background:#1c2240;border-radius:6px;cursor:pointer;overflow:hidden}
.pc:hover{background:#232b56}
.pc.src{background:#252d5e;outline:2px solid #4f6ef7}
.btn{background:#2a3157;color:#e8eaf6;border:none;border-radius:10px;padding:9px 18px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.btn.pri{background:#4f6ef7;color:#fff}
.btnrow{display:flex;justify-content:center;gap:10px}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:26px 34px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:10px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:16px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<h1>水管工</h1>
<p class="tip">点击管子旋转 90°,让水源与所有管道连通(亮起)。<br>每根管子都要通水才算修好!</p>
<div class="hud"><span id="hM">旋转 0 次</span><span id="hT">用时 0 秒</span></div>
<div class="panel"><div id="board"></div></div>
<div class="btnrow"><button class="btn pri" id="bNew">重开一局</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn pri" id="ovB">再来一局</button></div></div>
<script>
"use strict";
const R=5,C=5,CELLS=25;
const DIRS=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
let conn=[],src=0,moves=0,sec=0,timer=null,over=false;
const boardEl=document.getElementById("board");
const cells=[];
for(let i=0;i<CELLS;i++){
  const d=document.createElement("div");
  d.className="pc";d.dataset.i=String(i);
  boardEl.appendChild(d);cells.push(d);
}
boardEl.addEventListener("click",e=>{
  const t=e.target.closest(".pc");
  if(!t||over)return;
  const i=parseInt(t.dataset.i,10);
  conn[i]=((conn[i]<<1)|(conn[i]>>3))&15;
  moves++;
  document.getElementById("hM").textContent="旋转 "+moves+" 次";
  render();
  if(computeLit().every(x=>x))winGame();
});
function genTree(){
  for(let t=0;t<50;t++){
    const vis=new Array(CELLS).fill(false);
    const cn=new Array(CELLS).fill(0);
    const st=[Math.floor(Math.random()*CELLS)];
    vis[st[0]]=true;
    while(st.length){
      const cur=st[st.length-1];
      const r=Math.floor(cur/C),c=cur%C;
      const opts=[];
      for(const d of DIRS){
        const nr=r+d[0],nc=c+d[1];
        if(nr>=0&&nr<R&&nc>=0&&nc<C&&!vis[nr*C+nc])opts.push(d);
      }
      if(!opts.length){st.pop();continue;}
      const d=opts[Math.floor(Math.random()*opts.length)];
      const ni=(r+d[0])*C+(c+d[1]);
      vis[ni]=true;
      cn[cur]|=(1<<d[2]);
      cn[ni]|=(1<<d[3]);
      st.push(ni);
    }
    return cn;
  }
  return cn0();
}
function cn0(){const cn=new Array(CELLS).fill(0);for(let r=0;r<R;r++)for(let c=0;c<C-1;c++){cn[r*C+c]|=2;cn[r*C+c+1]|=8;}return cn;}
function computeLit(){
  const lit=new Array(CELLS).fill(false);
  const st=[src];
  lit[src]=true;
  while(st.length){
    const cur=st.pop();
    const r=Math.floor(cur/C),c=cur%C;
    for(let d=0;d<4;d++){
      if(!(conn[cur]&(1<<d)))continue;
      let nr=r,nc=c,od=-1;
      if(d===0&&r>0){nr=r-1;od=2;}
      else if(d===1&&c<C-1){nc=c+1;od=3;}
      else if(d===2&&r<R-1){nr=r+1;od=0;}
      else if(d===3&&c>0){nc=c-1;od=1;}
      if(od<0)continue;
      const ni=nr*C+nc;
      if(!lit[ni]&&(conn[ni]&(1<<od))){lit[ni]=true;st.push(ni);}
    }
  }
  return lit;
}
function maskPath(m){
  let d="";
  if(m&1)d+="M20 20 L20 0 ";
  if(m&2)d+="M20 20 L40 20 ";
  if(m&4)d+="M20 20 L20 40 ";
  if(m&8)d+="M20 20 L0 20 ";
  return d;
}
function render(){
  const lit=computeLit();
  for(let i=0;i<CELLS;i++){
    const color=lit[i]?"#ffd668":"#56608f";
    let svg='<svg viewBox="0 0 40 40" width="100%" height="100%">';
    svg+='<path d="'+maskPath(conn[i])+'" stroke="'+color+'" stroke-width="8" stroke-linecap="round" fill="none"/>';
    if(i===src)svg+='<rect x="13" y="13" width="14" height="14" rx="3" fill="'+color+'"/>';
    else svg+='<circle cx="20" cy="20" r="4.5" fill="'+color+'"/>';
    svg+="</svg>";
    cells[i].innerHTML=svg;
    cells[i].classList.toggle("src",i===src);
  }
}
function show(t,p){document.getElementById("ovT").textContent=t;document.getElementById("ovP").textContent=p;document.getElementById("ov").classList.remove("hide");}
function winGame(){
  over=true;clearInterval(timer);
  show("通水成功!","全部管道点亮 · 旋转 "+moves+" 次 · 用时 "+sec+" 秒");
}
function startTimer(){
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{sec++;document.getElementById("hT").textContent="用时 "+sec+" 秒";},1000);
}
function init(){
  conn=genTree();
  src=Math.floor(Math.random()*CELLS);
  for(let i=0;i<CELLS;i++){
    const k=Math.floor(Math.random()*4);
    for(let j=0;j<k;j++)conn[i]=((conn[i]<<1)|(conn[i]>>3))&15;
  }
  let guard=0;
  while(computeLit().every(x=>x)&&guard++<40){
    const i=Math.floor(Math.random()*CELLS);
    conn[i]=((conn[i]<<1)|(conn[i]>>3))&15;
  }
  moves=0;sec=0;over=false;
  document.getElementById("hM").textContent="旋转 0 次";
  document.getElementById("hT").textContent="用时 0 秒";
  document.getElementById("ov").classList.add("hide");
  render();startTimer();
}
document.getElementById("bNew").addEventListener("click",init);
document.getElementById("ovB").addEventListener("click",init);
init();
</script>
</body>
</html>

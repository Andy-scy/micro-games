<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷你限时台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:384px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#f97316;text-align:center;letter-spacing:2px;margin-bottom:2px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin-bottom:8px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#f97316;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#f97316}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#4ade80;font-weight:700}
.overlay button{margin-top:4px;background:#f97316;color:#431407;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>迷你限时台</h1>
  <p class="hint">← → 或 A/D 压翼 · 空格蓄力发射 · 90 秒狂飙计分</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>剩余 <b id="time">90</b>s</span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="320" height="460"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">迷你限时台</h2>
      <p id="ovDesc">迷你硬核台面:重力更猛、翼板更短、球更小。90 秒倒计时内疯狂得分,掉球不扣分、0.5 秒后自动再发;撞击时钟靶 +4 秒!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(i){return document.getElementById(i);}
var elScore=$("score"),elTime=$("time"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var W=320,H=460,G=1500,MAXS=1150,TAU=6.2832;
var best=0;
try{best=parseInt(localStorage.getItem("mg927")||"0",10)||0;}catch(e){best=0;}
function saveBest(){try{localStorage.setItem("mg927",String(best));}catch(e){}}
var state="menu",score=0,lastT=0,shake=0;
var b=null,segs=[],circs=[],flL=null,flR=null;
var charging=false,charge=0,timeLeft=90,waitT=0,rolled=false;
var pops=[];
function S(x1,y1,x2,y2,o){var s={x1:x1,y1:y1,x2:x2,y2:y2,e:0.5,pad:2,kick:0,ow:0,cd:0};if(o)for(var k in o)s[k]=o[k];segs.push(s);return s;}
function C(x,y,r,o){var c={x:x,y:y,r:r,e:0.9,kick:0,cd:0,val:0};if(o)for(var k in o)c[k]=o[k];circs.push(c);return c;}
function mkFL(px,py,mir,len){len=len||48;return{px:px,py:py,len:len,rest:mir?Math.PI-0.55:0.55,up:mir?Math.PI+0.6:-0.6,ang:mir?Math.PI-0.55:0.55,om:0,spd:17,pressed:false};}
function reset(){
  segs=[];circs=[];pops=[];
  S(8,34,262,34);
  S(262,34,312,88);
  S(284,102,312,86,{ow:1,e:0.4});
  S(8,34,8,440);
  S(312,88,312,440);
  S(288,102,288,440);
  S(288,440,312,440,{e:0});
  S(46,336,68,398);
  S(274,336,252,398);
  S(62,330,100,392,{e:1.05,kick:260,col:"#f472b6"});
  S(258,330,220,392,{e:1.05,kick:260,col:"#f472b6"});
  S(100,392,108,410);
  S(220,392,212,410);
  C(70,220,17,{kick:300,val:120});
  C(250,220,17,{kick:300,val:120});
  C(160,120,16,{kick:340,val:150,onHit:function(){timeLeft+=4;pops.push({x:160,y:92,txt:"+4秒",life:1000});}});
  C(40,160,6,{e:0.8,val:30});
  C(280,160,6,{e:0.8,val:30});
  C(110,300,6,{e:0.8,val:30});
  C(210,300,6,{e:0.8,val:30});
  flL=mkFL(104,404,false);flR=mkFL(216,404,true);
}
function fseg(f){return{x1:f.px,y1:f.py,x2:f.px+f.len*Math.cos(f.ang),y2:f.py+f.len*Math.sin(f.ang),e:0.3,pad:4,om:f.om,ang:f.ang};}
function upFlip(f,h){
  var target=f.pressed?f.up:f.rest,prev=f.ang,step=f.spd*h,d=target-f.ang;
  if(Math.abs(d)<=step)f.ang=target;else f.ang+=(d>0?step:-step);
  f.om=(f.ang-prev)/h;
}
function addScore(v,x,y){
  score+=v;elScore.textContent=score;
  if(x!==undefined&&pops.length<8)pops.push({x:x,y:y,txt:"+"+v,life:800});
}
function toReady(){
  b={x:300,y:428,vx:0,vy:0,r:7};
  rolled=false;charging=false;charge=0;state="ready";waitT=0;
}
function launch(){
  b.vx=-8;b.vy=-(560+700*charge);
  charge=0;charging=false;rolled=false;state="playing";
}
function respawn(t){
  b={x:300,y:428,vx:0,vy:0,r:7};
  rolled=false;waitT=t+450;
}
function gameOver(msg){
  state="over";
  if(score>best){best=score;saveBest();}
  elBest.textContent=best;
  ovTitle.textContent="时间到!";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  reset();score=0;timeLeft=90;
  elScore.textContent=0;elTime.textContent=90;elBest.textContent=best;
  toReady();
  ov.classList.add("hide");
}
function collideSeg(s,now){
  var dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy;
  var t=L2>0?((b.x-s.x1)*dx+(b.y-s.y1)*dy)/L2:0;
  t=t<0?0:t>1?1:t;
  var px=s.x1+t*dx,py=s.y1+t*dy;
  var ex=b.x-px,ey=b.y-py,d2=ex*ex+ey*ey,R=b.r+(s.pad||0);
  if(d2>=R*R)return false;
  if(s.ow===1&&b.vy<0)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=0;}
  var nx=ex/d,ny=ey/d;
  b.x=px+nx*R;b.y=py+ny*R;
  var ox=0,oy=0;
  if(s.om){
    var segLen=Math.sqrt(L2),l=(t-(s.pv||0))*segLen;
    var sA=Math.sin(s.ang),cA=Math.cos(s.ang);
    ox=-s.om*l*sA;oy=s.om*l*cA;
  }
  var rvx=b.vx-ox,rvy=b.vy-oy,vn=rvx*nx+rvy*ny;
  if(vn<0){
    b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;
    if(s.kick&&now-s.cd>90){s.cd=now;b.vx+=s.kick*nx;b.vy+=s.kick*ny;addScore(40,px,py);}
  }
  return true;
}
function collideCirc(c,now){
  var ex=b.x-c.x,ey=b.y-c.y,R=b.r+c.r,d2=ex*ex+ey*ey;
  if(d2>=R*R)return false;
  var d=Math.sqrt(d2);
  if(d<0.001){d=0.001;ex=0.001;ey=-0.001;}
  var nx=ex/d,ny=ey/d;
  b.x=c.x+nx*R;b.y=c.y+ny*R;
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny;
    if(now-c.cd>120){
      c.cd=now;
      if(c.kick){b.vx+=c.kick*nx;b.vy+=c.kick*ny;}
      if(c.val)addScore(c.val,c.x,c.y-c.r-8);
      if(c.onHit)c.onHit();
    }
  }
  return true;
}
function stepBall(h,now){
  b.vy+=G*h;
  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(sp>MAXS){b.vx*=MAXS/sp;b.vy*=MAXS/sp;}
  b.x+=b.vx*h;b.y+=b.vy*h;
  var i;
  for(i=0;i<segs.length;i++)collideSeg(segs[i],now);
  collideSeg(fseg(flL),now);
  collideSeg(fseg(flR),now);
  for(i=0;i<circs.length;i++)collideCirc(circs[i],now);
  if(b.x<10){b.x=10;if(b.vx<0)b.vx=-b.vx;}
  if(b.x>310){b.x=310;if(b.vx>0)b.vx=-b.vx;}
  if(b.y<44&&!rolled){rolled=true;addScore(80,160,70);}
  if(b.x>292&&b.y>400&&b.vy>=-20){b.x=300;b.y=428;b.vx=0;b.vy=0;waitT=now+300;return false;}
  if(b.y>H+20){respawn(now);return false;}
  return false;
}
function frame(t){
  requestAnimationFrame(frame);
  if(!lastT)lastT=t;
  var dt=Math.min(40,t-lastT);lastT=t;
  if(state==="playing"||state==="ready"){upFlip(flL,dt/1000);upFlip(flR,dt/1000);}
  if(state==="ready"){
    if(charging){charge+=dt*0.0015;if(charge>1)charge=1;}
  }else if(state==="playing"){
    timeLeft-=dt/1000;
    elTime.textContent=Math.max(0,Math.ceil(timeLeft));
    if(timeLeft<=0){gameOver("90 秒耗尽,成绩定格!");}
    else if(waitT>0){
      if(t>waitT){waitT=0;b.vx=-8;b.vy=-920;}
    }else{
      var n=5,i;
      for(i=0;i<n;i++){stepBall(dt/1000/n,t);}
    }
  }
  if(shake>0.3)shake*=0.85;
  var j;
  for(j=pops.length-1;j>=0;j--){pops[j].life-=dt;pops[j].y-=dt*0.028;if(pops[j].life<=0)pops.splice(j,1);}
  draw(t);
}
function drawSegs(){
  ctx.lineCap="round";
  var i,s;
  for(i=0;i<segs.length;i++){
    s=segs[i];
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
    if(s.ow===1){ctx.setLineDash([5,4]);ctx.strokeStyle="#33406e";ctx.lineWidth=3;}
    else{ctx.setLineDash([]);ctx.strokeStyle=s.col||"#3d4370";ctx.lineWidth=4;}
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawFL(f){
  var x2=f.px+f.len*Math.cos(f.ang),y2=f.py+f.len*Math.sin(f.ang);
  ctx.strokeStyle="#f97316";ctx.lineWidth=10;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(f.px,f.py);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.fillStyle="#ffedd5";ctx.beginPath();ctx.arc(f.px,f.py,4,0,TAU);ctx.fill();
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle="#0b0e1a";ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(160,230,30,160,230,320);
  g.addColorStop(0,"rgba(249,115,22,0.10)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  drawSegs();
  var i,c,hot;
  for(i=0;i<circs.length;i++){
    c=circs[i];
    if(c.r<=6){ctx.fillStyle="#5b6398";ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();}
    else{
      hot=t-c.cd<130;
      ctx.fillStyle=hot?"#ffedd5":"#2b1a10";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,TAU);ctx.fill();
      ctx.strokeStyle=hot?"#f97316":"#8a5a2f";ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle=hot?"#f97316":"#fdba74";
      ctx.beginPath();ctx.arc(c.x,c.y,c.r*0.4,0,TAU);ctx.fill();
    }
  }
  ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillStyle="#fdba74";
  ctx.fillText("时钟",160,146);
  drawFL(flL);drawFL(flR);
  if(state==="ready"){ctx.fillStyle="#f97316";ctx.fillRect(294,432+charge*6,10,4);}
  if(b){
    var bg2=ctx.createRadialGradient(b.x-2,b.y-3,1,b.x,b.y,8);
    bg2.addColorStop(0,"#ffffff");bg2.addColorStop(1,"#fdba74");
    ctx.fillStyle=bg2;ctx.shadowColor="#f97316";ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.shadowBlur=0;
  }
  ctx.font="bold 13px system-ui";ctx.textAlign="center";
  for(i=0;i<pops.length;i++){
    ctx.globalAlpha=Math.min(1,pops[i].life/500);
    ctx.fillStyle="#fed7aa";ctx.fillText(pops[i].txt,pops[i].x,pops[i].y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){flL.pressed=true;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){flR.pressed=true;e.preventDefault();}
  else if(k===" "||k==="ArrowDown"){
    e.preventDefault();
    if(state==="ready")charging=true;
    else if(state==="menu"||state==="over")startGame();
  }else if(k==="Enter"&&(state==="menu"||state==="over"))startGame();
});
document.addEventListener("keyup",function(e){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A")flL.pressed=false;
  else if(k==="ArrowRight"||k==="d"||k==="D")flR.pressed=false;
  else if(k===" "||k==="ArrowDown"){
    if(state==="ready"&&charging)launch();
    charging=false;
  }
});
var tCharge=false;
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(state==="ready"){tCharge=true;charging=true;return;}
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=true;else flR.pressed=true;
  }
},{passive:false});
cv.addEventListener("touchend",function(e){
  e.preventDefault();
  if(state==="ready"){
    if(tCharge){tCharge=false;charge=Math.max(charge,0.55);launch();}
    return;
  }
  var r=cv.getBoundingClientRect(),i,x;
  for(i=0;i<e.changedTouches.length;i++){
    x=e.changedTouches[i].clientX-r.left;
    if(x<r.width/2)flL.pressed=false;else flR.pressed=false;
  }
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
elBest.textContent=best;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞拳乱舞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fb7185;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fb7185;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#211016;border-radius:10px;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fb7185}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#4ade80;font-weight:700}
.overlay button{margin-top:6px;background:#fb7185;color:#33080f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>飞拳乱舞</h1>
  <p class="hint">按住蓄力松开出拳 · 被击飞的地鼠还会撞飞同伴</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连锁 <b id="chain">0</b></span>
    <span>时间 <b id="time">60</b> 秒</span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">飞拳乱舞</h2>
      <p id="ovDesc">戴上拳击手套:按住蓄力、松手出拳,蓄得越久拳风范围越大!被命中的地鼠会带着物理轨迹飞上天,途中撞到别的地鼠还能连锁击飞(+15)。60 秒,打出最华丽的连锁!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=480,H=480;
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elChain=$("chain"),elTime=$("time"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var GAME_LEN=60;
var best=loadBest("mg_s218");
var state="menu",score=0,knocked=0,chainN=0,timeLeft=GAME_LEN,spawnT=350;
var holes=[],moles=[],punches=[],floats=[],rings=[];
var holding=false,holdX=0,holdY=0,holdT=0;
var lastT=0;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function initHoles(){
  holes=[];
  for(var r=0;r<3;r++)for(var c=0;c<3;c++)holes.push({x:90+c*150,y:160+r*132});
}
initHoles();

function freeHole(){
  var used={},i,cand=[];
  for(i=0;i<moles.length;i++)used[moles[i].hole]=1;
  for(i=0;i<holes.length;i++)if(!used[i])cand.push(i);
  if(!cand.length)return -1;
  return cand[(Math.random()*cand.length)|0];
}
function spawnMole(){
  var h=freeHole();
  if(h<0)return;
  moles.push({hole:h,state:"rise",frac:0,t:0,upMs:950,fly:null,rot:0});
}
function addFloat(x,y,txt,c){floats.push({x:x,y:y,txt:txt,c:c,t:0});}
function addRing(x,y,r,c){rings.push({x:x,y:y,r:r,c:c,t:0});}
function headPos(m){
  if(m.fly)return {x:m.fly.x,y:m.fly.y};
  var h=holes[m.hole];
  return {x:h.x,y:h.y-34*m.frac};
}
function knock(m,fx,fy,power,chain){
  var hp=headPos(m);
  var dx=hp.x-fx,dy=hp.y-fy;
  var len=Math.sqrt(dx*dx+dy*dy);
  var nx,ny;
  if(len<6){var a=Math.random()*Math.PI*2;nx=Math.cos(a);ny=Math.sin(a)*0.4;}
  else{nx=dx/len;ny=dy/len;}
  var sp=270+power*190+Math.random()*70;
  if(chain)sp*=0.85;
  m.fly={x:hp.x,y:hp.y,vx:nx*sp,vy:ny*sp-(250+power*150)};
  m.rot=0;
  if(chain){
    chainN++;
    score+=15;
    addFloat(hp.x,hp.y-30,"连锁 +15","#fbbf24");
  }else{
    score+=10;
    addFloat(hp.x,hp.y-30,"击飞 +10","#fb7185");
  }
  knocked++;
  updateHud();
}

function reset(){
  moles=[];punches=[];floats=[];rings=[];
  score=0;knocked=0;chainN=0;timeLeft=GAME_LEN;spawnT=350;
  holding=false;holdT=0;
  updateHud();
}
function startGame(){
  reset();
  state="playing";
  ov.classList.add("hide");
}
function endGame(){
  state="over";
  if(score>best){best=score;saveBest("mg_s218",best);}
  ovTitle.textContent="时间到!";
  ovDesc.textContent="击飞 "+knocked+" 只 · 连锁命中 "+chainN+" 次";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function updateHud(){
  elScore.textContent=score;
  elChain.textContent=chainN;
  elTime.textContent=Math.ceil(timeLeft);
  elBest.textContent=best;
}

function impact(x,y,power){
  var R=55+power*85;
  addRing(x,y,R,"rgba(251,113,133,0.9)");
  var i,m;
  for(i=0;i<moles.length;i++){
    m=moles[i];
    if(m.fly||m.state==="down"||m.frac<=0.3)continue;
    var hp=headPos(m);
    var dx=hp.x-x,dy=hp.y-y;
    if(dx*dx+dy*dy<R*R)knock(m,x,y,power,false);
  }
}

function update(dt){
  timeLeft-=dt/1000;
  if(timeLeft<=0){timeLeft=0;endGame();return;}
  if(holding)holdT+=dt;
  spawnT-=dt;
  var prog=1-timeLeft/GAME_LEN;
  if(spawnT<=0){
    var gap=Math.max(400,680-prog*280);
    spawnT=gap*(0.8+Math.random()*0.4);
    spawnMole();
    if(prog>0.5&&Math.random()<0.4)spawnMole();
  }
  var i,m,j,o;
  for(i=moles.length-1;i>=0;i--){
    m=moles[i];
    if(m.fly){
      m.fly.vy+=780*dt/1000;
      m.fly.x+=m.fly.vx*dt/1000;
      m.fly.y+=m.fly.vy*dt/1000;
      m.rot+=dt*0.012;
      for(j=0;j<moles.length;j++){
        o=moles[j];
        if(o===m||o.fly||o.state==="down"||o.frac<=0.3)continue;
        var oh=headPos(o);
        var ddx=oh.x-m.fly.x,ddy=oh.y-m.fly.y;
        if(ddx*ddx+ddy*ddy<48*48){
          knock(o,m.fly.x,m.fly.y,0.5,true);
        }
      }
      if(m.fly.y>H+90||m.fly.x<-90||m.fly.x>W+90)moles.splice(i,1);
      continue;
    }
    m.t+=dt;
    if(m.state==="rise"){
      m.frac=Math.min(1,m.t/130);
      if(m.frac>=1){m.state="up";m.t=0;}
    }else if(m.state==="up"){
      if(m.t>=m.upMs){m.state="down";m.t=0;}
    }else if(m.state==="down"){
      m.frac=1-Math.min(1,m.t/150);
      if(m.frac<=0)moles.splice(i,1);
    }
  }
  for(i=punches.length-1;i>=0;i--){
    var pc=punches[i];
    pc.t+=dt;
    if(pc.t>=pc.T){
      impact(pc.tx,pc.ty,pc.power);
      punches.splice(i,1);
    }
  }
  for(i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>800)floats.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>360)rings.splice(i,1);}
}

function drawMoleBodyAt(x,y,frac,rot){
  var bh=78,cy=y+10-78*frac;
  ctx.save();
  ctx.translate(x,y);
  if(rot)ctx.rotate(rot);
  ctx.beginPath();ctx.rect(-72,-172,144,184);ctx.clip();
  ctx.fillStyle="#a5682a";
  ctx.beginPath();ctx.ellipse(0,cy-y,34,bh/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#14100a";
  ctx.beginPath();ctx.arc(-11,cy-y-6,3.4,0,Math.PI*2);ctx.arc(11,cy-y-6,3.4,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#14100a";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-14,cy-y+2);ctx.lineTo(-6,cy-y+6);ctx.moveTo(-6,cy-y+2);ctx.lineTo(-14,cy-y+6);
  ctx.moveTo(6,cy-y+2);ctx.lineTo(14,cy-y+6);ctx.moveTo(14,cy-y+2);ctx.lineTo(6,cy-y+6);ctx.stroke();
  ctx.fillStyle="#f472b6";
  ctx.beginPath();ctx.ellipse(0,cy-y+8,5.5,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHoleBack(h){
  ctx.fillStyle="#150a10";
  ctx.beginPath();ctx.ellipse(h.x,h.y,48,18,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#5c2840";ctx.lineWidth=4;ctx.stroke();
}
function drawHoleFront(h){
  ctx.fillStyle="#150a10";
  ctx.beginPath();ctx.ellipse(h.x,h.y,48,18,0,0,Math.PI);ctx.fill();
}

function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#28141c");g.addColorStop(1,"#150a10");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  for(i=0;i<holes.length;i++)drawHoleBack(holes[i]);
  for(i=0;i<moles.length;i++){
    var m=moles[i];
    if(m.fly){
      ctx.save();
      ctx.translate(m.fly.x,m.fly.y);
      ctx.rotate(m.rot);
      ctx.translate(-m.fly.x,-m.fly.y);
      drawMoleBodyAt(m.fly.x,m.fly.y,1,0);
      ctx.restore();
    }else if(m.frac>0.02){
      drawMoleBodyAt(holes[m.hole].x,holes[m.hole].y,m.frac,0);
    }
  }
  for(i=0;i<holes.length;i++)drawHoleFront(holes[i]);
  for(i=0;i<punches.length;i++){
    var pc=punches[i],k=Math.min(1,pc.t/pc.T);
    var px=pc.sx+(pc.tx-pc.sx)*k;
    var py=pc.sy+(pc.ty-pc.sy)*k;
    ctx.strokeStyle="rgba(251,113,133,0.5)";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(pc.sx,pc.sy);ctx.lineTo(px,py);ctx.stroke();
    var gr=13+pc.power*9;
    ctx.fillStyle="#fb7185";
    ctx.beginPath();ctx.arc(px,py,gr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fecdd3";
    ctx.beginPath();ctx.arc(px-4,py-4,gr*0.35,0,Math.PI*2);ctx.fill();
  }
  for(i=0;i<rings.length;i++){
    var r=rings[i],k2=r.t/360;
    ctx.strokeStyle=r.c;ctx.lineWidth=4*(1-k2)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r*(0.25+k2),0,Math.PI*2);ctx.stroke();
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<floats.length;i++){
    var f=floats[i],fk=f.t/800;
    ctx.globalAlpha=1-fk;
    ctx.font="bold 19px sans-serif";
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y-34*fk);
    ctx.globalAlpha=1;
  }
  if(holding&&state==="playing"){
    var pw=Math.min(1,holdT/400);
    ctx.strokeStyle="rgba(251,113,133,0.9)";
    ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(holdX,holdY,20+pw*40,0,Math.PI*2);ctx.stroke();
    ctx.font="bold 14px sans-serif";
    ctx.fillStyle="#fb7185";
    ctx.fillText("蓄力 "+Math.round(pw*100)+"%",holdX,holdY-34-pw*46);
  }
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,W,26);
  ctx.fillStyle="#fb7185";ctx.fillRect(0,0,W*timeLeft/GAME_LEN,26);
  ctx.font="bold 14px sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillStyle="#0f1220";
  ctx.fillText("剩余 "+Math.ceil(timeLeft)+" 秒 · 按住蓄力,松手出拳",10,14);
}

function ptFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var cx,cy;
  if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
  else{cx=e.clientX;cy=e.clientY;}
  return {x:(cx-rect.left)*W/rect.width,y:(cy-rect.top)*H/rect.height};
}
function press(p){
  if(state!=="playing")return;
  holding=true;
  holdX=p.x;holdY=p.y;holdT=0;
}
function release(p){
  if(state!=="playing"||!holding){holding=false;return;}
  holding=false;
  var power=Math.min(1,holdT/400);
  punches.push({sx:W/2,sy:H+30,tx:p.x,ty:p.y,t:0,T:130+power*90,power:power});
}
cv.addEventListener("mousedown",function(e){e.preventDefault();press(ptFromEvent(e));});
cv.addEventListener("mouseup",function(e){e.preventDefault();release(ptFromEvent(e));});
cv.addEventListener("mousemove",function(e){
  if(!holding)return;
  var p=ptFromEvent(e);
  holdX=p.x;holdY=p.y;
});
cv.addEventListener("touchstart",function(e){e.preventDefault();press(ptFromEvent(e));},{passive:false});
cv.addEventListener("touchmove",function(e){
  if(!holding)return;
  e.preventDefault();
  var p=ptFromEvent(e);
  holdX=p.x;holdY=p.y;
},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();release(ptFromEvent(e));},{passive:false});
btnGo.addEventListener("click",startGame);
document.addEventListener("keydown",function(e){
  if(state!=="playing"&&(e.key===" "||e.key==="Enter")){e.preventDefault();startGame();}
});

function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  if(state==="playing")update(dt);
  draw();
}
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

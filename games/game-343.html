<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六彩和弦</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#c4b5fd;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#c4b5fd;font-size:16px}
.gbtn{background:#2a1f4d;color:#c4b5fd;border:1px solid #c4b5fd;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#c4b5fd;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:0 auto;touch-action:manipulation}
.pad{aspect-ratio:1/1.15;border-radius:14px;cursor:pointer;transition:transform .07s,box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:13px;color:rgba(255,255,255,.35);font-weight:700}
.pad:active{transform:scale(.94)}
.p0{background:#3d1114;border:2px solid #991b1b}.p0.lit{background:#ef4444;border-color:#fecaca;box-shadow:0 0 28px rgba(239,68,68,.85)}
.p1{background:#3a1d08;border:2px solid #c2410c}.p1.lit{background:#f97316;border-color:#fed7aa;box-shadow:0 0 28px rgba(249,115,22,.85)}
.p2{background:#39300a;border:2px solid #a16207}.p2.lit{background:#eab308;border-color:#fef08a;box-shadow:0 0 28px rgba(234,179,8,.85)}
.p3{background:#0d2f1a;border:2px solid #166534}.p3.lit{background:#22c55e;border-color:#bbf7d0;box-shadow:0 0 28px rgba(34,197,94,.85)}
.p4{background:#082f36;border:2px solid #0e7490}.p4.lit{background:#06b6d4;border-color:#a5f3fc;box-shadow:0 0 28px rgba(6,182,212,.85)}
.p5{background:#2a1145;border:2px solid #7e22ce}.p5.lit{background:#a855f7;border-color:#e9d5ff;box-shadow:0 0 28px rgba(168,85,247,.85)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#c4b5fd;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#c4b5fd;color:#2a1f4d;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>六彩和弦</h1>
  <p class="hint">六色进阶版:2×3 排列的六块音板,各自对应五声音阶的一个音。序列更长、组合更多,记忆负担直线上升。支持键盘 1-6。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>序列长 <b id="len">0</b></span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="pads" id="pads">
    <div class="pad p0">宫 1</div>
    <div class="pad p1">商 2</div>
    <div class="pad p2">角 3</div>
    <div class="pad p3">徵 4</div>
    <div class="pad p4">羽 5</div>
    <div class="pad p5">变 6</div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">六彩和弦</h2>
    <p id="ovDesc">四个键不够玩?这里直接上六块音板,配五声音阶音色。选择多了,序列长起来才真正叫「和弦」。看看你的大脑能扩容到几步。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg343_best",FREQ=[261.63,293.66,329.63,392.00,440.00,523.25],GAP=620,FLASH=380;
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var padEls=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elLen=$("len"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.3;v=v==null?0.15:v;o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var box=$("pads"),list=box.querySelectorAll(".pad");for(var i=0;i<list.length;i++){padEls.push(list[i]);list[i].dataset.i=String(i);}})();
function flash(i,ms){var el=padEls[i];el.classList.add("lit");tone(FREQ[i]);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||FLASH));}
function clearLit(){for(var i=0;i<6;i++)padEls[i].classList.remove("lit");}
function rnd(){var n;do{n=(Math.random()*6)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function updateHud(){elLv.textContent=level;elLen.textContent=seq.length;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";setMsg("六块音板,看清听准…");var i=0;(function step(){if(i>=seq.length){state="input";pos=0;setMsg("轮到你,按同样顺序复述!");return;}flash(seq[i]);i++;timers.push(setTimeout(step,GAP));})();}
function nextRound(){seq.push(rnd());updateHud();playSeq();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;level=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,600));}
function winStep(){level++;state="wait";setMsg("通过!继续加长…");updateHud();timers.push(setTimeout(nextRound,800));}
function fail(){clearTimers();clearLit();state="over";tone(92,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="挑战结束";
ovDesc.textContent="六色序列在第 "+seq.length+" 步断了链。试着给每一步配个口头昵称,会记得更稳。";
ovScore.style.display="block";ovScore.textContent="成功复述 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flash(i,200);if(seq[pos]===i){pos++;if(pos>=seq.length)winStep();}else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
$("pads").addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;
if(k==="1")press(0);else if(k==="2")press(1);else if(k==="3")press(2);
else if(k==="4")press(3);else if(k==="5")press(4);else if(k==="6")press(5);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

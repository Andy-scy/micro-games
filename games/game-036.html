<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旋转圆阵</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center}
h1{font-size:22px;margin:14px 0 2px;color:#ffd166}
#tip{margin:0 0 10px;font-size:13px;color:#9aa3c7;text-align:center;padding:0 12px}
#wrap{position:relative;width:min(96vw,480px)}
canvas{display:block;width:100%;background:#151a30;border-radius:14px;touch-action:none}
#ov{position:absolute;inset:0;background:rgba(8,10,24,.9);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#ov.hide{display:none}
#ov h2{margin:0;font-size:26px;color:#ffd166}
#ov p{margin:0;font-size:14px;color:#c3c9e8;line-height:1.8;white-space:pre-line}
#ov button{margin-top:8px;padding:10px 36px;font-size:16px;border:none;border-radius:999px;background:#ffd166;color:#1a1d33;font-weight:bold;cursor:pointer;font-family:inherit}
#ov button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>旋转圆阵</h1>
<p id="tip">三层砖环绕圆心公转,方向快慢各不同! · 空格或点击发球 · 打碎全部 36 块即胜</p>
<div id="wrap">
<canvas id="cv" width="480" height="600"></canvas>
<div id="ov"><h2 id="ovT">旋转圆阵</h2><p id="ovP">砖块排成三层圆环,绕中心不停旋转
内外圈转向与快慢都不同,抓准时机出手</p><button id="ovB">开始游戏</button></div>
</div>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const ov = document.getElementById("ov");
const ovT = document.getElementById("ovT");
const ovP = document.getElementById("ovP");
const ovB = document.getElementById("ovB");

const COLORS = ["#ef476f", "#ffd166", "#4cc9f0"];
const CX = W / 2, CY = 250;
const SPEED = 310;
const RINGS = [
  { r: 64, n: 8, sp: 0.55, bw: 26, bh: 14 },
  { r: 106, n: 12, sp: -0.4, bw: 26, bh: 14 },
  { r: 148, n: 16, sp: 0.3, bw: 26, bh: 14 }
];

let state = "menu";
let score = 0, lives = 3, rot = 0;
let bricks = [], balls = [];
const pad = { x: W / 2, y: H - 40, w: 92, h: 14 };
const keys = {};
let last = 0;

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function buildBricks() {
  bricks = [];
  for (let g = 0; g < RINGS.length; g++) {
    for (let i = 0; i < RINGS[g].n; i++) {
      bricks.push({ ring: g, idx: i, w: RINGS[g].bw, h: RINGS[g].bh, hp: 1, x: 0, y: 0, color: COLORS[g] });
    }
  }
}

function placeBricks() {
  for (const br of bricks) {
    const rg = RINGS[br.ring];
    const a = rot * rg.sp + br.idx * Math.PI * 2 / rg.n;
    br.x = CX + Math.cos(a) * rg.r - br.w / 2;
    br.y = CY + Math.sin(a) * rg.r - br.h / 2;
  }
}

function resetBall() {
  balls = [{ x: pad.x, y: pad.y - 10, vx: 0, vy: 0, r: 7, stuck: true }];
}

function launch() {
  for (const b of balls) {
    if (b.stuck) {
      b.stuck = false;
      const a = Math.random() * 0.6 - 0.3;
      b.vx = SPEED * Math.sin(a);
      b.vy = -SPEED * Math.cos(a);
    }
  }
}

function bouncePad(b) {
  const rel = clamp((b.x - pad.x) / (pad.w / 2), -1, 1);
  const ang = rel * 1.1;
  b.vx = SPEED * Math.sin(ang);
  b.vy = -SPEED * Math.cos(ang);
  b.y = pad.y - b.r;
}

function update(dt) {
  if (keys.ArrowLeft) pad.x -= 430 * dt;
  if (keys.ArrowRight) pad.x += 430 * dt;
  pad.x = clamp(pad.x, pad.w / 2, W - pad.w / 2);

  rot += dt;
  placeBricks();

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.stuck) { b.x = pad.x; b.y = pad.y - b.r - 1; continue; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
    if (b.vy > 0 && b.y + b.r >= pad.y && b.y - b.r <= pad.y + pad.h && Math.abs(b.x - pad.x) <= pad.w / 2 + b.r) {
      bouncePad(b);
    }
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        const bcx = br.x + br.w / 2, bcy = br.y + br.h / 2;
        let dx = b.x - bcx, dy = b.y - bcy;
        let d = Math.hypot(dx, dy);
        if (d < 0.001) { dx = 0; dy = -1; d = 1; }
        const nx = dx / d, ny = dy / d;
        const dot = b.vx * nx + b.vy * ny;
        if (dot < 0) {
          b.vx -= 2 * dot * nx;
          b.vy -= 2 * dot * ny;
        }
        b.x = bcx + nx * (br.w / 2 + b.r + 1);
        b.y = bcy + ny * (br.h / 2 + b.r + 1);
        br.hp = 0;
        score += 10;
        break;
      }
    }
    if (b.y > H + 30) balls.splice(i, 1);
  }

  if (balls.length === 0) {
    lives--;
    if (lives <= 0) { endGame(false); return; }
    resetBall();
  }
  if (bricks.every(br => br.hp <= 0)) endGame(true);
}

function endGame(win) {
  state = "over";
  ovT.textContent = win ? "圆阵崩解!" : "游戏结束";
  ovP.textContent = "最终得分:" + score + (win ? "\n旋转的堡垒也挡不住你!" : "\n剩余砖块 " + bricks.filter(br => br.hp > 0).length + " 块");
  ovB.textContent = "再来一局";
  ov.classList.remove("hide");
}

function startGame() {
  score = 0; lives = 3; rot = 0;
  pad.x = W / 2;
  buildBricks();
  placeBricks();
  resetBall();
  ov.classList.add("hide");
  state = "play";
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,.08)";
  ctx.lineWidth = 2;
  for (const rg of RINGS) {
    ctx.beginPath();
    ctx.arc(CX, CY, rg.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = "#1f2547";
  ctx.beginPath();
  ctx.arc(CX, CY, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#3d4666";
  ctx.stroke();
  for (const br of bricks) {
    if (br.hp <= 0) continue;
    ctx.fillStyle = br.color;
    rr(br.x, br.y, br.w, br.h, 4);
  }
  ctx.fillStyle = "#ffffff";
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#ffd166";
  rr(pad.x - pad.w / 2, pad.y, pad.w, pad.h, 7);
  ctx.font = "bold 15px system-ui, sans-serif";
  ctx.fillStyle = "#e8eaf6";
  ctx.textAlign = "left";
  ctx.fillText("得分 " + score, 12, 32);
  ctx.textAlign = "right";
  ctx.fillText("生命 " + lives, W - 12, 32);
  ctx.textAlign = "center";
  ctx.fillStyle = "#9aa3c7";
  ctx.fillText("剩余 " + bricks.filter(br => br.hp > 0).length + " / " + bricks.length, W / 2, 32);
}

function pointerX(e) {
  const rect = cv.getBoundingClientRect();
  return (e.clientX - rect.left) * (W / rect.width);
}

cv.addEventListener("mousemove", e => { pad.x = clamp(pointerX(e), pad.w / 2, W - pad.w / 2); });
cv.addEventListener("mousedown", () => { if (state === "play") launch(); });
cv.addEventListener("touchstart", e => {
  e.preventDefault();
  pad.x = clamp(pointerX(e.touches[0]), pad.w / 2, W - pad.w / 2);
  if (state === "play") launch();
}, { passive: false });
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  pad.x = clamp(pointerX(e.touches[0]), pad.w / 2, W - pad.w / 2);
}, { passive: false });

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === " ") e.preventDefault();
  keys[e.key] = true;
  if (e.key === " " && state === "play") launch();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

ovB.addEventListener("click", startGame);

buildBricks();
placeBricks();
resetBall();

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - last) / 1000, 0.033);
  last = ts;
  if (state === "play") update(dt);
  draw();
}
requestAnimationFrame(loop);
</script>
</body>
</html>

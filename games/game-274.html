<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尖刺长廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fb7185;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#fb7185;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fb7185}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#fb7185;color:#3d0713;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>尖刺长廊</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 看准尖刺节奏,3 条命走出迷宫</p>
  <div class="hud">
    <span>生命 <b id="lives">♥♥♥</b></span>
    <span>尖刺机关 <b>8</b></span>
    <span>用时 <b id="time">0.0s</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">尖刺长廊</h2>
      <p id="ovDesc">8 组尖刺机关藏在走廊里,按各自的节奏循环:红色暗点=收起(安全),黄色闪烁=即将弹出,红刺全开=致命。踩中扣 1 条命并短暂无敌。看准节奏再落脚,把 3 条命完整带向绿色出口!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">闯入长廊</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
function $(id){return document.getElementById(id);}
var elLives=$("lives"),elTime=$("time");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s274");
var state="menu";
var P=2.4;
var grid,player,exitCell,spikes,lives,invulnT,elapsed,pulse;

function loadBest(k){try{return parseFloat(localStorage.getItem(k)||"0")||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function bfs(sx,sy){
  var dist=[],i,j,q=[],head=0,dirs=[[1,0],[-1,0],[0,1],[0,-1]],k;
  for(j=0;j<ROWS;j++){dist.push(new Array(COLS));for(i=0;i<COLS;i++)dist[j][i]=-1;}
  dist[sy][sx]=0;q.push([sx,sy]);
  while(head<q.length){
    var c=q[head];head++;
    for(k=0;k<4;k++){
      var nx=c[0]+dirs[k][0],ny=c[1]+dirs[k][1];
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
      if(grid[ny][nx]===1||dist[ny][nx]!==-1)continue;
      dist[ny][nx]=dist[c[1]][c[0]]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}
function reset(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  var dist=bfs(1,1),cells=[],x,y;
  for(y=1;y<ROWS-1;y++)for(x=1;x<COLS-1;x++){
    if(grid[y][x]===0&&dist[y][x]>=4&&!(x===exitCell.x&&y===exitCell.y))cells.push({x:x,y:y});
  }
  spikes=[];
  var guard=0;
  while(spikes.length<8&&cells.length&&guard<400){
    guard++;
    var i=(Math.random()*cells.length)|0,c=cells[i],bad=false,j;
    for(j=0;j<spikes.length;j++)if(spikes[j].x===c.x&&spikes[j].y===c.y)bad=true;
    if(!bad)spikes.push({x:c.x,y:c.y,phase:Math.random()*P});
    cells.splice(i,1);
  }
  lives=3;invulnT=0;elapsed=0;pulse=0;
  updateHud();
}
function updateHud(){
  var h="",i;
  for(i=0;i<lives;i++)h+="♥";
  elLives.textContent=h||"--";
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  if(nx===exitCell.x&&ny===exitCell.y){win();return;}
  checkHit();
}
function checkHit(){
  if(invulnT>0)return;
  var i;
  for(i=0;i<spikes.length;i++){
    var s=spikes[i];
    if(s.x!==player.x||s.y!==player.y)continue;
    var f=(elapsed+s.phase)%P;
    if(f>=1.6){
      lives--;
      invulnT=1.6;
      updateHud();
      if(lives<=0)lose();
      return;
    }
  }
}
function lose(){
  state="over";
  ovTitle.textContent="被尖刺放倒了!";
  ovDesc.textContent="尖刺的节奏是固定的:暗点是安全期,黄闪是预警,红刺全开千万别踩。数着拍子走过去。";
  ovScore.style.display="block";
  ovScore.textContent="坚持了 "+elapsed.toFixed(1)+"s";
  btnGo.textContent="再试一次";
  ov.classList.remove("hide");
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||elapsed<best){best=elapsed;saveBest("mg_s274",best);isNew=true;}
  ovTitle.textContent="带伤逃出!";
  ovDesc.textContent=isNew?"新纪录!你的走位像在跳一支刺舞。":"踩着尖刺的间隙,你毫发无伤地飘出了出口。";
  ovScore.style.display="block";
  ovScore.textContent="用时 "+elapsed.toFixed(1)+"s · 剩余生命 "+lives+" · 最快 "+(best>0?best.toFixed(1)+"s":"--");
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
  updateHud();
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawWall(x,y){
  ctx.fillStyle="#2b2233";
  ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  ctx.fillStyle="#3a2c46";
  ctx.fillRect(x*CELL,y*CELL,CELL,3);
}
function drawSpike(s){
  var f=(elapsed+s.phase)%P;
  var cx=s.x*CELL+CELL/2,cy=s.y*CELL+CELL/2;
  if(f<1.2){
    ctx.fillStyle="rgba(248,113,113,0.35)";
    ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fill();
  }else if(f<1.6){
    var bl=Math.floor(f*20)%2===0;
    ctx.fillStyle=bl?"#fde047":"rgba(253,224,71,0.4)";
    ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  }else{
    var h=6+((f-1.6)/0.8)*6;
    ctx.fillStyle="#fb7185";
    ctx.shadowColor="#fb7185";ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.moveTo(cx,cy-h);ctx.lineTo(cx+3.4,cy+4);ctx.lineTo(cx-3.4,cy+4);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-h,cy);ctx.lineTo(cx+4,cy+3.4);ctx.lineTo(cx+4,cy-3.4);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+h,cy);ctx.lineTo(cx-4,cy+3.4);ctx.lineTo(cx-4,cy-3.4);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx,cy+h);ctx.lineTo(cx+3.4,cy-4);ctx.lineTo(cx-3.4,cy-4);
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
  }
}
function draw(){
  var x,y,i;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(grid[y][x]===1)drawWall(x,y);
  }
  for(i=0;i<spikes.length;i++)drawSpike(spikes[i]);
  var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
  var pr=8+Math.sin(pulse)*2;
  ctx.fillStyle="#4ade80";
  ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  var blink=invulnT>0&&Math.floor(elapsed*10)%2===0;
  if(!blink){
    var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
    ctx.fillStyle="#fecdd3";
    ctx.shadowColor="#fb7185";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#0b0e1a";
    ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(state==="playing"){
    elapsed+=dt/1000;
    if(invulnT>0)invulnT-=dt/1000;
    elTime.textContent=elapsed.toFixed(1)+"s";
    checkHit();
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

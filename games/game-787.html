<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紧线时刻</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1220;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;user-select:none}
h1{font-size:21px;color:#7fd4ff;margin:2px 0}
.tip{font-size:13px;color:#9aa3b5;text-align:center;max-width:520px;line-height:1.6;margin-bottom:6px}
#hud{display:flex;gap:16px;font-size:15px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#hud b{color:#ffd75e}
canvas{border-radius:14px;max-width:96vw;touch-action:none;display:block}
#ov{position:fixed;inset:0;background:rgba(6,8,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:9}
#ov h2{font-size:26px;color:#ffd75e}
#ov p{color:#c8cfdd;font-size:15px;max-width:380px;line-height:1.8}
#ov button{background:linear-gradient(180deg,#5db8ff,#2f8fe0);color:#04101f;border:0;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<h1>紧线时刻</h1>
<p class="tip">按住收线,张力会持续上升;鱼发力冲刺时收线,张力暴涨!松手降温,鱼却会拖线游远。盯住张力条,红了就松——连过三条鱼即胜。</p>
<div id="hud"><span>得分 <b id="s1">0</b></span><span>时间 <b id="s2">80</b> 秒</span><span>进度 <b id="s3">0/3</b></span></div>
<canvas id="cv" width="480" height="560"></canvas>
<div id="ov"><h2 id="ot">紧线时刻</h2><p id="op">一条条大鱼轮番试探你的钓技。<br>张力条到顶线就断,放任不管鱼就拖线逃走。<br>看准它发力的前摇(黄色感叹号),先松后收!</p><button id="ob">抛竿开钓</button></div>
<script>
(function(){
var cv=document.getElementById('cv'),X=cv.getContext('2d');
var ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),ob=document.getElementById('ob');
var eS=document.getElementById('s1'),eT=document.getElementById('s2'),eP=document.getElementById('s3');
var W=cv.width,H=cv.height,WL=190;
var state='ready',tl=80,score=0,msg='',held=false;
var fishIdx=1,dist=240,tension=15,fstate='calm',ft=1.2,phase='soak',pt=0,fx=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function resetFish(){
  dist=240;tension=15;fstate='calm';ft=1.2;phase='soak';pt=0;
  msg='第 '+fishIdx+' 条鱼咬钩了!';
}
function finish(win,why){
  state='over';held=false;ob.textContent='再来一轮';
  ot.textContent=win?'三鱼连岸!':'断竿收场…';
  op.innerHTML=why+'<br>得分 <b style="color:#ffd75e">'+score+'</b>'+(win?'<br>你的名字配得上「紧线大师」。':'<br>下一把:红前松手,黄前蓄力。');
  ov.classList.remove('hide');
}
function start(){
  score=0;tl=80;fishIdx=1;held=false;resetFish();
  state='play';ov.classList.add('hide');
}
function update(dt){
  if(state!=='play')return;
  tl-=dt;
  if(tl<=0){tl=0;finish(false,'时间到,还有大鱼没请上岸…');return}
  if(phase==='soak'){
    pt+=dt;
    if(pt>=0.8)phase='fight';
    return;
  }
  ft-=dt;
  var be=[0,3.4,2.7,2.1][fishIdx];
  if(fstate==='calm'&&ft<=0){fstate='tele';ft=0.4}
  else if(fstate==='tele'&&ft<=0){fstate='burst';ft=rnd(0.9,1.3)}
  else if(fstate==='burst'&&ft<=0){fstate='calm';ft=rnd(be*0.7,be*1.2)}
  var pull=fstate==='burst'?1.6:0.5;
  if(held){
    dist-=62*dt;
    tension+=(24+pull*26)*dt;
  }else{
    dist+=(16+pull*30)*dt;
    tension-=36*dt;
  }
  tension=clamp(tension,0,100);
  dist=clamp(dist,0,340);
  if(fstate==='burst')msg='鱼在冲刺!快松线!';
  else if(fstate==='tele')msg='它要发力了,预备松线…';
  else msg=held?'收线中…张力在涨':'按住空格 / 屏幕 收线';
  if(tension>=100){finish(false,'崩——!鱼线断了…');return}
  if(dist>=340){finish(false,'鱼拖着一整轴线游走了…');return}
  if(dist<=0){
    score+=120;fishIdx++;
    if(fishIdx>3){finish(true,'三条大鱼全部上岸!');return}
    resetFish();
  }
}
function bar(y,label,val,col){
  X.fillStyle='rgba(200,215,235,.85)';X.font='12px system-ui';X.textAlign='left';
  X.fillText(label,16,y-6);
  X.fillStyle='rgba(10,16,32,.8)';X.fillRect(70,y-18,W-140,16);
  X.fillStyle=col;X.fillRect(70,y-18,(W-140)*clamp(val,0,100)/100,16);
  X.strokeStyle='rgba(127,212,255,.4)';X.lineWidth=1;X.strokeRect(70,y-18,W-140,16);
}
function draw(){
  var g=X.createLinearGradient(0,0,0,WL);g.addColorStop(0,'#151c36');g.addColorStop(1,'#232a4d');
  X.fillStyle=g;X.fillRect(0,0,W,WL);
  bar(30,'张力',tension,tension<50?'#63c97a':(tension<80?'#d9c14f':'#e05555'));
  bar(58,'鱼距',dist/340*100,'#4fa8e0');
  var g2=X.createLinearGradient(0,WL,0,H);g2.addColorStop(0,'#14365e');g2.addColorStop(1,'#091631');
  X.fillStyle=g2;X.fillRect(0,WL,W,H-WL);
  var t=Date.now()*0.001,i,xx,yy;
  X.strokeStyle='rgba(127,212,255,.15)';X.lineWidth=2;
  for(i=0;i<3;i++){X.beginPath();for(xx=0;xx<=W;xx+=16){yy=WL+50+i*95+Math.sin(xx*0.04+t*(1+i*0.3))*5;if(xx===0)X.moveTo(xx,yy);else X.lineTo(xx,yy)}X.stroke()}
  fx=90+dist;
  var fy=WL+130+Math.sin(t*2.4)*9+(fstate==='burst'?rnd(-5,5):0);
  X.fillStyle='#dfe6f2';X.fillRect(30,WL-16,10,60);
  X.fillStyle='#4a3a26';X.fillRect(6,WL+40,88,16);
  X.strokeStyle='rgba(230,238,246,.75)';X.lineWidth=2;
  X.beginPath();X.moveTo(35,WL-14);X.quadraticCurveTo((35+fx)/2,WL-46,fx,fy-14);X.stroke();
  X.strokeStyle=tension>80?'rgba(255,107,107,.9)':'rgba(230,238,246,.5)';
  X.beginPath();X.moveTo(fx,fy-14);X.lineTo(fx,fy);X.stroke();
  X.fillStyle=fstate==='burst'?'#7f5a5a':'#3f6e8f';
  X.beginPath();X.ellipse(fx,fy,30,13,Math.sin(t*3)*0.12,0,7);X.fill();
  X.beginPath();X.moveTo(fx+26,fy);X.lineTo(fx+46,fy-10);X.lineTo(fx+46,fy+10);X.closePath();X.fill();
  X.fillStyle='#0f1220';X.beginPath();X.arc(fx-16,fy-3,2.8,0,7);X.fill();
  if(fstate==='burst'){X.fillStyle='#ff6b6b';X.font='bold 22px system-ui';X.textAlign='center';X.fillText('!!!',fx,fy-28)}
  else if(fstate==='tele'){X.fillStyle='#ffd75e';X.font='bold 20px system-ui';X.textAlign='center';X.fillText('!',fx,fy-28)}
  X.fillStyle='#ffe9a3';X.font='bold 16px system-ui';X.textAlign='center';X.fillText(msg,W/2,132);
  X.fillStyle='#7fd4ff';X.font='bold 14px system-ui';X.fillText('第 '+fishIdx+' / 3 条',W/2,158);
}
document.addEventListener('keydown',function(e){
  if(e.key===' '||e.code==='Space'){
    e.preventDefault();
    if(state!=='play')start();else held=true;
  }
});
document.addEventListener('keyup',function(e){
  if(e.key===' '||e.code==='Space')held=false;
});
cv.addEventListener('pointerdown',function(){if(state==='play')held=true});
window.addEventListener('pointerup',function(){held=false});
window.addEventListener('pointercancel',function(){held=false});
ob.addEventListener('click',start);
var last=0;
function loop(ts){
  var dt=(ts-last)/1000;last=ts;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  eS.textContent=score;eT.textContent=Math.ceil(tl);eP.textContent=(fishIdx-1)+'/3';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

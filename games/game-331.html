<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神灯指引</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fde047;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fde047;font-size:16px}
.gbtn{background:#3a3403;color:#fde047;border:1px solid #fde047;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#fde047;font-size:13px;min-height:18px;text-align:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto;touch-action:manipulation}
.cell{aspect-ratio:1/1;border-radius:11px;background:#111527;border:1px solid #252c52;cursor:pointer;transition:background .18s,box-shadow .18s,transform .08s}
.cell.on{background:linear-gradient(145deg,#fef9c3,#eab308);border-color:#fefce8;box-shadow:0 0 14px rgba(253,224,71,.5)}
.cell.hintGlow{animation:hint 1s ease-in-out infinite}
@keyframes hint{0%,100%{outline:3px solid rgba(253,224,71,.9);outline-offset:2px}50%{outline:3px solid rgba(253,224,71,.25);outline-offset:6px}}
.cell.cur{outline:2px solid rgba(253,224,71,.6);outline-offset:2px}
.cell:active{transform:scale(.92)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#fde047;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:18px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#fde047;color:#3a3403;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>神灯指引</h1>
  <p class="hint">点亮全部 4×4 灯即可通关。迷路时按「神灯指引」,真正的求解器会算出当前最优的一步并金光标注——但每次指引扣 100 分,自己想通才是高手。</p>
  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>指引 <b id="hints">0</b> 次</span>
    <span>得分 <b id="score">1200</b></span>
    <button class="gbtn" id="btnHint">神灯指引 -100</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">神灯指引</h2>
    <p id="ovDesc">这是一盘自带神灯的点灯:神灯背后是货真价实的线性方程求解器,给出的每一步都能让局面更接近全亮。满分 1200,每走一步 -15,每次指引 -100,看看你能守住多少分。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始挑战</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var N=4,CNT=16;
var gridEl=$("grid"),elMoves=$("moves"),elHints=$("hints"),elScore=$("score"),elMsg=$("msg"),btnHint=$("btnHint");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var cells=[],board=[],moves=0,hints=0,state="menu",hintCell=-1;

function setMsg(s){elMsg.textContent=s;clearTimeout(setMsg.t);setMsg.t=setTimeout(function(){elMsg.textContent="";},2600);}
function build(){
  gridEl.innerHTML="";cells=[];
  for(var i=0;i<CNT;i++){
    var d=document.createElement("div");
    d.className="cell";d.dataset.i=i;
    gridEl.appendChild(d);cells.push(d);
  }
}
function paint(i){
  var cl="cell";
  if(board[i])cl+=" on";
  cells[i].className=cl;
}
function paintAll(){for(var i=0;i<CNT;i++)paint(i);}
function crossList(r,c){
  var list=[r*N+c];
  if(r>0)list.push((r-1)*N+c);
  if(r<N-1)list.push((r+1)*N+c);
  if(c>0)list.push(r*N+c-1);
  if(c<N-1)list.push(r*N+c+1);
  return list;
}
function press(r,c){
  var list=crossList(r,c),i;
  for(i=0;i<list.length;i++){board[list[i]]^=1;paint(list[i]);}
  moves++;
}
function litCount(){var n=0,i;for(i=0;i<CNT;i++)if(board[i])n++;return n;}
function pickCells(k){
  var arr=[],i;
  for(i=0;i<CNT;i++)arr.push(i);
  for(i=arr.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr.slice(0,k);
}
function calcScore(){
  return Math.max(0,1200-moves*15-hints*100);
}
function updateHud(){
  elMoves.textContent=moves;elHints.textContent=hints;
  elScore.textContent=calcScore();
}
function solveBoard(){
  var need=[],i,q;
  for(i=0;i<CNT;i++)need.push(board[i]^1);
  var rows=[];
  for(i=0;i<CNT;i++){
    var list=crossList((i/N)|0,i%N),mask=0;
    for(q=0;q<list.length;q++)mask|=1<<list[q];
    rows.push([mask,need[i]]);
  }
  var where=[],rank=0,col,k;
  for(col=0;col<CNT;col++){
    var sel=-1;
    for(k=rank;k<CNT;k++){if(rows[k][0]&(1<<col)){sel=k;break;}}
    if(sel<0)continue;
    var tmp=rows[rank];rows[rank]=rows[sel];rows[sel]=tmp;
    for(k=0;k<CNT;k++){
      if(k!==rank&&(rows[k][0]&(1<<col))){
        rows[k][0]^=rows[rank][0];
        rows[k][1]^=rows[rank][1];
      }
    }
    where[col]=rank;rank++;
  }
  for(k=0;k<CNT;k++)if(rows[k][0]===0&&rows[k][1]===1)return null;
  var x=[];
  for(i=0;i<CNT;i++)x.push(0);
  for(col=0;col<CNT;col++){
    if(where[col]!==undefined)x[col]=rows[where[col]][1];
  }
  var free=[];
  for(col=0;col<CNT;col++)if(where[col]===undefined)free.push(col);
  var basis=[];
  for(i=0;i<free.length;i++){
    var f=free[i],v=[];
    for(q=0;q<CNT;q++)v.push(0);
    v[f]=1;
    var c2;
    for(c2=0;c2<CNT;c2++){
      if(where[c2]!==undefined)v[c2]=(rows[where[c2]][0]>>f)&1;
    }
    basis.push(v);
  }
  var bestX=null,bestW=99,m,b;
  for(m=0;m<(1<<basis.length);m++){
    var cand=x.slice(),w=0;
    for(b=0;b<basis.length;b++){
      if(m&(1<<b)){
        for(q=0;q<CNT;q++)cand[q]^=basis[b][q];
      }
    }
    for(q=0;q<CNT;q++)if(cand[q])w++;
    if(w<bestW){bestW=w;bestX=cand;}
  }
  return bestX;
}
function clearHint(){
  if(hintCell>=0){cells[hintCell].classList.remove("hintGlow");hintCell=-1;}
}
function doHint(){
  if(state!=="playing")return;
  var sol=solveBoard();
  if(!sol){setMsg("神灯也沉默了……再点几步试试");return;}
  var pick=-1,i;
  for(i=0;i<CNT;i++){if(sol[i]){pick=i;break;}}
  if(pick<0){setMsg("已经全亮了!");return;}
  clearHint();
  hintCell=pick;
  cells[hintCell].classList.add("hintGlow");
  hints++;
  updateHud();
  setMsg("神灯低语:点亮标注的那一格(最优还需 "+sol.filter(function(v){return v;}).length+" 步)");
}
function newGame(){
  board=[];for(var i=0;i<CNT;i++)board.push(1);
  moves=0;hints=0;state="playing";
  clearHint();
  var ps=pickCells(6),j;
  for(j=0;j<ps.length;j++){
    var list=crossList((ps[j]/N)|0,ps[j]%N),q;
    for(q=0;q<list.length;q++)board[list[q]]^=1;
  }
  paintAll();updateHud();
}
function doPress(i){
  if(state!=="playing")return;
  if(hintCell===i)setMsg("正是神灯所指!不过指引费还是要扣的");
  clearHint();
  press((i/N)|0,i%N);
  updateHud();
  if(litCount()===CNT)win();
}
function win(){
  state="over";
  clearHint();
  var sc=calcScore(),rate;
  if(sc>=900)rate="完美通关 · 神灯都自愧不如";
  else if(sc>=600)rate="优秀通关 · 只借了几次神力";
  else rate="通关 · 好在神灯足够慷慨";
  ovTitle.textContent="灯火通明!";
  ovDesc.textContent="步数 "+moves+" · 指引 "+hints+" 次\n"+rate;
  ovScore.style.display="block";
  ovScore.textContent="最终得分 "+sc;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function start(){newGame();ov.classList.add("hide");}
var cur=-1;
function setCur(i){
  if(cur>=0)cells[cur].classList.remove("cur");
  cur=i;
  if(cur>=0)cells[cur].classList.add("cur");
}
gridEl.addEventListener("click",function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains("cell"))doPress(parseInt(t.dataset.i,10));
});
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}
    return;
  }
  if(e.key==="h"||e.key==="H"){doHint();return;}
  if(cur<0)setCur(5);
  var r=(cur/N)|0,c=cur%N,k=e.key;
  if(k==="ArrowUp"){r=(r+N-1)%N;e.preventDefault();}
  else if(k==="ArrowDown"){r=(r+1)%N;e.preventDefault();}
  else if(k==="ArrowLeft"){c=(c+N-1)%N;e.preventDefault();}
  else if(k==="ArrowRight"){c=(c+1)%N;e.preventDefault();}
  else if(k==="Enter"||k===" "){e.preventDefault();doPress(cur);return;}
  else return;
  setCur(r*N+c);
});
btnGo.addEventListener("click",start);
btnHint.addEventListener("click",doHint);
build();
board=[];for(var z=0;z<CNT;z++)board.push(1);
var ps0=pickCells(6),z2,z3;
for(z2=0;z2<ps0.length;z2++){
  var l0=crossList((ps0[z2]/N)|0,ps0[z2]%N);
  for(z3=0;z3<l0.length;z3++)board[l0[z3]]^=1;
}
paintAll();updateHud();
})();
</script>
</body>
</html>

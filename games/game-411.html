<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歪塔扶正</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:21px;margin:4px 0 2px;color:#ffe066}
.hint{font-size:13px;color:#9aa3c0;margin-bottom:6px;text-align:center;line-height:1.5}
#cv{background:#141933;border-radius:14px;max-width:100%;touch-action:none}
.tb{margin-top:8px;display:flex;gap:10px}
.tb button{background:#2e3660;color:#e8eaf6;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:none}
.tb button:active{transform:scale(.95);background:#3c4680}
.ov{position:fixed;inset:0;background:rgba(8,10,22,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1b2040;border:1px solid #2e3660;border-radius:16px;padding:24px 28px;text-align:center;max-width:86%}
.card h2{color:#ffe066;margin-bottom:10px;font-size:22px}
.card p{font-size:14px;color:#c3cae6;margin-bottom:8px;line-height:1.7}
.card .sc{font-size:17px;color:#7ee0a3}
#ovB{background:#ffe066;margin-top:8px;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;border:none;color:#141933}
</style>
</head>
<body>
<h1>歪塔扶正</h1>
<p class="hint">塔会自己慢慢歪 · 按住左右按钮(或方向键)扶正,点击画面/空格放块</p>
<canvas id="cv" width="420" height="640"></canvas>
<div class="tb">
  <button id="bL">◀ 向左扶</button>
  <button id="bD">投 放</button>
  <button id="bR">向右扶 ▶</button>
</div>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">歪塔扶正</h2><p id="ovM">这座塔天生爱歪:它自己会漂,你每放一层它还会再歪一点!<br>按住「向左扶/向右扶」把倾斜仪压回中间,倾斜到 15° 就塌。<br>键盘:左右方向键扶正,空格投放。</p><p class="sc" id="ovS"></p><button id="ovB">开始游戏</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovM=document.getElementById('ovM'),ovS=document.getElementById('ovS'),ovB=document.getElementById('ovB');
var bL=document.getElementById('bL'),bR=document.getElementById('bR'),bD=document.getElementById('bD');
var W=cv.width,H=cv.height,GROUND=560,BH=22;
var tower,cur,fx,pops,score,state='ready',cam=0,tilt,driftV,driftT,corr;

function layerC(i){return 'hsl('+((i*12+48)%360)+',58%,58%)';}
function reset(){
  tower=[{x:210,w:130}];score=0;fx=[];pops=[];cam=0;tilt=0;corr=0;
  driftV=(Math.random()<0.5?-1:1)*0.5;driftT=3;
  spawn();
}
function spawn(){
  var left=Math.random()<0.5;
  cur={x:left?40:W-40,dir:left?1:-1,w:110,spd:Math.min(2.2+tower.length*0.05,5.0)};
}
function pop(txt,x,y,c){pops.push({t:txt,x:x,y:y,c:c||'#ffe066',life:1});}
function shearX(i){return Math.tan(tilt*Math.PI/180)*i*BH*0.6;}
function place(){
  tower.push({x:cur.x,w:cur.w});
  score+=10;
  tilt+=(cur.x-210)*0.028+(Math.random()*1.6-0.8);
  if(tilt>15)tilt=15;if(tilt<-15)tilt=-15;
  spawn();
  if(Math.abs(tilt)>=15)collapse();
}
function collapse(){
  var i;
  for(i=0;i<tower.length;i++){
    var b=tower[i];
    fx.push({x:b.x+shearX(i),y:GROUND-(tower.length-i)*BH+BH/2,w:b.w,vx:(b.x-210)*0.9+tilt*8,vy:-120-Math.random()*160,rot:0,vr:Math.random()*5-2.5,life:1.6,c:layerC(i)});
  }
  tower=[];
  finish('扶不住了,塌了!');
}
function finish(title){
  state='over';
  var h=tower.length;
  window.setTimeout(function(){
    ovT.textContent=title;
    ovS.textContent='最终高度 '+h+' 层 · 得分 '+score;
    ovM.textContent='扶正要趁早,别等倾斜仪见红';
    ovB.textContent='再来一局';
    ov.style.display='flex';
  },900);
}
function start(){reset();state='play';ov.style.display='none';}
function step(dt){
  if(state==='play'){
    driftT-=dt;
    if(driftT<=0){driftV=(Math.random()<0.5?-1:1)*(0.4+Math.random()*0.5);driftT=2.5+Math.random()*2;}
    tilt+=driftV*dt;
    tilt-=corr*7*dt;
    if(tilt>15)tilt=15;if(tilt<-15)tilt=-15;
    if(Math.abs(tilt)>=15&&tower.length>0)collapse();
    if(cur){
      cur.x+=cur.spd*cur.dir*dt*60;
      var m=cur.w/2+6;
      if(cur.x<m){cur.x=m;cur.dir=1;}
      if(cur.x>W-m){cur.x=W-m;cur.dir=-1;}
    }
  }
  var i;
  for(i=fx.length-1;i>=0;i--){var f=fx[i];f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var p=pops[i];p.life-=dt;p.y-=34*dt;if(p.life<=0)pops.splice(i,1);}
  cam=Math.max(0,300-(GROUND-Math.max(1,tower.length)*BH));
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#252a18');g.addColorStop(1,'#0f1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var gy=GROUND-cam;
  ctx.fillStyle='#1d2447';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2e3660';ctx.fillRect(0,gy,W,5);
  var i,b,y;
  for(i=0;i<tower.length;i++){
    b=tower[i];y=GROUND-(tower.length-i)*BH-cam;
    if(y<-BH||y>H)continue;
    ctx.fillStyle=layerC(i);rr(b.x+shearX(i)-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x+shearX(i)-b.w/2+4,y+5,Math.max(0,b.w-8),4);
  }
  if(cur&&state==='play'){
    y=GROUND-(tower.length+1)*BH-cam;
    ctx.fillStyle=layerC(tower.length);rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.stroke();
  }
  for(i=0;i<fx.length;i++){
    var f=fx[i];ctx.save();ctx.translate(f.x,f.y-cam);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.c;ctx.fillRect(-f.w/2,-(BH-4)/2,f.w,BH-4);ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,14,32);
  ctx.textAlign='right';ctx.fillText('高度 '+tower.length+' 层',W-14,32);
  var mx=tilt/15*95;
  ctx.fillStyle='#2e3660';rr(W/2-100,46,200,12,6);ctx.fill();
  ctx.fillStyle='#7a2b3d';rr(W/2-100,46,26,12,6);ctx.fill();rr(W/2+74,46,26,12,6);ctx.fill();
  ctx.fillStyle=Math.abs(tilt)>10?'#ff6b6b':'#ffe066';rr(W/2+mx-3,42,6,20,3);ctx.fill();
  ctx.fillStyle='#9aa3c0';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('倾斜仪 '+tilt.toFixed(1)+'°',W/2,76);
  for(i=0;i<pops.length;i++){var p=pops[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 16px system-ui,sans-serif';ctx.fillText(p.t,p.x,p.y-cam);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function tap(){if(state==='play'&&cur)place();}
if(window.PointerEvent){cv.addEventListener('pointerdown',function(e){e.preventDefault();tap();});}
else{cv.addEventListener('mousedown',function(){tap();});cv.addEventListener('touchstart',function(e){e.preventDefault();tap();});}
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowLeft')corr=-1;
  if(e.code==='ArrowRight')corr=1;
  if(e.code==='Space'||e.key===' '){e.preventDefault();tap();}
});
window.addEventListener('keyup',function(e){
  if(e.code==='ArrowLeft'&&corr===-1)corr=0;
  if(e.code==='ArrowRight'&&corr===1)corr=0;
});
function hold(el,dir){
  el.addEventListener('pointerdown',function(e){e.preventDefault();corr=dir;});
  el.addEventListener('pointerup',function(){if(corr===dir)corr=0;});
  el.addEventListener('pointercancel',function(){if(corr===dir)corr=0;});
  el.addEventListener('pointerleave',function(){if(corr===dir)corr=0;});
  el.addEventListener('touchstart',function(e){e.preventDefault();corr=dir;},{passive:false});
  el.addEventListener('touchend',function(){if(corr===dir)corr=0;});
}
hold(bL,-1);hold(bR,1);
bD.addEventListener('click',function(){tap();});
ovB.addEventListener('click',start);
reset();
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,0.033);if(dt<0)dt=0;last=ts;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

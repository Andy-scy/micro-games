<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>震颤读拍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#fb7185;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fb7185;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#fb7185}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#fb7185;color:#2b0a10;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>震颤读拍</h1>
  <p class="hint">每一拍屏幕都会震 · 只有「强震」那一拍才能敲 · 空格 / 点击 / 触屏</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>连击 <b id="combo">0</b></span>
    <span>生命 <b id="life">3</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="560"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">震颤读拍</h2>
      <p id="ovDesc">整个世界随节拍震颤:
每小节第 1 拍是「强震」(咚·画面剧震)要立刻敲击;
弱震与中震(哒·嗒)绝不能碰,忍住不敲反而加分!
用眼睛和耳朵分辨震级,敲错或漏掉强拍都会扣生命;
连续克制弱拍还能攒克制分。</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function $(id){return document.getElementById(id);}
var elScore=$("score"),elCombo=$("combo"),elLife=$("life"),elBest=$("best");
var ov=$("ov"),ovTitle=$("ovTitle"),ovScore=$("ovScore"),ovDesc=$("ovDesc"),btnGo=$("btnGo");
var W=480,H=560,CX=240,CY=290,BPM=92;
var INTEN=[3,1,2,1];
var GLYPH={3:"咚",2:"嗒",1:"哒"};
var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(type,f0,f1,dur,vol){
  var ac=audio();if(!ac)return;
  var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1>0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
function noiseHit(dur,vol,freq){
  var ac=audio();if(!ac)return;
  var n=(ac.sampleRate*dur)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource();s.buffer=b;
  var f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=freq;
  var g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function drum(i){
  if(i===3){tone("sine",150,40,0.24,0.5);noiseHit(0.08,0.15,3000);}
  else if(i===2){noiseHit(0.12,0.3,1800);tone("triangle",190,120,0.09,0.18);}
  else{noiseHit(0.05,0.16,7000);}
}
function sHit(){tone("triangle",820,1300,0.13,0.24);}
function sBad(){tone("sawtooth",200,90,0.26,0.22);}
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var best=loadBest("mg_g375");

var state="menu",score,combo,life,maxCombo,hits,rest,ticks,nextT,shakeT,shakeA,flashes,beatCount;
function beatInt(){return 60000/BPM;}
function reset(){
  score=0;combo=0;life=3;maxCombo=0;hits=0;rest=0;
  ticks=[];flashes=[];
  shakeT=0;shakeA=0;beatCount=0;
  nextT=performance.now()+1600;
  upd();
}
function start(){audio();reset();state="play";ov.classList.add("hide");}
function upd(){
  elScore.textContent=score;
  elCombo.textContent=combo;
  elLife.textContent=life;
  elBest.textContent=best;
}
function addPop(txt,color){flashes.push({txt:txt,color:color,t0:performance.now()});}
function gameOver(){
  state="over";
  if(score>best){best=score;saveBest("mg_g375",best);}
  upd();
  ovTitle.textContent="震源失控";
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  ovDesc.textContent="命中强震 "+hits+" 次 · 克制弱拍 "+rest+" 次\n最高连击 "+maxCombo;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function schedule(now){
  if(nextT-now>4000)nextT=now+400;
  while(nextT-now<700){
    var iv=beatInt();
    ticks.push({t:nextT,used:false,run:false,inten:INTEN[beatCount%4]});
    beatCount++;
    nextT+=iv;
  }
  var i,tk;
  for(i=ticks.length-1;i>=0;i--){
    tk=ticks[i];
    if(!tk.run&&now>=tk.t){
      tk.run=true;
      drum(tk.inten);
      shakeT=now;
      shakeA=tk.inten*6.5;
    }
    if(tk.run&&!tk.used&&now>tk.t+165){
      tk.used=true;
      if(tk.inten===3){
        combo=0;life--;sBad();
        addPop("漏掉强震!","#f87171");
        upd();
        if(life<=0){gameOver();return;}
      }else{
        rest++;score+=30;
        addPop("克制 +30","#4ade80");
        upd();
      }
    }
    if(tk.used&&now>tk.t+420)ticks.splice(i,1);
  }
}
function press(){
  if(state!=="play")return;
  var now=performance.now(),i,tk,dt,bi=-1,bd=1e9;
  for(i=0;i<ticks.length;i++){
    tk=ticks[i];if(tk.used)continue;
    dt=now-tk.t;
    if(Math.abs(dt)>150)continue;
    if(Math.abs(dt)<Math.abs(bd)){bd=dt;bi=i;}
  }
  if(bi<0){addPop("乱拍","#8b90b0");combo=0;upd();return;}
  tk=ticks[bi];tk.used=true;
  if(tk.inten===3){
    hits++;
    if(Math.abs(bd)<=75){
      combo++;if(combo>maxCombo)maxCombo=combo;
      score+=300+combo*10;
      addPop("完美 +"+(300+combo*10),"#fbbf24");
    }else{
      combo++;score+=120;
      addPop("命中 +120","#fb7185");
    }
    sHit();
  }else{
    combo=0;life--;sBad();
    addPop("弱拍不许敲!","#f87171");
  }
  upd();
}
function draw(now){
  var i;
  var amp=shakeA*Math.max(0,1-(now-shakeT)/300);
  var ox=(Math.random()*2-1)*amp,oy=(Math.random()*2-1)*amp;
  ctx.save();
  ctx.translate(ox,oy);
  ctx.fillStyle="#0b0e1a";
  ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle="rgba(251,113,133,0.2)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(CX,CY,170,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
  var k=(nextT-now)/beatInt();
  if(k<0)k=0;if(k>1)k=1;
  ctx.strokeStyle="rgba(251,113,133,0.85)";ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(CX,CY,10+k*160,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
  var last=null;
  for(i=ticks.length-1;i>=0;i--){if(ticks[i].run){last=ticks[i];break;}}
  if(last&&last.run){
    var g=GLYPH[last.inten];
    var age=now-last.t;
    if(age<beatInt()){
      var sc=1+Math.max(0,1-age/220)*0.5;
      ctx.fillStyle=last.inten===3?"#fb7185":(last.inten===2?"#fbbf24":"#64748b");
      ctx.font="bold "+Math.round(96*sc)+"px system-ui";
      ctx.textAlign="center";
      ctx.fillText(g,CX,CY+34);
    }
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=(now-f.t0)/620;
    ctx.fillStyle=f.color;ctx.globalAlpha=1-pr;
    ctx.font="bold 20px system-ui";ctx.textAlign="center";
    ctx.fillText(f.txt,CX,CY+150-pr*26);
    ctx.globalAlpha=1;
  }
  for(i=flashes.length-1;i>=0;i--){if(now-flashes[i].t0>640)flashes.splice(i,1);}
  ctx.restore();
  if(now-shakeT<220&&last&&last.inten===3){
    ctx.fillStyle="rgba(251,113,133,"+(0.22*(1-(now-shakeT)/220))+")";
    ctx.fillRect(0,0,W,H);
  }
}
function onTap(){press();}
if(window.PointerEvent){
  cv.addEventListener("pointerdown",function(e){e.preventDefault();onTap();});
}else{
  cv.addEventListener("mousedown",function(e){onTap();});
  cv.addEventListener("touchstart",function(e){e.preventDefault();onTap();},{passive:false});
}
window.addEventListener("keydown",function(e){
  if(e.code==="Space"||e.key===" "){
    e.preventDefault();
    if(state!=="play")start();
    else press();
  }
});
btnGo.addEventListener("click",start);

upd();
requestAnimationFrame(function loop(){
  var now=performance.now();
  if(state==="play")schedule(now);
  draw(now);
  requestAnimationFrame(loop);
});
})();
</script>
</body>
</html>

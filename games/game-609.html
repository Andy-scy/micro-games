<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十全十美</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px;width:100%;max-width:480px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#fb923c;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#fb923c;font-size:16px}
.timebar{height:8px;background:#0b0e1a;border-radius:6px;overflow:hidden;margin-bottom:12px}
.timebar i{display:block;height:100%;background:#fb923c;width:100%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{background:#232949;color:#e8eaf6;border:2px solid transparent;border-radius:10px;padding:14px 0;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .2s}
.grid button:active{transform:scale(.92)}
.grid button.sel{border-color:#fb923c;color:#fb923c;background:#2b1d10}
.grid button.gone{opacity:.12;pointer-events:none}
.grid button.err{background:#3a1620;border-color:#f87171;color:#f87171}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:12px;color:#8b90b0}
.msg.good{color:#4ade80}
.msg.badc{color:#f87171}
.stage{position:relative}
.overlay{position:absolute;inset:-6px;background:rgba(8,10,22,.92);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:5}
.overlay.hide{display:none}
.overlay h2{font-size:25px;color:#fb923c}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#fb923c;color:#3d2005;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}100%{transform:translateX(0)}}
.shake{animation:shake .25s}
</style>
</head>
<body>
<div class="card">
  <h1>十全十美</h1>
  <p class="hint">点两张和为 10 的数字牌将其消除 · 配错扣 2 秒 · 清空整版进入下一波</p>
  <div class="hud">
    <span>第 <b id="wave">1</b> 波</span>
    <span>时间 <b id="time">45</b>s</span>
    <span>连对 <b id="combo">0</b></span>
    <span>生命 <b id="lives">❤❤❤</b></span>
    <span>得分 <b id="score">0</b></span>
  </div>
  <div class="timebar"><i id="tbar"></i></div>
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">十全十美</h2>
      <p id="ovD">每张牌都需要找到与它相加等于 10 的伙伴。点一张再点另一张,凑成 10 就一起消失;全部消完立即进入下一波,波次越往后时间越紧!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始配对</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var elWave=$("wave"),elTime=$("time"),elCombo=$("combo"),elLives=$("lives"),elScore=$("score");
var elTbar=$("tbar"),elGrid=$("grid"),elMsg=$("msg");
var ov=$("ov"),ovT=$("ovT"),ovD=$("ovD"),ovS=$("ovS"),btnGo=$("btnGo");
var state,wave,score,combo,lives,timeLeft,WAVE_MS,cells,selIdx,leftNum,lastT;

function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function updHud(){
  elWave.textContent=wave;elScore.textContent=score;elCombo.textContent=combo;
  var h="",i;
  for(i=0;i<3;i++)h+=i<lives?"❤":"♡";
  elLives.textContent=h;
}
function setMsg(t,cls){
  elMsg.textContent=t;
  elMsg.className="msg"+(cls?" "+cls:"");
}
function build(){
  var nPairs=10+Math.min(wave-1,3)*2;
  var nums=[],i;
  for(i=0;i<nPairs;i++){
    var v=rnd(1,9);
    nums.push(v,10-v);
  }
  for(i=nums.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=nums[i];nums[i]=nums[j];nums[j]=t;}
  elGrid.innerHTML="";
  cells=[];
  selIdx=-1;
  for(i=0;i<nums.length;i++){
    var b=document.createElement("button");
    b.textContent=nums[i];
    (function(ix){
      b.addEventListener("click",function(){tap(ix);});
    })(i);
    elGrid.appendChild(b);
    cells.push({btn:b,v:nums[i],gone:false});
  }
}
function tap(ix){
  if(state!=="playing")return;
  var c=cells[ix];
  if(c.gone)return;
  if(selIdx<0){
    selIdx=ix;
    c.btn.className="sel";
    return;
  }
  if(ix===selIdx){
    c.btn.className="";
    selIdx=-1;
    return;
  }
  var a=cells[selIdx];
  if(a.v+c.v===10){
    a.gone=true;c.gone=true;
    a.btn.className="gone";c.btn.className="gone";
    combo++;
    score+=10+combo;
    selIdx=-1;
    updHud();
    var left=0,i;
    for(i=0;i<cells.length;i++)if(!cells[i].gone)left++;
    if(left===0){
      score+=30;
      setMsg("第 "+wave+" 波清空!+30 奖励","good");
      wave++;
      WAVE_MS=Math.max(28000,46000-(wave-1)*3000);
      timeLeft=WAVE_MS;
      updHud();
      setTimeout(function(){if(state==="playing"){setMsg("");build();}},900);
    }else{
      setMsg("和为 10,消除!连对 x"+combo,"good");
    }
  }else{
    combo=0;
    timeLeft=Math.max(0.1,timeLeft-2);
    c.btn.className="err";
    elGrid.classList.remove("shake");
    void elGrid.offsetWidth;
    elGrid.classList.add("shake");
    setMsg(a.v+" + "+c.v+" = "+(a.v+c.v)+" 不是 10,-2 秒","badc");
    setTimeout(function(){if(!c.gone)c.btn.className="";},350);
    selIdx=-1;
    a.btn.className="";
    updHud();
  }
}
function loseLife(){
  lives--;
  updHud();
  if(lives<=0)setTimeout(gameOver,600);
}
function timeout(){
  var i;
  setMsg("时间到!生命 -1,棋盘重新洗牌","badc");
  for(i=0;i<cells.length;i++)cells[i].btn.className="";
  timeLeft=WAVE_MS;
  loseLife();
  if(state==="playing")setTimeout(function(){if(state==="playing"){setMsg("");build();}},900);
}
function gameOver(){
  state="over";
  ovT.textContent="配对失败…";
  ovD.textContent="你坚持了 "+wave+" 波,十全十美没那么容易!";
  ovS.style.display="block";
  ovS.textContent="得分 "+score;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){
  state="playing";wave=1;score=0;combo=0;lives=3;
  WAVE_MS=45000;timeLeft=WAVE_MS;lastT=0;
  setMsg("");
  build();updHud();
  ov.classList.add("hide");
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();startGame();}
  }
});
btnGo.addEventListener("click",startGame);
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(100,t-lastT);lastT=t;
  if(state==="playing"){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=WAVE_MS;timeout();}
    elTime.textContent=Math.ceil(timeLeft/1000);
    elTbar.style.width=(timeLeft/WAVE_MS*100)+"%";
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

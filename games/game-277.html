<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足迹迷雾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#94a3b8;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px;align-items:center}
.hud b{color:#94a3b8;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#04060f;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#e2e8f0}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#94a3b8;color:#101623;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>足迹迷雾</h1>
  <p class="hint">方向键 / WASD 移动 · 触屏滑动 · 走过的路永久点亮,罗盘指引出口方向</p>
  <div class="hud">
    <span>探索率 <b id="explored">0%</b></span>
    <span>步数 <b id="steps">0</b></span>
    <span>用时 <b id="time">0.0s</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="462" height="462"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">足迹迷雾</h2>
      <p id="ovDesc">迷雾浓得化不开:只有你亲手走过的格子会被永久点亮并留在地图上,未踏足之处始终漆黑一片。顶部罗盘的银针永远指向出口方向。点亮足够的世界,找到那扇绿色的门!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">步入迷雾</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv");
var ctx=cv.getContext("2d");
var COLS=21,ROWS=21,CELL=22,W=462,H=462;
function $(id){return document.getElementById(id);}
var elExp=$("explored"),elSteps=$("steps"),elTime=$("time");
var ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var best=loadBest("mg_s277");
var state="menu";
var grid,player,exitCell,seen,seenCount,totalChannel,steps,elapsed,pulse;

function loadBest(k){try{return parseInt(localStorage.getItem(k)||"0",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}

function genMaze(C,R){
  var w2=C*2+1,h2=R*2+1,g=[],i,j;
  for(j=0;j<h2;j++){g.push([]);for(i=0;i<w2;i++)g[j].push(1);}
  var st=[[0,0]],vis={};
  vis["0,0"]=true;
  g[1][1]=0;
  while(st.length){
    var cur=st[st.length-1],cx=cur[0],cy=cur[1],nbs=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx>=0&&ny>=0&&nx<C&&ny<R&&!vis[nx+","+ny])nbs.push(dirs[i]);
    }
    if(nbs.length){
      var d=nbs[(Math.random()*nbs.length)|0],tx=cx+d[0],ty=cy+d[1];
      vis[tx+","+ty]=true;
      g[cy*2+1+d[1]][cx*2+1+d[0]]=0;
      g[ty*2+1][tx*2+1]=0;
      st.push([tx,ty]);
    }else st.pop();
  }
  return g;
}
function reset(){
  grid=genMaze(10,10);
  player={x:1,y:1};
  exitCell={x:COLS-2,y:ROWS-2};
  seen=[];
  var y,x;
  for(y=0;y<ROWS;y++)seen.push(new Array(COLS));
  totalChannel=0;
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++)if(grid[y][x]===0)totalChannel++;
  seenCount=0;steps=0;elapsed=0;pulse=0;
  markSeen();
  updateHud();
}
function markSeen(){
  var px=player.x,py=player.y,dx,dy;
  for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){
    var nx=px+dx,ny=py+dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS)continue;
    if(seen[ny][nx])continue;
    seen[ny][nx]=true;
    if(grid[ny][nx]===0)seenCount++;
  }
  updateHud();
}
function updateHud(){
  elExp.textContent=Math.round(seenCount/totalChannel*100)+"%";
  elSteps.textContent=steps;
}
function tryMove(dx,dy){
  if(state!=="playing")return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return;
  if(grid[ny][nx]===1)return;
  player.x=nx;player.y=ny;
  steps++;
  markSeen();
  if(nx===exitCell.x&&ny===exitCell.y)win();
}
function win(){
  state="over";
  var isNew=false;
  if(best===0||steps<best){best=steps;saveBest("mg_s277",best);isNew=true;}
  ovTitle.textContent="拨开迷雾!";
  ovDesc.textContent=isNew?"新纪录!你的足迹就是最完美的地图。":"迷雾在你的脚印面前节节败退,出口亮了。";
  ovScore.style.display="block";
  ovScore.textContent="步数 "+steps+" · 探索率 "+Math.round(seenCount/totalChannel*100)+"% · 用时 "+elapsed.toFixed(1)+"s";
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");lastT=0;}
function drawCompass(){
  var cx=W/2,cy=22;
  var ang=Math.atan2(exitCell.y-player.y,exitCell.x-player.x);
  ctx.fillStyle="rgba(8,10,22,0.85)";
  ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#94a3b8";
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#e2e8f0";
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(cx-Math.cos(ang)*8,cy-Math.sin(ang)*8);
  ctx.lineTo(cx+Math.cos(ang)*9,cy+Math.sin(ang)*9);
  ctx.stroke();
  ctx.fillStyle="#fbbf24";
  ctx.beginPath();
  ctx.arc(cx+Math.cos(ang)*9,cy+Math.sin(ang)*9,2.5,0,Math.PI*2);
  ctx.fill();
  ctx.lineWidth=1;
}
function draw(){
  var x,y;
  ctx.clearRect(0,0,W,H);
  for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
    if(!seen[y][x])continue;
    var sx=x*CELL,sy=y*CELL;
    if(grid[y][x]===1){
      ctx.fillStyle="#1c2340";
      ctx.fillRect(sx,sy,CELL,CELL);
      ctx.fillStyle="#252e52";
      ctx.fillRect(sx,sy,CELL,3);
    }else{
      ctx.fillStyle="rgba(148,163,184,0.13)";
      ctx.fillRect(sx+1,sy+1,CELL-2,CELL-2);
    }
  }
  if(seen[exitCell.y][exitCell.x]){
    var ex=exitCell.x*CELL+CELL/2,ey=exitCell.y*CELL+CELL/2;
    var pr=8+Math.sin(pulse)*2;
    ctx.fillStyle="#4ade80";
    ctx.shadowColor="#4ade80";ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(ex,ey,pr,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#05230f";
    ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("出",ex,ey);
  }
  var px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle="#f1f5f9";
  ctx.shadowColor="#e2e8f0";ctx.shadowBlur=12;
  ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#0b0e1a";
  ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
  drawCompass();
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(60,t-lastT);lastT=t;
  pulse+=dt*0.005;
  if(state==="playing"){
    elapsed+=dt/1000;
    elTime.textContent=elapsed.toFixed(1)+"s";
  }
  draw();
}
document.addEventListener("keydown",function(e){
  if(state!=="playing"){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();startGame();}
    return;
  }
  var k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W"){e.preventDefault();tryMove(0,-1);}
  else if(k==="ArrowDown"||k==="s"||k==="S"){e.preventDefault();tryMove(0,1);}
  else if(k==="ArrowLeft"||k==="a"||k==="A"){e.preventDefault();tryMove(-1,0);}
  else if(k==="ArrowRight"||k==="d"||k==="D"){e.preventDefault();tryMove(1,0);}
});
var tsx=0,tsy=0;
cv.addEventListener("touchstart",function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener("touchend",function(e){
  var t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18){e.preventDefault();return;}
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

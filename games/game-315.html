<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双镜联动</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--ink:#eef1ff;--dim:#9aa3c7;--acc:#68d391;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;}
.wrap{width:100%;max-width:560px;text-align:center;}
h1{font-size:22px;letter-spacing:3px;margin-bottom:6px;}
.tip{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:10px;}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;color:var(--dim);}
.bar b{color:var(--acc);font-size:15px;}
.btn{background:var(--acc);border:none;border-radius:8px;color:#0a2416;font-family:inherit;font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;}
.btn.ghost{background:#2a3154;color:var(--ink);}
.duo{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.side{width:calc(50% - 5px);min-width:150px;max-width:250px;}
.sideT{color:var(--dim);font-size:13px;margin-bottom:6px;}
.sideT b{color:var(--acc);}
.frame{position:relative;width:100%;padding-top:100%;}
.board{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--card);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 1px #2c3560;touch-action:none;}
.board.ready .tile{transition:left .12s ease,top .12s ease;}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(145deg,#25331f,#1d2a1a);color:var(--ink);font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 3px 8px rgba(0,0,0,.28);}
.foot{color:var(--dim);font-size:12px;line-height:1.7;margin-top:10px;}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(7,9,20,.8);display:none;align-items:center;justify-content:center;z-index:20;}
.overlay.show{display:flex;}
.panel{background:var(--card);border:1px solid #2c3560;border-radius:16px;padding:28px 32px;text-align:center;max-width:86vw;box-shadow:0 16px 50px rgba(0,0,0,.55);}
.panel h2{color:var(--acc);font-size:24px;letter-spacing:2px;margin-bottom:10px;}
.panel p{color:var(--dim);font-size:14px;line-height:1.9;margin-bottom:18px;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <h1>双镜联动</h1>
  <p class="tip">一棋两手:甲乙两个棋盘同时打乱,你的每一步操作会同时作用于两个棋盘(在哪块盘上合法就在哪块生效);必须让两盘同时复原才算赢。</p>
  <div class="bar">
    <span>操作数 <b id="stMoves">0</b></span>
    <button class="btn ghost" id="resetBtn">重开</button>
  </div>
  <div class="duo">
    <div class="side">
      <p class="sideT">甲盘 归位 <b id="fitAT">0/15</b></p>
      <div class="frame"><div class="board" id="boardA"></div></div>
    </div>
    <div class="side">
      <p class="sideT">乙盘 归位 <b id="fitBT">0/15</b></p>
      <div class="frame"><div class="board" id="boardB"></div></div>
    </div>
  </div>
  <p class="foot">方向键或滑动作用于两盘;也可以直接点某块盘上的方块来指定移动方向。规划路线时,别忘了另一面镜子。</p>
</div>
<div class="overlay" id="overlay"><div class="panel">
  <h2 id="ovTitle"></h2>
  <p id="ovInfo"></p>
  <button class="btn" id="againBtn">再来一局</button>
</div></div>
<script>
(function(){
'use strict';
const N=4,TOTAL=N*N,K=40;
const goal=[];for(let i=0;i<TOTAL;i++)goal.push((i+1)%TOTAL);
let moves=0,playing=false,startAt=0;
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovInfo=document.getElementById('ovInfo');
const movesEl=document.getElementById('stMoves');
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s;}
function makeBoard(elId,fitId){
  const b={el:document.getElementById(elId),fitEl:document.getElementById(fitId),tiles:[],els:[]};
  b.el.addEventListener('click',function(ev){
    const t=ev.target.closest('.tile');if(!t||!playing)return;
    const v=parseInt(t.dataset.v,10);
    const idx=b.tiles.indexOf(v),bl=b.tiles.indexOf(0);
    const tr=(idx/N)|0,tc=idx%N,br=(bl/N)|0,bc=bl%N;
    if(Math.abs(br-tr)+Math.abs(bc-tc)!==1)return;
    applyDir(bc-tc,br-tr);
  });
  let tX=0,tY=0;
  b.el.addEventListener('touchstart',function(ev){const t=ev.changedTouches[0];tX=t.clientX;tY=t.clientY;},{passive:true});
  b.el.addEventListener('touchend',function(ev){
    if(!playing)return;
    const t=ev.changedTouches[0];
    const dx=t.clientX-tX,dy=t.clientY-tY;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    ev.preventDefault();
    if(Math.abs(dx)>Math.abs(dy))applyDir(dx>0?1:-1,0);else applyDir(0,dy>0?1:-1);
  },{passive:false});
  return b;
}
const boards=[makeBoard('boardA','fitAT'),makeBoard('boardB','fitBT')];
function buildBoard(b){
  b.el.innerHTML='';b.el.classList.remove('ready');b.els=[];b.tiles=goal.slice();
  for(let v=1;v<TOTAL;v++){
    const el=document.createElement('div');el.className='tile';el.textContent=v;el.dataset.v=v;
    el.style.width=(100/N)+'%';el.style.height=(100/N)+'%';
    b.el.appendChild(el);b.els[v]=el;
  }
}
function setPosB(b,v,idx){const r=(idx/N)|0,c=idx%N;b.els[v].style.left=(c*100/N)+'%';b.els[v].style.top=(r*100/N)+'%';}
function placeBoard(b){for(let i=0;i<TOTAL;i++)if(b.tiles[i])setPosB(b,b.tiles[i],i);}
function slideB(b,idx){
  const bl=b.tiles.indexOf(0),br=(bl/N)|0,bc=bl%N,r=(idx/N)|0,c=idx%N;
  if(Math.abs(br-r)+Math.abs(bc-c)!==1)return false;
  b.tiles[bl]=b.tiles[idx];b.tiles[idx]=0;setPosB(b,b.tiles[bl],bl);
  return true;
}
function slideDirB(b,dx,dy){
  const bl=b.tiles.indexOf(0),br=(bl/N)|0,bc=bl%N,tr=br-dy,tc=bc-dx;
  if(tr<0||tr>=N||tc<0||tc>=N)return false;
  return slideB(b,tr*N+tc);
}
function isSolvedB(b){for(let i=0;i<TOTAL;i++)if(b.tiles[i]!==goal[i])return false;return true;}
function countFitB(b){let k=0;for(let i=0;i<TOTAL;i++)if(b.tiles[i]&&b.tiles[i]===goal[i])k++;return k+'/15';}
function scrambleB(b,k){
  do{
    let last=-1;
    for(let s=0;s<k;s++){
      const bl=b.tiles.indexOf(0),br=(bl/N)|0,bc=bl%N;
      const opts=[];
      if(br>0)opts.push(bl-N);if(br<N-1)opts.push(bl+N);if(bc>0)opts.push(bl-1);if(bc<N-1)opts.push(bl+1);
      const cands=opts.filter(function(x){return x!==last;});
      const pick=cands[(Math.random()*cands.length)|0];
      b.tiles[bl]=b.tiles[pick];b.tiles[pick]=0;last=pick;
    }
  }while(isSolvedB(b));
}
function hud(){
  movesEl.textContent=moves;
  boards[0].fitEl.textContent=countFitB(boards[0]);
  boards[1].fitEl.textContent=countFitB(boards[1]);
}
function applyDir(dx,dy){
  if(!playing)return;
  let any=false;
  for(let i=0;i<boards.length;i++){if(slideDirB(boards[i],dx,dy))any=true;}
  if(!any)return;
  moves++;hud();
  if(isSolvedB(boards[0])&&isSolvedB(boards[1]))finish();
}
function finish(){
  playing=false;
  const sec=(Date.now()-startAt)/1000;
  ovTitle.textContent='双镜同辉!';
  ovInfo.textContent='两盘同时复原 · 操作数 '+moves+'\n用时 '+fmt(sec)+'\n一手托两局,算无遗策';
  overlay.classList.add('show');
}
document.addEventListener('keydown',function(ev){
  const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const d=map[ev.key];if(!d)return;ev.preventDefault();
  applyDir(d[0],d[1]);
});
function fit(){for(let i=0;i<boards.length;i++){const w=boards[i].el.clientWidth;if(w)boards[i].el.style.fontSize=Math.max(11,Math.min(34,w/N*0.42))+'px';}}
function newGame(){
  overlay.classList.remove('show');
  for(let i=0;i<boards.length;i++){buildBoard(boards[i]);scrambleB(boards[i],K);placeBoard(boards[i]);}
  moves=0;startAt=Date.now();playing=true;hud();
  requestAnimationFrame(function(){fit();for(let i=0;i<boards.length;i++)boards[i].el.classList.add('ready');});
}
document.getElementById('resetBtn').addEventListener('click',newGame);
document.getElementById('againBtn').addEventListener('click',newGame);
window.addEventListener('resize',fit);
newGame();
})();
</script>
</body>
</html>

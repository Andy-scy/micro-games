<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒飞挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 18px;width:100%;max-width:540px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#c084fc;text-align:center;letter-spacing:2px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#c084fc;font-size:16px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.88);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay.hide{display:none}
.overlay h2{font-size:26px;color:#c084fc}
.overlay p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:6px;background:#c084fc;color:#08101f;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>倒飞挑战</h1>
  <p class="hint">点按 = 向下俯冲(反向!)· 不点会被托着上升 · 管道迎面倒着来</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="480" height="600"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">倒飞挑战</h2>
      <p id="ovDesc">镜像世界:小鸟倒着朝左飞,引力朝上,松手就缓缓升向布满尖刺的天花板;点按才会向下俯冲!管道从左侧迎面扑来。操作完全反直觉,千万别凭本能按。穿管 +1 分,触顶触地撞管即亡!</p>
      <p class="big" id="ovScore" style="display:none"></p>
      <button id="btnGo">进入镜像</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=480,H=600,GROUND=556,PW=72,GAP=155,SPACE=240,GRAV=-1250,DIVE=340,BX=340,BR=13,SPEED=140;
function $(id){return document.getElementById(id);}
var elScore=$("score"),elBest=$("best"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var state="menu",bird,pipes,popups,score,best=0,tick;
function newPipe(x){return{x:x,gy:70+Math.random()*(GROUND-140-GAP),passed:false};}
function reset(){
  bird={y:300,vy:0};
  pipes=[newPipe(-PW-40)];
  popups=[];score=0;tick=0;
  elScore.textContent="0";
}
function act(){
  if(state!=="playing")return;
  bird.vy=DIVE;
}
function die(msg){
  state="over";
  if(score>best){best=score;elBest.textContent=String(best);}
  ovTitle.textContent="游戏结束";
  ovTitle.style.color="#f87171";
  ovDesc.textContent=msg;
  ovScore.style.display="block";
  ovScore.textContent="得分 "+score+" · 最佳 "+best;
  btnGo.textContent="再来一局";
  ov.classList.remove("hide");
}
function startGame(){reset();state="playing";ov.classList.add("hide");}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function update(dt){
  var i,p;
  tick+=dt;
  bird.vy+=GRAV*dt;
  bird.y+=bird.vy*dt;
  if(bird.y<BR+22){die("被吸上了尖刺天花板!");return;}
  if(bird.y+BR>GROUND){die("俯冲过头,撞地了!");return;}
  for(i=0;i<pipes.length;i++)pipes[i].x+=SPEED*dt;
  if(pipes[pipes.length-1].x>=SPACE-PW-26)pipes.push(newPipe(-PW-26));
  if(pipes[0].x>W+40)pipes.shift();
  for(i=0;i<pipes.length;i++){
    p=pipes[i];
    if(!p.passed&&p.x>BX+BR){
      p.passed=true;score++;
      elScore.textContent=String(score);
      popups.push({x:BX-40,y:bird.y-26,txt:"+1",life:0.8});
    }
    if(circleRect(BX,bird.y,BR,p.x,0,PW,p.gy)||circleRect(BX,bird.y,BR,p.x,p.gy+GAP,PW,GROUND-p.gy-GAP)){
      die("倒飞时撞上了管道!");return;
    }
  }
  for(i=popups.length-1;i>=0;i--){
    popups[i].y-=42*dt;popups[i].life-=dt;
    if(popups[i].life<=0)popups.splice(i,1);
  }
}
function drawPipe(p){
  ctx.fillStyle="#6d28a8";
  ctx.fillRect(p.x,0,PW,p.gy);
  ctx.fillRect(p.x,p.gy+GAP,PW,GROUND-p.gy-GAP);
  ctx.fillStyle="#c084fc";
  ctx.fillRect(p.x+6,0,7,p.gy);
  ctx.fillRect(p.x+6,p.gy+GAP,7,GROUND-p.gy-GAP);
  ctx.fillStyle="#4c1d7a";
  ctx.fillRect(p.x-4,p.gy-13,PW+8,13);
  ctx.fillRect(p.x-4,p.gy+GAP,PW+8,13);
}
function draw(){
  var i;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#120c1e";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(216,180,254,0.3)";
  for(i=0;i<35;i++)ctx.fillRect((i*157)%W,(i*241)%GROUND,1.3,1.3);
  for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  ctx.fillStyle="#3a2b55";
  ctx.fillRect(0,GROUND,W,H-GROUND);
  var off=(tick*SPEED)%24;
  ctx.fillStyle="#4d3a6e";
  for(i=-1;i<W/24+1;i++)ctx.fillRect(W-((i*24+off)%W),GROUND,12,6);
  ctx.fillStyle="#3a2b55";
  ctx.fillRect(0,0,W,20);
  ctx.fillStyle="#8b5cf6";
  for(i=0;i<W/16+1;i++){
    ctx.beginPath();
    ctx.moveTo(i*16,20);
    ctx.lineTo(i*16+8,4);
    ctx.lineTo(i*16+16,20);
    ctx.closePath();ctx.fill();
  }
  ctx.save();
  ctx.translate(BX,bird.y);
  ctx.scale(-1,1);
  ctx.fillStyle="#e9d5ff";
  ctx.beginPath();ctx.arc(0,0,BR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#a855f7";
  ctx.beginPath();ctx.arc(-4,4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#120c1e";
  ctx.beginPath();ctx.arc(5,-4,3.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f97316";
  ctx.beginPath();ctx.moveTo(BR-2,0);ctx.lineTo(BR+8,2);ctx.lineTo(BR-2,6);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.strokeStyle="rgba(192,132,252,0.5)";ctx.lineWidth=2;
  for(i=1;i<=3;i++){
    var ly=bird.y+Math.sin(tick*4+i)*10;
    ctx.beginPath();ctx.moveTo(BX+30+i*22,ly);ctx.lineTo(BX+44+i*22,ly);ctx.stroke();
  }
  ctx.font="bold 16px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  for(i=0;i<popups.length;i++){
    ctx.fillStyle="rgba(233,213,255,"+popups[i].life+")";
    ctx.fillText(popups[i].txt,popups[i].x,popups[i].y);
  }
}
var lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!lastT)lastT=t;
  var dt=Math.min(0.05,(t-lastT)/1000);
  lastT=t;
  if(state==="playing")update(dt);
  draw();
}
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();if(!e.repeat)act();}
});
cv.addEventListener("mousedown",function(e){e.preventDefault();act();});
cv.addEventListener("touchstart",function(e){e.preventDefault();act();},{passive:false});
btnGo.addEventListener("click",startGame);
reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星尘连击雨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
#app{width:100%;max-width:480px}
h1{font-size:24px;text-align:center;color:#ffd166;margin-bottom:4px}
.tips{font-size:13px;color:#9aa3c0;text-align:center;line-height:1.7;margin-bottom:10px}
.card{background:#1a1f36;border-radius:14px;padding:10px 14px;margin-bottom:10px;display:flex;gap:10px}
.stat{flex:1;text-align:center}
.mut{color:#9aa3c0;font-size:12px}
.big{font-size:17px;font-weight:800;color:#ffd166}
canvas{width:100%;display:block;border-radius:12px;background:#141a33;touch-action:none}
.btn{border:0;border-radius:10px;padding:11px 24px;font-size:15px;background:#4cc9f0;color:#081226;font-weight:700;cursor:pointer}
#overlay{position:fixed;inset:0;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;z-index:9}
#overlay.hide{display:none}
.ov{background:#1a1f36;border-radius:16px;padding:24px 28px;text-align:center;max-width:86vw}
.ov h2{color:#ffd166;margin-bottom:10px;font-size:22px}
.ov p{color:#cdd6f4;margin-bottom:16px;line-height:1.8;font-size:14px;text-align:left}
</style>
</head>
<body>
<div id="app">
  <h1>星尘连击雨</h1>
  <p class="tips">60 秒限时冲刺!← → 或 A/D 移动篮子,触屏拖动。连续接星不落空,倍率一路涨到 ×5;漏一颗星连击清零——没有生命,拼的就是手稳!</p>
  <div class="card">
    <div class="stat"><div class="mut">得分</div><div class="big" id="sc">0</div></div>
    <div class="stat"><div class="mut">连击</div><div class="big" id="cb">0</div></div>
    <div class="stat"><div class="mut">倍率</div><div class="big" id="ml">×1</div></div>
  </div>
  <canvas id="cv" width="480" height="620"></canvas>
</div>
<div id="overlay"><div class="ov"><h2 id="ovt">星尘连击雨</h2><p id="ovp">玩法:60 秒连击计分赛。<br>· 键盘 ← → 或 A/D 移篮,触屏拖动<br>· 每接 4 颗星倍率 +1,最高 ×5<br>· 小星 = 10×倍率,大金星 = 固定 50<br>· 漏星不清分但连击归零,倍率重算<br>· 倒计时结束结算,冲最高分!</p><button class="btn" id="obtn">开始冲刺</button></div></div>
<script>
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
function $(id){return document.getElementById(id)}
var best=0;
try{best=parseInt(localStorage.getItem('mg664')||'0',10)||0}catch(e){best=0}
var S=null;
function reset(){S={on:false,score:0,combo:0,t:60,st:0.4,stars:[],pops:[],bx:W/2,bw:88,keys:{}}}
reset();
function startGame(){reset();S.on=true;$('sc').textContent='0';$('cb').textContent='0';$('ml').textContent='×1';$('overlay').classList.add('hide')}
$('obtn').addEventListener('click',startGame);
addEventListener('keydown',function(e){S.keys[e.key]=true;if(S.on&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' '))e.preventDefault()});
addEventListener('keyup',function(e){S.keys[e.key]=false});
function px(t){var rc=cv.getBoundingClientRect();return(t.clientX-rc.left)*(W/rc.width)}
cv.addEventListener('mousemove',function(e){if(S.on)S.bx=px(e)});
cv.addEventListener('touchstart',function(e){e.preventDefault();if(S.on)S.bx=px(e.touches[0])},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();if(S.on)S.bx=px(e.touches[0])},{passive:false});
function pop(x,y,txt,c){S.pops.push({x:x,y:y,txt:txt,c:c,t:0.9})}
function mult(){return 1+Math.min(4,Math.floor(S.combo/4))}
function update(dt){
  S.t-=dt;
  if(S.t<=0){S.t=0;gameOver();return}
  var sp=360,l=S.keys['ArrowLeft']||S.keys['a']||S.keys['A'],r=S.keys['ArrowRight']||S.keys['d']||S.keys['D'];
  if(l)S.bx-=sp*dt;
  if(r)S.bx+=sp*dt;
  S.bx=Math.max(S.bw/2,Math.min(W-S.bw/2,S.bx));
  S.st-=dt;
  if(S.st<=0){
    S.st=Math.max(0.3,0.58-S.t*0.004)*(0.75+Math.random()*0.5);
    S.stars.push({x:24+Math.random()*(W-48),y:-16,v:225+Math.random()*120,big:Math.random()<0.1,rot:Math.random()*6,spin:(Math.random()-0.5)*4});
  }
  var by=H-46;
  for(var i=S.stars.length-1;i>=0;i--){
    var st=S.stars[i];
    st.y+=st.v*dt;st.rot+=st.spin*dt;
    if(st.y>=by-16&&st.y<=by+10&&Math.abs(st.x-S.bx)<S.bw/2+8){
      var pts=st.big?50:10*mult();
      S.combo++;S.score+=pts;
      $('sc').textContent=S.score;$('cb').textContent=S.combo;$('ml').textContent='×'+mult();
      pop(st.x,by-30,'+'+pts+(st.big?' 大星!':''),'#ffd166');
      S.stars.splice(i,1);continue;
    }
    if(st.y>H+16){
      S.stars.splice(i,1);
      if(S.combo>=4)pop(st.x,H-100,'连击中断!','#ff6b6b');
      S.combo=0;$('cb').textContent='0';$('ml').textContent='×1';
    }
  }
  for(var j=S.pops.length-1;j>=0;j--){var p=S.pops[j];p.t-=dt;p.y-=30*dt;if(p.t<=0)S.pops.splice(j,1)}
}
function gameOver(){
  S.on=false;
  var nb=S.score>best;
  if(nb){best=S.score;try{localStorage.setItem('mg664',String(best))}catch(e){}}
  $('ovt').textContent='时间到!';
  $('ovp').innerHTML='本局得分 <b>'+S.score+'</b>'+(nb?'<br>刷新最高纪录!':'<br>历史最高 <b>'+best+'</b>')+'<br>最高连击 ×'+mult()+' 倍率,稳住不落空才能滚雪球!';
  $('obtn').textContent='再来一局';
  $('overlay').classList.remove('hide');
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function starPath(r){
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*0.45:r;
    if(i)ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);else ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#10142b';
  for(var g=0;g<26;g++){
    var gx=(g*97)%W,gy=(g*211)%(H-60);
    ctx.fillRect(gx,gy,2,2);
  }
  ctx.fillStyle='rgba(255,209,102,.9)';rr(10,10,W-20,8,4);ctx.fill();
  ctx.fillStyle='#ff6b6b';rr(10,10,(W-20)*Math.max(0,S.t/60),8,4);ctx.fill();
  for(var i=0;i<S.stars.length;i++){
    var st=S.stars[i];
    ctx.save();ctx.translate(st.x,st.y);ctx.rotate(st.rot);
    ctx.fillStyle=st.big?'#ffe08a':'#ffd166';
    starPath(st.big?17:11);ctx.fill();
    ctx.restore();
  }
  var by=H-46;
  ctx.fillStyle='#5a4bb8';rr(S.bx-S.bw/2,by,S.bw,24,7);ctx.fill();
  ctx.strokeStyle='#b3a6ff';ctx.lineWidth=2;rr(S.bx-S.bw/2,by,S.bw,24,7);ctx.stroke();
  ctx.fillStyle='#e8eaf6';ctx.font='bold 12px system-ui';ctx.textAlign='center';
  ctx.fillText('接星篮 ×'+mult(),S.bx,by+16);
  ctx.font='bold 15px system-ui';
  for(var j=0;j<S.pops.length;j++){
    var p=S.pops[j];
    ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;
  }
}
var last=performance.now();
function loop(t){
  var dt=Math.min(0.035,(t-last)/1000);last=t;
  if(S.on)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

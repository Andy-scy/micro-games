<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罚球连击</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:20px;color:#ffd54f;margin:4px 0}
.tip{font-size:13px;color:#9fa8da;text-align:center;margin-bottom:8px}
#stage{position:relative;line-height:0}
canvas{background:#161b30;border-radius:14px;max-width:96vw;height:auto;touch-action:none;display:block}
#overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;border-radius:14px}
#overlay.hidden{display:none}
.card{background:#232946;border:1px solid #4a5290;border-radius:14px;padding:20px 30px;text-align:center;max-width:80%;line-height:1.6}
.card h2{color:#ffd54f;margin-bottom:8px;font-size:22px}
.card p{font-size:15px;color:#c5cae9}
.card button{margin-top:14px;padding:9px 30px;font-size:16px;font-weight:700;border:none;border-radius:9px;background:#ffd54f;color:#1a1f36;cursor:pointer}
.card button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>罚球连击</h1>
<p class="tip">按住屏幕或空格蓄力，松开出手 · 篮筐每球换位 · 进 15 球获胜，3 次偏出失败</p>
<div id="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="overlay" class="hidden"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="btnRe">再来一局</button></div></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),ovB=document.getElementById('btnRe');
var W=cv.width,H=cv.height;
var G=1000,LX=240,LY=556,RIMY=170,RH=36,PR=6,BR=12;
var phase,score,combo,bestC,miss,hoopX,ideal,ball,trail,meter,mt,resT,msg;
function rnd(a,b){return a+Math.random()*(b-a);}
function newHoop(){
  hoopX=rnd(150,330);
  var dx=hoopX-LX,dy=LY-RIMY;
  var th=(90-Math.abs(dx)*0.12)*Math.PI/180;
  var c=Math.cos(th),tn=Math.tan(th);
  var den=2*c*c*(Math.abs(dx)*tn-dy);
  var s2=den>1?(G*dx*dx)/den:2*G*dy;
  if(s2<2*G*dy*0.9)s2=2*G*dy;
  ideal=Math.sqrt(s2);
}
function reset(){
  phase='idle';score=0;combo=0;bestC=0;miss=0;meter=0;mt=0;ball=null;trail=[];resT=0;msg='';
  newHoop();
}
function press(){
  if(phase==='idle'){phase='charge';mt=0;meter=0;}
}
function releaseP(){
  if(phase!=='charge')return;
  var dx=hoopX-LX;
  var th=(90-Math.abs(dx)*0.12)*Math.PI/180;
  var sp=ideal*(0.72+meter*0.56);
  ball={x:LX,y:LY,vx:sp*Math.cos(th)*(dx<0?-1:1),vy:-sp*Math.sin(th),py:LY,touch:false};
  trail=[];
  phase='fly';
}
function peg(px,py){
  var dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy),min=BR+PR;
  if(d<min&&d>0.001){
    var nx=dx/d,ny=dy/d,dot=ball.vx*nx+ball.vy*ny;
    if(dot<0){ball.vx-=1.55*dot*nx;ball.vy-=1.55*dot*ny;}
    ball.x=px+nx*min;ball.y=py+ny*min;ball.touch=true;
  }
}
function boardHit(){
  var bx=hoopX-62,byb=RIMY-94,bw=124,bh=84,bot=byb+bh;
  if(ball.x>bx-BR&&ball.x<bx+bw+BR&&ball.py<=bot&&ball.y>bot&&ball.vy<0){
    ball.y=bot+BR;ball.vy=Math.abs(ball.vy)*0.5;ball.vx*=0.9;ball.touch=true;
  }
}
function resolve(made){
  phase='res';resT=0;
  if(made){score++;combo++;if(combo>bestC)bestC=combo;msg='命中！连击 x'+combo;}
  else{combo=0;miss++;msg='偏出…';}
  if(score>=15){end(true);return;}
  if(miss>=3){end(false);return;}
}
function end(win){
  phase='over';
  ovT.textContent=win?'胜利！':'比赛结束';
  ovX.textContent='最终得分 '+score+' 分 · 最高连击 x'+bestC+(win?'。稳定的手感，罚球线之王！':'。力度在绿区附近出手更容易命中。');
  ov.classList.remove('hidden');
}
function update(dt){
  if(phase==='charge'){mt+=dt;meter=0.5-0.5*Math.cos(mt*7);}
  if(phase==='res'){
    resT+=dt;
    if(ball){ball.vy+=G*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.y>588){ball.y=588;ball.vy*=-0.3;ball.vx*=0.8;if(Math.abs(ball.vy)<40)ball.vy=0;}}
    if(resT>0.8){phase='idle';ball=null;newHoop();}
  }
  if(phase==='fly'&&ball){
    var steps=Math.max(1,Math.ceil(dt/0.008)),sd=dt/steps;
    for(var i=0;i<steps;i++){
      ball.py=ball.y;
      ball.vy+=G*sd;
      ball.x+=ball.vx*sd;ball.y+=ball.vy*sd;
      peg(hoopX-RH,RIMY);peg(hoopX+RH,RIMY);boardHit();
      if(ball.py<RIMY&&ball.y>=RIMY&&ball.vy>0&&Math.abs(ball.x-hoopX)<RH-6){resolve(true);break;}
      if(ball.y>H+30){resolve(false);break;}
    }
    if(ball){trail.push({x:ball.x,y:ball.y});if(trail.length>14)trail.shift();}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#232946';ctx.fillRect(0,600,W,H-600);
  ctx.fillStyle='#2e3a68';ctx.fillRect(0,596,W,6);
  ctx.fillStyle='#455a64';ctx.fillRect(hoopX-6,0,12,RIMY-94);
  ctx.fillStyle='#cfd8dc';ctx.fillRect(hoopX-62,RIMY-94,124,84);
  ctx.strokeStyle='#90a4ae';ctx.lineWidth=2;ctx.strokeRect(hoopX-20,RIMY-58,40,34);
  ctx.strokeStyle='#ff7043';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(hoopX-RH,RIMY);ctx.lineTo(hoopX+RH,RIMY);ctx.stroke();
  ctx.strokeStyle='#e8eaf6';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(hoopX-RH,RIMY);ctx.lineTo(hoopX-10,RIMY+44);ctx.moveTo(hoopX+RH,RIMY);ctx.lineTo(hoopX+10,RIMY+44);
  ctx.moveTo(hoopX-RH,RIMY);ctx.lineTo(hoopX+10,RIMY+44);ctx.moveTo(hoopX+RH,RIMY);ctx.lineTo(hoopX-10,RIMY+44);ctx.stroke();
  for(var i=0;i<trail.length;i++){
    ctx.fillStyle='rgba(255,152,0,'+(i/trail.length*0.4)+')';
    ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,6,0,7);ctx.fill();
  }
  if(ball){
    ctx.fillStyle='#ff9800';ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);ctx.fill();
    ctx.strokeStyle='#5d2c00';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);
    ctx.moveTo(ball.x-BR,ball.y);ctx.lineTo(ball.x+BR,ball.y);
    ctx.moveTo(ball.x,ball.y-BR);ctx.quadraticCurveTo(ball.x+5,ball.y,ball.x,ball.y+BR);ctx.stroke();
  }
  ctx.fillStyle='#e8eaf6';ctx.font='16px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('得分 '+score+' / 15',14,28);
  ctx.fillText('连击 x'+combo,14,52);
  ctx.textAlign='right';ctx.fillText('失误 '+miss+' / 3',W-14,28);
  if(phase==='charge'||phase==='idle'){
    var bx=140,bw=200;
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx,620,bw,16);
    ctx.fillStyle='rgba(102,187,106,.45)';ctx.fillRect(bx+bw*0.41,620,bw*0.18,16);
    if(phase==='charge'){ctx.fillStyle='#ffd54f';ctx.fillRect(bx,620,bw*meter,16);}
    ctx.strokeStyle='#9fa8da';ctx.strokeRect(bx,620,bw,16);
    ctx.fillStyle='#9fa8da';ctx.textAlign='center';ctx.font='13px system-ui,sans-serif';
    ctx.fillText(phase==='charge'?'松开出手！':'按住蓄力，篮筐在绿区力度时刚好入框',W/2,610);
  }
  if(msg&&phase==='res'){ctx.fillStyle='#ffd54f';ctx.textAlign='center';ctx.font='20px system-ui,sans-serif';ctx.fillText(msg,W/2,110);}
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();press();});
window.addEventListener('pointerup',function(){releaseP();});
window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();if(!e.repeat)press();}});
window.addEventListener('keyup',function(e){if(e.code==='Space')releaseP();});
ovB.addEventListener('click',function(){ov.classList.add('hidden');reset();});
var last=performance.now();
function loop(t){var dt=Math.min(0.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

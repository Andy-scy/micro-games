<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>禅意叠塔</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:21px;margin:4px 0 2px;color:#a3d9cb}
.hint{font-size:13px;color:#9aa3c0;margin-bottom:6px;text-align:center;line-height:1.5}
#cv{background:#141933;border-radius:14px;max-width:100%;touch-action:none}
.ov{position:fixed;inset:0;background:rgba(8,10,22,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1b2040;border:1px solid #2e3660;border-radius:16px;padding:24px 28px;text-align:center;max-width:86%}
.card h2{color:#a3d9cb;margin-bottom:10px;font-size:22px}
.card p{font-size:14px;color:#c3cae6;margin-bottom:8px;line-height:1.7}
.card .sc{font-size:17px;color:#7ee0a3}
button{margin-top:8px;background:#a3d9cb;color:#141933;border:none;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>禅意叠塔</h1>
<p class="hint">没有切割,只有呼吸 · 方块随你的心境摇摆,越急越晃,点击或空格落子</p>
<canvas id="cv" width="420" height="640"></canvas>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">禅意叠塔</h2><p id="ovM">悬停的方块会左右轻摆,摆幅由你的「心境」决定:<br>每次失手,摆幅都会变大;每次完美,心湖重归平静。<br>错得太多塔身也会被磨窄。不急,慢慢来。</p><p class="sc" id="ovS"></p><button id="ovB">开始游戏</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovM=document.getElementById('ovM'),ovS=document.getElementById('ovS'),ovB=document.getElementById('ovB');
var W=cv.width,H=cv.height,GROUND=560,BH=22;
var tower,amp,ph,combo,score,state='ready',cam=0,drop,petals;

function layerC(i){return 'hsl('+((i*9+178)%360)+',42%,64%)';}
function topB(){return tower[tower.length-1];}
function reset(){
  tower=[{x:210,w:130}];amp=22;ph=0;combo=0;score=0;cam=0;drop=null;
  petals=[];var i;for(i=0;i<16;i++)petals.push({x:Math.random()*W,y:Math.random()*H,v:14+Math.random()*22,ph:Math.random()*6.28,s:2+Math.random()*2});
}
function pop(txt,x,y,c){pops.push({t:txt,x:x,y:y,c:c||'#a3d9cb',life:1.1});}
var pops=[];
function tap(){
  if(state!=='play'||drop)return;
  var t=topB(),hoverY=GROUND-(tower.length+1)*BH;
  var hx=t.x+Math.sin(ph)*amp;
  drop={x:hx,y:hoverY,vy:0,w:t.w};
}
function land(){
  var t=topB();
  var topY=GROUND-tower.length*BH;
  var err=drop.x-t.x,ad=Math.abs(err),ovw=(t.w+drop.w)/2-ad;
  drop.y=topY-11;
  if(ovw<=0){
    finish('心随塔倾');return;
  }
  if(ad<=7){
    combo++;amp=Math.max(12,amp-7);
    var pts=15+combo*3;score+=pts;
    pop('合 +'+pts,drop.x,topY-16,'#a3d9cb');
    tower.push({x:drop.x,w:t.w});
  }else{
    combo=0;
    amp=Math.min(68,amp+5+ad*0.06);
    var nw=Math.max(26,t.w-Math.max(0,ad-7)*0.55);
    score+=8;
    pop('偏 '+ad.toFixed(0),drop.x,topY-16,'#e599f7');
    tower.push({x:drop.x,w:nw});
  }
  drop=null;
}
function finish(title){
  state='over';
  var h=tower.length-1;
  window.setTimeout(function(){
    ovT.textContent=title;
    ovS.textContent='塔成 '+h+' 层 · 得分 '+score;
    ovM.textContent='心境平和时,方块也会停稳';
    ovB.textContent='再来一局';
    ov.style.display='flex';
  },800);
}
function start(){reset();state='play';ov.style.display='none';}
function step(dt){
  var i;
  if(state==='play'){
    ph+=dt*(0.8+amp*0.008);
    if(drop){
      drop.vy+=2400*dt;
      drop.y+=drop.vy*dt;
      var topY=GROUND-tower.length*BH;
      if(drop.y+11>=topY)land();
    }
  }
  for(i=0;i<petals.length;i++){
    var p=petals[i];p.y+=p.v*dt;p.x+=Math.sin(p.y*0.01+p.ph)*16*dt;
    if(p.y>H+6){p.y=-6;p.x=Math.random()*W;}
  }
  for(i=pops.length-1;i>=0;i--){pops[i].life-=dt;if(pops[i].life<=0)pops.splice(i,1);}
  cam=Math.max(0,300-(GROUND-tower.length*BH));
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1c33');g.addColorStop(0.6,'#232041');g.addColorStop(1,'#0f1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i;
  ctx.fillStyle='rgba(229,153,247,.35)';
  for(i=0;i<petals.length;i++){
    var p=petals[i];
    ctx.beginPath();ctx.ellipse(p.x,p.y,p.s,p.s*0.55,p.ph,0,6.283);ctx.fill();
  }
  var gy=GROUND-cam;
  ctx.fillStyle='#1d2447';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2e3660';ctx.fillRect(0,gy,W,5);
  var b,y;
  for(i=0;i<tower.length;i++){
    b=tower[i];y=GROUND-(tower.length-i)*BH-cam;
    if(y<-BH||y>H)continue;
    ctx.fillStyle=layerC(i);rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(b.x-b.w/2+4,y+5,Math.max(0,b.w-8),4);
  }
  var t=topB(),topY=GROUND-tower.length*BH;
  if(state==='play'&&!drop){
    var hx=t.x+Math.sin(ph)*amp,hoverY=topY-BH-6-cam;
    ctx.strokeStyle='rgba(163,217,203,.3)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(t.x,topY-BH/2-6-cam,t.w/2+14+Math.sin(ph*2)*3,0,6.283);ctx.stroke();
    ctx.fillStyle=layerC(tower.length);rr(hx-t.w/2,hoverY+2,t.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';rr(hx-t.w/2,hoverY+2,t.w,BH-4,5);ctx.stroke();
  }
  if(drop){ctx.fillStyle=layerC(tower.length);rr(drop.x-drop.w/2,drop.y-11-cam,drop.w,BH-4,5);ctx.fill();}
  ctx.globalAlpha=1;
  var ring=10+amp*0.22;
  ctx.strokeStyle=amp>45?'#e599f7':'#a3d9cb';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(40,44,ring+Math.sin(ph*2)*2,0,6.283);ctx.stroke();
  ctx.fillStyle='#9aa3c0';ctx.font='12px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('心境',26,86);
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='right';
  ctx.fillText('得分 '+score,W-14,32);
  ctx.fillText('层数 '+(tower.length-1),W-14,58);
  if(combo>1){ctx.fillStyle='#a3d9cb';ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('静心连击 x'+combo,14,116);}
  for(i=0;i<pops.length;i++){var p2=pops[i];ctx.globalAlpha=Math.max(0,p2.life);ctx.fillStyle=p2.c;ctx.font='bold 17px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p2.t,p2.x,p2.y-cam);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function tapWrap(){tap();}
if(window.PointerEvent){cv.addEventListener('pointerdown',function(e){e.preventDefault();tapWrap();});}
else{cv.addEventListener('mousedown',function(){tapWrap();});cv.addEventListener('touchstart',function(e){e.preventDefault();tapWrap();});}
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowDown'||e.key===' '){e.preventDefault();tapWrap();}});
ovB.addEventListener('click',start);
reset();
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,0.033);if(dt<0)dt=0;last=ts;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

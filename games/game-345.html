<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字密码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#fcd34d;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#fcd34d;font-size:16px}
.gbtn{background:#3a2f10;color:#fcd34d;border:1px solid #fcd34d;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#fcd34d;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.screen{height:86px;border-radius:12px;background:#0b0e1c;border:1px solid #2a3258;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.screen span{font-size:52px;font-weight:800;color:#fcd34d;letter-spacing:4px}
.screen.show span{color:#fde68a;text-shadow:0 0 22px rgba(252,211,77,.8)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:380px;margin:0 auto;touch-action:manipulation}
.key{aspect-ratio:1/1;border-radius:10px;background:#1b2140;border:1px solid #2a3258;color:#c7cbe8;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .06s,box-shadow .12s,background .12s}
.key:active{transform:scale(.92)}
.key.lit{background:#fcd34d;color:#3a2f10;border-color:#fef3c7;box-shadow:0 0 20px rgba(252,211,77,.8)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#fcd34d;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#fcd34d;color:#3a2f10;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>数字密码</h1>
  <p class="hint">密码锁式记忆序列:屏幕上会依次跳出 0-9 的数字并伴随按键高亮,看清后按原顺序输入密码。点击键盘或直接敲键盘数字均可。</p>
  <div class="hud">
    <span>轮数 <b id="lv">0</b></span>
    <span>密码长 <b id="len">0</b></span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="screen" id="screen"><span id="digit">—</span></div>
  <div class="keys" id="keys"></div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">数字密码</h2>
    <p id="ovDesc">十位数字键盘,考验的是纯数字工作记忆。每一轮密码加长一位,输错即锁定。试试把数字两两分组来记,像背手机号一样。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始解锁</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg345_best",GAP=680,FLASH=400;
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var keys=[],ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elLen=$("len"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
var screenEl=$("screen"),digitEl=$("digit");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.24;v=v==null?0.15:v;o.type=type||"square";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var box=$("keys");for(var i=0;i<10;i++){var d=document.createElement("div");d.className="key";d.textContent=String(i);d.dataset.i=String(i);box.appendChild(d);keys.push(d);}})();
function showDigit(n){digitEl.textContent=n===null?"—":String(n);if(n===null){screenEl.classList.remove("show");return;}screenEl.classList.add("show");}
function flash(i){var el=keys[i];el.classList.add("lit");showDigit(i);tone(280+i*36,0.22,0.1);timers.push(setTimeout(function(){el.classList.remove("lit");screenEl.classList.remove("show");},FLASH));}
function clearLit(){for(var i=0;i<10;i++)keys[i].classList.remove("lit");screenEl.classList.remove("show");digitEl.textContent="—";}
function rnd(){var n;do{n=(Math.random()*10)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function updateHud(){elLv.textContent=level;elLen.textContent=seq.length;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playSeq(){state="show";showDigit(null);setMsg("密码输入中,看屏幕…");var i=0;(function step(){if(i>=seq.length){state="input";pos=0;setMsg("请按顺序输入密码!");return;}flash(seq[i]);i++;timers.push(setTimeout(step,GAP));})();}
function nextRound(){seq.push(rnd());updateHud();playSeq();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;level=0;state="wait";setMsg("");updateHud();timers.push(setTimeout(nextRound,600));}
function winStep(){level++;state="wait";setMsg("解锁成功!密码加长…");updateHud();timers.push(setTimeout(nextRound,800));}
function fail(){clearTimers();clearLit();state="over";tone(92,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="密码锁定";
ovDesc.textContent="第 "+seq.length+" 位密码输错,保险柜重新锁上。两位一组分段记忆,是目前最科学的背法。";
ovScore.style.display="block";ovScore.textContent="成功解锁 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flash(i);if(seq[pos]===i){pos++;if(pos>=seq.length)winStep();}else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
$("keys").addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;if(k>="0"&&k<="9")press(parseInt(k,10));});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>

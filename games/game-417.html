<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔上小怪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:21px;margin:4px 0 2px;color:#69db7c}
.hint{font-size:13px;color:#9aa3c0;margin-bottom:6px;text-align:center;line-height:1.5}
#cv{background:#141933;border-radius:14px;max-width:100%;touch-action:none}
.ov{position:fixed;inset:0;background:rgba(8,10,22,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:#1b2040;border:1px solid #2e3660;border-radius:16px;padding:24px 28px;text-align:center;max-width:86%}
.card h2{color:#69db7c;margin-bottom:10px;font-size:22px}
.card p{font-size:14px;color:#c3cae6;margin-bottom:8px;line-height:1.7}
.card .sc{font-size:17px;color:#7ee0a3}
button{margin-top:8px;background:#69db7c;color:#141933;border:none;border-radius:999px;padding:10px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>塔上小怪</h1>
<p class="hint">黏糊糊的小怪会爬上塔偷吃方块 · 放块压扁它拿奖励,点击或空格放置</p>
<canvas id="cv" width="420" height="640"></canvas>
<div class="ov" id="ov"><div class="card"><h2 id="ovT">塔上小怪</h2><p id="ovM">小怪们不断爬上塔,顺着塔身一层层往上爬,爬到塔顶就啃掉一层方块!<br>在它所在的层上再放一块就能把它压扁(+30 分)。塔被吃光即输,切割叠法照旧。</p><p class="sc" id="ovS"></p><button id="ovB">开始游戏</button></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovM=document.getElementById('ovM'),ovS=document.getElementById('ovS'),ovB=document.getElementById('ovB');
var W=cv.width,H=cv.height,GROUND=560,BH=22;
var tower,cur,fx,pops,slimes,score,streak,state='ready',cam=0,spawnT,tgl;

function layerC(i){return 'hsl('+((i*14+110)%360)+',48%,55%)';}
function topB(){return tower[tower.length-1];}
function reset(){
  tower=[{x:210,w:150}];score=0;streak=0;fx=[];pops=[];slimes=[];cam=0;spawnT=2.5;tgl=0;
  spawn();
}
function spawn(){
  var t=topB(),left=Math.random()<0.5;
  cur={x:left?36:W-36,dir:left?1:-1,w:t.w,spd:Math.min(2.2+(tower.length-1)*0.06,5.4)};
}
function pop(txt,x,y,c){pops.push({t:txt,x:x,y:y,c:c||'#69db7c',life:1});}
function place(){
  var t=topB();
  var delta=cur.x-t.x,ad=Math.abs(delta),ovw=t.w-ad;
  var byY=GROUND-(tower.length+1)*BH+BH/2;
  if(ovw<=0){
    fx.push({x:cur.x,y:byY,w:cur.w,vx:cur.dir*80,vy:-60,rot:0,vr:cur.dir*2.4,life:1.5,c:layerC(tower.length)});
    cur=null;finish();return;
  }
  var i;
  for(i=slimes.length-1;i>=0;i--){
    if(slimes[i].li===tower.length-1){
      pop('压扁小怪 +30',slimes[i].x,byY-14,'#69db7c');
      score+=30;
      fx.push({x:slimes[i].x,y:GROUND-(tower.length)*BH+4,w:20,vx:slimes[i].dir*40,vy:-120,rot:0,vr:4,life:0.8,c:'#51cf66'});
      slimes.splice(i,1);
    }
  }
  if(ad<=6){
    streak++;var pts=10+streak*4;score+=pts;
    pop('完美 +'+pts,t.x,byY-30,'#ffd166');
    tower.push({x:t.x,w:t.w});
  }else{
    streak=0;score+=10;
    var cl=cur.x-cur.w/2,cr=cur.x+cur.w/2,tl=t.x-t.w/2,tr=t.x+t.w/2;
    var ol=Math.max(cl,tl),orr=Math.min(cr,tr);
    var nx=(ol+orr)/2,nw=orr-ol,pw,px;
    if(delta>0){pw=cr-tr;px=(tr+cr)/2;}else{pw=tl-cl;px=(cl+tl)/2;}
    if(pw>1)fx.push({x:px,y:byY,w:pw,vx:delta>0?150:-150,vy:-40,rot:0,vr:delta>0?2.6:-2.6,life:1.5,c:layerC(tower.length)});
    tower.push({x:nx,w:nw});
  }
  spawn();
}
function finish(){
  state='over';
  var h=tower.length-1;
  window.setTimeout(function(){
    ovT.textContent='塔被吃光了!';
    ovS.textContent='最终高度 '+h+' 层 · 得分 '+score;
    ovM.textContent='小怪爬到哪一层,就把砖放到哪一层';
    ovB.textContent='再来一局';
    ov.style.display='flex';
  },650);
}
function start(){reset();state='play';ov.style.display='none';}
function step(dt){
  var i;
  if(state==='play'){
    tgl+=dt;
    spawnT-=dt;
    if(spawnT<=0&&slimes.length<3&&tower.length>1){
      spawnT=3.2+Math.random()*2.2;
      var li=Math.floor(Math.random()*tower.length);
      var b=tower[li];
      slimes.push({li:li,x:b.x+(Math.random()*(b.w-30)-((b.w-30)/2)),dir:Math.random()<0.5?1:-1,sp:24+Math.random()*22,climb:4+Math.random()*3});
      pop('小怪来了!',b.x,GROUND-(li+1)*BH-10,'#51cf66');
    }
    for(i=slimes.length-1;i>=0;i--){
      var s=slimes[i];
      if(s.li>=tower.length)s.li=tower.length-1;
      var bb=tower[s.li];
      s.x+=s.dir*s.sp*dt;
      var lo=bb.x-bb.w/2+12,hi=bb.x+bb.w/2-12;
      if(s.x<lo){s.x=lo;s.dir=1;}
      if(s.x>hi){s.x=hi;s.dir=-1;}
      s.climb-=dt;
      if(s.climb<=0){
        s.climb=5+Math.random()*3;
        if(s.li===tower.length-1){
          var tb=tower[tower.length-1];
          fx.push({x:tb.x,y:GROUND-tower.length*BH+BH/2,w:tb.w,vx:0,vy:-60,rot:0,vr:1.2,life:1,c:layerC(tower.length-1)});
          tower.pop();
          pop('被啃掉一层!',tb.x,GROUND-(tower.length)*BH-10,'#ff8787');
          if(tower.length<=1){finish();return;}
          s.li=tower.length-1;
        }else{
          s.li++;
          var nb=tower[s.li];
          s.x=nb.x;pop('小怪上楼!',nb.x,GROUND-(s.li+1)*BH-10,'#51cf66');
        }
      }
    }
    if(cur){
      cur.x+=cur.spd*cur.dir*dt*60;
      var m=cur.w/2+6;
      if(cur.x<m){cur.x=m;cur.dir=1;}
      if(cur.x>W-m){cur.x=W-m;cur.dir=-1;}
    }
  }
  for(i=fx.length-1;i>=0;i--){var f=fx[i];f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var p=pops[i];p.life-=dt;p.y-=34*dt;if(p.life<=0)pops.splice(i,1);}
  cam=Math.max(0,300-(GROUND-tower.length*BH));
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawSlime(x,y,t2,dir){
  var sq=Math.sin(t2*8)*2;
  ctx.fillStyle='#51cf66';
  ctx.beginPath();ctx.ellipse(x,y-7-sq*0.5,11+sq,9-sq,0,0,6.283);ctx.fill();
  ctx.fillStyle='#0b3d1f';
  ctx.beginPath();ctx.arc(x-4+dir*2,y-9,2.2,0,6.283);ctx.arc(x+4+dir*2,y-9,2.2,0,6.283);ctx.fill();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#152b1e');g.addColorStop(1,'#0f1220');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var gy=GROUND-cam;
  ctx.fillStyle='#1d2447';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#2e3660';ctx.fillRect(0,gy,W,5);
  var i,b,y;
  for(i=0;i<tower.length;i++){
    b=tower[i];y=GROUND-(tower.length-i)*BH-cam;
    if(y<-BH||y>H)continue;
    ctx.fillStyle=layerC(i);rr(b.x-b.w/2,y+2,b.w,BH-4,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x-b.w/2+4,y+5,Math.max(0,b.w-8),4);
  }
  for(i=0;i<slimes.length;i++){
    var s=slimes[i];
    var sy=GROUND-(s.li+1)*BH-cam;
    if(sy>-20&&sy<H+20)drawSlime(s.x,sy,tgl,s.dir);
  }
  if(cur&&state==='play'){
    y=GROUND-(tower.length+1)*BH-cam;
    ctx.fillStyle=layerC(tower.length);rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;rr(cur.x-cur.w/2,y+2,cur.w,BH-4,5);ctx.stroke();
  }
  for(i=0;i<fx.length;i++){
    var f=fx[i];ctx.save();ctx.translate(f.x,f.y-cam);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.c;ctx.fillRect(-f.w/2,-(BH-4)/2,f.w,BH-4);ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,14,32);
  ctx.textAlign='right';ctx.fillText('高度 '+(tower.length-1)+' 层',W-14,32);
  if(streak>1){ctx.fillStyle='#ffd166';ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('连击 x'+streak,14,56);}
  for(i=0;i<pops.length;i++){var p=pops[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y-cam);}
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function tap(){if(state==='play'&&cur)place();}
if(window.PointerEvent){cv.addEventListener('pointerdown',function(e){e.preventDefault();tap();});}
else{cv.addEventListener('mousedown',function(){tap();});cv.addEventListener('touchstart',function(e){e.preventDefault();tap();});}
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowDown'||e.key===' '){e.preventDefault();tap();}});
ovB.addEventListener('click',start);
reset();
var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,0.033);if(dt<0)dt=0;last=ts;step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

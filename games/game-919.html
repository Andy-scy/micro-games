<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>橄榄球长传</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
h1{font-size:20px;color:#a5d6a7;margin:4px 0}
.tip{font-size:13px;color:#9fa8da;text-align:center;margin-bottom:8px}
#stage{position:relative;line-height:0}
canvas{background:#161b30;border-radius:14px;max-width:96vw;height:auto;touch-action:none;display:block}
#overlay{position:absolute;inset:0;background:rgba(8,10,22,.85);display:flex;align-items:center;justify-content:center;border-radius:14px}
#overlay.hidden{display:none}
.card{background:#232946;border:1px solid #4a5290;border-radius:14px;padding:20px 30px;text-align:center;max-width:80%;line-height:1.6}
.card h2{color:#a5d6a7;margin-bottom:8px;font-size:22px}
.card p{font-size:15px;color:#c5cae9}
.card button{margin-top:14px;padding:9px 30px;font-size:16px;font-weight:700;border:none;border-radius:9px;background:#a5d6a7;color:#1b3a1f;cursor:pointer}
.card button:active{transform:scale(.95)}
</style>
</head>
<body>
<h1>橄榄球长传</h1>
<p class="tip">点击球场送出长传，落点要领在奔跑中的外接手身前 · 传进对方端区达阵 +3，普通接球 +1，被拦截则不得分 · 8 次传球拿 12 分获胜</p>
<div id="stage">
<canvas id="cv" width="480" height="640"></canvas>
<div id="overlay" class="hidden"><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="btnRe">再来一局</button></div></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText'),ovB=document.getElementById('btnRe');
var W=480,H=640,TL=140;
var score,rounds,phase,wr,df,ball,msg,msgT,aimX,aimY,turnT;
function rnd(a,b){return a+Math.random()*(b-a);}
function reset(){
  score=0;rounds=0;phase='ready';ball=null;msg='';msgT=0;aimX=240;aimY=300;
  newPlay();
}
function newPlay(){
  rounds++;
  var dir=Math.random()<0.5?1:-1;
  wr={x:dir>0?70:410,y:rnd(210,390),dir:dir,v:rnd(150,225),turnAt:rnd(0.9,2.4),t:0};
  df={x:wr.x-wr.dir*40,y:wr.y+10};
  ball=null;phase='ready';turnT=0;
}
function throwTo(tx,ty){
  if(phase!=='ready'||ball)return;
  var d=Math.hypot(tx-240,ty-575);
  ball={x:240,y:575,sx:240,sy:575,tx:Math.max(12,Math.min(W-12,tx)),ty:Math.max(30,Math.min(H-30,ty)),t:0,T:Math.max(0.35,d/470)};
  phase='fly';
}
function resolveBall(){
  var caught=Math.hypot(wr.x-ball.tx,wr.y-ball.ty)<34;
  var picked=!caught&&Math.hypot(df.x-ball.tx,df.y-ball.ty)<30;
  var tx=ball.tx,ty=ball.ty;
  ball=null;
  if(caught){
    if(ty<TL){score+=3;msg='达阵！+3';}
    else{score+=1;msg='接球成功 +1';}
    msgT=1.2;phase='res';
  }else if(picked){
    msg='被拦截了！';msgT=1.2;phase='res';
  }else{
    msg='没人接到…';msgT=1.2;phase='res';
  }
}
function endTurn(){
  if(rounds>=8){
    phase='over';
    ovT.textContent=score>=12?'王牌四分卫！':'比赛结束';
    ovX.textContent='8 传共得 '+score+' 分'+(score>=12?'，你的长传能撕开任何防线！':'（目标 12 分）。朝外接手跑动方向的前方传，别传他身后。');
    ov.classList.remove('hidden');
  }else{
    newPlay();
  }
}
function update(dt){
  msgT-=dt;
  if(phase==='ready'||phase==='fly'){
    turnT+=dt;
    wr.t+=dt;
    if(wr.t>wr.turnAt){
      wr.dir=-wr.dir;
      wr.turnAt=wr.t+rnd(1.2,2.6);
    }
    wr.x+=wr.dir*wr.v*dt;
    if(wr.x<24){wr.x=24;wr.dir=1;}
    if(wr.x>W-24){wr.x=W-24;wr.dir=-1;}
    var dtx,dty,dspd;
    if(!ball){dtx=wr.x-wr.dir*36;dty=wr.y+8;dspd=wr.v*0.96+8;}
    else{dtx=ball.tx;dty=ball.ty;dspd=272;}
    var dd=Math.hypot(dtx-df.x,dty-df.y)||1;
    var mv=Math.min(dspd*dt,dd);
    df.x+=(dtx-df.x)/dd*mv;
    df.y+=(dty-df.y)/dd*mv;
  }
  if(phase==='ready'&&!ball){
    if(turnT>6){msg='机会溜走了…';msgT=1;phase='res';}
  }
  if(phase==='fly'&&ball){
    ball.t+=dt/ball.T;
    if(ball.t>=1){ball.t=1;resolveBall();}
  }
  if(phase==='res'&&msgT<=0)endTurn();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1f4d24';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.05)';
  for(var i=0;i<9;i++)ctx.fillRect(0,160+i*52,W,2);
  ctx.fillStyle='#2e5b33';ctx.fillRect(0,0,W,TL);
  ctx.strokeStyle='#e8eaf6';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,TL);ctx.lineTo(W,TL);ctx.stroke();
  ctx.fillStyle='#a5d6a7';ctx.font='15px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('达 阵 区',W/2,80);
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(60,TL);ctx.lineTo(60,40);ctx.moveTo(420,TL);ctx.lineTo(420,40);ctx.stroke();
  ctx.fillStyle='#33691e';ctx.fillRect(204,568,72,20);
  ctx.fillStyle='#ffca28';ctx.beginPath();ctx.arc(240,578,9,0,7);ctx.fill();
  ctx.strokeStyle='#5d4037';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(231,578);ctx.lineTo(249,578);ctx.stroke();
  ctx.fillStyle='#ef9a9a';
  ctx.beginPath();ctx.arc(df.x,df.y,11,0,7);ctx.fill();
  ctx.fillStyle='#c62828';ctx.fillRect(df.x-9,df.y+8,18,16);
  ctx.fillStyle='#e8eaf6';
  ctx.beginPath();ctx.arc(wr.x,wr.y,11,0,7);ctx.fill();
  ctx.fillStyle='#1b5e20';ctx.fillRect(wr.x-9,wr.y+8,18,16);
  ctx.fillStyle='#ffca28';ctx.fillRect(wr.x-4,wr.y+2,8,5);
  if(phase==='ready'&&!ball){
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.setLineDash([5,7]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(aimX,aimY,17,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(aimX-24,aimY);ctx.lineTo(aimX+24,aimY);ctx.moveTo(aimX,aimY-24);ctx.lineTo(aimX,aimY+24);ctx.stroke();
    ctx.setLineDash([]);
  }
  if(ball){
    var t=ball.t;
    var bx=ball.sx+(ball.tx-ball.sx)*t;
    var by=ball.sy+(ball.ty-ball.sy)*t-150*Math.sin(Math.PI*t);
    ctx.save();ctx.translate(bx,by);ctx.rotate(t*7*(ball.tx>ball.sx?1:-1));
    ctx.fillStyle='#a1887f';ctx.beginPath();ctx.ellipse(0,0,11,6.5,0,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#e8eaf6';ctx.font='16px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('得分 '+score+' / 12',14,28);
  ctx.fillStyle='#9fa8da';ctx.font='13px system-ui,sans-serif';
  ctx.fillText('第 '+Math.min(8,rounds)+' / 8 传',14,50);
  if(msgT>0){ctx.fillStyle='#ffd54f';ctx.font='20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(msg,W/2,480);}
  if(phase==='ready'&&!ball){ctx.fillStyle='#c5cae9';ctx.font='13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('点击落点传球（空格 = 自动传向前方）',W/2,620);}
}
cv.addEventListener('pointermove',function(e){
  var r=cv.getBoundingClientRect();
  aimX=(e.clientX-r.left)*(W/r.width);aimY=(e.clientY-r.top)*(H/r.height);
});
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var r=cv.getBoundingClientRect();
  throwTo((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();if(!e.repeat&&phase==='ready')throwTo(wr.x+wr.dir*85,wr.y-14);}
});
ovB.addEventListener('click',function(){ov.classList.add('hidden');reset();});
var last=performance.now();
function loop(t){var dt=Math.min(0.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

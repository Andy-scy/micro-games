<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无猜扫雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 18px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:21px;color:#22d3ee;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12.5px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#22d3ee;font-size:15px}
.stage{position:relative}
.grid{display:grid;gap:2px;background:#0b0e1a;padding:7px;border-radius:10px;width:max-content;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:var(--cs);height:var(--cs);border-radius:4px;background:#2a3050;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cs)*.5);cursor:pointer}
.cell.op{background:#12162b;cursor:default}
.cell.fl{background:#1f3a4a;color:#22d3ee}
.cell.mn{background:#3b1d1d;color:#f87171}
.cell.bo{background:#7f1d1d;color:#fff}
.cell.wm{background:#3b2f52;color:#6b7280}
.n1{color:#7dd3fc}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#c084fc}.n5{color:#fbbf24}.n6{color:#2dd4bf}.n7{color:#f472b6}.n8{color:#e8eaf6}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.9);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#22d3ee}
.overlay p{color:#aab0d0;font-size:13.5px;line-height:1.9;white-space:pre-line}
.overlay .big{font-size:20px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#22d3ee;color:#04222b;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>无猜扫雷</h1>
  <p class="hint">本局雷图经过求解器验证,全程可推理、绝不卡死!<br>点击翻开 · 右键/长按插旗 · 点数字快速清算,纯逻辑通关</p>
  <div class="hud">
    <span>剩余雷数 <b id="mleft">10</b></span>
    <span>用时 <b id="time">0</b> 秒</span>
    <span>最佳 <b id="best">--</b></span>
  </div>
  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="ov">
      <h2 id="ovT">无猜扫雷</h2>
      <p id="ovP">首击之后生成雷图,
并用内置求解器验证「每一步都可推理」,
不需要运气,只需逻辑!</p>
      <p class="big" id="ovS" style="display:none"></p>
      <button id="btnGo">开始游戏</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var W=10,H=10,MINES=10,N=W*H;
var grid=document.getElementById("grid");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovS=document.getElementById("ovS"),btnGo=document.getElementById("btnGo");
var elM=document.getElementById("mleft"),elT=document.getElementById("time"),elB=document.getElementById("best");
var NB=[],cells=[],mines=[],num=[],st=[],opened=0,flags=0,placed=false,over=false;
var t0=0,elapsed=0,best=loadBest("mg_m283");
function loadBest(k){try{return parseInt(localStorage.getItem(k)||"",10)||0;}catch(e){return 0;}}
function saveBest(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
(function(){var i,x,y,dx,dy,nx,ny;for(i=0;i<N;i++){x=i%W;y=(i/W)|0;var r=[];for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;nx=x+dx;ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H)r.push(ny*W+nx);}NB.push(r);}})();
function calcNums(){var i,k;num=new Array(N);for(i=0;i<N;i++)num[i]=0;for(i=0;i<N;i++){if(mines[i])continue;var c=0;for(k=0;k<NB[i].length;k++)if(mines[NB[i][k]])c++;num[i]=c;}}
function placeMines(safe,count){var i,cnt=0;mines=new Array(N);for(i=0;i<N;i++)mines[i]=false;while(cnt<count){var j=(Math.random()*N)|0;if(!mines[j]&&!safe[j]){mines[j]=true;cnt++;}}calcNums();}
function solverOk(first){
  var st2=new Array(N),f2=new Array(N),op2=0,i,k,progress=true;
  for(i=0;i<N;i++){st2[i]=0;f2[i]=false;}
  function open2(s){
    var stk=[s];
    while(stk.length){
      var j=stk.pop();
      if(st2[j]!==0||mines[j])continue;
      st2[j]=1;op2++;
      if(num[j]===0){for(var k2=0;k2<NB[j].length;k2++){if(st2[NB[j][k2]]===0&&!mines[NB[j][k2]])stk.push(NB[j][k2]);}}
    }
  }
  open2(first);
  while(progress&&op2<N-MINES){
    progress=false;
    for(i=0;i<N;i++){
      if(st2[i]!==1||num[i]===0)continue;
      var f=0,hid=[];
      for(k=0;k<NB[i].length;k++){var j2=NB[i][k];if(f2[j2])f++;else if(st2[j2]===0)hid.push(j2);}
      if(f===num[i]&&hid.length){
        for(k=0;k<hid.length;k++){if(mines[hid[k]])return false;open2(hid[k]);}
        progress=true;
      }else if(hid.length&&hid.length===num[i]-f){
        for(k=0;k<hid.length;k++){if(!f2[hid[k]]){f2[hid[k]]=true;progress=true;}}
      }
    }
  }
  return op2>=N-MINES;
}
function generate(first){
  var mcap=MINES,attempt,ok=false;
  for(attempt=0;attempt<110&&!ok;attempt++){
    if(attempt===60&&mcap>7){mcap--;MINES=mcap;}
    placeMines((function(){var s={};s[first]=true;return s;})(),mcap);
    ok=solverOk(first);
  }
}
function buildGrid(){
  grid.innerHTML="";grid.style.gridTemplateColumns="repeat("+W+", var(--cs))";
  var cs=Math.max(20,Math.min(38,Math.floor((Math.min(window.innerWidth,520)-44)/W)));
  grid.style.setProperty("--cs",cs+"px");
  cells=new Array(N);
  for(var i=0;i<N;i++){var d=document.createElement("div");d.className="cell";d.dataset.i=i;grid.appendChild(d);cells[i]=d;}
}
function render(i){
  var el=cells[i],s=st[i];el.className="cell";el.textContent="";
  if(s===1){el.classList.add("op");if(mines[i]){el.classList.add("bo");el.textContent="✸";}else if(num[i]>0){el.textContent=String(num[i]);el.classList.add("n"+num[i]);}}
  else if(s===2){el.classList.add("fl");el.textContent="⚑";}
  else{if(over&&mines[i]){el.classList.add(i===boomIdx?"bo":"mn");el.textContent="✸";}}
}
var boomIdx=-1;
function openCell(i){
  if(st[i]!==0||mines[i])return;
  var stk=[i];
  while(stk.length){
    var j=stk.pop();
    if(st[j]!==0||mines[j])continue;
    st[j]=1;opened++;render(j);
    if(num[j]===0){for(var k=0;k<NB[j].length;k++){if(st[NB[j][k]]===0&&!mines[NB[j][k]])stk.push(NB[j][k]);}}
  }
}
function chord(i){
  if(num[i]===0)return;
  var f=0,hid=[],k;
  for(k=0;k<NB[i].length;k++){var j=NB[i][k];if(st[j]===2)f++;else if(st[j]===0)hid.push(j);}
  if(f!==num[i]||!hid.length)return;
  for(k=0;k<hid.length;k++){
    if(mines[hid[k]]){hitMine(hid[k]);return;}
    openCell(hid[k]);
  }
  afterAction();
}
function hitMine(i){boomIdx=i;endGame(false);}
function updateHud(){elM.textContent=MINES-flags;elB.textContent=best?best+" 秒":"--";}
function afterAction(){updateHud();if(opened===N-MINES)endGame(true);}
function endGame(w){
  if(over)return;over=true;
  var i;
  if(w){for(i=0;i<N;i++)if(mines[i]&&st[i]!==2){st[i]=2;render(i);}
    var sec=Math.floor((Date.now()-t0)/1000);
    if(!best||sec<best){best=sec;saveBest("mg_m283",best);}
    ovT.textContent="纯逻辑通关!";ovT.style.color="#4ade80";
    ovP.textContent="用时 "+sec+" 秒,零猜雷完成无猜挑战。";
  }else{
    for(i=0;i<N;i++){if(mines[i]&&st[i]!==2)render(i);else if(!mines[i]&&st[i]===2){cells[i].classList.add("wm");}}
    ovT.textContent="踩雷了";ovT.style.color="#f87171";
    ovP.textContent="无猜图也能踩雷?一定是手滑,再来!";
  }
  updateHud();btnGo.textContent="再来一局";ov.classList.remove("hide");
}
function onOpen(i){
  if(over)return;
  if(!placed){generate(i);placed=true;t0=Date.now();updateHud();}
  if(st[i]===2)return;
  if(st[i]===1){chord(i);return;}
  if(mines[i]){hitMine(i);return;}
  openCell(i);afterAction();
}
function onFlag(i){
  if(over||st[i]===1)return;
  if(st[i]===2){st[i]=0;flags--;}else{st[i]=2;flags++;}
  render(i);updateHud();
}
function cellIndex(e){var t=e.target;while(t&&t!==grid&&!t.classList.contains("cell"))t=t.parentNode;if(t&&t!==grid)return +t.dataset.i;return -1;}
var pressTimer=null,pressIdx=-1,longFired=false;
grid.addEventListener("contextmenu",function(e){e.preventDefault();});
grid.addEventListener("pointerdown",function(e){
  var i=cellIndex(e);if(i<0||over)return;
  if(e.pointerType==="touch"){pressIdx=i;longFired=false;pressTimer=setTimeout(function(){pressTimer=null;longFired=true;onFlag(pressIdx);},350);}
  else if(e.button===2){e.preventDefault();onFlag(i);}
  else if(e.button===0){onOpen(i);}
});
grid.addEventListener("pointerup",function(e){
  if(e.pointerType!=="touch")return;
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  if(!longFired&&pressIdx>=0&&!over)onOpen(pressIdx);
});
grid.addEventListener("pointercancel",function(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
function reset(){
  over=false;placed=false;opened=0;flags=0;boomIdx=-1;elapsed=0;MINES=10;
  st=new Array(N);for(var i=0;i<N;i++)st[i]=0;
  mines=new Array(N);num=new Array(N);
  buildGrid();updateHud();
}
function frame(){
  if(placed&&!over){elapsed=Math.floor((Date.now()-t0)/1000);elT.textContent=elapsed;}
  requestAnimationFrame(frame);
}
btnGo.addEventListener("click",function(){reset();ov.classList.add("hide");});
reset();updateHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>

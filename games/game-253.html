<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题译打</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:20px;color:#7c9cff;margin-bottom:6px}
#tip{font-size:13px;color:#9aa3c0;margin-bottom:8px;text-align:center}
#hud{font-size:14px;color:#c7cdf0;margin-bottom:10px}
#stage{position:relative;width:100%;max-width:640px;background:#151a30;border-radius:14px;padding:26px 18px;text-align:center}
#zh{font-size:44px;color:#ffd76a;margin-bottom:6px}
#typed{font-size:26px;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px;min-height:38px;color:#6ee7a0}
#mask{font-size:26px;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px;color:#5a6284}
#stage.err{animation:shk .18s}
@keyframes shk{0%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}100%{transform:translateX(0)}}
#overlay{position:absolute;inset:0;background:rgba(10,12,26,.93);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;z-index:2}
#overlay.hide{display:none}
#ovTitle{font-size:24px;color:#ffd76a}
#ovText{font-size:14px;color:#c7cdf0;line-height:1.8;white-space:pre-line}
#cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#cats button{background:#232a4a;color:#9ab1ff;border:2px solid #7c9cff}
#cats button:hover{background:#2c3560}
#ovBtn{background:#7c9cff;color:#10142a;border:0}
#ovBtn.hide{display:none}
button{border-radius:10px;padding:10px 22px;font-size:16px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<h1>主题译打</h1>
<div id="tip">先选词库主题，再根据中文提示拼出英文单词；打对全部字母自动进入下一题</div>
<div id="hud"></div>
<div id="stage">
<div id="zh"></div>
<div id="typed"></div>
<div id="mask"></div>
<div id="overlay">
<div id="ovTitle"></div>
<div id="ovText"></div>
<div id="cats"></div>
<button id="ovBtn" class="hide">再来一局</button>
</div>
</div>
<input id="kc" autocomplete="off" style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0;border:0;padding:0;font-size:16px">
<script>
(function(){
var CATS={
'动物':[['大象','elephant'],['狮子','lion'],['老虎','tiger'],['熊猫','panda'],['老鹰','eagle'],['鲨鱼','shark'],['鲸鱼','whale'],['兔子','rabbit'],['蛇','snake'],['猴子','monkey'],['狼','wolf'],['熊','bear']],
'水果':[['苹果','apple'],['香蕉','banana'],['葡萄','grape'],['柠檬','lemon'],['桃子','peach'],['梨','pear'],['西瓜','watermelon'],['草莓','strawberry'],['芒果','mango'],['樱桃','cherry'],['橙子','orange'],['菠萝','pineapple']],
'科技':[['电脑','computer'],['键盘','keyboard'],['鼠标','mouse'],['屏幕','screen'],['机器人','robot'],['网络','network'],['服务器','server'],['算法','algorithm'],['数据','data'],['芯片','chip'],['代码','code'],['软件','software']],
'国家':[['中国','china'],['日本','japan'],['美国','america'],['英国','england'],['法国','france'],['德国','germany'],['印度','india'],['巴西','brazil'],['埃及','egypt'],['俄罗斯','russia'],['加拿大','canada'],['意大利','italy']]
};
var GAME_TIME=60;
var hud=document.getElementById('hud');
var zh=document.getElementById('zh'),typedEl=document.getElementById('typed'),maskEl=document.getElementById('mask'),stage=document.getElementById('stage');
var ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovX=document.getElementById('ovText');
var cats=document.getElementById('cats'),ovBtn=document.getElementById('ovBtn');
var kc=document.getElementById('kc');
var pool,qTotal,qNum,cur,idx,score,timeLeft,elapsed,okChars,errChars,running,raf,tPrev,over;
function hudUpd(){hud.textContent='剩余 '+Math.ceil(timeLeft)+' 秒　得分 '+score+'　第 '+qNum+'/'+qTotal+' 题　错误 '+errChars;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function reset(cat){
  pool=shuffle(CATS[cat].slice());
  qTotal=pool.length;qNum=1;
  cur=pool[0];idx=0;score=0;timeLeft=GAME_TIME;elapsed=0;okChars=0;errChars=0;over=false;
  render();hudUpd();
}
function render(){
  zh.textContent=cur[0];
  typedEl.textContent=cur[1].slice(0,idx);
  var m='';
  for(var i=idx;i<cur[1].length;i++)m+='\u2022';
  maskEl.textContent=m;
}
function nextWord(){
  pool.pop();qNum++;
  if(pool.length===0){win();return;}
  cur=pool[pool.length-1];idx=0;
  score+=30;timeLeft+=2;
  render();hudUpd();
}
function handleChar(ch){
  if(!running||over)return;
  if(ch==='\b')return;
  if(!/^[a-z]$/.test(ch.toLowerCase()))return;
  ch=ch.toLowerCase();
  if(ch===cur[1].charAt(idx)){
    idx++;okChars++;score+=8;
    if(idx>=cur[1].length){nextWord();return;}
    render();
  }else{
    errChars++;
    stage.classList.remove('err');
    void stage.offsetWidth;
    stage.classList.add('err');
  }
  hudUpd();
}
function win(){
  if(over)return;over=true;running=false;
  var wpm=Math.round((okChars/5)/(Math.max(elapsed,1)/60));
  ovT.textContent='全部译完！';
  ovX.textContent='得分 '+score+'\n正确 '+okChars+' 字　错误 '+errChars+' 字\n速度约 '+wpm+' WPM';
  ovBtn.classList.remove('hide');
  ov.classList.remove('hide');
}
function loop(ts){
  if(!running)return;
  var dt=Math.min(0.05,(ts-tPrev)/1000||0);tPrev=ts;
  elapsed+=dt;timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;hudUpd();over=true;running=false;
    ovT.textContent='时间到';
    ovX.textContent='得分 '+score+'\n正确 '+okChars+' 字　错误 '+errChars+' 字';
    ovBtn.classList.remove('hide');
    ov.classList.remove('hide');
    return;
  }
  hudUpd();
  raf=requestAnimationFrame(loop);
}
function start(cat){
  reset(cat);ov.classList.add('hide');running=true;tPrev=0;
  raf=requestAnimationFrame(loop);
  kc.focus();
}
function bindTyping(fn){
  kc.addEventListener('keydown',function(e){
    if(e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  window.addEventListener('keydown',function(e){
    if(document.activeElement!==kc&&e.key&&e.key.length===1){e.preventDefault();fn(e.key);}
    else if(document.activeElement!==kc&&e.key==='Backspace'){e.preventDefault();fn('\b');}
  });
  kc.addEventListener('input',function(e){
    if(kc.value===''){if(e.inputType==='deleteContentBackward')fn('\b');return;}
    var v=kc.value;kc.value='';
    for(var i=0;i<v.length;i++)fn(v.charAt(i));
  });
  stage.addEventListener('click',function(){kc.focus();});
  window.addEventListener('touchstart',function(){kc.focus();},{passive:true});
}
function showMenu(){
  ovT.textContent='选择词库主题';
  ovX.textContent='看中文，拼英文，60 秒内译出尽量多的单词。\n每答对一题 +30 分并奖励 2 秒。';
  cats.innerHTML='';
  var names=['动物','水果','科技','国家'];
  for(var i=0;i<names.length;i++){
    (function(name){
      var b=document.createElement('button');
      b.textContent=name;
      b.addEventListener('click',function(){start(name);});
      cats.appendChild(b);
    })(names[i]);
  }
  ovBtn.classList.add('hide');
  ov.classList.remove('hide');
}
bindTyping(handleChar);
ovBtn.addEventListener('click',function(){
  ovBtn.classList.add('hide');
  showMenu();
});
var names=Object.keys(CATS);
reset(names[0]);
showMenu();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双蛙镜像</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:10px}
.wrap{width:100%;max-width:460px}
h1{text-align:center;font-size:21px;margin:4px 0}
.tip{text-align:center;color:#8f97c0;font-size:12.5px;line-height:1.6;margin-bottom:8px}
.hud{display:flex;justify-content:center;gap:14px;color:#aab2dd;font-size:13px;margin-bottom:8px}
.hud b{color:#fbbf24}
canvas{display:block;width:100%;max-width:420px;margin:0 auto;background:#181d33;border:1px solid #262d52;border-radius:12px}
.pad{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.pbtn{width:60px;height:42px;border:none;border-radius:10px;background:#2a3157;color:#e8eaf6;font-size:18px;font-family:inherit;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pbtn:active{background:#4f6ef7}
.btnrow{display:flex;justify-content:center;gap:10px;margin-top:8px}
.btn{background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:rgba(7,9,22,.85);display:flex;align-items:center;justify-content:center;z-index:30}
.overlay.hide{display:none}
.ocard{background:#1c2240;border:1px solid #303a6e;border-radius:16px;padding:24px 30px;text-align:center;max-width:88vw}
.ocard h2{font-size:22px;margin-bottom:8px}
.ocard p{color:#aab2dd;font-size:14px;margin-bottom:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>双蛙镜像</h1>
<p class="tip">方向键 / WASD 同时指挥两只青蛙:左侧绿蛙听你的,右侧青蛙是"镜像体"——你按左它偏右,你按右它偏左!左右各管半场,两只都要活着跳进各自的巢穴;任何一只被撞,双双重来。</p>
<div class="hud"><span>得分 <b id="sS">0</b></span><span>生命 <b id="sL">3</b></span><span>轮次 <b id="sR">1</b></span></div>
<canvas id="cv" width="420" height="560"></canvas>
<div class="pad">
<button class="pbtn" data-k="left">←</button><button class="pbtn" data-k="up">↑</button><button class="pbtn" data-k="down">↓</button><button class="pbtn" data-k="right">→</button>
</div>
<div class="btnrow"><button class="btn" id="bR">重新开始</button></div>
</div>
<div class="overlay hide" id="ov"><div class="ocard"><h2 id="ovT"></h2><p id="ovP"></p><button class="btn" id="ovB">开始游戏</button></div></div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var CELL=40,COLS=10,ROWS=14,LOOP=540,OFF=60;
var sS=document.getElementById("sS"),sL=document.getElementById("sL"),sR=document.getElementById("sR");
var ov=document.getElementById("ov"),ovT=document.getElementById("ovT"),ovP=document.getElementById("ovP"),ovB=document.getElementById("ovB");
var CAR_COLORS=["#e05656","#e8a33d","#3fa66a","#4f8ef7","#b06ee0","#d05fa2","#4bb8c9"];
var lanes,frogs,score,lives,round,deadT,state,gt=0;
var moving=false,mt=0;
function rnd(a,b){return a+Math.random()*(b-a);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeLane(r){
  var dir=r%2===1?1:-1,speed=rnd(50,95)*(1+round*0.06),cars=[],x0=rnd(0,LOOP),i;
  for(i=0;i<3;i++)cars.push({x:(x0+i*185+rnd(-30,30)+LOOP)%LOOP,w:rnd(46,76),c:CAR_COLORS[(r+i)%CAR_COLORS.length]});
  return{r:r,dir:dir,speed:speed,cars:cars};
}
function buildLanes(){
  lanes=[];var r;
  for(r=1;r<=4;r++)lanes.push(makeLane(r));
  for(r=6;r<=9;r++)lanes.push(makeLane(r));
}
function resetFrogs(){
  frogs=[
    {c:1,r:13,x:1.5*CELL,y:13*CELL,bmin:0,bmax:4,nestC:1,home:false,color:"#5ad469",dark:"#2f7d3f",fc:1,fr:13,fx:1.5*CELL,fy:13*CELL,tc:1,tr:13},
    {c:8,r:13,x:8.5*CELL,y:13*CELL,bmin:5,bmax:9,nestC:8,home:false,color:"#4bb8c9",dark:"#2a6f80",fc:8,fr:13,fx:8.5*CELL,fy:13*CELL,tc:8,tr:13}
  ];
  moving=false;
}
function updHud(){sS.textContent=score;sL.textContent=lives;sR.textContent=round;}
function reset(){score=0;lives=3;round=1;deadT=0;buildLanes();resetFrogs();updHud();}
function show(t,p,btn){ovT.textContent=t;ovP.textContent=p;ovB.textContent=btn||"再来一局";ov.classList.remove("hide");}
function start(){reset();state="play";ov.classList.add("hide");}
function die(msg){
  deadT=0.8;moving=false;lives--;updHud();
  if(lives<=0){state="over";show("游戏结束",""+msg+" 最终得分 "+score+",坚持到第 "+round+" 轮。");}
}
function arrive(){
  var i,all=true;
  for(i=0;i<frogs.length;i++){
    var f=frogs[i];
    if(!f.home&&f.r===0&&f.c===f.nestC){f.home=true;score+=80;}
    if(!f.home)all=false;
  }
  if(all){
    score+=200+round*30;round++;
    buildLanes();resetFrogs();
  }
  updHud();
}
function hop(d){
  if(state!=="play"||moving||deadT>0)return;
  var i,changed=false;
  for(i=0;i<frogs.length;i++){
    var f=frogs[i];
    if(f.home)continue;
    var c=f.c,r=f.r;
    if(d==="up")r--;else if(d==="down")r++;
    else if(d==="left")c+=i===0?-1:1;
    else c+=i===0?1:-1;
    c=Math.max(f.bmin,Math.min(f.bmax,c));r=Math.max(0,Math.min(ROWS-1,r));
    f.fc=f.c;f.fr=f.r;f.fx=f.x;f.fy=f.y;
    f.tc=c;f.tr=r;
    if(c!==f.c||r!==f.r)changed=true;
  }
  if(!changed)return;
  for(i=0;i<frogs.length;i++){frogs[i].c=frogs[i].tc;frogs[i].r=frogs[i].tr;}
  mt=0;moving=true;
}
function update(dt){
  var i,i2,j,ln;
  if(state!=="play")return;
  if(deadT>0){deadT-=dt;if(deadT<=0)resetFrogs();return;}
  for(i=0;i<lanes.length;i++){
    ln=lanes[i];
    for(j=0;j<ln.cars.length;j++){
      var car=ln.cars[j],cx=car.x-OFF,cy=ln.r*CELL;
      for(i2=0;i2<frogs.length;i2++){
        var f=frogs[i2];
        if(f.home)continue;
        if(Math.abs(cx+car.w/2-f.x)<car.w/2+11&&f.y+34>cy+4&&f.y+8<cy+36){die("有青蛙被车撞了!");return;}
      }
    }
  }
  if(moving){
    mt+=dt/0.13;
    if(mt>=1){mt=1;moving=false;}
    for(i=0;i<frogs.length;i++){
      var f2=frogs[i];
      f2.x=f2.fx+((f2.tc+0.5)*CELL-f2.fx)*mt;
      f2.y=f2.fy+(f2.tr*CELL-f2.fy)*mt;
      if(!moving){
        f2.x=(f2.c+0.5)*CELL;f2.y=f2.r*CELL;
      }
    }
    if(!moving)arrive();
  }
}
function drawFrog(f){
  var x=f.x,y=f.y;
  ctx.fillStyle=f.color;
  ctx.beginPath();ctx.ellipse(x,y+22,12,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=f.dark;
  ctx.beginPath();ctx.arc(x-6,y+11,5,0,Math.PI*2);ctx.arc(x+6,y+11,5,0,Math.PI*2);ctx.fill();
}
function drawNest(cx,ci){
  var x=(cx+0.5)*CELL,col=ci===0?"#5ad469":"#4bb8c9";
  ctx.fillStyle="#3b4a2e";
  ctx.beginPath();ctx.ellipse(x,20,19,13,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(x,20,19,13,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#141b12";
  ctx.beginPath();ctx.ellipse(x,21,10,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;ctx.font="10px system-ui";ctx.textAlign="center";
  ctx.fillText(ci===0?"绿巢":"青巢",x,40);
}
function draw(){
  var r,i,j,ln;
  for(r=0;r<ROWS;r++){
    ctx.fillStyle=(r===0||r===5||r>=10)?"#1e3b26":"#232741";
    ctx.fillRect(0,r*CELL,420,CELL);
  }
  ctx.strokeStyle="#3a4470";ctx.lineWidth=2;ctx.setLineDash([14,18]);
  for(i=0;i<lanes.length;i++){ln=lanes[i];ctx.beginPath();ctx.moveTo(0,ln.r*CELL+20);ctx.lineTo(420,ln.r*CELL+20);ctx.stroke();}
  ctx.setLineDash([]);
  ctx.strokeStyle="rgba(79,110,247,.35)";ctx.lineWidth=1;ctx.setLineDash([4,6]);
  ctx.beginPath();ctx.moveTo(5*CELL,0);ctx.lineTo(5*CELL,560);ctx.stroke();
  ctx.setLineDash([]);
  for(i=0;i<lanes.length;i++){
    ln=lanes[i];var cy=ln.r*CELL;
    for(j=0;j<ln.cars.length;j++){
      var car=ln.cars[j],cx=car.x-OFF;
      if(cx>420||cx+car.w<0)continue;
      ctx.fillStyle=car.c;rr(cx+2,cy+6,car.w-4,28,7);ctx.fill();
      ctx.fillStyle="rgba(20,24,48,.55)";rr(cx+car.w/2-7,cy+11,14,8,3);ctx.fill();
    }
  }
  drawNest(1,0);drawNest(8,1);
  for(i=0;i<frogs.length;i++)if(frogs[i].home)drawFrog(frogs[i]);
  for(i=0;i<frogs.length;i++)if(!frogs[i].home&&(deadT<=0||Math.floor(gt*12)%2===0))drawFrog(frogs[i]);
  if(state==="ready"){
    ctx.fillStyle="rgba(7,9,22,.6)";ctx.fillRect(0,200,420,120);
    ctx.fillStyle="#e8eaf6";ctx.font="bold 21px system-ui";ctx.textAlign="center";
    ctx.fillText("点击「开始游戏」出发",210,250);
    ctx.font="13px system-ui";ctx.fillStyle="#aab2dd";
    ctx.fillText("一只听令,一只镜像 · 两巢满员才过关",210,280);
  }
}
var last=0;
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000);last=t;
  if(!(dt>0))dt=0.016;
  gt+=dt;update(dt);draw();
  requestAnimationFrame(loop);
}
var KM={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
window.addEventListener("keydown",function(e){var k=KM[e.key];if(k){e.preventDefault();hop(k);}});
var btns=document.querySelectorAll(".pbtn"),bi;
for(bi=0;bi<btns.length;bi++){
  (function(b){b.addEventListener("pointerdown",function(e){e.preventDefault();hop(b.getAttribute("data-k"));});})(btns[bi]);
}
document.getElementById("bR").addEventListener("click",start);
ovB.addEventListener("click",start);
reset();state="ready";
show("双蛙镜像","双份的青蛙,双倍的指挥!你的每次按键同时控制两只青蛙,右侧青蛙却左右颠倒:它往你想的反方向跳。带它们穿过两条马路,各自跳进左绿右青两个巢穴;任何一只被撞,两只一起回到起点。","开始游戏");
requestAnimationFrame(loop);
</script>
</body>
</html>

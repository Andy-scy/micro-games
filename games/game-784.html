<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>净水钓手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f1220;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px;user-select:none}
h1{font-size:21px;color:#7fd4ff;margin:2px 0}
.tip{font-size:13px;color:#9aa3b5;text-align:center;max-width:520px;line-height:1.6;margin-bottom:6px}
#hud{display:flex;gap:16px;font-size:15px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#hud b{color:#ffd75e}
canvas{border-radius:14px;max-width:96vw;touch-action:none;display:block}
#ov{position:fixed;inset:0;background:rgba(6,8,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:9}
#ov h2{font-size:26px;color:#ffd75e}
#ov p{color:#c8cfdd;font-size:15px;max-width:380px;line-height:1.8}
#ov button{background:linear-gradient(180deg,#5db8ff,#2f8fe0);color:#04101f;border:0;border-radius:12px;padding:12px 34px;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<h1>净水钓手</h1>
<p class="tip">上下移动鱼钩(方向键/W S,或手指拖动)接住游过的鱼;旧靴、破罐、废轮胎会缠坏鱼钩,扣一条命!60 秒 400 分。</p>
<div id="hud"><span>得分 <b id="s1">0</b></span><span>时间 <b id="s2">60</b> 秒</span><span>目标 <b>400</b> 分</span></div>
<canvas id="cv" width="480" height="560"></canvas>
<div id="ov"><h2 id="ot">净水钓手</h2><p id="op">湖里漂着不少垃圾,只有鱼能碰!<br>移动鱼钩主动截住游鱼得分,<br>碰到垃圾扣一命,三条命用完就收场。</p><button id="ob">开始清钓</button></div>
<script>
(function(){
var cv=document.getElementById('cv'),X=cv.getContext('2d');
var ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),ob=document.getElementById('ob');
var eS=document.getElementById('s1'),eT=document.getElementById('s2');
var W=cv.width,H=cv.height,WT=60;
var state='ready',score=0,tl=60,hearts=3,msg='',inv=0;
var hy=300,ty=300, objs=[],spawnT=0,pops=[],bubbles=[];
var kinds=[['小银鱼',20,'#b8c9d9',0.5],['罗非鱼',40,'#7fb2d9',0.35],['红鲤',80,'#e86a5f',0.15]];
var trash=['旧靴','破罐','废轮胎'];
var keys={};
function rnd(a,b){return a+Math.random()*(b-a)}
function spawn(){
  var o;
  if(Math.random()<0.24){
    o={kind:trash[Math.floor(Math.random()*3)],fish:false,v:0,x:W+40,y:rnd(WT+50,H-30),vx:rnd(55,95),ph:Math.random()*6};
  }else{
    var r=Math.random(),c=0,i,sel=kinds[0];
    for(i=0;i<kinds.length;i++){c+=kinds[i][3];if(r<=c){sel=kinds[i];break}}
    o={kind:sel[0],fish:true,v:sel[1],col:sel[2],x:W+40,y:rnd(WT+50,H-30),vx:rnd(95,175),ph:Math.random()*6};
  }
  objs.push(o);
}
function finish(win){
  state='over';ob.textContent='再来一局';
  ot.textContent=win?'湖清水净!':'鱼钩报废了…';
  op.innerHTML='本次得分 <b style="color:#ffd75e">'+score+'</b> / 目标 400 分<br>'+(win?'鱼获满篓,湖水也清亮了!':'垃圾缠坏了鱼钩,下回眼疾手快一点。');
  ov.classList.remove('hide');
}
function start(){
  score=0;tl=60;hearts=3;msg='';inv=0;objs=[];pops=[];spawnT=0;hy=300;ty=300;keys={};
  state='play';ov.classList.add('hide');
}
function update(dt){
  var i;
  if(inv>0)inv-=dt;
  for(i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>0.8)pops.splice(i,1)}
  if(Math.random()<dt*2)bubbles.push({x:rnd(20,W-20),y:H+10,s:rnd(2,5),v:rnd(30,60)});
  for(i=bubbles.length-1;i>=0;i--){bubbles[i].y-=bubbles[i].v*dt;if(bubbles[i].y<WT)bubbles.splice(i,1)}
  if(state!=='play')return;
  tl-=dt;if(tl<=0){tl=0;finish(score>=400);return}
  var mv=0;
  if(keys.up)mv-=1;if(keys.down)mv+=1;
  ty=Math.max(WT+40,Math.min(H-20,ty+mv*240*dt));
  hy+=(ty-hy)*Math.min(1,dt*10);
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=rnd(0.55,0.95)}
  var t=Date.now()*0.001;
  for(i=objs.length-1;i>=0;i--){
    var o=objs[i];
    o.x-=o.vx*dt;
    var oy=o.y+Math.sin(t*3+o.ph)*8;
    if(o.x<-50){objs.splice(i,1);continue}
    if(Math.abs(o.x-90)<32&&Math.abs(oy-hy)<26){
      if(o.fish){
        score+=o.v;pops.push({x:o.x,y:oy,txt:'+'+o.v,t:0});objs.splice(i,1);
      }else if(inv<=0){
        hearts--;inv=1.2;msg='垃圾缠住鱼钩!剩 '+hearts+' 条命';
        pops.push({x:o.x,y:oy,txt:'咔!',t:0});
        objs.splice(i,1);
        if(hearts<=0){finish(false);return}
      }
    }
  }
}
function drawHeart(x,y,on){
  X.fillStyle=on?'#ff6b7a':'rgba(90,100,130,.4)';
  X.beginPath();
  X.moveTo(x,y+5);
  X.bezierCurveTo(x,y-1,x-8,y-1,x-8,y+5);
  X.bezierCurveTo(x-8,y+10,x,y+13,x,y+18);
  X.bezierCurveTo(x,y+13,x+8,y+10,x+8,y+5);
  X.bezierCurveTo(x+8,y-1,x,y-1,x,y+5);
  X.fill();
}
function draw(){
  var g=X.createLinearGradient(0,0,0,WT);g.addColorStop(0,'#151c36');g.addColorStop(1,'#232a4d');
  X.fillStyle=g;X.fillRect(0,0,W,WT);
  var g2=X.createLinearGradient(0,WT,0,H);g2.addColorStop(0,'#175a54');g2.addColorStop(1,'#0a2436');
  X.fillStyle=g2;X.fillRect(0,WT,W,H-WT);
  var i,t=Date.now()*0.001;
  for(i=0;i<bubbles.length;i++){
    X.strokeStyle='rgba(180,230,230,.25)';X.lineWidth=1.5;
    X.beginPath();X.arc(bubbles[i].x,bubbles[i].y,bubbles[i].s,0,7);X.stroke();
  }
  for(i=0;i<objs.length;i++){
    var o=objs[i],oy=o.y+Math.sin(t*3+o.ph)*8;
    if(o.fish){
      X.fillStyle=o.col;
      X.beginPath();X.ellipse(o.x,oy,18,9,0,0,7);X.fill();
      X.beginPath();X.moveTo(o.x-15,oy);X.lineTo(o.x-27,oy-7);X.lineTo(o.x-27,oy+7);X.closePath();X.fill();
      X.fillStyle='#0f1220';X.beginPath();X.arc(o.x+8,oy-2,1.8,0,7);X.fill();
    }else if(o.kind==='旧靴'){
      X.fillStyle='#6a4a2e';X.fillRect(o.x-10,oy-14,18,24);
      X.fillStyle='#4a3220';X.fillRect(o.x-14,oy+6,26,7);
    }else if(o.kind==='破罐'){
      X.fillStyle='#8a8f9a';X.fillRect(o.x-9,oy-12,18,24);
      X.fillStyle='#c0563a';X.fillRect(o.x-9,oy-4,18,5);
    }else{
      X.fillStyle='#2c3038';X.beginPath();X.arc(o.x,oy,15,0,7);X.fill();
      X.fillStyle='#12151c';X.beginPath();X.arc(o.x,oy,7,0,7);X.fill();
    }
  }
  X.strokeStyle=inv>0?'rgba(255,107,122,'+(0.5+0.5*Math.sin(t*20)).toFixed(2)+')':'rgba(230,238,246,.8)';
  X.lineWidth=2;
  X.beginPath();X.moveTo(90,0);X.lineTo(90,hy-14);X.stroke();
  X.beginPath();X.arc(90,hy-6,8,Math.PI*0.15,Math.PI*1.15);X.stroke();
  X.fillStyle='#ffd75e';X.beginPath();X.arc(90,hy-16,4,0,7);X.fill();
  for(i=0;i<pops.length;i++){
    var p=pops[i];
    X.globalAlpha=1-p.t/0.8;
    X.fillStyle='#ffd75e';X.font='bold 15px system-ui';X.textAlign='center';
    X.fillText(p.txt,p.x,p.y-20-p.t*30);
    X.globalAlpha=1;
  }
  for(i=0;i<3;i++)drawHeart(400+i*22,18,i<hearts);
  X.fillStyle='#ffe9a3';X.font='bold 15px system-ui';X.textAlign='center';X.fillText(msg,W/2,30);
  X.fillStyle='rgba(154,163,181,.85)';X.font='12px system-ui';
  X.fillText('↑↓ / W S / 拖动 移动鱼钩',W/2,H-12);
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp'||e.key==='w'){keys.up=true;e.preventDefault()}
  if(e.key==='ArrowDown'||e.key==='s'){keys.down=true;e.preventDefault()}
  if((e.key===' '||e.key==='Enter')&&state!=='play'){e.preventDefault();start()}
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowUp'||e.key==='w')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
});
function setTy(e){
  var r=cv.getBoundingClientRect();
  var my=(e.clientY-r.top)*(H/r.height);
  ty=Math.max(WT+40,Math.min(H-20,my));
}
cv.addEventListener('pointerdown',function(e){if(state==='play')setTy(e)});
cv.addEventListener('pointermove',function(e){if(state==='play'&&e.buttons)setTy(e)});
ob.addEventListener('click',start);
var last=0;
function loop(ts){
  var dt=(ts-last)/1000;last=ts;
  if(!(dt>0)||dt>0.05)dt=0.016;
  update(dt);draw();
  eS.textContent=score;eT.textContent=Math.ceil(tl);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字坠合</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:#181c30;border-radius:16px;padding:14px 14px 16px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:20px;color:#5aa9e6;text-align:center;letter-spacing:3px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:12px;margin-bottom:8px;line-height:1.7}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#c7cbe8;margin-bottom:8px}
.hud b{color:#5aa9e6;font-size:15px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;background:#0b0e1a;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,10,22,.92);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.overlay.hide{display:none}
.overlay h2{font-size:24px;color:#5aa9e6}
.overlay p{color:#aab0d0;font-size:13px;line-height:1.8;white-space:pre-line}
.overlay .big{font-size:19px;color:#fbbf24;font-weight:700}
.overlay button{margin-top:4px;background:#5aa9e6;color:#06263f;border:none;border-radius:10px;padding:10px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.overlay button:active{transform:scale(.96)}
.pads{display:flex;gap:7px;margin-top:10px}
.pads button{flex:1;background:#232849;color:#c7cbe8;border:1px solid #343b6e;border-radius:10px;padding:13px 0;font-size:16px;cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none}
.pads button:active{background:#343b6e}
</style>
</head>
<body>
<div class="card">
  <h1>数字坠合</h1>
  <p class="hint">◀ ▶ 选列 · 投放数字砖<br>上下贴合同数即合并,上方砖块连锁坠落再合并</p>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>下一个 <b id="next">·</b></span>
    <span>最高 <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="320" height="400"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">数字坠合</h2>
      <p id="ovP">数字砖从天而降,同数相贴自动合一,连锁越多分越高!</p>
      <div class="big" id="ovS"></div>
      <button id="btn">开 始</button>
    </div>
  </div>
  <div class="pads">
    <button id="pL">◀</button>
    <button id="pD">投 放</button>
    <button id="pR">▶</button>
  </div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var COLS=6,ROWS=8,CELL=46,BX=22,BY=8;
var CCOL=['','#6b7bb8','#5aa9e6','#4dd0c4','#7ed957','#f9d71c','#ff8c42','#ff5d5d','#e56399','#a06cd5','#ffd166','#f28482'];
var grid=[],col=2,cur=1,nxt=1,score=0,best=0,state='ready',flashes=[],tG=0;
function val(e){return Math.pow(2,e);}
function newGrid(){var g=[],r,c;for(r=0;r<ROWS;r++){g.push([]);for(c=0;c<COLS;c++)g[r].push(0);}return g;}
function randE(){return Math.random()<0.72?1:2;}
function addScore(n){score+=n;if(score>best)best=score;$('score').textContent=score;$('best').textContent=best;}
function flash(r,c,e){flashes.push({r:r,c:c,t:0,e:e});}
function lowest(c){var r;for(r=ROWS-1;r>=0;r--)if(grid[r][c]===0)return r;return -1;}
function compact(){
  var r,c,stack,i;
  for(c=0;c<COLS;c++){
    stack=[];
    for(r=ROWS-1;r>=0;r--)if(grid[r][c]>0)stack.push(grid[r][c]);
    for(r=ROWS-1,i=0;r>=0;r--,i++)grid[r][c]=(i<stack.length)?stack[i]:0;
  }
}
function settle(){
  var guard=0,found=true,merges=0;
  while(found&&guard<40){
    guard++;found=false;compact();
    var r,c;
    for(c=0;c<COLS;c++){
      for(r=ROWS-1;r>0;r--){
        if(grid[r][c]>0&&grid[r][c]===grid[r-1][c]){
          grid[r][c]++;grid[r-1][c]=0;
          addScore(val(grid[r][c]));flash(r,c,grid[r][c]);merges++;
          found=true;
        }
      }
    }
  }
}
function doDrop(){
  if(state!=='play')return;
  var r=lowest(col);
  if(r<0){finish();return;}
  grid[r][col]=cur;flash(r,col,cur);
  cur=nxt;nxt=randE();$('next').textContent=String(val(nxt));
  settle();
}
function finish(){
  state='over';
  $('ovT').textContent='游戏结束';
  $('ovP').textContent='数字砖堆到了塔顶!';
  $('ovS').textContent='得分 '+score;
  $('btn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function start(){
  grid=newGrid();score=0;col=2;cur=randE();nxt=randE();flashes=[];
  $('score').textContent='0';$('next').textContent=String(val(nxt));$('best').textContent=best;
  $('ov').classList.add('hide');state='play';
}
function cellAt(px,py){
  var c=Math.floor((px-BX)/CELL),r=Math.floor((py-BY)/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS)return null;
  return {r:r,c:c};
}
cv.addEventListener('mousedown',function(e){
  if(state!=='play')return;
  var rc=cv.getBoundingClientRect();
  var p={x:(e.clientX-rc.left)*320/rc.width,y:(e.clientY-rc.top)*400/rc.height};
  var cc=cellAt(p.x,p.y);if(cc)col=cc.c;
  doDrop();
});
cv.addEventListener('touchstart',function(e){
  if(state!=='play')return;
  var t=e.touches[0],rc=cv.getBoundingClientRect();
  var p={x:(t.clientX-rc.left)*320/rc.width,y:(t.clientY-rc.top)*400/rc.height};
  var cc=cellAt(p.x,p.y);if(cc)col=cc.c;
  doDrop();e.preventDefault();
},{passive:false});
window.addEventListener('keydown',function(e){
  if(state!=='play')return;
  if(e.keyCode===37){col=(col+COLS-1)%COLS;e.preventDefault();}
  else if(e.keyCode===39){col=(col+1)%COLS;e.preventDefault();}
  else if(e.keyCode===32||e.keyCode===40){doDrop();e.preventDefault();}
});
$('pL').addEventListener('click',function(){if(state==='play')col=(col+COLS-1)%COLS;});
$('pR').addEventListener('click',function(){if(state==='play')col=(col+1)%COLS;});
$('pD').addEventListener('click',doDrop);
function drawCell(px,py,e,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=CCOL[Math.min(e,11)];
  var x=BX+px,y=BY+py;
  roundRect(x+3,y+3,CELL-6,CELL-6,8);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.font='700 '+Math.min(20,10+e*2)+'px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(val(e)),x+CELL/2,y+CELL/2+1);
  ctx.restore();
}
function c2x(c){return c*CELL;}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,320,400);
  ctx.fillStyle='#0b0e1a';ctx.fillRect(0,0,320,400);
  var i,r,c;
  ctx.strokeStyle='rgba(255,255,255,.06)';
  for(i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(BX+i*CELL,BY);ctx.lineTo(BX+i*CELL,BY+ROWS*CELL);ctx.stroke();}
  for(i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(BX,BY+i*CELL);ctx.lineTo(BX+COLS*CELL,BY+i*CELL);ctx.stroke();}
  if(state==='play'){
    ctx.fillStyle='rgba(90,169,230,.15)';
    ctx.fillRect(BX+col*CELL+2,BY,CELL-4,ROWS*CELL);
  }
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(grid.length&&grid[r][c]>0)drawCell(c2x(c),r*CELL,grid[r][c],1);
  if(state==='play'){
    var r2=lowest(col);
    var gy=(r2<0)?0:r2*CELL;
    ctx.save();ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,.18)';
    ctx.beginPath();ctx.moveTo(BX+col*CELL+CELL/2,BY+14);ctx.lineTo(BX+col*CELL+CELL/2,BY+gy);ctx.stroke();ctx.restore();
    drawCell(c2x(col),gy-CELL-2,cur,0.85);
  }
  for(i=0;i<flashes.length;i++){
    var f=flashes[i],pr=f.t/0.3;
    if(pr<1){
      ctx.save();ctx.globalAlpha=1-pr;
      ctx.strokeStyle='#fff';ctx.lineWidth=3;
      roundRect(BX+f.c*CELL+3-pr*6,BY+f.r*CELL+3-pr*6,CELL-6+pr*12,CELL-6+pr*12,8);ctx.stroke();
      ctx.restore();
    }
  }
}
$('btn').addEventListener('click',start);
var last=0;
function loop(t){
  var dt=Math.min((t-last)/1000,0.05);last=t;tG+=dt;
  var i;
  for(i=0;i<flashes.length;i++)flashes[i].t+=dt;
  var k=[];
  for(i=0;i<flashes.length;i++)if(flashes[i].t<0.3)k.push(flashes[i]);
  flashes=k;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>

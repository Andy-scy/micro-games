<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>断链续记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1220;color:#e8eaf6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:#181c30;border-radius:16px;padding:16px 16px 20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
h1{font-size:22px;color:#d9f99d;text-align:center;letter-spacing:4px;margin-bottom:4px}
.hint{text-align:center;color:#8b90b0;font-size:13px;margin-bottom:10px;line-height:1.7}
.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:#c7cbe8;margin-bottom:10px}
.hud b{color:#d9f99d;font-size:16px}
.gbtn{background:#25370c;color:#d9f99d;border:1px solid #d9f99d;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.gbtn:active{transform:scale(.95)}
.msg{color:#d9f99d;font-size:14px;min-height:20px;text-align:center;margin-bottom:8px}
.chain{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:380px;margin:0 auto 12px;min-height:30px}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid #2a3258;background:#141830;transition:background .2s,box-shadow .2s}
.dot.c0{background:#ef4444;border-color:#fecaca;box-shadow:0 0 10px rgba(239,68,68,.7)}
.dot.c1{background:#22c55e;border-color:#bbf7d0;box-shadow:0 0 10px rgba(34,197,94,.7)}
.dot.c2{background:#3b82f6;border-color:#bfdbfe;box-shadow:0 0 10px rgba(59,130,246,.7)}
.dot.c3{background:#eab308;border-color:#fef08a;box-shadow:0 0 10px rgba(234,179,8,.7)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto;touch-action:manipulation}
.pad{aspect-ratio:1/1;border-radius:16px;cursor:pointer;transition:transform .06s,box-shadow .12s,background .12s;user-select:none;-webkit-user-select:none}
.pad:active{transform:scale(.94)}
.p0{background:#0d2f1a;border:2px solid #166534}.p0.lit{background:#22c55e;box-shadow:0 0 26px rgba(34,197,94,.85)}
.p1{background:#3d1114;border:2px solid #991b1b}.p1.lit{background:#ef4444;box-shadow:0 0 26px rgba(239,68,68,.85)}
.p2{background:#39300a;border:2px solid #a16207}.p2.lit{background:#eab308;box-shadow:0 0 26px rgba(234,179,8,.85)}
.p3{background:#122a52;border:2px solid #1d4ed8}.p3.lit{background:#3b82f6;box-shadow:0 0 26px rgba(59,130,246,.85)}
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.9);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.hide{display:none}
.panel{background:#181c30;border:1px solid #2a3258;border-radius:16px;padding:26px 24px;max-width:400px;width:100%;text-align:center}
.panel h2{font-size:24px;color:#d9f99d;margin-bottom:10px}
.panel p{color:#aab0d0;font-size:14px;line-height:1.8;white-space:pre-line;margin-bottom:8px}
.panel .big{font-size:17px;color:#fbbf24;font-weight:700}
.panel button{margin-top:10px;background:#d9f99d;color:#25370c;border:none;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.panel button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <h1>断链续记</h1>
  <p class="hint">无回放链式记忆:每轮只演示「最新的一步」,之前的步骤不再重播!你要凭记忆把从第 1 步到现在的整条链一口气接完。链条上方的彩点会记录你已接上的每一步。</p>
  <div class="hud">
    <span>链长 <b id="lv">0</b></span>
    <span>本轮目标 <b id="len">0</b> 步</span>
    <span>最高纪录 <b id="best">0</b></span>
    <button class="gbtn" id="btnNew">重开一局</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="chain" id="chain"></div>
  <div class="pads" id="pads">
    <div class="pad p0"></div>
    <div class="pad p1"></div>
    <div class="pad p2"></div>
    <div class="pad p3"></div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2 id="ovTitle">断链续记</h2>
    <p id="ovDesc">别人家的 Simon 每轮都重播整段,这里绝不重播!只闪一次新步骤,整条链全靠脑内存货。从第 5 轮开始才是真正的炼狱。</p>
    <p class="big" id="ovScore" style="display:none"></p>
    <button id="btnGo">开始接链</button>
  </div>
</div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function loadNum(k){try{var v=parseInt(localStorage.getItem(k)||"",10);return isNaN(v)?0:v;}catch(e){return 0;}}
function saveNum(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
var KEY="mg360_best",FREQ=[329.63,261.63,220,164.81],NEW_MS=650;
var seq=[],pos=0,level=0,state="menu",timers=[],best=loadNum(KEY),audio=null;
var pads=[],chainEl=$("chain"),ov=$("ov"),ovTitle=$("ovTitle"),ovDesc=$("ovDesc"),ovScore=$("ovScore"),btnGo=$("btnGo");
var elLv=$("lv"),elLen=$("len"),elBest=$("best"),elMsg=$("msg"),btnNew=$("btnNew");
function initAudio(){if(audio)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}catch(e){}}
function tone(f,d,v,type){if(!audio)return;try{var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;d=d||0.3;v=v==null?0.15:v;o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];}
(function build(){var box=$("pads"),list=box.querySelectorAll(".pad");for(var i=0;i<list.length;i++){pads.push(list[i]);list[i].dataset.i=String(i);}})();
function flash(i,ms){var el=pads[i];el.classList.add("lit");tone(FREQ[i]);timers.push(setTimeout(function(){el.classList.remove("lit");},ms||300));}
function clearLit(){for(var i=0;i<4;i++)pads[i].classList.remove("lit");}
function rnd(){var n;do{n=(Math.random()*4)|0;}while(seq.length&&n===seq[seq.length-1]);return n;}
function renderChain(){var h="",i;
for(i=0;i<seq.length;i++)h+='<span class="dot '+(i<pos?("c"+seq[i]):"")+'"></span>';
chainEl.innerHTML=h;}
function updateHud(){elLv.textContent=level;elLen.textContent=seq.length;elBest.textContent=best;}
function setMsg(s){elMsg.textContent=s;}
function playNew(){state="show";
if(seq.length===1){setMsg("第 1 步,也是全部…");}
else{setMsg("只演示新步骤!之前的全凭记忆");}
timers.push(setTimeout(function(){flash(seq[seq.length-1],NEW_MS);
timers.push(setTimeout(function(){state="input";pos=0;renderChain();
setMsg("从第 1 步开始,接完整条链!");},NEW_MS+250));},450));}
function nextRound(){seq.push(rnd());updateHud();playNew();}
function newGame(){clearTimers();clearLit();seq=[];pos=0;level=0;state="wait";chainEl.innerHTML="";setMsg("");updateHud();timers.push(setTimeout(nextRound,650));}
function winStep(){level++;state="wait";setMsg("链条续上!只闪新一步…");updateHud();timers.push(setTimeout(nextRound,750));}
function fail(){clearTimers();clearLit();state="over";tone(92,0.55,0.2,"sawtooth");if(level>best){best=level;saveNum(KEY,best);}
ovTitle.textContent="链条断裂";
ovDesc.textContent="无回放模式下,你在第 "+(pos+1)+" 步接错(整链长 "+seq.length+")。诀窍:把整条链编成一个固定节奏,每一轮只在结尾挂上新的音符。";
ovScore.style.display="block";ovScore.textContent="成功续链 "+level+" 轮";btnGo.textContent="再来一局";ov.classList.remove("hide");updateHud();}
function press(i){if(state!=="input")return;flash(i,200);
if(seq[pos]===i){pos++;renderChain();
if(pos>=seq.length)winStep();}
else fail();}
function start(){initAudio();newGame();ov.classList.add("hide");}
$("pads").addEventListener("click",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.i!=null)press(parseInt(t.dataset.i,10));});
document.addEventListener("keydown",function(e){
if(state==="menu"||state==="over"){if(e.key==="Enter"||e.key===" "){e.preventDefault();start();}return;}
var k=e.key;if(k==="1")press(0);else if(k==="2")press(1);else if(k==="3")press(2);else if(k==="4")press(3);});
btnGo.addEventListener("click",start);
btnNew.addEventListener("click",function(){if(state==="menu")return;newGame();setMsg("已重开一局");});
updateHud();
})();
</script>
</body>
</html>
